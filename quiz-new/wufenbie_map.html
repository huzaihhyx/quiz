<text x="860.0" y="76" font-size="13.5" fill="#8a8ab0" font-weight="normal" text-anchor="middle">基于《无分别五门一体总图 v7》（2026-09-12 两账汇合版）· 裁#001~013 正字体系 · 2026-09-12 制</text>

<text x="40" y="155" font-size="16" fill="#e8ffe8" font-weight="bold" text-anchor="start">走进黑暗时空 · 看见并表达 · 陪小婴儿 · 知无分别</text>
<text x="40" y="176" font-size="12" fill="#9ec9a0" font-weight="normal" text-anchor="start">创伤凝成黑洞时空把人时时吸回（回归）——疗愈不是消灭黑暗，是回到奇点看见小婴儿</text>
<rect x="600" y="100" width="540" height="88" rx="10" fill="#1c1830" stroke="#a78bfa" stroke-width="1.5"/>

<text x="50" y="927" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">②看见并表达＝峰值泄压（光一直照着，调小亮度）</text>
<text x="50" y="946" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">③纯粹痛苦＝「没有反制的痛苦」（老伙伴最后练）</text>

<text x="1645" y="366" font-size="13" fill="#c09a7e" font-weight="bold" text-anchor="middle">要爱线</text>

<text x="1194" y="406" font-size="15" fill="#e8e8f8" font-weight="bold" text-anchor="start">拯救</text>

<text x="1194" y="525" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">存在性自罪＋恨的压制</text>

<text x="1454" y="506" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">都是你的错（阴归）</text>
<text x="1454" y="525" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">核心信念：对方来伤害我</text>
<rect x="1440" y="540" width="240" height="66" rx="10" fill="#262648" stroke="#9a4a4a" stroke-width="1.5"/>
<text x="1454" y="566" font-size="15" fill="#e8e8f8" font-weight="bold" text-anchor="start">报复</text>
<text x="1454" y="586" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">恨向外：攻击</text>
<text x="1454" y="605" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">小婴儿的报复＝阴归＝自爱</text>
<rect x="1180" y="620" width="500" height="58" rx="10" fill="#262648" stroke="#6a6a8a" stroke-width="1.5"/>
<text x="1194" y="646" font-size="16" fill="#b0b0e0" font-weight="bold" text-anchor="start">疏远 ＝ 万能情节</text>
<text x="1194" y="666" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">「惹不起我躲得起，躲起来你也不受伤我也不受伤」——毁灭报复太难受了怎么办：疏远</text>
<rect x="1180" y="690" width="500" height="72" rx="10" fill="#262648" stroke="#5a7a9a" stroke-width="1.5"/>
<text x="1194" y="716" font-size="16" fill="#a0c0e0" font-weight="bold" text-anchor="start">三生本能 × 死本能</text>
<text x="1194" y="736" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">初心之爱 → 共命情结 → 拯救情结（共命第一，拯救第二）</text>
<text x="1194" y="755" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">初心之爱受阻 → 恨 → 毁灭/报复（恨向外＝报复，向内＝毁灭）</text>
<rect x="1180" y="774" width="500" height="84" rx="10" fill="#262648" stroke="#6a5a8a" stroke-width="1.5"/>
<text x="1194" y="800" font-size="16" fill="#c0a0e0" font-weight="bold" text-anchor="start">一体两坐标（八维 ↔ 八情）</text>
<text x="1194" y="820" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">放大镜朝内看＝八维：你个人的回归路线图</text>
<text x="1194" y="839" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">镜头拉远看关系场＝八情：全人类共有的情结清单</text>
<text x="1194" y="858" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">同一个回归现象，两个读法——分层并存</text>
<rect x="1180" y="870" width="500" height="96" rx="10" fill="#262648" stroke="#4a6a5a" stroke-width="1.5"/>
<text x="1194" y="896" font-size="16" fill="#a0d8b0" font-weight="bold" text-anchor="start">边角金句</text>
<text x="1194" y="916" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">「吵架也是爱——没有链接感才是彻底断裂＝空杀」</text>
<text x="1194" y="935" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">「毁灭其实是对卑罪的一个反制」</text>
<text x="1194" y="954" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">「索爱无处不在——我跟扫地机器人抬杠」</text>
<text x="1194" y="973" font-size="12.5" fill="#b8b8d0" font-weight="normal" text-anchor="start">「身体是无分别爱着我们的妈妈」</text>
<rect x="20" y="1120" width="1680" height="178" rx="10" fill="#1e1e38" stroke="#3a3a5e" stroke-width="1.5"/>
<text x="40" y="1148" font-size="16" fill="#f0c060" font-weight="bold" text-anchor="start">实操枢纽</text>
<rect x="40" y="1162" width="400" height="122" rx="10" fill="#262648" stroke="#a06a3a" stroke-width="1.5"/>
<text x="54" y="1188" font-size="16" fill="#f0b080" font-weight="bold" text-anchor="start">判杀三步（撞词仲裁器）</text>
<text x="54" y="1208" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">① 定时空：表达到底层，看回归到哪个时空</text>
<text x="54" y="1227" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">② 定奇点：抓奇点事件性质——不走感受</text>
<text x="54" y="1246" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">    （感受是浮表，奇点才是锚）</text>
<text x="54" y="1265" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">③ 定主杀：一个奇点事件只有一个主杀</text>
<text x="54" y="1284" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">    肉体死亡危险=追杀／看见但否定=绝杀／没看见被扔=空杀</text>
<rect x="460" y="1162" width="380" height="122" rx="10" fill="#262648" stroke="#3a8a6a" stroke-width="1.5"/>
<text x="474" y="1188" font-size="16" fill="#80e0b0" font-weight="bold" text-anchor="start">看见即疗愈（判据）</text>
<text x="474" y="1208" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">道理看见 ＋ 情感深深共鸣</text>
<text x="474" y="1227" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">——两样缺一不可</text>
<text x="474" y="1246" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">只有道理＝头脑理解（很浅）</text>
<text x="474" y="1265" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">只有哭＝情绪宣泄（不知哪个点）</text>
<text x="474" y="1284" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">功课真伪的验收＝现实道场</text>
<rect x="860" y="1162" width="380" height="122" rx="10" fill="#262648" stroke="#3a6a8a" stroke-width="1.5"/>
<text x="874" y="1188" font-size="16" fill="#80b0e0" font-weight="bold" text-anchor="start">场域五个不</text>
<text x="874" y="1208" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">不评判 · 不否定 · 不评价</text>
<text x="874" y="1227" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">不指责 · 不议论</text>
<text x="874" y="1246" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">（对别人不起，对自己也不起；场域＋生活）</text>
<text x="874" y="1265" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">配套基本功：随时向内觉知——</text>
<text x="874" y="1284" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">「我怎么了？我遇见了怎样的自己？」</text>
<rect x="1260" y="1162" width="420" height="122" rx="10" fill="#262648" stroke="#6a3a8a" stroke-width="1.5"/>
<text x="1274" y="1188" font-size="16" fill="#d0a0e0" font-weight="bold" text-anchor="start">孩子三解（裁#013正字）</text>
<text x="1274" y="1208" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">「孩子没有任何问题，</text>
<text x="1274" y="1227" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">他不是在爱着我们，</text>
<text x="1274" y="1246" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">就是在拯救着我们，</text>
<text x="1274" y="1265" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">就是在表达着我们」</text>
<text x="1274" y="1284" font-size="12" fill="#b8b8d0" font-weight="normal" text-anchor="start">——孩子的一切行为都是爱（U1D1上02:48原词）</text>
