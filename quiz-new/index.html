<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>四季通关 · 成长的旅程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#e0d8cf;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% -20%,#1a1a3e 0%,#0f0f1a 70%);z-index:-1}
.wrapper{max-width:640px;margin:0 auto;padding:16px}

/* ── Login ── */
#login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,15,26,.97);z-index:100;display:flex;align-items:center;justify-content:center}
.login-box{width:90%;max-width:380px;text-align:center}
.login-box h1{font-size:26px;margin-bottom:6px;background:linear-gradient(135deg,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box .sub{font-size:13px;color:#8a8594;margin-bottom:28px}
.login-box input,.login-box select{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:10px;border:1px solid #2a2a3e;background:#1a1a2e;color:#e0d8cf;font-size:15px;outline:none;transition:border .2s}
.login-box input:focus,.login-box select:focus{border-color:#f39c12}
.login-box select{appearance:none;-webkit-appearance:none}
.login-box button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#f39c12,#e74c3c);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-box button:active{opacity:.85}
.login-box .err{color:#e74c3c;font-size:13px;margin-top:8px;min-height:20px}

/* ── Hall ── */
.hall-header{text-align:center;padding:24px 0 8px}
.hall-header .welcome{font-size:13px;color:#6b6478;margin-bottom:4px}
.hall-header h2{font-size:22px;font-weight:700}
.season-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.season-card{border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.season-card:hover{transform:translateY(-2px)}
.season-card.locked{opacity:.35;cursor:not-allowed;pointer-events:none}
.season-card.locked::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;opacity:.6}
.season-card .icon{font-size:38px;margin-bottom:8px}
.season-card .name{font-size:15px;font-weight:600;margin-bottom:4px}
.season-card .sub{font-size:11px;opacity:.7}
.season-card.summer{background:linear-gradient(135deg,#1a3a1a,#2d5a1e);border:1px solid #3d7a2e}
.season-card.autumn{background:linear-gradient(135deg,#3a2010,#5a3a1e);border:1px solid #7a4a2e}
.season-card.winter{background:linear-gradient(135deg,#1a1a3a,#1e1e5a);border:1px solid #2e2e7a}
.season-card.spring{background:linear-gradient(135deg,#1a2a1a,#1e4a2a);border:1px solid #3a6a3a}
.season-card .check{color:#2ecc71;font-size:14px;margin-top:6px}

/* ── Quiz ── */
.quiz-header{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:10px;border-bottom:1px solid #1a1a2e}
.quiz-header .back{background:none;border:none;color:#8a8594;font-size:20px;cursor:pointer;padding:4px 6px}
.quiz-header .title{font-size:15px;font-weight:600;flex:1}
#scoreboard{display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px 10px;margin-bottom:16px;background:#1a1a2e;border-radius:10px;padding:10px 8px;font-size:12px}
#scoreboard>div{white-space:nowrap}

.question-area{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin-bottom:12px}
.q-progress{font-size:12px;color:#6b6478;margin-bottom:10px;text-align:right}
.q-type-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:3px;margin-bottom:10px;font-weight:bold}
.type-choice{background:rgba(52,152,219,.15);color:#3498db}
.type-tf{background:rgba(46,204,113,.15);color:#2ecc71}
.type-match{background:rgba(155,89,182,.15);color:#9b59b6}
.q-stem{font-size:15px;line-height:1.7;margin-bottom:14px;color:#d8cfa0}

.options{display:flex;flex-direction:column;gap:8px}
.option{padding:12px 14px;background:#22223a;border:1px solid #2a2a4e;border-radius:8px;cursor:pointer;transition:all .15s;line-height:1.5;font-size:14px}
.option:hover{border-color:#4a4a6e}
.option.selected{border-color:#f0c060;background:#3a3050}
.option.correct{border-color:#2ecc71;background:rgba(46,204,113,.08);color:#2ecc71}
.option.wrong{border-color:#e74c3c;background:rgba(231,76,60,.08);color:#e74c3c}
.option.disabled{pointer-events:none;opacity:.7}

.tf-options{display:flex;gap:12px}
.tf-btn{flex:1;padding:14px;text-align:center;border-radius:8px;cursor:pointer;background:#22223a;border:1px solid #2a2a4e;font-size:15px;transition:all .15s}
.tf-btn:hover{border-color:#4a4a6e}
.tf-btn.selected{border-color:#f0c060;background:#3a3050}
.tf-btn.correct{border-color:#2ecc71;background:rgba(46,204,113,.08);color:#2ecc71}
.tf-btn.wrong{border-color:#e74c3c;background:rgba(231,76,60,.08);color:#e74c3c}
.tf-btn.disabled{pointer-events:none;opacity:.7}

.match-area{display:flex;gap:14px;flex-wrap:wrap}
.match-col{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.match-item{padding:10px 12px;background:#22223a;border:1px solid #2a2a4e;border-radius:6px;cursor:pointer;font-size:13px;text-align:center;transition:all .15s;line-height:1.4}
.match-item:hover{border-color:#4a4a6e}
.match-item.src-selected{border-color:#f0c060!important;background:#3a3050!important}
.match-item.target-selected{border-color:#80c0f0!important;background:#2a3050!important}
.match-item.matched{border-color:#2ecc71!important;background:rgba(46,204,113,.08)!important;color:#2ecc71;pointer-events:none}
.match-label{font-size:11px;color:#6b6478;text-align:center;margin-bottom:4px}

.explanation{margin-top:14px;padding:12px 14px;background:rgba(240,192,96,.05);border-left:3px solid #f0c060;border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;display:none;color:#b0a8bd}
.explanation.show{display:block}

.nav-row{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0 16px}
.nav-hint{color:#6b6478;font-size:12px;min-width:60px;text-align:center}
.btn-nav{padding:8px 20px;border-radius:8px;cursor:pointer;border:1px solid #3a3a5a;background:#1a1a2e;color:#c0b090;font-size:14px;transition:all .15s}
.btn-nav:hover{background:#2a2a4e;color:#e0d8cf}
.btn-nav:disabled{background:#151525;color:#4a4a5a;border-color:#2a2a3a;cursor:not-allowed}

.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.btn-sm{padding:6px 14px;border-radius:6px;cursor:pointer;border:none;font-size:12px;transition:all .15s}
.btn-correct{background:rgba(46,204,113,.12);color:#2ecc71}
.btn-reset{background:rgba(106,100,120,.12);color:#8a8594}
.btn-summary{background:rgba(155,89,182,.12);color:#b080e0}

.result-msg{text-align:center;padding:16px;margin-top:12px;background:#1a1a2e;border-radius:10px;display:none}
.result-msg.show{display:block}
.result-msg .big-emoji{font-size:40px;margin-bottom:8px}
.result-msg .result-title{font-size:18px;font-weight:600;margin-bottom:4px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2a2a3e;color:#e0d8cf;padding:12px 24px;border-radius:24px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

@media(max-width:400px){
  .match-area{flex-direction:column;gap:10px}
  .season-card{padding:16px 10px}
}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
<div class="login-box">
  <h1>四季通关</h1>
  <div class="sub">一场关于思考、选择和小发现的旅程</div>
  <input type="text" id="li-nick" placeholder="你的昵称（不用真名）" maxlength="20">
  <input type="number" id="li-age" placeholder="年龄" min="10" max="99">
  <select id="li-gender"><option value="">性别</option><option>女</option><option>男</option><option>不想说</option></select>
  <select id="li-edu"><option value="">学段</option><option>初中</option><option>高中</option><option>大学</option><option>已工作</option></select>
  <button onclick="doLogin()">开始旅程</button>
  <div class="err" id="login-err"></div>
</div>
</div>

<!-- Hall -->
<div id="hall-screen" style="display:none">
<div class="wrapper">
  <div class="hall-header">
    <div class="welcome" id="hall-welcome"></div>
    <h2>成长的四季</h2>
  </div>
  <div class="season-grid" id="season-grid"></div>
</div>
</div>

<!-- Quiz -->
<div id="quiz-screen" style="display:none">
<div class="wrapper">
  <div class="quiz-header">
    <button class="back" onclick="backToHall()">←</button>
    <div class="title" id="quiz-title"></div>
  </div>
  <div id="scoreboard"></div>
  <div class="question-area">
    <div class="q-progress" id="qProgress"></div>
    <div class="q-type-badge" id="qTypeBadge"></div>
    <div class="q-stem" id="qStem"></div>
    <div id="qBody"></div>
    <div class="explanation" id="qExplanation"></div>
  </div>
  <div class="nav-row">
    <button class="btn-nav" id="btnPrev" onclick="goPrev()">◀ 上一题</button>
    <span class="nav-hint" id="navHint"></span>
    <button class="btn-nav" id="btnNext" onclick="goNext()">下一题 ▶</button>
  </div>
  <div class="btn-row">
    <button class="btn-sm btn-correct" onclick="showAllAnswers()">📖 显示全部答案</button>
    <button class="btn-sm btn-reset" onclick="resetSeason()">🔄 重做本关</button>
  </div>
  <div class="result-msg" id="resultMsg"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════ DATA ═══════════════
const USER_KEY = 'qz_user_v2';
const STATE_KEY = 'qz_state_v2';
const SERVER_URL = '';

let user = null;
let state = null;
let currentIdx = 0;
let answers = {};
let matchSel = null;

const SEASONS = [
  {id:'summer', name:'夏 · 第一关', icon:'🌞', cls:'summer', sub:'15题·好玩开场'},
  {id:'autumn', name:'秋 · 第二关', icon:'🍂', cls:'autumn', sub:'15题·渐入佳境'},
  {id:'winter', name:'冬 · 第三关', icon:'❄️', cls:'winter', sub:'15题·开始思考'},
  {id:'spring', name:'春 · 第四关', icon:'🌸', cls:'spring', sub:'15题·新视野'}
];

// ═══════════════ INIT ═══════════════
function init() {
  const su = localStorage.getItem(USER_KEY);
  const ss = localStorage.getItem(STATE_KEY);
  if (su) {
    user = JSON.parse(su);
    state = ss ? JSON.parse(ss) : getDefaultState();
    showHall();
  }
}

function getDefaultState() {
  return {summer:false, autumn:false, winter:false, spring:false};
}

// ═══════════════ LOGIN ═══════════════
function doLogin() {
  const n = document.getElementById('li-nick').value.trim();
  const a = document.getElementById('li-age').value.trim();
  const g = document.getElementById('li-gender').value;
  const e = document.getElementById('li-edu').value;
  const err = document.getElementById('login-err');
  if (!n) { err.textContent = '请输入昵称'; return; }
  if (!a || isNaN(a) || a<10) { err.textContent = '请输入有效年龄'; return; }
  if (!g) { err.textContent = '请选择性别'; return; }
  if (!e) { err.textContent = '请选择学段'; return; }
  user = {nick:n, age:parseInt(a), gender:g, edu:e, ts:new Date().toISOString()};
  state = getDefaultState();
  localStorage.setItem(USER_KEY, JSON.stringify(user));
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
  showHall();
}

// ═══════════════ HALL ═══════════════
function showHall() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('hall-screen').style.display = 'block';
  document.getElementById('hall-welcome').textContent = '欢迎，' + user.nick;
  const grid = document.getElementById('season-grid');
  grid.innerHTML = SEASONS.map((s,i) => {
    const done = state[s.id];
    const un = (i===0 || state[SEASONS[i-1].id]);
    return '<div class="season-card '+s.cls+(un?'':' locked')+'"'+(un?' onclick="startSeason(\''+s.id+'\')"':'')+'>'+
      '<div class="icon">'+s.icon+'</div>'+
      '<div class="name">'+s.name+'</div>'+
      '<div class="sub">'+(done?'✅ 已通关':s.sub)+'</div></div>';
  }).join('');
}

function isUnlocked(sid) {
  const idx = SEASONS.findIndex(s=>s.id===sid);
  if (idx<=0) return true;
  return state[SEASONS[idx-1].id];
}

// ═══════════════ QUIZ ═══════════════
let QS = [];

function startSeason(id) {
  if (!isUnlocked(id)) return;
  const s = SEASONS.find(s=>s.id===id);
  const m = {summer:SUMMER, autumn:AUTUMN, winter:WINTER, spring:SPRING};
  QS = m[id] || [];
  currentIdx = 0; answers = {}; matchSel = null;
  document.getElementById('hall-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('quiz-title').textContent = s.icon+' '+s.name;
  document.getElementById('resultMsg').className = 'result-msg';
  showQ(); updateScoreboard();
}

function showQ() {
  const q = QS[currentIdx];
  const t = QS.length;
  document.getElementById('qProgress').innerHTML = '第 <span style="color:#f0c060;font-weight:bold;">'+(currentIdx+1)+'</span> / '+t+' 题';

  const badge = document.getElementById('qTypeBadge');
  const tm = {choice:['选择题','type-choice'],tf:['判断题','type-tf'],match:['连线题','type-match']};
  badge.className = 'q-type-badge '+(tm[q.type]?tm[q.type][1]:'type-choice');
  badge.textContent = tm[q.type]?tm[q.type][0]:'选择题';

  document.getElementById('qStem').innerHTML = q.stem;

  const body = document.getElementById('qBody');
  const prev = answers[currentIdx];

  if (q.type==='choice') {
    body.innerHTML = '<div class="options">'+q.options.map((o,i)=>{
      let cls='option';
      if (prev!==undefined) { cls+=' disabled'; if (i===q.answer) cls+=' correct'; else if (i===prev) cls+=' wrong'; }
      return '<div class="'+cls+'" onclick="'+(prev===undefined?'answerChoice('+i+')':'')+'">'+o+'</div>';
    }).join('')+'</div>';
  } else if (q.type==='tf') {
    const ca = q.answer===true?0:1;
    body.innerHTML = '<div class="tf-options">'+
      '<div class="tf-btn'+(prev===0?' selected':'')+(prev!==undefined?(0===ca?' correct':(prev===0?' wrong':''))+' disabled':'')+'" onclick="'+(prev===undefined?'answerTF(true)':'')+'">✔ 正确</div>'+
      '<div class="tf-btn'+(prev===1?' selected':'')+(prev!==undefined?(1===ca?' correct':(prev===1?' wrong':''))+' disabled':'')+'" onclick="'+(prev===undefined?'answerTF(false)':'')+'">✘ 错误</div>'+
      '</div>';
  } else if (q.type==='match') {
    const matched = (prev&&typeof prev==='object')?prev:{};
    const done = Object.keys(matched).length===q.left.length;
    let h='<div class="match-area">';
    h+='<div class="match-col"><div class="match-label">左列（点击后再点右列连线）</div>';
    q.left.forEach((it,i)=>{
      if(matched[i]!==undefined) h+='<div class="match-item matched">'+it+' → '+q.right[matched[i]]+'</div>';
      else h+='<div class="match-item'+(matchSel===i?' src-selected':'')+'" onclick="selMS('+i+')" id="ms-'+i+'">'+it+'</div>';
    });
    h+='</div><div class="match-col"><div class="match-label">右列</div>';
    const used = Object.values(matched);
    q.right.forEach((it,i)=>{
      if(used.includes(i)) h+='<div class="match-item matched">'+it+'</div>';
      else h+='<div class="match-item" onclick="selMT('+i+')" id="mt-'+i+'">'+it+'</div>';
    });
    h+='</div></div>';
    if(done){
      const allOK = Object.entries(matched).every(e=>q.corrects[parseInt(e[0])]===e[1]);
      h+='<div style="margin-top:10px;text-align:center;color:'+(allOK?'#2ecc71':'#e74c3c')+';font-weight:bold;">'+(allOK?'🎉 全部正确！':'❌ 有错误')+'</div>';
    }
    body.innerHTML = h;
  }

  const exp = document.getElementById('qExplanation');
  if (prev!==undefined) {
    exp.className = 'explanation show';
    // Per-option explanation
    let expText = '';
    if (q.type==='choice' && q.explanations) expText = q.explanations[String(prev)] || '';
    else if (q.type==='tf' && q.explanation) expText = q.explanation;
    else if (q.type==='match' && q.explanation) expText = q.explanation;
    exp.innerHTML = '💡 '+expText;
  } else {
    exp.className = 'explanation';
    exp.innerHTML = '';
  }

  updateNavButtons();
}

function updateNavButtons() {
  document.getElementById('btnPrev').disabled = (currentIdx===0);
  document.getElementById('btnNext').disabled = (currentIdx>=QS.length-1);
  const hint = document.getElementById('navHint');
  const a = answers[currentIdx];
  if (a===undefined) { hint.textContent = '未作答'; return; }
  const q = QS[currentIdx];
  let ok=false;
  if (q.type==='choice') ok=(a===q.answer);
  else if (q.type==='tf') { const ca=q.answer===true?0:1; ok=(a===ca); }
  else if (q.type==='match') ok=(typeof a==='object'&&Object.entries(a).every(e=>q.corrects[parseInt(e[0])]===e[1]));
  hint.textContent = ok?'✅ 正确':'❌ 错误';
}

function answerChoice(i) {
  if (answers[currentIdx]!==undefined) return;
  answers[currentIdx] = i;
  showQ(); updateScore(); updateScoreboard();
  checkAllDone();
}

function answerTF(v) {
  if (answers[currentIdx]!==undefined) return;
  answers[currentIdx] = v?0:1;
  showQ(); updateScore(); updateScoreboard();
  checkAllDone();
}

function selMS(i) {
  matchSel = i;
  showQ();
}

function selMT(i) {
  if (matchSel===null) return;
  let m = answers[currentIdx];
  if (!m||typeof m!=='object') m = {};
  if (m[matchSel]!==undefined) return;
  m[matchSel] = i;
  answers[currentIdx] = m;
  matchSel = null;
  showQ(); updateScore(); updateScoreboard();
  checkAllDone();
}

function goPrev() {
  if (currentIdx>0) { currentIdx--; matchSel=null; showQ(); }
}
function goNext() {
  if (currentIdx<QS.length-1) { currentIdx++; matchSel=null; showQ(); }
}

function updateScore() {
  const r = document.getElementById('resultMsg');
  const done = Object.keys(answers).length===QS.length;
  if (!done) { r.className = 'result-msg'; return; }
  let c=0;
  QS.forEach((q,i)=>{
    const a=answers[i];
    if (q.type==='choice') { if(a===q.answer) c++; }
    else if (q.type==='tf') { if(a===(q.answer===true?0:1)) c++; }
    else if (q.type==='match') { if(typeof a==='object'&&Object.entries(a).every(e=>q.corrects[parseInt(e[0])]===e[1])) c++; }
  });
  const all=c===QS.length;
  r.className = 'result-msg show';
  r.innerHTML = '<div class="big-emoji">'+(all?'🎉':'🌤️')+'</div>'+
    '<div class="result-title">'+(all?'全部通关！':'答对 '+c+'/'+QS.length+' 题')+'</div>'+
    '<div style="font-size:13px;color:#8a8594;margin-top:4px;">'+(all?'下一关已解锁！':'需要全部答对才能解锁下一关，看看错题解析再来一次')+'</div>';

  if (all) {
    const sid = SEASONS.find(s=>QS===window[s.id.toUpperCase()]);
    if (sid) { state[sid.id]=true; localStorage.setItem(STATE_KEY,JSON.stringify(state)); }
    if (SERVER_URL) postResults(c, QS.length);
  }
}

function updateScoreboard() {
  let t=0, c=0;
  QS.forEach((q,i)=>{
    const a=answers[i];
    if (a===undefined) return;
    t++;
    if (q.type==='choice') { if(a===q.answer) c++; }
    else if (q.type==='tf') { if(a===(q.answer===true?0:1)) c++; }
    else if (q.type==='match') { if(typeof a==='object'&&Object.entries(a).every(e=>q.corrects[parseInt(e[0])]===e[1])) c++; }
  });
  const w = t-c, pct = t>0?Math.round(c/t*100):0;
  document.getElementById('scoreboard').innerHTML =
    '<div>📊 进度：<b style="color:#f5c2e7">'+t+'/'+QS.length+'</b></div>'+
    '<div>✅ 正确：<b style="color:#a6e3a1">'+c+'</b></div>'+
    '<div>❌ 错误：<b style="color:#f38ba8">'+w+'</b></div>'+
    '<div>🏆 得分：<b style="color:#f9e2af;font-size:16px">'+pct+'%</b></div>';
}

function checkAllDone() {
  updateScore();
}

// ═══════════════ BTNS ═══════════════
function showAllAnswers() {
  QS.forEach((q,i)=>{
    if (q.type==='match') {
      const o={};
      q.corrects.forEach((ti,si)=>{o[si]=ti;});
      answers[i]=o;
    } else {
      answers[i]=q.answer;
    }
  });
  showQ(); updateScore(); updateScoreboard(); checkAllDone();
}

function resetSeason() {
  answers = {}; currentIdx = 0; matchSel = null;
  document.getElementById('resultMsg').className = 'result-msg';
  showQ(); updateScoreboard();
}

function backToHall() {
  document.getElementById('quiz-screen').style.display = 'none';
  showHall();
}

function postResults(c, t) {
  try { fetch(SERVER_URL+'/api/submit', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,score:c+'/'+t,ts:new Date().toISOString()})}).catch(()=>{}); } catch(e) {}
}

function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

init();
</script>
