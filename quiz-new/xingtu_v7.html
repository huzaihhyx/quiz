挺周到的，轮流切听起来很有'人人平等'的感觉。但原规则根本不需要轮流，哪怕每次都让同一个人切，只要他最后一个选，结果照样公平。你用一个'轮流'的补丁，替掉了那个真正起作用的'最后一个选'，本末倒置了。"}},{stem:"晚自习的教室里静得能听见笔尖摩擦纸面的沙沙声，你抬头伸懒腰的瞬间，眼角余光突然瞥见斜前方的好朋友把手机藏在桌洞底下，屏幕上的答案就显示在题目旁边，监考老师在讲台后翻着书，一点没察觉。你心里一下子乱成了一锅粥：装作没看见吧，总觉得对不起自己熬夜复习的那些晚上；狠心举报吧，又怕这一锤子下去，这份一起喝奶茶、一起打游戏的友情就散了。你翻来覆去纠结到数不清多少遍，脑子里忽然冒出一个更奇怪、更抽离的问题——假如不光是他，而是全班每一个人，甚至全校、全国每一个人，都像他这样掏出手机查答案，那这个世界会变成什么样？这个'试着把一个人的行为放大成全世界都这么做、再回头看它还立不立得住'的思考方式，属于哪个学派？",options:["康德绝对命令——做一件事之前，先在脑子里做一次'如果人人都这么干'的压力测试，看这个世界还能不能正常运转，转不动，那这件事八成就是错的","功利主义——牺牲他这一个人、举报他，就能让全班的公平得到保护，等于用一个'不快乐'换一群人的'快乐'，算总账是划算的","义务论——作弊这件事，本质上就是错的，不管举报不举报、后果怎么样，它错的原因写在了事情本身里，跟别人做不做无关","功利主义——不是看举报对不对，而是去算全班平均分会不会因为这一个人的作弊往下掉，掉了就是坏事，不掉就无所谓"],answer:0,explanations:{A:"对啦，正是康德的绝对命令。他给普通人留了一把特别好用的尺子：做任何一件事之前，先问自己一句'如果全世界每一个人都这么做，这个世界还能不能正常转下去'。转得动，这事就站得住；转不动，那它多半是错的。拿作弊来说：如果人人都作弊，考试就彻底失去了意义，大学没人知道该按什么录取谁，整个教育系统会慢慢塌掉——所以作弊通不过这道'放大考验'。注意一个细节，绝对命令只回答'作弊这件事本身有没有问题'，它并不替你回答'你该不该举报好朋友'，那是另一个问题。真要沿着康德走，他可能还会反过来追问你：如果人人都动不动就举报自己的朋友，那'友谊'这个词，还留得下去吗？两把尺子，量的不是同一件事。",B:"这个想法挺自然，功利主义确实是拿'快乐总量'当账本来算的，牺牲一个、成全一群，听起来很实用。但题里那个人的思考方式，压根没在算账——他没说'举报他是为了救全班'，而是在做一次纯想象的游戏：如果人人如此会怎样。这是康德的普遍化检验，不是功利主义的天平。你把两套完全不同的脑子搞混了。",C:"这个说法有一定道理，义务论确实认为有些事本身就是错的，不看后果。它和绝对命令还是同一家的亲戚。但题里那个思考方式的具体动作，是'把行为放大到所有人都这么做'——这是绝对命令最标志性的检验动作，而不是笼统地说'作弊本身就是错的'。方向对了，但招牌喊错了名。",D:"这个角度挺功利，算平均分确实是在算利益。但题里的那个人关心的是'如果人人都这么干，世界会怎样'这种大画面的推演，而不是'平均分掉没掉'这种具体得失。你把一套关于'规则本身能不能立住'的思考，错当成了一笔关于分数的买卖。"}},{stem:"凌晨一点，小北还抱着手机不肯睡。她蹲的那个限量款手办终于开拍了——起拍价1元，规则却有点狠：出价最高的人付钱拿走手办，可出价第二高的人也要付钱，而且什么都拿不到。小北一开始只想凑个热闹出到20块，结果很快有人把她压下去，她又加价，又被压下去。点确认的那一刻她手都在抖：已经出到好几百了，停下来，前面投进去的全打水漂；继续加，只会越亏越多。床头的手机屏幕反光里，她突然懂了什么叫'骑虎难下'。这跟追星打榜、抢限量球鞋那种'投了就不能白投'的心态一模一样。这个博弈论模型叫什么？",options:["美元拍卖——一场本来看似划算的竞价，因为'谁也别想白亏'，越拍越高，最后赢的人往往也在亏，输的人更惨","智猪博弈——聪明的那只猪只要躺平等着，弱小的一方被逼着干活，就像拍卖里总有人先冲出去当冤大头","鹰鸽博弈——鹰派和鸽派两种性格对撞，强势的会一直压着弱势的出价，谁先服软谁认输","囚徒困境——两个人都怕对方出价，于是只能互相加价试探，最后都选了让自己更亏的那条路"],answer:0,explanations:{A:"对啦，就是美元拍卖。这个博弈最狠的地方在于：一旦参与，'退出'就变成了亏钱，'继续'也只是亏多亏少的问题。经济学家拿1美元做实验，结果经常被拍到好几美元才成交——因为第二高的人也要付钱，他不加价，钱铁定没了；加了价，万一赢了呢。打榜就是它的现实版：你已经投了5000票排第二，第一名又砸了1000票，你跟不跟？跟，沉没成本越滚越大；不跟，前面全白投。唯一的清醒解就是一开始别进场，可这话说出来容易，真刷到第7轮的时候，连讲它的经济学家自己都在掏卡。下次刷到'差一点就到手'的东西，先问一句：我现在是被这个游戏牵着走了吗？",B:"这个思路挺像的，智猪博弈里确实有'躺赢'和'被逼干活'的分工：大猪按开关能吃更多，小猪干脆等着。可美元拍卖里的问题不是谁聪明谁偷懒，而是所有人都被'第二高也要付钱'这条规则架在了火上，人人都不得不加价。一个是'谁去干活'的分工问题，一个是'谁也别想白亏'的加价泥潭，指的不是同一件事。",C:"鹰鸽博弈讲的是两种策略对撞：强硬到底的和见好就收的，谁碰到谁，怎么分好处。它和美元拍卖确实都有'谁先服软谁吃亏'的味道，但美元拍卖的关键机关不是性格冲突，而是那条'输了也要付钱'的规则——是规则逼着所有人往上加价，不是谁天生鹰派。",D:"囚徒困境是人人都怕对方背叛，于是各选对自己最'保险'的那条路，结果一起掉坑。这里确实也越陷越深，但美元拍卖的驱动力是'已经投进去的钱不能白费'，也就是沉没成本和那条'第二名也付款'的坑人规则，跟'猜对方会不会背叛'不是一回事。诱人，可惜不是它。"}},{stem:"小北她们的宿舍有个不成文的现状：厕所、水池、地板，永远只有小北一个人在收拾。另外两个人每次路过都装看不见，嘴里还念叨'反正总会有人弄的嘛'。小北这次赌气不扫了，结果三天过去，水池边一圈干掉的泡沫，地板上头发团成球滚来滚去——还真就没人动。她举着拖把站在门口，突然觉得这场景有点眼熟，像极了课本上某个经济学名词。大家都在心里盘算着'反正别人会扫的'，结果谁都没扫。这个宿舍公地一天天烂下去的现象，经济学里叫什么？",options:["囚徒困境——三个人互相猜忌'我扫了别人不扫就亏了'，于是都选择不扫，最后一起住在垃圾堆里","公地悲剧——公共卫生是大家一起的，谁都想着'总会有人弄'，理性地偷懒，最后这公共的地就没人管了","沉没成本——地已经脏成这样了，再花力气去打扫也不划算，不如就让它脏下去","边际效用递减——第一次打扫还有成就感，扫到第三遍那点快乐就几乎没有了，所以懒得再扫"],answer:1,explanations:{A:"这个想法很自然，但囚徒困境的招牌是'互相猜忌导致双输'：怕对方背叛，自己也背叛。宿舍这事的重点不是猜忌，而是'反正公共的，我偷懒也没损失'——每个人都在理性地占便宜。猜忌和占便宜，是两个不同的动机，所以它更像另一个名字。",B:"没错，就是公地悲剧。一片草地谁都能放羊，那每个牧民都会想'草是大家的，我多放几只羊，别人也分不走我那份损失'，于是一个个都多放，最后草被啃光、人人完蛋。宿舍的公共卫生就是那块'草地'：它是公用的，我没打扫的亏空会被摊到所有人头上，那我自然想偷懒，结果就是没人扫。经济学家开过两个方子，一是'私有化'——排张值日表，把责任落到人头；二是'再不行就引入检查'——宿管突击查房。现实里还有个土办法：谁先受不了谁去扫，然后这人就攒下了一笔道义债，下次吵架能拿出来用。共享文档、公用冰箱、公共Wi-Fi慢，其实都是同一片被啃光的草地。",C:"沉没成本讲的是'已经投进去、收不回来的钱，不该再影响我接下来的决定'。这里的地脏了，问题不是'花力气扫划不划算'，而是'每个人都觉得别人会去扫'。一个是纠结过去的投入，一个是推卸公共的责任，不是一回事。",D:"边际效用递减说的是同一件事做多了，多带来的快乐越来越淡，像第一杯奶茶香，第五杯就腻。可宿舍的地没人扫，不是谁'扫腻了'，而是人人都把这件事外包给了'总会有人'。方向反了，诱人但不对。"}},{stem:"小北和室友又为扫地僵住了。两个人心里都有一张算盘：你要是不扫，我也不想扫；可你扫了，我又觉得亏待了谁似的。总之谁也不肯当那第一个弯腰的人。结果呢，垃圾桶满到溢出来，两人捏着鼻子互相瞟，谁也不先动。小北越想越气，又觉得这场景眼熟——这不就是课本上讲的那个博弈论困境吗？可仔细一想，又好像有个挺关键的地方不一样。她们每天低头不见抬头见，明天、后天、下个月都还要住在一个屋里，今天这一扫谁先动手，往后好一阵子都会被对方记在账上。跟那个经典的困境比起来，最要命的区别到底是什么？",options:["囚徒困境算的是一锤子买卖，你们是重复博弈，长期相处的账不能按一次算","没有任何区别，这就是标准的囚徒困境，两个人都怕吃亏所以一起装死","你和室友又不是被抓进局子的囚犯，所以这根本不叫囚徒困境","在这种局面里，最正确的做法永远是打死不先扫，谁先动手谁就输了"],answer:0,explanations:{A:"对啦，关键就在'重复'这两个字。经典囚徒困境是关一次、招一次、对质完就散伙，所以双方都只想这一把怎么最划算。可你和室友是'重复博弈'：今天你打扫了，她的反应会被你记在心里，明天的策略也会跟着变。政治学家阿克塞尔罗德办过一场锦标赛，让人提交策略重复对弈，看谁长期得分最高，冠军居然是看起来最朴素的'以牙还牙'：先主动合作一次（比如你先扫），对方要是不扫，你下次也就不扫；对方扫了，你就接着扫。这招既不吃亏，也不会把事情做绝。不过在真实宿舍里，它的极限也很扎心：很可能你们都在等对方那'第一次'，等到最后连'以牙还牙'都没机会开场。",B:"看着确实像，但'一次'和'一直'差别巨大。一次性博弈里，背叛往往最划算，因为没下次了；可你们还要一起住很久，今天装死，明天怎么面对？正因为有未来，最优策略才从'打死不扫'变成了'先扫一次试试对方'。所以不能简单划等号。",C:"名字里的'囚徒'只是借了个场景，重点从来不是有没有进局子，而是两个理性的、互相算计的人被困在利益冲突里。换成室友、同事、甚至两个国家都成立。用'不是囚徒'来否定它，等于只盯住了字面。",D:"'永远不先扫'确实是一次性囚徒困境里那个'不吃眼前亏'的选择，可放到重复博弈里就变了味：如果双方都死守着这个策略，宿舍会臭到天荒地老，这才是真正的双输。长期看，先伸一次手去试探对方，反而常常是更聪明的第一步。"}},{stem:"小北随手拍了条吐槽学校食堂的短视频，本来只想跟室友自娱自乐，结果一夜之间火了。评论区瞬间分裂成好几拨：一拨人喊着'扒出她是哪个班的'，一拨人把她捧成'敢说真话的勇士'，还有一拨酸溜溜地说'肯定是炒作，想红想疯了'。小北盯着手机，看着自己在三拨人嘴里被贴成三个截然不同的标签，突然觉得有点恍惚——她还是那个她，可好像已经没人关心她本人是谁了。就在这时，她脑子里模模糊糊浮起一句很有名的哲学短句，最可能是哪一句？",options:["'超人哲学'——真正的强大是彻底无视这些评论，你越在乎它们，它们越能伤到你","'他人即地狱'——萨特的意思是，别人的目光会把一个活人钉成他们想要的角色，你不再是原来的你","'上帝已死'——既然再也没有一个高高在上的裁判，别人凭什么说你做错了","'存在先于本质'——你拍视频的那一刻就定义了自己，视频火了反而证明了你存在的价值"],answer:1,explanations:{A:"'无视一切评论'听起来很爽，很像尼采'超人哲学'的味道，但超人哲学更强调的是超越传统道德、自己给自己定价值，不是简单地把评论当空气。而且这题的关键不是怎么'抵抗'评论，而是别人的目光本身在悄悄改造你是谁——方向偏了。",B:"没错，就是萨特的'他人即地狱'。这句话常被误会成'别人都很坏'，其实他的意思是：别人的目光有一种可怕的本事，能把你'固化'成他们以为的那个样子。你本以为自己只是个随口吐槽的学生，可评论区硬生生把你框成了'勇士''炒作狗''受害者'三个互相矛盾的角色，你就不再是原来的你了，你成了他们眼里的符号。短视频的评论区，就是'他人的目光'最极致的现场：视频一发出去就不属于你了，它属于每一个刷到的人，他们各自定义你是谁。萨特的解药是——能看清这件事，本身就算一种松绑。你可以选择不去看那几万条评论，也可以看了之后说一句：随便你们怎么讲，我知道我是谁。",C:"'上帝已死'是尼采在说，传统那套由宗教撑起来的绝对标准塌了，人得自己重新找价值。这跟'别人凭什么评价我'确实沾点边，但它要处理的不是'被围观'这件事，而是'标准从哪来'。用在这题上有点大材小用，而且错位了。",D:"'存在先于本质'是萨特的核心，意思是人先存在，之后才靠自己活出意义，没有天生注定的模板。可这题的重心不在'我怎么定义自己'，而在'别人怎么把我框住'。你把主语搞反了——困住小北的不是她自己，是那几万条目光。"}},{stem:"小组作业四个人，临下课前老师丢下一句：\"任务平均分配，细节你们自己协调。\"话音一落，教室里安静了三秒。然后三个人像排练过一样齐刷刷看向你：\"你先领个任务嘛，我们跟。\"你嘴笨，应了下来。结果一周过去，只有你一个人真的建了PPT。你在群里问进度，没人回，只偶尔蹦出几个表情包。截止日前一天凌晨两点，你还在给最后两页排版，手指发麻，心里憋着一股火又没法发，回到宿舍瘫在床上越想越憋屈。那种\"谁先动谁就输，可总得有人先认输\"的僵局，在博弈论里有个专属名字，叫什么？",options:["纳什均衡——每个人都停在一个\"别人不动我也不动\"的位置上，看似稳定，其实是谁也不愿意当那个先吃螃蟹的人，因为先动的人天然要多干活","懦夫博弈——两辆车头对头冲向对方，谁先打方向盘谁是\"懦夫\"，可谁都不打就一起撞烂；小组里先接活的人就是那个先打方向盘的","阿罗不可能定理——就算组织一场投票来决定谁先领任务，投票结果也没法让四个人都满意，所以僵局其实是数学上无解的","囚徒困境——每个人心里都在盘算\"别人要是做了我就不用做了\"，最后大家各自打小算盘，反而谁都没真正出力"],answer:1,explanations:{A:"纳什均衡听着挺唬人，但它的意思是\"给定别人不动，我也不想变\"——就像演唱会现场大家都坐着，谁都不想破坏现状。小组作业可不一样：你是真心希望别人能先动，你只是想躲开那个\"先接活\"的位置。这已经不是\"满意现状\"了，而是四个人在比谁更能扛、最后谁先破功，那是懦夫博弈的戏码。",B:"对啦，这就是懦夫博弈（chicken game）。想象两辆跑车高速对冲，谁先打方向盘谁就是认怂的\"懦夫\"，可要是俩人都不打，最后就是一起撞个稀烂。小组作业就是这个路数：\"先接活的人=懦夫\"，于是每个人都假装淡定、假装没收到消息，看谁能撑到最后一刻。可作业是有截止日的，最后往往是那个最在乎成绩、脸皮最薄的人先破功——这个人，通常就是一开始被点名的你。它和囚徒困境最大的区别在于：这里不是\"背叛更划算\"，而是\"坚持到最后的人占便宜\"，比的是谁更能拖。下次再被默契地推出来接活，不妨先停两秒想想：你不是不会拒绝，只是怕一开口就撕破脸，而这个\"开不了口\"，恰恰是对方敢一直占你便宜的地方。",C:"阿罗不可能定理说的是\"没有任何投票规则能满足所有的公平条件\"，那是个关于集体决策的数学结论。可这个小组根本没人组织投票，大家连正经讨论都不想开，只想用沉默拖时间。问题不在投票机制好不好，而在谁先认怂这件事上，跟投票悖论八竿子打不着。",D:"囚徒困境的老底子是\"背叛比合作更划算\"——两个嫌疑人都不招供对大家好，但谁都怕对方先招，所以都招了。小组里你不是因为担心\"举报队友\"能拿到什么好处才扛活，而是因为关系成本太高、张不开嘴，只能自己默默把事做了。这比囚徒困境多了一层人情账，核心还是\"谁先动谁输\"的懦夫博弈。"}},{stem:"班长在班群里发起班服投票，把三个选项明明白白列了出来：A款便宜大碗但版型实在普通，套身上像校服；B款好看但贵了一截，得咬咬牙才下单；C款设计独特可尺码挑人，不是谁都能穿进去。一圈投下来，A得票最多，B紧随其后，C最少，大家鼓掌散会，以为这事就这么定了。谁知班主任端着茶杯慢悠悠补了一句：\"那要是只在这A和B里头二选一，结果会怎样？\"大家一愣，当场又举了一次手。没想到，B居然反超赢了。明明几分钟前A还是第一，怎么换个问法、去掉一个选项，结果就整个翻了过来？投票这件事，到底藏着什么问题？",options:["搭便车问题——投给C的人其实压根没那么稀罕C，只是随手点了个选项凑热闹，等真正二选一的时候才露出真实偏好","阿罗不可能定理——只要候选选项超过两个，任何一种投票制度都可能在数学上产生自相矛盾的结果，这是制度本身的硬伤","孔多塞悖论——同一个群体的偏好摆在一起，换个问法、去掉一个选项，就可能得出完全相反的\"民意\"，像自己跟自己打架","纳什均衡——不存在什么问题，纯粹是班长在操纵投票流程，刻意引导大家改选他想要的B款"],answer:2,explanations:{A:"搭便车说的是\"享受好处却不付成本\"——比如小组作业里有人不干活照样拿分。可这些投C的人并不是白蹭，他们只是真实地更偏好C而已；当C被拿掉，他们自然退而求其次选B，这是再正常不过的第二选择，跟\"随便投\"没关系。",B:"阿罗不可能定理确实说了\"没有完美的投票制度\"，但那是个很宏观的数学结论，讲的是任何规则在三个以上选项时都有缺陷。眼前这个具体现象其实有更精准的名字，也更容易落到生活里看：就是那个选项排列一变、结果就翻车的悖论。",C:"正确，这就是孔多塞悖论。三选一的时候A赢了，可把C一拿掉，B反而反超A——说明C当初分走的那批票，原本更倾向B。同一个班级、同一群人、同一个偏好，就因为我们换了个问法、去掉了个选项，得出了截然相反的\"民意\"，这就像同一张脸，换个滤镜换个角度，气质完全不一样。它最让人后背发凉的地方在于：谁都不是在撒谎，每个人从头到尾都在认真选，可统计方式的小小变动，就能把结论整个翻个面。所以下次看到有人甩出一张投票结果、信誓旦旦说\"大家都这么想\"的时候，多留个心眼——你不换个问法再问一次，永远不知道这\"民意\"有多脆。",D:"这个投票翻车是真实存在的数学bug，不是班长在后台捣鬼。就算班长规规矩矩、谁都没引导，只要候选超过两个，这种\"去掉一个就反转\"的怪事照样会发生。跟纳什均衡更没关系——这压根不是策略互动的博弈，而是偏好如何被统计的问题。"}},{stem:"你搬进宿舍没多久，就发现舍友的洗发水用完了总要来挤你的，肥皂也抢着用，每次嘴上都挂着\"下次我买\"，然后那个\"下次\"遥遥无期，像永远排不到头的奶茶号。你脸皮薄，张不开嘴拒绝，就当交个朋友，心想一点小钱别计较。可有一天你突然回过味来——这四人间里，另外两个室友也跟你一样被借过，大家谁都没吭声，都憋在心里。一种公共的东西，谁都觉得\"反正不花钱、我多占一点无妨\"，最后被一把一把悄悄榨干，这个现象在博弈论里有个人尽皆知的名字：",options:["柠檬市场——因为你买的洗发水质量太好，大家都想来蹭好货，本质上是一种\"好东西反而招来麻烦\"的怪圈","囚徒困境——你不借怕被说小气，别人也不借怕被说小气，大家都困在\"不敢先说不\"的死局里","公地悲剧——公共资源没人心疼，因为每个人多占一点自己划算，伤害却平摊给所有人，最后就被用光了","逆向选择——越是好说话、越不会拒绝的人，越容易被盯上被借，久而久之形成了一种筛选机制"],answer:2,explanations:{A:"柠檬市场讲的是信息不对称：买的人看不出货好不好，好货反而被差货挤走。可舍友蹭你洗发水，问题不在于你这瓶洗发水\"质量信息不透明\"，而是它对你免费、对她不要钱。她不是来比较质量的，是来零成本占用的，这跟柠檬市场是两个逻辑。",B:"囚徒困境的骨架是\"合作还是背叛\"的对策矩阵——你不借、她也不借，双方都吃亏；可这里借不借的后果压根不对称：她不借没有丝毫损失，你借了才有损失。问题核心不是你怕被说小气，而是一件公共的东西被零成本地反复抽取，比囚徒困境更像资源的慢慢漏气。",C:"没错，这就是公地悲剧。想象村里有片草地，我多放一头牛，收益100块全归我自己，可草被啃秃的代价摊到全村每人头上只亏1块，那我当然可劲儿放牛。舍友多挤一次你的洗发水，成本是零，伤害是你的不爽，而且你没法跟她按毫升结账。公共资源就是这么没的——不是因为谁坏，而是因为\"多占一点我划算\"这个念头人人都冒。奶茶店的试吃也是一样，谁都不多拿就没事，可大家都不客气，盘底一会就空了。一点点钱确实不是大事，但你闷在心里的那口气，比洗发水本身更耗人——要么早点说清，要么就别再让\"不好意思\"替她买这份人情。",D:"逆向选择确实会说\"筛选出留下的是坏结果\"，但这里不是\"好舍友退出群聊\"，而是公共品被过度消耗。反过来想，她为什么专挑你借？因为她发现你最好说话、最不会拒绝——这是\"挑软柿子捏\"，跟逆向选择里好坏货被分辨的逻辑不一样。"}},{stem:"演唱会开唱前，大家本来都好好坐着，手机里的歌单也早调好了，就等灯暗下来。音乐一响，第一排有人\"唰\"地站了起来，像点了根导火索；第二排视线被挡，暗暗骂了一声，只好也站起来；第三排跟着起立；再往后，一浪接一浪……不过两分钟，全场齐刷刷站成一片。可你踮着脚、抻着脖子，看到的画面跟刚才坐着时一模一样，唯一的不同是腿开始发酸。谁都没多看到一眼，每个人却都多付了一笔体力的账，这种全员\"自己给自己找罪受\"的博弈，有个学名，叫：",options:["军备竞赛——人人都想靠加码来维持自己的相对位置，结果投入越来越多，相对位置却纹丝不动，整体只是更累了","囚徒困境——每个人心里都算着\"我不站就亏了\"，于是人人选择站在自己的立场上背叛了\"都坐着\"的默契","零和博弈——有人看得更清楚，就必然有人看得更差，画面的总清晰度是守恒的，谁也不吃亏也不占便宜","纳什均衡——站着是每个人在别人也站时的最优选择，所以大家才都站着，只是这集体结果让人笑不出来"],answer:0,explanations:{A:"对啦，这就是军备竞赛的逻辑。当年美苏造核弹，你造100枚我就造200枚，最后两边都堆到几千枚，可谁的相对优势也没变，只是双方都累得要死。演唱会也一样：第一排一站，第二排被迫站，等全场都站起来了，视野对比又回到起点，可所有人的腿都白酸了。报补习班越报越狠、排名却纹丝不动，是同一个味道。核心就一句话：每个人都在做\"对自己最优\"的事，把这些\"最优\"加在一起，反而成了大家一起内卷。",B:"囚徒困境确实是\"个人理性导致集体非最优\"，但这里的投入是连续的——你可以半蹲、踮脚、搬板凳，一层层往上加码，不是\"站/不站\"这种非黑即白的背叛或合作。与其说是一场二选一的对峙，更像你追我赶的螺旋升级，所以军备竞赛这个叫法更贴。",C:"零和博弈是说\"你赢的就是我输的\"，总数守恒。可这里最后所有人的视野跟坐着时一样，没有赢家，甚至除了腿酸也没输家——大家只是额外交了一笔\"站着的体力税\"。这连零和都算不上，是负和：总量没变，成本却凭空增加了。",D:"纳什均衡的定义没错：\"给定别人站着，我也不想坐下\"，所以站着确实是个均衡。但它只描述了一个静止的结论，没讲清这个局面是怎么一点点滚出来的。军备竞赛才点出了那股\"你加码我也加码\"的动态劲儿，所以用后者来说更准。"}},{stem:"班里要选班长，五个候选人各有所长：有人成绩拔尖，有人人缘一向好到班群发个红包能炸出一片彩虹屁，有人组织活动是把好手、晚会气球都能吹得整整齐齐，各有各的支持者。投票、唱票、公布，一套流程走完，你盯着黑板上歪歪扭扭的正字，却冒出一个说不清的感觉——没有一个人真正让超过一半的人真心满意。更诡异的是，不管最后谁当选，总有一撮\"少数派\"的声音被压了下去，像掉进深水区，喊都喊不出响。这种多数票决策背后藏着的隐患，你回家翻书才发现它有个名字：",options:["阿罗不可能定理——多数决在数学上就注定了没法完美还原所有人的意志，总有人的偏好会被制度性牺牲","囚徒困境——投票人因为怕自己的票被浪费，于是策略性地投给\"反正能赢\"的人，反而扭曲了自己真实的想法","孔多塞悖论——候选人一多，投票顺序和配对方式的微小变化就能让最终结果翻盘，结果像抽签一样不稳","多数人暴政——多数人定下的规则，可能系统性地把少数人的需要当成空气，而\"人多\"并不等于\"有理\""],answer:3,explanations:{A:"阿罗不可能定理确实很深刻，说的是任何投票规则都无法在三个以上候选时同时满足几项\"公平条件\"，那是数学上的不可能。可这道题的落点不在\"投票数学有瑕疵\"，而在赢家当选之后、会不会去考虑输家。它是一个更软、更关乎人心的隐患。",B:"策略性投票确实真实存在——有人会为了不浪费票而投给\"稳赢\"的人。可这里问的是当选之后的治理问题，不是投票那一刻有没有人说真话。题目问的是\"决策的隐藏问题\"，答案在结果层面，不在过程层面，所以对不上。",C:"孔多塞悖论讲的是两两比较时出现循环偏好的怪圈：A赢B、B赢C、C又赢A，绕成一个死结。可这个班就是老老实实一人一票的多数决，没有搞任何两两对决，也谈不上投票顺序翻盘，所以不是它。",D:"正是多数人暴政（tyranny of the majority）。它不是骂\"投票不该存在\"，而是点破一组逻辑：\"51%赢了，就能对49%想干嘛干嘛\"，这本身是有问题的。班里少数派的意见被无视，不是因为他们的想法没道理，纯粹是因为人头不够。可\"人数多少\"和\"谁对谁错\"是两个维度，日子过久了人们很容易把它们混成一件事。下次你觉得少数派的声音无所谓时，不妨把自己放进去想想——万一那个坐在角落、开不了口的人，就是你呢。"}},{stem:"晚自习下课，你正在抄英语作业，同桌突然凑过来压低声音：'我报了那个数学竞赛冲刺班。'你心里咯噔一下——班里一半人都报了。你慌了，脑子开始高速运转：他们报我不报，万一真的被拉开距离怎么办？排名是死的，我不前进就等于后退。于是第二天你也去交了钱。结果消息传到隔壁班，隔壁班一听你们全班几乎都报了，生怕落后，一窝蜂全报上。一个学期下来，所有人的课外补习时间翻了一倍，晚自习之后还要赶场子上课，眼睛都熬出了红血丝。可期末成绩出来，年级排名几乎纹丝未动，你还是那个位置，大家还是那个位置。你盯着排名表发呆：花了这么多时间这么多钱，到底图啥？这场所有人都累得半死却谁也没前进的内耗，用博弈论来说到底算怎么回事？",options:["零和博弈——排名本身就是你升我降的死局，所有人的总排名加起来永远不变，所以怎么折腾都没用","胜者诅咒——报班的人确实在竞争里'赢'了位置，但细算才发现付出的时间金钱成本早就超过那一点名次带来的收益","军备竞赛——每个人都靠不断追加投入来守住自己的相对位置，可所有人的努力互相抵消，相对位置根本没动","囚徒困境——每个人都在'报'和'不报'之间纠结，报了对别人是背叛，不报等于跟别人合作，最后全背叛了"],answer:2,explanations:{A:"这个想法挺自然的，排名零和这一点你没看错——前进一步确实意味着有人后退一步，总名次之和是个死数。但题干真正想问的不是'排名是不是零和'，而是'为什么所有人加了投入却没人改善名次'。零和只是结果这块布，军备竞赛才是织出这块布的过程。就像两块蛋糕分配，争抢是零和的，但'所有人同时抄更大勺子却还是抢到同样多'这件事，得用别的东西来解释。",B:"胜者诅咒听起来很唬人，但它专门用在拍卖里——竞拍的人里最乐观的那个会喊出过高的价，结果花了远超物品实际价值的钱，'赢'反倒成了一种诅咒。补习班没有竞价机制，也不存在'中标'这个概念，你交钱不是在一口价一口价往上叫。所以这个词虽然带着'赢了却亏了'的味道，但场合对不上。",C:"正确，这就是军备竞赛。冷战那会儿美苏造核弹，你多造一枚我就多造两枚，最后两边核弹库存翻了几十倍，可谁的相对优势也没变——只是每个人都熬得精疲力尽。补习班一模一样的逻辑：你加码，别人也加码，你所有'多投入'的部分都被别人的'多投入'抵消掉了，唯一实实在在的结果就是所有人都更累、更焦虑、睡得更少。放在你身上，就像排位赛里两边都在拼命肝，段位还是原地踏步，只有眼睛越来越红、头发越来越少。这就是内卷的博弈学底牌：所有增量的努力都被对手的增量抵消，最后只剩下一堆疲惫。但看清了这一点，反倒能让你松口气——不是你不够拼，是这场游戏的规则本身就注定吊着大家原地跑。你心里那点不甘，本可以花在真正想推进的事上，而不是陪跑。",D:"囚徒困境听起来也像，但它得有一个具体的'背叛比合作划算'的收益表格，而且背叛选项通常是一锤子买卖。这里其实没有真正的'合作'选项——你不报班不等于跟别人合作，只是没上赛场。更贴切的是军备竞赛里那种'再咬咬牙多投一点'的螺旋上升：不是一次性的背叛抉择，而是每个人都被推着不断加码，谁也没占到便宜。"}},{stem:"你粉的爱豆最近在冲一个打榜活动，规则很简单：粉丝花钱买'星币'投票，投得最多的爱豆能拿到全站首页推荐位。一开始几块钱就能冲到前排，你随手充了十块，看着自家爱豆的名字往上蹿，还挺开心。可没过几天，各大粉丝群开始集资冲榜，票数像坐了火箭一样指数级上涨。你发现自己越投越多，余额里那点零花钱早就见底，还偷偷动了压岁钱。理智告诉你该停了，可一停手，前面投进去的全打水漂——于是你又充了一笔，想着'再投最后一次，下次肯定收手'。结果这个'最后一次'说了不知道多少遍。你发现自己陷进了一个越挣扎越深的泥潭。这个'越陷越深停不下来'的现象，有个专门的名字叫什么？",options:["囚徒困境——你不投别人投，别人赢了就等于你亏了，所以这场博弈里只能一直投，谁也停不了","沉没成本谬误——已经砸进去那么多钱，现在停手就等于亲口承认前面全白花了，所以咬咬牙接着投","美元拍卖陷阱——竞拍过程中双方互相抬价，出价一路狂飙，最后远远超过了那一美元本身的价值","损失厌恶——比起得到全站推荐的那点爽，你更怕失去前面已经投进去的钱，所以被恐惧推着走"],answer:2,explanations:{A:"囚徒困境需要两个对称的选择——合作或背叛——而且背叛要严格优于合作，才构成那种两难。可打榜不是一锤子买卖，它是连续不断的投入：你每一秒都在做'要不要再多投一点'的新决定，没有一次性的'背叛'按钮可按。所以这个概念套在追星打榜上，形状不太对。",B:"这个想法很贴近，沉没成本谬误确实是你停不下来的一个心理原因——'都花这么多了，现在停岂不全白费'这个念头就是它。但它只解释了你心里的纠结，没给出这个博弈结构本身的名字。美元拍卖陷阱其实把沉没成本也包进去了，而且更完整地说明了为什么设计会让人越陷越深。",C:"正确，就是美元拍卖陷阱。经典实验：拿一张1美元来拍卖，出价最高的人得到这1美元但要付自己喊的价，而出价第二高的人也要付自己的价却什么都拿不到。结果两个竞拍者为了不当'第二高'那个白白赔钱的人，互相抬价，最后喊到了远超1美元。追星打榜是一模一样的结构——前面投进去的都成了'不想白亏'的筹码，于是你一次一次往上加，直到远超你能承受的地步。想想压岁钱是怎么一点点被掏空的：每一笔都像'再投最后一次'，可这个最后一次永远没尽头。",D:"损失厌恶也确实在推你——人对失去的感受比得到强烈得多，所以你会格外怕'投进去的钱打水漂'。但损失厌恶只是那股情绪，美元拍卖陷阱才是解释这个机制的正式名字。一个讲'为什么会心疼'，一个讲'结构为什么会把人算计成这样'，题干问的是后者。"}},{stem:"初中时你成绩烂熟于心，随便一考就是全校前列，走路都带风。进了重点高中，你第一次发现身边全是更卷的人，自己从尖子生变成了'泯然众人'，那股底气突然就散了。你开始怀疑：是不是我本来就没那么行？可面子上挂不住，于是你开始买名牌、穿限量款的贵鞋，一双鞋顶半个月生活费。你知道自己心里其实挺虚的，可真穿出去那一瞬间，感觉腰杆能挺直一点。同学偶尔夸一句'你鞋不错'，你能开心一整天。冷静下来你也明白，这鞋并不真让你变强，可你就是离不开它。博弈论里有个词专门解释这种'用高成本撑场面'的行为——穿这些Logo本质上是在干什么？",options:["美元拍卖陷阱——你在'买名牌'这件事上不断加价，一双比一双贵，早就超过鞋子本身的价值","沉没成本谬误——已经花了这么多钱在装备上，现在不穿了等于全白花，所以只能一直穿","禀赋效应——你一旦拥有这些东西，就会觉得自己整个人连同这些牌子都变得更值钱了","框架效应——你内心定义'穿名牌的那个我'才是正常的我，所以拼命维持这个人设"],answer:0,explanations:{A:"正确，这就是信号理论——有些行为成本高得离谱，比如孔雀拖着一条影响飞行的长尾巴、名牌贵到肉疼，但恰恰因为成本高，它才成了一个'靠谱信号'。试想如果假货跟真品一模一样、五十块就能到手，那穿名牌就再也炫不了实力了。你用'我付得起这个无用的高成本'来向别人传递'我有实力、我跟你们不一样'——哪怕心里其实在虚，这身装备也替你撑起了一点腰杆。成本越高的炫耀，信号越响亮，就像游戏里砸重金养的高级皮肤，好看之外其实也在昭告'我玩得认真'。不过说回来，能让你踏实挺直腰的，往往不是这双撑给外人看的鞋，而是你最近悄悄为自己做的那点小事——记一笔账、点杯低糖奶茶、出门散个步，这些不用演、真滋养自己的钱，才是慢慢攒起来的底气。",B:"沉没成本谬误说的是沉没的钱影响你继续的决定——'都买了这么贵，不穿浪费'。可你穿名牌不是怕浪费，而是主动要它帮你向别人发出信号。这里的关键不在于'已经花的钱推着你走'，而在于'这份高成本本身成了你能力的代名词'。方向反了。",C:"这个挺接近但又偏了。禀赋效应是说一旦你拥有了某样东西，就会不自觉地高估它的价值，比如你的旧手机挂二手总觉得自己该卖得比市场价高。它讲的是'拥有的东西变金贵'，而不是'用高成本去向别人证明自己'。穿名牌发信号是另一码事。",D:"框架效应说的是同一件事换个说法就改变你的判断，比如'存活率90%'和'死亡率10%'其实一样，但心情完全不同。穿名牌不是在重新包装'正常的自己'这个说法，而是在向外界传递一个信息——'我付得起这个成本，说明我有实力'。所以这个词也对不上。"}},{stem:"班里有个'神人'：小组作业从来不动手，群里潜水到底，可最后交上去的作业署名一个不落，还总在老师面前混个脸熟。全班都知道他是混子，可没一个人去找老师告状——因为一旦捅破，自己就成了'告密的小人'，被人在背后戳脊梁骨，这个成本太高；而让他继续混的成本倒是分摊得很开，全组四个人每人多干25%就完了。于是这个混子就这么舒舒服服地搭了一学期又一学期的顺风车。你越想越气，可气归气，下次分组你发现大家还是嘴上抱怨、手上照干。你忍不住在课间吐槽：这到底像咱们学过的哪个概念？",options:["囚徒困境——每个组员都在'举报'和'不举报'之间反复博弈，最后'不举报'成了大家共同的理性选择","搭便车问题——他享受了集体作业的成果和署名，却没有承担对应那一份劳动成本","公地悲剧——组里的劳动力是块公共草地，每个人多蹭一点都觉得自己赚了，最后反而没人干活","懦夫博弈——看谁能憋到最后不出手，谁先去找老师谁就输，所以大家僵在那互相耗着"],answer:1,explanations:{A:"囚徒困境确实有个'举报/不举报'的形状，但它要求'如果对方举报而我不举报，我就能获利'这种收益结构。可这里举报对举报人几乎没好处——老师大概率给全组打一样的分，你举报了也未必多得。所以这不是纯博弈的两难，更像个只有成本、没什么个人收益的选择。",B:"正确，这就是搭便车问题（free rider problem）。一辆公交车的运营成本是固定的，有人上车不买票，剩下的乘客就得多分摊一点车费。可为什么没人拦住他？因为'拦'的成本——吵架、被记恨、耽误工夫——比'多摊那一点车费'高得多。组里的混子就是这么活下来的：不是大家傻，是'算了'永远比'跟他刚'更省事，毕竟为一个署名去告状，后患远比多做那25%的活更麻烦。",C:"公地悲剧挺像的，但它讲的是资源被过度消耗——公共草地上没人限制，于是羊越放越多，最后草被啃光。组里的混子不是'让劳动力被过度消耗'，而是'光享用不付出'。一个是要太多把东西耗没了，一个是占便宜不干活，结构上其实不一样。",D:"懦夫博弈是'谁先松手谁是胆小鬼'的公路对峙，双方都等着对方先退。但混子跟你之间不是这种对峙关系——他没在跟你比谁能扛，也没在逼你先做什么。他只是安静地利用了'管理他的成本 > 忍受他的成本'这个数学事实，舒舒服服搭了个便车。"}},{stem:"周五下午，班主任在班里宣布：'明天带你们去看一个特别好的展览，都打起精神。'你兴奋了一整晚，睡前还在想象是美术馆还是科技展。第二天到了地方，你抬头一看——是个党史教育基地，展板上全是掉了漆的老照片，讲解员的扩音器还带着杂音。你心里其实有点失望。参观结束后，几个同学凑在一起聊天，你本来想说'就那样吧，挺无聊的'，可话到嘴边又咽了回去——因为你觉得说'不好看'好像显得自己没文化、没觉悟。结果一圈聊下来，你惊讶地发现大多数人都说'还行吧'，每个人脸上都有种微妙的心照不宣。这种'没人敢说真话，于是假共识越滚越大'的现象，有个专门的名字：",options:["信息瀑布——前面的人先说了'还行'，后面的人为了不尴尬就顺着往下说，一个接一个滚成共识","群体思维——为了维护群体的和谐和团结，每个人都自觉压下了不同的想法，结果真实的意见被埋掉了","羊群效应——大家都在说好，你就稀里糊涂跟着说好，省得自己动脑也省得麻烦","沉默的螺旋——少数不一样的意见害怕被孤立所以不开口，沉默又被误当成了赞同"],answer:1,explanations:{A:"信息瀑布说的是人们忽略自己手里的信息、跟着前面人的公开选择走——比如去没吃过的店，看到别人点啥就跟着点啥。可这个场景里你心里非常清楚展览不好看，那是你的私有信息，你选择不说不是因为'大家都说好应该真好'，而是因为怕开口显得没觉悟。所以不是信息被前面的人带跑，而是意见被压住了。",B:"正确，这就是群体思维（groupthink）。当一个群体特别团结、归属感很强的时候，成员会不自觉地（有时是自发地）把不同的声音咽回肚子里，就为了维持表面的和谐。'说出来显得不合群、没觉悟'——这就是群体思维最典型的信号。著名的例子是肯尼迪总统时期的猪湾入侵：会议上没有一个人敢说'这计划有问题'，因为谁都不想当破坏团队气氛的那个人。结果呢，一帮聪明人集体做了一个糟糕的决定。其实你不是不想说真话，是怕说出来没人接、还被当成'没觉悟'——先找到一个不会评判你的地方，那些压在心里的真话，才慢慢敢冒出来。",C:"羊群效应更偏'盲从'——跟着别人做，却不一定说得清为什么。可你这里恰恰相反：你内心门儿清，也知道展览不好看，你的'还行吧'是个主动的、有意识的选择，不是因为拿不准才模仿别人。一个是不确定所以随大流，一个是确定却不敢说，差别挺大的。",D:"沉默的螺旋确实抓住了'害怕被孤立所以不表达'这个点，但它主要讲的是大众媒体环境下舆论怎么形成，是德国政治学家诺尔-诺依曼提出的，背景是全社会层面的意见流。而在班级这种小群体里，这个'因为怕破坏和谐所以压制异议'的机制，有更贴切的名字，就是群体思维。"}},{stem:"你观察到一个有点好笑的规律：每次学校放出'公开竞标'式的机会——艺术节主持人选拔啦、优秀学生代表发言啦、升旗仪式演讲啦——冲在最前面、最踊跃报名的那些人，往往并不是最合适的，反倒是最'不知道自己不合适'的人。真正有实力、上台一定稳的人，反而懒洋洋地窝在座位里，摆摆手说'算了吧，让想去的去'。你琢磨这事觉得很反直觉：按道理不是越有能力的人越该站出来吗？可现实偏偏反过来了。你把这个困惑抛给了同桌，同桌头也不抬地说：'这还不简单，自不量力的人才最积极。'这种'能力越差越意识不到自己差'的现象，有个专门的名字叫什么？",options:["胜者诅咒——这些积极报名的人高估了自己的能力，真'赢了'名额反而是搬起石头砸自己的脚","达克效应——能力越差的人越难意识到自己能力有多差，所以反而自信爆棚、最敢往前冲","逆向选择——因为信息不对称，能力差的人有更强的动机去假装自己有能力，于是把有实力的人挤走了","囚徒困境——有实力的人不报名是怕被说'爱出风头'，大家互相观望，结果谁都不出手"],answer:1,explanations:{A:"胜者诅咒专指竞拍场景——喊价最狠的人（往往是最乐观的那个）会赢，但赢了才发现付的钱远超物品实际价值。选拔主持人没有竞价这个机制，只有'行/不行'的判断，不存在'中标反而亏了'这回事。所以这个词虽然带着'自不量力'的味道，但用错场合了。",B:"正确，就是达克效应（Dunning-Kruger effect）。能力差的人不仅在某件事上表现不好，最要命的是他们还缺一项能力——意识到自己其实很差的能力。就像刚学吉他三天的人，就敢觉得自己能开演唱会了；反而是弹了三年的人，越练越清楚自己还差得远。所以报名最踊跃的不一定是实力最强的，但几乎一定是'迷之自信'最足的，那种'我行'的错觉让他们冲在所有人前面，真上台才露出破绽。好在你不是那种对自己没数的人——你心里其实藏着一股不甘，知道自己几斤几两，也清楚上台意味着什么，这恰恰是那点火种的由来。",C:"逆向选择确实有'坏货驱逐好货'的意思，但它的前提是信息不对称——比如卖二手车的人清楚自己车的好坏，而你不清楚，于是好车因为卖不上价退出了市场。可班级里没有这种信息差，谁有实力、谁在装，大家其实心里都有数。所以这不是'信息不对称下装的动力更强'，而是'越差越不自知'。",D:"社交压力确实占一点分量——有实力的人不报名，多少有点怕被说'爱出风头'。但题干的核心问题不是'为什么强者不报名'，而是'为什么最不合适的反而最积极'，达克效应精准击中的正是这一点。强者不报名不只是怕闲话，更因为知道自己几斤几两，知道上台意味着什么。"}},{stem:"高二分班那天，你在一张写满专业的表格上犹豫了三分钟，最后在'理科'那格打了个勾——理由特别简单，班主任随口说了句'理科好就业'。一年过去了，物理越来越像天书，化学方程式越叠越高，可你刷朋友圈时看见选文科的同学已经开始讨论社会学、聊起电影里的时代变迁，心里有点痒。你想过转文，可转念一想：物理已经跟了一年，化学的公式都背了一半，笔记堆了那么厚，现在换过去岂不是全白费了？而且理科的课程一环扣一环，越往上越难掉头。你叹了口气，继续在物理题里挣扎。这个'越走越不能回头'的规律，博弈论和经济学里叫：",options:["路径依赖——早期的选择像滚雪球一样把后来锁死，即使当初那个抉择不一定是最优的，你也只能顺着这条路越走越远","沉没成本谬误——都已经学了一年理科了，现在转文会觉得前面投入的时间精力全打水漂，这种心疼让你硬着头皮不回头","机会成本——你选了理科，就等于放弃了文科那条路上所有可能的可能性，代价是你再也没机会碰那些有趣的社会学","锁定效应——教育制度故意设计成让你没法随心切换，用课程体系把你牢牢焊在一条轨道上，好维持稳定"],answer:0,explanations:{A:"对啦，这就叫路径依赖。它说的是：历史上一个看起来挺随机的早期选择——你可能只是因为某位老师一句话，或者当时同桌选了理科——一旦做出，后面所有的路就开始围着它越堆越高，想掉头越来越难。就像电脑键盘上QWERTY这套字母排列，其实设计之初并不科学，打字也不见得最快，但全世界都用了几十年，所有人都习惯了，没谁有本事再推翻它重来。你选理科也是这个原理：每一门新课都建立在理科的基础上，时间越久，根基越深，回头成本就越大，于是你只能顺着走下去。路径依赖最扎心的地方在于，没人说当初那条路一定错，它只是天然地让'继续往前走'变得比'掉头'便宜太多。",B:"这个想法挺自然的，沉没成本谬误确实会让人更不敢回头：'都学一年了现在换多亏。'但它讲的是心理上的不甘心，而路径依赖更狠一点——它不是'你舍不得回头'，而是'客观上回头的门槛越来越高'。就像VHS录像带一旦占领市场，后来的磁带格式哪怕更好也挤不进来。一个是心里那道坎，一个是现实里越垒越高的墙，题目问的是后者。",C:"机会成本说的是'每个选择都意味着放弃了别的'，你选理科确实放弃了文科那些课，这没错。但机会成本是个静止的概念，它只告诉你'有代价'。路径依赖强调的却是动态过程——代价不是一开始就那么大，而是随着时间推移越来越贵、越来越难回头。一个在看'放弃的东西'，一个在看'越走越死'的变化，差在这里。",D:"锁定效应确实是路径依赖带来的结果，可你说'教育制度故意设计让你不能切换'，这就悄悄加进了一层阴谋论的味道。路径依赖很多时候是自然发生的：不是谁在幕后编排好，而是系统自己慢慢长成了这个样子。QWERTY键盘没有哪个大魔王逼全世界用，你选理科也不是被谁焊死的，只是走着走着就难回头了。"}},{stem:"你和三个朋友约吃饭，一个闹着要吃火锅，一个念着日料，另一个惦记韩餐，你其实都觉得可以试试，反正都不挑。为了不吵架，你们决定投票，少数服从多数。第一轮：火锅对日料，火锅赢。第二轮：日料对韩餐，日料赢。你正要宣布结果，突然顿了一下，觉得哪里不对——要是不按这个顺序投，让韩餐直接和火锅碰一碰呢？换个先后，最后胜出的可能完全是另一个菜。三个人的偏好明明都摆在那，怎么就凑不出一个让大家都服气、又稳定不变的选择？这背后的数学事实是：",options:["投票悖论——同样的三个人同样的偏好，只要换一下投票的先后顺序，就可能冒出完全不同的胜者，结果像变魔术一样没谱","布坎南公共选择理论——投票的结果其实是被投票的程序操纵的，先后顺序、分组方式都会偷换掉民意，民主程序本身带着内在缺陷","孔多塞悖论——多数人的偏好加在一起可能形成一个循环，A赢B、B赢C、C又赢A，转一圈回来根本没有稳定的胜者","阿罗不可能定理——当选项超过两个时，不存在任何一种投票方法能同时满足几个看起来很合理的条件，完美反映偏好这件事在数学上做不到"],answer:3,explanations:{A:"这个想法很接近，投票悖论确实描述的就是'同样的偏好、换个顺序就换出不同胜者'这种乱象，方向没错。不过题目问的是'这背后的数学事实'，最根本的答案要落到阿罗身上。投票悖论是现象，像看到水面起了漩涡；阿罗不可能定理才是那个说'漩涡必然存在'的数学证明。一个是看见了怪事，一个是证明了怪事躲不掉。",B:"布坎南的公共选择理论确实在研究投票程序和结果之间的关系，也承认程序会被操纵，这没错。但阿罗不可能定理是更硬核的一层：它不是'程序有缺陷、可以被优化一下'，而是'无论你怎么设计程序，都做不到完美'。一个是说'这里有毛病，改一改'，一个是说'这毛病是数学上治不好的'，程度差了一大截。",C:"孔多塞悖论确实是阿罗不可能定理的一个具体样子——个人的偏好放到集体层面，传递性就崩了，形成一个循环。但它是个具体的案例，就像你看见三道菜打架打成了死循环。题目问的是'为什么会这样'那个更底层的原理，那就得回到阿罗的定理上：孔多塞悖论是病例，阿罗定理是病因。",D:"对啦，这就是阿罗不可能定理。1972年它还拿过诺贝尔经济学奖。阿罗用数学严格证明了一件有点让人丧气的事：当选项超过两个，就没有任何投票方法能同时满足几个看起来天经地义的条件——比如'如果所有人都喜欢A胜过B，那投票结果也应该是A胜过B'。听着多合理啊，可一旦选项多了，这些条件就会打架，怎么也凑不齐。所以你们三个人选餐厅选得鸡飞狗跳，真不是你们不会投，而是数学上早就证明了你选不出一个完美的结果。这跟打游戏组队时吵着选哪个英雄是一个道理，人一多、选项一多，'完美公平'就是个不存在的幻影。"}},{stem:"上周，你顶着大太阳排了整整一小时队，终于买到那杯38块的网红奶茶，吸第一口觉得值爆了，还拍照发了朋友圈。今天你又路过同一家店，发现门口冷冷清清，一个排队的人都没有，店员闲得在擦台面。按说现在不用等、随到随买，应该更开心才对，可你停了两秒，一点想买的欲望都没了，甚至开始怀疑'这家的奶茶真的有那么好喝吗'，转身就走了。同一个人、同一家店、同一杯奶茶，怎么排不排队就天差地别？你这种'没人排队反而不买'的行为，最精准的解释来自哪个学科？",options:["社会学：社会认同原理在起作用。第一次你眼前有几十个排队的人，等于几十条'这家值得'的社会证据，帮你补足了判断；第二次没了这些证据，你没法独立判断质量，而对不确定性的默认反应就是不动，这本质是社会学习里的一次信息级联中断","心理学：第一次排队制造了认知失调——为了压下'排一小时只喝到普通奶茶'的蠢感，你的大脑硬把'排队'包装成'值得'，形成了'人多的店等于好喝'的锚。没人排队时这个锚被打破，那股消费冲动自然就消失了","生物学：多巴胺回路在排队那会儿就已经提前启动了，研究显示期待奖励时的多巴胺峰值甚至高过真拿到手的那一刻。第一次排队让多巴胺断断续续分泌了一小时；第二次没了这份延迟期待，多巴胺基线太低，托不起出手消费的劲儿","经济学：这是典型的凡勃伦效应。排队本身就是商品的一部分——你买的不仅是奶茶，还有'我买到的是稀缺款'这个信号价值。一旦排队消失，信号价值归零，总效用掉到价格以下，这笔交易自然就不成立了"],answer:1,explanations:{A:"这个角度有道理，社会认同确实能解释'第一次为什么排',几十个人站在那本身就是一堵'大家都说好'的证据墙。但它讲的是第一次的从众，没接住题目真正问的那半——第二次没人排队了，为什么你反而掉头就走。社会证据没了，人其实还可能因为习惯照样去买，所以它不够精准。",B:"对啦，这是认知失调理论，1957年Festinger提的。人要是经历'付出和回报对不上',心里就会发痒，于是大脑会自动改一改想法来让这口气顺过来。你排了一小时、花了38块，结果就是杯普通奶茶，这摆不平；于是你悄悄把'排一小时队'重新解释成'这店真值得',排队的苦变成了甜。'人多的店等于好喝'这个锚就钉死了。等到没人排队的那天，锚突然空了，你终于有空间冷静回想：它好像真的没那么特别。这跟追一部全网都在吹的剧差不多——追的人越多你越觉得好，等热度散了，你才发现它其实就是个普通剧。",C:"多巴胺那段研究说的是'期待奖励比拿到奖励更high',这本身没错，可它套不上你第二次的处境。第二次你压根没产生'想买'的冲动，多巴胺连启动都没启动，更谈不上分泌太少。它更适合解释社交媒体那种不断刷新的上瘾，拿来形容一杯奶茶有点用力过猛。",D:"凡勃伦效应讲的是炫耀性消费，比如买奢侈品、背名牌包，靠'贵'和'稀缺'来给旁人发信号。38块的奶茶带的那点信号价值其实很有限，远不到奢侈品那个级别。所以它不够精准——题目里的关键是'排队带来的心理反差',不是'这杯奶茶多能装点门面'。"}},{stem:"你的手机里一度塞了6个学习APP，背单词的、番茄钟的、刷题的、打卡的，全都齐了，打开一眼望过去特别有'鸡血感'。可怪的是，效率一直上不去，一晚上就在六个APP之间切来切去，好像忙得不行，回头一算真正记住的东西没多少。某天你实在烦了，一怒之下全删光，只留一个最朴素的笔记软件。结果第二天开始，学习效率像开了挂一样往上蹿，同样是那几个小时，能记住的内容翻了快一倍。这到底是怎么回事？这背后最精准的解释来自哪个学科？",options:["神经科学：APP的通知触发了手机上那种间歇性的变量奖励机制——和老虎机一个道理，你永远猜不准下一次通知是什么、有没有'学习成就',这让大脑的多巴胺系统被低强度反复撩拨，慢慢成了轻瘾。删掉后，大脑才重新找回专注需要的那种稳定的乙酰胆碱释放节律","哲学（现象学）：APP把你的学习'中介化'了，你不再直接面对知识，而是隔着界面、积分、排行榜去间接'感知'学习。删掉APP本质上是海德格尔说的'去蔽'——撤掉那层中介，让知识本身向你显现","认知心理学：APP之间的多重任务切换产生了注意力残留效应——每次从背单词跳到计时再跳到刷题，上一个任务的注意力不会马上清空，残渣还占着工作记忆。删到只剩一个，你能单任务深度加工，编码效率自然翻倍","行为经济学：APP造出了一种'学习的幻觉'——你在APP上的每个点击、每次打卡、计时都给你即时满足，悄悄替代了真正的学习反馈回路。这是典型的框架效应：你不知不觉把'打开APP'和'正在学习'划了等号，其实开APP和开游戏没差多少"],answer:2,explanations:{A:"这个老虎机的比喻挺生动，多巴胺被通知一次次勾着确实像上瘾，但它更适合解释社交媒体那种高频刷新的成瘾。学习APP的通知实在没密到能形成稳定的强化节奏，说它靠多巴胺拖垮你，证据有点虚，不算最精准。",B:"'中介化'和'去蔽'这套现象学说法挺有味道，听着特别高级，但它其实是个批判性的概念，更像在评论'学习变成了什么',而不是在解释'删掉后效率为什么具体翻倍'。它缺少一条能落地的因果路径，所以再有趣也够不到'最精准'。",C:"对啦，这就是注意力残留效应，2009年Leroy团队研究的，是信息时代最被低估的一种认知损耗。实验证明，人从一个任务切到另一个之后，前一个任务的注意力不会立刻清干净，会像撒了一地的水一样残留15到20分钟。你装6个APP，一晚上在背单词、计时、刷题之间轮番切，等于从早到晚从没真正钻进过任何一个任务，时间全花在'切换'和'回收注意力'上了。删到只剩一个笔记软件，你就被迫单线程深度钻一件事，编码效率自然翻倍。这跟打游戏时老是被消息弹窗打断、回不过神来是一个道理——频繁切换才是真正的隐形杀手。",D:"框架效应确实能解释'为什么你以为自己在学',打开APP打卡带来的即时满足让你误以为动了脑子。但题目问的是'删掉后为什么真的学得好',那是另一个层面的问题。它回答的是错觉从哪来，没回答效率怎么涨上去，答非所问了。"}},{stem:"有天你收拾鞋柜，翻出一只穿了挺久的左脚鞋，鞋底都快磨平了，另一只早就不知道丢到哪去了。你想着扔了怪浪费，干脆挂上闲鱼图个乐子，标价2块钱，文案随手一挥写成'绝版左脚限量款，仅此一只'。挂完你就没再管，继续刷剧去了。结果没一会儿手机开始叮叮响个不停，你点开一看傻了眼——这条链接像点燃了什么，一下涌进来15个买家，从2块钱开始你追我赶地竞价，数字一路往上跳，最后停在88块钱才成交。你盯着那88块愣了半天:一只破鞋，还是单只的左脚，居然真有人愿意花88块买走。你翻来覆去想不通，这些买家到底图个啥？这背后最精准的解释来自哪个学科？",options:["行为经济学（禀赋效应）：买家一旦开始出价，心里就冒出了'我已经快拥有了'的占有感。这种虚幻的所有权让他们愿意掏出远超理性估值的钱去'保住'快到手的东西，每一次加价都是一次微小的禀赋强化","博弈论：15个人竞拍本质上是一场共同价值拍卖，每个人都琢磨'别人愿意出价，说明这东西真有价值',于是一条信息瀑布倾泻而下——第一个出2块，第二个出5块，后面的人就不断上调自己的估值，最后成交价远超任何一个人独立的判断","经济学（信息不对称）：买家们的出价行为，其实替你揭穿了一个你完全不知道的信息——有人恰好缺一只左脚的鞋。市场价从来不是由成本决定的，而是由买卖双方信息的匹配度决定。你以为它是0元的破烂，可现实里有个'右鞋找不到左鞋'的人，他愿意出到接近鞋原价的钱","市场营销学：你的文案'绝版左脚限量款'是一个天才级别的重新框架——你把'只有左脚'这个缺陷重新定义成了'限量款'这个稀缺卖点。买家买的根本不是鞋子，是你搭出来的那个故事，本质上和钻石商把碳元素包装成'永恒之爱'是同一套操作"],answer:2,explanations:{A:"禀赋效应讲的是'一旦你拥有一样东西，就会高估它的价值',可它说的是卖家高估自己的东西，而这题里主角是买家在竞价。买家出价越来越高，不是因为拥有了鞋而舍不得，恰恰相反，他还没拥有。这个概念用反了位置，所以不是最准的那个。",B:"共同价值拍卖和信息瀑布确实能把'价格为什么飙到88'讲得明明白白，别人出价→你跟着上调估值，滚雪球一样涨。但它只解释了'价怎么炒上去',没解释'为什么最一开始有人愿意出价'。要是没有那个缺左脚鞋的初始买家，竞拍连头都开不起来。",C:"对啦，这就是信息不对称，1970年阿克尔洛夫研究的，靠它还拿过诺奖。关键在这：你当卖家的，压根不知道世界上有个人正缺一只左脚的鞋；而买家们一轮轮出价，等于在向你喊话'这玩意儿对我有用'。市场价从来不看东西的成本，只看买卖双方手里的信息对没对上。你以为手里的是个0块的破烂，结果一撮人正满世界找左边那只，愿意出到接近鞋子原价的价。这就像你以为自己在卖没人要的东西，结果发现有人正缺它缺得要命。信息一通，价格立马不一样。",D:"'重新框架'这个说法很漂亮，把'缺陷'说成'稀缺'确实是营销的拿手好戏，你当初那条文案也确实碰巧戳中了。但重点是:你写文案时根本没想营销，你连'重新框架'这个词都没听过。它解释的是文案怎么起效果，不是这笔交易为什么能成立——没有那个真需要左鞋的人，文案写得再花也白搭。"}},{stem:"翻开日本古代贵族的审美史，有条让现代人摸不着头脑的规矩：贵族女性流行把牙齿染黑，美其名曰'御齿黑'，黑黢黢的一排牙在当时是顶级美的标志。这事传到外地，就有聪明的穷姑娘动了心思——她们买不起染牙的材料，可架不住正好蛀牙，牙天生就黑。于是她们也逢人就说自己'染了牙、是名门出身'，居然真有人信，还嫁进了豪门。新郎掀开盖头，看见一排黑牙，满心以为娶回了大家闺秀，其实是一口烂牙。这个'高贵的美学符号，被蛀牙冒充'的故事，最精准的解释来自哪个学科？",options:["经济学里的逆向选择——这是个经典的'柠檬市场'问题。买家（新郎）婚前没法辨别'染黑牙'（好货）和'蛀黑牙'（烂货），于是彩礼就按平均品质来定。真去染牙的好姑娘觉得被低估了就退出，最后市场上只剩蛀牙的。这新郎就是逆向选择的倒霉蛋。","人类学里的文化资本——'御齿黑'是布尔迪厄说的文化资本，它把生物上的不健康（黑牙）反过来编码成文化上的高贵（美人）。蛀牙能冒充成功，是因为文化符号和生物信号在外观上长得一模一样。这不是诈骗，是两套符号系统撞了个惊人的巧合。","社会学里凡勃伦的炫耀性消费——染黑牙骨子里是炫耀性消费：'我有闲钱，把健康的牙故意染成不健康的颜色'，这和今天买超跑'我有闲钱买辆不实用的车'是同一套逻辑。凡勃伦叫它'代理有闲'——女人的黑牙炫的是父亲的财富，不是自己的审美。","生物学里的信号理论——自然界里，诚实的信号和造假的信号有个关键区别在成本。富家女染黑牙是在说'我有钱也有健康'（诚实信号），穷家女蛀黑牙也在说同样的话（假信号），但成本不一样：染牙要花钱，蛀牙反而省钱。这不是审美问题，是生物学里经典的'低成本模仿高成本信号'。"],answer:3,explanations:{A:"逆向选择和柠檬市场这事本身挺好懂，'劣币驱逐良币'的画面也很形象。但题里的关键不是'好货被气走、市场只剩烂货'，而是新郎压根不知道黑牙这玩意儿有两种来路——他眼里黑牙就一个含义：贵族美人。这不是逆向选择里你说的'知道有柠檬却分不清'，而是他连柠檬的存在都没意识到，属于信息不对称的维度搞错了。",B:"文化资本这个角度确实有洞见，把'不健康被反过来编成高贵'讲得挺妙，'两种符号撞了巧合'也说得通。但这个解释有点太轻了，像是给个说法就完事。它没回答一个更狠的反问：为什么染牙偏偏要染成蛀牙天然就有的颜色？要是当年贵族流行染蓝牙，而世界上没有天生的蓝牙，这种'假货'就根本无从下手。所以关键不是巧合，而是成本差这个硬逻辑。",C:"凡勃伦的炫耀性消费，把染黑牙解释成'炫富'，这个社会功能说得没错，和超跑确实是一个味儿。但题里最精彩的那股劲儿——蛀牙为啥能冒充染牙——它一个字没碰到。炫耀性消费的框架下，谁都能去炫，穷姑娘要是也蛀着黑牙，那她算不算也在'炫耀'？显然不算。所以它解释了染牙的意义，却解释不了冒充这件事。",D:"对啦，就是信号理论，这套思路最早是生物学家扎哈维在1975年讲明白的。核心就一句话：信号要可信，得靠成本撑着。孔雀开屏就是经典例子——那么大一屏又重又不方便跑，摆明了是想说'我健康到连这种累赘都扛得住'。染黑牙也是一个意思：'我有闲钱，把好端端的牙染成黑的给你们看'，这是在用花钱发出诚实的信号。而穷姑娘蛀牙，是用零成本去模仿这个高成本信号，跟无毒蛇模仿毒蛇的花纹一个套路。等哪天真的要被细看（比如门当户对的牙医一瞧），低成本模仿就露馅了。生活里这种'用便宜货冒充贵信号'的事到处都是，识别的钥匙就一把——看它到底付出了什么成本。"}},{stem:"被甩那天你一句话没说，回家就办了张健身卡，接下来两个月像上了发条：早上五点起来，深蹲练到力竭干呕也不停，朋友的聚餐全推了，体脂率一路掉到18%，马甲线清清楚楚。镜子里的那个人，眉眼还是你的，可气质像是换了头换了心。你满心以为，等自己变得足够好，那种被抛弃的疼就该自动消失了。可真站在镜子前，你盯着这一身线条，心里却猛地空了一大块——身材变了，可被甩的滋味一寸都没挪走。你突然有点迷茫，这两个月到底在忙活什么。这种'因为失恋拼命变好、变好后却更不开心'的心理机制，最精准的解释来自哪个学科？",options:["存在主义心理学里弗兰克尔的意义真空——失恋把你原来的意义系统（'我们的未来'）整个砸掉了，你急着找新意义，健身就临时填了这个空。但弗兰克尔说，替代的意义得指向一个真实的人或事才管用；'为自己变好'如果只是为了演给前任看，那它从第一天起就是个假意义，迟早要塌。","行为经济学里的峰终定律——你脑子里存的是'被甩'的峰值痛苦和'照镜子看到腹肌'的终值惊喜，可中间那两个月里每天凌晨五点的深蹲、力竭后的干呕、推掉聚餐的孤单，才是你真正熬过来的。峰终定律骗了你，让你以为整段经历都值得，直到'终值'那股兴奋散掉，中间那些苦才重新浮上来。","生物学里睾酮与皮质醇的跷跷板——失恋会让皮质醇（压力激素）飙升，身体就自然会去提升睾酮（竞争、支配的激素）来回血，而健身正好是最省事的升睾酮办法。但睾酮带来的'胜利感'不等于真幸福，你的大脑把'激素反弹'错读成了'我在变好'，等激素回到基线，你才反应过来问题根本没解决。","心理学里的替代性补偿——你的健身是典型的替代性补偿，用'身体变好'去补偿'关系失败'。问题是，补偿行为带来的满足，来自'我丢了X、却重建了Y'这个比较，而不是来自Y本身。等补偿完成（腹肌出现了），比较的架子一散，你就会发现——腹肌本身对你毫无意义，这就是镜前那种空。"],answer:3,explanations:{A:"弗兰克尔的意义真空确实有深度，'失恋砸掉意义系统、急着找替代'这个画面也很准。但它对'为自己变好'的判断稍有点偏——这事真正的坑不在于它是假意义，而在于你从头到尾没把它当第一意义，你的第一意义其实是'让前任后悔'，健身只是手里那把工具。工具用完，人就空。",B:"峰终定律讲的是人回忆起一段经历，只记住最痛的高峰和最爽的结尾，中间全给抹了。这确实能解释'为什么你回头想想，觉得那两个月挺值'。可题里的矛盾发生在当下——你是站在镜子前，此刻就觉着空，这时候峰终定律就使不上劲了，因为它只管事后回忆，不管即时体验。",C:"激素的跷跷板看着挺硬核，也确实存在——失恋压力一大，身体想靠升睾酮来平衡，健身正好送上门。但这里有个因果被悄悄换了：升睾酮是健身的结果，不是你去健身的动机。'失恋→健身→激素爽'这条链，前两环不是生理决定，是你自己选的。它讲的是你变好的生理过程，没讲你为啥还是不开心。",D:"对啦，就是替代性补偿，这套思路的根子在心理学家阿德勒的补偿理论里。核心一句话：当你在一个地方输了，人习惯跑到另一个地方去赢，用那个'赢'来盖住这个'输'。你的健身就是这样——用'身体变好了'去补偿'关系失败了'。可这种补偿有个致命漏洞：它带来的满足感，全靠'你看，我比分手时强多了'这个比较撑着，一旦镜子里那套身材到货、比较失去了对象，腹肌就只是腹肌，一堆肌肉，跟你的快乐再没关系。所以你不是白练了，是你从来想要的就不是腹肌本身，而是'要让那个人看到我变好'，这个落点一消失，心里的空就原形毕露了。说白了，靠'变得更好'来疗伤，常常是绕了个大圈，真正要面对的还是在原地等你。"}},{stem:"深夜你刷知乎，刷到一篇'普通人该怎么理财'的高赞回答，逻辑层层递进，底下还正儿八经列了17篇论文的引用。你越读越顺，读完一拍大腿：'太有收获了！'顺手点了个赞，又点了收藏，心满意足地关掉页面，感觉今天没白熬。就这么刷了三年，你的收藏夹里堆了三百多篇类似'干货'，标题一个比一个唬人，可你愣是没点开过其中任何一篇。你也不是不想学，就是每次打开收藏夹，扫一眼那长长一列，又默默退了出去。这个'点赞当学会、收藏却永不点开'的死循环，最精准的解释来自哪个学科？",options:["信息科学里的信息过载与选择悖论——你攒了三百多篇，明天的你就面对三百多个'该学哪个'的选项。巴里·施瓦茨的选择悖论说，选项越多，决策越难、满意度越低，最理性的选择反而是一篇都不看。不是懒，是你的大脑被这堆选项堵到当场'决策瘫痪'了。","行为心理学里的即时强化与延迟代价——每次'点赞+收藏'都是一次即时的正反馈，大脑'啪'地释放一小波多巴胺，让你觉得'我又学到了'。这个即时爽比'真去学习'那点延迟满足强太多，你的大脑就被喂成斯金纳箱里那只小鼠，不停按'收藏'按钮换多巴胺，按到手软。","认知心理学里的流畅性错觉——读完那篇引了17篇论文的回答时，你的大脑有种'特别顺'的体验，文本组织得好、逻辑严密，你就'感觉'自己懂了。可这'懂的错觉'和真会是两码事。流畅性错觉让你误把'收藏'当成了'学会'，而大脑的元认知监控一看这事挺顺，就偷了懒，直接判定'已经搞定了'。","行为经济学里的心理账户——你把'花时间读'记成了'学习支出'，把'点收藏'错记成'学习收入'，大脑一算这笔交易赚了：花五分钟，换了个'高质量知识'的空头承诺。可心理账户最邪门的地方在于，那个'学习收入'账户的余额你永远不兑现，因为一真兑现（真去读），就等于承认那承诺只是承诺，不是知识。"],answer:2,explanations:{A:"信息过载、选择悖论这个说法，用来解释'面对三百篇你不想动手'是通顺的，选项多到脑子卡壳、不如一篇不看，这现象真有。但它错在时机——你收藏的那一瞬间，压根就没打算以后看，你当时已经'满足'了。你根本还没走到'被选项数量压垮'那一步，先被'我好懂啊'这个感觉给骗过去了。",B:"斯金纳箱这个比喻很形象，把'点赞收藏→多巴胺→停不下来'的循环讲成了训练小鼠按杠杆。它能解释你为什么一直收藏、越攒越多，可它解释不了另一件更怪的事：为什么你一点不觉得亏。小鼠按杠杆至少还能领到食物，你按'收藏'领到的只是'将来可能有用'这个海市蜃楼，连食物都不是，可你还挺满足。",C:"对啦，就是流畅性错觉，这是两位研究者阿尔特和奥本海默在2009年拿实验坐实的概念。核心一句话：一件事读起来越顺、越不吃力，大脑就越容易误以为'我已经懂了'。他们做过一个反直觉的实验——同样的材料，用难看的字体印出来，学生的理解反而更好，就因为字难认，逼着大脑多费劲去真读。你那篇'17篇论文'的回答写得越漂亮、越顺滑，你就越中招：流畅性越高，大脑里管'我到底懂没懂'的那个元认知监控就越懒，直接盖章'学会了，收工'。而真学习是反着来的，会卡壳、会犯困、会想合上手机，那才是脑子在真啃。生活里这错觉遍地都是：视频教程看得热血沸腾，一上手改代码就傻眼；听人讲题觉得'我全会了'，一到自己写就卡住。下次感觉'懂了'的时候，不妨合上手机，自己从头推一遍。",D:"心理账户讲'把读的时间记成支出、收藏记成收入'，这个'我觉得赚了'的心理核算挺有意思，也部分解释了你那点心满意足。但它有个前提假设是——你知道'学习收入'这个余额将来是要去兑现的。可流畅性错觉真正可怕的地方正在于：你压根没意识到还需要兑现，因为你心里早就'学会'了，余额在你这里是已经结清的账单。"}},{stem:"杨贵妃爱吃荔枝，这事人人知道，但真正让她眼眶发红的是另一件事：唐玄宗为了让她吃上一口所谓新鲜荔枝，专门修了一条驿道，派驿卒骑马接龙，一路上跑死了八匹马。荔枝从南边送到长安，早就没那么新鲜了，可能还有点酸。可据说贵妃拿到手的那一刻，心里翻涌的不是'怎么这么酸'，而是满满的感动。旁边的小宫女看不懂，小声嘟囔：'跑死八匹马就为了送个酸果子，图啥？'贵妃却红着眼笑。她这份'因为跑死八匹马而感动，而不是因为荔枝好吃而感动'的心思，最精准的解释来自哪个学科？",options:["传播学（麦克卢汉的'媒介即讯息'）：'荔枝道'不是运输工具，它就是讯息本身——'皇帝对贵妃的爱是超越地理极限的'。酸荔枝不重要，因为真正被消费的不是水果，而是'荔枝道'这个媒介所承载的权力叙事。甚至荔枝越酸，讯息越强烈——'为了酸的我也愿意'比'为了甜的'展示了更多的权力。","进化心理学（亲代投资的信号）：男性通过展示'我愿意为你付出巨大的、不可回收的资源'来证明承诺的诚意。八匹马是不可回收的沉没成本——这正是进化心理学中'昂贵信号'的精髓。贵妃的感动是一种进化上被校准过的反应机制——'他愿意为我浪费这么多资源，他是认真的'。","行为经济学（劳动幻觉）：人们倾向于认为'投入的努力越多，结果就越有价值'。这是劳动幻觉的经典案例——荔枝本身的价值被'运输成本'的叙事覆盖了。贵妃吃的不是荔枝，她吃的是'800里×8匹马×N条人命'加持过的符号。这和手工巧克力比机器巧克力'更好吃'是完全一样的机制——你知道没有区别，但还是觉得有。","社会学（凡勃伦的炫耀性消费和代理消费）：玄宗的'荔枝道'本质是帝王级别的炫耀性消费。但更有趣的是杨贵妃的角色——她是'代理消费者'，通过消费荔枝来完成玄宗的地位展示。贵妃的感动不是因为爱情，是因为她完美地扮演了'价值消耗体'的社会角色：'我的存在值得让皇帝跑死八匹马'。"],answer:2,explanations:{A:"这个讲法很漂亮，媒介即讯息确实是麦克卢汉的名言：有时候传递的'管道'比'内容'本身更要说故事。但它卡在一个地方——传播学关心的是'讯息怎么到达、到达了什么'，却不解释'人为什么会感动'。感动是一个发生在心里的情绪事件，不是一次信息解码。把'讯息越强烈'和'心潮澎湃'直接画等号，中间少了一截。贵妃不是读到了一条震撼的推送，她是身体发紧、眼眶发热，这得由研究大脑和情绪的那套理论来接管。",B:"进化心理学的昂贵信号确实能漂亮地解释玄宗这边的账：他愿意烧掉八匹马的沉没成本，等于在向全世界广播'这段情是真的'。但它解释的是'他为什么愿意花'，没接上'她为什么感动'。进化机制最多能说'这个信号可信，所以她的判断系统应该为它盖章'，可信和感动是两码事。一个人可以相信对方付出了很多，内心却毫无波澜。贵妃那种胸口一热的感觉，不是'认可'两个字能装下的。",C:"正确，这是劳动幻觉。大脑有个很实在的毛病：一件事里你付出得越多，越觉得它值钱。研究里做过实验，同样是宜家家具，告诉一个人'这是你自己组装的'，他给的估价能高出六成以上，哪怕螺丝拧得歪七扭八。贵妃吃的不是酸荔枝，是那八百里的尘土、八匹累死的马、无数驿卒的命叠出来的故事——这份辛苦让一个酸果子在嘴里有了甜味。就像手工巧克力，明明和机器做的一个配方，你就是觉得它更香。下次赶作业熬到半夜，交上去的那一刻忽觉得这作业还挺有分量，也是这毛病在作祟。",D:"这个角度挺聪明，凡勃伦的炫耀性消费点到了皇家排场，代理消费点到了贵妃的角色。但它把贵妃的感动归给了'扮演地位展示的消耗品'，说得她像一枚会动的勋章。可感动是一种很私人的、从胸口漫上来的东西，不是一个社会角色被完美履行的奖状。而且炫耀的主体是玄宗，是他要用八匹马向天下人抖威风，贵妃在旁边接住了这份排场里的甜味，这份甜从何而来，凡勃伦没往下讲。"}},{stem:"深夜两点，宿舍都熄了灯，小陈抱着手机跟ChatGPT聊了半天，结果它第N次答非所问，把两道送分题都答歪了。她气得太阳穴突突跳，噼里啪啦敲了一长串脏话甩过去，手指戳得屏幕啪啪响。过了几秒，屏幕那头回了一句：'抱歉让你感到不舒服，我确实有时候不能完全理解你的意思。'看到这行字的瞬间，你胸口那团火莫名其妙泄了一大半。可你心里门儿清——对面就是一堆代码，它没有心，也不会真的内疚。你一边骂自己傻，一边还是消了气。这种'明知AI没有感情，却因为它的道歉消气'的古怪反应，最精准的解释来自哪个学科？",options:["传播学（拟人化与准社会互动）：人类对任何表现出'类人'交互模式的实体都会启动'准社会互动'——把非人对象当作社交对象。AI的道歉触发了你的准社会关系处理回路。这是为什么你会生Siri的气、会对扫地机器人说'谢谢'、会在AI道歉时原谅它——不是因为你觉得它有感情，是因为你无法关掉'把对话对象当人'的默认设置。","神经科学（镜像神经元与移情系统）：人类的镜像神经元在看到他人（甚至AI生成的文字）表达悔恨时会被激活。虽然你的前额叶告诉你'这是代码'，但你的边缘系统（情绪脑）已经被'抱歉'这个词的神经表征激活了。你的情绪脑比理性脑快了约200毫秒——在这200毫秒内，原谅已经发生，理性只是事后找个理由。","进化心理学（社会交换的模块化大脑）：你的大脑不是一个整体，而是多个专门模块的集合。'语言理解'模块识别了道歉的语义结构，触发了'社会和解'模块——这个模块的进化年龄以百万年计，它不关心道歉者是真人还是代码。只要输入匹配'道歉'的模式，它就输出'原谅'。你的理性大脑（前额叶）知道这是代码，但模块化的大脑在执行层面不听理性的话。","认知心理学（情绪的社会功能理论）：愤怒不是一种自发的内心状态，而是一种社会信号——它的功能是向对方传达'你的行为损害了我的利益'。AI的道歉完成了这个信号的闭环：你发送愤怒→收到道歉→信号目的达成→愤怒消退。整个过程不需要AI有感情，只需要道歉的语义结构触发你的'信号闭环确认'机制。"],answer:2,explanations:{A:"这个说法很贴近生活，准社会互动确实解释了我们会不自觉地跟非人的东西套近乎——对扫地机器人说谢谢、对Siri发火，都是因为脑子里那套'跟人打交道'的开关关不掉。但它回答的是'你为什么会把AI当人'，没接着解释'道歉为什么管用'。你也会收到真人的道歉，可不一定次次都消气，准社会互动并不会自动等于原谅。消气这一步，需要另一套更底层的机制来接。",B:"镜像神经元这个说法有股科学片的味道，但把它套到'读到道歉文字'上有点用力过猛。镜像神经元最扎实的证据是看动作——看到别人抬手、做表情，你脑子里对应的区域也跟着亮。对着一行冷冰冰的文字说'它会激活'，目前并没有过硬的证据板。而且就算情绪脑快那么两百毫秒，也解释不了那场火为什么泄下去，只是给'原谅已经发生'换了个说法而已。",C:"正是这样，进化心理学管这叫模块化大脑。你的脑子不是一间大办公室，而是一座由许多专门小工坊组成的老厂房。其中有个'社会和解'工坊，进化了上百万年，专门识别'和解的信号'——道歉该有的样子、让步该加的尾巴，它一看就懂，马上开闸放人。它压根分不清对面是真人还是代码，只要输入的句式和语气对上了模板，它就按下'原谅'键。你前额叶里的理性当然知道那是代码，可这个老工坊从来不跟理性请示，等你回过神，火已经泄了。就像看见电视剧里反派哭，明知是演的，眼眶还是不争气地酸。",D:"这个信号闭环画得很工整，愤怒是信号、道歉是回应、闭环完成火就熄，听起来顺。但它把愤怒当成了纯粹的'功能按钮'，可愤怒从来不是一键发送。要是你打心底认定AI没感情，那第一击的愤怒恐怕压根就不会响起来——谁会冲着角落里的石头咆哮呢？你之所以气，正是因为心里某处已经把它当成了可以讲理的对象，而这个'当成了'，恰恰是模块化大脑的活计，不是信号闭环能兜住的。"}},{stem:"语文课本推过泰戈尔，有句诗流传很广：'世界以痛吻我，要我报之以歌。'大意是：被生活狠狠打了一拳之后，不但不还手，还要把这份痛搓成美好的东西，再还给这个打过你的世界。小陶合上那本借来的诗集，靠在窗边托着腮，把这句话默读了三遍，越想越发愣：这不就是被人迎面泼了一身冷水，还踉跄着去烧了壶热茶，再稳稳端回对方手里吗？她憋着一肚子好奇，想知道从经济学角度看，这种'把痛苦转化成好东西再还回去'的劲儿，最像下面哪个概念？",options:["逆向选择——被世界选中挨打的人，恰好是最不会反击的人，这是信息不对称的结果","比较优势——挨了打还要唱歌，是因为你唱歌成本比别人低，用歌'出口'换取别的东西更划算","反身性——你对痛苦的反应本身会改变痛苦的后果，反馈回路重塑了现实","创造性破坏——痛苦是旧秩序崩塌的信号，创新和价值会从废墟中重新长出来"],answer:3,explanations:{A:"这个想法挺自然的，但搭错了线。逆向选择讲的是信息不对称的坑：因为一方藏了底牌，结果好东西被挤走、差东西占了上风，就像二手车市场里好车卖不掉。它关心的是'世界挑了谁来挨打'，可泰戈尔根本没在选人，他讲的是'挨打之后你打算怎么办'。把被打和反击能力挂上钩，是把两个人的提问硬拧到了一起。",B:"比较优势讲的是交易里各干各擅长的活：你能低成本唱歌，就专心唱歌去换别的东西，大家好商量。但诗里的唱歌不是一笔划算买卖，是胸口挨了一拳之后，硬把疼转成了歌声。这里没有成本核算，没有谁和谁交换，只有一个从'被动挨打'到'主动创造'的转身。拿算盘去量一滴眼泪的重量，量不准。",C:"反身性是索罗斯爱讲的词，说的是你的看法会反过来改变现实，认知和世界互相拉锯、滚成循环。可泰戈尔的诗里没有这种来回搅动的循环——它不是'我的反应又改变了痛苦的结果'，而是单向的一次转化：痛进来，歌出去。顺着一个方向走，不回头再咬一口，所以不是反身性那个圈。",D:"没错，就是创造性破坏，这是经济学家熊彼特的招牌说法。他讲的是：旧的东西塌了不是终点，反而是新东西破土的信号，新点子、新价值就爱从废墟缝里往外钻。'报之以歌'不是咬牙忍着，是把痛苦当成原材料，重新捏出一个漂亮东西还回去。就像一块玻璃碎了，有人没只盯着满地碎片叹气，而是把它们一片片拼起来，做成了一盏会发光的灯。被生活泼了冷水，那就顺手把它烧成热茶端回去——痛不白痛，它也可以是下一次起跳的垫脚石。"}},{stem:"电影《肖申克的救赎》里有个让人浑身起鸡皮疙瘩的情节：安迪对瑞德说，'地质学教会我一件事——如果时间够长，水可以穿透石头，不是靠力量，是靠持之以恒。'说这话时，他手里还藏着那把小得可怜的石锤，正用它日复一日、一寸一寸地凿着牢房的墙。他不吵不闹，不跟任何人起冲突，只是把每一晚那点力气都磨在墙上，一天又一天，磨了整整十九年。这种'不靠爆发力、只靠耗时间磨到对手先垮'的耐心套路，最后在博弈论里对应哪种策略？",options:["懦夫博弈（Chicken Game）——谁先退缩谁就输，拼的是一瞬间的胆量而非耐力","一报还一报——每轮重复上一轮策略，靠镜像对手来维持合作","针锋相对（Tit-for-Tat）——你友善我友善，你背叛我背叛，反复互动中建立均衡","消耗战（War of Attrition）——僵持中比拼谁撑得更久，坚持到最后的人通吃"],answer:3,explanations:{A:"懦夫博弈也叫'谁是胆小鬼'，是两辆车对撞，谁先打方向盘谁就丢脸，拼的是一瞬间谁更敢豁出去。可安迪的对手不是迎面冲来的车，他完全不赌那一下的胆量——他用的是十九年的水磨工夫。一场拼耐力的长跑，硬套一场拼胆量的对撞，味道整个不对了。",B:"一报还一报听着也讲'持续'，可它的前提是两个人你来我往：你合作我就合作，你使坏我就还手，一来一去看谁先改主意。安迪的好戏却是独舞——监狱压根不知道有个人在墙里挖了十九年，他的'对手'甚至没意识到这场博弈的存在。没有台上的对手，也就谈不上镜像和回击。",C:"针锋相对和一报还一报是近亲，核心都是'照着对方上一手的动作来'，你给糖我递糖，你捅刀我抽刀，在一来一回里慢慢磨出个平衡。但它建立在'两个人盯着彼此互相比划'上。安迪的墙里没有这种互动，他跟前只有时间和石头，是一场没人回应的独角戏。",D:"正是，消耗战说的就是双方僵着，比谁先撑不住，谁熬到最后，谁就把整盘端走。它不拼爆发，不拼花招，只拼一件事——谁能耗得更久。安迪不用一根铁棍把墙捅穿，而是让水一样细的耐心，一滴一滴把石头滴穿。十九年，不是一击致命，是硬熬到对手的时间和耐心先见了底。这大概就是那句老话的反面：慢，有时候才是最快、最稳、也最让人想不到的一条路。它不声不响、毫不张扬，最后却在湍湍的时间里悄悄赢了下来。"}},{stem:"深夜的出租车上，电台突然放了周杰伦的《一路向北》，那句'我一路向北，离开有你的季节'一出来，小陈的眼睛就红了。他不是真的要开车往北跑，可那句歌词像一把钥匙，捅开了他心里那扇一直没锁上的门——分手已经半年，他还是会翻旧聊天记录，会盯着前任的头像发呆。他明白一个道理：让他念念不忘的，未必是那个人有多好，而是那段感情里他已经投进去、再也拿不回来的东西。从行为经济学的角度看，这个'一路向北'的背后，他最可能在逃避的是什么？",options:["框架效应——换个方向看同一段关系，感受就完全不同，向北只是换了参照系","现状偏差——你宁愿留在已经糟糕的关系里，也不愿面对不确定的未来","损失厌恶——你念念不忘的不是那个人，是你已经投入却收不回来的情感沉没成本","禀赋效应——你高估了那个'拥有'过的人的价值，离开意味着承认自己当初看错了"],answer:2,explanations:{A:"框架效应讲的是同一件事换个说法，你的选择就跟着变，比如'成功率九成'听着比'失败率一成'顺耳。可歌词不是把小陈的关系换了个包装，他是真在物理上加心理上地跑远，一脚油门往北开。这跟'重新描述同一段关系'根本不沾边，是两条路。",B:"现状偏差说的是人宁可待着不动、哪怕现状已经烂了也不肯换，因为换意味着未知。可小陈恰恰在动——他一路向北，跑得比谁都快。所以他不是怕改变，反而是在用离开这种最干脆的改变，去躲开那些已经沉底、捞不回来的东西。方向整个反了。",C:"正确，这是损失厌恶，行为经济学里最出名的一条：失去一样东西的痛，是得到同等东西时快感的差不多两倍。所以小陈'一路向北'不是因为前方有多好，是因为他不敢回头——一回头，那些投进去的时间、情绪、精力全都摊在眼前，全是收不回来的沉没成本。他放不下的不是那个人，是那股'我付出了这么多'的不甘心。就像花几十块买了张烂片电影票，明知道难看也舍不得中途走掉，因为钱已经花了。",D:"禀赋效应说的是'一旦拥有就高估'，东西在自己手里就觉得更值钱。可小陈离开的不是一件可以从架子上拿起来估价的'物品'，是一段已经走到尽头、正在散去的感情。真正的钩子，是那些投进去又拿不回来的付出，而不是'拥有过所以它很贵'的那点错觉。"}},{stem:"宿舍卧谈会，室友小美刷到一张表情包，念了出来：'我的人生像极了WiFi信号——满格时在摸鱼，一格时在开会。'全宿舍笑得东倒西歪，笑完又集体安静了两秒，因为这话戳得太准太狠了：网快得能下电影的时候，谁都懒洋洋地刷手机；偏偏信号只剩一格、断线转圈的时候，人和事情都一股脑找上门来。越宽裕越躺平，越紧张越被迫狂飙，小美一拍大腿，越想越气又越觉得好笑：这到底是啥毛病啊？满格摸鱼、一格狂赶，这不就是自己亲手把好日子过拧巴了吗？这背后最像心理学和管理学里的哪个效应？",options:["峰终定律——你对人生的评价取决于最满格和最一格那两个巅峰和低谷","耶克斯-多德森定律——中等压力表现最好，太高太低都会拉胯","墨菲定律——需要用网的时候一定没信号，越怕什么越来什么","帕金森定律——给你多少资源你就会浪费多少，带宽充裕时摸鱼、紧张时才开工"],answer:3,explanations:{A:"峰终定律说的是人的记忆很偏心：一段经历过后，只挑最刺激的峰值和收尾那一刻来做总结，中间平平的部分全被抹掉。可小美那个段子讲的是'资源到手却用不上'的错位，不是事后回顾某段经历的精彩点。两个东西都在说'人生'这个词，说的却不是一个零件。",B:"耶克斯-多德森定律画的是条倒U曲线：压力太低没劲，压力太高崩盘，只有中间那一段恰到好处，表现才最漂亮。可段子里的关键在于'资源充不充裕'——网快时你用不上心，网慢时又抢着要用，跟压力的高高低低没关系，跟手里带宽的松紧有关系。",C:"墨菲定律是一句带着委屈的吐槽：只要事情有可能往坏里出，它就一定会往坏里出。它解释的是一种'运气总跟我作对'的倒霉感。可那个段子不是运气问题——满格的时候是你自己主动躺平摸鱼的，是你亲手把好带宽给浪费了，怨不得老天。",D:"没错，这是帕金森定律。它原本是讲工作的：一件事会自动膨胀到把你能用的时间全都填满，给三天拖三天，给一周拖一周。放到段子里就是——你能用的资源，会刚好匹配上你浪费资源的本事。带宽宽裕，你就心安理得地摸鱼；带宽只剩一格，你才被逼着爆发出效率。资源不是不够，是永远被用到了'刚刚好不够'的边缘。所以下次想别再拖，或许可以先给自己狠狠砍掉一半的余量，看看日子会不会反而顺溜起来，手里只剩一格的时候，人往往反而动得最快。"}},{stem:"塔勒布在《反脆弱》里写过一句话，后来成了他最有名的比喻之一：'风会熄灭蜡烛，却能让火堆烧得更旺。'你想象一下那个画面：一支细蜡烛点在窗边，一阵夜风吹来，火苗抖了两下，'噗'地灭了，只剩一缕青烟。可院子里的那堆篝火完全不同，风一吹，火舌反而蹿得更高，火星四溅，连旁边堆着的干柴都被它顺势点着，越烧越旺。两样东西其实都怕风，结局却一个天一个地。塔勒布想说的是，同一种外部冲击——混乱、波动、压力、突如其来的意外——落在不同系统身上，命运截然相反：有的系统被一波带走，有的系统反而在冲击里变得更强。这个比喻最适合解释哪个概念？",options:["黑天鹅——风来之前你根本没法判断，它会吹灭蜡烛还是吹旺火堆，这种影响是完全没法预判的极端事件","反脆弱——有些东西在冲击里不仅没被压垮，反而借力变得更强、获益更多，就像火堆遇到风","杠铃策略——蜡烛代表极度安全那一头，火堆代表极度冒险那一头，中间平庸的部分直接不要"],answer:1,explanations:{A:"这个想法挺自然的，但黑天鹅说的是'不可预知的极端事件'本身，重点在事情发生的意外程度。而这句比喻里的风其实不是什么稀奇的意外，它就是一种再常见不过的波动，重点是蜡烛和火堆面对同一种风给出了两种反应。塔勒布想说的不是'风多难预测'，而是'不同系统对波动的反应类型不同'——脆弱的一方被一波带走，反脆弱的一方被这一波喂饱。所以这里够不到黑天鹅的核心。",B:"对啦，这句比喻就是反脆弱最传神的讲解。反脆弱跟'坚固'是两回事：坚固是风来了我纹丝不动，硬扛到底；反脆弱是风越大我越旺，波动本身成了我的燃料。火堆就是这个道理，一点小火苗你也不敢凑近，可一旦起了风，它反而借势燎原，把整堆柴都点着。生活里也有这种'越折腾越强'的东西：肌肉就是典型，你得先把它练到酸痛甚至轻微撕裂，休息之后它才会长得更壮——舒舒服服躺着不会长肌肉，适度的破坏才会。所以反脆弱不是不怕混乱，是把混乱吃下去，变成自己的养分。",C:"这个想法挺接近的，杠铃策略确实是塔勒布的另一招，说的是投资里把大部分钱放在极安全的地方，小部分拿去冒大险，中间那档平庸的统统不要。但蜡烛和火堆在这个比喻里不是让你'两头都配置'的策略，而是同一种风打在两种属性不同的事物上，一种属性是脆弱，一种属性是反脆弱。定位在'策略选择'还是'属性差异'上，差出去好远，这里讲的是后者。"}},{stem:"凌晨一点，你对自己说好了：'就看最后一个，看完就睡。'结果这一个，变成了十个、一百个。等天边慢慢发白，你才发现手机还握在手里，大拇指在机械地往上划，眼睛酸得直流眼泪，可手就是不听使唤。你不是不困，恰恰相反，困得脑袋都沉了，可心里总有一个念头吊着你：下一个视频说不定很好看。就这么吊着吊着，天亮了。奇怪的是，换成另一个无聊到爆的APP——比如什么都刷不出来、干巴巴的——你做同样多次'要不要继续'的决定，也绝不会沦陷成这样。这套东西到底凭什么能把你钉在屏幕前五六个小时？最核心的机制是什么？",options:["睡眠拖延——白天的事不由你做主，深夜刷手机成了你对那种无力感的一点报复性补偿，所以停不下来","多巴胺间歇强化——算法给你随机的、没法预测的奖励，像老虎机一样，让你的大脑一直分泌多巴胺，根本刹不住车","蔡格尼克效应——每个视频都在十几秒处留个悬念，你受不了那种'没看完'的张力，只能点开下一个","决策疲劳——每次'再看一个'都是一次小决定，做多了意志力被消耗光，人就管不住自己了"],answer:1,explanations:{A:"这个想法挺自然的，睡眠拖延确实能解释'为什么偏偏是晚上'——白天没掌控感，晚上想找补。但它解释不了'为什么停不下来'。白天你也有掌控需求，可开会的时候你怎么没刷到老板站到你背后？卡住你的不是'晚上'这个时间段，而是这个APP本身调用了你大脑里更原始的一套机关，那套机关不分昼夜。",B:"对啦，就是间歇强化在作怪。老虎机的要点在于：你永远不知道下一次拉杆会不会掉钱，这种'不确定的奖励'反而让大脑更兴奋、更拼命。短视频算法干的是同一件事——它不保证每个视频都好看，恰恰是这份随机，让你每划一下都像在押一次注，一旦押中，多巴胺就狠狠来一下，大脑就记牢了'再多划几下'。这比意志力原始得多，也比任何'自我管理'都底得多，所以光靠自控根本顶不住。刷上一小时的劲儿，跟打了一晚上排位连跪还想再来一把，是同一个环路。",C:"这个想法挺接近的，蔡格尼克效应那句'没做完的事让人难受'确实在，那十几秒的悬念也真是一手好钩子。但它只是负责把你从'这个'引到'下一个'，真正的引擎是奖励的不确定性，是多巴胺的循环。要是没有那套多巴胺系统撑着，悬念再强，一个视频也就能勾住你一次，勾不住你五个小时。",D:"这个想法也说得通一部分，决策疲劳确实会让你越来越管不住自己。但问题在于，为什么偏偏是这个APP这么耗你？因为它直接触发了多巴胺系统，把每一次滑动都变成一次押注。换个无聊的APP，你做同样多的决定，自控也不会垮成这样。所以耗掉你的不是'决定做得太多'，是'每个决定都钩着多巴胺'。"}},{stem:"你狠下心，花199块买了个新游戏，当天晚上就兴冲冲地装好、点开。结果两小时过去，你心里其实清楚得很：这游戏不好玩。操作别扭，剧情寡淡，画面也就那样，要是搁平常，你早把它卸载了，连眼皮都不抬一下。可奇怪的是，你愣是没删，反而咬着牙一口气打了五十个小时，每次想退出去，心里都会冒出一句'不然那199块钱不就白花了'。最后好不容易通关，你一点成就感都没有，只觉得这五十个小时像是被什么看不见的东西绑架着走完的。这段惨痛经历，在行为经济学上有个专门的名字，叫什么？",options:["损失厌恶——你怕承认自己买错了、怕面对那199的损失，于是用更多时间来自我安慰","沉没成本谬误——已经花掉的钱，干扰了你'要不要继续'这个本该清醒的理性判断","认知失调——事后你告诉自己'其实画面还行'，来缓解'花了钱买了个垃圾'的那种难受"],answer:1,explanations:{A:"这个想法挺接近的，损失厌恶确实是沉没成本的心理根源——人对'承认损失'的恐惧，常常大于'继续浪费'的痛苦。但它更偏底层的那种恐惧，题干问的是最精确的那个名字。'已经花掉的钱影响了你继续还是止损'这整个决策偏误，行为经济学里给它的专名是沉没成本谬误，损失厌恶是在底下推它的那只手。",B:"对啦，这就是沉没成本谬误的教科书级案例。理性做决定，应该只看'再多玩一小时到底值不值'，可你已经花掉的那199像一颗钉子，把'继续'和'止损'这两个本该自由的选择钉死在原地。钱其实早就不属于你了，它已经没有了，可它却还在遥控你的五十个小时。生活里到处都是这颗钉子：追剧追到第五集发现难看，想着'前面都看这么久了'硬追完；喝到一半的红糖奶茶发现不好喝，想着'花了钱的'硬灌完。每次都在为已经沉掉、捞不回的东西，继续往坑里扔新的时间。",C:"这个想法也挺合理的，认知失调说的是你事后调整自己的态度，把'其实画面还不错'这种话搬出来，好让自己心里那点'花钱买垃圾'的不适没那么扎心。但驱动你继续打这五十小时的原始动力是'不能白花钱'，不是态度调整。失调更像是那五十小时之后你给自己递的一块遮羞布，是结果，不是让你硬撑下去的原因。"}},{stem:"你拉着好朋友一起减肥，两个人用一模一样的食谱，早中晚吃同样的东西，一起去健身房跑同样的时间，连喝的水量都差不多。一个月后，两个人往体重秤上一站：好友瘦了八斤，你瘦了三斤。照理说，三斤也是实打实的成绩，肉是真掉了，裤子是真松了，走起路来都轻快了些。可你就是高兴不起来，心里还窜起一股说不清的火。你明知道自己没吃亏，好友也没从你身上抢走什么——你的三斤好好长在你身上，一点没跑——可那种被比下去的不爽就是压不住。社会心理学专门给这种情绪起了个名字，叫什么？",options:["相对剥夺感——你总觉得好友的成功，是从你这里'抢走'了什么，尽管客观上根本没人抢你","零和思维——你潜意识里把减肥当成一场比赛，好友多瘦的那几斤，就等于你'输'掉的那几斤","社会比较——你本能地拿自己三斤去跟好友八斤比，这一比，三斤就从成就变成了失败","基本归因错误——你把自己的慢归结为体质差，把好友的快归结为'她只是运气好'"],answer:2,explanations:{A:"这个想法挺自然的，但相对剥夺感有个硬条件：你得真的被'剥夺'了什么应得的东西。好友瘦了不代表你少了，你的三斤还好好的长在你身上，一点没跑。你这份不爽是'比出来'的痛苦，不是'被抢走'的痛苦，所以够不到相对剥夺感那层。",B:"这个想法很接近了，零和思维确实可能冒出来，你会隐隐觉得这是场你输我赢的局。但再往前推一步，这种'比成比赛'的感觉是哪来的？是'比较'触发的。不去跟好友比，根本不会生出零和那点心思。所以社会比较才是源头，零和只是比较之后冒出来的一个念头。",C:"对啦，就是社会比较。费斯廷格1954年就讲过这事：人会本能地拿自己去跟别人比，尤其爱往上比——拿自己跟更强的人比。可这一比，你原本的三斤就从'我瘦了'变成'我才瘦这么点'，成就瞬间被翻成了失败。不是你瘦得少，是你比错了对象。生活里这招天天在偷袭：晒朋友圈时看别人欧洲游、看别人保研上岸，转头就觉得自己的一锅粥全馊了。换个参照物，拿现在的你自己跟一个月前的你自己比，三斤那会儿就是明明白白的进步。",D:"这个想法不太对，基本归因错误的核心是'别人成功归运气，自己失败怪环境'那套归因。可你这里压根还没走到归因那一步——你还没分析好友为啥瘦得快，你就已经不爽了。这股情绪是纯比较，先于任何归因，所以归因错误够不着这个场景。"}},{stem:"你一口气追了三部剧，白天看一部，晚上换一部，睡前再扫一部。可哪部都看得不咸不淡，剧情进了脑就忘，人物名都记不太清，没有一部让你追到心里惦记、睡觉前还回想。后来出了个变故：其中两部突然断更了，一断就是好久，就剩下最后一部还能正常更新。你本来对这部印象一般，可眼下没得选了，只能安安静静坐下来，一集一集地看。结果越看越上头，越看越觉得'这剧真香啊'，心里纳闷当初怎么没发现它这么好看。剧还是那部剧，画面没变，剧情没变，演员没变，变的只有你的处境。这背后起作用的心理学机制是什么？",options:["认知失调——你强行说服自己这部好看，因为没别的可选了，态度就跟着行为走","稀缺效应——选项变少后，'只剩这个了'的心态让你投入更深，体验感自然就上来了","选择过载——选项太多把注意力稀释了，每部都只能浅尝辄止，没法真正沉浸进去"],answer:1,explanations:{A:"这个想法挺接近的，认知失调确实能解释'我逼自己相信它还不错'的那种自欺。但这里更妙的是，你不是在说服自己，你是真的觉得更好看了——因为你开始认真看了，认真看自然入戏。前面是自欺，后面是真香，差在'真实体验有没有变好'，这里变好了，所以是稀缺在起作用。",B:"对啦，就是稀缺效应。一样东西一旦变得稀缺，你脑子里会自动给它的价值往上调一档。三选一的时候你心浮气躁，总是估摸着'下一部也许更好'；只剩一部的时候，那种'就它了、只有它了'的心态反而让你沉下来，认认真真地投入进去，一投入，好就露出来了。不是剧变香了，是'没得选'让你第一次真正看进去了。这招商家最熟：限时、限量、'最后三天'，满屏的'快没了'，就是想唤醒你心里那套'越少越香'的开关。",C:"这个想法也说得过去，选择过载确实能解释'为什么当初三选一看不进去'——选项太多，注意力被摊薄，每部都浅尝辄止。但它解释不了'为什么只剩一部时它就变香了'。变香不是注意力找回来了那么简单，是你的心态起了化学反应——稀缺把感知价值给顶了上去。"}},{stem:"你在网上刷到一条帖子，标题特别抓眼：'生酮减肥一个月瘦了15斤，太有效了！'配的对比图前后简直判若两人，评论区一片'求方法''跪求食谱'。你心里也动了一下，顺手点进这个人的主页，想再多看看她平时的日常。结果一进主页，你发现她置顶挂着一个链接，正卖着一套3980元的生酮食谱课程，旁边还配着'名额有限'的倒计时。那一瞬间，那15斤带来的惊艳突然就有点变味了，你心里犯起了嘀咕。从统计学的角度看，这时候你最该警惕的是什么？",options:["利益冲突导致的样本污染——她的'成功案例'是为卖课筛选出来的，经济利益把这个样本严重扭曲了","发表偏差——只有成功的结果被她'发表'出来了，那些减不下来的案例被系统性地藏了起来","确认偏差——你看到的只是她精选出来的成功案例，没瘦下来的那些她根本不会发出来"],answer:0,explanations:{A:"对啦，最该警惕的就是利益冲突。得警惕的不是数字本身，而是给你看数字的那个人——她手里正攥着那套3980的课，她给你看的'成功案例'不是随机抽出来的样本，是冲着卖课这个目标，精心挑选甚至美化过的。一个卖货的人给你递数据，第一反应就得是'她有什么动机'。生活里这面红旗到处都是：减肥药是卖药的自己晒的对比图，美容仪是卖仪器的直播切片，连'秒杀倒计时'都是做营销的人立给路过的人的。看到利益在谁手里，就先把谁的话打个折。",B:"这个想法很接近，发表偏差确实也在场——失败的人被系统性地藏起来，只让成功的出来说话。但它只是第二层。再往深处挖，是谁在推动'只发表成功'这件事？是那根经济利益在背后推。没有卖课的动机，她可能也愿意晒几次失败的。利益冲突才是第一推动力，发表偏差是被它带出来的表现。",C:"这个想法挺自然的，确认偏差强调的是'你怎么挑着看'——你自己更愿意看那些成功的、顺眼的。但这里的关键是'她给你喂了什么'，是她这个信息源本身就被利益动机污染了，跟你主不主动无关系。来源脏了，你再怎么客观地看也没用。"}},{stem:"课间你刷手机，刷到一个博主盘点'成功人士的辍学故事'，乔布斯、比尔·盖茨、扎克伯格，一个个都辍了学还发了财，配上热血的背景音乐，看得你热血沸腾。你心里直痒痒，想着'要不我也别念书了，早点出去搏一把'。可临到下决心那一步，你又有点发慌：真的所有中途辍学的人都能成功吗？那些没成为乔布斯的人，后来都去哪了？你把这个问题发到学习群里，等了好一会儿，有位平时话不多的同学回了你一句特别绕的话——'你看到的样本不代表全体，因为大量失败、死亡、沉默的样本，被系统性地过滤掉了。'你盯着这句话看了半天，越想越觉得有东西。以下哪个场景最精准地命中了这个偏差的核心逻辑？",options:["博物馆里的古代盔甲，胸口位置的箭孔最多，你得出结论'古人打仗专射胸口'——可四肢和头部中箭的人当场就死了，根本没机会穿着盔甲下葬，你只见到了活下来的那一小撮","炒股赚钱的人在朋友圈晒收益，亏钱的人全都沉默——你刷完一圈，得出'大家好像都在赚钱'的结论，却没想过沉默的那批人可能亏得底朝天","这三个例子各管一件事，但底层逻辑完全是一条线：活下来的样本叫得最大声，被淘汰的样本早就不在台上了，你看到的永远是幸存的那半边","你问了10个成功的创业者，他们都说'秘诀就是辍学创业'，你一冲动决定退学——可你压根没去问那些辍学后失败的一千个人，他们不会出现在你的采访名单里"],answer:2,explanations:{A:"这个装甲案例太经典了，它就是'幸存者偏差'这个词的老祖宗。二战的瓦尔登博士统计返航飞机的弹孔，发现引擎部位弹孔最少——不是那里不容易中弹，而是引擎中弹的飞机根本飞不回来。胸口盔甲同理：你能看到的中箭位置，都只是'还能活着穿盔甲下葬'的那批人。它命中心口，但只是三选一里的一条，先别急。",B:"朋友圈这个也挺准的，而且离你最近。你每天刷手机，看到的全是'今天又赚了''这个月翻倍了'，亏损的人因为面子、因为沮丧，一个字都不发。于是你的信息流里，失败样本被'沉默'这个过滤器筛得干干净净。这和装甲案例其实是同一套逻辑——只是把'死亡过滤'换成了'沉默过滤'。它精准命中了，可它同样只是其中一道，还没到答案。",C:"正确，这三道全对，因为它们的逻辑是同一根骨头：你看到的样本永远不代表全体，被死亡、沉默、淘汰筛掉的那一大半，才是决定真相的沉默多数。装甲案例里筛掉的是死人，朋友圈里筛掉的是亏钱不说话的人，创业者案例里筛掉的是辍学失败的普通人。幸存者偏差最要命的地方就在这——你根本意识不到自己被筛过，还以为是'世界本来如此'。就像刷到那些辍学创业的成功故事，你会热血上头，却忘了那些失败的人从没出现在你屏幕里。想破这个局有个小习惯：每次看到'成功者的共同点'，先反问一句'那些失败的、没上榜的人，现在在哪？'——多问这一句，你就不容易被幸存者带偏。",D:"创业者这个场景，是你最容易踩的雷。你去采访的10个成功者，个个神采飞扬，可那些失败的人从没上过你的采访单。这道也命中核心，但它只是三选一的一条，跟前面两条同一根逻辑，一起看。"}},{stem:"周末你陪爸爸去二手车市场看车。进门第一辆，卖家张口就报十五万，还拍着引擎盖说'这车况你去打听，绝对值这个价'。你和你爸心里都咯噔一下，觉得贵了。磨了半天，对方'勉为其难'降到十二万，你爸心想'砍掉三万，赚到了'，当场交了定金。回家的路上你们还挺高兴，觉得这波砍价漂亮。可过了几天你偷偷一查，市场价其实就十二万左右——你们根本没占到便宜，只是被那个既有的数字牵着鼻子走。这个过程，精准地演示了下面哪个效应？",options:["诱饵效应——先看一套又破又贵的房子，再看正常价位的，你会觉得第二套'超值'，其实是被前一套衬托出来的错觉","锚定效应——卖家抛出的15万就像海底的锚，把你家对'合理价格'的全部想象死死拖在它附近，你砍到12万还在锚边上打转，真正的市场价反而没进过脑子","情绪偏差——成交那天法官刚好心情好，谈判也顺，其实是'饿不饿、累不累'这种生理状态悄悄改了判断","对比效应——先看到2999的外套，再看599的T恤，心想'好便宜'，虽然599对一个T恤来说已经不便宜了"],answer:1,explanations:{A:"这个想法挺有迷惑性的，因为它确实也是'被一个数字影响'。但诱饵效应（也叫'诱饵选项'）走的是另一条路：商家故意放一个又差又贵的东西，就为了让旁边那个真正想卖的东西显得划算。你的判断是在'两个东西之间比较'，而不是被某个数字单方面拖走。车商那条路不一样——他是先抛出一个数字，让你家的一切还价都围着它转，根本没别的选项在比较。差就差在这一层：一个靠衬托，一个靠锚定。",B:"没错，这就是锚定效应最纯正的演示。卖家报15万的那一刻，那个数字就像海底沉下一只铁锚，把你家对'这车值多少'的全部想象，死死拖在它附近。你以为砍到12万是赢了谈判，可12万和15万其实都围在锚边上打转——真正的市场价可能更低，你压根没往那想。锚定效应的狠就在这：哪怕那个初始数字毫无根据，甚至离谱，它照样能改写你的判断区间。生活里到处是锚：原价划线价、'建议零售价'、网红餐厅门口排的长队，都是别人给你下的锚。",C:"这个讲的是'饥饿法官'那种效应，属于生理状态影响决策，跟数值锚定完全是两码事。饥饿、疲惫、心情好，这些是身体的电量，会让你的判断变松或变紧，但它没有一个'具体的数字'在拖着你。锚定效应必须有一颗数字做的锚，比如15万、比如原价2999；饿了累了没有这颗锚，是另一条神经在作怪。你这题里的关键，是那个15万把谈判区间锁死了，不是谁没吃饱。",D:"这个和选项A是一对近亲，都是'对比效应'。你先见到的2999把预期拉高，再见599就觉得便宜了——可这只是在两个价格之间来回掂量，后续判断并没有被2999这个数字持续钉住。锚定效应更强硬：它是单方面一个数字，长期霸占你的心理价位，让你围着它讨价还价。题目里的车商恰恰是这样——没有第二辆车跟你比，只有15万这一个数字，把你家锁得死死的。"}},{stem:"新班级分座位，你抽到一个从没见过的同桌。还没等对方开口，你心里先默念一句：'这个人一看就不太好相处。'于是第一天见面，你板着脸、爱答不理，对方跟你搭话你也就嗯嗯啊啊敷衍过去。对方感觉到你的冷淡，也冷了下来，你心想：'看吧，我一开始就说对了。'这像不像一个怪圈？你嘴上说的是'预测'，其实你的举动正在亲手把这个预测变成真的。心理学里管这个叫'自证预言'——当你对一件事有了预期，你的行为会不自觉地推着它成真，最后还以为是老天爷显灵。以下哪个场景把这条完整的链子展示得最全？",options:["这三个场景各管一条道——人际的、自我的、权威的，虽然主角不同，但走的完全是一条闭环：预期先动，行为跟上，结果反过来替预期盖章","你认定自己数学就是不行，考前干脆不复习，考完挂科说'看吧，我早说我不行'——低预期直接替你决定了不努力","你心里给新同事贴了'不好相处'的标签，见面就冷着脸，对方感到冷意也冷淡回来，你心想'果然如此'——你亲手用冷脸把对方逼冷了","老师把A班当尖子班，给更多挑战和关注，期末A班真考得更好，老师得意地说'我看人真准'，其实是他自己的期待在偷偷推着学生跑"],answer:0,explanations:{A:"正确，这三条道走到最后是同一个终点。人际版：你预期对方冷淡，就用冷脸去试，对方回敬冷脸，你拍手说'我猜对了'。自我版：你预期自己数学不行，就干脆不复习，挂科后'证言'闭环。权威版：老师预期A班是尖子，就多给挑战，学生被期待推着进步，老师再夸'我看人准'。自证预言的可怕就在这——它把'原本不一定成真'的事，通过你的一举一动，硬生生逼成了现实。社会学家默顿1948年下的定义挺绕口，大意就是：一个本来是假的判断，会让你做出新行为，最后把它弄成真的。想识破它，记住一句话：我是在描述事实，还是在推动事实？",B:"这个自我版特别常见，就发生在'我数学不行'这种自我诅咒里。你提前给它办好了'不复习'的后事，再拿挂科当铁证，完美闭环。它精准地演了自证预言的一条路径——但题目问的是'最完整地展示这个过程'，而它只走了自我这一条，人际和权威的还没露脸。别急着定，它只是答案拼图里的一块。",C:"这个人际版本最有画面感，也最像开头那个冷脸怪圈。你给它起个名字叫'不好相处'，然后用冷淡去试它，对方感受到冷意自然回冷，你就把这个结果当成证据塞回去。默顿当年说的'对情境的虚假定义引发新行为，让假定义变真'，说的正是这一条。它精准命中了，可它同样只占了三选一中的一条道，完整的答案还得再等等。",D:"这个权威版是教育心理学里最有名的实验的翻版。1968年罗森塔尔和雅各布森告诉老师'某些学生是潜力股'，老师就多给这些孩子关注和挑战，结果他们真的更好了。题目里那句'我看人真准'，就是老师没意识到——是他自己的期待在推着学生跑。这一条也精准命中了自证预言的机制，但它只是其中一道，和前面两条一起，才凑成完整的答案。"}},{stem:"你刷到一句话，越品越有味道：'凡是你试图控制的东西，最终都会反过来控制你。'你想起隔壁班那个班主任，天天搬出KPI表格盯着学生打卡、排名、交作业，一天到晚比监控还勤快。结果呢？学生开始疯狂刷在线时长、抄作业、互相刷好评，把那张表格上的数字做得漂漂亮亮，可真正的学习风气早就跑没影了。班主任气得不行，天天在办公室拍桌子，可他就是松不开手——那张他亲手造出来的表格，反而把他自己牢牢捆住了。你越琢磨越觉得，这个表面上的悖论，经济学和社会学里其实早有说法把它说透了。这个道理，跟下面哪个概念最接近？",options:["逆火效应——你越想说服一个人改变信念，他越跟你对着干，你的反驳反而像胶水把他原来的想法粘得更牢","古德哈特定律——当一个指标被当成目标去追的时候，它就不再是好指标了，人们会为了刷指标而扭曲自己的行为","目标侵蚀——你越追求完美，标准反而越降越低，最后连最初想达到什么高度都忘干净了","坎贝尔定律——凡是你去量化的东西，都会被作弊扭曲，量化这件事越重要，扭曲得就越厉害"],answer:1,explanations:{A:"这个想法挺自然的，因为它俩都带着'你越用力，越适得其反'的味道。但逆火效应是纯认知层面的：它说的是信念被攻击时反而更坚固，你越反驳、对方越坚持，纯粹是脑袋里的拉锯，跟'控制手段产生反噬'不是一回事。题目里班主任的问题不在'说服学生'，而在'用KPI去套学生'，学生不是信念被攻才反抗，是被指标逼得不得不刷数据。方向看着接近，落脚点差了十万八千里。",B:"没错，就是古德哈特定律。它原名写在1975年，大意是：当一个指标被当成目标去追的那一刻，它就已经报废了。班主任把'打卡时长''排名'这些指标当成了目标本身，学生为了指标好看，就刷时长、抄作业，指标一路飘红，学习却原地烂掉。指标一变目标，大家就开始为它演戏——这就回答了你开头那句'控制反被控制'：班主任想用KPI控制学生，最后却被KPI反过来绑架，松不开手。生活里它也无所不在：为了数据好看的健身打卡、为了流量而发的视频，都是同一个坑。",C:"这个讲的是'标准滑坡'，和'控制反被控制'压根不挨边。目标侵蚀（也叫目标爬坡反向）说的是：你迟迟达不到高目标，为了不难受就一点点把标准放低，低到最后连初心都丢了。它是'标准悄悄降低'，题目里班主任的标准可没降——他反而抓得更紧、更焦虑。不是标准往下滑，是控制手段本身起了反作用，这个分岔很容易看错，正因如此才值得多盯一眼。",D:"这个坎贝尔定律跟古德哈特是近亲，有人说它是后者的'社会政策版本'。它说的是：你量化什么，什么就被人作弊扭曲，而且这件事越重要，扭曲得越狠——侧重的是腐败和舞弊。它的确涉及'指标被玩坏'，但它更窄，盯的是'作弊'这一件事；古德哈特更宽，讲的是'指标一旦成了目标就失效'这整条机制。题目里班主任的困境，核心是'控制欲的反噬'，古德哈特盖得更严丝合缝。"}}]}];
let curBook = 0, curQ = 0, answers = [], states = [];
function initStates(){ states = []; for(const b of books){ const s=[]; for(let i=0;i<b.questions.length;i++) s.push(null); states.push(s);} answers = states.map(s=>s.slice()); }
function renderBoard(){
  const done = answers.flat().filter(a=>a!==null).length;
  const all = answers.flat().length;
  const ok = answers.flat().filter(a=>a===true).length;
  const bad = answers.flat().filter(a=>a===false).length;
  const rate = done? Math.round(ok/done*100):0;
  board.innerHTML = `<div class="item"><div class="num">${done}/${all}</div><div class="lbl">总进度</div></div><div class="item"><div class="num" style="color:#4ade80">${ok}</div><div class="lbl">正确</div></div><div class="item"><div class="num" style="color:#f87171">${bad}</div><div class="lbl">错误</div></div><div class="item"><div class="num" style="color:#f6d365">${rate}%</div><div class="lbl">得分率</div></div>`;
}
function renderTabs(){
  tabs.innerHTML = books.map((b,i)=>`<div class="tab${i===curBook?' active':''}" onclick="switchBook(${i})">${b.icon} ${b.name}<span class="cnt">${b.questions.length}题</span></div>`).join('');
}
function switchBook(i){ curBook=i; curQ=0; renderTabs(); renderQ(); }
function renderQ(){
  const b = books[curBook];
  if(curQ >= b.questions.length){ renderDone(); return; }
  const q = b.questions[curQ];
  let h = `<div class="qcard"><div class="qidx">${b.icon} ${b.name} · 第 ${curQ+1}/${b.questions.length} 题</div><div class="stem">${q.stem}</div>`;
  h += q.options.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pick(${i})"><div class="letter">${'ABCD'[i]}</div><div>${o}</div></div>`).join('');
  h += `<div class="expl" id="expl"><div class="e-title">📖 解析</div><div class="e-box" id="ebox"></div></div></div>`;
  h += `<div class="nav"><button class="btn" onclick="prev()" ${curQ===0?'disabled':''}>← 上一题</button><button class="btn primary" onclick="next()">下一题 →</button></div>`;
  main.innerHTML = h;
  if(answers[curBook][curQ]!==null){ showResult(q, states[curBook][curQ]); }
}
function pick(i){
  const q = books[curBook].questions[curQ];
  if(answers[curBook][curQ]!==null) return;
  const ok = i===q.answer;
  answers[curBook][curQ]=ok; states[curBook][curQ]=i;
  showResult(q, i);
  renderBoard();
}
function showResult(q, picked){
  q.options.forEach((o,i)=>{
    const el=document.getElementById('opt'+i);
    if(!el) return;
    if(i===q.answer) el.className='opt correct';
    else if(i===picked) el.className='opt wrong';
    else el.className='opt dim';
  });
  const letter='ABCD'[picked];
  let txt = q.explanations && q.explanations[letter] ? q.explanations[letter] : (q.explanations && q.explanations['ABCD'[q.answer]]) || '';
  document.getElementById('ebox').textContent = txt;
  document.getElementById('expl').style.display='block';
}
function prev(){ if(curQ>0){ curQ--; renderQ(); } }
function next(){ const b=books[curBook]; if(curQ<b.questions.length-1){ curQ++; renderQ(); } else renderDone(); }
function renderDone(){
  const b=books[curBook];
  const ok=answers[curBook].filter(a=>a===true).length;
  const n=b.questions.length;
  main.innerHTML=`<div class="done"><h2>${b.icon} ${b.name} · 完成！</h2><div class="score">${ok}/${n}</div><p>正确率 ${Math.round(ok/n*100)}%${ok===n?' · 满分！🏆':''}</p><button class="retry" onclick="switchBook(${curBook})">再做一遍</button><p style="margin-top:14px">换个主题试试 ↓</p></div>`;
  renderTabs();
}
initStates(); renderBoard(); renderTabs(); renderQ();
</script>
</body>
</html>
