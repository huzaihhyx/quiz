<script>
const SURVEY = {"A0": ["孩子昵称", "年级", "出生年月", "填表人(爸/妈/共同)", "平时主要带养人", "和爸爸每周说心里话的次数(不适用填—)"], "A": [{"key": "A1", "title": "注意与多动（SNAP-IV 1-18）", "note": "过去六个月", "anchor": ["完全没有", "有一点点", "还算不少", "非常的多"], "questions": [{"n": 1, "t": "难以注意细节，作业/任务常犯粗心错误（SNAP-IV#1）"}, {"n": 2, "t": "任务或游戏中难以保持注意（SNAP-IV#2）"}, {"n": 3, "t": "直接对他说话时似听非听（SNAP-IV#3）"}, {"n": 4, "t": "不按指令行事，功课/家务难以完成（非对抗、非不懂）（SNAP-IV#4）"}, {"n": 5, "t": "难以组织安排任务和活动（先后乱、丢三落四）（SNAP-IV#5）"}, {"n": 6, "t": "回避/不喜欢需要持续动脑的事（如作业）（SNAP-IV#6）"}, {"n": 7, "t": "常丢东西（笔、书、作业本、充电器）（SNAP-IV#7）"}, {"n": 8, "t": "易被外界刺激分心（一点动静就抬头）（SNAP-IV#8）"}, {"n": 9, "t": "日常活动中忘事（约定、带东西）（SNAP-IV#9）"}, {"n": 10, "t": "手脚动个不停或坐着扭动（SNAP-IV#10）"}, {"n": 11, "t": "在应坐着的场合离开座位（SNAP-IV#11）"}, {"n": 12, "t": "过度跑动攀爬（高中多表现为坐不住、换姿势、想站起来）［适配注：\"像有虫在爬\"的内在不安感为DSM-5成人表述，高中生常见］（SNAP-IV#12）"}, {"n": 13, "t": "难以安静地休闲（看书/听音乐/坐着发呆都难）（SNAP-IV#13）"}, {"n": 14, "t": "\"忙个不停\"，像装了马达（SNAP-IV#14）"}, {"n": 15, "t": "话多（SNAP-IV#15）"}, {"n": 16, "t": "问题没问完就抢答（SNAP-IV#16）"}, {"n": 17, "t": "难以等待、排队要插上（SNAP-IV#17）"}, {"n": 18, "t": "打断或打扰别人（插话、抢话）（SNAP-IV#18）"}]}, {"key": "A2", "title": "对立与情绪反应（SNAP-IV 19-26）", "note": "过去六个月", "anchor": ["完全没有", "有一点点", "还算不少", "非常的多"], "questions": [{"n": 19, "t": "常发脾气（SNAP-IV#19）"}, {"n": 20, "t": "常与大人争辩（SNAP-IV#20）"}, {"n": 21, "t": "主动违抗或拒绝大人的要求/规则（SNAP-IV#21）"}, {"n": 22, "t": "故意惹恼别人（SNAP-IV#22）"}, {"n": 23, "t": "把自己的错误归咎于别人（SNAP-IV#23）"}, {"n": 24, "t": "易被惹恼、敏感易怒（SNAP-IV#24）"}, {"n": 25, "t": "常生气或怨恨（SNAP-IV#25）"}, {"n": 26, "t": "常怀恨、记仇（SNAP-IV#26）"}]}, {"key": "A3", "title": "长处与困难（SDQ官方中文25条）", "note": "过去六个月", "anchor": ["不真实", "有点真实", "完全真实"], "questions": [{"n": 27, "t": "能体谅到别人的感受（SDQ#1）"}, {"n": 28, "t": "不安定、过分活跃、不能长久静止（SDQ#2）"}, {"n": 29, "t": "经常抱怨头痛、肚子痛或恶心（SDQ#3）"}, {"n": 30, "t": "很乐意与别的小孩分享东西（糖果、玩具、笔等等）（SDQ#4）"}, {"n": 31, "t": "经常发脾气，易怒（SDQ#5）"}, {"n": 32, "t": "颇孤独，比较多自己玩（SDQ#6）"}, {"n": 33, "t": "一般来说比较顺从，通常是成年人要求要做的都肯做（SDQ#7）(R)"}, {"n": 34, "t": "有很多担忧，经常表现出忧虑（SDQ#8）"}, {"n": 35, "t": "如果有人 n": 72, "t": "做家务、收拾自己房间时（HSQ#16）"}]}, {"key": "A4b", "title": "高中生特有情境", "note": "近三个月", "anchor": ["从不", "偶尔", "经常", "总是"], "questions": [{"n": 73, "t": "作业/备考\"开始\"困难——知道要做，就是动不了手（自编-高中生情境）"}, {"n": 74, "t": "任务做到一半丢下去干别的（自编-高中生情境）"}, {"n": 75, "t": "计划睡觉的时间和实际睡觉差1小时以上（自编-高中生情境）"}, {"n": 76, "t": "睡前翻来覆去，入睡要30分钟以上（自编-高中生情境）"}, {"n": 77, "t": "早晨靠自己起不来/赖床，有迟到或迟到风险（自编-高中生情境）"}, {"n": 78, "t": "假期手机/游戏每天合计超4小时（自编-高中生情境）"}, {"n": 79, "t": "因手机/游戏与家长发生冲突（自编-高中生情境）"}, {"n": 80, "t": "对升学/考试（如雅思、月考、合格考）表现出明显焦虑（嘴上说或行为上躲）（自编-高中生情境）"}, {"n": 81, "t": "在网上有聊得特别来的对象/密友（含网恋）（自编-高中生情境）"}, {"n": 82, "t": "愿意和家人一起活动（吃饭/散步/出游）（自编-高中生情境）(R·此条越高越好)"}]}, {"key": "A4c", "title": "功能盲区查漏（WFIRS-P）", "note": "过去六个月", "anchor": ["从不", "偶尔", "经常", "总是"], "questions": [{"n": 83, "t": "东西用完不放回固定位置、临时找不着（多数最终能找到；与\"常丢东西\"不同题）（WFIRS-P·生活技能）"}, {"n": 84, "t": "需要自己安排一周学习/生活时，排得一团乱（WFIRS-P·生活技能）"}, {"n": 85, "t": "流露出\"自己不如别人/像个失败者\"的想法（WFIRS-P·自我概念）"}, {"n": 86, "t": "有过因冲动/莽撞受伤或涉险的事（骑车、闯灯、冲动消费等）（WFIRS-P·风险）"}, {"n": 87, "t": "有能约出来线下见面的朋友（WFIRS-P·社交）(R·此条越高越好)"}]}, {"key": "A5", "title": "开放题（大白话随意写）", "note": "", "open": [{"n": 88, "t": "目前最想解决的3件事（排个序）"}, {"n": 89, "t": "最近一次让你觉得\"这孩子挺好的\"的具体瞬间"}, {"n": 90, "t": "孩子最擅长/最喜欢做的事"}]}], "B": [{"key": "B1", "title": "成人ADHD自查（ASRS Part A）", "note": "过去六个月", "anchor": ["从不", "很少", "有时", "常常", "非常频繁"], "questions": [{"n": 1, "t": "任务收尾的最后细节常难以聚焦（就差一点点，偏偏拖）（ASRS#1）"}, {"n": 2, "t": "难以把事情安排得有条理（ASRS#2）"}, {"n": 3, "t": "忘事、迟到、误约（ASRS#3）"}, {"n": 4, "t": "遇到麻烦的动脑事就一拖再拖（ASRS#4）"}, {"n": 5, "t": "坐久了坐立不安，想起来动（ASRS#5）"}, {"n": 6, "t": "过度活跃或精力足到\"停不下来\"（ASRS#6）"}]}, {"key": "B2", "title": "家长状态（前14题）+ 孩子难带程度（15-18）", "note": "7-14看过去一周；15-18看过去一个月", "anchor": ["不符合", "有时", "经常", "总是"], "questions": [{"n": 7, "t": "提不起任何愉快的感觉，觉得什么都没意思（DASS-抑郁）"}, {"n": 8, "t": "对未来不抱希望（DASS-抑郁）"}, {"n": 9, "t": "感到紧张不安（DASS-焦虑）"}, {"n": 10, "t": "担心可能发生糟糕的事（DASS-焦虑）"}, {"n": 11, "t": "很难放松（DASS-压力）"}, {"n": 12, "t": "因一点小事就烦躁（DASS-压力）"}, {"n": 13, "t": "觉得整天绷着一股劲，停不下来（DASS-压力·官方nervous energy直译）"}, {"n": 14, "t": "睡眠比平时差（自编·睡眠快查，不进DASS域分）"}, {"n": 15, "t": "孩子有一些行为让你特别头疼、烦心（PSI-SF难缠度）"}, {"n": 16, "t": "孩子好像故意做让你生气的事（PSI-SF难缠度）"}, {"n": 17, "t": "带这孩子比你当初想象的难得多（PSI-SF难缠度）"}, {"n": 18, "t": "一想到某些时刻要独自应付他就发怵（自编·PSI-SF难缠度口径）"}]}, {"key": "B3", "title": "教养方式（APQ五因子+NFPP）", "note": "最近一个月", "anchor": ["从不", "很少", "有时", "经常", "总是"], "questions": [{"n": 19, "t": "会和孩子友好地闲聊（不谈学习、不谈问题）（APQ·卷入）"}, {"n": 20, "t": "会花时间陪他做他喜欢的事（哪怕你觉得无聊）（APQ·卷入）"}, {"n": 21, "t": "他做得好时会明确说出来（\"这件事你处理得不错\"）（APQ·正面强化）"}, {"n": 22, "t": "他晚上外出时，你清楚他去哪儿、和谁在一起（APQ·监控）"}, {"n": 23, "t": "他主要在网上/社交软件上和哪些人来往，你大体清楚（APQ·监控·高中生版）"}, {"n": 24, "t": "他晚上外出时，你们约定了明确的回家时间（APQ·监控）"}, {"n": 25, "t": "犯错的后果取决于你当时的心情（心情好就轻，心情差就重）（APQ·不一致）"}, {"n": 26, "t": "说过要罚（收手机等），最后常常没执行或提前解除（APQ·不一致）"}, {"n": 27, "t": "他磨一磨/求一求，惩罚就不了了之（APQ·不一致）"}, {"n": 28, "t": "气急时动手打过（推搡、拍打、打手）（APQ·体罚）"}, {"n": 29, "t": "扇过耳光（APQ·体罚）"}, {"n": 30, "t": "用物件（衣架/皮带/尺子等）打过（APQ·体罚）"}, {"n": 31, "t": "他做得不合适时，先问原因再处理（自编·NFPP沟通）"}, {"n": 32, "t": "冲突之后当天会主动修复关系（说话/递杯水/道歉）（自编·NFPP修复）"}, {"n": 33, "t": "因孩子的事情绪失控（吼、摔门、说过头的话）（自编·NFPP）(R)"}, {"n": 34, "t": "失控后会道歉（自编·NFPP修复）"}, {"n": 35, "t": "当着孩子面和另一半争执教育问题（自编·NFPP同盟）(R)"}]}, {"key": "B4", "title": "开放题（大白话随意写）", "note": "", "open": [{"n": 36, "t": "你小时候被父母管教、印象最深的一个场景（一两句）"}, {"n": 37, "t": "你希望孩子不再经历你当年经历的什么"}, {"n": 38, "t": "你现在最担心老大/老二的，各一句话"}]}]};
const IDENTITIES = [
  {k:"A-lao", label:"A卷·老大"},
  {k:"A-er", label:"A卷·老二"},
  {k:"B-ba", label:"B卷·爸爸"},
  {k:"B-ma", label:"B卷·妈妈"}
];
let cur = null;
function lsKey(){ return "nfpp_wj_" + cur; }
function save(n, v){
  if(!cur) return;
  let d = JSON.parse(localStorage.getItem(lsKey()) || "{}");
  if(v === null || v === "") delete d[n]; else d[n] = v;
  localStorage.setItem(lsKey(), JSON.stringify(d));
}
function load(){ try { return JSON.parse(localStorage.getItem(lsKey()) || "{}"); } catch(e) { return {}; } }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderWho(){
  const w = document.getElementById("who");
  w.innerHTML = "";
  IDENTITIES.forEach(id => {
    const b = document.createElement("button");
    b.textContent = id.label;
    b.className = (cur === id.k) ? "sel" : "";
    b.onclick = () => { cur = id.k; render(); };
    w.appendChild(b);
  });
}
function qHtml(sec, q, extra){
  const name = sec.key + "_" + q.n;
  let h = '<div class="q" id="q_' + name + '"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div>';
  h += '<div class="opts">' + sec.anchor.map((a, i) =>
    '<label class="opt" id="o_' + name + '_' + i + '" onclick="pick(\'' + name + '\',' + i + ',this)">' + a + '</label>'
  ).join('') + '</div></div>';
  return h;
}
function pick(name, i, el){
  document.querySelectorAll('#q_' + name + ' .opt').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  save(name, String(i));
  progress();
}
function render(){
  renderWho();
  if(!cur){ document.getElementById("form").innerHTML = '<div class="card"><div class="hint">请在上方选择身份开始填写。</div></div>'; document.getElementById("prog").textContent = "先选身份"; return; }
  const isA = cur.startsWith("A-");
  const data = isA ? SURVEY.A : SURVEY.B;
  const saved = load();
  let h = "";
  if(isA){
    h += '<div class="card"><h2>基本信息</h2>';
    SURVEY.A0.forEach((f, i) => {
      const key = "A0_" + i;
      h += '<div class="q"><div class="qt">' + esc(f) + '</div><input class="txt" id="in_' + key + '" value="' + esc(saved[key] || "") + '" oninput="save(\'' + key + '\', this.value)"></div>';
    });
    h += '</div>';
  }
  data.forEach(sec => {
    h += '<div class="card"><h2>' + esc(sec.title) + '</h2>';
    if(sec.note) h += '<div class="note">' + esc(sec.note) + '</div>';
    if(sec.anchor){
      h += '<div class="note">计分：' + sec.anchor.map((a,i) => (i) + "=" + a).join(" / ") + '</div>';
      sec.questions.forEach(q => { h += qHtml(sec, q); });
    }
    if(sec.special){
      sec.special.forEach(q => {
        const name = sec.key + "_" + q.n;
        h += '<div class="q" id="q_' + name + '"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div><div class="opts">' +
          q.opts.map((a, i) => '<label class="opt" id="o_' + name + '_' + i + '" onclick="pick(\'' + name + '\',' + i + ',this)">' + a + '</label>').join('') +
          '</div></div>';
      });
    }
    if(sec.open){
      sec.open.forEach(q => {
        const name = sec.key + "_" + q.n;
        h += '<div class="q"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div><textarea id="ta_' + name + '" oninput="save(\'' + name + '\', this.value)">' + esc(saved[name] || "") + '</textarea></div>';
      });
    }
    h += '</div>';
  });
  document.getElementById("form").innerHTML = h;
  Object.keys(saved).forEach(k => {
    if(k.startsWith("A0_")) return;
    const el = document.getElementById("o_" + k + "_" + saved[k]);
    if(el) el.classList.add("sel");
  });
  progress();
}
function totalQ(){
  const isA = cur.startsWith("A-");
  const data = isA ? SURVEY.A : SURVEY.B;
  let t = 0;
  data.forEach(sec => { t += (sec.questions ? sec.questions.length : 0) + (sec.special ? sec.special.length : 0) + (sec.open ? sec.open.length : 0); });
  return t + (isA ? 0 : 0);
}
function progress(){
  if(!cur){ return; }
  const answered = Object.keys(load()).filter(k => !k.startsWith("A0_")).length;
  document.getElementById("prog").textContent = "已答 " + answered + " / " + totalQ();
}
function buildText(){
  const isA = cur.startsWith("A-");
  const idLabel = IDENTITIES.find(x => x.k === cur).label;
  const data = isA ? SURVEY.A : SURVEY.B;
  const saved = load();
  let out = "【NFPP问卷·" + idLabel + "·" + new Date().toLocaleString("zh-CN") + "】\n";
  if(isA){
    SURVEY.A0.forEach((f, i) => { out += f + ": " + (saved["A0_" + i] || "") + "\n"; });
  }
  data.forEach(sec => {
    let rows = [];
    const put = (n) => { const v = saved[sec.key + "_" + n]; rows.push(n + "=" + (v === undefined ? "-" : v)); };
    if(sec.anchor) sec.questions.forEach(q => put(q.n));
    if(sec.special) sec.special.forEach(q => put(q.n));
    if(rows.length) out += "[" + sec.key + "] " + rows.join(" ") + "\n";
    if(sec.open) sec.open.forEach(q => { out += "[" + sec.key + "_" + q.n + "] " + (saved[sec.key + "_" + q.n] || "(未答)") + "\n"; });
  });
  return out;
}
function exportAns(show){
  if(!cur){ alert("请先选择身份"); return; }
  const t = buildText();
  document.getElementById("out").style.display = "block";
  document.getElementById("outtxt").value = t;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => alert("已复制，直接粘贴发给助手即可")).catch(() => {});
  }
  document.getElementById("out").scrollIntoView({behavior:"smooth"});
}
function downloadTxt(){
  if(!cur){ alert("请先选择身份"); return; }
  const blob = new Blob([buildText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nfpp_wenjuan_" + cur + ".txt";
  a.click();
}
function clearAll(){
  if(!cur){ return; }
  if(confirm("清空当前身份的全部答案？")){
    localStorage.removeItem(lsKey());
    render();
  }
}
render();
</script>
