<script>
const SURVEY = {"A0": ["填表人(爸爸/妈妈/孩子自己)", "孩子昵称", "年级", "平时主要带养人", "和爸爸每周说心里话的次数(不适用填—)"], "A": [{"key": "A1", "title": "注意与多动", "note": "过去六个月", "anchor": ["完全没有", "有一点点", "还算不少", "非常的多"], "questions": [{"n": 1, "t": "难以注意细节，作业/任务常犯粗心错误"}, {"n": 2, "t": "任务或游戏中难以保持注意"}, {"n": 3, "t": "直接对他说话时似听非听"}, {"n": 4, "t": "不按指令行事，功课/家务难以完成（非对抗、非不懂）"}, {"n": 5, "t": "难以组织安排任务和活动（先后乱、丢三落四）"}, {"n": 6, "t": "回避/不喜欢需要持续动脑的事（如作业）"}, {"n": 7, "t": "常丢东西（笔、书、作业本、充电器）"}, {"n": 8, "t": "易被外界刺激分心（一点动静就抬头）"}, {"n": 9, "t": "日常活动中忘事（约定、带东西）"}, {"n": 10, "t": "手脚动个不停或坐着扭动"}, {"n": 11, "t": "在应坐着的场合离开座位"}, {"n": 12, "t": "过度跑动攀爬（高中多表现为坐不住、换姿势、想站起来）［适配注：\"像有虫在爬\"的内在不安感为DSM-5成人表述，高中生常见］"}, {"n": 13, "t": "难以安静地休闲（看书/听音乐/坐着发呆都难）"}, {"n": 14, "t": "\"忙个不停\"，像装了马达"}, {"n": 15, "t": "话多"}, {"n": 16, "t": "问题没问完就抢答"}, {"n": 17, "t": "难以等待、排队要插上"}, {"n": 18, "t": "打断或打扰别人（插话、抢话）"}]}, {"key": "A2", "title": "对立与情绪反应", "note": "过去六个月", "anchor": ["完全没有", "有一点点", "还算不少", "非常的多"], "questions": [{"n": 19, "t": "常发脾气"}, {"n": 20, "t": "常与大人争辩"}, {"n": 21, "t": "主动违抗或拒绝大人的要求/规则"}, {"n": 22, "t": "故意惹恼别人"}, {"n": 23, "t": "把自己的错误归咎于别人"}, {"n": 24, "t": "易被惹恼、敏感易怒"}, {"n": 25, "t": "常生气或怨恨"}, {"n": 26, "t": "常怀恨、记仇"}]}, {"key": "A3", "title": "长处与困难", "note": "过去六个月", "anchor": ["不真实", "有点真实", "完全真实"], "questions": [{"n": 27, "t": "能体谅到别人的感受"}, {"n": 28, "t": "不安定、过分活跃、不能长久静止"}, {"n": 29, "t": "经常抱怨头痛、肚子痛或恶心"}, {"n": 30, "t": "很乐意与别的小孩分享东西（糖果、玩具、笔等等）"}, {"n": 31, "t": "经常发脾气，易怒"}, {"n": 32, "t": "颇孤独，比较多自己玩"}, {"n": 33, "t": "一般来说比较顺从，通常是成年人要求要做的都肯做"}, {"n": 34, "t": "有很多担忧，经常表现出忧虑"}, {"n": 35, "t": "如果有人受伤、沮丧或是生病，都很乐意提供帮助"}, {"n": 36, "t": "当坐着时，会持续不断地摆弄手脚或扭动身子"}, {"n": 37, "t": "至少有一个好朋友"}, {"n": 38, "t": "经常与别的小孩吵架或欺负他们"}, {"n": 39, "t": "经常不高兴、情绪低落或哭泣"}, {"n": 40, "t": "一般来说，受别的小孩所喜欢"}, {"n": 41, "t": "容易分心，不能全神贯注"}, {"n": 42, "t": "在新的情况下，会紧张或爱粘人，容易失去信心"}, {"n": 43, "t": "对年纪小的小孩和善"}, {"n": 44, "t": "经常撒谎或欺骗"}, {"n": 45, "t": "受别的小孩作弄或欺负"}, {"n": 46, "t": "经常自愿地帮助别人（父母、老师或其他小孩）"}, {"n": 47, "t": "做事   {k:"A-lao", label:"老大"},
  {k:"A-er", label:"老二"},
  {k:"B-ba", label:"爸爸"},
  {k:"B-ma", label:"妈妈"},

  {k:"C-hai", label:"家庭功能·孩子"},
  {k:"D-ma", label:"妈妈·专属"}
];
let cur = null;
const CDIMS = [
  {key:"C1", name:"亲密度", advice:"优先做\"无目的陪伴\"：一起吃饭/散步，不谈学习不谈问题"},
  {key:"C2", name:"适应性", advice:"优先做\"放权试验\"：给她一件事全权决定，忍住不插手"},
  {key:"C3", name:"沟通", advice:"优先做\"听满三分钟\"：她说什么都只回\"嗯，然后呢\""},
  {key:"C4", name:"情绪反馈", advice:"优先做\"看见就说出\"：\"你今天好像不太舒服\"——只说不问"}
];
function lsKey(){ return "nfpp_wj_" + cur; }
function save(n, v){
  if(!cur) return;
  let d = JSON.parse(localStorage.getItem(lsKey()) || "{}");
  if(v === null || v === "") delete d[n]; else d[n] = v;
  localStorage.setItem(lsKey(), JSON.stringify(d));
}
function load(){ try { return JSON.parse(localStorage.getItem(lsKey()) || "{}"); } catch(e) { return {}; } }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function famCalc(){
  const saved = load();
  return CDIMS.map(d => {
    let yes=0, unsure=0, no=0, na=0;
    for(let i=1;i<=5;i++){
      const v = saved[d.key+"_"+i];
      if(v === undefined || v === "") na++;
      else if(v === "0") yes++;
      else if(v === "1") unsure++;
      else if(v === "2") no++;
    }
    return {name:d.name, key:d.key, yes:yes, unsure:unsure, no:no, na:na, sig:unsure+no, advice:d.advice};
  });
}
function updateFamResult(){
  const el = document.getElementById("famres");
  if(!el) return;
  const dims = famCalc();
  const maxSig = Math.max.apply(null, dims.map(d=>d.sig));
  const done = dims.every(d=>d.na===0);
  let h = "<h2>家庭功能四维结果</h2><div class='note'>信号数=每维\"不确定\"+\"否\"的个数（0-5）；数最多的维度=当前最卡的一格</div>";
  dims.forEach(d=>{
    const lv = d.sig>=4?"重卡":d.sig>=3?"卡":d.sig>=1?"留意":"稳";
    h += "<div class='q'><div class='qt'><b>"+d.name+"</b> 信号 "+d.sig+"/5（是"+d.yes+" · 不确定"+d.unsure+" · 否"+d.no+(d.na?" · 未答"+d.na:"")+"）→ "+lv+"</div>";
    if(d.sig===maxSig && maxSig>0) h += "<div class='note'>"+d.advice+"</div>";
    h += "</div>";
  });
  if(!done){ h += "<div class='note'>（还有题没答，答完看完整判定）</div>"; }
  else if(maxSig===0){ h += "<div class='note'>四维全稳——保持现状，别折腾。</div>"; }
  else { h += "<div class='note'>一次只改一格：先动上面给了建议的那一格，其他三格会跟着松动（家庭系统的杠杆效应）。这不是诊断工具，是找\"最值得先动的那一格\"。</div>"; }
  el.innerHTML = h;
}

function renderWho(){
  const w = document.getElementById("who");

  IDENTITIES.forEach(id => {
    const b = document.createElement("button");
    b.textContent = id.label;
    b.className = (cur === id.k) ? "sel" : "";
    b.onclick = () => { cur = id.k; render(); };
    w.appendChild(b);
  });
}
function qHtml(sec, q, extra){
  const name = sec.key + "_" + q.n;
  let h = '<div class="q" id="q_' + name + '"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div>';
  h += '<div class="opts">' + sec.anchor.map((a, i) =>
    '<label class="opt" id="o_' + name + '_' + i + '" onclick="pick(\'' + name + '\',' + i + ',this)">' + a + '</label>'
  ).join('') + '</div></div>';
  return h;
}
function pick(name, i, el){
  document.querySelectorAll('#q_' + name + ' .opt').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  save(name, String(i));
  if(cur && cur.startsWith("C-")) updateFamResult();
  progress();
}
function render(){

    SURVEY.A0.forEach((f, i) => {
      const key = "A0_" + i;
      h += '<div class="q"><div class="qt">' + esc(f) + '</div><input class="txt" id="in_' + key + '" value="' + esc(saved[key] || "") + '" oninput="save(\'' + key + '\', this.value)"></div>';
    });
    h += '</div>';
  }
  data.forEach(sec => {
    h += '<div class="card"><h2>' + esc(sec.title) + '</h2>';
    if(sec.note) h += '<div class="note">' + esc(sec.note) + '</div>';
    if(sec.anchor){
      h += '<div class="note">计分：' + sec.anchor.map((a,i) => (i) + "=" + a).join(" / ") + '</div>';
      sec.questions.forEach(q => { h += qHtml(sec, q); });
    }
    if(sec.special){
      sec.special.forEach(q => {
        const name = sec.key + "_" + q.n;
        h += '<div class="q" id="q_' + name + '"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div><div class="opts">' +
          q.opts.map((a, i) => '<label class="opt" id="o_' + name + '_' + i + '" onclick="pick(\'' + name + '\',' + i + ',this)">' + a + '</label>').join('') +
          '</div></div>';
      });
    }
    if(sec.open){
      sec.open.forEach(q => {
        const name = sec.key + "_" + q.n;
        h += '<div class="q"><div class="qt"><b>' + name + '</b>' + esc(q.t) + '</div><textarea id="ta_' + name + '" oninput="save(\'' + name + '\', this.value)">' + esc(saved[name] || "") + '</textarea></div>';
      });
    }
    h += '</div>';
  });
  if(isC){
    h += '<div class="card" id="famres"></div>';
  }
  document.getElementById("form").innerHTML = h;
  Object.keys(saved).forEach(k => {
    if(k.startsWith("A0_")) return;
    const el = document.getElementById("o_" + k + "_" + saved[k]);
    if(el) el.classList.add("sel");
  });
  if(isC){ updateFamResult(); }
  progress();
}
function totalQ(){
  const isA = cur.startsWith("A-");
  const isC = cur.startsWith("C-");
  const isD = cur.startsWith("D-");
  const data = isA ? SURVEY.A : (isC ? SURVEY.C : (isD ? SURVEY.D : SURVEY.B));
  let t = 0;
  data.forEach(sec => { t += (sec.questions ? sec.questions.length : 0) + (sec.special ? sec.special.length : 0) + (sec.open ? sec.open.length : 0); });
  return t + (isA ? 0 : 0);
}
function progress(){
  if(!cur){ return; }
  const answered = Object.keys(load()).filter(k => !k.startsWith("A0_")).length;
  document.getElementById("prog").textContent = "已答 " + answered + " / " + totalQ();
}
function buildText(){
  const isA = cur.startsWith("A-");
  const isC = cur.startsWith("C-");
  const isD = cur.startsWith("D-");
  const idLabel = IDENTITIES.find(x => x.k === cur).label;
  const data = isA ? SURVEY.A : (isC ? SURVEY.C : (isD ? SURVEY.D : SURVEY.B));
  const saved = load();
  let out = "【NFPP问卷·" + idLabel + "·" + new Date().toLocaleString("zh-CN") + "】\n";
  if(isC){
    out += "[四维信号] " + famCalc().map(d=>d.name+":"+d.sig+"/5").join(" ") + "\n";
  }
  if(isA){
    SURVEY.A0.forEach((f, i) => { out += f + ": " + (saved["A0_" + i] || "") + "\n"; });
  }
  data.forEach(sec => {
    let rows = [];
    const put = (n) => { const v = saved[sec.key + "_" + n]; rows.push(n + "=" + (v === undefined ? "-" : v)); };
    if(sec.anchor) sec.questions.forEach(q => put(q.n));
    if(sec.special) sec.special.forEach(q => put(q.n));
    if(rows.length) out += "[" + sec.key + "] " + rows.join(" ") + "\n";
    if(sec.open) sec.open.forEach(q => { out += "[" + sec.key + "_" + q.n + "] " + (saved[sec.key + "_" + q.n] || "(未答)") + "\n"; });
  });
  return out;
}
function exportAns(show){
  if(!cur){ alert("请先选择身份"); return; }
  const t = buildText();
  document.getElementById("out").style.display = "block";
  document.getElementById("outtxt").value = t;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => alert("已复制，直接粘贴发给助手即可")).catch(() => {});
  }
  document.getElementById("out").scrollIntoView({behavior:"smooth"});
}
function downloadTxt(){
  if(!cur){ alert("请先选择身份"); return; }
  const blob = new Blob([buildText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nfpp_wenjuan_" + cur + ".txt";
  a.click();
}
function clearAll(){
  if(!cur){ return; }
  if(confirm("清空当前身份的全部答案？")){
    localStorage.removeItem(lsKey());
    render();
  }
}
render();
</script>
