\"语言\"，是\"心\"的外在表现。所以正确答案是D。从\"语言\"入手，觉察自己的\"心模式\"——\"被动的语言\"背后，是\"被动的心\"。"},{stem:"哈佛商学院做过一个非常经典的心理学实验。他们给两组学生看一张\"双关图\"（同一张图，既像\"少妇\"又像\"老妇\"）。先给第一组看一张\"清晰的青年女子照片\"，再给第二组看一张\"清晰的老妇人照片\"，最后两组一起看那张\"双关图\"。结果，两组人\"各执一词、互不相让\"，都坚信自己看到的是\"少妇\"或\"老妇\"。这个实验，揭示了\"认知\"的一个惊人真相。《广论》讲\"先入为主、成见障眼\"也讲这个道理——日常法师反复讲，\"人一旦'先'认定了一个'见'，就会'戴着这个'有色眼镜'去看一切，'再也看不到'别的'真相'\"；\"'成见'（邪见、先入之见），是'智慧'最大的障碍\"。那么，这个\"少妇/老妇双关图\"实验说明了什么？",options:["不同人的视力存在差异", "条件作用对认知有强大影响力，思维定式决定你看到什么", "有些人的视力天生更好", "年龄大小会影响判断"],answer:1,explanation:"✅ 答案是B。这个实验说明\"条件作用对认知有强大影响力，思维定式决定你看到什么\"——两组人看到的是\"同一张图\"，却因为\"先前被'条件化'（分别看了青年女子/老妇的照片）\"，形成了\"不同的'思维定式'\"，于是\"各自只看到自己'预想'的那个'样子\"，并\"坚信'事实'就是如此\"。这说明：我们的\"认知\"不是\"镜子反射客观\"，而是\"被'先入之见、思维定式'（范式）深刻塑造的\"。这个\"先入为主、成见障眼\"的道理，和广论讲\"成见（邪见）障智慧\"完全一致：日常法师反复讲，人一旦\"先\"认定了一个\"见\"，就会\"戴着这个有色眼镜\"去看一切，\"再也看不到\"别的\"真相\"；\"成见（邪见、先入之见），是智慧最大的障碍\"。所以正确答案是B。\"你以为的'事实'，可能只是你的'思维定式'\"——这正是\"范式转换\"（思维转换）如此重要的原因。"},{stem:"在讲解\"效能\"的概念时，柯维给出了一个关于\"效能\"的公式。不过需要特别提醒的是，这个公式是柯维为了\"强调'产出'和'产能'的'相对'关系\"而提出的一个\"思维模型\"。\"效能\"的高低，正是由这个公式里\"分子\"和\"分母\"的比例决定的。《广论》讲\"权衡轻重、护持因缘\"也讲这个道理——日常法师反复讲，\"要看'一件事'值不值、成效高不高，不能只看'果'（产出），还要看'因'（产能、代价）\"，\"要'权衡'两者的比例\"。那么，柯维给出的\"效能\"公式是什么？",options:["效能=产出÷产能", "效能=产出×产能", "效能=产出-产能", "效能=产出+产能"],answer:0,explanation:"✅ 答案是A。柯维给出的\"效能\"公式是\"效能=产出÷产能\"——\"产出\"是\"果\"（你想要的结果），\"产能\"是\"因\"（生产这些结果所需的\"能力\"和\"资源\"）。这个公式的深意在于：追求\"高效能\"，是要追求\"产出\"和\"产能\"的\"平衡与合理比例\"（既要产出，也要维护产能），而不是\"片面'最大化'某一项\"。这个\"权衡因果、护持因缘\"的道理，和广论讲\"权衡轻重\"完全一致：日常法师反复讲，要看一件事值不值、成效高不高，不能只看\"果（产出）\"，还要看\"因（产能、代价）\"，要\"权衡\"两者的比例——\"因\"伤了的\"果\"，是\"不可持续\"的。所以正确答案是A。\"效能=产出÷产能\"——别只顾\"拿蛋\"，忘了\"养鹅\"。"},{stem:"七个习惯的第七个，是\"不断更新\"。柯维用一个\"伐木工人\"的寓言来引出它：一个伐木工人拼命砍树，累得满头大汗，一个路人建议他\"歇一歇、把锯子磨一磨\"，他却说\"我太忙了，没时间磨锯！\"柯维指出，这个\"没时间磨锯\"的人，正是很多\"忙碌却低效\"的人的写照。《广论》讲\"借假修真、护持法器\"也讲这个道理——日常法师反复讲，\"身体、精神（这个'法器'）要'时常'养护、调养，才能'更好地'用来'修行、做事'\"；\"'累垮'了'法器'，反而'什么都做不成'\"。那么，\"不断更新\"这个习惯，涉及哪四个层面的\"修整\"？",options:["健康、财富、关系、事业", "身体、精神、智力、社会/情感", "工作、生活、家庭、社交", "学习、运动、饮食、休息"],answer:1,explanation:"✅ 答案是B。\"不断更新\"涉及\"身体、精神、智力、社会/情感\"四个层面——\"身体\"（锻炼、饮食、休息）；\"精神\"（价值澄清、冥想、亲近艺术与自然等\"养心\"）；\"智力\"（阅读、学习、写作等\"练脑\"）；\"社会/情感\"（投入情感账户、服务他人、与人联结）。这四方面\"均衡地更新\"，才能\"持续地'高效能'\"——就像\"磨锯子\"，是\"为了更好地砍树\"。这个\"护持法器、借假修真\"的道理，和广论完全一致：日常法师反复讲，身体、精神（这个\"法器\"）要\"时常养护、调养\"，才能\"更好地用来修行、做事\"；\"累垮了法器，反而什么都做不成\"。所以正确答案是B。\"磨刀不误砍柴工\"——四个层面\"不断更新\"，才是\"持续高效能\"的秘密。"},{stem:"柯维的儿子打橄榄球。在比赛场上，犯错几乎是不可避免的——而如何对待\"错误\"，恰恰是区分\"优秀\"和\"平庸\"的关键。柯维的儿子，就想出了一个\"很独特、也很有效\"的方法，来\"处理自己的错误\"，让自己\"不被错误拖住、能轻装上阵\"。这个方法，看似有点\"仪式感\"，却蕴含着深刻的智慧。《广论》讲\"忏悔、放舍过去\"也讲这个道理——日常法师反复讲，\"对'过去'的'错误'，要'如法'地'忏悔、放舍'，然后'轻装'向前\"，\"'揪着'过去的'错误'不放，是'沉重的'负担\"。那么，柯维的儿子用什么方法来\"处理比赛中的错误\"？",options:["打开表带再扣上——以示清空记忆", "和教练讨论失误原因", "反复回看比赛录像", "赛后写日记反思错误"],answer:0,explanation:"✅ 答案是A。柯维的儿子用来\"处理错误\"的方法是\"打开表带再扣上——以示清空记忆\"：每次在比赛中犯错，他就\"把表带打开、再扣上\"，用这个\"简单的动作\"作为一个\"仪式\"，告诉自己\"这个错误已经过去、翻篇了\"，从而\"清空\"掉\"对自己的懊恼和纠结\"，\"轻装上阵\"打下一球。这个\"忏悔、放舍过去\"的智慧，和广论讲\"发露忏悔、放舍\"完全一致：日常法师反复讲，对\"过去\"的\"错误\"，要\"如法地忏悔、放舍\"，然后\"轻装\"向前；\"揪着过去的错误不放，是沉重的负担\"。所以正确答案是A。别让\"上一个错误\"拖住你——\"仪式性地放下它\"，才能\"全情投入\"当下。"},{stem:"在讨论\"双赢思维\"时，柯维提出了一个很多人难以接受、甚至有点\"反常识\"的观点：\"如果不能双赢，就好聚好散。\"他把\"好聚好散（No Deal）\"看作\"双赢思维\"的一种\"高尚选择\"，而不是\"失败的妥协\"。这背后，是\"不委屈、不亏欠\"的成熟智慧。《广论》讲\"随缘、不强求、彼此不伤\"也讲这个道理——日常法师反复讲，\"能'和合共成'善事最好；'和合'不了，就'善巧'地'放下'，'不强求、不亏欠、彼此不伤'\"，\"这本身就是一种'高'的'境界'\"。那么，柯维把\"好聚好散（No Deal）\"看做什么？",options:["消极逃避困难", "好聚好散(No Deal)是双赢思维的一种高尚选择", "从不做出任何妥协", "缺乏谈判技巧所致"],answer:1,explanation:"✅ 答案是B。柯维把\"好聚好散（No Deal）\"看作\"双赢思维的一种高尚选择\"——当\"双方根本利益\"确实无法调和、找不到\"双赢\"方案时，\"好聚好散\"（坦诚地说\"谈不拢就不做\"，彼此尊重、不伤和气）反而比\"勉强成交（必然一方受损、甚至两败俱伤）\"更高尚、更成熟。它不是\"软弱、逃避\"，而是\"有原则、有底线\"的\"成熟选择\"。这个\"随缘不强求、彼此不伤\"的道理，和广论完全一致：日常法师反复讲，能\"和合共成\"善事最好；\"和合\"不了，就\"善巧地放下，不强求、不亏欠、彼此不伤\"——这本身就是一种\"高\"的境界。所以正确答案是B。\"谈不拢就体面地散\"——不委屈自己，也不亏欠别人，这是\"双赢思维\"的完整版。"},{stem:"前面提到柯维在女儿三岁生日派对上的\"失败育儿\"经历。柯维在书中非常坦诚地、甚至有点自嘲地，详细复盘了自己当时\"用尽了手段\"却\"一步步走向失败\"的全过程。这个\"手段的递进\"，生动地展示了\"当我们的'心'（思维定式）错了时，再多的'技巧'都只会让事情越搞越糟\"。《广论》讲\"根本错了、枝末再精亦无益\"也讲这个道理——日常法师反复讲，\"'根'（正见、心态）错了，'枝叶'（方法、技巧）再'精巧'，也'无益'，甚至'越做越错'\"。那么，柯维当时\"教育\"女儿\"分享\"，依次用了哪些手段？",options:["威胁→利诱→讲道理→武力→放弃", "要求→讲道理→利诱→威胁→武力", "利诱→要求→讲道理→威胁→武力", "讲道理→利诱→威胁→武力→放弃"],answer:1,explanation:"✅ 答案是B。柯维当时\"教育\"女儿分享，依次用了\"要求→讲道理→利诱→威胁→武力\"这五种手段：先\"直接要求\"她分享；不行就\"讲道理\"；还不行就\"利诱\"（给好处）；再不行就\"威胁\"（不给就怎样）；最后甚至\"武力\"（动手）——结果\"一步步升级\"却\"全都失败\"，女儿\"越哭越凶、越闹越僵\"。这个\"根错则枝末皆废\"的道理，和广论讲\"根本错了、枝末再精亦无益\"完全一致：日常法师反复讲，\"根（正见、心态）错了，枝叶（方法、技巧）再精巧，也无益，甚至越做越错\"。所以正确答案是B。当\"思维定式\"（根）错了（他认为是\"孩子'该'分享、被逼着分享\"），再多的手段（讲道理、利诱、威胁、武力）都只会\"越搞越糟\"。"},{stem:"在弗兰克尔的理论基础上，柯维进一步总结出了\"人类区别于动物的四种独特天赋\"（也叫四种人类禀赋）。这四种天赋，让人类\"拥有'选择'的力量\"，从而能够\"积极主动\"——而动物、以及被\"消极被动\"支配的人，是\"用不上\"这四种天赋的。《广论》讲\"人的殊胜功德（思择力、自主力）\"也讲这个道理——日常法师反复讲，\"人之所以'胜过'畜生，正是因为'人'能'思惟、能抉择、能自主'，有'修行、转凡成圣'的'能力'\"；\"这是'人'最'宝贵'的'禀赋'（暇满人身）。那么，以下哪一项【不是】柯维所说的\"四种独特天赋\"之一？",options:["自我意识", "想象力", "独立意志", "记忆力"],answer:3,explanation:"✅ 答案是D。这道题问哪一项\"不是\"四种独特天赋之一。柯维总结的\"四种人类天赋\"是\"自我意识\"（能觉察自己的思维和情绪）、\"想象力\"（能超越现实、在脑中创造）、\"良知\"（能分辨是非善恶）和\"独立意志\"（能不受外界影响、自主选择行动）。所以\"记忆力\"【不是】这四种天赋之一（此外柯维说的是\"良知\"，不是\"记忆力\"）。这个\"人是万物之灵、有思择自主力\"的道理，和广论讲\"暇满人身、人的殊胜\"完全一致：日常法师反复讲，人之所以\"胜过\"畜生，正是因为人能\"思惟、能抉择、能自主\"，有\"修行、转凡成圣\"的\"能力\"——这是人最宝贵的\"禀赋\"（暇满人身）。所以正确答案是D。\"自我意识、想象力、良知、独立意志\"——这是人\"能选择、能精进\"的四种\"本钱\"。"},{stem:"在讲\"以终为始\"这个习惯时，柯维提到了一个非常形象、又有点扎心的比喻，用来提醒那些埋头苦干、却从不抬头看一眼\"方向对不对\"的人。他说，这样的人\"再勤快、再高效\"都没用，因为一开始\"方向\"就错了。《广论》讲\"先正见、后正行\"也讲这个道理——日常法师反复讲，\"'方向'（正见、目标）错了，'努力'（行动）越'多'、越'快'，'偏差'就'越大'\"；\"要'先'把'方向'搞对，再谈'用力'\"。那么，柯维用什么比喻来提醒\"忙碌却方向错误\"的人？",options:["计划总赶不上变化", "享受当下才是最重要", "走一步看一步、随波逐流", "忙碌的人未必出成果，梯子搭错了墙就白费工夫"],answer:3,explanation:"✅ 答案是D。柯维用的比喻是\"忙碌的人未必出成果，梯子搭错了墙就白费工夫\"——一个人\"拼命地、高效地\"爬梯子（勤奋工作），但如果\"梯子搭错了墙\"（方向、目标错了），那么他\"爬得越高、越快\"，离\"真正的目标\"反而\"越远\"——\"白费工夫\"。这里的\"梯子搭在哪面墙\"，就是\"以终为始\"要解决的问题。\"先正见、后正行\"的道理，和广论完全一致：日常法师反复讲，\"方向（正见、目标）错了，努力（行动）越多、越快，偏差就越大\"；要\"先把方向搞对，再谈用力\"。所以正确答案是D。先\"看清'梯子搭在哪面墙'\"，再\"拼命爬\"——\"以终为始\"，就是\"先校准方向\"。"},{stem:"很多人会想当然地把\"积极主动\"和\"积极思考\"混为一谈，以为\"积极主动\"就是\"凡事往好处想\"\"保持乐观心态\"。柯维却指出，这是一个重大的误解——\"积极思考\"只是\"积极主动\"的一小部分，而且\"只停留在脑子里\"是\"远远不够\"的。《广论》讲\"解行并重、贵在实行\"也讲这个道理——日常法师反复讲，\"光'懂得'、光'想通'了道理（解），如果不'落实到'行动（行），是'空'的\"；\"'修行'（地熟行持），贵在'真的去做'\"。那么，柯维强调的\"积极主动\"与\"积极思考\"的本质区别是什么？",options:["积极思考比积极主动更重要", "积极主动就是不顾后果地行动", "积极主动重在行动和选择，不只是在脑子里想", "没有区别"],answer:2,explanation:"✅ 答案是C。\"积极主动\"与\"积极思考\"的本质区别是\"积极主动重在'行动'和'选择'，不只是在脑子里想\"——\"积极思考\"是\"在脑子里'往好处想'\"（心态层面）；而\"积极主动\"是\"落实在'行动'和'选择'上\"：面对刺激，\"主动地'选择'回应方式\"、并\"实际地'去行动、去改变'\"，而不仅仅是\"心里换个好心态\"。柯维强调，光\"想\"不\"做\"，不算\"积极主动\"。这个\"解行并重、贵在实行\"的道理，和广论讲\"闻思修、解行相应\"完全一致：日常法师反复讲，光\"懂得\"、光\"想通\"了道理（解），如果不\"落实到行动\"（行），是\"空\"的；\"修行（地熟行持），贵在真的去做\"。所以正确答案是C。\"积极主动\"是\"动词\"，不是\"形容词\"——是\"去选择、去行动\"，不是\"光想想\"。"},{stem:"柯维讲了一个关于\"销售主管面对独断专行的老板\"的经典案例，来区分\"积极主动\"和\"消极被动\"的选择。这位销售主管的老板\"独断专行、听不进意见\"，还把\"市场下滑、业绩不佳\"的责任\"全推给手下\"。面对这样的处境，销售主管可以有多种\"被动\"的选择，但柯维赞赏的是另一种\"主动\"的选择。《广论》讲\"随缘应化、转逆缘为道用\"也讲这个道理——日常法师反复讲，\"面对'难缠的人、糟糕的境'，'消极' 的人只会'抱怨、逃避、对抗'；'积极' 的人，会'看我能'在这个境里头'做点什么、成长什么、利益什么'\"。那么，面对\"独断专行\"的老板，柯维赞赏销售主管怎么做？",options:["跳槽到竞争对手公司", "设法弥补老板的缺失、缓冲下属压力", "拍老板马屁", "联合其他主管对抗老板"],answer:1,explanation:"✅ 答案是B。面对\"独断专行\"的老板，柯维赞赏销售主管\"设法弥补老板的缺失、缓冲下属压力\"——不\"拍马屁\"、不\"联合对抗\"、不\"消极跳槽\"，而是\"积极主动地\"在自己\"影响圈\"内做事：主动去\"补上\"老板\"独断\"带来的\"信息缺失\"和\"决策盲区\"，同时\"缓冲\"老板的\"粗暴\"给下属造成的\"压力\"。这样，他\"不是被动的受害者\"，而是\"主动的、有价值的贡献者\"（也因此\"影响圈\"越来越大）。这个\"转逆缘为道用、随缘应化\"的道理，和广论完全一致：日常法师反复讲，面对\"难缠的人、糟糕的境\"，消极的人只会\"抱怨、逃避、对抗\"；积极的人会\"看我能在这个境里头做点什么、成长什么、利益什么\"。所以正确答案是B。\"积极主动\"不挑环境——在任何环境里，都问\"我能主动做点什么\"。"},{stem:"柯维给读者提了一个非常具体、也非常实用的读书建议——这个建议，能让你的阅读效果\"翻倍\"。它的核心是\"带着'输出'的'意识'去读\"：你要在心里\"预设\"一个\"48小时内要和别人分享、讨论这本书\"的目标，这样你读书时就会\"更专注、更主动地'理解和消化'\"。《广论》讲\"闻法后、如理作意、随转分享\"也讲这个道理——日常法师反复讲，\"'听'了、'读'了，要'思惟'、'消化'，还要'把它'讲出来、转施'给别人\"，\"'讲'的过程，正是'深一层消化'的过程\"；\"'法施'，是'最殊胜'的'功德'之一\"。那么，柯维建议的\"让阅读效果翻倍\"的方法是什么？",options:["写一篇完整的读书论文", "边读边做详细教案", "预计在48小时内与人分享或讨论读书心得", "对书中观点进行系统批判"],answer:2,explanation:"✅ 答案是C。柯维建议的\"让阅读效果翻倍\"的方法是\"预计在48小时内与人分享或讨论读书心得\"——带着\"我很快要讲给别人听、和别人讨论\"的\"预期目标\"去读，你就会\"读得更专注、更主动地去理解和提炼要点\"，\"吸收\"效果远胜于\"漫无目的地翻\"。\"输出倒逼输入\"，是这个方法的精髓。这个\"闻后思惟、转施分享\"的道理，和广论讲\"法施、转施\"完全一致：日常法师反复讲，\"听\"了、\"读\"了，要\"思惟、消化\"，还要\"把它讲出来、转施给别人\"；\"讲\"的过程，正是\"深一层消化\"的过程；\"法施\"，是\"最殊胜\"的\"功德\"之一。所以正确答案是C。带着\"要讲给别人听\"的预期去读——\"教\"，是最好的\"学\"。"},{stem:"柯维将美国成功学的历史，大致划分成了两个阶段：前150年的\"品德时代\"，和一战后兴起的\"个人魅力时代\"。在前一个时代，成功学著作反复强调的，是一系列\"内在的、稳定的\"品质——这些品质，才是柯维认为\"真正\"决定一个人\"长期成功\"的\"根\"。《广论》讲\"戒德为本、善行为基\"也讲这个道理——日常法师反复讲，\"'品德'（戒、慈、忍……这些'内在的善'）是'一切成就'的'根基'\";\"'舍'掉了'品德'这个'根'，'外'面的'枝叶'再繁茂，也'不长久'\"。那么，前150年\"品德时代\"的成功学，强调的核心是什么？",options:["积极进取的思维", "社会形象和沟通技巧", "诚信、谦虚、忠诚、勇气、公正、勤勉等品德", "出众的聪明才智"],answer:2,explanation:"✅ 答案是C。前150年\"品德时代\"的成功学，强调的核心是\"诚信、谦虚、忠诚、勇气、公正、勤勉等品德\"——这些\"内在的、稳定的道德品质\"。那时的著作认为，\"真正的成功\"，根植于一个人的\"品德\"（诚信待人、勤勉做事、公正仁慈），而不是\"外在的技巧\"。柯维主张\"回归品德\"，因为\"品德\"才是\"长期成功\"的\"根\"。这个\"戒德为本、善行为基\"的道理，和广论讲\"品德为根本\"完全一致：日常法师反复讲，\"品德（戒、慈、忍……这些内在的善）是\"一切成就\"的根基\"；\"舍\"掉了\"品德\"这个\"根\"，\"外\"面的\"枝叶\"再繁茂，也\"不长久\"。所以正确答案是C。\"品德\"是\"根\"，\"技巧\"是\"枝\"——前150年的古人，比我们更懂这个\"根本\"。"},{stem:"柯维在教学中，有一个他\"最常问学生\"的问题。这个问题，往往能让那些整天忙忙碌碌、追逐外在成功的学生\"瞬间安静下来、陷入深思\"——因为它直指一个\"被忙碌掩盖\"的真相。柯维借这个问题，提醒人们：别在\"临终\"时才\"后悔\"这一生\"把时间都用错了地方\"。《广论》讲\"念死无常、反照人生\"也讲这个道理——日常法师反复讲，\"把'死'放在眼前，反过来问自己：'这一生，我到底在忙什么？值不值得？'\"，\"这个'反思'，能让人'幡然醒悟'、'重新排定'人生的'优先'\"。那么，柯维\"最常问学生\"的、直指人生优先的问题是哪一个？",options:["静心读书", "陪家人", "工作或看电视", "出门旅行走走"],answer:2,explanation:"✅ 答案是C。柯维最常问学生的问题（大意）是\"如果你只剩下一周的寿命，你会怎么安排这最后一周？\"——而多数学生的回答，都集中在\"陪家人、旅行、读书、完成有意义的事\"上，却\"几乎没有一个人\"说\"我想多工作一会儿、多看会儿电视\"。柯维借这个\"反差\"，提醒人们：既然\"你明知'临终'最想做什么\"，为什么\"现在\"却把\"最多的时间\"花在\"工作（忙碌）或看电视（消磨）\"上？这个\"念死反照、重排优先\"的道理，和广论讲\"念死无常\"完全一致：日常法师反复讲，把\"死\"放在眼前，反过来问自己\"这一生，我到底在忙什么、值不值得\"，这个\"反思\"能让人\"幡然醒悟、重新排定人生的优先\"。所以正确答案是C。别等\"临终\"才后悔——现在就用\"终点\"的视角，重排你的\"优先\"。"},{stem:"前面讲过，柯维把成熟路径划分为\"依赖→独立→互赖\"。很多人（包括很多高成就者）都有一个普遍的\"误解\"：以为\"独立\"（不靠别人、自己能干）就是\"最高\"的成熟境界了。柯维却指出，\"独立\"只是\"中途站\"，真正的、更高级的成熟是\"互赖\"。《广论》讲\"自利利他、发菩提心为上\"也讲这个道理——日常法师反复讲，\"'独善其身'（自利）是'小乘'，能'自利利他'、发'菩提心'（利他），才是'大乘'、才是'上'的'道'\"；\"'利他'，是比'自利'更'高'的境界\"。那么，柯维如何纠正\"独立是最高成就\"这个误解？",options:["互赖是比独立更成熟的高级概念", "三者没有优劣之分", "独立是最高成就", "依赖和互赖本质相同"],answer:0,explanation:"✅ 答案是A。柯维纠正\"独立是最高成就\"这个误解，指出\"互赖是比独立更成熟的高级概念\"——\"独立\"只是\"成熟的中途站\"（从\"依赖\"走出来、能\"自立\"）；但人类的\"更高成就\"，在于\"互赖\"（能\"自立\"的人，彼此\"合作、共赢、成就彼此\"）。\"独立\"的人\"自己强\"，\"互赖\"的人\"能'借着'彼此'让大家都强'\"，后者是\"更高的成熟\"。这个\"自利利他、利他为上\"的道理，和广论讲\"发菩提心\"完全一致：日常法师反复讲，\"独善其身（自利）是小乘，能'自利利他'、发菩提心（利他），才是大乘、才是上的道\"；\"利他，是比自利更高的境界\"。所以正确答案是A。\"独立\"是\"自立\"，\"互赖\"是\"共赢\"——从\"独善\"走向\"兼济\"，才是更高的成熟。"},{stem:"在批判一战后的成功学潮流时，柯维反复使用了一个术语——\"个人魅力\"，以及由此衍生的\"个人魅力论\"。这个术语，指的是一整套\"关于'外在形象'和'人际技巧'的'速成'学问\"。理解它，才能理解柯维\"为什么对这股潮流忧心忡忡\"。《广论》讲\"末、表、装饰之非\"也讲这个道理——日常法师反复讲，\"只在外表、言谈、形象这些'表面'下功夫，而'不修'内在的'品德、正见'，是'舍本逐末'\"。那么，柯维所说的\"个人魅力\"具体指什么？",options:["长得好看、仪表出众", "优雅有气质的谈吐", "个人独特的性格魅力", "性格、社会形象、行为态度、人际关系和公关技巧等成功捷径"],answer:3,explanation:"✅ 答案是D。柯维所说的\"个人魅力\"具体指\"性格、社会形象、行为态度、人际关系和公关技巧等成功捷径\"——一整套\"教你如何在'外表、形象、谈吐、人际'上'包装'自己、'快速'赢得'好感'和'成功'\"的\"表面功夫\"和\"速成技巧\"。柯维主张\"品德\"为本，而这些\"个人魅力\"技巧只是\"枝末\"，若\"离了品德\"就成了\"华而不实的捷径\"。这个\"末、表、装饰之非\"的道理，和广论讲\"舍本逐末\"完全一致：日常法师反复讲，只在\"外表、言谈、形象\"这些\"表面\"下功夫，而不修\"内在的品德、正见\"，是\"舍本逐末\"。所以正确答案是D。\"个人魅力\"是\"表面的技巧\"，\"品德\"是\"内在的根\"——可别只学\"末\"、丢了\"本\"。"},{stem:"柯维在他任教的过程中，经常遇到学生用\"被动式语言\"来请假、来解释自己的行为（比如\"我不得不去参加XX\"）。柯维没有简单地\"批准\"或\"拒绝\"，而是用一种\"巧妙的方式\"，帮助学生\"看清\"自己言语背后的\"被动心态\"。《广论》讲\"善巧引导、令自觉察\"也讲这个道理——日常法师反复讲，\"真正'会教'的人，不'直接'替人'下结论'，而是'引导'对方'自己'去'觉察、反省'，这样才'入心'\"。那么，面对学生说\"我不得不去\"，柯维是怎么做的？",options:["让他写一份检讨书", "果断批准他的请假", "拒绝批准他的请假", "问他\"你是自愿还是不得不去\"，帮他认识到这是自己的选择"],answer:3,explanation:"✅ 答案是D。面对学生\"我不得不去\"，柯维会问他\"你是自愿去的，还是不得不去？\"——用这个\"问题\"引导学生\"觉察\"：其实\"去不去\"是\"你自己选择\"的结果，\"没有人'逼'你'不得不'去\"，是你\"自愿\"选择去的。这样，学生就\"看清\"了自己\"把选择权'推给'外界\"的\"被动心态\"，从而\"学会'为自己的选择负责'\"。这个\"善巧引导、令自觉察\"的道理，和广论讲\"善巧接引\"完全一致：日常法师反复讲，真正\"会教\"的人，不\"直接\"替人\"下结论\"，而是\"引导\"对方\"自己\"去\"觉察、反省\"，这样才\"入心\"。所以正确答案是D。\"不得不\"是\"被动\"的语言外衣——撕开它，你才能\"看见\"那个\"主动选择的自己\"。"},{stem:"柯维在阐述\"思维定式是根本、行为态度是枝叶\"时，引用了一句极其有力、极具画面感的名言——出自《圣雄甘地》(梭罗、爱默生、林肯也被认为说过类似的话)。这句话用一个\"砍树\"的比喻，道出了\"改变'根'比改变'枝叶'重要一万倍\"的真理。《广论》讲\"从根本处用功\"也讲这个道理——日常法师反复讲，\"'对治'烦恼、'改变'人，要从'根本'的'见地、观念'上'下手'，比'在'枝叶'（表面行为）上'费力'有效'百千万倍'\"。那么，柯维引用的这句\"砍树\"名言是什么？",options:["\"活在当下\"的处世智慧", "\"一棵邪恶的大树，砍它枝叶千斧，不如砍它根基一斧\"", "\"大道至简\"的朴素道理", "\"万物皆有其时\"的哲理"],answer:1,explanation:"✅ 答案是B。柯维引用的这句名言是\"一棵邪恶的大树，砍它枝叶千斧，不如砍它根基一斧\"——意思是：一棵\"坏树\"（代表\"错误的行为、态度、结果\"），你\"在枝叶上\"砍一千斧（改表面行为），不如\"在根基上\"砍一斧（改变\"根本的思维定式、观念\"）来得彻底。因为\"枝叶\"是\"根\"生出来的，\"根\"一砍，\"枝叶\"自然枯萎。这个\"从根本处用功\"的道理，和广论完全一致：日常法师反复讲，\"对治\"烦恼、\"改变\"人，要从\"根本\"的\"见地、观念\"上\"下手\"，比\"在枝叶（表面行为）上费力\"有效\"百千万倍\"。所以正确答案是B。别在\"枝叶\"（表面）上\"白费千斧\"，要在\"根基\"（思维定式）上\"下那一斧\"。"},{stem:"前面的\"时间管理矩阵\"讲过，高效能人士聚焦\"第二象限\"（重要但不紧急）。但\"要事第一\"这个习惯，还需要一个\"具体可操作\"的落地方法——柯维给出的，是一种\"以周为单位、以原则为中心\"的计划方法。这个方法，把\"计划\"从\"逐日排满日程\"升级成了\"每周先定'重点'\"。《广论》讲\"定课、规划、先务本\"也讲这个道理——日常法师反复讲，\"要'有规律、有计划'地修行\"，\"先把'最重要、最根本'的'功课'定下来、放进去，其余'顺带'安排\"，\"不能'随波逐流、东抓一下西抓一下'\"。那么，柯维推荐的\"要事第一\"的落地方法是什么？",options:["每周做计划，优先安排\"重要但不紧急\"的事", "先去处理所有紧急的邮件", "同时并行处理多个任务", "把日程排得满满当当"],answer:0,explanation:"✅ 答案是A。柯维推荐的\"要事第一\"落地方法是\"每周做计划，优先安排'重要但不紧急'的事\"——把\"计划单位\"从\"天\"提升到\"周\"：每周挑一个固定时间，\"以原则为中心、以角色（丈夫/父亲/员工/学习者…）为框架\"来规划，把\"重要但不紧急\"的事（如锻炼、学习、家庭、战略）\"优先排进\"日历，\"守住\"这些时间，其余\"琐事\"围绕它们安排。这个\"定课、规划、先务本\"的道理，和广论讲\"定课\"完全一致：日常法师反复讲，要\"有规律、有计划\"地修行，先把\"最重要、最根本\"的\"功课\"定下来、放进去，其余\"顺带\"安排，不能\"随波逐流、东抓一下西抓一下\"。所以正确答案是A。别被\"眼前的琐事\"牵着走——\"每周\"先把\"要事\"定下来、守住它。"},{stem:"柯维在一次研讨会上，一位经理向他诉苦：\"我的员工又懒散又敷衍，我该怎么对付他们？\"这时，旁边另一位经理（这家公司的\"客户\"之一）忍不住说了一句\"一针见血\"的话，让那位抱怨的经理哑口无言、面红耳赤。《广论》讲\"将心比心、己所不欲勿施于人\"也讲这个道理——日常法师反复讲，\"你怎么对待'内在的人'（家人、员工），就'照见'了你的'心'；'对外'的'虚伪客气'，瞒不过'自己'的'真心'\"；\"要'一视同仁'地'慈悲'，不能'内外有别'\"。那么，那位\"客户经理\"是怎么\"怼\"这位抱怨员工懒散的经理的？",options:["这样对待员工太残忍了", "用法律手段解决更好", "直接扣他们工资就行", "你怎么不这样对待顾客呢？说\"不想买就滚蛋\"？"],answer:3,explanation:"✅ 答案是D。那位\"客户经理\"怼道：\"你怎么不这样对待顾客呢？说'不想买就滚蛋'？\"——言下之意：你对\"外部\"的\"顾客\"百般\"客气、讨好\"，却对\"内部\"的\"员工\"\"又懒又敷衍\"地\"抱怨、想'对付'\"；你要真是\"那种'对人的态度'\"，为什么不对\"顾客\"也\"甩脸色、说难听话\"？这句话\"照见\"了那位经理\"内外不一、双重标准\"的心态。这个\"将心比心、一视同仁\"的道理，和广论讲\"慈悲平等\"完全一致：日常法师反复讲，你\"怎么对待内在的人（家人、员工）\"，就\"照见\"了你的\"心\"；\"对外\"的\"虚伪客气\"，瞒不过\"自己\"的\"真心\"；要\"一视同仁地慈悲，不能内外有别\"。所以正确答案是D。你对\"顾客\"有多客气，就想想自己\"对员工（家人）\"是不是\"也那样\"——\"内外如一\"，才是真修养。"},{stem:"在阐述\"产出/产能平衡\"时（鹅与金蛋的寓言），柯维把人类拥有的\"资产\"分成了三类，并分别用生动的例子说明了\"只消耗、不维护\"这些资产会带来什么后果。其中有一类资产，\"维护\"的方式不是\"休息\"，而是另一种更微妙的动作。《广论》讲\"护持三种资粮（智慧、功德、法财）\"也讲这个道理——日常法师反复讲，\"有些'资粮'（如'智慧、功德、信誉'）要'持续'地'串习、守护'，而不是'静止'地'存着'就'保值'\"。那么，以下哪一项是柯维所说的\"三类资产\"之外、【并非】三类资产之一的？",options:["知识产权", "物质资产", "人力资产", "金融资产"],answer:0,explanation:"✅ 答案是A。这道题问哪一项\"不是\"柯维所说的\"三类资产\"之一。柯维把资产分成三类：\"物质资产\"（如机器、厂房，需要保养维护）、\"金融资产\"（如金钱、投资，需要理财增值）、\"人力资产\"（如身体、技能、人际关系，需要持续投资维护）。而\"知识产权\"【不算】柯维说的\"三类资产\"之一（它属于\"无形资产\"，但柯维所用的分类是\"物质/金融/人力\"这三类）。这个\"护持资粮\"的道理，和广论讲\"护持三种资粮\"相通：日常法师反复讲，有些\"资粮（智慧、功德、信誉）\"要\"持续地串习、守护\"，而不是\"静止地存着就保值\"。所以正确答案是A。柯维的\"三类资产\"是\"物质、金融、人力\"——别把\"知识产权\"也算进去。"},{stem:"柯维的\"积极主动\"原则，不仅适用于\"自我修炼\"，也适用于\"管理他人\"。假设你是一位经理，你手下有个下属，一遇到困难就抱怨\"这不是我的错\"\"我没办法\"\"上面不支持我\"——典型地把自己当成\"受害者\"。柯维会建议你，不要\"简单地'批评'或'替他把活干了'\"，而要帮他做一件\"更根本\"的事。《广论》讲\"助人自立、令其自觉觉他\"也讲这个道理——日常法师反复讲，\"'帮人'，最高明的是'帮'他'自己'立起来、'自己'觉悟\"，\"而不是'替他'把事'包办'了，让他'更依赖'\"。那么，面对\"受害者心态\"的下属，柯维建议经理怎么做？",options:["直接把他开除掉", "帮他认识到\"你可以选择自己的回应方式\"，培养其责任感", "严厉批评他一顿", "索性替他做完工作"],answer:1,explanation:"✅ 答案是B。面对\"受害者心态\"的下属，柯维建议经理\"帮他认识到'你可以选择自己的回应方式'，培养其责任感\"——不是\"简单批评\"（治标）、不是\"开除\"（逃避）、不是\"替他做\"（让他更依赖），而是\"引导他\"觉察：\"你不是'受害者'，你'有'选择的自由和'责任'。\"帮助他\"把'被动'的心态'转'成'主动'的'责任感'，让他\"自己\"站起来承担责任。这个\"助人自立、令其自觉\"的道理，和广论讲\"助人自立\"完全一致：日常法师反复讲，\"帮人\"最高明的是\"帮他\"自己\"立起来、自己\"觉悟\"，而不是\"替他\"把事\"包办\"了，让他\"更依赖\"。所以正确答案是B。\"授人以鱼\"不如\"授人以渔\"——帮下属\"找回'责任'和'选择权'\"，比\"替他做\"重要得多。"},{stem:"柯维在书的最后，引用了一个《旧约圣经》里极为震撼的人物故事——约瑟的故事。约瑟17岁时被自己的哥哥们\"嫉妒\"、出卖为奴，又被诬陷下狱，人生跌到谷底。但他始终没有\"被仇恨和自怜\"吞噬，而是\"选择\"以一种\"积极、宽恕、负责\"的态度面对，最终\"翻转\"了自己的命运，成为埃及的宰相，还\"饶恕\"了当年害他的哥哥们。《广论》讲\"转逆缘为道用、忍辱成诸功德\"也讲这个道理——日常法师反复讲，\"'逆境'、'迫害'，正是'修'忍辱、'积'功德、'成就'道业'的最好'时机'\"；\"会'转'的人，'最大'的'苦难'能'转'成'最大'的'善'\"。那么，柯维引用\"约瑟被卖为奴却翻转命运\"的故事，想说明什么？",options:["顺从命运的安排", "好人往往没有好报", "被卖为奴也能因积极态度而翻转命运", "复仇是正当合理的"],answer:2,explanation:"✅ 答案是C。柯维引用\"约瑟被卖为奴却翻转命运\"的故事，想说明\"被卖为奴也能因'积极态度'而翻转命运\"——约瑟遭受\"被哥哥出卖、被诬陷下狱\"的\"巨大逆境\"，但他\"不怨天尤人、不沉溺自怜\"，而是\"选择\"以\"积极、负责、宽恕\"的态度面对一切，最终\"困境\"反而成了他\"成长、翻身\"的\"跳板\"。故事的核心，是\"态度\"决定\"命运的走向\"。这个\"转逆缘为道用、忍辱成德\"的道理，和广论完全一致：日常法师反复讲，\"逆境、迫害\"正是\"修忍辱、积功德、成就道业\"的最好\"时机\"；\"会转的人，最大的苦难能转成最大的善\"。所以正确答案是C。命运不由\"遭遇\"决定，由你\"面对遭遇的态度\"决定——\"逆境\"是\"炼金石\"。"}]},
{name:"正念的奇迹×广论止观",author:"一行禅师",questions:[{stem:"一行禅师在书里说，从某一刻起他将用\"正念\"这个词来指称某件事。这件事的准确内容是？",options:["对当下的实相保有觉知", "专注达成某个既定目标的技巧", "控制呼吸以达到放松的状态", "用积极思维取代负面念头"],answer:0,explanation:"✅ 答案是A。书中明文\"从现在开始，我将用这个词来指称'对当下的实相保有觉知'\"。正念不是放松技巧、不是积极思维、更不是达成目标的手段；一行禅师反复强调正念既是方法也是目的、既是因也是果，是针对\"当下实相\"的觉知本身。"},{stem:"关于正念\"方法论\"与\"目的论\"的关系，一行禅师的独特表述是？",options:["正念既是方法，同时也是目的，既是因，也是果", "正念只是修完后的身心状态，须另寻方法", "正念只是达成开悟的手段，开悟后即可舍弃", "正念与开悟是先后两件事，不可混淆"],answer:0,explanation:"✅ 答案是A。书中原句\"正念既是方法，同时也是目的，既是因，也是果\"。他反对把正念割裂为单一的手段或单一的状态，正念的存在本身即意味着生命的存在，故因与果同体。"},{stem:"吉姆向一行禅师要求洗碗，禅师告诉他\"洗碗的方法有两种\"。这两种的准确区分是？",options:["自己洗或留给别人洗", "快洗应付了事，或慢洗以免腰酸", "用手洗或用机器洗", "为了把碗洗干净而洗碗，为了洗碗而洗碗"],answer:3,explanation:"✅ 答案是D。原句\"第一种是为了把碗洗干净而洗碗，第二种是为了洗碗而洗碗\"。区分不在快慢或工具，而在心是否安住当下：前者心被\"待会儿要喝的茶\"吸走，后者对\"正在洗碗\"这一事实保持全然觉知。一行禅师并不反对把碗洗干净，他反对的是心被未来吸走。"},{stem:"一行禅师认为\"真正的奇迹\"是什么？",options:["在水上行走或稀薄空气中行走", "在禅坐中见到殊胜异象", "在大地上行走", "通过呼吸治愈顽疾"],answer:2,explanation:"✅ 答案是C。原句\"真正的奇迹，既不是在水上行走，也不是在稀薄的空气中行走，而是在大地上行走\"。所谓奇迹不是神通，而是对最寻常的当下每一步保有觉知，蓝天白云绿草都是未被认知的奇迹。"},{stem:"一行禅师把呼吸比作什么，说它能统一身心？",options:["通往彼岸的一只小船", "照亮黑暗的一盏明灯", "连接生命与意识的桥梁", "一把斩断烦恼的利剑"],answer:2,explanation:"✅ 答案是C。原句\"呼吸是连接生命与意识的桥梁，让你的身心合一\"。呼吸在这里被定位为统一身心、防止心念散乱的工具；书中同时强调\"呼吸是工具，呼吸本身亦是正念\"，不可把呼吸的副产品当作目的本身。"},{stem:"关于数息法，书中说\"这些数字\"的作用是什么？数错时又该如何？",options:["数字只是装饰，可数可不数", "这些数字就像一条绳子，把正念和呼吸系在一起，忘记数到哪里就回到一", "数字是必须数完的功课，数错要重头开始", "数字是升级通关的关卡，数到十即成就"],answer:1,explanation:"✅ 答案是B。原句\"这些数字就像一条绳子，把正念和呼吸系在一起\"；并说\"忘了数到哪里时，只需要回到一然后继续\"。数息是随息学不会时的替代入口，是起点而非目的，专注后可\"丢弃数息法，只专注呼吸本身\"。"},{stem:"一行禅师指出\"以外在观察者的身份做客观的观察\"是哪一种方法，而不是禅修的方法？",options:["艺术的方法", "哲学的方法", "科学的方法", "宗教的方法"],answer:2,explanation:"✅ 答案是C。原句\"以外在观察者的身份做客观的观察，这是科学的方法，不是禅修的方法\"。禅修的\"观心\"不是主客二分的客观观察，而是心直接体验自身，\"心不强占心，心也不会把心赶走\"。"},{stem:"面对浮现的觉受与念头，一行禅师教\"以心观心\"时，最要紧的是什么？",options:["把念头当作外在敌人加以批判摧毁", "用强力把心固定在某一个点上", "觉知这个念头，而非驱赶或执著它", "驱赶所有妄念，让心一片空白"],answer:2,explanation:"✅ 答案是C。书中明言\"重要的不是驱赶或执著于任何念头，重要的是觉知这个念头\"；\"心不强占心，心也不会把心赶走\"。这与\"卫士与访客\"意象的缺陷相呼应：念头和觉受就是我们自己，不是要被打倒的敌对力量。"},{stem:"观照桌子这一经典例子中，一行禅师要说明的核心义理是？",options:["桌子的存在依赖造物主的意志", "桌子是独立自存的坚固实体", "桌子与自己是毫无关联的两个物体", "桌子呈现了\"非桌子的世界\"那些事物，万物相互依存"],answer:3,explanation:"✅ 答案是D。原句\"如果你洞见这张桌子的实相，你就会看到，桌子本身呈现了所有那些通常被我们认为是'非桌子的世界'当中的事物\"。抽走木匠、铁矿、森林、阳光雨水任何一因，桌子即不存在——这是缘起观，\"自我就是五蕴的和合\"同此一理。"},{stem:"书中\"筏\"与\"指着月亮的手指\"这两个意象，想说明的道理是？",options:["只要过河便可丢弃佛法", "月亮远比修行方法更重要", "一切求真的方法都是手段，而非目的或绝对真理", "追随名师的指授即可证道"],answer:2,explanation:"✅ 答案是C。原句\"筏是用来渡河的，不是拿来扛在肩膀上。指着月亮的手指并不是月亮本身\"。所有追求真理的方法（包括缘起、无常、无我、空性诸概念）都当视为手段而非绝对真理，故书中进一步说\"空性也是空的\"。"},{stem:"一行禅师强调\"直面死亡\"的道理，原话怎么说？",options:["观想死亡会令人陷于悲观，不宜多修", "死亡是人生的终结，应尽量回避不去想", "如果一个人不知道怎么死，就不知道怎么活，因为死亡是生命的一部分", "死后有来生，所以今生的痛苦无足轻重"],answer:2,explanation:"✅ 答案是C。原句\"如果一个人不知道怎么死，就不知道怎么活，因为死亡是生命的一部分\"；又说\"生和死是生命的两面……就像一个铜板必须要有两面才能存在一样\"。他年轻时被指定禅观\"墓园里的一具尸体\"，正是这种直面训练。观死非悲观，而是让我们珍惜每一秒。"},{stem:"一行禅师建议每个人每周留出一天修习正念（正念日），其核心作用是？",options:["集中时间完成高强度禅修功课", "让自己从工作中彻底放一天假", "作为一道梯子，养成习惯后正念会渗透到一周其他日子", "缓解一周累积的身体疲劳"],answer:2,explanation:"✅ 答案是C。原句\"正念日会开始渗透到一周内的其他日子\"，并承诺\"三个月后看到生命中巨大的改变\"。正念日是被明确定位为\"养成正念习惯的梯子\"，而非单纯的休息日或放假日。"},{stem:"一行禅师的正念（对当下实相保有觉知、以呼吸系念），在功能上与广论哪一修行程序最直接对应？",options:["观章\"正思择\"思择空性", "得止所生的\"身心轻安\"", "八断行中\"念\"对治\"忘圣言\"（忘失所缘）", "六力中\"听闻力\"摄内住"],answer:2,explanation:"✅ 答案是C。广论卷15引《辨中边论》八断行治五过失，其中\"念\"专门对治\"忘圣言\"（忘失所缘）。一行禅师以呼吸把心系在当下、用数字\"把正念和呼吸系在一起\"，正是\"念\"防忘失这一功能的通俗化表达。所缘有显密差别，此处只取\"念\"防忘失的功能层对应。"},{stem:"广论卷15对\"呼吸\"所缘的定位是？",options:["唯有上根才修得的特殊所缘", "多寻思者修息，是对寻思多者的对治所缘之一", "与修观完全无关的世间技巧", "最胜所缘，人人必修"],answer:1,explanation:"✅ 答案是B。广论卷15净行所缘列\"上品贪者缘不净、多嗔缘慈愍、多痴缘缘起、寻思多缘息\"，呼吸（缘息）是对治\"寻思多\"的一种所缘，非最胜所缘；广论主推最胜所缘为佛像。一行禅师以数息随息教散乱心，正是\"寻思多者缘息\"的现代展开。"},{stem:"一行禅师\"觉知当下、辨识而不评论\"的观心要求，功能上对应广论九住心由哪一力成办的哪两住？",options:["正知力成办调伏与寂静两住", "忆念力成办安住与近住", "听闻力成办内住", "串习力成办等持"],answer:0,explanation:"✅ 答案是A。广论卷16九住心中，\"正知力\"成办第5调伏（观散乱生起并生欣悦）与第6寂静（见散乱过失而止息）。一行禅师\"像皇宫守卫一样对经过的每张脸保持觉知\"\"认知到它就足够了\"，识别散乱与觉受的生灭而不随转，正是\"正知\"观察心流散的功能层对应。"},{stem:"一行禅师\"一举一动都是仪式\"\"如狮子踏着缓慢轻柔坚定的脚步\"那种任运而熟练的定，功能上对应广论九住心的？",options:["第一内住", "第九等持（无功用任运而转）", "第三安住", "第五调伏"],answer:1,explanation:"✅ 答案是B。广论卷16九住心以\"串习力\"成办第9\"等持\"，其相是无功用、任运而转，并以读书喻\"所读诵任运不断\"来说明极串熟后的自然运转。一行禅师\"丢弃数息法只专注呼吸本身\"与狮子般不费力而坚定的行走，正对应这种串习成熟后的任运。"},{stem:"一行禅师\"放下一切、像一颗沉到河底的鹅卵石那样安住\"的静坐意象，对应广论修止哪一项要素？",options:["所缘\"安住所缘、令心专一\"的安住分", "无过三摩地\"明显分\"（清晰明了）", "得止所生\"身心轻安\"之乐", "修止资粮\"断诸杂务\""],answer:0,explanation:"✅ 答案是A。鹅卵石意象指向\"毫不费力地安住于所缘、不沾染任何事物\"的摄心专一，正对应广论卷15\"专住所缘无有分别\"的安住分；而\"明显分\"是清晰明了、昏沉所伤，\"断诸杂务\"属资粮，\"身心轻安\"是得止之量，皆非此意象所指。"},{stem:"一行禅师的\"慈心观\"——观照最恨或最苦之人直至\"慈悲在你心底生起，犹如一口充满了清新之水的井\"，功能上对应广论卷15净行所缘中的？",options:["多痴缘缘起", "上品贪者缘不净", "多嗔缘慈愍", "寻思多缘息"],answer:2,explanation:"✅ 答案是C。广论卷15净行所缘列\"多嗔缘慈愍\"，即对嗔心重者以慈愍为对治所缘。一行禅师教观最恨之人、最苦之人而生慈悲，消融愤怒与怨恨，与\"多嗔缘慈愍\"同构，引《维摩诘经》\"劫中有刀兵，为之起慈愍\"亦同此。"},{stem:"一行禅师提倡\"简单生活、正念日只做简单家务、放下聚会接待\"，与广论卷14修止资粮六种中的哪几项相呼应？",options:["住随顺处、清净尸罗", "少欲、知足、断诸杂务", "知足、断诸恶寻思", "清净尸罗、断恶寻思"],answer:1,explanation:"✅ 答案是B。广论卷14修止资粮六种含\"少欲、知足、断诸杂务（断贸易、医药、算星相等）\"。一行禅师正念日\"忘掉其他天的工作、不安排聚会接待、只做简单家务\"，正是以\"外部简化\"支撑\"内心安定\"的通俗化表达，对应少欲知足与断杂务三资粮。"},{stem:"一行禅师在禅坐中要求\"当善念生起要认知、当恶念生起也要认知……只要认知够了，不要执著其中或试图消除它\"，这\"辨识而不正面压制\"与广论哪一修法的精神相通？",options:["支那堪布\"弃观慧全不作意\"", "正知（观察心之流散与觉受生灭）而非与之缠斗", "修空无分别中的\"全不作意\"", "奢摩他所生\"身心轻安\"之乐受"],answer:1,explanation:"✅ 答案是B。一行禅师\"认知善念恶念即可、不随其转\"，对应广论卷16\"正知\"观察心流散与觉受生灭的功能。它既不是\"全不作意\"（那是广论所批判的支那堪布谬见），也不是追求轻安乐受。辨析边界在：辨识而不评论 ≠ 不思维、不作意。"},{stem:"辨析——一行禅师说\"当一个普通人有觉知地呼吸时，他就已经开悟了\"。若依广论卷16\"得止之量\"来衡准，这句话的边界在哪里？",options:["这是就正念当下、身心合一的体验层面而言，未达广论\"断惑见道\"的标准，须知\"只止不观不能断惑\"", "广论也主张呼吸觉知最胜，故完全等同", "这句话纯属错误，毫无可取", "呼吸觉知即圆满断惑，与广论无别"],answer:0,explanation:"✅ 答案是A。相通处在：两者都肯定觉知呼吸能安住身心、摄心离散。边界在：广论卷16严判\"第九住心未得轻安尚不立为得奢摩他\"，且\"此定是内外道二所共同\"\"任如何修此三摩地，尚不能断欲界烦恼\"；一行禅师的\"开悟\"是就\"正念当下、身心合一\"的体验而言，非广论\"通达空性、断惑见道\"义。既不可按字面当作证果，也不可强说其全错。"},{stem:"辨析——一行禅师教\"念念分明地在洗碗、扫地、泡茶\"中修习，广论则详述\"静坐、身八法、结跏趺坐\"等正式威仪。二者关系何者最准确？",options:["相通在\"摄心专注\"这一共通内核，不同在所缘与次第判据——广论以静坐威仪为正式所缘，一行禅师把日用劳作也提升为所缘", "两者毫无关联，分属两个宗教", "广论反对日常所缘，只许正式威仪", "一行禅师反对静坐威仪，只重日常"],answer:0,explanation:"✅ 答案是A。相通处在：二者都以\"令心专一所缘、不散乱\"为目的，摄心的内核一致。边界在：广论有明确的身八法、结跏趺坐五因缘与最胜所缘（佛像）的正式判据；一行禅师则为在家大众做了大量变通（日式跪坐、椅上坐、散步、洗碗泡茶皆成所缘），把日常劳作提升为仪式。是受众定位与次第深浅的差异，而非互相否定。"},{stem:"辨析——书中\"主体与客体的区别不复存在\"的\"无分别智\"，与广论卷16对以下哪一种\"无分别\"的批判必须加以区分？",options:["得止所生的轻安喜乐", "厌患对治中的慈愍所缘", "正思择的如理观察", "于空性全未悟解、仅弃观慧全不作意的无分别"],answer:3,explanation:"✅ 答案是D。相通处在：二者都触及\"离分别\"的体验层面。边界在：广论卷14/16批判\"支那堪布\"妄计\"一切分别皆执实相、弃观慧全不作意为修甚深义\"，严分\"修空之无分别\"与\"于空性全未悟解之无分别\"；一行禅师的\"无分别智\"是建立在其\"缘起观→无我\"进阶脉络之上（达圆成实、破遍计所执），若脱离此脉络，把\"不评判念头\"直接等同于\"通达空性\"，即滑入被批判的误区。"},{stem:"辨析——一行禅师以\"缘起观\"观桌子、五蕴一体，其\"无我\"表述与广论卷17-18的\"缘起性空\"有何异同？",options:["一行禅师否定缘起现象，广论肯定", "两者完全相同，都是见地究竟", "一行禅师主张断灭空，广论主张有", "功能层相似（皆破独立实体我），见地层深浅不同——广论严辨\"所破界限\"，一行禅师以\"一体/无分别\"的体验描述为主"],answer:3,explanation:"✅ 答案是D。相通处在：一行禅师\"自我就是五蕴的和合\"\"突破我见得解脱\"，与广论\"破自性有而非破缘起\"、卷17\"诸说空缘起，中道为一义\"在破\"独立实体我\"上功能同构。边界在：广论卷18核心方法是\"所破界限\"的精确抉择（所破太宽堕断边、太狭堕常见），一行禅师则偏重\"主体客体界限消融\"的一体体验描述，未展开\"自性有无\"\"空性如何不坏缘起\"的严格论证——见地层次的深浅不同。"},{stem:"辨析——一行禅师教\"不要过度用力\"\"呼吸应当轻柔、和缓、顺畅，像流过沙土的小溪一般\"，与广论止观对调息的要求，张力在何处？",options:["一行禅师反对调息，广论主张强力控制", "二者皆重\"徐徐而转\"的轻柔调息，本无张力；张力在广论是\"身八法之一\"的威仪规范，一行禅师则将其普适于日用且以\"不控制只觉察\"为入门", "调息与止观毫无关系", "广论主张猛烈呼吸，一行禅师反对"],answer:1,explanation:"✅ 答案是B。相通处在：广论卷14身八法言\"息无声无粗猛、徐徐而转\"，与一行禅师\"呼吸轻柔、静得连身边人也听不见\"完全一致，皆贵和缓。边界在：广论将调息置于结跏趺坐威仪体系中作正式规范；一行禅师则把\"不控制、只觉察呼吸\"作为面向大众的入门主轴，强调\"呼吸很难归属为任何一种宗教教义\"。二者在\"徐徐而转\"上相通，在教法定位（正式威仪 vs 日常觉察）上不同。"}]},
{name:"当下的力量×广论止观",author:"埃克哈特·托利",questions:[{stem:"托利在\"本书的由来\"里记述，29岁生日后不久的某个夜晚，脑中反复浮现一句话，令他忽然觉察到其中有\"两个\"我。这句话是：",options:["我从未真正活过", "我与我的思维是一体的", "我无法再忍受我自己了", "我的痛苦将伴随我一生"],answer:2,explanation:"✅ 答案是C。托利由\"我无法再忍受我自己了\"顿觉句中藏有\"我\"与\"自己\"两个主体，追问\"我是一个人还是两个人\"，随即进入\"大脑完全停止运转、思维却不存在\"的意识断裂。这正是他全部思想体系的\"原点\"。末句口诀：一念觉察\"两个我\"，思维止处见本体。"},{stem:"关于\"小我\"（ego）的构成与存续机制，托利的说法是：",options:["小我由情绪积淀而成，越痛苦越稳固", "小我由思维活动组成，只有不断思考才能存活", "小我诞生于身体的欲望，与思维无关", "小我是本体的投影，内在完整无缺"],answer:1,explanation:"✅ 答案是B。原文明言\"小我由思维活动组成，只有不断地进行思考它才能存活\"，并说\"对于小我来说，当下时刻几乎不存在，只有过去和未来才是重要的\"。小我的本质是无意识认同思维而产生的虚假自我，故必以持续思考为存在条件。末句口诀：小我是思维之影，断思考即现原形。"},{stem:"痛苦之身（pain-body）对待\"欢乐\"的态度，托利的原文描述是：",options:["欢乐是痛苦之身赖以成长的终级食粮", "痛苦只能以痛苦为食，它不能享用欢乐", "欢乐与痛苦同为它轮流取用的能量", "痛苦之身在欢乐中才会真正休眠"],answer:1,explanation:"✅ 答案是B。原文\"痛苦只能以痛苦为食，它不能享用欢乐。欢乐对它而言是难以下咽的\"，点明痛苦之身是过去未释放情绪痛苦累积成的负面能量场，只能借与之共振的痛苦经验维系。故其最惧的恰是观察的意识之光。末句口诀：痛苦以苦为食粮，意识之光断其粮。"},{stem:"对照题——托利论痛苦之身需借\"意识之光\"才能瓦解（原文称意识与无意识对痛苦之身分别起何作用），此对待苦的取向与广论止观哪一层相通？托利的原句是：",options:["无意识创造了它，意识将它变回原形", "思维创造了它，沉默将它变回原形", "身体创造了它，呼吸将它变回原形", "意识创造了它，无意识将它变回原形"],answer:0,explanation:"✅ 答案是A。\"无意识创造了它，意识将它变回原形\"，且托利紧接着说\"观察它就足够了\"。相通处在\"面对烦恼不任其作主\"：托利以不评判的觉察瓦解痛苦之身，广论以正知/观过患令烦恼不得持续。边界在：托利的\"观察\"是存在感层面的注视，不包含广论\"观无常过患\"后依正理而舍的层次。末句口诀：无意识造苦因，意识照见即还原。"},{stem:"关于\"当下\"与\"时间\"的本质，托利的表述是：",options:["未来比当下更真实，因为它尚未被浪费", "时间是根本真实，当下只是时间的一部分", "过去能够被改变，未来能够被掌控", "没有任何事情可以发生在过去，所有的事情都发生在当下"],answer:3,explanation:"✅ 答案是D。托利说\"没有任何事情可以发生在过去，所有的事情都发生在当下\"，并言\"时间一点儿也不珍贵，因为它仅仅是一种幻象\"。他的\"当下唯一真实\"是存在论—心理命题，须与广论\"空缘起\"的\"诸法无自性\"正见相区分，不可拔高为\"诸法无自性\"。末句口诀：过去未来皆是影，唯此当下是真实。"},{stem:"托利区分\"钟表时间\"与\"心理时间\"，下列归入\"钟表时间\"的是：",options:["设定目标并向其迈进，从过去汲取经验教训", "把过去的错误融入\"我\"的自我感觉", "强迫性投射未来并伴随焦虑", "反复回忆过去的错误并持续自我批评"],answer:0,explanation:"✅ 答案是A。原文明言钟表时间\"包括设定目标并向其迈进\"\"从过去中汲取经验教训\"，而\"在心理上不断地回忆你过去的错误，进行自我批评或感觉悔恨\"，就\"变成了心理时间\"。开悟者\"继续利用钟表时间，但会将自己从心理时间上解放出来\"。末句口诀：钟表时间办事务，心理时间造苦源。"},{stem:"\"观察思考者\"这一步的关键姿态，托利强调的是：",options:["全盘压抑令思维完全停止", "细密分析并纠正思维内容的谬误", "以记忆与类比拼合思维的画面", "不评判地倾听，认识到\"那里有一种声音，而我在这里倾听它\""],answer:3,explanation:"✅ 答案是D。托利明确反对评判，因为\"这样做意味着同样的声音又会从后门乘虚而入\"，正确做法是不加判断地倾听，从而认出\"那里有一种声音，而我在这里倾听它\"的观察者向度。这一\"觉察即回归\"功能，正接广论八断行之\"正知\"与九住心\"散已速知还复\"。末句口诀：观察不评判，声音失其力。"},{stem:"关于\"临在\"能否被\"想\"出来，托利的原文表述是：",options:["临在是思维的最高成就，思维越精则临在越深", "临在可以通过严密的逻辑推演而通达", "临在可在概念的正面定义中获得", "它不是你想的那回事，想要理解临在就要处于临在之中"],answer:3,explanation:"✅ 答案是D。\"它不是你想的那回事。你不能去思考临在的状态，思维是不会理解它的含义的。想要理解临在状态，就要处于临在状态之中。\"临在只能以觉察本身去体会，不可经由思维分析达成。末句口诀：临在非所想，安住方知味。"},{stem:"托利认为\"看得见的身体\"与\"内在身体\"的关系是：",options:["看得见的身体即能直接带入本体，无需另寻", "内在身体是看的见身体的附属物，可有可无", "两者互斥，凡持内在身体者必弃可见身体", "你能看得见和摸得着的身体只是一层幻想中的薄纱，其下是无形内在身体"],answer:3,explanation:"✅ 答案是D。原文\"你能看得见和摸得着的身体，只是一层幻想中的薄纱。在你的身体下面是无形的内在身体，是你通往本体、进入非显化生命的大门\"。托利又把\"气\"与\"未显化状态\"区分：气是未显化状态和物质世界之间的桥梁，未显化是气的源头。末句口诀：有形身体是薄纱，内在能量是门户。"},{stem:"托利论\"未显化状态\"（自比老子之\"道\"）时，特别纠正的一个误解是：",options:["未显化状态可以被正面定义为一种具体物质", "未显化状态不是独立于显化状态的，它弥漫整个世界却被完美掩饰", "未显化状态是显化之外另一个物理世界的地方", "未显化状态必须借人格神来理解"],answer:1,explanation:"✅ 答案是B。原文\"未显化状态不是独立于显化状态的。未显化状态弥漫在整个世界\"，它借\"寂静、空间、空（无物）\"以否定式显现，故\"空间是无物，所以那里没有的东西比那里有的东西更为重要\"。只能否定式言说，不可成一门正面定义的学科。末句口诀：未显化非别处所，寂静空间即其门。"},{stem:"托利对\"臣服\"（surrender）的真实含义，表述正确的是：",options:["臣服是消极忍受外在伤害并委曲求全", "臣服是认命躺平，停止一切计划与行动", "臣服直接改变外在现实本身", "臣服是一种顺随生命流动而不逆流而上的智慧，是放弃对当下的内心抗拒"],answer:3,explanation:"✅ 答案是D。\"臣服是一种顺随生命流动，而不逆流而上的简单而又深刻的智慧\"，且\"臣服不是改变现实，至少不是直接地改变。臣服改变的是你\"。故臣服是内在对当下本然的无抗拒接纳，而非外在的不作为或懦弱。末句口诀：臣服改己不改境，顺流而生是智慧。"},{stem:"对照题——托利称消极心态（抗拒当下本然）的唯一\"用处\"是加强小我，此\"心不当下、向外拒抗\"的状态在广论术语中近于何者？托利的原句是：",options:["消极心态的唯一\"用处\"就是加强小我", "消极心态能帮助人客观分析并解决问题", "消极心态比积极心态更贴近当下", "消极心态是通往真知的正道"],answer:0,explanation:"✅ 答案是A。托利说\"消极心态的唯一'用处'就是加强小我\"，并言\"不快乐比疾病的传播速度更快、更容易\"。相通处在\"心离所缘、向外拒抗\"：托利的消极抗拒对应广论\"掉举/散乱\"（心不能安住所缘、向外驰散）的诊断。边界在：广论以八断行（念治忘失、正知治沉掉、舍治作行）系统对治，托利仅止于单句提醒。末句口诀：消极心态养小我，抗拒当下是病根。"},{stem:"对照题——托利以\"爱没有对立面\"甄别真爱，并自陈其\"慈悲\"是与众生共生死、本体层面不朽联结。此\"慈悲\"与广论\"菩提心\"的关系，正确判断是：",options:["爱必然包含恨的对立面，方显完整", "真爱是没有对立面的，如果你的\"爱\"有对立面，那就不是真爱而是小我的需求", "有对立面的爱才是有张力的真爱", "对立的爱是通往内在完整的必经阶段"],answer:1,explanation:"✅ 答案是B。原文\"真爱是没有对立面的，因为它是超越大脑而产生的\"\"如果你的'爱'有对立面，那么这就不是真爱，而是小我对更深层、更完整的自我感的需求\"。相通处在\"无我普愿\"的指向方向；边界在：广论菩提心\"以智慧方便双运利他为体\"、以出离心为摄持，托利的\"慈悲\"是存在论—心理学意义的共情，二者不可等同。末句口诀：有对立即非真爱，超越大脑方为真。"},{stem:"对照题——托利论\"开悟\"与\"思维\"的关系时强调\"必要仍会运用思维\"，此\"无念而不废工具理性\"的立场，与广论对\"无念/不思维即道\"的错误见地的批判，正确关系是：",options:["开悟即停止一切分析辨别能力", "开悟意味着彻底废除理性，退回无知状态", "开悟等同于思维的最高发展", "开悟意味着超越思维，而不是下降到思维之下，必要时仍会运用思维"],answer:3,explanation:"✅ 答案是D。托利说\"开悟意味着超越思维，而不是下降到思维之下属于动物或植物的层面\"，并强调\"必要时你还是会运用你的思维\"\"思维和意识不是同义词，思维只是意识的一小部分\"。相通处在\"离念的奢摩他无分别住\"这一合法操作。边界在：托利破的是\"强迫性思维认同\"（心理层），广论卷14/16批的是\"误认不分别即得空性正见、弃观察慧全不作意\"的错谬，二者不可等同。末句口诀：开悟超思维，非降亦非废。"},{stem:"托利\"观察思考者/临在安住当下\"与广论\"念、正知\"的相通处，最精确的表述是：",options:["托利与广论都主张以佛像为最胜所缘安住", "托利建立了与广论完全等同的九住心次第与轻安判据", "托利与广论都主张以正理抉择无我、破所破", "托利的\"自问此刻内在发生了什么事\"在功能层即广论\"正知\"之对内持续觉察、及时察觉沉掉"],answer:3,explanation:"✅ 答案是D。相通处在功能层：托利\"养成习惯自问'此刻我的内在发生了什么事'\"\"随时监督心理—情绪状态\"，对应广论八断行\"正知治沉掉不觉\"及九住心\"正知力→调伏+寂静\"。边界在：广论正知有明确所缘（佛像/息等）与次第判据，托利则无\"所缘选择\"与\"轻安\"之量。末句口诀：正知照当下，广论有次第。"},{stem:"托利\"散乱即受苦根源、觉察到散乱当下即回归\"与广论九住心\"安住\"（散已速知还复）的对照，正确的是：",options:["托利认为散乱一旦发生即永不超生", "二者都承认\"觉察到散乱的当刻即是回到正念/安住的起点\"", "只托利强调串习，广论主张一蹴而就", "广论否认散乱可以破除，托利否认散乱的存在"],answer:1,explanation:"✅ 答案是B。相通处在\"觉察即回归\"：广论第三安住\"散已速知还复\"，托利\"当你发现自己没有临在的那一刻，你就临在了\"。二者都把\"心离所缘\"诊断为首要障碍，且把\"当下觉察\"定为回转之机。边界在：广论有六力、四作意的系统进阶，托利是单一重复操作。末句口诀：散乱知即回，两书同一机。"},{stem:"托利以\"当下/内在身体/呼吸\"为入场锚点，与广论\"所缘安住\"的对照，恰当的是：",options:["广论反对以呼吸为所缘", "广论主张无有任何所缘的空散而住", "二者都承认散乱的心须有可安住的依止对象，且都主推呼吸/身体为入门所缘", "托利以佛像为最胜所缘，广论以内在身体为最胜所缘"],answer:2,explanation:"✅ 答案是C。相通处在\"所缘安住\"：广论主推佛像，但净行所缘中\"多寻思者缘息\"，托利则主推\"觉察呼吸\"\"感受内在身体\"。边界在：广论所缘有净行/净惑/遍满三类的系统分类与各别抉择，托利无此分类，且以\"内在身体\"为最高而非\"佛像\"。末句口诀：散心需所缘，两书同依止。"},{stem:"托利\"反复回到当下\"的串习，与广论\"读书喻\"至极串熟而任运不断，二者对照正确的是：",options:["串习只对托利的临在有效", "广论否认串习能达成任运，只有托利强调", "二者都承认稳定的觉知安住是长期串习的产物，非一蹴而就", "托利认为临在可一悟永得，无需反复"],answer:2,explanation:"✅ 答案是C。相通处在\"串习成就任运\"：广论读书喻\"譬如读书至极串熟……所读诵任运不断\"，靠串习力成等持；托利说\"每当你丧失当下时刻时，就一再地回到当下\"\"临在会成为你的主要意识状态\"。边界在：托利\"临在成为主要状态\"是方向上的相似，但无轻安与前九住心支撑，不可等同于\"已得等持\"。末句口诀：串习至任运，托利近其向。"},{stem:"托利反复强调临在状态\"更警惕、更清醒、更临在，而非意识模糊状态\"，此点无意中接引的广论立场是：",options:["广论认为明显分与安住分互不相容", "真宁静是\"警觉而安住\"，昏沉伤明显分，掉举伤安住分", "广论以\"乐\"为定因的三分说", "广论主张昏沉蒙昧方为深定"],answer:1,explanation:"✅ 答案是B。相通处在广论无过三摩地\"明显分（清晰）+安住分（专注）\"两殊胜：真正的宁静不是昏昧，而是警觉而清楚。托利反对\"意识模糊状态\"，正好契合广论警惕\"昏沉伤明显分\"的立场。边界在：托利只作了体验式提醒，广论则有\"澄摄于明显、乐是定果非因\"的精细抉择。末句口诀：宁静非昏昧，明显安住双。"},{stem:"托利\"钟表时间用于实际事务（汲取经验、设定目标、预测）\"与广论\"世俗谛名言量成\"的对照最恰当的是：",options:["托利把时间当作自性实有的终极真实", "二者在功能层都承认世俗事务须借名言/时间施设而成立与运作，是不可废的功能层", "广论以钟表时间为胜义谛，托利以钟表时间为本体", "托利主张彻底废除一切时间概念"],answer:1,explanation:"✅ 答案是B。相通处在功能层：托利说解脱者\"继续利用钟表时间\"，广论世俗谛\"名言量成\"亦在肯定缘起显现的作用不失。边界在：托利\"时间幻象\"是存在论—心理命题，不建立\"空缘起\"正理；广论\"时间无自性\"是依中观正见的抉择，非同一层次的见解。末句口诀：世间名言不可废，空义层次不同源。"},{stem:"辨析托利\"放下思维、临在即一切\"与支那堪布\"弃观慧、全不作意\"——正确的判断是：",options:["功能层相通（都重离念安住），见地层不同：托利无空性正见与断惑目标，广论之批判并不否定离念的奢摩他本身", "托利已具空性正见，与广论中观见完全一致", "二者完全等同，托利即堪布之见", "广论完全否定一切离念的修法，故托利方法全错"],answer:0,explanation:"✅ 答案是A。相通处在二者都重\"离念/无分别的安住\"这一功能层。边界在见地层：广论卷14/16批支那堪布\"因彼妄计一切分别皆执实相，要弃观慧全不作意，乃为修习甚深法义\"，其破的是\"误认不分别即得空性正见、弃观察慧\"的错谬，而非反对奢摩他——奢摩他本身即无分别住，是止观双修所必需的一支。托利破的是\"强迫性思维认同\"（心理层），非\"分别观察慧\"（正理层），且无空性正见、无断惑目标，故不可径判为堪布之见，但也不可拔高为已具中观正见。末句口诀：功能同离念，见地判正空。"},{stem:"辨析题——托利的\"临在\"是否等同于广论的\"毗钵舍那\"（观）？",options:["临在高于毗钵舍那，已断烦恼种子", "毗钵舍那即\"不评判地注视情绪\"", "不等同：临在是\"止\"向的安住经验与不评判的注视，不含\"以正理抉择无我、破所破\"的观察慧", "等同，临在即修观"],answer:2,explanation:"✅ 答案是C。相通处在二者都需先有\"心不散乱的定静\"为基。边界在：广论毗钵舍那\"以轻安为所依\"而\"正思择最极思择、周遍寻思伺察\"，命脉是正理观察；托利的\"观察\"是\"不评判地注视\"，一个取消判断、一个恰是极精细的正理判断。故临在属止向，不可径译为观。末句口诀：临在不评判，观是正思择。"},{stem:"辨析\"无分别\"——广论明言\"无分别有二种\"，用于裁决托利的临在，正确的是：",options:["\"修空之无分别\"即\"于空性全未悟解\"", "托利属\"未悟空之无分别\"（仅心理层思维流止息），尚非\"修空之无分别\"（以正理遣除自性执）", "托利属\"修空之无分别\"，已悟法无我", "托利与两种无分别皆无关"],answer:1,explanation:"✅ 答案是B。相通处在：托利的临在与广论\"止\"都落在\"无分别安住\"的功能层。边界在：广论判\"无分别有二种\"——\"修空之无分别\"与\"于空性全未悟解之无分别\"，并斥\"凡无分别皆是修甚深空义毗钵舍那\"为\"纯粹支那堪布修法\"；托利止息的是强迫思维流，落在\"未悟空之无分别\"层，尚未以无我正见遣除二我执，故\"东门有鬼，西门送俑\"（卷24）正警此。末句口诀：无分别分两类，未悟空非修空。"},{stem:"辨析\"临在是解脱的第一步\"与广论\"先止后观\"结构，正确的对位是：",options:["临在对位于\"止\"（定静安住），为观察慧提供不散乱的基础，正合广论\"先止后观、观以止为因\"的次第决定", "广论主张先观后止，与托利相反", "临在等于广论\"观\"，故应先观后止", "临在即止观双运之果"],answer:0,explanation:"✅ 答案是A。相通处在\"先定静、后智观\"的结构对位：托利以临在（有觉察地安住当下）为一切进一步转化的前提，广论卷14引《解深密经》\"未得止者仅以观慧思择，终不能发身心轻安\"，故\"观须止为因\"。边界在：广论先止后观是\"止为基础、观为能断\"的完整次第，且\"虽缘空性为境而修止乃至引生轻安，仍非毗钵舍那\"；托利止于\"般临在这一步\"的单一操作，未给出\"止后起正理观\"的后续。末句口诀：先止而后观，临在当止阶。"},{stem:"关于\"宁静喜悦\"与广论\"轻安\"判据，正确的辨析是：",options:["托利的宁静喜悦是体验描述，无轻安概念、无九住心次第，不可作为\"得奢摩他\"的量", "托利\"深深的宁静极乐\"即广论\"身心轻安\"，可直接判为得止", "轻安只是坐得久或达到无念即可，托利已具备", "广论以\"乐\"为得止唯一标准，托利亦有乐"],answer:0,explanation:"✅ 答案是A。相通处在托利\"警觉而安住的宁静\"指向明显安住两分的正确方向。边界在：广论以\"身心轻安\"为得止之量——\"第九住心未得轻安，尚不立为得奢摩他，何况能得毗钵舍那\"（卷16）；托利全书无\"轻安\"概念，其\"深深宁静与极乐\"仅是体验描述，不能自动等同于轻安，更不能作为得定判据，亦无九住心的进阶与六力配住心的校量。末句口诀：宁静是体验，轻安为判据。"}]},
{name:"清醒地活·全然接受×广论止观",author:"辛格/塔拉·布莱克",questions:[{stem:"小辛把自己关在房间里，被脑海里那个喋喋不休的声音搅得心烦意乱，于是想\"选出那个最像我、说的最在理的声音当作真正的自己\"。按辛格《清醒地活》第1章的论断，他这样做的根本问题在于——",options:["他还不够努力去控制那个声音", "他应该求助于心理咨询来压制噪音", "他没有意识到说话者并不是他，他只能是那个听到声音的人", "他应该先静坐让声音消失"],answer:2,explanation:"✅ 答案是C。辛格第一论纲是\"如果你听到它说话，很显然说话者并不是你。你只是那个听到声音的人\"，并明言唯一远离声音的方法是\"停止辨别它在说什么\"，不要纠结于\"无数声音中究竟哪一个才是你\"。无论声音说好话还是坏话，都只是\"一个在说话的声音\"，说话者始终不是\"我\"。口诀：声音滔滔非本我，能听者才是真我。"},{stem:"辛格在第3章借拉玛纳·马哈希\"我是谁\"的参究，请修行者层层剥离\"我是谁\"。依次排除身体、情感、思想之后，他认定的那个\"剥不掉\"的终点是——",options:["纯粹的意识或觉知", "我的情感与情绪", "我的思想与信念系统", "我的名字与人生履历"],answer:0,explanation:"✅ 答案是A。辛格以\"如果你是正在观看某个事物的主体，那么这个事物就不是你\"为杠，逐层排除身体(形貌体重)、情感、思想，唯余觉知，并断言\"意识是你能说出的最高词汇。没有什么比意识更高、更根本\"。他称之为自性(Self)、阿特曼(Atman)。终点绝不是思想或情感，更不是世俗履历。口诀：层层剥离皆非我，觉知一法独存留。"},{stem:"辛格用\"看电影\"比喻意识与思想的关系：坐进银幕里认同剧情，就忘了自己身在影院；退回座位中央，才记得\"我在看\"。依辛格，意识的\"迷失\"与\"居中\"界线在哪里？",options:["意识专注到某一点上、变得极度敏锐", "意识会彻底消失、什么都不知道了", "意识进入了无梦的沉睡状态", "意识被客体拉走，忘了自己在觉知，只知客体"],answer:3,explanation:"✅ 答案是D。\"居中\"指意识安住于主体位置，\"迷失\"则指意识聚焦投注到客体(思想、情感、外境)上面，只认得客体而忘了\"我在觉知\"。辛格强调最深的冥想要\"使觉知本身成为那个客体\"——这是\"居中\"而非\"专注某一点\"。居中不是消失，而是觉知到自己有意识。口诀：意识居中知正醒，迷失客体忘自身。"},{stem:"辛格说，人有时感觉不到那股本自具足的生命能量。按《清醒地活》的论断，人\"无法时刻感觉到这种能量\"的唯一原因是什么？",options:["年纪大了能量自然衰退", "外界环境没能提供能量来源", "身体缺乏足够营养与睡眠", "你封闭了自己的心灵与思想，切断了能量流"],answer:3,explanation:"✅ 答案是D。辛格明言\"你无法时刻感觉到这种能量的唯一原因就是你封闭了它\"，并说能量\"并非来自食物，也不是来自睡眠\"，也\"与年龄无关\"，它只需要\"开放和接受的心态\"。心灵是最易开合的脉轮(阀门)，关闭则能量受阻、坠入黑暗。口诀：能量无限本具足，唯有封闭令其绝。"},{stem:"布莱克用拉丁文 radix(根)解释\"彻底接纳\"的\"彻底\"。她给出的真正接纳是\"双翼\"结构——这两翼缺一不可，分别是——",options:["正念(明见)与慈悲", "寂静与喜悦", "专注与放松", "智慧与财富"],answer:0,explanation:"✅ 答案是A。布莱克明言\"真正的接纳包括两个部分，一是清晰觉察(明见)我们的经历，二是慈悲地对待这些经历……犹如大鹏鸟的双翼\"。只明见会沦为更苛责自己，只慈悲会沦为自怜，二者须并存。\"彻底\"出自 radix，是\"追根究底\"回到本性。口诀：明见慈悲双翅翼，缺一即坠难前行。"},{stem:"布莱克传承的内观练习里，\"清楚的看到\"(正念觉察)有一个具体的实作做法。下列哪一项是它？",options:["以关心温柔的态度，在内心列举、描述当下正经历的身心状态", "在心里为每个念头贴上好/坏的道德标签", "用咒语强行替换掉负面念头", "把烦恼都归咎于一个固定的外在敌人"],answer:0,explanation:"✅ 答案是A。布莱克引\"在内心列举描述当下的状态……以关心和温柔的态度，认清穿流不绝的思绪和感受\"，这是内观(正念)的\"清楚见到\"的实作，而非道德评判、归咎外敌或替换念头。它与广论\"正知\"觉察心之流散在功能层相通。口诀：温柔列举当下状，明见即是内观心。"},{stem:"布莱克第3章借试飞员叶格(Chuck Yeager)\"放下操纵杆\"的故事讲\"神圣的停歇\"。它的核心要义是——",options:["遇到危险就永久放弃、什么都不做", "彻底逃离尘世、隐居不做事", "中断惯常的控制与活动，先安住于当下感受，再作更清醒的回应", "用更强的意志力抓紧眼前的控制"],answer:2,explanation:"✅ 答案是C。\"神圣的停歇\"是\"什么也别做，只消把手从操纵杆上放下即可\"——暂时中断惯常操控，安住当下，而非永久消极或不作为；布莱克明言危急时仍须行动。佛使比丘称这种停歇为\"暂时涅槃\"。停歇之后往往有更清醒的回应。口诀：暂放操纵安当下，醒来方有清明行。"},{stem:"布莱克讲\"请魔王喝茶\"：当贪欲、恐惧、疑迷这些\"魔王\"现前时，向它说\"来吧\"。这个\"来吧\"的关键分寸是什么？",options:["只能接纳正面情绪，负面要坚决赶走", "魔王必须被彻底消灭才算修成", "接纳烦恼就等于容许它化为伤害行为", "说\"来吧\"并非将伤害人的冲动付诸行动"],answer:3,explanation:"✅ 答案是D。布莱克明言\"说\"来吧\"并非将伤害人的冲动付诸行动\"，也强调\"彻底接纳并非自我放纵\"——比如对尼古丁上瘾，接纳的是瘾头升起时的身心状态与罪恶感，而非\"点根烟来抽\"这个行为本身。魔王(Mara)指贪欲、恐惧、疑迷(无明)，非外在撒旦，也不当被消灭。口诀：请魔喝茶是温柔，接纳情绪非纵行。"},{stem:"【对照】辛格\"觉知自己正在觉知\"、布莱克\"以觉察指出当下\"，这个\"觉察者视角\"在广论八断行中，对应哪一支所对治的过失？",options:["忘圣言", "懈怠", "作行(无沉掉时强作功用)", "沉掉不觉(沉没与掉举而不自知)"],answer:3,explanation:"✅ 答案是D。广论卷十五引《辨中边论》，以\"正知\"治\"沉掉不觉\"——即沉没、掉举生起而心不自知。辛格\"觉知自己正在觉知\"、布莱克\"觉察指出\"，正是此\"觉察心之流散\"的世俗化表达。懈怠由信欲勤安对治，忘圣言由念对治，作行由舍对治，皆非此层。口诀：正知灯照沉掉影，观察者心即此明。"},{stem:"【对照】辛格\"见证意识居中\"（退后一步看念头情绪来去而不卷入），若配九住心\"六力成办\"，它最对应正知力所成办的哪两住？",options:["最极寂静、专注一趣(精进力)", "调伏、寂静(正知力)", "安住、近住(忆念力)", "内住、续住(听闻力、思惟力)"],answer:1,explanation:"✅ 答案是B。广论卷十六九住心\"六力成办\"中，正知力成办\"调伏＋寂静\"二住心：调伏是见定功德而生欢喜，寂静是观散乱过失而止息不喜。\"见证意识居中、觉知自己正在觉知\"正是正知力醒觉、止息散乱的阶段对应。其余住心依次由听闻、思惟、忆念、精进、串习力成办。口诀：正知力成调伏静，居中觉照恰相应。"},{stem:"【对照题】辛格的\"放手\"(let go)、布莱克的\"不抵抗\"、叶格\"放下操纵杆\"，共同点都是\"不再强作功用\"。这最接近广论八断行中\"舍\"对治的过失——",options:["不作行(沉掉生已不断)", "作行(无沉掉时强作功用)", "忘圣言", "懈怠"],answer:1,explanation:"✅ 答案是B。广论卷十五立\"舍\"治\"作行\"——沉掉已息、心地已静时，若再强加功用反成过失，应舍功用而任其平等住。\"接纳当下不抗拒\"在此义理层与\"舍治作行\"相近。但此地正是相通亦是边界：广论要求先\"观过患而后断\"，非无条件接纳一切。口诀：沉掉已息莫强作，舍心放下即同调。"},{stem:"【对照】布莱克的慈心练习——对\"受伤的自己\"以慈悲观照而非自我批判——若以广论卷14\"净行所缘\"判位，最贴合哪一条？",options:["多嗔者缘慈愍", "寻思多者缘息", "上品贪者缘不净", "多痴者缘缘起"],answer:0,explanation:"✅ 答案是A。广论卷十四净行所缘列\"多嗔者缘慈愍\"——嗔心重(含对自我的嗔恨、自我批判)者以慈愍为所缘对治。布莱克的慈心练习正是以慈悲观照而非嗔拒对待\"受伤的自己\"，从南传内观＋藏传双传承而来，与广论所引《声闻地》共许处最多。口诀：多嗔修慈古所传，布莱克心同此缘。"},{stem:"【对照题】辛格\"能量开放即流动、关闭即阻塞黑暗\"这一\"开放/关闭\"的粗浅觉察，与广论止观中\"掉举与沉没\"的粗相觉察有相通处。二者的对应当如何定位？",options:["二者毫无关联", "完全等同，辛格的开放关闭就是掉举沉没", "开放对应沉没、关闭对应掉举", "仅是\"能量\"层面的粗浅经验描述，可粗对掉举(心浮)与沉没(心沈)，但非九住心的精细判据"],answer:3,explanation:"✅ 答案是D。辛格以\"能量流动/阻塞、敞亮/黑暗\"描摹心的粗浮与粗沈，可粗对应掉举(心高举、散动)与沉没(心低沉、昏昧)，属于可对照的经验层。但它无广论九住心、六力、四作意的精细次第，更无\"身心轻安\"的得止判据，故是\"可粗对、不可等同\"。口诀：能量开闭粗浮沈，精细次第另须论。"},{stem:"【对照】布莱克\"神圣的停歇\"——在习性反应升起前停一拍、安住当下的片刻。这一\"插入觉察刹那\"的功能，在广论修止体系中对应什么？",options:["发菩提心摄持", "身八法的调身威仪", "以佛像为所缘的专注", "正知\"插入刹那\"觉察身心流散、令心回转"],answer:3,explanation:"✅ 答案是D。广论正知的功能正是\"觉察心是否流散、是否堕沉没\"——在散乱瞬间即刻觉察并令心回转，恰是\"在习性反应前插入觉察的刹那\"。布莱克的停歇亦是在惯常操控/反应前插入\"安住当下的片刻\"。其余皆为广论止修的别支，非\"正知插入\"这一层。口诀：一念插入正知照，惯习难逞当下醒。"},{stem:"【对照】辛格讲\"臣服\"——对当下一切不抗拒、都放开。这个\"臣服\"与广论的\"舍\"和\"不放逸\"放在一起看，最准确的辨析是哪一项？",options:["臣服就是广论的\"舍\"，完全一致", "广论的舍没有所缘与前提，可随意放", "臣服偏于\"对一切境不设防地放开\"，广论之\"舍\"专治作行且有明确所缘与前提，\"不放逸\"更非消极放任", "不放逸就是什么都不做"],answer:2,explanation:"✅ 答案是C。辛格\"臣服\"是普遍性的\"不抗拒、都接受\"，广论之\"舍\"是修止到沉掉已息时\"舍作行\"的专门法，有其前提(已断沉掉)与所缘(善思惟法)；\"不放逸\"是积极护持善法、遮止恶法，绝非\"什么都不设防\"。故臣服与\"舍\"义理相近、与\"不放逸\"方向相反，不可混同。口诀：臣服放开设前提，舍治作行不放逸。"},{stem:"【辨析题】辛格核心的\"意识/自性/阿特曼(Atman)\"——一个恒常、无品质、纯粹的觉知主体——若以广论\"止本身不判内外道，判在有无无我正见\"来检验，最恰当的结论是——",options:["安立\"常住觉知主体\"属常见(有我)，非无我正见，是两书与佛法最根本的分野", "阿特曼是佛教的佛性/自性光明", "辛格与广论在此完全相同", "阿特曼即佛法所说无我空性"],answer:0,explanation:"✅ 答案是A。答案落在\"边界在哪\"。广论卷十六明言\"此定是内外道二所共同\"，\"止本身不判内外道，判在有无无我正见\"。辛格的\"见证者/自性/阿特曼\"恰恰安立了一个恒常不变的\"觉知主体\"，属常见(执有恒常自我)，与广论观章\"破人我、法我二执\"的无我正见直接相对——这是它与佛法最根本的界线。\"阿特曼\"是印度教语汇，不可对等无我空性或佛性。口诀：止通内外道无别，判在有我或无我。"},{stem:"【辨析题】布莱克\"彻底接纳一切\"，与广论\"须观烦恼过患而后断\"的修止资粮(断除贪欲等诸恶寻思)之间存在张力。二者各自的目标与对象是——",options:["两者完全一致，都是无条件接受一切", "布莱克主张分辨过患后驱赶一切负面情绪", "广论主张无条件接纳烦恼", "布莱克接纳的是\"自我憎恨的情绪\"，广论遮断的是\"贪欲等恶寻思\"，一在对治自我嗔害、一在遮止恶法，动机层次不同"],answer:3,explanation:"✅ 答案是D。答案是\"对象不同\"。布莱克为疗愈\"自我缺陷感/自我憎恨\"而强调\"全盘接纳自己的情绪\"，方向是\"先慈悲观照、不嗔恨自己\"，且已自我设限\"并非容许伤害行为\"；广论\"断贪欲等恶寻思\"须\"观无常过患\"，是\"分辨烦恼过患而后遮断\"。一在对治自害(自我嗔恨)，一在遮止恶法(贪欲)，接纳的是\"情绪\"，断的是\"烦恼\"，不可混同。口诀：接纳情绪非纵恶，断惑须观过患先。"},{stem:"【辨析】布莱克全书的落点是\"疗愈自我缺陷感、活出全然的生命\"；广论止观章的落点是断惑证真。两书的目标层关系，最准确的表述是？",options:["广论只求定不求观", "断惑不需要任何心理层面的健康", "心理疗愈即证悟，目标完全等同", "心理疗愈属世间层面(对治自我憎恨、恢复健康人格)，断惑是出世层面(破二我执、断烦恼种子)，前者可为后者资粮却非同义"],answer:3,explanation:"✅ 答案是D。答案是\"层次之别\"。布莱克的慈悲疗愈旨在疗愈\"自我缺陷感\"、重建人格尊严，属世间层面的心理健康，可为修行的前行资粮；广论止观章的目标是破人我/法我二执、断烦恼种子(卷16\"断欲界烦恼\"\"断烦恼种子\"、卷24观章)，是出世层面的断惑证真。二者是\"资粮—证悟\"关系，非等同，也非无关。口诀：疗愈身心是资粮，断惑破执方登程。"},{stem:"【辨析】布莱克兼具南传内观与藏传传承背景，她书中的修法与广论系统（同承《声闻地》一系）的关系，最准确的表述是？",options:["广论系统否定一切南传内观", "布莱克的传承与广论毫无关联", "二者同源共许(同承声闻地、共许正念正知对治沉掉)，但判教、次第、所缘与\"无我正见\"的抉择深度有差", "南传内观与广论系统完全相同、可互换"],answer:2,explanation:"✅ 答案是C。答案是\"同源有差\"。布莱克明引佛陀苦谛、佛使比丘\"我执/我所执\"、无明为苦根、佛性、内观(明见)，与广论\"苦为宗、执我为根本无明、正念正知对治沉掉\"共许处最多，同承《声闻地》一系。但广论另加\"观章抉择空性正见\"\"破二我执\"\"止观双运\"等更深层次，判教与次第不同。是\"同源共许、深度有别\"。口诀：同出佛家声闻地，抉择深浅有分齐。"},{stem:"【辨析题】辛格\"不认同念头、把念头都当作声音\"所达成的是\"功能层的无我\"(解除念头对行为的强制驱动力)，与广论观章\"抉择人无我正见\"(破补特伽罗我自性有)相比，正确的辨析是——",options:["见地层无我不需要正理思择", "功能层无我与见地层无我完全同一", "辛格只在功能层松开\"念头≡我\"的执取，未抉择补特伽罗自性有的正理，且反安立恒常觉知主体，故只是\"似无我\"，非见地无我", "放下对念头的认同已等于抉择人无我正见"],answer:2,explanation:"✅ 答案是C。答案是\"见地之别\"。辛格\"见证者不认同念头\"只是功能层面松开\"念头即是我\"的执取(降伏粗烦恼现行)，但未通过正理抉择\"补特伽罗自性有\"为空，反而安立一个恒常\"觉知主体\"，故只达\"似无我\"，未得广论卷18所破界限下的人无我正见。广论的无我正见须依龙树中观、破所破界限、思择抉择，非\"不认同念头\"所能当。口诀：不认念头是松执，抉择人我乃正见。"}]},
{name:"禅修的方法与过程×广论止观",author:"宋智明",questions:[{stem:"一位同修把\"无心是道\"当成参悟的第一站，上来就讲\"没有分别心\"，却对身心、境界的虚妄性毫无体认。按宋智明\"悟性四层\"的次第，他错在哪里？",options:["他漏掉了\"无心可用、无心可修\"这一层的功夫", "他不该用\"没有分别心\"来定义无心", "他把结果当成了起点，\"无心是道\"应排在四层悟的最后", "他把第三层的\"了悟无心\"错当成第一层\"领悟身心本空\""],answer:3,explanation:"✅ 答案是D。悟性四层次序是\"领悟身心本空→参悟境界本空→了悟无心是道→明悟世间法即佛法\"，\"无心是道\"位列第三层，须先过了身、境二关才能谈无心；直接抢跑讲无心而无身心本空的基座，正是原书\"处处有心就是处处的业、处处的罪\"所警戒的颠倒。干扰项\"把结果当起点\"方向沾边但落点错了——四层的终点是\"世法即佛法\"而非无心；\"不该用没有分别心定义无心\"更是反了，原书明言\"什么叫无心呢？就是没有分别心\"。口诀：先透身心境，再谈无心道。"},{stem:"有位师兄说：\"我打坐能坐到完全没念头，好空好静，这就是见性了吧。\"宋智明书里会怎样回应这个判断？",options:["这是无念，无念不是见性，无念是无明", "这是无心，是无分别的朗照", "完全正确，坐忘到无念就是明心见性", "这是解悟，只是还没到证悟"],answer:0,explanation:"✅ 答案是A。原书明言\"无念还不是无心……无念不是见性，无念是无明\"，因为无念时还会想起不起念头，\"后面的这个念头正是无明\"，在无念中起想的或不起想的都是无明，须进一步照破。干扰项把无念混同无心——原书说\"死在无心上不是道，这个无心是活泼泼的\"，何况无念尚隔一层；混同解悟也不对，解悟是理上透彻，与坐中觉受是两回事。口诀：无念背后藏无明，照破方知本无心。"},{stem:"宋智明讲\"了幻即真\"要过三关。关于\"了外境、了身、了心\"的次序，下面哪个说法合于原书？",options:["三关同时了，不分先后", "先了心，因为心是最根本的妄源", "先了外境、外缘(六尘境界)", "先了身，把身体气脉打通才算过关"],answer:2,explanation:"✅ 答案是C。原书次第明确：\"首先要了外境、外缘，就是六尘境界\"，再\"第二要了身\"，最后\"第三了心\"；由外而内、层层放下，\"这点悟不到，你就无法归入一念\"。干扰项\"三关同时了\"抹掉次第；\"先了身并打通气脉\"更是偷换——原书明说\"修行不是修身体\"，大圆满修身调气脉只是方便，了身是观四大假合的悟性，不是修气脉的功夫。口诀：了境了身再了心，由外向内次第寻。"},{stem:"临济宗讲照用，宋智明区分\"先照后用、先用后照、照用同时\"。其中\"知\"和\"照\"的根本差别在哪里？",options:["知是解悟层面，照是文字知解层面", "知是显宗的说法，照是密宗的说法", "知是更高明的照，照是粗浅的知", "知有个\"我\"在觉知、带着能所功夫，照是无我、朗照四面"],answer:3,explanation:"✅ 答案是D。原书说\"知，有个我在知，有一点着我的\"，而\"照是道用，是道的作用\"，照是\"四面八方同时的\"；知是功夫里悟后作功夫的地方，照才是无分别的朗照道用。干扰项把知与照作高下倒置，或扯成显密宗派之别，或降为解悟与文字的层次差，均非书中所辨——二者之别在\"有我无我、有能所无能所\"。口诀：知带我影，照无我朗然。"},{stem:"某同修执着一个\"能知能觉的主人公\"，认定\"这个就是我的本性、我死了它还在\"，以此用功甚至以此发神通。宋智明对这种禅的判语是什么？",options:["参话头的正路", "彻却直指的见性", "禅门的外道(主人翁禅)", "天台介尔一心的下手处"],answer:2,explanation:"✅ 答案是C。原书把\"我有个主人公在、这是我的本性讲话\"而执着此禅者判为\"主人翁禅，禅门的外道\"，并举湛愚老人心灯录、王阳明一路——执着本来、在此用功、发神通都是它，\"他还不能圆到无情众生，山河大地……这方面的悟性还不够\"。干扰项把它当参话头正路或彻却见性，恰好把病当药；当天台介尔一心也不对，台家借现前一念下手却要消融于法界，与执一个主人公成对照。口诀：执个主人公，禅门成外道。"},{stem:"《禅门十邪论》里，\"不证身心万法本空之性，妄取虚境、妄立觉知、自谓有悟有证、自举而骄于世、稍有不许即行棒杀\"所指是哪一种邪？",options:["邪智", "邪禅", "邪通", "邪证"],answer:3,explanation:"✅ 答案是D。原书此条结语正是\"此即邪证者\"——未证言证、妄取虚境而骄世。干扰项各有所指：\"着神通而自诩有道者，并常以神通来压服他人，比试通力，即入邪通\"；\"妄取公案机用言句以为实法、妄评正偏高低、沦为打击他人之工具\"是邪禅；\"无根而妄施、自称有智慧却不能解人之惑障、开人正眼\"是邪智。四个词条主旨各别，须以关键行相锁定。口诀：虚境自诩是邪证，比试通力堕邪通。"},{stem:"关于\"成片\"，宋智明给的判定语是哪一组？",options:["光明现前、身体化空", "身心轻安、喜乐充满", "动静一如、内外一体、体用不二", "九住心成、任运而转"],answer:2,explanation:"✅ 答案是C。原书：\"什么叫成片？动静一如、内外一体、体用不二\"，并说\"成片就是法身正位，证到法身，生死已经没有了\"。干扰项\"九住心任运而转\"是广论卷16的名相，宋书不立此数；\"身心轻安、光明化空\"在宋书恰被判为须破的觉受——\"这个受一定要破掉\"，住在上面会落魔。口诀：成片三不二，动静体用一。"},{stem:"有修行者问\"气脉打通是不是就见性了\"，宋智明的回答是什么？",options:["见性必须先打通气脉", "气脉打通可以化空，但不一定见性，外道也有", "气脉打通是见性的唯一前提", "气脉一通必然见性"],answer:1,explanation:"✅ 答案是B。原书：\"气脉打通可以化空，但不一定见性。外道也有……打通气脉以后还要上师给你引导，指点才能见性。\"且\"安住本性的人不要去管气脉他自然是通的\"。干扰项把气脉当成见性的充分或必要条件，皆违背原书立场——气脉是化空的助缘，见性另有直指一路，二者不可混。口诀：气脉能化空，见性须直指。"},{stem:"宋智明点评一类修行人：\"解悟的人明道去，却不求证悟！\"他批评的病根是什么？",options:["解悟者把理上透彻、大开圆解当作究竟，止步而不求证悟", "解悟者不读经论、没有闻思基础", "解悟者完全不懂道理，连名相都说不圆融", "解悟者不练打坐、缺乏定功"],answer:0,explanation:"✅ 答案是A。解悟是\"参这个道理，明白这个道理，明白得很透徹\"，能使修行统一圆融；但原书明诫\"禅人不可以理悟为极则\"——\"缘虑之心不离能所，虽知万法唯心，仅是理悟\"，把明道当终点而不求证悟正是病处。干扰项把解悟贬为\"不懂道理\"恰好说反——解悟者恰是懂了道理，病在得少为足；归咎于不读经或不打坐则全非所指。口诀：大开圆解非究竟，明道还须证本真。"},{stem:"把\"知空不二就是法身\"放到宋智明三身开发的框架里，正确的配位是哪一组？",options:["知空不二只是解悟，不是证悟", "知空不二是最低浅的了相，离见性还远", "知空不二等同于打通气脉", "知空不二就是法身，起朗照就是报身，用就是化身"],answer:3,explanation:"✅ 答案是D。原书：\"知空不二就是法身，但是你不去朗照，法身是素法身，起朗照就是报身，这个照就是报身开发，这个用就是化身、大悲化身的开发，三身是这样圆满的。\"干扰项把知空不二贬为最低浅了相、或降为仅是解悟，都与原书\"你已经体会到了这个知、空，就是素法身了，就是本性\"相违；混同气脉更不知相差几许。口诀：知空即法身，朗照报化开发。"},{stem:"广论卷15立无过三摩地\"令心明显具明显分，专住所缘无有分别具安住分\"，并说昏沉伤明显分、掉举伤安住分。宋智明书里哪一组表述与这两个分对应？",options:["如痴如呆对应明显分，成片对应安住分", "回光返照对应明显分，参究对应安住分", "朗照、虚明对应明显分，寂寂、无心对应安住分", "昏沉对应明显分，掉举对应安住分"],answer:2,explanation:"✅ 答案是C。广论两殊胜——明显分是令心清晰明朗，安住分是专住所缘无分别；宋书以\"朗照、虚明、灵知了了\"表达明显分，以\"寂寂无为、无心空寂\"表达安住分，\"唯虚明朗照寂寂无为\"一句正是两分并举。干扰项\"昏沉掉举对应两分\"把所治的过失误作所得的功德——它们正是损害两分、须以八断行对治的敌人；如痴如呆是化空前的过渡，回光返照是参究功夫，皆非此处配位。口诀：朗照配明显，寂寂配安住。"},{stem:"宋书所讲的\"昏沉、困扰(腿痛、睡、昏沉、苦乐受)\"与广论\"沉掉二过失\"的关系，哪个说法最贴切？",options:["宋书完全不处理昏沉，因为禅宗不修止", "广论的沉掉只指昏沉，不含散乱", "宋书的昏沉与广论的掉举是同一回事", "宋书把昏沉睡苦乐受归为\"了身\"未透的表现，广论把沉没列为伤明显分的过失，二者同指心暗昧、堪能性失"],answer:3,explanation:"✅ 答案是D。宋书把昏沉、执身体、执苦乐受归入\"了身\"未透的范畴——身体只是工具，苦乐感受皆虚妄；广论卷15把沉没列为忘圣言以下、伤明显分的过失，掉举另伤安住分。二者同指心暗昧、堪能性丧失这一层。干扰项说宋书不处理昏沉——宋书\"凡是有心的，都是虚妄的\"一路照破苦乐受昏沉，何曾不处理；说广论沉掉只含昏沉，或把昏沉等同掉举，则把沉掉二过混作一谈。口诀：沉没伤明分，掉举损安住。"},{stem:"广论卷16以\"串习力成办第九住心等持\"，并引读书喻——\"譬如读书至极串熟，最初发起欲诵之心，虽于中间心往余散，然所读诵任运不断\"。宋书里哪个概念在功能层与之对应？",options:["气脉打通", "照用同时", "绵密串习、成片", "如痴如呆"],answer:2,explanation:"✅ 答案是C。相通处在\"绵密用功→成片\"与\"串习力→等持\"同构：都是持续串习达到任运而转、无功用运转，读书喻的\"任运不断\"正是宋书\"打成一片\"的写照。但须记边界：宋书不立九住心、六力、四作意的数字阶位，功能对应而不作名相互译。干扰项\"如痴如呆\"是化空前的必经阶段而非串习成熟；\"照用同时\"是悟后启用；\"气脉打通\"更与串习无关。口诀：绵密串习熟，成片等持同。"},{stem:"宋书\"解悟→明悟→证悟\"三级，与广论\"闻→思→修\"次第，哪个对应关系站得住？",options:["明悟对应修、证悟对应闻", "解悟对应闻、明悟对应思、证悟对应修，一一机械对号", "解悟、明悟大体对应闻思层面的通达正见，证悟对应修所成的真证量", "三者与闻思修完全无对应"],answer:2,explanation:"✅ 答案是C。相通处在：解悟\"参理明白得很透彻\"、明悟\"偶然明白一下\"都还属见地通达的层面，可归入广论卷17\"由闻思慧引发通达真实正见，是必不可少毗钵舍那正因资粮\"的位分；证悟\"一直在\"\"不会退、不会失\"才对应修所成证量。边界在：明悟虽是刹那现量的闪现，但旋得旋失，不宜机械等同于\"思\"——原书\"偶然明白一下叫明悟，一直在叫证悟，就这一点不同\"。干扰项一一机械对号或全然否认对应，各执一边。口诀：闻思通正见，修证方不退。"},{stem:"宋书用功八事告诫：境界来了(佛光、恐怖相)不分别不取舍，甚至说\"如果你和妄念产生了对立，老是去感觉有没有妄念，是不是跑掉了，那么你就不能归入一心\"。这种\"不施功用、平等置之\"的态度，与广论八断行中哪一支的功能最相通？",options:["念——忆持所缘不令忘失", "信、欲——深信止观功德而策发精进", "舍——已离沉掉时不强作对治功用、平等而住(治作行)", "正知——常察自心沉掉散乱有没有生起"],answer:2,explanation:"✅ 答案是C。相通处在功能层：对已现的境界觉受不迎不拒、不施对治的平等安住，正是\"舍\"治\"作行\"的气象——沉掉已息时还强作功用，反成过失；宋书\"老是去感觉有没有妄念\"恰是这种多余功用的写照。边界在这是功能对照而非名相等同。干扰项：正知的职分是觉察沉掉生没生起，念的职分是系住所缘(下一题的主角)，信欲治的是懈怠，均非此条所指。口诀：境现不迎拒，舍置最相当。"},{stem:"\"念头摄不住时……如果佛号没有了、咒没有了，拉回来……不要去照顾妄念，要照顾你的咒和佛号，照顾你的当下。\"这句话与广论八断行中哪一支、对治哪一过失相通？",options:["思，沉掉已生时发起对治", "念，忆持所缘治忘圣言(忘失所缘)", "信与欲，策发精进以治懈怠", "正知，觉察沉掉有没有生起"],answer:1,explanation:"✅ 答案是B。相通处在：宋书\"佛号没有了、咒没有了，拉回来\"，正是以念系住所缘、不忘不散——广论卷15八断行以念治忘圣言，忆念所缘令心相续安住。\"妄念是浮云，是空的\"所以不理它，只管把心放回咒和佛号上，与\"念\"的职分若合符节。干扰项：信欲治懈怠、思治不作行(沉掉已生而不施对治之过)、正知察沉掉，各有职分，均非\"拉回来\"这一动作的功能。口诀：咒号系一念，念支治忘失。"},{stem:"广论卷16说得第九住心无分别安乐光明者，多有\"误为已生根本后得共相合糅无分别智\"；卷24更辨\"心境二相粗分皆灭如净虚空……然非获得通达无二真实正见\"。宋书哪一条判断与这两处辨析同一血脉？",options:["梦境与神通都是见性的标志", "见到光明就是证悟", "轻安觉受是得止的量", "突然发现一道光明、身体没有了就以为见性，这些都是虚妄的"],answer:3,explanation:"✅ 答案是D。相通处在：宋书明言\"突然之间发现了一道光明，自己身体没有了，噢，我见性了。这些都是虚妄的\"，觉受(身体很舒服、很轻安、眼内有光、梦中佛来说法)一定要破掉，\"如果住在这些境界上，以为修行是进步、是好现象，那么就会落魔\"；广论卷16不许以无分别安乐光明误认无分别智、卷24不许以如虹如烟之相冒充见空性，同一辨伪血脉。干扰项三条恰是两家同破的误区——见光即证、以轻安为量、以梦境神通为标志。口诀：光影如虹烟，皆非真见性。"},{stem:"\"证悟是不会退的、不会失的，覆盖一下，他又回来的\"——宋书这一判据，与广论卷16\"第九住心未得轻安，尚不立为得奢摩他，何况能得毗钵舍那\"的得止之量，关系怎么判？",options:["两者完全等同，证悟就是得轻安", "得轻安就是证悟", "宋书的\"不退\"是见性证量之判据，广论的得止另以身心轻安为量，判据的对象不同层次", "广论认为证悟会退、宋书认为不会退，二者矛盾"],answer:2,explanation:"✅ 答案是C。相通处在都以\"可检验之量\"立判——宋书以\"不退不失、空觉不二、一直都在\"判证悟，广论以\"起身轻安\"判得止；边界在对象不同层次：一个判见性之证量，一个判奢摩他之成就，广论卷16正恐人把定境(无分别安乐)误认作证悟。干扰项把两者画等号，或说成矛盾——不同层次的判据本可并行不悖，谈不上谁对谁错。口诀：不退判证量，轻安判得止。"},{stem:"宋书说\"修功夫要有福报的，要有一段很平稳的生活、很自然的生活，那才能保得住。事情一来，一兴奋、一激动、一焦虑，功夫就会破坏\"，又诫用功中不造违缘、不去操劳办大事。这与广论修止资粮六种的哪一条相通？",options:["知足", "少欲", "清净尸罗", "住随顺处(兼断诸杂务)"],answer:3,explanation:"✅ 答案是D。相通处在：广论卷14资粮六种之\"住随顺处\"要求易得衣食、地不引病、日无多人夜静声寂之处，\"断诸杂务\"(断贸易、医药、算星相等)——正应宋书\"平稳自然的生活\"与\"特别动脑筋、负担重的事一来，功夫会破坏\"。干扰项少欲、知足、清净尸罗各是另外的资粮条目，与\"外境平稳、断除杂务\"的指向不同。口诀：资粮住随顺，断务保平稳。"},{stem:"宋书参究以\"看源头\"\"看话头\"\"知空者谁\"为宗，重在不起分别的疑情直照；广论毗钵舍那则以\"正思择、最极思择、周遍寻思、周遍伺察\"(卷14)的观察慧为定义。二者关系怎样判断才准确？",options:["方法论取向相反——疑情照破对思择抉择——却同求破执、同向证空", "宋书参究是修止，广论思择才是修观", "二者完全相同，都是修观", "广论思择观修高于宋书参究"],answer:0,explanation:"✅ 答案是A。相通处在：二者都以破除我执、证得空性为归宿，且都不许死在文字公案上。边界在：方法取向截然相反——宋书参究扫荡意识分别，不落一边、不建能所，\"他不让你建立次第……只要让你看\"；广论恰以观察慧为观的正因资粮，有次第、有能所地如理抉择。这是汉传禅与藏传道次第最根本的岔口，不可互相替代。干扰项或混同为一，或判参究为止(参究正是禅门之观，只是不用思择之器)，或强分高下——不同的器，无有定高下。口诀：疑照与思择，同破执殊途。"},{stem:"宋书以\"一法摄一切法、万法归于觉性\"统摄禅净密(禅见性、密加持明体、净念佛三昧)；广论则以\"下士道→中士道→上士道\"\"止→观\"的次第为唯一主轴。两套判教的根本差异何在？",options:["一个讲顿、一个讲渐——宋书是全体一真、当下即是的顿摄，广论是三士道、先止后观的渐次", "宋书排斥密宗，广论融摄密宗", "两者讲的都是同一套次第", "宋书否定净土，广论肯定净土"],answer:0,explanation:"✅ 答案是A。相通处在：两者都以一法统摄一切法的总摄精神立教，都自认为含摄全圆之道。边界在骨架：宋书以觉性一句顿摄禅净密，\"一法摄一切法\"当下即是；广论立三士道的道次第，先止后观、渐次升进，缺一阶则不立。顿摄与渐次，是判教立场的分野而非水火不容。干扰项臆造\"否定净土\"\"排斥密宗\"的对立——宋书恰是融而不斥，作者本人由显入密、由密归禅；说成同一套次第则抹平了顿渐之别。口诀：顿摄一真体，渐立三士阶。"},{stem:"宋书讲\"无心可用，无心可修，无心可作\"；广论卷14/16却力破支那堪布——\"因彼妄计一切分别皆执实相，要弃观慧全不作意，乃为修习甚深法义\"。这条边界怎么划才不算冤枉任何一方？",options:["两者一模一样，宋书\"无心\"就是支那堪布的翻版", "宋书\"无心\"与堪布修法毫无关系", "宋书\"无心\"是破能所执着后的活泼道用，堪布之辨所破的是\"弃观慧、全不作意\"而当修空——差别在是否废掉观察慧", "广论立场与宋书立场完全一致"],answer:2,explanation:"✅ 答案是C。相通处在：表层都谈无分别，都反对以分别心攀缘造作。边界在\"弃观慧\"三个字：宋书的\"无心\"是\"没有分别心\"的活泼道用——\"死在无心上不是道，这个无心是活泼泼的\"，且不废思想，\"必须要思想的地方是要用思想，但是不带烦恼心、不计较\"，更以\"无念是无明\"自设护栏；堪布被破之处正在把\"全不作意、不思维\"直接当修甚深空义，从而废弃观察慧。一字之差，一个是破执后的大用，一个是废慧的暗住。干扰项或把宋书打成堪布翻版(冤枉)，或说毫无关系/完全一致(抹掉差异)。口诀：无心活泼用，弃慧始成病。"},{stem:"宋书\"成片=动静一如、体用不二\"功能上近似广论第九住心\"等持\"，但两者有一个关键差别。这个差别是什么？",options:["等持不以轻安为量", "两者完全相同，没有差别", "广论等持得止须以身心轻安为成立量，宋书成片不以轻安为判据、甚至把轻安归入须破的觉受", "成片低于等持一个阶位"],answer:2,explanation:"✅ 答案是C。相通处在功能层：成片与等持都是串习成熟后任运而转、无功用而恒在的境界。边界在判据：广论卷16明定第九住心未得轻安\"尚不立为得奢摩他\"——轻安是得止的成立性标志；宋书却把\"很舒服、很轻安\"这类受列入\"一定要破掉\"的觉受，\"住在这些境界上……就会落魔\"，证悟之量在空觉不二不退失，不在轻安。一个以轻安为里程碑，一个视轻安为路上风景，判教取量不同。干扰项说完全相同或强分高下，皆失其辨。口诀：成片似等持，轻安判据分。"},{stem:"\"知空不二就是法身\"在宋书是见性证境的表述；从中观正见的立场看，它与\"空性=无自性有、缘起故空\"之间有层次差。这个层次差怎么表述才对？",options:["宋书\"知空不二\"是外道见，应予破斥", "中观空性否定宋书的法身说", "两者是同义词，可以互相替换", "宋书\"知空不二\"是修行人身心双泯的现量证境，中观空性是依正理抉择\"无自性有\"的义理定解——一为证量之事，一为正见之理"],answer:3,explanation:"✅ 答案是D。相通处在：二者都指向空的究竟义、都不落断灭——广论卷17引\"诸说空缘起，中道为一义\"，宋书知空不二也不坏缘起用。边界在层次：宋书落在证境的描述——空与觉不二、朗照现前，是行人的现量事；中观空性是依龙猛正理抉择出的所破界限——破自性有而不破缘起显现，是见地上的定解。理可资证，证不代理；以证境冒充正见则混滥观察，以义理废证境则成说食数宝。干扰项或说同义(混层)，或判为外道见/被否定(不知二者本不相违)。口诀：证境是现量事，空性乃正见理。"},{stem:"\"到了这一步，要知道外道也是佛法，魔和佛没有区别\"——这句话在什么语境下成立、什么语境下成病？",options:["这句话本身是邪说，永远不成立", "在悟透世法即佛法、诸法空相无取舍的最高层悟境下成立；尚在分别执着的人借以行恶破戒、不取舍因果时则成病", "它只在理论讨论里成立，不能用于修行", "在任何语境下都成立，是普遍真理"],answer:1,explanation:"✅ 答案是B。相通处在宋书本意：这是第四层悟\"了心以后起大用，世间法就是佛法\"的透顶语——破尽对立时魔佛皆法界显现，原书自己都注明\"那是一般人很难理解的道理\"\"染污就是清静，下地狱和天堂没有一样\"。边界在受用者资格：未到此境而持此语，正落十邪中\"行恶行破戒体而以为无碍\"的邪行、借境界语以自纵——境界语须有境界者方堪受用，把无分别当挡箭牌即是病。干扰项或不问语境全盘肯定(愚)，或一概斥为邪说/空谈(亦失其指月之用)。口诀：透顶魔佛亡，借语即成病。"}]},
{name:"学箭悟禅录三书×广论止观",author:"赫里格尔等",questions:[{stem:"学箭三年仍放不出好箭，赫里格尔问大师：\"如果'我'不放箭，箭怎么会射出去？\"大师答：\"'它'自己射出去。\"并以竹叶作比：\"竹叶在积雪的重压下越弯越低，突然积雪滑到地面，而在滑落之前竹叶并没有抖动\"，须\"在箭手连想都没想之前箭便射了出去\"。大师这段回答与竹叶之喻的核心要义是？",options:["箭离弦后要走直线，如竹叶般笔直", "放箭是\"它\"自己放——如积雪积到极处自然滑落、瓜熟蒂落，箭在射手想之前便已离弦，不待\"我\"插手", "放箭要靠手指瞬间发力弹出，如竹叶弹落积雪", "射手要在心里默数拉弓的节拍，到点松手"],answer:1,explanation:"✅ 答案是B。大师的原话是\"'它'自己射出去\"；竹叶之喻的原意是\"一达紧张，箭便脱手，要像积雪滑下竹叶那样\"，射得对时\"箭离开你就像瓜熟蒂落一般\"——自我退位，纯熟后自然成办。手指瞬间发力正是赫里格尔早年自作聪明减轻指压的歧路；默数节拍、箭走直线皆无出处。口诀：它自己放非我放，竹叶积雪想前脱。"},{stem:"大师教呼吸：\"吸气后要轻轻地将气往下送……一呼一吸，绵绵不断\"，又叮嘱\"将注意力全部集中到呼吸上来，就好像你没有别的事可做！\"苦练多年后赫里格尔写道：\"我自己不在呼吸，而是——听起来有点怪异——我被呼吸。\"这句话描述的是怎样一种状态？",options:["工夫纯熟后呼吸自然运转、不待主观用力的忘我状态", "大师替他调息时造成的错觉", "一种需要时刻用意念控制横膈膜的高级技巧", "练功过度产生的幻觉"],answer:0,explanation:"✅ 答案是A。原著明言呼吸训练使他\"不费力气地抛开自我\"——化入之后由\"我在呼吸\"转为\"我被呼吸\"，是不待作意的自然运转。用意念时刻控制恰是大师批评的\"你在使劲想它\"；幻觉说、错觉说都无视这一体感反复重现、且带来拉弓放松实效的上下文。口诀：呼吸化入不由己，忘我却自工夫来。"},{stem:"大师们描述射艺至境：射手\"向自身瞄准——但又没向自身瞄准\"，此时\"瞄准者与被瞄准者，射手与靶子已合而为一\"，于是\"艺成为无艺，射成为非射，即无弓无箭之射\"。这种\"无艺之艺\"指的是？",options:["超越技巧、物我两忘的艺术至境——弓箭只是\"达到目的的工具，而不是目的本身\"", "把射箭化简到只剩一套标准动作", "不再需要练习的先天禀赋", "彻底放弃弓箭改修坐禅的转轨"],answer:0,explanation:"✅ 答案是A。原书说真想精通艺术的人\"必须超越技巧，让艺术成为一种源于无意识的'无艺之艺'\"，且\"弓箭只是没有它们也照样发生的某种东西的一种假托\"——瞄准者与靶子合一，正是忘我纯熟之境。先天禀赋说否定了六年苦练；改修坐禅说与借箭术悟禅的立意相反；标准动作说把至境降格为体操。口诀：无艺之艺超技巧，弓箭原是假托物。"},{stem:"赫里格尔一心想射中靶子，成绩反而更差。大师高声说：\"真正的艺术，是没有目的、没有目标的！你越是一心想学会以射中靶子为目的的射箭，你就越射不好箭，靶子离你也会越远。\"大师随即点出病根。按这段话，越是瞄准靶子越射不中，病根在？",options:["弓的弹性不足", "求中的执著——\"拦路虎\"是主观意愿太强", "靶子太远、功力未到", "呼吸方法错误导致手臂僵硬"],answer:1,explanation:"✅ 答案是B。大师直指\"你的拦路虎是你的主观意愿太强了\"——求中之心即执取之心，越用力越远，这是\"艺术无目标\"一语的落点。归因靶远弓弱是把病推给外境，与\"朝自身瞄准\"的内向旨趣相反；呼吸不当是初学拉弓阶段早已解决的前一课。口诀：求中之心是拦虎，无目的处箭自中。"},{stem:"弓道以呼吸为入路：先\"将注意力全部集中到呼吸上来\"，久之\"我被呼吸\"，心神由外驰转为收敛、由寻思转为安住。以广论印证，这呼吸化入的训练在所缘体系中应如何安立？",options:["卷15净行所缘中\"上品贪者缘不净\"，以不净治贪", "卷15净行所缘中\"多寻思者缘息\"——以息为所缘对治寻思，是应根器的对治之一而非最高所缘", "卷18所破界限\"破自性有、不破显现作用\"", "卷16第九住心\"无功用任运而转\"，是得止之量"],answer:1,explanation:"✅ 答案是B。呼吸化入对治的正是心神外驰的多寻思，对应广论卷15净行所缘\"多寻思者修息\"；广论主推缘佛像为最胜所缘，缘息只是对治分类之一。缘不净治贪不治寻思；第九住心是住心之量而非所缘之选；所破界限属观慧方法论，与所缘安立是两回事。口诀：多寻思者缘于息，净行所缘各对治。"},{stem:"放箭\"它自己放\"、如瓜熟蒂落；广论卷16则有读书喻：\"譬如读书至极串熟，最初发起欲诵之心，虽于中间心往余散，然所读诵任运不断。\"二者相通的层次，对应九住心的哪一住？",options:["第一住心内住——从外摄录内心", "第九住心等持——无功用任运而转，由串习力成办", "第三住心安住——散已速知还复", "第四住心近住——励力令住、心渐细"],answer:1,explanation:"✅ 答案是B。\"它自己放\"是纯熟后不待作意的任运成办，正对应第九住心\"无功用任运而转\"，读书喻\"任运不断\"同旨；六力中此住由\"串习力\"成办。内住是初摄心，安住是散已速知，近住仍须励力——皆在功用位，未及任运。口诀：瓜熟蒂落第九心，串习功成任运转。"},{stem:"弓道讲忘我：\"射手向自身瞄准\"，到后来\"瞄准者与被瞄准者，射手与靶子已合而为一\"。若以广论卷14所引经文印证这种忘我专注，对应的一句判语是？",options:["《宝云经》\"奢摩他者，谓心一境性\"", "《修次中编》\"惟观离止如风中烛\"", "《大般涅槃经》\"惟有如来遍见一切，止观等故\"", "《解深密经》\"毗钵舍那者，谓正观察\""],answer:0,explanation:"✅ 答案是A。忘我专注、心专一境，对应《宝云经》\"奢摩他者，谓心一境性\"（卷14）——能所相对淡化、心安住所缘不散，是止的安住分。正观察是观的体性；风中烛喻缺止之过；止观等是如来果位判语，皆非此境所对应。口诀：人靶合一心一境，印证在止不在观。"},{stem:"原书引泽庵《不动智神妙录》论剑：初学者技艺越高反而\"他的心被剑夺走\"；至境则是\"一切皆空，无论是你的自我，寒光闪闪的宝剑，还是挥剑的手臂。甚至连空的念头也不再存在。\"有人据此说：剑道\"人剑合一\"即已见空性、等同断惑。以广论判位，正确的辨析是？",options:["相通处在忘我专注与心一境性、专注一趣至等持同构；边界在广论卷16明判此定\"是内外道二所共同\"，止不判内外道，断惑判在无我正见加出离心菩提心摄持，故不可判为见空性之观", "剑道无心低于外道禅定，对修止毫无价值", "剑境即通达空性，因为连空的念头也不存在了", "艺术三昧即是广论所许的毗钵舍那"],answer:0,explanation:"✅ 答案是A。相通处在：忘我与心一境性同构，\"心被剑夺走\"的消解正是安住分的成办，属止的等至熟练。边界在：广论卷16明判此三摩地\"是内外道二所共同\"，外道诸仙亦依此离欲；且\"尚不能断欲界烦恼，况能尽断一切烦恼\"——断惑须无我正见与出离心、菩提心摄持。剑境之\"空\"是艺术的无求，不是中观的自性空；把\"连空的念头也不存在\"读作证空，恰是混淆了无分别定与观察慧。口诀：无心止境内外共，断惑还凭正见摄。"},{stem:"有人读完\"我被呼吸\"，主张：既然至境是任运，初学者就该从第一天起不作意、任运放松即可。以广论修止次第辨析此说？",options:["正确——任运是本有，作意反成障碍", "错误——广论主张作意与任运永远并用，全无先后次第", "正确——广论也主张初修即入无功用运转", "错误——相通处在\"被呼吸\"的任运与第九住心无功用运转同构；边界在任运是作意串习纯熟之果：原著先是多年\"将注意力全部集中到呼吸上来\"的作意功夫，广论四作意亦由力励运转渐次经有间缺、无间缺方至无功用运转，抽掉作意前提谈任运即是躐等放逸"],answer:3,explanation:"✅ 答案是D。相通处在：\"被呼吸\"的任运与无功用运转同构，都是功夫纯熟之果——原著中赫里格尔先被师父纠正\"你在使劲想它\"，多年作意集中后才化入。边界在：广论四作意次第分明——初修力励运转，经有间缺、无间缺运转，方至无功用运转；六力由听闻力至串习力渐次成办。任运在果不在因，未熟先任即成放逸。口诀：任运原从作意熟，未熟先任是躐等。"},{stem:"剑道要求\"不瞄准而射中靶子，完全不看目标也无意射中目标\"；弓道亦练\"不瞄准的射箭\"。有人把这种\"灵靶\"理解为一种特殊所缘——像缘佛像那样，对\"无靶之靶\"造作安住来修止。以广论辨析？",options:["相通处在不瞄准与放下求果的执著同向专注纯熟；边界在\"灵靶\"是超脱瞄准的禅机语言、属不立所缘的直接体验一路，广论修止则明立所缘（缘佛像、缘息）而安住——两套传承判位不同，且以无靶为借口弃所缘全不作意，正近卷14所斥支那堪布\"要弃观慧全不作意\"之误", "灵靶即所缘佛像，修法全同", "灵靶是观慧所缘，属毗钵舍那", "广论根本不立所缘，与灵靶旨趣全同"],answer:0,explanation:"✅ 答案是A。相通处在：不瞄准与放下求果执著，同向于心不外逐的专注纯熟。边界在：灵靶是\"不立文字\"一路的禅机语言——要害在舍弃瞄准这件事，而不是另立一个\"无靶之靶\"去缘；广论修止须\"令心明显具明显分，专住所缘无有分别具安住分\"（卷15），所缘应根器各别而立、无有一定，但绝非全无所缘。把灵靶读成新所缘，是把境界语错置为修法；若进而以无靶废所缘，正堕支那堪布\"弃观慧全不作意，乃为修习甚深法义\"（卷14）之误。口诀：灵靶无靶是禅机，所缘造作广论宗。"},{stem:"贝达自述：\"我仍尝试将修行的定义拓展到禅修技巧之外……最重要的是你愿不愿意将修行落实到日常生活里。\"其平常心禅学派亦标榜\"不求特殊的开悟境界，不企图达成有别于当下的超常意识状态\"。平常禅对修行的核心定位是？",options:["追求更深的三昧定境，以定境伏烦恼", "参公案话头直求开悟", "借数息观息把情绪排拒在禅修之外", "修行在日常不在特殊状态——困境本身即是道途"],answer:3,explanation:"✅ 答案是D。学派主旨明言不求特殊开悟境界、不图超常意识状态，且\"不借数息、观息或随息来规避当下的情绪活动\"；把修行落在日常生活的每个当下。以定境为目标、借数息避情绪恰是其所破；参话头亦非此家家风。口诀：平常禅归日用，不慕定境直入困。"},{stem:"贝达的实修工具\"标明念头\"：念头起时心中默默加标签，如\"念头认为这件事太难了\"\"念头认为我应该动一动身体了\"。按原著，这工具能带来的\"双重利益\"是？",options:["压制念头使心归于安静", "让心快速入定并延长坐香时间", "追溯童年成因以疗愈心理创伤", "一重破除对思想的认同——看见思想只是思想罢了；一重认清自己正在想些什么"],answer:3,explanation:"✅ 答案是D。原著明言：\"第一，它能破除我们对自己的思想的认同，让我们看见思想只是思想罢了。\"第二重则是认清当下念头的具体内容。入定延香非其目的；心理分析式的溯源是会错方向的读法；压制念头更与\"看见思想只是思想\"背道而驰。口诀：一破认同二认清，标明念头念是念。"},{stem:"书中引佛陀曰：\"所有的人类都有八十三种烦恼……我的法虽然无法解决这八十三种烦恼，不过也许能舒解第八十四个烦恼——我们根本不想有任何烦恼。\"贝达由此引出的关键句是？",options:["佛法终能把八十三种烦恼全部清除", "烦恼越多修行进步越快", "烦恼与生俱来，无药可医", "\"期待烦恼能消失才是我们真正的问题\"——不想有烦恼的抗拒本身才是根本问题"],answer:3,explanation:"✅ 答案是D。原著紧接着说\"事实上，期待烦恼能消失才是我们真正的问题\"——第八十四个烦恼正是\"我们根本不想有任何烦恼\"这一抗拒本身，法的用处是舒解这层抗拒。全清烦恼、烦恼越多越快、无药可医皆非原意；此喻落点在看破抗拒、如实面对，不在烦恼的数量增减。口诀：八十三恼法难除，第八十四是拒恼。"},{stem:"平常禅主张把每一情绪、每一困境都当修持对象，在日常中不断回到当下、绵密相续。以广论印证，这最贴近哪一条功夫理路？",options:["卷14\"断诸杂务\"——断外务后即无须所缘", "卷16六力\"串习力\"成办第九等持——等持由绵密串习成办，非由一时特殊体验", "卷17依龙树论闻思正见——日常闻思即是修行全部", "卷15\"信欲勤安\"治懈怠——发起精进即可成就"],answer:1,explanation:"✅ 答案是B。日用中数数回归、久久纯熟，与广论\"串习力→等持\"的方向暗合——第九住心等持由串习力成办，正与\"不断回到当下\"的绵密修持同构。断杂务是外缘准备，非功夫本身；信欲勤安是发起对治懈怠的一门，未及成办；闻思正见是观之资粮，不是绵密修止的对应。口诀：日用绵密即串习，久久纯熟自等持。"},{stem:"标明念头的操作：念头起时不压不随，默念\"念头认为这件事太难了\"，对心之流散了了分明而不认同。以广论八断行（卷15）印证，这最对应哪一支的功能？",options:["念——治忘失所缘，忆持所缘不忘", "正知——治沉掉不觉，观察心之流散", "舍——治作行，无沉掉时不强作功用", "思——治不作行，沉掉生已策举对治"],answer:1,explanation:"✅ 答案是B。标明念头令心之动静了了分明，对应八断行\"正知（治沉掉不觉）\"与九住心\"正知力\"的观察功能层——见念而不随念。念是忆持所缘不忘失；思是沉掉生已起对治的策举；舍是无过时的放舍，皆非\"观察流散\"这一功能。口诀：标明念头正知层，见念是念不认同。"},{stem:"有人说：平常禅的体证情绪、转化愤怒、开放慈悲，已是佛法的断惑解脱，与广论止观同一层次。但广论卷16明言：\"任如何修此三摩地，尚不能断欲界烦恼，况能尽断一切烦恼，故当更修毗钵舍那。\"试辨其层次差。",options:["心理整合高于断惑，故可取代修观", "相通处在如实觉察、不压抑不抗拒与正知观察的功能层可印；边界在心理整合是调现行、疗愈层（世间道暂伏），断惑须观无我、永断种子（出世道永断），不可混同", "无层次差——都是离苦，心理整合即断惑", "断惑即情绪调节，广论另修毗钵舍那是多余"],answer:1,explanation:"✅ 答案是B。相通处在：不压抑、如实体证，与正知对情绪了了分明的功能层相通。边界在：贝达的转化情绪、开放慈悲自属心理疗愈与开阔一层，其功效在调伏情绪现行；广论则判三摩地不能断欲界烦恼，断惑须以观察慧观无我、断种子——世间道暂伏与出世道永断之别。把情绪平复当解脱，正是混同两层。口诀：心理整合伏现行，断惑须观断种子。"},{stem:"四祖遥观气象，入牛头山寻访。见法融端坐自若，问\"在此作甚么\"，答\"观心\"。四祖一句诘问便令法融无对起礼；后来又在宴坐石上书一\"佛\"字，法融见而竦然，祖点曰\"犹有这个在\"。这串勘验问答的诘问与所破是？",options:["\"何以降此？\"——破接待慢心", "\"何者是佛？何者是心？\"——破向外求佛之执", "\"心如何对治？\"——破对治法之执", "\"观是何人？心是何物？\"——破法融于\"观心\"能所之间尚存的微细实执，\"佛\"字一勘更验出那层\"犹有这个在\""],answer:3,explanation:"✅ 答案是D。四祖问\"在此作甚么\"，法融答\"观心\"，四祖即诘\"观是何人？心是何物？\"，法融无对；后书\"佛\"字验其竦然，点\"犹有这个在\"——勘的正是能观所观那层微细执著。\"何者是佛何者是心\"与\"心如何对治\"都是法融后来请问的话，不是勘验诘句；\"何以降此\"只是寻访寒暄。口诀：观是何人心何物，一个佛字勘细执。"},{stem:"道信禅法相传有\"守一不移，动静常住，能令学者明见佛性，早入定门\"之要语（语录流传，付法问答本文未载），与\"坐禅守心\"\"系心一处\"同旨。以广论印证，\"守一不移\"应如何安立？",options:["已是毗钵舍那观慧——守一即观空，一步到位", "与修止无关的持戒仪轨", "否定一切所缘的任运无修之法", "同于《宝云经》\"奢摩他者，谓心一境性\"（卷14）的系缘修止——缚心一处令不散动；但卷16明判此定\"尚不能断欲界烦恼\"，故止是前方便，明见佛性尚须更修观慧"],answer:3,explanation:"✅ 答案是D。\"守一不移\"即系心一处，与卷14\"奢摩他者，谓心一境性\"可印，属摄心修止的通途；但广论卷16明判\"任如何修此三摩地，尚不能断欲界烦恼，况能尽断一切烦恼，故当更修毗钵舍那\"——守一入定门是止，\"明见佛性\"须观慧辅助。判为观慧、否定所缘、归为持戒，皆失其位。口诀：守一不移系缘止，入定是门见性须观。"},{stem:"四祖付法：\"汝但任心自在，莫作观行，亦莫澄心……荡荡无碍，任意纵横\"；答对治之问又说\"汝但随心自在，无复对治\"。有人疑惑：广论修止却讲\"由念正知令心相续安住不散\"、讲内住续住的摄心次第——岂不与祖意相违？这道\"缚心\"与\"任心\"之辨，正确的会通是？",options:["相违——祖意更高，应废广论摄心次第", "不相违而须辨位——\"任心自在，无复对治\"是应法融之机（其人年十九即\"晓达真空\"，唯余微执）的果地解缚语；广论摄心次第是未得止凡夫的因地通途：缚是因地方便，任是果地风光，以后者废前者即成放逸", "不相违也无从会通——顿渐两途永不相涉", "相违——缚心是方便、任心是真实，二者只能取一"],answer:1,explanation:"✅ 答案是B。原著后记明言：付法问答是四祖对法融\"随方解缚\"，\"四祖并非要否定修持功夫，未及法融禅师境界之善男子善女子，应愈加勤修戒定慧\"。会通之要正在辨位：对已晓达真空者说任心无对治，是解其微执；凡夫未得止，仍须念知摄心、循九住心次第。以顿语废次第，\"不作诸善，不作诸恶\"便成放逸借口；以次第谤顿语，则失对机解缚之巧。口诀：果地任心因地缚，辨位会通两不违。"},{stem:"四祖开示：\"夫百千法门，同归方寸，河沙妙德，总在心源……汝今已得，更无阙少，与佛何殊\"——圭峰宗密判此一路为\"泯绝无寄宗\"；广论止观章则是\"修止资粮→所缘→八断行→九住心→得止→修观\"的严格渐次。二者结构上的根本差异，正确的判读是？",options:["相通处在同指心性、\"守一不移\"与心一境性在止的层面可互印；边界在顿旨是果地直指、不立次第（对已晓达真空者随方解缚），广论是因地渐修、次第决定（先止后观、止观双修方能断惑）——判教体系不同，顿语不可直读为凡夫行持，亦不可以渐废顿", "顿教即广论次第的浓缩版，名异实同", "广论全盘否定顿教，二者水火不容", "顿教高于一切次第，故当废次第专任心"],answer:0,explanation:"✅ 答案是A。相通处在：皆指心性之旨，守一不移与心一境性在修止层可互印。边界在：道信\"汝今已得，更无阙少\"是对已晓达真空者的果地直指，属顿门风光、不立阶次；广论是摄机普广的渐修道次，灯烛喻（卷14）明示止观双须、次第决定。以顿废渐则成放逸之阶，以渐谤顿则失向上一路；后记亦警未及法融境界者应勤修戒定慧。口诀：顿是果地直指，渐是因地阶梯。"}]},
{name:"悉达多×广论止观",author:"赫尔曼·黑塞",questions:[{stem:"夜晚祗园中，乔文达望着那张脸——\"他的微笑平静、轻柔，或慈悲，或嘲讽，正如佛陀的微笑\"，又想起卷首那个\"俊美的婆罗门之子\"，猛地意识到自己追了一生的\"那个人\"与眼前这位觉者并非同一人。关于黑塞对\"悉达多\"与\"乔达摩\"这对人物的安排，下列哪项最准确？",options:["乔达摩是悉达多在俗世经商时使用的化名", "悉达多是乔达摩出家前的原名，二者本是一人", "黑塞把佛陀的俗名\"乔达摩·悉达多\"拆成两人——乔达摩已成道、悉达多仍在求道", "乔达摩是悉达多在沙门时期的法号"],answer:2,explanation:"✅ 答案是C。历史上释迦牟尼俗名\"乔达摩·悉达多\"，黑塞刻意将这名拆成两个独立人物：乔达摩（Gotama，已证涅槃的世尊佛陀）与悉达多（Siddhartha，仍在求道的主角），终章二人以\"圆成者之笑\"合一。乔文达所见\"这微笑……和乔达摩的微笑一致\"正是这一设计的终点。误把小说主角当历史佛陀、或把两人当同一人的化名/法号，都落入了黑塞设下的经典陷阱。口诀：一人成道一人行，同源俗名拆两名。"},{stem:"婆罗门之子悉达多先后三次离开——离开父亲、离开沙门、拒绝皈依乔达摩，乔文达不解他为何总在\"别人给足了一切\"时转身。这三段离开背后最共同的动因是？",options:["他性格孤僻，不喜结伴同行", "对父权与权威的青春期叛逆", "他始终没找到能令他信服的老师", "外在的闻慧、祭祀、法义都无法替代他渴求的亲身证悟"],answer:3,explanation:"✅ 答案是D。三次离开的共性不是叛逆或孤僻，而是\"外在已给足、内在未满足\"：父亲的爱与婆罗门智慧、沙门的苦行技艺、佛陀清晰无瑕的法义，都没能平息他\"永恒的焦渴\"。他追求的是唯有亲身证悟才能抵达的\"内在'我'之源泉\"。乔达摩本人正是他的\"圣贤\"，但法义仍不是那条路。口诀：外在满者内在空，闻思未尽须亲证。"},{stem:"索尔河畔，悉达多对乔文达说出当年苦行的真相——他觉得沙门近三年的苦修，比起驱牛者在客栈里喝几杯米酒，也高明不到哪里去。他这番自省的核心结论是？",options:["苦行只是对\"我\"之折磨的暂时麻醉，并未证得涅槃", "苦行本身有罪，应彻底禁止", "应加长斋戒天数以证涅槃", "苦行是最快的解脱捷径"],answer:0,explanation:"✅ 答案是A。悉达多的原话是\"那不过是逃避'我'，是暂时从'我'的折磨中逃出来，是对生命的虚无和痛苦的暂时麻醉\"，并直言\"可能所有沙门都无法证悟涅槃\"。他并非主张苦行有罪或应加码，而是看穿苦行只是麻醉而非解脱。这是全书\"离苦乐二边\"中道精神的伏笔。口诀：苦行如酒徒麻醉，非道反增我执缠。"},{stem:"悉达多在林中拦下世尊乔达摩，当面称其法义\"清晰无瑕、证据确凿\"，却又指出其中一处令他无法皈依的关键\"缝隙\"。这一\"断裂\"指的是？",options:["法义缺少对阿特曼的论述", "佛陀自己被证悟而非靠法义成道，故\"没人能通过法义得到解脱\"", "佛法是靠性空无我的中观正见才成立", "四圣谛难以让普通信众理解"],answer:1,explanation:"✅ 答案是B。悉达多承认法义逻辑圆满，但他看到\"在明晰又可敬的法义中不包含世尊的历程，那个您独自超越众生的秘密\"——佛陀是\"通过探索、求道、深观、禅修、认知、彻悟而非通过法义修成正果\"，因此他推断\"没人能通过法义得到解脱\"。B项的中观正见是广论立场，恰恰不在黑塞的文本里。口诀：法义清晰缺自证，裂缝在觉不在言。"},{stem:"离开祗园的那个清晨，悉达多忽然\"苏醒\"了。他不再把眼前的湛蓝、灿黄、河流、森林当作\"摩罗的法术、玛雅的面纱\"来蔑视。这一觉醒翻转的核心是？",options:["他决定重回父亲身边继续修习吠陀", "他认识到意义和本质不在事物背后，而在事物当中", "他相信只有通过苦行才能触及事物本质", "他彻底否定了神圣与意义的存在"],answer:1,explanation:"✅ 答案是B。原文：\"意义和本质绝非隐藏在事物背后，它们就在事物当中，在一切事物当中。\"悉达多从此停止\"为寻找废墟后的秘密而扼杀自己\"，转而接纳当下现象本身即意义。这不是否定神圣，而是从\"追逐彼岸本质\"翻转为\"肯定当下现象\"，是他\"拜自己为师\"的起点。口诀：不在背后在当中，觉翻转处即现前。"},{stem:"初入尘世时，悉达多对名妓迦摩罗与商人迦摩施瓦弥自我介绍：\"我会思考。我会等待。我会斋戒。\"这\"三件宝\"后来在世俗沉溺中蒙尘，又在河边捡回。下列对这三件宝的理解，哪项最贴切？",options:["三件宝是苦行教条的残余，应当彻底抛弃", "\"斋戒\"指他信奉的宗教戒规，须终生严守", "这是他对商人的谄媚话术，并无深意", "它象征不为饥饿、冲动所迫的定力与专注，是他区别于\"孩童般世人\"的资本"],answer:3,explanation:"✅ 答案是D。思考、等待、斋戒是悉达多的自证资本——\"斋戒\"在此不是宗教戒律，而是\"不为饥饿所迫的定力\"，使他能等、能专注、能在世俗欲望前不被动摇。它一度助他在商场得胜，又一度在纵欲中蒙尘，最终在河边重新拾回。它不是谄媚，也不是该抛弃的教条。口诀：能思能等能不动，定力是宝非戒条。"},{stem:"瓦稣迪瓦教悉达多\"跟河水学\"。河水在书中承担了多重意涵——消解时间、融合万千声音、映照习气轮回。下列哪一组是\"河流意象\"的正确层次？",options:["河流是乔达摩法义的文学图解", "河水象征\"只有当下\"（时间消解）、万千声音合一为\"唵\"（圆满）、嘲笑笑声（照见习气轮回）", "河水代表必须被舍弃的轮回之流", "流水仅是一处供人渡河的自然风景"],answer:1,explanation:"✅ 答案是B。河流是全书最重要的老师与意象：它\"对于河水来说只有当下\"\"没有过去，没有未来\"（消解时间），万千声音汇聚成\"唵\"字（圆满），又在悉达多为儿子痛苦时以笑声照见他父子三代轮回的投射。它不是风景、不是该舍弃的轮回，也不是法义图解。口诀：当下唵字一声笑，河水三义即师心。"},{stem:"瓦稣迪瓦自称\"我不是导师，不擅言辞和思考。我只懂倾听，保持驯良……我的任务是渡人过河\"。这样一位沉默寡言的摆渡人，最终却成了悉达多\"最后一位、也是真正的一位老师\"。黑塞借他塑造的是一种怎样的形象？",options:["深谙经论、辩才无碍的法师", "只会撑船的平凡匠人，无关修行", "以身示范、以倾听接引、不靠言辞说教的善知识", "一位隐瞒修为的得道高人"],answer:2,explanation:"✅ 答案是C。瓦稣迪瓦的价值正在\"不擅言辞\"——\"船夫最大的美德是倾听\"，他\"不褒扬亦不挑剔，只是倾听\"，以身接引而非说教。这与广论\"亲近无倒了达佛语宗要智者\"的善知识义相通：善知识的价值不在辩才炫技，而在真实引导。他正是黑塞心目中\"善知识\"的文学化化身。口诀：不逞言辞以身传，倾听即是度人船。"},{stem:"终章里，悉达多对乔文达倾倒他毕生的\"认知\"：智慧不可言传、真只有片面地才得以言传、时间不实在、罪人即未来之佛、爱乃头等要务。下列哪一项最能准确表达\"智慧不可言传\"这一命题？",options:["\"知识可以分享，智慧无法分享，它可以被发现，被体验\"", "智慧可通过辩论与言辞完整传递", "智慧与知识、法义是同义词", "任何经论教法都是多余的"],answer:0,explanation:"✅ 答案是A。悉达多明言\"知识可以分享，智慧无法分享，它可以被发现，被体验。智慧令人安详，智慧创造奇迹，但人们无法言说和传授智慧\"。这一命题与广论\"闻思只作资粮、最终须'修'而生起现证\"并不矛盾——法义能传，证量须自证。它不是否定经论的价值，而是点出\"闻慧\"的限度。口诀：知识可传慧须证，闻思是粮修为果。"},{stem:"悉达多一生都在\"自己求道\"，甚至当面拒绝皈依佛陀，喊出\"没人能通过法义得到解脱\"。若以《广论》止观章的立场来照看，下列哪项对照最精确？",options:["广论主张只靠闻思、不必自证", "悉达多的立场就是佛法修行的标准次第", "小说与广论完全同调，都主张弃绝一切教法", "悉达多\"智慧不可言传、须自证\"与广论\"由闻思慧引发通达真实正见\"相通，但广论更强调\"依止善士+清净传承\"才是正因资粮"],answer:3,explanation:"✅ 答案是D。相通处在：二者都承认\"法义能传、证量须自证\"，闻思慧只是资粮，最终须\"修\"而生起现证（卷17\"亲近无倒了达佛语宗要智者，听闻无垢清净经论，由闻思慧引发通达真实正见，是必不可少毗钵舍那正因资粮\"）。边界在：悉达多由此走向\"背离一切法义自己走\"，而广论把\"依止传承+闻思\"定为修观正因。二者不是同调，更非对立到互斥。口诀：闻思引发真见同，依师传承异小说。"},{stem:"悉达多跟随沙门，立于骄阳骤雨、蹲于刺藤、屏息敛气乃至\"平定心跳\"，近三年却自认\"只寻得安慰、麻醉\"。对照广论修止资粮，下列哪项辨析最准确？",options:["沙门苦行\"离乐边\"正合广论中道，广论所反对的只是\"苦边\"", "广论主张苦行正是修止第一要务", "苦行能直接证得奢摩他", "广论修止资粮强调\"少欲知足、断诸杂务\"而非自虐，与\"离苦乐二边\"的中道精神相通，故苦行无所得正可印证此理"],answer:3,explanation:"✅ 答案是D。相通处在：悉达多对苦行\"无所得、只麻醉\"的批判，与中道\"离苦乐二边\"精神相通；广论修止资粮（住随顺处、少欲知足、断诸杂务、清净尸罗、断贪寻思等）恰恰反对自虐，要求身心随顺而非折磨肉体。边界在：广论所离的是\"过与不及\"二边，并非简单否定苦行的\"苦\"本身。口诀：离二边者不执苦，资粮在舍杂务心。"},{stem:"瓦稣迪瓦\"以身示范、以倾听接引、不擅言辞\"，与广论\"亲近善知识\"之义相通。下列哪项最准确地指出这一对照的\"相通处\"与\"边界\"？",options:["瓦稣迪瓦的沉默寡言正是广论所要求的\"善知识须无学识\"", "广论否定一切师徒关系", "相通处在善知识以\"真实引导\"胜而非以言辞辩才胜；边界在广论之善知识须\"无倒了达佛语宗要\"，是具足正见与传承的智者", "瓦稣迪瓦与广论善知识完全等同，无任何差异"],answer:2,explanation:"✅ 答案是C。相通处在：瓦稣迪瓦\"不是导师、不擅言辞\"却能\"了达宗要\"并以倾听接引，对应广论\"亲近无倒了达佛语宗要智者\"——善知识的价值不在辩才，在真实导引。边界在：广论的善知识须具足正见与传承标准，是\"了达宗要\"的智者，而非仅仅沉默的摆渡人。二者相通而不等同。口诀：真实引导胜辩才，了达宗要是正因。"},{stem:"悉达多\"抛弃激情和期盼，不论断、无成见地以寂静的心、侍奉和敞开的灵去倾听\"河水，进而\"听见万千声音为一\"\"悟出时间不存在\"。对照广论止观结构，下列哪项最贴切？",options:["整个倾听过程只是\"止\"，与\"观\"无关", "这只是世俗娱乐，与止观无涉", "倾听河水的专注对应奢摩他\"安住分+明显分\"，悟出时间不存在对应\"观\"的最极思择", "悟出时间不存在即是\"得止\"的判据"],answer:2,explanation:"✅ 答案是C。相通处在：悉达多以寂静专注的心安住于河水这一所缘而不散乱，对应\"无过三摩地\"的\"安住分+明显分\"（心一境性、专注所缘且清晰明亮）；而\"听见万千声音为一\"\"时间不存在\"则从专注所缘深化到对实相的洞察，对应\"观\"的\"最极思择\"（如所有性）。边界在：河水是黑塞自选所缘，广论主推\"缘佛像\"为最胜所缘，且所缘须随根器各别安立。口诀：专注所缘是止分，洞察实相入观门。"},{stem:"乔文达一生依止教法与传承——先随悉达多、后皈依佛陀——至老却\"尚未停止探求，永远不会停止\"\"路时常艰难昏暗\"\"尚未收获\"。他与悉达多构成一组对照，下列哪项解读最准确？",options:["乔文达已证果，只是假装未得", "乔文达是反面人物，代表修行失败", "乔文达讽刺了那些不修行的伪信者", "乔文达象征\"有闻（依止法义）而仍未自证（修）\"的求道者，对应广论\"有闻无修之缺\""],answer:3,explanation:"✅ 答案是D。乔文达不是反面人物，他是忠诚的求道者，终身依止教法却\"尚未收获\"。这一形象恰好对应广论所警惕的\"有闻无修之缺\"——听闻法义而不由\"修\"生起现证，则始终在外围打转。他最终通过\"一吻\"的体验性瞥见才获安宁，印证\"闻\"之外尚需\"修\"与\"体验\"。口诀：终身闻而不亲证，缺在修慧非缺闻。"},{stem:"悉达多从河水悟出\"时间并不存在\"，说\"没有过去，没有未来。一切都是本质和当下\"。广论止观中与此\"功能层\"最接近的对应是下列哪一项？",options:["时间不存在即是证得空性", "广论主张断绝一切时间观念才能修止", "这是否定因果与业力的断见", "正念正知安住于当下刹那的\"念\"与\"正知力\"，与\"当下\"功能层相应，但广论尚需所缘选择与无我正见层"],answer:3,explanation:"✅ 答案是D。相通处在：\"时间并不存在\"作为修行体证，与广论\"正念正知安住当下刹那\"的功能层相应——心不随过去未来漂移，安住现前。边界在：黑塞的\"当下\"是一体论体证（指向\"融入统一\"），而广论的\"念、正知\"有明确所缘与次第，且最终须以无我正见摄持，不是\"无念即道\"。故它是功能层的呼应，不是见地层的等同。口诀：当下安住是功能，无我正见再上层。"},{stem:"瓦稣迪瓦\"我的任务是渡人过河。我渡过千万人过河\"，而悉达多最终也接过竹筏、成为摆渡人。这一\"摆渡人\"职业选择若与佛法对照，最贴近下列哪项意涵？",options:["摆渡只是谋生手段，与修行无关", "摆渡暗示放弃修行、沉沦世俗", "摆渡是苦行的一种新形式", "摆渡象征\"自度度他\"——先自渡而后以平实劳作接引众生，而非高高在上说教"],answer:3,explanation:"✅ 答案是D。摆渡是黑塞笔下\"以身接引而不说教\"的具象：瓦稣迪瓦\"只渡人过河\"，不传法义却以倾听与劳作度人；悉达多最终\"自己成为渡口\"，象征他由求道者转为接引者，完成了\"自度而后度他\"的转身。这不是谋生或沉沦，而是修行落地的姿态。口诀：先自渡而后度人，平实劳作即道场。"},{stem:"悉达多拒绝皈依佛陀、立志\"为摆脱所有圣贤及法义，独自去实现我的目标\"，终其一生自己走。这与广论\"依止善士+清净传承\"的修道次第之间存在张力。下列哪项辨析最准确？",options:["小说与广论在此处观点完全冲突、是错误与正确的对立", "\"拒绝皈依自己走\"是文学化的\"个体成道\"表达，服务于黑塞的浪漫主义主题；广论\"依止善士+清净传承\"则是可操作的修道次第，二者语境不同，不可把小说人物的话直接抬为佛法标准", "悉达多的做法正是广论所倡导的", "广论其实是主张人人独自成道、不必依师的"],answer:1,explanation:"✅ 答案是B。相通处在：二者都重视\"亲身证悟\"这一落脚点，小说理想化了\"独立求道\"的过程。边界在：广论明确把\"亲近善知识、听闻经论、由闻思引发正见\"立为\"必不可少毗钵舍那正因资粮\"，是修道次第；而悉达多的\"背离法义自己走\"是文学表达，服务于\"印度作为功能舞台、个人成道\"的主题，不能当作佛法标准。辨析的关键是区分\"文学表达\"与\"修道次第\"两个层次。口诀：文学写个体成道，次第须依师传承。"},{stem:"悉达多晚年悟出\"河水的万千声音汇成同一个字'唵'\"\"万物合一\"\"每块石头都是梵天\"，终章又说\"世间存在的一切皆好、一切皆有定数\"。这样的\"一体观\"若对照广论中观空性，下列哪项辨析最准确？",options:["河流一体观即中观\"缘起性空\"，二者完全等同", "中观也主张万物融为一个同质的\"大一\"", "河流一体观是比中观更高的见地", "一体化是直觉层面的\"万物合一\"，属吠檀多\"梵我合一\"色彩，指向自我融入统一；中观空性是\"无自性有\"，以抉择所破界限、破\"自性\"而证，二者层次不同"],answer:3,explanation:"✅ 答案是D。边界在：黑塞的\"河水只有当下、万物合一为唵\"是带有吠檀多（阿特曼、梵我合一）与浪漫主义色彩的一体论，指向\"自我融入统一\"；广论的中观正见是\"空性=无自性有\"，破的是\"自性\"（执实有），不是把万物融成同质的大一。悉达多的\"一体/圆满\"并未辨析\"所破界限\"，易滑向\"一切皆圆满皆善\"的肯定论，与中观\"缘起性空、二量不违\"不在同一论证层次。直觉一体不等于抉择空性。口诀：直觉一体谓合一，抉择空性破自性。"},{stem:"终章悉达多对乔文达说：\"我唯一的事，是爱这个世界。不藐视世界，不憎恶世界和自己，怀抱爱、惊叹和敬畏地注视一切存在之物和我自己。\"并把\"爱\"立为\"头等要务\"。这与广论的大乘\"菩提心\"对照，下列哪项辨析最准确？",options:["菩提心否定一切世间之爱", "广论主张只爱众生、不爱世界", "悉达多的\"爱\"是梵我式的情识之爱与对世间的肯定，指向自我与世界的和解；菩提心是以\"出离心+无我正见\"为摄持的出世慈悲、愿度众生，二者有\"情识爱悦\"与\"出世慈悲\"的层次差", "\"爱是世界终极\"即大乘菩提心，二者同义"],answer:2,explanation:"✅ 答案是C。相通处在：二者都流露对众生/世界深切的不舍与关怀。边界在：悉达多的\"爱\"以\"梵我合一、一切皆好\"为底色，是情识之爱与对世间的终极肯定；菩提心则以\"出离心+无我正见\"摄持，是\"为利众生愿成佛\"的出世慈悲，不建立在\"一切皆圆满\"的肯定论上，而是以\"苦谛\"为起点、以正见与悲愿为双翼。情识之爱不等同于菩提心。口诀：爱悦世间是有情，悲以正见方菩提。"},{stem:"故事结尾，悉达多自己接过竹筏、成了摆渡人，乔文达问他是否找到了\"另一位老师\"，悉达多回答：没有老师，但\"世界、河水、石头\"都成了他的老师。若要用一句话精确表述\"悉达多最后'自己成为渡口'与'依师'的关系\"，下列哪项最恰当？",options:["悉达多彻底否定了依师，证明修行无需任何老师", "成为摆渡人意味着他放弃了度化众生的责任", "悉达多从未有过老师", "\"自己成为渡口\"是\"从依师受学到自证自度\"的完成，而非否定师——他毕生有父、沙门、佛陀、瓦稣迪瓦诸师，最终以自证之身转为接引者"],answer:3,explanation:"✅ 答案是D。精确表述的关键在\"完成\"而非\"否定\"：悉达多一生并未脱离师——父亲、沙门长老、佛陀乔达摩（即便他不皈依，仍称乔达摩为\"唯一令我垂青之人\"）、瓦稣迪瓦都曾接引过他；\"自己成为渡口\"意味着他由\"依师受学\"走向\"自证自度\"，再由求道者转为接引众生的摆渡人。否定一切依师、或否认他曾有师，都是误读。口诀：依师导我至自证，自度成渡再度人。"}]},
{name:"宫本武藏·剑与禅×广论止观",author:"吉川英治",questions:[{stem:"泽庵把武藏吊在千年杉上，最后训他：\"你还是念念经，静静体会生死大义吧！\"而武藏照做后，\"放弃求生的念头，也放弃死亡的念头\"，领悟的关键在于什么？",options:["传授他在高空保持剑术平衡的诀窍", "惩罚他当初逃出七宝寺的过错", "考验他能否闭气承受身体痛苦", "逼出既断求生、又断求死的绝境，放下对生死的攀援"],answer:3,explanation:"✅ 答案是D。泽庵用的是禅门\"大死一番\"的彻底逼拶法，原文\"放弃求生的念头，也放弃死亡的念头\"，逼到既不求生亦不求死的绝境，令武藏当场断掉对\"生死\"的执取，而非比耐痛、传剑招或施刑罚。口诀：逼拶所破，唯生死执。"},{stem:"泽庵把武藏幽禁在白鹭城天守阁，说：\"你可以把这黑暗的房间想象成母亲的胎腹，你在此做重新投胎的准备。\"又问他要读成\"黑暗藏\"还是\"光明藏\"——这一设计的核心用意是什么？",options:["让他学会在黑暗里辨物护眼", "以读书积累圣贤文化，替换野性杀伐的习气，作\"转生\"准备", "教他把天守阁当藏宝库以自保", "暗示他要隐藏自己的剑客身份"],answer:1,explanation:"✅ 答案是B。天守阁藏万卷书，\"有和书，有汉书，其中有禅书也有国史\"，武藏读至《孙子·地形篇》\"知彼知己\"而大声朗读，泽庵三年后接他时说\"骨架子也差不多全好了\"，并赞\"你已会用比较人性的词汇了\"——读书在此是\"转生\"的闻思积累，以文明习气替换野性杀伐。口诀：黑暗藏即光明藏，唯在转心。"},{stem:"宝藏院后田里，白眉老僧弯腰锄地，\"锵---锵---锵---，锄地的调子一点也没变\"；武藏被他\"别无他念的专心之态\"所慑，感到\"一股说不出的凌人之气\"。这\"凌人之气\"的本质是什么？",options:["老僧对武藏怀有敌意", "老僧在田里偷练剑术", "修行人把威压收敛于一心后自然流露的定境余势", "老僧武功高强散发杀气"],answer:2,explanation:"✅ 答案是C。老僧\"弯腰锄地，默不作声\"，节奏始终不变，象征\"任运无功用\"的定境——身处劳作而心不散乱；武藏所感的\"凌人之气\"是修行人将威势收敛于一心后的余势，是\"平常心是道\"的形象化，而非杀气、练剑或敌意。口诀：定境之威，敛而不发。"},{stem:"\"笛声破定\"一节，武藏正处\"无我无敌、无生死妄念、剑人合一状态\"，忽闻阿通当年吹的曲子，\"从耳中突然窜入可疑的乐声中恢复了意识，重又回到肉体和杂念的自我\"。作者借这一情节说明了什么？",options:["武藏因见到阿通而心生恐惧", "剑人合一的\"心一境性\"脆弱，往昔情执串习一起即还堕散乱", "高明剑客的定力本可抗一切扰动", "笛声是敌方约定进攻的信号"],answer:1,explanation:"✅ 答案是B。武藏的\"剑人合一\"本是极专注的心一境性，但笛声唤起对阿通的情执记忆（\"不就是那时候的笛声吗……阿通！\"），一念妄缘即击破定境，四高徒趁破绽砍伤其手腕——正印证\"止\"唯伏烦恼现行，未断烦恼种子。口诀：一音妄缘起，还堕散乱心。"},{stem:"决战前夕，武藏到鞍马寺后院松树下静坐，\"原想好好体会自己化为无身无相的禅机，但是脑中始终无法摆脱死亡的阴影。最后甚至自问为什么要到山里坐禅呢？\"——次日却莫名清爽。作者借此写出了什么？",options:["武藏放弃了与人对决的念头", "刻意强求\"无身无相\"反被所缚，坦然受死反得清明", "坐禅的具体禅机可标准化传授", "武藏已在山中开悟见性"],answer:1,explanation:"✅ 答案是B。原文\"不去想的事，偏偏浮现在脑际；而生死的问题，却理不出头绪\"，正写出\"想坐禅\"与\"真放下\"的落差：刻意为坐禅而坐禅，被\"求无身无相\"所缚而阴影难消；待坦然接受死亡、不再强求时反而清明。口诀：不强求解脱，解脱自现前。"},{stem:"武藏彻夜雕观音不成，\"我削了又雕，就是雕不出观音像……不行，我现在得坐禅\"，随后\"闭上疲劳的双眼，除去心中种种杂念，现在他已经达到\"空\"的境界。\"这句话点出的关键是什么？",options:["心中\"求雕成\"的有所求即是执，失败暴露其落执，遂转坐禅返无为", "雕成观音需要更高明的刀工", "观音像必须塑泥而不能削木", "坐禅可以替代一切艺术创作"],answer:0,explanation:"✅ 答案是A。武藏\"有所求\"（求雕成观音）即落执，全部木头削成木屑仍雕不出，于是弃刀坐禅、\"除去杂念\"入\"空\"——这是从\"有为造作\"返\"无为\"的转折；但小说对\"空\"仅一笔带过，未给任何判分标准。口诀：雕刻之败，破在执求。"},{stem:"泽庵听武藏坦言\"越走越觉得道路遥远\"，欣慰道：\"这是必经之路啊！\"并说\"不到三十岁的人，如果认为已对'道'有初步的了解，那他人生的稻穗便已停止抽长\"。泽庵赞许的究竟是什么？",options:["武藏准备放弃剑道的决心", "武藏承认自己能力不足的自卑", "武藏终于愿意拜自己为师", "武藏\"尚未悟道\"的正直之叹，视\"悟\"为永未完成的过程"],answer:3,explanation:"✅ 答案是D。泽庵认为武藏的叹息是\"正直之音\"，并自谦\"若有人问我禅为何物？我可能还会背脊发寒\"——点明\"悟\"不是终点、不是可宣称的成果，\"自以为悟\"反是退转，越修越觉遥远恰是正道。口诀：道无止境，悟非终点。"},{stem:"卷首简介说，武藏\"面对小次郎的高超剑法和力道，凭着精神之剑取得最后胜利，成为了天下第一高手\"。这\"精神之剑\"在书中的性质是什么？",options:["一种具名的制胜剑招", "一把削铁如泥的名剑", "全书\"剑禅合一\"主题的最终象征，但吉川未写出其具体运作", "武藏从泽庵处学得的密传刀法"],answer:2,explanation:"✅ 答案是C。\"精神之剑\"是\"剑禅合一\"的收束象征，但吉川止于文学渲染，未写出\"悟\"后剑法如何具体不同——它是一个\"黑箱\"，恰是全书用以出辨析题的关键薄弱点，而非具名剑招、名剑或密传刀法。口诀：精神之剑，止于象征。"},{stem:"泽庵令武藏\"读书三年而后心灵之眼开启\"，这一设计与广论哪一判断在功能层相通？",options:["广论以轻安作为得止判据", "广论六力以串习力成等持", "广论\"由闻思慧引发通达真实正见\"是正因资粮", "广论九住心以听闻力成内住"],answer:2,explanation:"✅ 答案是C。相通处在先立见再修：武藏\"读万卷书、心灵之眼开\"暗合广论\"由闻思慧引发通达真实正见\"——不是盲修，而是以圣贤文化的闻思作\"转生\"前置，对应卷17\"由闻思慧引发通达真实正见，是必不可少毗钵舍那正因资粮\"。口诀：先闻思启见，后修行转心。"},{stem:"武藏\"生死一如之战\"中\"一生所有锻炼与积累都在无意识当中，变成从五体爆发出能量\"，这与广论九住心哪一住心、由何力成办最为对应？",options:["第九等持心，由串习力成办无功用任运", "第五调伏心，由正知力成办", "第三安住心，由忆念力成办", "第一内住心，由听闻力成办"],answer:0,explanation:"✅ 答案是A。相通处在\"苦练至无功用\"：武藏平日千日积累在杀境中\"无意识爆发\"，正是广论卷16\"串习力→第九等持（无功用任运而转）\"的文学描摹，与\"读书至极串熟，任运不断\"的读书喻同构。口诀：千日串习，无功用转。"},{stem:"武藏\"无我无敌、无生死妄念、剑人合一\"的状态，就其功能层面，与广论《宝云经》哪一定义最能对应？",options:["\"奢摩他者，谓心一境性\"", "\"毗钵舍那者，谓正观察\"", "\"起身轻安及心轻安，是名奢摩他\"", "\"抉择正理，破除自性\""],answer:0,explanation:"✅ 答案是A。相通处在\"忘我之剑即心一境性\"：武藏心专注一缘（剑与敌）、无有分别，正对应《宝云经》卷14\"奢摩他者，谓心一境性\"；注意这只落在\"止\"的专注功能层，不等于断烦恼的\"观\"。口诀：忘我之剑，心一境性。"},{stem:"泽庵对武藏点化、命名、幽禁读书、事后勘验\"尚未悟道\"，这一角色在广论观章体系中对应什么？",options:["广论\"依止善知识\"中亲近平等闻思的善士功能", "广论得止之量中的轻安", "广论所破的支那堪布", "广论五过失中的懈怠"],answer:0,explanation:"✅ 答案是A。相通处在善知识角色：广论卷17明言\"亲近无倒了达佛语宗要智者……是必不可少毗钵舍那正因资粮\"，泽庵正以\"命名—点化—勘验\"担此功能的文学化身，是引路而非代修，与支那堪布（弃观慧者）恰恰相反。口诀：善士引路，不代修行。"},{stem:"泽庵吊武藏逼其\"既断求生、亦断求死\"，勘破对生死的攀援，这与广论下士道哪一法门的意趣功能相通？",options:["以\"入中观\"抉择空性", "以\"念死无常\"为发心入门、勘破世间贪着", "以\"皈依三宝\"求得庇护", "以\"业果观察\"判断吉凶"],answer:1,explanation:"✅ 答案是B。相通处在\"以死为镜逼出真心\"：泽庵把人逼到既断求生、亦断求死，勘破对生死的贪执，与广论下士道以\"念死无常\"为发心入门的意趣功能相通——皆是以死为镜，勘破世间的攀援与贪着。口诀：念死无常，逼出真心。"},{stem:"白眉老僧\"锄地调子一点没变\"的作务定境，与武藏\"垦荒、锄头即剑道\"的日常，共同印证了广论\"日常所缘\"的哪一原则？",options:["劳作会障碍定，应断诸杂务", "串习须另觅静处、离群独修", "所缘必须弃绝世俗劳作、专缘佛像", "日常作务与三昧不二，任运安住所缘而心不散乱"],answer:3,explanation:"✅ 答案是D。相通处在\"动静一如\"：老僧锄地与武藏垦荒，皆以日常作务为所缘，\"身处劳作而心不散乱\"，呼应广论\"念正知令心相续安住不散\"的串习——所缘不必离作务，贵在任运专注；广论断杂务是断妨碍之务，非弃一切劳作。口诀：锄头即剑，动静一如。"},{stem:"笛声唤起武藏对阿通的情执，击破其定境——从广论而言，这恰是\"念正知\"所要觉察、八断行以\"舍\"要平息的哪一类障？",options:["治懈怠的\"信、欲、勤、安\"", "所破过宽的断边", "心于所缘不寂静的\"掉举\"相", "昏沉暗昧无明分"],answer:2,explanation:"✅ 答案是C。相通处在\"掉举相与正知监察\"：笛声引动情执、令心攀缘散动、脱离所缘，正是\"掉举\"之相；若具正知监察、念力系所缘，则能及时觉察还摄，八断行中\"正知治沉掉不觉、舍治作行\"正对治此境。口诀：情执妄缘，正知还摄。"},{stem:"小说中\"悟\"\"空\"\"无念\"全凭情绪与文学渲染，削观音坐禅\"达到空的境界\"仅一句\"除去杂念\"，与广论的差距本质在哪里？",options:["广论否认坐禅能入空", "广论认为空性根本不可知", "广论只讲渐修、绝无悟境", "广论以\"起身轻安及心轻安\"、第九住心等持等给出明确可验的\"量\""],answer:3,explanation:"✅ 答案是D。辨析点在\"得止/得观有量、小说之悟无量\"：广论卷16明言第九住心未得轻安\"尚不立为得奢摩他\"，得止以\"身心轻安\"为判据，得观以\"无性定解+显现不遮\"为量；而小说的\"悟\"\"空\"\"无念\"无任何可验证之量，二者分界在此。口诀：悟有量否，判在轻安。"},{stem:"武藏自称\"无师自通\"\"天下万物皆为我师\"，虽得泽庵点化却点到即止、主体自悟——这与广论\"闻思正见\"的要求之间存在怎样的张力？",options:["广论主张离善知识正闻薰习则无真实见，与纯自悟路径相异", "广论认为自悟正是最上根器之道", "广论与小说皆主自悟无须闻思", "广论否认任何师父的作用"],answer:0,explanation:"✅ 答案是A。张力在\"自悟与依师的边界\"：武藏之剑主诉自悟，泽庵虽为善知识实心点到即止；广论则强调正见必经\"闻思\"、离善知识正闻薰习则无真实见（卷17\"由闻思慧引发通达真实正见……必不可少\"），故纯自悟与依师闻思存在根本张力。口诀：自悟易狂，闻思为正。"},{stem:"武藏\"悟剑\"的多处场景发生在杀境（生死一如之战、以一敌众），\"无念无心\"被用来杀敌——这与广论止观的根性差异在哪里？",options:["武藏的剑已等同佛教的\"观\"", "广论鼓励以\"无念\"增强杀伤力", "广论止观与慈悲无关，纯修无念即可", "广论以菩提心摄持、指向止息烦恼利他，与杀伐之艺根本异趣"],answer:3,explanation:"✅ 答案是D。边界在\"杀伐之艺与慈悲的张力\"：广论修止观以出离心、菩提心摄持，指向止息烦恼、利他；而武藏的\"无念无心\"用于杀人，终归是\"止\"（定）而非\"观\"（慧），所断亦非烦恼种子，佛门观之终究与杀伐异趣。口诀：无心杀伐，止而非观。"},{stem:"小说反复渲染\"无念\"\"无心\"\"不分别\"，若读者把\"放下一切念头、全不作意\"当作修行本身，会落入广论所破的哪一种误区？",options:["广论所立\"九住心\"的次第", "广论所许的\"佛身所缘\"", "广论所讲的\"念死无常\"", "广论所破\"支那堪布\"妄计弃观慧、全不作意即修甚深法义的邪见"],answer:3,explanation:"✅ 答案是D。边界在\"无念即道滑向支那堪布之辨\"：广论卷14/16明言支那堪布\"谤观慧、用足毁踏\"\"弃观慧全不作意乃为修习甚深法义\"，此正邪见；止本身\"是内外道二所共同\"，不判内外道，判在有无无我正见摄持——光有\"无念\"只是止，非修甚深空义。口诀：无念非道，止观并修。"},{stem:"若要精确表述\"剑禅一如\"里的\"禅\"，它与广论止观体系的正确关系应是哪一项？",options:["剑禅的\"禅\"高于毗钵舍那", "剑禅的\"禅\"落在功能层的专注任运（近于\"止\"的等持熟练），而非见地层的无我空性", "剑禅的\"禅\"落在见地层，已证无我空性", "剑禅的\"禅\"即广论所破的无念邪修"],answer:1,explanation:"✅ 答案是B。边界在\"功能层与见地层\"：武藏\"剑人合一\"\"任运无功用\"对应的是\"止\"的等持熟练（第九住心无功用运转），属于专注任运的功能层；而广论\"观\"的更深处是无我空性正见——二者相似在境界功能，不同在见地（有无无我正知），故不能把剑境的\"无心\"拔高为证悟空性，也不等于被破的无念邪修。口诀：剑禅近止，非见空性。"}]},
{name:"禅宗与道家×广论止观",author:"南怀瑾",questions:[{stem:"读南怀瑾《禅宗与道家》，其中反复强调\"禅宗虽然不离于禅定的修证，但并不就是禅定\"。若以广论止观章的判摄框架来理解这句话，禅定（止）在佛法中的真实地位应当是？",options:["禅定与禅宗同义，修定即是明心见性", "禅定是内外道共法，其价值取决于有无无我正见的摄持", "禅定是佛法不共法，得定即达解脱", "禅定属鬼神迷信，应予完全排斥"],answer:1,explanation:"✅ 答案是B。南师明言\"禅定是佛法与世间各宗教、各哲学学派，甚至一般普通习静人的共法，并不是佛法特创的不共法\"；广论卷16亦谓\"此定是内外道二所共同\"，止本身不判内外道，判在有无无我正见。把得定当通达佛法不共，或把禅宗等同最高级的坐禅，都错在以止代慧。口诀：定是共法不判道，见地摄持始为高。"},{stem:"达摩付法慧可\"以《楞伽经》印心\"，五祖弘忍则\"教人念诵《金刚经》\"，弟子以此为一\"教授法改变\"的公案。按南师的判断，这一从《楞伽》到《金刚》的演变，其本质是？",options:["仅为教授法的改变，宗旨并无二致", "禅宗教旨的彻底改变，从渐修转为顿悟", "证明六祖以前禅宗应另立\"楞伽宗\"", "禅宗从此废弃经教、只靠心印单传"],answer:0,explanation:"✅ 答案是A。原书明言\"这只能说是教授法的改变，对于禅宗的宗旨，并无二致\"；《金刚经》以\"善护念\"三字为重点，以\"过去心不可得、未来心不可得、现在心不可得\"说明性空实相。南师并斥\"六祖以前禅宗名楞伽宗\"之说为\"画蛇添足\"。印心经典是方便之变，不是宗旨之变，更非废经教。口诀：印心经典可变，宗旨不变一线牵。"},{stem:"二祖慧可求安心，达摩说\"你把心找出来，我便为你安心\"，慧可怔住良久，方说\"觅心了不可得\"，达摩印可\"这便是你安心的法门\"。这段公案的关键处，南师特别点明的核心是？",options:["\"诸佛心法，非从人得\"——直指人心、不假外求", "安心就是什么都不想、压住念头", "心本不存在，断灭即道", "安心就是找到一个稳定清净的心境"],answer:0,explanation:"✅ 答案是A。原书在达摩\"诸佛心法，并不是从别人那里得到的\"一句后括注\"注意，这句话是禅宗最重要的关键\"。慧可\"觅心了不可得\"而安心，正是直指人心的示范，而非\"心不存在\"的断见，也不是造作一个清净心境或压制念头。口诀：觅心了不可得，安心原非外得。"},{stem:"五祖门下呈偈，神秀作\"身是菩提树……时时勤拂拭\"，六祖作\"菩提本无树……本来无一物，何处惹尘埃\"。南师对这两偈与传衣关系的判摄，最准确的是？",options:["\"本来无一物\"仍未达传衣造诣，大悟在\"何期自性……能生万法\"之后", "\"本来无一物\"一偈即已究竟，当即传衣", "两偈皆属口头禅，皆不足取", "神秀偈毫无工夫价值，可以全盘抹杀"],answer:0,explanation:"✅ 答案是A。原书谓\"本来无一物\"如\"雪月梅花的境界\"，\"到底是空寂孤寒的一面，毫无生机存在\"，尚非传衣之境；六祖大彻悟在五祖征诘\"应无所住而生其心\"后说\"何期自性本自清净……能生万法\"，且悟后仍避居猎人队十五年\"由悟后而修持\"。并引《楞严经》\"理须顿悟，乘悟并销；事资渐修，因次第尽\"，明禅宗顿渐并兼。口诀：空寂孤寒非究竟，能生万法是真境。"},{stem:"六祖对惠明说\"不思善、不思恶\"后（原文记载\"明，良久\"），方问\"那个是明上座本来面目\"。南师反复提醒，\"那个\"二字与那一段\"良久\"该如何理解？",options:["\"那个\"是质问辞，那段无念空白不是心性本体", "\"良久\"是衍文，应当删去不必理会", "\"那个\"是肯定辞，无念空白正是本来面目", "不思善恶的空白状态即是见性成就"],answer:0,explanation:"✅ 答案是A。原书明言\"那个不是肯定辞，而是质问的辞句\"，并反诘：若无善无恶便是心性之体，\"白痴的人，与丧失思维意识的心理病者……都可算做禅的境界吗\"。那段空白至多是禅宗初悟的开端，非心性本体。此与广论卷16警戒的\"无分别光明误认\"同一血脉：把无念空白当本体，正是误认。口诀：莫把空白当本体，良久非性问中觅。"},{stem:"六祖初出山时，两僧争论\"风动还是幡动\"，六祖说\"不是风动，不是幡动，是仁者心动\"。按南师的判摄，这一公案的性质是？",options:["只是讲\"境风吹识浪\"依他起之理的机锋妙语，非明心见性法要", "纯粹是幽默讽刺的俏皮话，毫无实义", "已明心见性、直示圆成实性的心性法要", "证明心外无物、万法唯心造的究竟了义"],answer:0,explanation:"✅ 答案是A。原书谓此\"只是后来禅宗所谓的机锋，也就是机会教授法的一种妙语，并不就是禅宗指示明心见性的法要\"，讲的是\"境风吹识浪\"的\"依他起\"之理，并非\"圆成实性\"的心性之体；\"如果把风幡案中的是仁者心动当作已了解禅宗心法，那真与禅有十万八千里\"。口诀：风幡心动依他起，非是圆成心性底。"},{stem:"马祖道一坐禅求作佛，南岳怀让禅师在他庵前取砖磨之，马祖问\"磨砖岂得成镜\"，怀让答\"磨砖既不成镜，坐禅岂得作佛\"。此公案要破斥的偏执是？",options:["把定相当佛、执著长坐不动即是道", "磨砖真能成镜，只是马祖功力未到", "坐禅完全无用，应当弃定专修慧", "坐禅是外道之法，禅宗绝不坐禅"],answer:0,explanation:"✅ 答案是A。怀让明言\"若学坐佛，佛并非有个定相\"，执著长坐不动的定相便是佛法，实在未明其理。磨砖喻所破的是\"以定相为佛\"的执，而非否定禅定本身——南师仍强调禅宗\"仍然不离以禅定修行求证的方法为基础\"，工夫与见地\"犹如鸟的两翼，车的双轮，缺一不可\"。口诀：磨砖不成镜，坐佛无定相。"},{stem:"宋代惟政禅师自述参禅三阶段：\"见山是山→见山不是山→见山只是山\"。后世多把第二阶段当开悟标尺，南师对\"见山不是山\"的判摄是？",options:["这是百分之百真实禅定工夫的境界，但\"与道毫不相干\"", "这就是见性大悟的\"重关\"", "这只是大病将死、视力涣散的虚弱现象", "这是唯一正确的禅宗三关划分标准"],answer:0,explanation:"✅ 答案是A。原书判\"见山不是山、见水不是水\"是\"百分之百，的的确确是真实用过禅定工夫的境界\"（身心气质变化、神凝气聚、万物如浮光掠影），但\"这种境界，与道毫不相干\"，仍是\"生理器官的感觉不同……还是你的意识思维的作用\"，若执为道，\"你还不如吃一粒L.S.D.\"。张紫阳\"顶后有光犹是幻，云生足下未为仙\"同此警示。口诀：见山不是山，定境非是道。"},{stem:"【对照】南师判\"禅定是共法\"，并引《楞严经》\"现前纵得九次第定，仍为法尘分别影事\"证之。这一判摄与广论哪一处的讲法完全同义？",options:["卷14灯烛喻——止观必须双修", "卷17——正见须依龙猛中观求通达", "卷24\"东门有鬼，西门送俑\"——所破须对准我执", "卷16\"此定是内外道二所共同\"——外道诸仙亦依此离欲"],answer:3,explanation:"✅ 答案是D。广论卷16明言：得第九住心无分别安乐光明者多有误认，而\"此定是内外道二所共同，外道诸仙亦依此离欲\"——止本身不判内外道，判在有无无我正见与出离心、菩提心摄持。与南师\"禅定是共法\"跨九百年一致：定的归属不在定本身，而在见地是否摄持。相通处在判准同一。口诀：定无内外唯共法，见地摄持方判家。"},{stem:"【对照】南师释\"教外别传\"说：\"教，是教导你如何修行证果；宗，是我要如何求证修行。宗与教，只在教导方法上的不同，并不是目的有两样。\"这一立场与广论的哪一原则相通？",options:["广论判定禅宗为叛经离教的异端", "广论主张一切依禅定神通、不依文字", "广论以闻思经论引发正见为观必不可少之正因资粮", "广论主张离教直证、不立闻思"],answer:2,explanation:"✅ 答案是C。南师力陈\"教外别传\"并非\"在所有的教理以外，另有一个秘密心印的传授\"，达摩印心仍用《楞伽》，并留名言\"通宗不通教，开口便乱道\"；广论卷17谓\"听闻无垢清净经论，由闻思慧引发通达真实正见，是必不可少毗钵舍那正因资粮\"。相通处在：闻思经教是共同的眼目，悟不废教。口诀：宗不离教教为眼，闻思正见是资粮。"},{stem:"【对照】六祖大悟说\"何期自性，本自清净；何期自性，本自具足；何期自性，能生万法\"。这种\"自性本净\"的肯定式表述，对照广论卷18抉择空性正见的框架，应如何判摄？",options:["与\"空性即无自性\"的遮遣正见完全等同，可直接互换", "属于\"自性有\"的增益执，等同外道见，应予全破", "纯属凡夫分别妄想，没有任何修行价值", "属\"心性本净、客尘所染\"的功能层指示，非\"自性有\"的实体执，与遮遣正见语脉不同而可互证"],answer:3,explanation:"✅ 答案是D。禅宗的\"自性/真如妙心\"是\"即体\"的方便指示——指\"宇宙同根，万物一体的真如全体妙心\"，非人我意识思维之心；广论重心在\"破自性有、达无我\"的遮遣（卷18所破太宽太狭之辨）。相通处在功能层：都指心性本净、客尘不染的清净基；边界在表述与落点：一是即体肯定的指示，一是遮遣增益的所破。口诀：本净是基非实体，即体遮遣两条脉。"},{stem:"【对照】怀让\"磨砖既不成镜，坐禅岂得作佛\"之辨，与广论卷16哪一论断直接呼应？",options:["\"任如何修此三摩地，尚不能断欲界烦恼，故当更修毗钵舍那\"", "九住心第六\"寂静\"须观散乱过失", "修止资粮须住随顺处、少欲知足", "身八法要求舌抵上齿、息徐徐而转"],answer:0,explanation:"✅ 答案是A。磨砖喻破的是\"单以坐禅之止为究竟\"；广论卷16明言任如何修此三摩地尚不能断欲界烦恼，况尽断一切烦恼，故当更修毗钵舍那——只修止不成果，须以观慧断惑。二者同斥\"得定即证果\"的执。相通处在止不究竟、观为断惑之钥。口诀：磨砖不成镜，单止不成果，断惑须观慧。"},{stem:"【对照】南师勘验\"见山不是山\"定境：\"真实用过禅定工夫的境界\"，却\"与道毫不相干\"。广论对同类\"禅病误认\"的勘验标准是？",options:["卷24：\"心境二相粗分皆灭，如净虚空……如虹如薄烟……然非获得通达无二真实正见\"", "得第九住心有安乐光明，即等同无上瑜伽圆满次第", "只要住于无分别光明，烦恼便已断尽", "止观双运本身即是已见空性的充分证明"],answer:0,explanation:"✅ 答案是A。广论卷16警戒：得第九住心无分别安乐光明者，\"误为已生根本后得共相合糅无分别智，甚至误为无上瑜伽圆满次第\"；卷24更明\"心境二相粗分皆灭，如净虚空……意识所现内外诸相皆觉如虹或如薄烟……然非获得通达无二真实正见\"。与南师\"顶后有光犹是幻\"是同一警示的两造表述：定的澄明觉受不等于证悟。相通处在同斥以觉受代见地。口诀：光明澄澈非见性，误认定境是通病。"},{stem:"【对照】老子\"致虚极，守静笃\"只是\"入手立基\"，庄子\"心斋、坐忘\"是\"养神合道\"，道教《清静经》言\"内观其心，心无其心……湛然常寂\"。对照广论对外道定的判摄，道家清静境界的定位应是？",options:["道家清静是外道邪法，应予彻底否定", "属共法静定层，可\"入道\"而非\"即此是道\"，尚非无我正见", "道家清静与佛教禅定毫无共通之处", "道家清静即见性成佛、即是圆成实性"],answer:1,explanation:"✅ 答案是B。南师借五祖语意评《清静经》：\"后世依此修行，亦可以入道矣\"——是\"可以入道\"而非\"即此是道\"。道家清静与禅定同属共法静定层（近广论之止），未及\"见性/无我正见\"的不共层（广论之观，判在有无无我正见）。相通处在同属静定共法、广论亦许外道依此离欲；边界在无我正见之有无。口诀：清静可入道，非即就是道，判摄看正见。"},{stem:"【对照】南师判\"长庆坐破七个蒲团\"\"灵云三十年寻剑客\"皆重工夫，而法融\"百鸟衔花\"是\"忘机忘我\"仍\"只欠一悟\"。这与广论卷16对第九住心\"等持无功用任运而转\"的定位，相通处在？",options:["两者都主张必须先经历神通异象才算得定", "两者都把任运熟练当作证悟的最终判据", "忘我、任运、无功用是止的熟练而非断惑之观——熟练境界不判道", "两者都认为长期苦功必然开悟，工夫即见地"],answer:2,explanation:"✅ 答案是C。南师判百鸟衔花只是\"忘机忘我\"的深厚定境与功德，\"只欠一悟\"；广论卷16九住心之九\"等持无功用任运而转\"，以读书喻明\"熟练任运\"不是证悟，且\"任如何修此三摩地，尚不能断欲界烦恼\"。相通处在：忘我、任运、无功用的境界属止的等至熟练，不是断惑之观。口诀：任运熟练是止功，断惑仍须观慧锋。"},{stem:"【辨析】禅宗标榜\"不立文字、教外别传\"，广论则严申\"依了义经、依定量释论\"（卷17，佛授记龙猛，应依中观论求通达空性）。二者之间的张力与会通，最准确的理解是？",options:["\"不立文字\"与依了义经水火不容，绝无会通可能", "\"不立文字\"是扫荡执著文字名相的方便而非废经教——释迦\"在说过无数的经典以后\"才提此家风，与\"依了义经\"可以会通", "二者根本对立，禅宗从本质上就是不要经教", "广论全面否定了禅宗的教法传统"],answer:1,explanation:"✅ 答案是B。相通处在：双方都反对把文字当究竟、也反对离教瞎练。边界在：禅宗以扫执为家风，是\"对全般教理求得实证的教授法\"；广论以防错为轨则，以了义经与定量释论抉择正见，恐学人离教而證。南师点出释迦先说法四十九年、后才拈花示\"不立文字\"，正是对\"不立文字即废经教\"的有力反拨。口诀：不立文字扫执著，依了义经防离教。"},{stem:"【辨析】禅门所斥的\"狂禅/口头禅\"（抓住一句\"本来无一物\"便\"无所而不可为\"），与广论卷14/16所破的\"支那堪布\"（\"妄计一切分别皆执实相，要弃观慧全不作意\"），二者的病与药是？",options:["同属离言废修之病——一个弃工夫见地只逞口头，一个弃观察慧全不作意；而药不同——一以\"工夫见地并重\"对治，一以辨析\"无分别有二种\"对治", "同一病同一药，狂禅就是支那堪布教法的翻版", "完全不同的两种病，毫无可比之处", "狂禅是证悟后的自在，支那堪布是正确的修法，均无可破"],answer:0,explanation:"✅ 答案是A。相通处在病同：都是\"离言废修\"——狂禅以空话代实证，支那堪布以不作意废观慧。边界在药异：禅门以\"没有工夫的见地，便是狂慧妄想；没有见地的工夫，便是心外求法的外道禅\"双遣对治；广论则以\"无分别有二种\"（修空之无分别与于空性全未悟解之无分别）精细辨析，明\"凡无分别皆是修甚深空义毗钵舍那\"是纯粹支那堪布修法。口诀：同病离言废观修，药异工夫与抉择。"},{stem:"【辨析】南师整体取\"儒释道三教会通\"的立场（东方圣人、西方圣人，此心同此理同），对老子\"道德即禅境\"抱同情；广论则以\"清净见/无我正见\"为眼目，依龙猛中观应成抉择了不了义。两种旨趣的根本差异是？",options:["南师暗中否定佛法，广论一味贬斥道家", "两者都是只求同不辨异的圆融立场", "南师求\"同\"（会通），广论求\"辨\"（判摄）——以无我正为了不了义的试金石", "两者都是唯我独尊、排斥他家的立场"],answer:2,explanation:"✅ 答案是C。相通处在：南师可把\"清静/无为\"与止并观，广论亦许外道共此离欲之定——都承认静定的共法价值。边界在：南师以会通为旨趣，三教\"此心同此理同\"；广论以判摄为眼目，必追问\"道\"是否为\"自性有\"之外道见，以无我正见为内道判准（卷16判在有无无我正见，卷17依龙猛中观）。一求同、一求辨，不可互相取代。口诀：会通求同判摄辨，无我正见是试金。"},{stem:"【辨析】惟政\"见山三阶段\"被后世附会为\"三关\"标尺，南师却提醒：这是禅师\"一个人用功的经验谈\"，\"还是只对工夫方面而言，并不完全关于悟道的见地\"。这一\"阶段合法性\"的提醒，与广论对定境的定位，最相通的是？",options:["定境阶段纯属虚构，应当全部否定", "\"三关\"就是九住心，可以一一对应", "见山三阶段即是止观双运的三重验收标准", "\"见山不是山\"的定境有真实工夫价值，但不能当作见性之证——定境合法而不越界"],answer:3,explanation:"✅ 答案是D。相通处在\"阶段合法性\"的边界划定：南师给\"见山不是山\"以\"真实用过禅定工夫\"的合法地位，同时严判它与道不相干，须再引南泉\"有人看目前一株花，如梦中相似\"方近末后撒手；广论亦许九住心、光明、任运为真工夫，却以\"非获得通达无二真实正见\"（卷24）严定其非证悟。边界在：两者都非全盘否定定境，而是\"合法不过界\"。口诀：定境合法不过界，工夫是基见地别。"},{stem:"【辨析】南师强调禅宗\"明心见性\"之\"心\"是\"宇宙同根，万物一体的真如全体的妙心\"，\"并非是指这个人我意识思维分别作用的心\"；广论修观则重在抉择\"无我\"、破\"自性有\"（卷18所破界限）。关于\"心/自性\"的判摄，最须谨慎的差异是？",options:["禅宗的\"心\"就是广论要破的所破，二者完全对立", "二者所指的是毫不相干的两个对象，无任何关联", "广论所说的\"心\"即指意识思维分别之心", "禅宗\"一心/自性\"是\"即体\"的指示，广论\"无我\"是遮遣的正见，语脉不同、不可抹平为同一"],answer:3,explanation:"✅ 答案是D。相通处在：都指向超越意识思维分别的究竟，都不许把\"思维意识的心\"当作心性本体。边界在：禅宗多\"全体即性、即妄即真\"的肯定式表述（本自具足、能生万法），是\"即体\"的指示；广论重心在\"破自性有、离增益执\"的遮遣，\"自性有\"正是所破。同属佛法而语脉有别，把两者压缩为同一，或判为一正一邪，都失其真。口诀：禅宗即体说自性，广论遮遣破增益。"}]},
