{name:"禅海蠡测×广论止观",author:"南怀瑾",questions:[{stem:"南怀瑾开宗明义指出，禅宗常被误作\"禅定之旨\"，实则其立宗之本是\"佛之心宗\"。据此，他对\"禅定\"这一法门的定位应是",options:["禅定是佛法最高极则，舍此无他", "禅定的深浅可直接判别内外道高下", "禅定与禅宗毫无关联，可尽弃之", "禅定是世间出世间凡夫外道的共法，佛法不共处在中道正见"],answer:3,explanation:"✅ 答案是D。南师明言\"禅定为世间、出世间、凡夫、外道之共法，佛法虽不离于禅定，而亦不依于禅定；佛之不共法，为缘起性空、性空缘起与实相无相之中道正知正见\"。此为定\"共法\"而\"悟须眼目\"的根本判，与广论卷14灯烛喻\"无通达实性妙慧，是离能见实性之眼\"同构。口诀：定为共法不判人，正见眼目方别真。"},{stem:"九峰道虔公案中，首座焚香未断而坐脱立亡，九峰抚座背判曰\"坐脱立亡即不无，先师意未梦见在\"。此判的用意是",options:["首座修行完全无功", "坐脱立亡只是工夫行履边事，与见地透脱是两回事", "凡能坐化者必已明心见性", "坐化舍利是见性透脱的可靠证据"],answer:1,explanation:"✅ 答案是B。原案\"师抚座背曰：坐脱立亡即不无，先师意未梦见在\"，南师阐发\"纵饶坐脱立亡于指顾之间，亦只许其修行得力；必论见地透彻，犹有事焉\"，并云\"定与不定，皆行履中事耳\"、能坐脱立亡\"皆为外学矣\"。工用（工夫）不等于见地，这正是\"定不即悟\"的宗门立场。口诀：坐脱立亡是行履，见地透脱另须论。"},{stem:"南师以饮茶解渴设喻，区分\"知解\"\"体会\"\"证悟\"三者。依此喻，真正的\"证悟\"对应的是",options:["知行合一地练习饮水动作", "听说水能解渴而生起确信", "取水而饮，饮毕渴解，所有水之与渴，理事全消", "反复思量解渴之理"],answer:2,explanation:"✅ 答案是C。南师谓知解乃\"未饮茶者，因此悟知\"水能解渴；体会为\"知行合一、行解相应\"；证悟乃\"取水而饮，饮毕渴解，所有水之与渴，理事全消\"的顿超实验，即\"言语道断，心行处灭\"。他还明辨\"体会为知行合一……非证悟也\"。口诀：知解是听闻，体会是行合，证悟是渴解两亡。"},{stem:"关于\"顿悟\"与\"渐修\"的关系，南师的判断是（原文：\"顿者，指渐修之最后一刹那也\"）",options:["言下顿悟者必无宿根积累", "顿悟可脱离一切宿薰与渐修而凭空独存", "禅宗以顿悟为名，实则否定渐修", "顿是渐修的最后一刹那，不可只执一时之顿而置前后于不顾"],answer:3,explanation:"✅ 答案是D。南师明言\"所称顿悟证得者，实自渐修而来，顿者，指渐修之最后一刹那也\"，且强调\"未可只执彼当时一顿，置未顿以前、既顿以后一概不言\"，顿前皆用功有年、顿后皆保任多年。这与\"理则顿悟，乘悟并销；事非顿除，因次第尽\"一脉相通。口诀：顿是渐修终刹那，前后工夫不可省。"},{stem:"南师判\"祖师禅\"与\"如来禅\"之别，其核心立论是（他斥\"若谓祖师禅乃顿悟，如来禅乃渐修者，为相似而非实\"）",options:["如来禅高于祖师禅", "祖师禅是顿法，如来禅是渐法", "祖师禅背弃一切经教", "二者非顿渐之分，而是\"有修证迹\"与\"扫尽悟迹\"之别"],answer:3,explanation:"✅ 答案是D。南师谓\"若谓祖师禅乃顿悟，如来禅乃渐修者，相似而实非之言也\"；如来禅由凡夫依经论起修渐入圣众（罗什初传、天台至极），祖师禅则\"不待修证\"\"本未曾迷，云何说悟\"，扫却法见佛见众生见悟见禅见。是\"理入顿悟\"与\"事上渐修\"的宗门表达，非快慢之别。口诀：祖师如来非快慢，有迹无迹判两门。"},{stem:"南师将\"理入\"对应\"知解门\"（先穷理终至于道），\"行入\"对应\"证悟门\"（行修事至为首），并警示\"狂慧\"之危。此\"狂慧\"在经中又称",options:["偏空慧", "乾慧（无定水灌溉之空慧）", "后得智", "闻思慧"],answer:1,explanation:"✅ 答案是B。南师屡斥\"狂慧勃发，不得定力灌溉，郎当颠狂\"，并注\"狂慧者，即教理所说之乾慧，见《楞严》《楞伽》等经\"。乾慧即无定水滋润的干枯空慧，须藉定水灌溉方能免于狂荡。此与广论\"惟观离止如风中烛，不生明了智慧光明\"之警同向。口诀：知见无定是乾慧，风中烛火不坚住。"},{stem:"学人参久之后\"心光透发，三际空悬\"，乃至\"眼通进发，彻见山河大地如琉璃\"。南师对此的定性是",options:["皆\"光影焕发，孤光偶露\"，是念体忽空的微细妄念，执之即禅病", "此是定慧圆明的究竟果德", "此即明心见性的证量标志", "此乃究竟解脱的必经次第"],answer:0,explanation:"✅ 答案是A。南师明判\"此乃用心致力既久，念体忽空，光影焕发，孤光偶露也\"，并云\"若有光明影像，乃至喜笑悲啼、吟诗作偈等，皆为妄念所生，唯微细难察耳\"\"苟无妄念，谁起觉受见闻耶\"。光明、神通、诗偈皆光影门头事，执即入魔，须\"觌面不觑，更令放下\"。口诀：心光透发是光影，孤光偶露勿认真。"},{stem:"关于\"参话头\"一法在禅宗史上的位置，南师的判断是（原文：\"参话头之学兴，禅宗真面目灭矣\"）",options:["参话头是禅门衰落后救弊继起的踵事之法，非本有之真面目", "参话头之兴起是禅宗全盛之征", "参话头与经文教理完全等同", "参话头是禅宗本有的根本法门"],answer:0,explanation:"✅ 答案是A。南师历数唐宋诸师\"如空手夺刃，于言语动作间立断学者情根意识\"的直指，至\"中峰以后，参话头之学于是大行；初则救诸狂禅之弊，继则立橛实地，千古难拔\"，故叹\"参话头之学兴，禅宗真面目灭矣\"。话头分\"有义味语\"与\"无义味语\"两类，乃变通方便而非本有。口诀：话头本为救弊起，真面不在话头中。"},{stem:"南师详述毗卢遮那佛七支坐法（双跏趺、结印、脊直、肩平、头正颚收、舌抵上颚、两目半敛），其态度是",options:["禅宗完全不讲坐法与气脉", "禅坐姿势暗摄气脉之理，但若专修气脉则身见我执难去、反为正觉之碍", "纯为身体锻炼，与心法无关", "必须单修气脉方能成佛"],answer:1,explanation:"✅ 答案是B。南师谓\"禅坐姿势，皆有关于气脉，虽不专言调和气脉，而已存摄于其中\"，但又警示\"若专修气脉，身见历然，我执难去，反为正觉之碍矣\"。坐法含摄气脉而不可执气脉为究竟。口诀：七支坐法摄气脉，专修气脉反成碍。"},{stem:"南师解释禅定中魔境的成因是\"六根六尘磨荡，引发心气之抟击，如石击火，发此光影\"。据此，魔境的本质是",options:["无法对治、只能终身躲避", "根尘磨荡所生的光影觉受，执实即忘失本心、成魔", "外来的实有魔障，与自心无关", "必然意味着修行彻底失败"],answer:1,explanation:"✅ 答案是B。南师谓魔境\"皆为六根六尘磨荡，引发心气之抟击……若执为实，或自谓已得胜法，则忘失本心，执著成魔矣\"，又曰\"以定为止境者，如履黑夜，最易落险；魔外分途，正在于此\"。魔非外来，乃光影之执。对治在\"此心坚定，不忘本念，不起爱怖\"，观诸相虚妄。口诀：魔境本是心气拟，执实方堕魔道中。"},{stem:"为证\"定是共法\"，南师列举科学家专注精研、理学家\"思入风云变幻中\"、宗教家祈祷存想乃至画符咒术、催眠瑜伽，皆得\"专一境性\"之功。其论证的落点是",options:["定之功用本身不依于知与不知深浅差别而存在", "定因其深微故应为佛法独占之学", "佛法之定与外道之定在功用上无有差别", "外道诸派皆已证得无我正见"],answer:0,explanation:"✅ 答案是A。南师总结\"定为一切共法，非独家之学；凡外诸道虽不明定理，或不知定之深微差别理趣，而于定之功用，并不依赖于知与不知间也\"。意思是定力的工用中性，不因是否通达深理而有损，故凡外皆可得；但\"得定之深浅非判内外道之准\"——判准在有无无我正见。口诀：定力功用本中性，正见有无才分途。"},{stem:"疑情过猛、参究急切，最易招致的禅病是",options:["呕血、发狂等身心之病，须放松此念、调摄此身", "直接证得实相", "定力自然增长", "见地越发透脱"],answer:0,explanation:"✅ 答案是A。南师直言疑情过猛\"易得禅病，或至呕血，或至发狂\"，对治是\"放松此念，调摄此身，教令自在，亦可稍放此心\"；并举例新得法空者\"多喜悦，或致乱，令熟寐\"。又曰生病时切忌著力。口诀：疑情太猛成禅病，放松调摄是良医。"},{stem:"南师给\"定\"下了一个双非双是的判词，即",options:["心念全灭，一念不生", "空空洞洞，什么都没有", "不散乱又不昏沉，惺惺而复寂寂，寂寂而亦惺惺", "唯余光明，别无影像"],answer:2,explanation:"✅ 答案是C。南师定判\"不散乱，又不昏沉，惺惺而复寂寂，寂寂而亦惺惺，定也\"，并引宗喀巴警语\"若认此种昏沉为定，命终堕入畜生道，可不慎哉\"。定非顽空、非昏沉、非无念，而是明寂双照。此与广论卷15\"两殊胜\"（明显分+安住分）高度一致。口诀：惺惺寂寂两相成，单一无念即是偏。"},{stem:"南师在\"禅定之学\"正文中直接称引《菩提道次第广论》，说它\"依中观法行而立奢摩他(止)、毗钵舍那(观)之宗，方便虽多，归于一致\"。此说在印证两书关系时，其正确读法是",options:["证明南师弃禅宗而改宗格鲁派", "证明南师排斥一切藏密与广论", "证明广论与禅宗二者判教本位完全等同", "表明止观与禅定同源异名，南师以广论会通禅定之学"],answer:3,explanation:"✅ 答案是D。南师虽入康藏、极重密法，仍以禅宗正法眼藏凌驾密宗，但在论禅定之学时会通广论止观，示\"同源异名\"之一致。然而其判教本位是祖师禅极则，广论以中观应成见为极则，二者\"谁最高了义\"的判断南辕北辙，不可混同。口诀：止观禅定同源流，判教本位各不同。"},{stem:"一侧是南师\"定共凡外，悟须眼目\"，一侧是广论卷16\"此定是内外道二所共同\"。两书在这一判断上的关系是",options:["深度同构——都认定本身中性、判在有无无我正见", "广论否定禅定", "南师高于广论", "截然对立"],answer:0,explanation:"✅ 答案是A。相通处在：南师谓定为凡外共法、佛法\"不依于禅定\"而依\"缘起性空\"之中道正见，点名\"正法眼藏\"之\"眼目\"；广论卷16明言止\"是内外道二所共同（外道诸仙亦依此离欲）\"，断惑须观、判在\"有无无我正见+出离心菩提心摄持\"，灯烛喻中点\"能见实性之眼\"。两者意象都落在\"眼\"上，可互为注脚。口诀：专注本身无兼出，正见眼目判邪真。"},{stem:"南师\"魔境皆光影觉受，执实即魔\"与广论卷24\"如虹如烟觉受非证空\"，二者的相通处是",options:["两者对此问题的看法毫无交集", "都主张定中光明影像、通力觉受可现而不可执，判准在有无无性定解/正见", "都认为一切光明觉受即是证悟", "南师认为通力即解脱、广论认为通力即魔"],answer:1,explanation:"✅ 答案是B。相通处在：南师判\"心光透发\"\"眼通进发\"为\"光影焕发，孤光偶露\"，执即魔病；广论卷24指\"意识所现内外诸相皆觉如虹或如薄烟，然非获得通达无二真实正见\"。两书对\"定中光明、通力\"持同一态度——可现、不可执，执之即误，判准在有无正见，而不在觉受本身强弱。口诀：光影可现不可执，背心尺度在正见。"},{stem:"南师\"顿是渐的最后一刹那\"\"尽一大藏教皆渐法\"与广论\"先止后观、次第决定（卷14）、观须闻思修引发正见（卷17）\"的印证，其相通处在",options:["都强调不可废渐修、不可只凭顿悟，只是南师落于宗门薰修保任、广论结构为止观次第", "南师否定次第、广论否定顿悟", "都主张可以只凭口头顿悟、不需任何渐修", "两者都认为渐修与顿悟对立"],answer:0,explanation:"✅ 答案是A。相通处在：南师力破\"只执当时一顿\"，明\"顿乃渐修最后一刹那\"\"皆渐法耳\"，并引《楞严》\"理则顿悟，乘悟并销；事非顿除，因次第尽\"；广论卷14立\"先止后观、次第决定\"，卷17谓\"由闻思慧引发通达真实正见，是必不可少毗钵舍那正因资粮\"。二者在\"不可废渐、不可口头顿\"上高度一致。边界在：广论把渐结构为止观次第与闻思修，南师把渐落在宗门\"薰修、保任、长养\"的工夫叙事。口诀：两书同斥口头顿，渐门一化次第叙。"},{stem:"南师对轻安的描述（初禅\"先发轻安\"\"顶上微生清凉，贯及全身\"）与广论\"起身轻安及心轻安，是名奢摩他\"的关系是",options:["两者以\"轻安\"为得定之量的判据相合，且都严防把澄静昏沉光影误认为高证", "南师以轻安为最高究竟、广论以轻安为初机", "轻安是两书都否定的境界", "南师否认轻安、广论肯定轻安"],answer:0,explanation:"✅ 答案是A。相通处在：南师详述轻安二途与后起气脉变化为得定之征，广论卷14《解深密经》判\"起身轻安及心轻安，是名奢摩他\"，卷16又辨\"得第九住心而无分别安乐光明者，多有误认\"，严防\"误为已生根本后得共相合糅无分别智\"。两书都以轻安为得止之量、都防误认。边界在：南师的勘验落在宗门明眼宗师与保任，广论的勘验落在道次第所破界限与双运判准。口诀：轻安同作得定量，误认同防各有器。"},{stem:"南师引宗喀巴语\"若认此种昏沉为定，命终堕入畜生道\"，警示\"误认昏沉为定\"。广论对应此警示的是",options:["卷16辨\"得第九住心而无分别安乐光明者多有误认\"，故未得轻安\"尚不立为得奢摩他\"", "卷24认为昏沉即究竟解脱", "卷18认为昏沉即是空性", "卷14认为只要无念即是定"],answer:0,explanation:"✅ 答案是A。南师以\"惺惺而复寂寂，寂寂而亦惺惺\"为正定、斥\"认昏沉为定\"；广论卷16以\"轻安\"为得止之量，明言第九住心若无轻安\"尚不立为得奢摩他，何况能得毗钵舍那\"，并辨\"无分别安乐光明者多有误认\"。误认澄静、无分别觉受为高证，是两书共同严防的病。口诀：无念未必真奢摩，轻安为量防误认。"},{stem:"南师借雍正《悟真篇序》\"金丹大道，与乎禅宗圆顿之旨，皆已回互阐出而无余蕴\"，其对丹道、理学、三教的根本立场是",options:["以禅宗正法眼藏为本，融摄丹道理学，判其\"终入于禅\"", "三教各行其是、绝不相通", "以丹道为最高极则", "认为理学与佛法全然无涉"],answer:0,explanation:"✅ 答案是A。相通处在：两书都以\"正见为究竟眼目\"统摄诸法门。边界在：南师以\"祖师禅为佛之心宗、为极则\"自上而下融摄——判丹道\"终入于禅\"、理学\"出入佛老暗渡陈仓\"、三教归于宗门正见（\"回互阐出而无余蕴\"）；宗喀巴则以\"中观应成见为了义\"依龙猛判经判论、定所破界限。前者以\"见地透脱\"为尺度融摄三教归一，后者以\"正见无倒\"为尺度判释经论次第——二者都主\"定须眼目\"，而眼目所指与判教结构不同。口诀：三教归一归宗门，中观应成为正宗。"},{stem:"南师以宗门为本，判丹道\"终入于禅\"、密宗大手印\"迷封滞壳，摩挲光影，仍易滞于法执\"；宗喀巴则依龙猛中观求空性正见。两书在\"定须眼目（正见）\"这一点上是一致，但眼目所指的究竟不同。下列辨析正确的是",options:["两书判教最高判准完全相同，只是用词不同", "相通处在\"定须正见为眼目\"，边界在——南师之眼目是宗门\"见地透脱\"、广论之眼目是\"中观应成无倒正见\"", "南师以中观为极则、广论以禅宗为极则", "两书都认为禅宗与中观互斥"],answer:1,explanation:"✅ 答案是B。相通处在：南师借\"正法眼藏\"点名定须无我正见，广论以灯烛喻\"能见实性之眼\"点名须观须慧，两书都坚持\"定是工具、眼目在正见\"，此点完全一致。边界在：南师判教本位是祖师禅（判三教归禅），其\"眼目\"落在见地是否透脱（宗门眼目）；宗喀巴判教本位是中观应成见，\"眼目\"落在正见是否无倒（依龙猛观空性正见）。不能把\"禅为极则\"等同于\"中观为极则\"。口诀：定须眼目两书同，所执眼目禅应成。"},{stem:"南师对\"狂禅\"（狂慧勃发、郎当颠狂、无定灌溉）的批判与广论对\"支那堪布之辨\"（弃观慧全不作意、诽谤观察慧）的批判，二者的辨析正确的是",options:["边界在——南师防\"有狂无定\"（狂慧缺定水），广论防\"有止无观/弃观求无念\"（只止不观或诽谤观察慧）", "南师否定观慧、广论否定禅定", "两者针对同一病、用同一药", "两者都主\"无念即道\""],answer:0,explanation:"✅ 答案是A。相通处在：两书都反对把\"不思维、不作意、无念\"径直当作修道的究竟，都坚持须有正见/观察慧的灌溉或摄持。边界在：南师之病是\"有狂无定\"——无真参、无定力而狂慧勃发，其防险工具是\"明眼宗师勘验+久参薰修+保任\"；广论之病是\"有止无观/弃观求无念\"——支那堪布妄计生一切分别皆执实、要弃观慧全不作意，其防险工具是\"止观双运+所破界限+依龙猛\"。两者病的面向相反，药也不同。口诀：南防狂慧无定水，广防弃观堕无念。"},{stem:"南师\"能于弹指间坐脱立亡，或驻世不老，皆为外学矣\"之说，与广论卷16\"任如何修此三摩地，尚不能断欲界烦恼，故当更修毗钵舍那\"的相通与边界是",options:["两说都认为定本身可断一切烦恼", "两说毫无关联", "相通处在\"定不能至见性/断惑\"，边界在——南师以宗门眼目判工用不足、广论以道次第须更修观断惑", "南师认为坐脱立亡即断惑、广论否则"],answer:2,explanation:"✅ 答案是C。相通处在：两书都坚持\"定/工夫本身不能达成究极\"。南师谓坐脱立亡、驻世不老皆\"行履边事\"、皆\"外学\"（未见性之工用）；广论卷16谓修三摩地\"尚不能断欲界烦恼，况能尽断一切烦恼，故当更修毗钵舍那\"（世间道毗钵舍那只能暂伏，出世道才永断）。边界在：南师把\"不能究竟\"归为\"缺宗门见地透脱\"，广论把\"不能究竟\"归为\"缺观、须断惑\"。口诀：定与工用皆不足，南归见地广归观。"},{stem:"广论卷24\"东门有鬼，西门送俑\"喻，与南师对\"魔外皆从定中误入歧途\"\"以定为止境如履黑夜\"之判相印证，其相通处是",options:["广论主对治、南师主不治", "两者都认为定即是道", "相通处在\"修证的所破须对准烦恼/我执之所在，否则徒劳\"，南师点\"魔外误在执定为究竟\"，广论点\"于二我执毫无所损\"", "两者都主张随缘修一切不需对治"],answer:2,explanation:"✅ 答案是C。相通处在：两书都强调修行必须对准症结、不可错认对象。广论卷24以\"东门有鬼，西门送俑\"斥\"于二我执毫无所损\"之偏空；南师谓\"以定为止境者，如履黑夜，最易落险，魔外分途正在于此\"，皆示\"错认修证所破/所依\"即入歧途。边界在：南师所破之病是\"执定为究竟、执光影为实\"，广论所破之病是\"破错所破（未破自性却破显现，或破我执却修别处）\"。口诀：修证须对所破处，东门有鬼莫送俑。"},{stem:"关于\"正见\"（眼目）在通摄一切法门中的地位，南师与宗喀巴虽然都以\"正见\"为究竟依，但判教结构不同。下面对这一差异的辨识最准确的是",options:["两者都不承认正见为究竟依", "边界在——南师以\"祖师禅为极则\"做自上而下的融摄判教（三教归一），广论以\"中观应成见为了义\"做道次第的判教（依龙猛求空性正见）", "两书判教结构完全相同，只是术语不同", "南师以中观应成为判教、广论以禅宗为判教"],answer:1,explanation:"✅ 答案是B。相通处在：两书都以\"正见（眼目）\"为究竟依，都坚持\"定是中性工具、无正见摄持不能断惑见性\"。边界在：南师的判教学是\"祖师禅至上\"的单点极则统摄（判丹道密宗理学皆归禅、皆次第摄归心宗）；宗喀巴的判教学是\"中观应成见为了义\"的判经判论（依了不了义、依龙猛、定所破界限），是一套道次第的教判。前者以\"见地透脱\"为尺度融摄三教，后者以\"正见无倒\"为尺度判释经论。二者方向一致而结构各异。口诀：同以正见为究竟，禅极统摄对中观依。"}]},
{name:"禅定锻炼百句×广论止观",author:"佚名",questions:[{stem:"一位上班族请教\"禅定的总纲领到底是什么\"，他原以为要盘腿、闭眼、数息才叫修定。按本书开篇的定调，正确的回答应是——",options:["一切行事作务（包括打坐）念念分明", "制心一处，无事不办", "一念不生、心空如洗即是禅定", "静坐入定、心息一如方为定"],answer:0,explanation:"✅ 答案是A。原书首句即定调：\"禅定的锻炼，总纲领的一句话就是，一切行事作务（包括打坐）念念分明。\"这是一句贯串全书的纲领，把打坐只作为\"行事作务\"之一例，而非定的本质。总纲是念念分明的觉照，不是某一种姿势或状态。末句口诀：人在哪里心就在哪里，行住坐卧皆可修定。"},{stem:"有人坚持\"只有打坐才能锻炼禅定，不坐就没修\"。对照本书对静坐与修定关系的判断，下列哪一项最接近原书立场？",options:["静坐只是方式之一，日常摄心才是重要口诀", "静坐与日常摄心各占一半，不可偏废", "静坐是最胜所缘，日常摄心只是辅助", "静坐是最高也是唯一有效的修定方式"],answer:0,explanation:"✅ 答案是A。原书明言：\"静坐只是锻炼禅定的方式之一，并非唯一的；日常生活随时保持念念分明、摄心不放逸，才是重要的修定口诀。\"这题的关键在\"日常摄心才是口诀\"——静坐被下调为\"方式之一\"，真正被点名为\"口诀\"的是日常的念念分明、摄心不放逸。末句口诀：打坐只是修定的一个形式而已。"},{stem:"散心的人坐不住，稍有空档就想看手机、找人说话。按本书对\"散乱\"的界定，下列哪一项符合原意？",options:["散乱专指追悔已逝之事的心态焦虑", "散乱指念头纷飞、杂乱无章且不听指挥", "散乱等同于昏沉失神、忘失所缘", "散乱只是打坐时静不下来的现象"],answer:1,explanation:"✅ 答案是B。原书定义：\"'散乱'是指念头纷飞，不仅杂乱无章且不听指挥。散乱的人表现在心内的是东想西想无法自已；表现在行为上的则是静不下来非得东走西走、东看西看或者找人聊天不可。\"散乱是\"不听指挥\"的杂念，既不等同于昏沉，也不专指悔箭入心。末句口诀：散乱是念头纷飞、不听指挥。"},{stem:"初学者常以为\"昏沉\"就是打瞌睡、失神。按本书的界定，更宽泛也更关键的标准是什么？",options:["只要忘失自己正在做什么，就是昏沉", "只要闭眼即算昏沉", "只要失神、打瞌睡才叫昏沉", "只要念头散乱纷飞即是昏沉"],answer:0,explanation:"✅ 答案是A。原书明确指出：\"所谓昏沈，不是只有'失神'才是，只要忘失自己正在做什么，就是昏沉了。\"这个界定把昏沉从\"打瞌睡\"扩大为\"对当下所缘失去正知、忘失自己在做什么\"的一般性觉察断失，与散乱（念头纷飞）是两个不同的障碍轴。末句口诀：忘失自己在做什么，就是昏沉。"},{stem:"常有人自知\"明知道生气不好，却偏要生气\"。本书把这种\"知道而做不到\"的通病，归根于什么？",options:["知识不够深、读书太少", "定力即心力、意志力不强", "业障太重、宿业未消", "缘起正见未建立、缺少空观"],answer:1,explanation:"✅ 答案是B。原书写道：\"定力就是心力，也可说是意志力……明知道该怎么做，偏偏做不来……明知道生气不好，但时常是脾气发了才责备自己太冲动。这些都显示心的执行力不强。\"本段强调的正是\"知道而做不到\"源于心力、执行力（定力）不足，而非知识不够或单纯业障。末句口诀：定力就是心力，定力就是执行力。"},{stem:"有人问\"无漏定与有漏定，差别究竟在定中还是定外？\"按本书的判定，差别落在何处？",options:["定中深浅与定力久暂不同", "定中是否一念不生不同", "入定之前与出定之后的不同", "定中觉受是否轻安乐明不同"],answer:2,explanation:"✅ 答案是C。原书明言：\"无漏定与有漏定的明显差别，在入定之前和出定之后：无漏的禅定，入定之前已洞悉缘起无我，出定之后，也不会复生颠倒梦想；一般的禅定则在入定之前未得知见清净，出定之后也不明五蕴无我。\"差别在\"知见是否清净\"这一入定前的资粮与出定后的相续，而非定中状态本身。末句口诀：差别在入定之前和出定之后。"},{stem:"广论八断行以\"念\"治忘圣言、\"正知\"治沉掉不觉（骨架§二.7、§二.8）。本书的哪个核心短语，恰是这两支的通俗白话版？",options:["心一境性、制心一处", "念念分明、摄心不放逸", "一念不生、心空如洗", "倾宇宙之力活在眼前一瞬"],answer:1,explanation:"✅ 答案是B。相通处在：广论的\"念\"使心不忘失所缘、\"正知\"使沉昏掉举一现即觉，二者合起来正是\"警觉地守住所缘、及时察觉散失\"的功能；本书的\"念念分明\"\"摄心不放逸\"正是这一\"警觉不迷忘\"引擎的白话表达——一个偏\"明\"、一个偏\"摄\"，与念、正知若合符节。末句口诀：念念分明摄心不放逸，即是念与正知。"},{stem:"广论第九住心\"等持\"靠\"串习力\"达成无功用任运（骨架§二.8），并以\"读书喻\"说明串熟后任运不断。本书哪个论述与这一\"多串习则任运\"的逻辑同构？",options:["定已成根即形成定的串习力、惯性力", "打坐以三十分钟为限、以舒适为度", "修定先求无愧于心，否则成邪定", "每次打坐须像佛陀发坚固誓愿"],answer:0,explanation:"✅ 答案是A。相通处在：广论第九住心由\"串习力\"而使定境无功用任运，读书喻强调\"串熟则任运不断\"；本书\"定已成根即形成'业力'——形成定的串习力、定的惯性力。你要他散乱要他前瞻后顾都没办法\"正是把\"多串习→成惯性→不可逆\"的同一逻辑，从座上延展到全天的人格气质，方向完全一致。末句口诀：定已成根，串习成惯，欲散不得。"},{stem:"广论以\"心一境性\"为奢摩他定义（《宝云经》，骨架§二.1），并以九住心表\"执一境\"的渐次加深。本书的\"一心一境的个性\"\"制心一处\"与这套次第是什么关系？",options:["完全相同，只是换了白话说法", "方向相通，但无九住心的名相阶位", "互为取代，有了个性培养就不需住心次第", "根本相违，一主外修一主内证"],answer:1,explanation:"✅ 答案是B。相通处在：二者都把\"心专注一境\"当作定的核心，且都朝向\"由散到一、由勉强到任运\"的同一箭头；边界在：广论有内住→续住→安住→近住→调伏→寂静→最极寂静→专注一趣→等持九级可操作的次第与六力配住心，而本书把\"心一境性\"直接提升为\"人格气质\"（一心一境的个性），并无逐级名相，是方向同、刻度不同。末句口诀：一心一境与九住心，同一箭头不同刻度。"},{stem:"广论明列五过失中的\"沉掉（不觉）\"，并判\"昏沉伤明显分、掉举伤安住分\"（骨架§二.6）。本书与之对应的两大障碍及判断，最贴切的是——",options:["五欲贪着与宗教狂热", "散乱与昏沉两大障碍，昏沉即忘失自己在做什么", "走神与悔箭入心二者并列最障定", "前世业障与今生习气"],answer:1,explanation:"✅ 答案是B。相通处在：广论的\"沉\"伤明显、\"掉\"伤安住，恰对应本书\"散乱\"\"昏沈\"两大障碍的二分——散乱是\"念头纷飞、不听指挥\"（伤安住分），昏沈是\"忘失自己在做什么\"（伤明显分），且本书\"不动摇、不抖动\"的定界也呼应广论\"明显+安住\"两殊胜。注意：悔箭入心虽被单列为\"最障碍禅定\"，但它不属于散乱/昏沉的二分格局。末句口诀：散乱伤安住，昏沉伤明显。"},{stem:"广论六资粮含\"清净尸罗\"\"断除贪欲等恶寻思\"（骨架§二.4）；本书也要求\"修定先求干净动机\"。二者相通处在于——",options:["都认为外境清净决定定之深浅", "都主张资粮/动机清净是得\"止\"独立的充分条件", "都把内心的戒净、离贪、动机清净作为修定前行的资粮", "都强调神通感应是修定的必要验证"],answer:2,explanation:"✅ 答案是C。相通处在：广论\"清净尸罗、断除贪欲等恶寻思\"与本书\"欲修禅定，先求无愧于心\"\"不贪吃贪睡\"\"不执着从断贪开始\"、自省动机防\"邪定\"，都指向\"修定之前先净其心、先清其动机\"这一共同前置——定力不能建立在有愧、有染、有邪求的地基上。边界在：广论把资粮系统归为六种（随顺处、少欲、知足、断杂务、清净尸罗、断恶寻思），本书则散点为动机自省与离贪。末句口诀：欲修禅定，先求无愧于心。"},{stem:"广论以\"灯烛喻\"明止观双修——灯明亮无风扰动乃能明见诸像（骨架§二.2）。本书也引\"五度如盲，般若如眼；般若如眼，禅定如手足\"。两喻共同的喻义是——",options:["定决定慧、有定必生慧", "止与观地位相等、可以互相替代", "定与慧缺一不可、互为助成", "慧是修行唯一核心、定可有可无"],answer:2,explanation:"✅ 答案是C。相通处在：广论的\"灯（慧）需无风（止）方能明见\"与本书的\"眼（般若）需手足（禅定）方能成事\"，都在讲止观、定慧\"缺一不可、互为助成\"——一个是\"明亮+无风\"的显像喻，一个是\"眼+手足\"的成事喻，喻象不同而所指同一，即定是执行的力量、慧是眼目，单有其一不能成办。末句口诀：五度如盲，般若如眼；般若如眼，禅定如手足。"},{stem:"本书的\"一念不生/道共定\"以\"断我见（实在感）→散乱因素瓦解→自然无散乱\"立义，并强调\"没有再去另修一个禅定\"。这与广论对\"支那堪布之辨\"（骨架§二.11）的边界，最准确的说法是——",options:["两者都正确，只是修空先后顺序之别", "道共定主张断我见后的无散乱，支那堪布是造作的不作意", "支那堪布主张无分别，道共定主张强修作意境", "道共定与支那堪布\"全不作意\"的修法完全等同"],answer:1,explanation:"✅ 答案是B。边界在：广论所破的支那堪布之误，是\"凡无分别、全不作意，皆是修甚深空义\"——即把\"什么都不想、造作地放下念头\"误当作修正见、修空观，这是\"于空性全未悟解的无分别\"；而本书的\"道共定\"恰恰是另一极：\"只断我见（实在感）、散乱之因瓦解而自然无散乱\"，非造作不作意，且本书自设\"一念不生三层次\"（意志压抑的世间定／实在感不起／道共定）以作区分。故相通处是都谈\"无分别/无念\"，边界在一为\"断见后的自然无散乱\"，一为\"造作的不作意\"。末句口诀：不是我不烦恼，只因无物可思量。"},{stem:"广论以九住心九级、六力四作意构成可逐阶操作的次第（骨架§二.8）；本书却是\"念念分明、活在眼前、未到地定\"等散点反复叮嘱的口诀，无统一次第。关于这条路径利弊的辨析，下列哪一项最合理？",options:["两者皆不可取，应以个人经验自由发挥", "九住心纯属教条，比口诀体更易误导初学", "口诀体重训示、轻次第，利于日用上手但缺可复现的刻度", "口诀体无次第，胜过论典的无用繁琐框架"],answer:2,explanation:"✅ 答案是C。相通处在：二者目标都是\"从散乱到一心、从勉强到任运\"的同一方向；边界在：广论九住心是\"递进立证\"——内住→等持九级皆有可检验的相状，六力配住心、四作意标功用，是可复现、可对账的次第；本书口诀体是\"反复叮嘱\"，同一主题（念念分明、活在眼前）在不同段落高频回荡，长在切近日用、易于切入，短在缺逐阶可操作、可检验的分际，易沦为\"听多了就以为懂了\"。末句口诀：口诀利于上手，次第利于对账。"},{stem:"广论立奢摩他必以\"身心轻安\"为得止之量（《解深密经》定义，骨架§二.1、§二.9），本书通篇却只以\"意志坚韧、心静、安宁\"等心理舒适与意志力为见效指标，从不以轻安作判据。这一\"无轻安判据\"与得止之量的关系是——",options:["本书以意志/心静为指标，缺广论\"身心轻安\"这一得止的严格判据", "无轻安判据恰是本书超越论典的现代化优点", "二者殊途同归，轻安可有可无", "二者皆以有无轻安为得定的铁律"],answer:0,explanation:"✅ 答案是A。边界在：广论严格区分\"第九住心（无功用任运）\"与\"得奢摩他\"，判据唯在\"身心轻安\"生起，九住心纵得无分别安乐亦不立即为得止（甚至专章破\"误认无分别智\"之疑）；本书则以\"意志坚韧\"\"心静\"\"安宁\"等意志力与心理舒适为收效指标，从不以\"身轻安/心轻安\"作判据，故\"得止之量付之阙如\"，易滑向\"觉受即成就\"。相通处在：二者都重视\"心能安住、不为散乱所动\"这一共同的心相目标。末句口诀：得止之量在于身心轻安，不在觉受舒适。"}]},
{name:"停不下来的人×广论止观",author:"大卫·亚当",questions:[{stem:"斯坦利·拉赫曼与同事德·席尔瓦在20世纪70年代做了一项著名研究：把强迫症患者与\"正常\"同事各自写下的奇怪想法写在卡片上并打乱后，最有经验的医生也无法区分哪张出自谁手。这个实验证明了什么？",options:["强迫症患者的思维与正常人完全不同", "正常人的想法比患者更加\"自我排斥\"", "侵入性想法人皆有之，是\"原材料\"而非病本身", "强迫思维可以通过问卷统计精确筛查"],answer:2,explanation:"✅ 答案是C。拉赫曼—德·席尔瓦的卡片打乱实验证明\"侵入性想法无处不在，但直到20世纪70年代才有人注意到它的存在\"——侵入性想法人人都有，本身不是病，只是强迫症的原材料。A反了（恰恰无法区分才证明相同）；B错在方法（是卡片打乱而非问卷统计）；D无中生有。口诀：恶念人人有，执之方成病。"},{stem:"哈佛心理学家丹尼尔·韦格纳的白熊实验发现：被要求\"不要去想白熊\"的学生，停止压抑后想到白熊的次数反而更多、更强烈。这个\"后抑制反弹效应\"真正的机制是什么？",options:["被要求不去想的人，其无意识的\"监控\"过程会持续寻找目标，反而更频繁唤回它", "白熊是特殊符号，仅对\"熊\"类念头有效", "压抑会永久根除念头，反弹只发生在睡眠中", "反弹源于被试故意不配合实验指令"],answer:0,explanation:"✅ 答案是A。白熊效应分为两过程：一是需要努力、无法长久的\"转移注意力\"抑制过程；二是自动持续、无须费力的\"监控\"过程——只要监控继续，头脑就会继续寻找被禁目标，念头反而出现得更频繁。\"转移注意与监控同为自动过程\"、\"监控须费力维持\"都违背实验结论；\"白熊是特殊符号所以反弹\"则把机制错解为符号特例。口诀：越压越弹，如逆水压球。"},{stem:"作者指出，焦虑症、抑郁症的苦恼念头大多是\"理性的\"（对外界事务的咀嚼、对错误决定的遗憾），而强迫思维性质不同。区分二者的关键判据是什么？",options:["想法的内容是否涉及具体事务", "想法的持续时间长短", "想法是\"自我协调\"还是\"自我排斥\"", "想法出现的频率高低"],answer:2,explanation:"✅ 答案是C。\"自我协调\"的想法与动机意愿一致；侵入性想法\"是非理性的，与我们的心理并不协调。它们是'自我排斥的'，与我们秉持的观点相互冲突\"。\"想法是否重复出现\"\"是否引起焦虑\"\"是否想摆脱\"都是表象，非判据。口诀：同则为虑，斥则为患。"},{stem:"书中说强迫行为是\"雪上加霜\"，虽能暂时赶走强迫思维却维持不了多久。这一恶性循环的原理是什么？",options:["强迫行为让患者彻底失去自知力", "强迫行为会传染给家人形成\"并发症\"", "强迫行为消耗体力，导致身体虚弱无法思考", "强迫行为本质是压抑想法，被压制的念头会\"故态复萌，变本加厉\""],answer:3,explanation:"✅ 答案是D。原文：\"强迫行为的作用就是压抑想法，因此强迫行为所压制的侵入性想法还会故态复萌，而且变本加厉\"——用压抑当武器，正是白熊效应的现实版。其余三项都偏离原文机制。口诀：以压驱念，念愈炽盛。"},{stem:"强迫症（OCD）与强迫性人格障碍（OCPD）常被混为一谈。作者用\"A型人/B型人\"区分，其中\"自我协调\"与\"自我排斥\"是关键。下列说法正确的是？",options:["OCD源于洁癖，OCPD源于健忘", "OCPD是\"自己的地狱\"，OCD是\"身边人的地狱\"", "OCD自我排斥，OCPD自我协调", "OCD与OCPD其实无法区分，只是名称不同"],answer:2,explanation:"✅ 答案是C。原文：\"强迫症是患者自己的地狱，而强迫性人格障碍则可能是患者周围亲近的人的地狱\"——OCD的念头自我排斥（痛苦万分、与人格矛盾），OCPD的条理化则自我协调（乐此不疲、引以为傲）。\"人格障碍者自己受苦\"把地狱归属说反；\"两者无法区分\"违背原书\"有明显区别\"的明言；\"患者伪装成人格障碍\"纯属曲解。口诀：己之困为症，人之困为格。"},{stem:"暴露与反应阻止（ERP）疗法源自所罗门的条件反射狗实验：抬高障碍让狗无法跳过，灯闪后却\"没有接通电流\"，狗渐渐平静，多次后\"对灯光产生的恐惧消失了\"。由此导出的治疗机制，正确的理解是？",options:["让患者在焦虑顶峰时得到奖励以消除恐惧", "让焦虑达到顶峰后自己停滞衰落，靠\"渐衰式消除\"而非强迫行为", "用药物直接阻断焦虑的生理反应", "用电击强化患者对恐惧的回避"],answer:1,explanation:"✅ 答案是B。原文：\"一定要让他们的焦虑达到顶峰后自己停滞下来。过一段时间后，焦虑感升无可升，就只能衰落下来。\"这种\"渐衰式消除\"证明焦虑可自行消散，不必靠强迫行为。\"施加电击等不适刺激\"是厌恶疗法、\"完成仪式后给奖励\"是正向强化、\"服药降低焦虑\"是药物思路，均非ERP。口诀：不逃不压，焦虑自衰。"},{stem:"作者描述侵入性想法\"不请自来\"、占满脑海（拉丁词源 obsidere，\"围困\"）。这与广论\"修止资粮六种\"中哪一种对治对象在现象层面高度同构？",options:["不作行所对的\"沉没\"", "作行所对的\"掉举\"", "断除贪欲等诸恶寻思（观无常过患）", "忘圣言所对的\"失念\""],answer:2,explanation:"✅ 答案是C。侵入性想法这种不受控、强行现前、令人不安的染污念头流，正对应广论修止资粮第六\"断除贪欲等诸恶寻思（观无常过患）\"（卷14）——都是未经主动选择、强行现前的恶念。B失念是忘失所缘，C沉没是昏沉，D掉举是散乱，皆非\"恶念流\"本身。口诀：不请之念，即恶寻思。"},{stem:"作者病愈后的体悟是：\"只要默默地看着它们来，看着它们走就行了。\"这句白话几乎可作为哪一组止观修行的注脚？",options:["所缘之\"净行所缘缘不净\"", "九住心由\"听闻力\"成办内住", "身八法之\"息无声无粗猛\"", "八断行中\"念\"治忘圣言+\"舍\"治作行（不随不拒）"],answer:3,explanation:"✅ 答案是D。\"看着它们来，看着它们走\"正是\"不压抑也不执行\"的不随不拒，对应八断行中\"念\"（令心住所缘不随妄念走，治忘圣言）与\"舍\"（沉掉既断，不于无过处强作功用，治作行）。\"内住摄录其心\"是初摄录心，\"息徐徐而转\"是调息威仪，\"缘不净对治贪\"是对治贪的不净观，均非\"如实观念来去\"。口诀：看着来去，念住舍行。"},{stem:"书中说焦虑在反复暴露后\"渐衰式消除\"，如同所罗门的狗对灯光不再恐惧。这一\"反复面对直到不再恐惧\"的转变，与广论中哪一成就的机制相呼应？",options:["由\"忆念力\"成办的安住", "由\"思惟力\"成办的续住", "由\"精进力\"成办的最极寂静", "由\"串习力\"成办的第九住心\"等持\"（无功用任运而转）"],answer:3,explanation:"✅ 答案是D。ERP的\"渐衰式消除\"强调反复暴露后焦虑\"自行消散\"，对应九住心由\"串习力\"成办的第九\"等持\"——无功用任运而转；广论\"读书喻\"（卷16）：\"譬如读书至极串熟……虽于中间心往余散，然所读诵任运不断\"，正是\"串习极熟\"后的任运转变。\"精进力成办第七第八\"\"思惟力成办续住\"\"忆念力成办第三第四\"都尚须功用，不匹配\"任运\"。口诀：串习极熟，任运而转。"},{stem:"认知行为疗法强调：\"强迫症之所以出现，其原因并非在于侵入性想法本身，而在于患者如何解释和看待这些想法。\"作者\"念头不等于人\"的结论，在功能层上与广论哪一修行对应？",options:["依止\"净惑所缘\"", "由\"正知力\"成办的调伏与寂静（觉察念头而不认同）", "结跏趺坐五因缘", "由\"听闻力\"成办的内住"],answer:1,explanation:"✅ 答案是B。认知疗法教患者\"觉察而不认同\"——不把念头生起等同于自我意志，作者更点明拉赫曼治疗过的数百例\"没有一例实施了自己的想法，去伤害孩子\"，念头≠人。这功能层对应广论由\"正知力\"成办的第五\"调伏\"与第六\"寂静\"（观散乱过失、正知觉照），即\"心观心\"的见证意识。\"内住摄录其心\"是初摄录心，\"结跏趺坐调息\"是坐姿，\"净行所缘各别\"是所缘分类，均非\"觉察照看\"。口诀：念生非我，正知觉照。"},{stem:"书中铺陈\"强迫仪式\"与\"宗教仪轨\"的外在相似——反复、计数、净化——并点出\"佛陀让周利盘陀伽一心扫地以开悟\"与\"沉于执念反复清扫\"表面相同、实质相反。这一\"正邪之辨\"对应广论的什么判分？",options:["结跏趺坐的物理稳定性", "九住心进度的数值高低", "身八法的坐姿端正与否", "所缘的\"善恶正邪\"，串习需正见摄持"],answer:3,explanation:"✅ 答案是D。同样的重复、计数、净化动作，修行仪轨是有所缘、有心要、被传统与正见摄持的善法串习，强迫仪式则是无所缘、无正见、被我执与恐惧驱动的错用——正对应广论对所缘\"善恶正邪\"的判分与\"串习需正见摄持\"。\"动作次数多少\"\"有无诵念\"\"持续时间长短\"皆为外在形式，非\"正邪\"判据。口诀：同一动作，正见分邪正。"},{stem:"ERP与广论止观都讲\"不随不拒\"\"让焦虑/散乱渐次止息\"，有相通处。但二者的目标层次有根本差别，正确的辨析是？",options:["广论止观也以\"社会功能恢复\"为最高标准", "ERP与广论都在做\"形而上判断\"，只是术语不同", "ERP与广论都追求断尽烦恼种子，只是名称不同", "ERP以\"回归正常生活、缓解症状\"为目标，是心理技术；广论以\"断惑证真\"为目标，是解脱学"],answer:3,explanation:"✅ 答案是D。相通处在\"不压抑、不执行、由串习而渐次止息\"这一工具层；但边界在目标层——ERP的成功标准是恢复社会功能，广论的成功标准是断烦恼种子、出生死（卷16：\"任如何修此三摩地，尚不能断欲界烦恼……故当更修毗钵舍那\"）。工具同、层次差，绝不可把\"症状缓解\"等同于\"断惑\"。口诀：工具可同，目标层不同。"},{stem:"白熊效应证明\"越压抑念头越反弹\"，与广论驳\"支那堪布弃观慧全不作意\"一脉相通，都警示\"硬压/不思维\"的失败。但二者边界何在？",options:["白熊效应完全等同于\"无念即道\"的佛法", "广论赞成用\"不作意\"来压抑念头", "压抑念头本身就是修空性毗钵舍那", "白熊效应证明\"压抑念头失败\"，但\"不作意\"≠\"道\"；广论驳的是\"凡无分别皆修空义\"，二者警示的是\"以压代观\"这一共同误区"],answer:3,explanation:"✅ 答案是D。相通处在二者都揭示\"单纯用力压抑/不思维\"是死路——白熊效应是心理学反证，广论卷14/16明言\"凡无分别，皆是修甚深空义毗钵舍那，纯粹支那堪布修法\"。边界在于：压抑念头的失败是心理现象，不等于\"不作意就是道\"；佛法所依的是择法的观察慧，不是把念头压下去。其余三项都把心理现象误等于佛法见地。口诀：压念失败≠无念即道。"},{stem:"心理治疗常用\"念头不等于你\"\"接纳自己\"来安慰患者，功能上似与佛法\"不执念为我\"相似。二者的深浅差别在于？",options:["二者完全等同，只是语言习惯不同", "佛法之无我仅是\"健康自我形象\"的另一种说法", "心理学之\"我\"是人格、自我形象层面的功能概念，疗愈即可；广论之\"人无我\"是胜义抉择，所破为\"自性实有之我\"", "心理学已证成人无我的胜义见"],answer:2,explanation:"✅ 答案是C。相通处在\"不把此刻的念头执为自我本质\"的功能层相似，都有疗愈/舍执之用；边界在于深浅——心理学从不、也无法证成\"人无我\"的胜义见，其\"自我\"是功能性概念，目的是保护与疗愈；广论所破的是\"自性实有之我\"，是所破对象层面的抉择。功能层无我≠抉择人无我。口诀：放下是疗，破执方证。"},{stem:"书末\"维量法\"主张人人都有\"亚临床强迫症\"，应把\"有/无\"改为\"程度/分数\"；这听起来接近佛法\"烦恼是共相、人人须对治\"。二者的判分线究竟在哪里？",options:["二者完全一致，都是为诊断精确", "医学的维量法足以替代佛法的出离观", "方向相反：心理学把\"正常/异常\"边界放回连续谱是\"医学—统计\"视野，佛法说\"烦恼通一切有情\"是\"解脱学—修行\"视野", "佛法主张强迫症只是\"程度问题\"不需要对治"],answer:2,explanation:"✅ 答案是C。相通处在二者都拒绝\"全有/全无\"、都承认\"通一切\"的普遍性；边界在方向与视野——心理学把强迫症放回连续谱是医学—统计视野，服务于诊断干预的精确；佛法说\"烦恼通一切有情\"是解脱学视野，指向无始无明的普遍与出离的必然。强迫症是\"病\"须治疗，烦恼是\"共相\"须对治，判分线在\"求愈\"与\"求解脱\"之间。口诀：治病求愈，对治求解。"}]}
];
let currentBook=0, currentQ=0, answers={};
function init(){buildTabs();showQuestion();updateNavButtons();}
function buildTabs(){
  var html=books.map(function(b,i){
    var answered=0;
    for(var j=0;j<b.questions.length;j++){if(answers[i+'-'+j]!==undefined)answered++;}
    return '<div class="book-tab'+(i===currentBook?' active':'')+'" onclick="switchBook('+i+')">'+b.name+'<div class="tab-progress">'+answered+'/'+b.questions.length+'</div></div>';
  }).join('');
  document.getElementById('bookTabs').innerHTML=html;var _t=document.getElementById('bookTabs');var _b=_t.querySelectorAll('button')[12];if(_b){var _g=document.createElement('span');_g.className='tab-group';_g.textContent='止观系列';_t.insertBefore(_g,_b);}var _b0=_t.querySelectorAll('button')[0];if(_b0){var _g0=document.createElement('span');_g0.className='tab-group';_g0.textContent='樊书系列';_t.insertBefore(_g0,_b0);}
}
function switchBook(i){currentBook=i;currentQ=0;refresh();}
function refresh(){buildTabs();showQuestion();updateNavButtons();}
function goPrev(){if(currentQ>0){currentQ--;showQuestion();updateNavButtons();}}
function goNext(){var qs=books[currentBook].questions;if(currentQ<qs.length-1){currentQ++;showQuestion();updateNavButtons();}}
function updateNavButtons(){
  var qs=books[currentBook].questions;
  document.getElementById('btnPrev').disabled=(currentQ===0);
  document.getElementById('btnNext').disabled=(currentQ>=qs.length-1);
  var key=currentBook+'-'+currentQ, hint=document.getElementById('navHint');
  if(answers[key]===undefined){hint.textContent='未作答';return;}
  hint.textContent=(answers[key]===qs[currentQ].answer)?'✅ 正确':'❌ 错误';
}
function showQuestion(){
  var qs=books[currentBook].questions, q=qs[currentQ], b=books[currentBook];
  document.getElementById('qProgress').innerHTML='<span style="color:#f0c060;">'+b.name+'</span> · 第 <span class="q-number">'+(currentQ+1)+'</span> / '+qs.length+' 题';
  document.getElementById('qStem').innerHTML=q.stem;
  var body=document.getElementById('qBody'), key=currentBook+'-'+currentQ, prevAns=answers[key];
  body.innerHTML='<div class="options">'+q.options.map(function(opt,i){
    var cls='option';
    if(prevAns!==undefined){cls+=' disabled';if(i===q.answer)cls+=' correct';else if(i===prevAns&&prevAns!==q.answer)cls+=' wrong';}
    var label=String.fromCharCode(65+i);
    return '<div class="'+cls+'" onclick="'+(prevAns===undefined?'answerChoice('+i+')':'')+'">'+label+'. '+opt+'</div>';
  }).join('')+'</div>';
  var explDiv=document.getElementById('qExplanation');
  if(prevAns!==undefined&&q.explanation){explDiv.className='explanation show';explDiv.innerHTML='💡 '+q.explanation;}
  else{explDiv.className='explanation';explDiv.textContent='';}
  updateScoreboard();
}
function answerChoice(idx){
  var key=currentBook+'-'+currentQ;
  if(answers[key]!==undefined)return;
  answers[key]=idx;showQuestion();updateNavButtons();
}
function updateScoreboard(){
  var total=0,correct=0;
  for(var b=0;b<books.length;b++)for(var j=0;j<books[b].questions.length;j++){
    var key=b+'-'+j;if(answers[key]===undefined)continue;
    total++;if(answers[key]===books[b].questions[j].answer)correct++;
  }
  var wrong=total-correct, pct=total>0?Math.round(correct/total*100):0;
  var totalQ=0;for(var b=0;b<books.length;b++)totalQ+=books[b].questions.length;
  document.getElementById('sbProgress').textContent=total+'/'+totalQ;
  document.getElementById('sbCorrect').textContent=correct;
  document.getElementById('sbWrong').textContent=wrong;
  document.getElementById('sbScore').textContent=pct+'%';
}
function showAllAnswers(){books[currentBook].questions.forEach(function(q,qi){answers[currentBook+'-'+qi]=q.answer;});refresh();}
function resetCurrentBook(){books[currentBook].questions.forEach(function(_,qi){delete answers[currentBook+'-'+qi];});currentQ=0;refresh();}
function resetAll(){answers={};currentBook=0;currentQ=0;refresh();}
init();
</script>
