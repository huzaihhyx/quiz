伴侣行为模式是什么？","options":["家务分配不均","财务控制","长期冷战","针对人格的批评而非针对行为的争论"],"answer":3,"explanation":"✅ 书中区分：健康争执针对行为、寻求解决方案；恶性争吵专门打击对方人格、永久损伤自尊。摧毁伴侣自尊的常见行为还包括：拿他人对比、攻击家人、嘲讽外表、否定对方付出。"},{"stem":"根据书中描述，哪些行为属于日常生活中摧毁伴侣自尊的典型行为？","options":["拿伴侣和前任做对比","嘲讽伴侣的外表","攻击伴侣的家人","以上都是"],"answer":3,"explanation":"✅ 书中列举的摧毁伴侣自尊的行为包括：拿他人对比、攻击家人、嘲讽外表、追忆前任、否定对方付出。这些行为针对的是人格和自我价值，而非具体行为。"},{"stem":"一个孩子在选择朋友时，自尊会驱使他做出什么样的选择？","options":["随机选择","更容易和自我评价相近的人成为好友","总是选择比自己优秀的人做朋友","只与家人推荐的人交友"],"answer":1,"explanation":"✅ 书中指出\"人更容易和自我评价相近的人成为好友，同类群体互相慰藉。\"低自尊者倾向与同样低自尊的朋友抱团取暖，高自尊者的朋友圈也更偏自信。这形成了一种社交上的\"同类匹配\"。"},{"stem":"职场中的\"辱虐式管理\"不包括以下哪一项特征？","options":["反复无常的评判","给员工设定有挑战但可实现的目标","只批评不肯定","抢夺员工的功劳"],"answer":1,"explanation":"✅ 辱虐式管理的特征是反复无常的评判、只批评不肯定、抢夺功劳，持续摧毁员工自尊。而\"给员工设定有挑战但可实现的目标\"属于健康管理行为，有助于建立团队自信。"},{"stem":"关于女性身材认知偏差，本书提出了什么观点？","options":["男性比女性更在意自身体重","女性根本不在意男性对身材的看法","女性自认为的理想体重远瘦于男性真实偏好","女性对理想体重的认知与男性真实偏好基本一致"],"answer":2,"explanation":"✅ 书中指出\"女性眼中理想体重、认为男性喜欢的体重，都远瘦于男性真实偏好\"；男性对自身身材评价客观，极少产生体重焦虑，更多在意身高。这种认知偏差导致大量女生过早节食、青春期自尊持续走低。"},{"stem":"青少年低自尊最极端的后果是什么？","options":["自杀倾向","社交孤立","沉迷游戏","成绩下滑"],"answer":0,"explanation":"✅ 书中明确指出\"青少年低自尊和自杀倾向高度相关\"。自我价值感崩塌后，部分青少年会通过极端方式博取家人关注。很多自杀未遂者内心真正渴望的其实只是父母的陪伴与认可。"},{"stem":"书中提到，青少年首选倾诉对象的顺序是？","options":["同性好友（83%）→母亲（78%）","母亲→父亲→朋友","老师→父母→朋友","兄弟姐妹→朋友→父母"],"answer":0,"explanation":"✅ 数据显示青春期阶段，青少年倾诉首选同性好友（83%），母亲次之（78%）。说明青春期同辈评价的权重已远超父母，这对自尊的塑造方向有重大影响。"},{"stem":"在科研、革命领域，革新者大多在家中排行第几？","options":["独生子/独生女","幼子/幼女","排行与革新无关","长子/长女"],"answer":1,"explanation":"✅ 书中对比了长子与幼子的自尊差异：长子自尊偏高但不稳定，受父母期待影响，更愿意维护固有理论和传统；幼子依靠同辈关系获得认可，更反叛，擅长开辟新赛道。科研与革命领域的革新者多为家中幼子。"},{"stem":"婚姻中\"健康争吵\"和\"恶性争吵\"的根本区别是什么？","options":["谁先道歉","针对行为还是针对人格","争吵的音量大小","争吵的频率"],"answer":1,"explanation":"✅ 书中区分：健康争执针对具体行为，目的是寻求解决方案；恶性争吵专门打击对方人格，通过贬低对方自尊来获取优越感。后者会永久损伤伴侣的自尊。"},{"stem":"本书将服饰和时尚比喻为自尊的什么？","options":["盔甲","面具","武器","义肢"],"answer":3,"explanation":"✅ 书中将服饰称为自尊的\"义肢\"：合适穿搭能短暂提升自我好感，但这是外部辅助而非内在改变。很多低自尊者购入潮流衣物却不敢外出穿，反映了\"义肢\"的局限——外在包装无法真正解决内在自卑。"},{"stem":"那位42岁手工艺人最感激父母给予他的什么？","options":["让他坚信\"我是一个好人\"的信念，即使曾令父母失望","广泛的社交资源","优秀的学业辅导","富裕的物质生活"],"answer":0,"explanation":"✅ 手工艺人说：\"我最感激父母的一点是，他们给了我这样的信念：我是一个好人，尽管我曾经令他们失望。青春期的我学业一团糟，还做了不少傻事蠢事，但我始终觉得他们不会不再爱我。\"这正是无条件的自爱根基。"},{"stem":"书中45岁造型师玛丽安娜后悔花两三年学医的故事，被用来论证什么观点？","options":["艺术行业比医疗行业更好","消极自我观让人不敢追随内心","医学生压力太大","父母不应该给孩子建议"],"answer":1,"explanation":"✅ 玛丽安娜说\"我讨厌医学，但父亲强烈建议。我其实喜欢艺术，但我不敢尝试，怀疑自己没有能力做好。\"这个案例论证了消极自我观会让人耗费大量时间在不适合的道路上，不敢为自己的人生做选择。"},{"stem":"21岁大学生让·巴蒂斯特的案例（进了名校依旧恐惧失败）被用来解释哪种现象？","options":["大学生普遍迷茫","名校竞争激烈","父母过高期待导致的长期自我怀疑","学业压力过载"],"answer":2,"explanation":"✅ 让·巴蒂斯特说\"父亲没读过大学，一心想让我样样第一。我一直活在害怕令他失望的焦虑里，就算进了名校，依旧恐惧失败。\"这是典型的\"肩负重任的孩子\"——背负父母未完成心愿，属于自我观变形的典型案例。"},{"stem":"50岁皮埃尔的案例（跟着好友选专业、甚至还和他前任交往）被用来论证什么？","options":["友谊的重要性","消极自我观让人习惯性从众","男性在感情中缺乏主见","大学选专业太难"],"answer":1,"explanation":"✅ 皮埃尔自述\"父母很爱我，但我从来不敢做自己。大学跟着好友选专业，他分手我就和他前任交往，明明想学工程却因为害怕失败选了商科。\"这个案例论证消极自我观使人习惯性从众、丧失独立选择能力。"},{"stem":"书中描述的低自尊者自我描述时最典型的特征是什么？","options":["措辞激烈、充满情绪化表达","用幽默自嘲掩饰问题","措辞中立、刻意回避褒义词，害怕炫耀","喜欢详细列举自己的成就"],"answer":2,"explanation":"✅ 低自尊者描述自我时\"措辞中性，刻意回避绝对化褒义词，害怕炫耀招人反感，也不愿直白暴露缺点\"。他们自我描述模糊、前后矛盾，评价他人时却干脆利落。"},{"stem":"关于达尔文的案例，作者想要传达什么观点？","options":["达尔文其实自尊很高","科学天才不需要高自尊","低自尊的谦逊也能成就伟大","科学家应该远离社会舆论"],"answer":2,"explanation":"✅ 达尔文一生谦逊温和，不愿与人争执，耗费十余年完善理论，即便遭受猛烈抨击也不主动辩驳。作者用这个案例说明：低自尊的优势——谦逊、善于倾听和修正——同样可以成就伟大事业，低自尊并非全然的劣势。"},{"stem":"阿赞库尔战役在书中被引用是为了说明什么？","options":["英国弓箭技术的先进性","战争中的偶然因素","法国军队作战勇猛","高自尊的弊端——盲目自负轻视风险"],"answer":3,"explanation":"✅ 作者以阿赞库尔战役为例：法国贵族骑兵自恃勇武，忽视地形劣势，惨败于英军长弓手。这个案例论证了高自尊的弊端之一\"盲目自负，轻视风险\"，骄傲使人看不见隐患。"},{"stem":"书中提到一战中哪位将军的案例来说明\"固执己见、不肯变通\"的危害？","options":["福煦将军","霞飞将军","贝当元帅","尼维尔将军"],"answer":3,"explanation":"✅ 书中引用尼维尔将军：无视多方预警执意强攻，造成十几万士兵伤亡。这个案例被用来论证高自尊的弊端——固执己见、不肯变通，容易在错误道路上持续投入，不愿止损。"},{"stem":"根据本书，不稳定高自尊最常见的成长根源是什么？","options":["被父母完全忽视","家庭极其富裕","父母只在表现优秀时给予关注，赞美与真实能力脱节","从小被过度批评"],"answer":2,"explanation":"✅ 书中指出不稳定高自尊的成长根源是\"父母只在表现优秀时给予关注，赞美与真实能力脱节；父母本身也是不稳定高自尊，孩子模仿其处事模式。内心深处害怕自己配不上自我期待。\"这是一种\"有条件认可\"带来的深层不安全感。"},{"stem":"作者认为，当孩子在学校哭诉\"同学不和我玩\"时，父母最正确的回应是？","options":["\"那群人不好，我去找老师\"","\"你成绩下降才没人和你玩\"","\"听起来你很难过，和我说说发生了什么？\"","\"没关系，你还有爸妈\""],"answer":2,"explanation":"✅ 书中给出三个选项对比：A是替孩子做主、剥夺表达；C是擅自猜测、贴标签；B是\"认真倾听、留出表达空间\"的正确示范。核心原则：不要简单说教，不要主观揣测，引导孩子表达真实感受。"},{"stem":"\"自我妨碍\"作为一种心理防御机制，具体指的是什么？","options":["故意伤害自己","过度谦虚","回避社交","考前不复习，提前为可能的失败找借口"],"answer":3,"explanation":"✅ 书中将\"自我妨碍\"列为低自尊常用防御机制：考前故意不复习，如果考不好可以归因于\"没复习\"而非\"能力不行\"，如果考好了则更显\"聪明\"。这是一种提前保护自尊免受失败打击的无意识策略。"},{"stem":"以下哪种心理防御机制属于高自尊者更常用的？","options":["考前故意不复习","幻想成功但不行动","失败后归因于外部因素（\"题目太难\"\"裁判不公平\"）","扎堆分摊失败责任"],"answer":2,"explanation":"✅ 书中列举高自尊常用防御机制：失败归因外部、向下对比（盯着他人缺点）、批评评判者。低自尊则倾向回避、幻想、自我妨碍、扎堆抱团。两者采用完全不同的自我保护路径。"},{"stem":"一个失恋后陷入全面自我否定、认为自己\"永远不值得被爱\"的人，低自尊者遇到这种情况最容易伴随什么？","options":["投入疯狂工作中","轻度抑郁症状","暴怒攻击前任","立刻寻找新恋情"],"answer":1,"explanation":"✅ 书中指出\"失恋对低自尊者打击极强，会陷入自我全盘否定，类似轻度抑郁。\"低自尊者不擅长把失败归因于具体情境或对方，而是习惯性归结为\"我不好\"，所以情感伤害更持久。"},{"stem":"根据詹姆斯自尊公式，一个成就斐然却始终不满自己的完美主义者，问题的根源在于什么？","options":["自爱不足","成功不够多，需要更努力","缺乏他人认可","自我期待过高，趋近无限大"],"answer":3,"explanation":"✅ 詹姆斯公式：自尊 = 成功 ÷ 自我期待。完美主义者的自我期待无限高，即便成功很多，分母也同步膨胀，导致比值始终低迷。解决的两种路径——增加成功或降低期待——对完美主义者来说，后者才是关键。"},{"stem":"书中提到外貌出众对自尊的双面影响，以下哪项不是\"美貌的弊端\"？","options":["更容易找到伴侣","大众默认其能力平庸","年华老去后自我崩塌","容易招致同性嫉妒"],"answer":0,"explanation":"✅ 作者指出美貌的弊端：招致同性嫉妒、被默认能力平庸、过度依赖外貌作为自尊唯一来源导致年华老去后自我崩塌。D是优势而非弊端。"},{"stem":"将本书的四大自尊类型和\"对失败的典型反应\"进行匹配，哪一组是正确的？","options":["稳定低自尊→短暂失落，快速恢复","稳定高自尊→立刻反驳攻击对方","不稳定低自尊→反复内耗，自我怀疑","不稳定高自尊→客观看待，思考改进"],"answer":2,"explanation":"✅ 正确匹配：稳定高自尊→客观看待思考改进；不稳定高自尊→立刻反驳攻击对方；不稳定低自尊→反复内耗自我怀疑；稳定低自尊→默认对方说得对，全盘接受否定。只有C正确。"},{"stem":"一位30岁业务代表想转行当老师，因为害怕考证失败而不敢放弃现有工作。这个案例反映了低自尊者的什么特征？","options":["老师职业不合适","自信不足导致的行动拖延和畏惧挑战","对现有工作非常满意","考证制度不完善"],"answer":1,"explanation":"✅ 书中用这个案例论证自信不足的表现：\"想转行当老师，但害怕考证失败，不敢放弃现有工作。\"低自尊者在行动层面表现为拖延、畏惧挑战、极易放弃，最终被困在不满意的现状中。"},{"stem":"根据本书\"童年双重滋养\"理论，如果父母只给予\"无条件的爱\"而缺乏\"有条件的教育\"，孩子最可能发展出什么特征？","options":["稳定低自尊","自爱充足但不懂得获得外界尊重的方法","长期自我怀疑","恰如其分的自尊"],"answer":1,"explanation":"✅ 书中明确指出两种滋养缺一不可：\"只溺爱不懂规则，孩子自大；只严苛缺少关爱，孩子长期自我怀疑。\"只有无条件爱的孩子会缺乏获得外部尊重的能力，变成以自我为中心的人。"},{"stem":"书中建议打破\"低自尊负向循环\"的第一步是？","options":["等待环境自然改善","先通过心理治疗彻底治愈","一次性做出人生重大改变","从小规模、可控的小事开始行动，积累微小成功"],"answer":3,"explanation":"✅ 书中给出的具体策略是\"建立微小目标，持续收获正向反馈，打破低自尊负向循环\"。核心逻辑：低自尊负向循环的起点是\"畏惧行动\"，所以必须用足够小、足够安全的行动来打破僵局，不是等待大环境改变，也不是一次性的激烈突破。"},{"stem":"本书书名\"恰如其分的自尊\"的深层含义是？","options":["自尊越低越谦虚","根据场合随时切换自尊模式","稳定且适度——既不过高也不过低、不剧烈波动，能自洽从容地面对生活","自尊越高越好"],"answer":2,"explanation":"✅ 全书结论点明：\"过高或过低、剧烈波动的自尊都会带来持续困扰，唯有平衡、稳定、适度接纳自我的恰如其分的自尊，才能让人自洽、从容地面对生活。\"这是书名和全书的最终落脚点——不是追求极致的自信，而是找到平衡稳定的自我。"}]},{"name":"思辨与立场","author":"理查德·保罗、琳达·埃尔德（美国批判性思维研究权威）","questions":[{"stem":"作者在开篇引用弥尔顿的话\"心灵自主，天堂地狱皆其定\"，意在说明什么？","options":["人类的灵魂由上帝决定","思维质量决定生活体验","一个人能否上天堂靠自我感觉","所有宗教的核心信条相同"],"answer":0,"explanation":"✅ 作者引用这句话是为了说明思维塑造了你——如果你的思维结果与现实不符，你就会有诸多失望；如果思维倾向过于悲观，你就会难以找到人生乐趣。"},{"stem":"作者把大多数人比作什么动物，来说明人类缺乏对自身思维的反思？","options":["猫头鹰","乌龟","猴子","蚂蚁"],"answer":2,"explanation":"✅ 作者说\"我们就像猴子一样，对发生了什么毫无兴趣，只是到处逛来逛去\"，而批判性思考者则是\"那只只知道为了什么东西逛来逛去的罕见的猴子\"。"},{"stem":"低境界批判性思维者的传统名称是什么？","options":["哲学家","逻辑学家","诡辩家","实用主义者"],"answer":2,"explanation":"✅ 低境界批判性思维者又称\"诡辩家\"，是一种赢得辩论的花招使用者，不考虑思维是否存在问题，运用卑劣的辩论技巧取胜。"},{"stem":"作者认为，真正的批判性思维者（高境界）区别于低境界者的核心特质是什么？","options":["更擅长辩论","公允无偏","智商更高","受过高等教育"],"answer":1,"explanation":"✅ 高境界批判性思维者力求做到公允，用道德和负责任的方式思考，理解和欣赏他人观点。即使不赞同也愿意倾听。"},{"stem":"\"认知谦逊\"的含义最接近以下哪项？","options":["不自信，不表达观点","对所有人保持谦卑礼貌","承认自己知识的局限性","认为所有观点都一样正确"],"answer":1,"explanation":"✅ 认知谦逊使我们意识到自己知识的局限性，对自我蒙蔽保持敏感，注意到自己观点中的偏差和成见，不需要无知却假装渊博。"},{"stem":"以下哪种表现属于\"认知怯懦\"？","options":["对自己的能力缺乏信心","面对与己不同的思想感到恐惧，不敢认真考虑","与他人激烈争论自己的信念","缺乏学习新事物的兴趣"],"answer":1,"explanation":"✅ 认知怯懦是指面对与我们的思想不一致的思想时会感到恐惧，不会认真考虑它们。当某些思想与我们认同的思想严重冲突时，我们会感觉受到威胁。"},{"stem":"作者建议的\"个人认同\"的最佳方式是什么？","options":["不认同任何东西，保持虚无","认同自己推导出信念的方式，即认同自己是一个批判性思维者","认同一个固定的意识形态体系","认同自己所属群体（国家、宗教、公司）的信念"],"answer":1,"explanation":"✅ 作者认为健康的认同方式是：\"我不会认同任何信念的具体内容，我将只认同我推导出信念的方式。我准备抛弃任何不能获得证据支持和通过理性思考能得到的信念。\""},{"stem":"\"换位思考\"作为一种认知美德，最困难的部分是什么？","options":["说服他人改变观点","真诚地理解并从他人的前提、假定条件和思想出发进行推理","找到与自己观点不同的人","让他人理解自己的观点"],"answer":0,"explanation":"✅ 换位思考要求能够准确地重构别人的观点和推理过程，从别人的前提出发进行推理——这是最难掌握的技能之一。"},{"stem":"作者用美国中情局和反恐法的例子来说明哪种认知恶习？","options":["认知自负","认知虚伪性","认知惰性","认知怯懦"],"answer":0,"explanation":"✅ 美国中情局刺杀外国政要、训练他国使用酷刑，但只要想象一下\"如果其他国家这样对美国\"，就能看出深层的不一致性——这就是\"认知虚伪性\"，对自己和别人用不同标准。"},{"stem":"作者将思维提升类比为哪种技能的学习过程？","options":["学习烹饪","学习编程","学习打网球","学习开车"],"answer":1,"explanation":"✅ 作者用打网球做类比——看优秀运动员录像→比较差异→练习→再练习→再比较→提高，通过多轮练习、总结、练习来增强意识。"},{"stem":"根据作者的观点，\"认知坚毅\"的反面是什么？","options":["认知虚伪","认知惰性","认知胆怯","认知自负"],"answer":1,"explanation":"✅ 认知坚毅的反面是认知惰性，是一种一旦面对有挑战性的认知任务就迅速放弃的倾向。"},{"stem":"作者提出的批判性思维发展六个阶段中，第一阶段是什么？","options":["有所成的思考者","起点上的思维提升者","无思维反思意识者","有思维反思意识者"],"answer":2,"explanation":"✅ 六个阶段按顺序为：无思维反思意识者→有思维反思意识者→起点上的思维提升者→行进中的思维提升者→有所成的思考者→集大成的思考者。"},{"stem":"以下哪项不是作者列举的\"认知美德\"（心智特质）？","options":["认知谦逊","认知自负","思维自主","认知勇气"],"answer":0,"explanation":"✅ 认知自负是认知谦逊的反面，属于\"认知恶习\"，而非认知美德。认知美德包括：认知谦逊、认知勇气、换位思考、认知一致、认知坚毅、信赖推理、思维自主。"},{"stem":"作者认为思维的三大功能之间的关系是什么？","options":["各自独立运作","三者之间密切且动态地相互影响","欲求是基础，思维和情感从属于欲求","思维决定情感，情感决定欲求"],"answer":0,"explanation":"✅ 人的心灵有三个基本功能：思维让我们弄懂生活的意义；情感监控或评估思维产生的意义；欲求引发行动。三者密切且动态地相互影响。"},{"stem":"作者说\"思维错误中的概念误用\"最容易被人们忽视，因为什么？","options":["概念错误比语法错误更明显","我们很少意识到自己使用的概念存在偏差","大多数人根本不用概念思考","概念本身不重要"],"answer":1,"explanation":"✅ 相对于语法错误，概念错误更难被人意识到。比如\"爱\"这个概念常被曲解——对方行为举止明确显示不爱你时，你仍可能因为对方偶尔说\"我最爱你了\"而结婚。"},{"stem":"石棉生产商明知石棉致癌却继续鼓吹其用途，这个例子被用来说明什么问题？","options":["政府监管的缺失","缺乏公正性的自我中心思维","商业竞争的无情","科学研究的不可靠"],"answer":1,"explanation":"✅ 该例子被用来说明缺乏公正性——当能忽略产品潜在伤害时，人们可以收获巨大利益而不用遭受良心谴责。"},{"stem":"在作者看来，低境界批判性思维者最典型的行为特征是？","options":["对所有观点一视同仁","能识别他人思维中的缺陷，但在不给予对方应有考虑的情况下否定对方","公开承认自己的错误","从不参与辩论"],"answer":2,"explanation":"✅ 低境界批判性思维者\"采用选择性的和自我蒙蔽式的方式运用智力技能，不惜牺牲真相为自己谋取利益\"，他们擅长识别对手思维中的缺陷并加以攻击。"},{"stem":"\"一个人的包里面混乱不堪，说明他的头脑也不清楚\"——这种推理最容易被哪种思维陷阱影响？","options":["认知勇气","不合理的归纳概括","认知谦逊","换位思考"],"answer":1,"explanation":"✅ 作者在第二章提到，\"我们所有的人都会在没有证据支持的情况下去归纳总结\"——这是一种常见的坏思维习惯。外表和内在不能简单划等号。"},{"stem":"作者用电脑程序在大屏幕上显示来比喻什么？","options":["人工智能的发展","教育技术的进步","我们如果能把自己的思维外显化会大吃一惊","批判性思维的工具"],"answer":2,"explanation":"✅ 作者说\"如果我们能够将我们的思维像电脑程序一样在一个大屏幕上显示出来，那么我们一定会大吃一惊，甚至有时会感到震惊。\""},{"stem":"以下关于大众传媒的观点，哪一项是作者明确指出的？","options":["大众传媒是中立的","大众传媒致力于批判性思维教育","阅读大众传媒有助于形成独立思考","大众传媒培养着社会中心思维"],"answer":3,"explanation":"✅ 作者明确指出\"大众传媒培养着社会中心思维\"，每个国家的媒体一般曲解\"敌人\"的思维，不加批判地接受本国媒体对国际事务的叙述是一种思维陷阱。"},{"stem":"\"信赖推理\"作为一种认知美德的含义是什么？","options":["用推理来说服他人接受自己的观点","依赖权威的推理","相信所有推理都是正确的","认识到好的推理能够证明自身的价值"],"answer":2,"explanation":"✅ 信赖推理是指认识到好的推理以证明自身的价值，作为发现和学习的工具。"},{"stem":"作者认为，面对急剧变化的世界，传统学习方法为什么失效？","options":["因为知识总量减少了","因为人们变懒了","因为现实不给人们时间在变化之前把握它","因为学校教育失败了"],"answer":2,"explanation":"✅ 作者指出\"当现实不给我们时间在其变化之前让我们把握它时，我们如何适应现实\"，批判性思维在任何社会都没有成为一种社会价值。"},{"stem":"根据本书，思维的基础性目标是什么？","options":["获得快乐","预测形势","赚取财富","获得权力"],"answer":0,"explanation":"✅ \"思维的基础性目标就是预测形势。我们都会面临复杂决策，此时我们就需要获取最佳的信息做出最好的选择。\""},{"stem":"作者用\"打球时教练一次次提醒你眼睛盯着球\"来类比什么？","options":["天赋比练习重要","批判性思维不需要练习","批判性思维需要反复练习基本法则","思维技能不可习得"],"answer":3,"explanation":"✅ 就像打网球需要被反复提醒\"用眼睛盯着球\"一样，批判性思维也需要\"用心灵之眼一遍又一遍地关注那些基本法则\"。"},{"stem":"作者提到\"自我中心思维在我们的头脑中看起来是理性的\"——这说明了什么？","options":["理性思维就是自我中心思维","所有人都应该接受自我中心思维","大脑有自我合理化的能力，即使思维是非理性的","自我中心思维其实是理性的"],"answer":3,"explanation":"✅ 这是作者在策略性思维部分提出的重要观念——大脑倾向于对非理性的自我中心思维进行自我合理化，让我们觉得自己的自私行为是合理的。"},{"stem":"据书中所述，印度在\"9·11\"后推出的反恐法导致多少人被捕，其中多少人有罪？","options":["100000人被捕，5%有罪","75000余人被捕，仅1%有罪","5000人被捕，50%有罪","15000人被捕，30%有罪"],"answer":1,"explanation":"✅ 根据《泰晤士报》数据，超过75000人被捕，但只有1%的人犯罪，很多被告在监狱中遭受数年折磨且没有保释可能。"},{"stem":"根据本书，\"思维自主\"的核心是什么？","options":["不依赖任何他人的观点","拒绝所有权威","成为一个独立的思考者，不被群体裹挟","只相信自己的直觉"],"answer":2,"explanation":"✅ 思维自主是指成为一个独立的思考者，认识到所有认知美德之间的相互依存性，不被社会中心主义和自我中心主义裹挟。"},{"stem":"作者指出许多人的思维问题根源是\"看不见自己思维的矛盾\"，这属于缺乏哪种特质？","options":["认知谦逊","认知一致","认知勇气","认知坚毅"],"answer":2,"explanation":"✅ 缺乏认知一致性的人\"不关心真正的一致性，以根深蒂固的矛盾性和不一致性为其标志\"——表面公开承认特定观点，行为却与信念不一致。"},{"stem":"\"教警察和部队如何折磨囚犯以逼供\"，这个例子用来揭示什么？","options":["恐怖主义的危害","认知缺乏一致性——对自己和别人用不同标准","美国中情局的高效","执法手段的有效性"],"answer":3,"explanation":"✅ 该例是认知虚伪性的典型表现——如果其他国家训练美国警察采用虐待方式对待美国公民，美国会如何反应？这正是对自己和别人采用不同标准的虚伪。"},{"stem":"作者认为思想、情感和欲求三者关系中，引发行动的是哪一项？","options":["思维","情感","三者共同","欲求"],"answer":0,"explanation":"✅ 思维让我们弄懂生活的意义；情感监控或评估思维产生的意义；\"欲求引发行动\"。三者之间是密切且动态的关系。"},{"stem":"作者在讨论\"社会中心思维\"时提到，摆脱它的方法是什么？","options":["拒绝所有媒体","加入多个社会群体","成为真正良知的开端","完全脱离社会"],"answer":2,"explanation":"✅ 作者指出\"摆脱社会中心思维：真正良知的开端\"。需要意识到自己思维的群体倾向性并努力超越。"},{"stem":"为什么作者强调\"从不同观点出发进行思考是很困难的\"？","options":["因为缺乏相关资料","因为大多数人不够聪明","因为时间不够","因为这是\"最难掌握的一项技能\"，需要克服自我中心倾向"],"answer":0,"explanation":"✅ 作者明确指出\"试图准确地从别人的观点出发进行思考是很困难的，这是最难掌握的一项技能\"。它要求我们克服天生的自我中心倾向。"},{"stem":"作者建议我们如何检验自己的换位思考能力？","options":["阅读更多书籍","参加辩论比赛","与别人争论后，分别从自己和他人的角度重构争论，然后呈现给对方验证","在镜子前练习"],"answer":3,"explanation":"✅ 作者提出的实践方法：重构和他人的争论，分别写出自己的观点和对方的观点，然后将结果呈现给对方看是否准确表征了对方观点。"},{"stem":"\"全球化的新现实以自有的方式改变着经济、社会、文化、政治乃至环境\"——这个观点强调了批判性思维的必要性是因为什么？","options":["知识正在贬值","需要用新的思维方式应对复杂性和不确定性","全球化让一切变得更好","全球化的唯一后果是环境恶化"],"answer":1,"explanation":"✅ 作者指出\"为了应对持续加速的变化和复杂性，我们需要一种更复杂、更有适应性以及对不同观点更敏感的思维\"——固化的思维方式已经不够用了。"},{"stem":"\"我们必须整合三个方向的思维：理想主义、现实主义、实用主义\"——作者这样说的目的是什么？","options":["说明批判性思维是矛盾的","说明三者是互斥的","说明批判性思维不需要想象","说明批判性思维帮助我们既看到理想，又看清现实，还采取有效手段"],"answer":3,"explanation":"✅ 作者认为我们必须同时做到\"想象一个更好的世界\"（理想主义）、\"看见事物本来的面貌\"（现实主义）和\"采取有效手段朝理想前进\"（实用主义）。"},{"stem":"在分析全球化时代的\"饮水安全问题\"时，作者想说明什么？","options":["政府不需要关心水质","每个人都应该买瓶装水","水污染是最大的环境问题","需要批判性思维来分析复杂的社会决策"],"answer":0,"explanation":"✅ 作者用饮水安全作为例子，说明政府需要在医疗投入和水质改善之间分配资源，公民需要判断政府决策是否合理——这\"只是成百上千个涉及批判性思维决策中的一例\"。"},{"stem":"作者说\"没有付出，就没有收获\"，在批判性思维语境中对应什么？","options":["没有时间的付出，就没有社会的认可","没有体力的付出，就没有智力的提升","没有智力的付出，就没有智力的收获","没有金钱的付出，就没有知识的收获"],"answer":2,"explanation":"✅ 作者将这句话改编为\"没有智力的付出，就没有智力的收获\"，强调思维提升需要从事\"智力性工作\"。"},{"stem":"作者认为批判性思维在家庭、学校、工作环境中通常获得什么待遇？","options":["被高度赞赏和鼓励","被认为是唯一重要的能力","被法律强制要求","几乎没有帮助——大多数人自己的思维都存在成见和偏见"],"answer":3,"explanation":"✅ 作者指出\"家庭、学校、熟人以及老板，他们每个人日常所关心的事务中都不包含对批判性思维价值的关注。大多数人自己的思维都存在众多问题：成见、偏见、概念错误以及僵化的思想体系。\""},{"stem":"以下哪种行为体现了\"认知坚毅\"？","options":["遇到难题就放弃","只关注简单问题","不关心复杂问题","尽管任务存在沮丧因素，仍坚持闯过认知复杂性"],"answer":3,"explanation":"✅ 认知坚毅是指\"尽管任务中存在令人沮丧的因素，但是仍然坚持闯过认知上的复杂性的这种倾向\"。"},{"stem":"作者认为\"恐怖主义\"问题通常被如何对待？","options":["被各国政府公平处理","被简单化地对待","被深入分析其复杂根源","被完全忽视"],"answer":3,"explanation":"✅ 作者指出\"尽管恐怖主义的形成几乎都有其复杂的根源，但是恐怖主义却常常被简单化地对待。我们习惯性地、不加批判地接受我们国家媒体对国际事务的叙述。\""},{"stem":"以下哪项是作者定义的\"认知自负\"的表现？","options":["承认自己的知识有限","愿意向他人学习","经常反思自己的信念","认为自己懂得比实际更多，思维从不犯错"],"answer":0,"explanation":"✅ 认知自负是\"人类固有的自我中心倾向，令我们相信，自己懂得的东西比实际知道的东西更多，我们的思维几乎从不出错\"。"},{"stem":"\"我不承认自己有任何偏见\"——这句话最可能反映了哪种思维问题？","options":["认知勇气","认知谦逊","认知自负","思维自主"],"answer":2,"explanation":"✅ 认知自负的人不能或很少洞察自我蒙蔽和自己观点的局限性，经常声称自己知道而实际上不知道的东西。"},{"stem":"根据本书，以下关于\"道德判断\"的观点，哪一项是正确的？","options":["道德是一个没有客观标准的概念","道德与法律完全相同","道德与宗教完全等同","需要区分道德和其他领域的思维，避免将社会传统或性禁忌混淆为道德"],"answer":3,"explanation":"✅ 作者在第12章讨论道德推理时，专门强调了区分道德和宗教、社会传统、法律、性禁忌的必要性。"},{"stem":"作者建议在评估组织生活中的思维时，第一个障碍是什么？","options":["员工懒惰","技术落后","隐蔽的权力争斗","缺乏资源"],"answer":0,"explanation":"✅ 作者明确指出\"组织内进行批判性思维的第一个障碍：隐蔽的权力争斗\"，其次是\"群体对现实的定义\"和\"官僚主义问题\"。"},{"stem":"本书中\"观念的检核与实践\"模块的设计背后的心理学基础是什么？","options":["人本主义","精神分析","元认知","行为主义"],"answer":3,"explanation":"✅ 译者序指出，\"观念检核与实践\"模块的设计以心理学有关元认知的丰富研究为支撑。"},{"stem":"以下哪种做法最符合\"策略性思维\"的要求？","options":["不思考，直接行动","凭直觉做决策","完全依赖他人建议","定期评估自己的思维，理解思维与情绪、欲求的互动关系"],"answer":3,"explanation":"✅ 策略性思维要求理解思维、情绪情感体验和欲求相互依存，\"为了有高品质的思维，我们必须定期地对思维进行评估\"。"},{"stem":"在批判性思维语境中，当发现自己犯了认知错误时，最恰当的反应是什么？","options":["承认错误并修正，视其为成长机会","忽略错误","为自己辩护","归咎于他人"],"answer":0,"explanation":"✅ \"具备认知勇气\"意味着\"我们很轻松地承认曾经犯过的错误，很高兴纠正一些仍然在犯的错误\"。"},{"stem":"一个员工面对公司的不合理政策时，私下传播流言但不敢直接质疑——这在书中是什么问题？","options":["认知谦逊过度","认知坚毅不足","认知怯懦——怕被拒绝而不敢挑战群体信念","认知自负"],"answer":0,"explanation":"✅ 作者指出\"很多人看别人的眼色行事，除非别人赞扬他们，否则他们不可以赞扬自己。怕被人拒绝的恐惧经常潜藏在他们心灵的背后，很少有人会挑战他们群体所持有的信念\"——这是认知怯懦的表现。"},{"stem":"本书建议当你在工作中需要做复杂决策时，第一步应该做什么？","options":["跟随多数人的选择","立即做出决定","认识到你面对的是一项重要决策，准确界定备选项并理性评估","征询所有人的意见然后投票"],"answer":1,"explanation":"✅ 作者提出合理决策需要经过四个关键点：认识到你面对的是一项重要决策；准确地界定各个备选项；理性地评估各个备选项；自我训练做出最佳选择。"},{"stem":"如果你发现自己对一个政治问题的看法完全来自你经常收看的媒体而从未了解不同观点，按照本书标准，你首先应该做什么？","options":["坚信自己的观点是正确的","避免讨论政治问题","有意识地寻找和理解对立观点，用相同标准审视双方论据","完全放弃自己的观点"],"answer":0,"explanation":"✅ 这就是\"公允无偏的思考\"——用相同标准对待所有观点，站在对立方角度推理，当证据显示自己立场站不住脚时愿意改变。这是本书最核心的实践原则。"}]},{"name":"非主流式成长","author":"佚名（网络小说/教育题材叙事作品）","questions":[{"stem":"余文舟的妻子为什么离开他？","options":["文舟打她","嫌弃文舟没钱，跟老情人移民国外","两人性格不合","文舟出轨"],"answer":1,"explanation":"✅ \"跟老情人移民外国了……人家权衡过的，好歹比跟一个寒碜的穷教师强多了！\""},{"stem":"文舟对\"语文教育应该先培养什么\"的观点是？","options":["以人性良知为支撑的人文精神","阅读速度","写作能力","应试技巧"],"answer":0,"explanation":"✅ \"语文教育应该先培养以人性良知为价值支撑和基本内涵的人文精神，其次是应重塑汉语的精神活力，最后是关注对真善美的引导。\""},{"stem":"余文舟一个月工资大约多少？","options":["5000元左右","1000元左右","3000元左右","1万元以上"],"answer":1,"explanation":"✅ 书中明确写文舟\"一个月的工资一千都不到\"，而语文组长却将近两千。"},{"stem":"文舟教育孩子的核心理念是？","options":["\"既不放任，也不强制\"","只读经典不玩游戏","严厉强制","完全放任"],"answer":0,"explanation":"✅ \"对于教育学生和孩子，他有自己的一套，既不放任，也不强制。\""},{"stem":"文舟向朋友借钱时，哪位朋友借给了他？","options":["当编辑的朋友","同事","校长","李学山"],"answer":0,"explanation":"✅ 文舟的朋友\"不是推家中正缺钱，就是直说这个月还没有出粮\"，最后在\"最后一位朋友\"当编辑的那里借得五百元。"},{"stem":"雅文中学校门口对联的特点是什么？","options":["是英文翻译的","因多音多义有多种读法","只有一个读法","没有任何含义"],"answer":1,"explanation":"✅ 对联\"海水朝朝朝朝朝朝朝落，浮云张长长长长长长消\"有三种常见读法，利用了多音字和同音假借手法。"},{"stem":"文舟借钱不遂时想起了什么典故来安慰自己？","options":["刘备借荆州","庄周借米——\"涸辙之鲋\"","管鲍之交","伯牙子期"],"answer":1,"explanation":"✅ 庄周问监河侯借米，监河侯说\"等收到租税再借三百金\"。庄周讲了一个\"涸辙之鲋\"的故事：车辙中的鲫鱼只要少许水就能活，等\"西江之水\"来的时候早就成鱼干了。"},{"stem":"文舟的自行车有什么特点？","options":["\"除了铃儿不响其余哪都响\"","电动车","没有刹车","全新名牌"],"answer":0,"explanation":"✅ 自行车极破，\"到市场买菜的时候吓得人家以为是工商纠察队来了，背后人人都夸他是个马路上的音乐家。\""},{"stem":"文舟为孩子准备的\"必读书单\"不包括以下哪一项？","options":["四大古典名著","英语教科书","四大谴责小说（被拿掉了）","《古文观止》"],"answer":1,"explanation":"✅ 书单包括古典名著、历史小说，但文舟意识到\"小孩子不应过早学会谴责\"，所以四大谴责小说被拿掉。其中没有英语教辅。"},{"stem":"文欣认为对于女人来说什么最重要？","options":["品德","学历","家庭背景","\"不会挣钱不重要，可要是没样貌没身材的话，那就什么都完了\""],"answer":3,"explanation":"✅ 文欣直言\"男人外表长得平凡不重要，最重要是会挣钱；而我们女人呢，不会挣钱不重要，可要是没样貌没身材的话，那就什么都完了。\""},{"stem":"文舟与孩子做的诗词比赛不包括以下哪种形式？","options":["翻译英文诗歌为中文","末字接龙","以\"柳\"为题且诗中不能出现\"柳\"字","以\"春风\"开头接龙"],"answer":0,"explanation":"✅ 书中描述了三种形式的诗词游戏（咏柳、接龙、春风开头），没有翻译英文诗。"},{"stem":"文舟向李学山借钱时，李学山怎么回复？","options":["马上借钱","拒绝帮忙","建议他去贷款","\"贤兄勿急，出粮救汝\"（等发了工资救你）"],"answer":3,"explanation":"✅ 李学山回函\"贤兄勿急，出粮救汝\"，文舟心想\"等你出粮的时候老子也都出粮了，还要你救个屁！\""},{"stem":"雅文中学旁边的河有什么特点？","options":["清澈见底","干涸了","是人工河","被污染成\"黑河\"有化工厂每天排毒"],"answer":3,"explanation":"✅ \"黑河上游是一家化工厂，每天都孜孜不倦地排毒养颜。\"学子还\"唯恐饿坏了黑河，于是天天把吃剩的早餐施舍予黑河。\""},{"stem":"小说中对雅文中学校长的描写中，透露了什么信息？","options":["校长被查出贪污近百万","校长不懂教育","校长是文学博士","校长是个清廉的好人"],"answer":0,"explanation":"✅ \"同年一小偷把副校长家中财物洗劫一空……然后再顺藤摸瓜，竟然摸出个贪污近百万的校长。\""},{"stem":"孩子问妈妈去哪了，紫嫣说了什么让文欣喝止的话？","options":["\"我要找妈妈\"","\"妈妈去哪不关我事\"","\"旧的不去新的不来，咱爸给我们再找一个\"","\"妈妈死了\""],"answer":2,"explanation":"✅ 紫嫣天真地说\"不要就不要嘛，旧的不去新的不来，咱爸给我们再找一个不就行了吗？\"并说\"幼儿园里的钟阿姨每次弄丢我小包包的时候都是这样对我说的。\""},{"stem":"子扬在饭堂吃到什么让他差点吐出来？","options":["石子","苍蝇","蜗牛","头发"],"answer":2,"explanation":"✅ \"发现竟然是一只蜗牛，不由得吓退了半截，拼命往地上吐口水，差点把胃酸都吐了出来。\"他还对服务员调侃\"只是缺了点盐和油\"。"},{"stem":"文舟在妻子走后有什么意外的发现？","options":["生活更困难了","孩子更调皮了","没人做饭了","原来不用怕老婆也挺幸福的"],"answer":3,"explanation":"✅ 文舟每天看到同事\"怕老婆怕得要命，甚至连家都不敢回\"，不由觉得自己\"原来是那么的幸福，看来塞翁失马，焉知非福一点不假。\""},{"stem":"紫嫣被问\"三苏\"是谁时开了一个什么玩笑？","options":["\"苏秦、苏武、苏轼\"","\"酥饼、酥糖、酥肉\"","\"苏州、杭州、扬州\"","\"苏轼、苏东坡和苏子瞻\"（三人其实是同一个人）"],"answer":3,"explanation":"✅ 紫嫣故意说\"三苏\"是\"苏轼、苏东坡和苏子瞻\"（字子瞻号东坡居士，其实是同一个人），然后哈哈大笑说\"这叫三位一体\"，最后才给出正确答案。"},{"stem":"子扬宿舍中哪个舍友交的择校费最高？","options":["子扬自己","杨凡（青春痘）","叶观潮（矮个子/金鱼眼）","梁思佳"],"answer":2,"explanation":"✅ 杨凡交了几万，叶观潮说\"我是交了十多万才能进来\"。"},{"stem":"李学山和余文欣（子扬的姑姑）是什么关系？","options":["曾经的情侣后来分道扬镳，最终又在一起并结了婚","同事","兄妹","陌生人"],"answer":0,"explanation":"✅ 二人\"原本是一对很默契的情侣，后来因为女方讨厌男方自私吝啬而分道扬镳\"，但最终\"喜结连理，新婚燕尔，异常恩爱\"。"},{"stem":"文舟对爱情有一个什么比喻性看法？","options":["爱情像食物","爱情像火","爱情像水","\"爱情就像一块口香糖，嚼到淡然无味了便随口吐掉\""],"answer":3,"explanation":"✅ 文舟认为\"现代人的爱情就像一块口香糖，嚼到淡然无味了便随口吐掉，不能强迫自己一口吞掉。\""},{"stem":"雅文中学的军训为什么从一周多改为六天？","options":["教官不够","学生抗议","温度特别高，学校体恤学生","经费不足"],"answer":2,"explanation":"✅ \"鉴于这个夏天的气温特别高，学校为了体恤学生的身心，于是把为期一个多星期的军训改为六天。\"——实则是\"体恤学生就是体恤老师和教官，体恤老师和教官就是体恤自己的资金\"。"},{"stem":"文舟在育才中学的身份是什么？","options":["体育老师","语文老师，语文组的\"中流砥柱\"但组长另有其人","校长","后勤人员"],"answer":1,"explanation":"✅ \"文舟在育才中学里面是个很有威望的语文老师，也是该中学语文组的中流砥柱，但语文组组长却另有其人。\""},{"stem":"紫嫣在军训期间发生了什么？","options":["得第一名","与教官冲突","身娇体弱，不支晕倒","成功完成所有训练"],"answer":2,"explanation":"✅ \"紫嫣自小身娇体弱，加上从没吃过如此苦楚……最终不支晕倒在地上。\""},{"stem":"文舟送孩子到学校后离开时交给他们什么？","options":["玩具","零食","一部《汉书》和《后汉书》","银行卡"],"answer":2,"explanation":"✅ 文舟把孩子唤到跟前\"遂把一部《汉书》和《后汉书》交给他们\"——即使在分别时刻也不忘教育。"},{"stem":"在7岁生日庆祝中，子扬回答\"唐宋八大家\"包括谁时，正确说出了几个？","options":["4个","8个全说对","2个","6个"],"answer":1,"explanation":"✅ 子扬准确说出韩愈、柳宗元、欧阳修、王安石、苏轼、苏洵、苏辙、曾巩八人。"},{"stem":"紫嫣在饭堂与女服务员冲突时，服务员最后怎样了？","options":["摔进了大饭桶里","赔礼道歉","叫来经理","哭着跑了"],"answer":0,"explanation":"✅ 紫嫣做扔饭盒姿势吓唬服务员，\"那女服务员以为这次真的要被她袭击了，又向后退开几步，竟然一不小心摔进了大饭桶里，成了大饭桶中的饭桶。\""},{"stem":"叶观潮读书有什么特点让子扬\"叹服不已\"？","options":["顺读倒读相结合，速度快到\"从序言到最后一页再倒回去\"","只读外国书","做精美笔记","过目不忘"],"answer":0,"explanation":"✅ 子扬发现叶观潮\"从序言看到最后一页\"然后\"又从最后一页看到第五十页\"\"从第二十五页看到第二百五十页\"——速度快到\"顺读倒读相结合\"的原因其实是他根本没在读，而是在跳读乱翻。"},{"stem":"文舟用什么方式训练孩子的毛笔字？","options":["找老书法家教","买字帖自己临摹","天天逼他们读书练字，练字时放钢琴音乐放松心情","报书法班"],"answer":2,"explanation":"✅ 文舟天天逼孩子\"读书练字，且练的是毛笔字，搞得子扬紫嫣刷牙时拿起牙刷都能联想到毛笔\"，同时\"适时用录音机放上些钢琴音乐，以便让他们把心情放松。\""},{"stem":"紫嫣说的\"三位一体\"在这个情境中的幽默点是什么？","options":["她把苏轼的一个人的\"名\"（轼）、\"字\"（子瞻）、\"号\"（东坡居士）当成了三个人","宗教概念","哲学概念","数字游戏"],"answer":0,"explanation":"✅ 苏轼=苏子瞻=苏东坡，同一个人的名字、字、号。紫嫣故意把它们说成三个人，然后说\"这叫三位一体\"，展现了孩子的幽默和知识。  ### 论据/数据/故事细节题（15题）"},{"stem":"文舟出的上联\"此木为柴山山出\"属于什么类型的对联？","options":["拆字联（此+木=柴，山+山=出）","颜色联","数字联","谐音联"],"answer":0,"explanation":"✅ \"此木\"合成\"柴\"，\"山山\"合成\"出\"——是典型的拆字联。"},{"stem":"紫嫣对\"此木为柴山山出\"的下联是什么？","options":["金失为铁木木林","\"白水作泉日日昌\"和\"因火成烟夕夕多\"","一人是大日日昌","日月为明天天好"],"answer":1,"explanation":"✅ 两句下联都用了相同手法——白+水=泉，日+日=昌；因+火=烟，夕+夕=多。且第二句的\"夕夕多\"意境上呼应了晚上\"烟\"的意象。"},{"stem":"雅文中学门口楹联可以读作几种版本（书中提到的）？","options":["3种","4种以上","2种","1种"],"answer":0,"explanation":"✅ 文舟讲解了三种读法：①海水潮，朝朝潮，朝潮朝落/浮云涨，长长涨，长涨长消 ②海水潮，朝朝潮，朝朝潮落/浮云涨，长长涨，长长涨消 ③海水朝朝潮，朝潮朝朝落/浮云长长涨，长涨长长消。"},{"stem":"文舟用什么方法应对公交扒手？","options":["报警","\"用信封装了一大包厕纸\"意图当场拿住窃贼","不带钱","换工作"],"answer":1,"explanation":"✅ 文舟用信封装厕纸放在衣兜。结果小偷没抓到，信封还是被偷了。第二天衣兜里多了包东西——昨天丢的信封，上面多了张字条：\"老板，拜托以后别开这种玩笑，会影响小弟正常收入的。\""},{"stem":"文舟向李学山借钱时想起了一个与老舍有关的典故叫什么？","options":["\"老舍被围\"","\"老李被围\"","\"老赵被围\"——赵景深向老舍催稿","\"老张被围\""],"answer":2,"explanation":"✅ 赵景深致函老舍催稿，在信纸上写一个\"赵\"字并用红笔圈起来，旁边写\"老赵被围，速发救兵\"。老舍在原信纸上画了一支枪直刺红圈，旁边写\"元帅休慌，末将来也\"。"},{"stem":"在新生大会上，为什么学生在校长讲完后没人鼓掌，最后又突然掌声雷动？","options":["老师指挥","校长讲得太精彩","一个又胖又矮的女生破天荒放了一个响屁，大家鼓掌起哄","有人带头"],"answer":2,"explanation":"✅ \"坐在前面的一个又胖又矮手粗脚粗的女生破天荒放了一个响屁——下面立即掌声雷动。\"这个极具讽刺性的细节贯穿了整本小说对体制的调侃风格。"},{"stem":"叶观潮藏在身后的\"不适合小孩子和未成年人看的书\"是什么类型的？","options":["政治禁书","暴力漫画","恐怖小说","黄色/成人内容"],"answer":3,"explanation":"✅ 子扬说\"你在看黄——\"，叶观潮立刻制止他，印证了书的类型。"},{"stem":"饭堂同学对子扬饭盒里的蜗牛开了什么玩笑？","options":["\"你运气好\"","\"这很正常\"","\"你应该报食品安全部门\"","\"够你在肚子里开个小型动物园\""],"answer":3,"explanation":"✅ 同学幸灾乐祸道\"日后还有很多虫子给你吃哩，够你在肚子里开个小型动物园喽\"，子扬想\"这样下去的话……那我岂不成了禽兽之类？\""},{"stem":"文舟无意中拍了校长的马屁是通过什么方式？","options":["当面夸校长","帮校长做事","跟同事说\"我们育才中学的校长倒是个例外\"（不喜奉承的例外）","送礼"],"answer":2,"explanation":"✅ 文舟本意是不认为校长喜欢被拍马屁，结果\"寥寥数语不胫而走，经他人之口传入校长之耳。校长获悉后欣喜若狂\"，给了文舟一套教师住房。"},{"stem":"雅文中学门口的门卫有什么特点？","options":["高大威猛","年轻帅气","\"身材干瘦，好像一不小心便会被风刮走然后摔在地上变成好几截\"","态度恶劣"],"answer":2,"explanation":"✅ 门卫一看紫嫣\"马上双眼绽放异彩\"，\"连忙拉开抽屉捣出装眼镜的盒子掏出眼镜戴上\"，是个好色的干瘦老头。"},{"stem":"雅文中学的\"四大守护神\"是什么？","options":["四大天王雕像","四位保安","四棵古树","蛇、虫、鼠、蚁"],"answer":3,"explanation":"✅ 男生介绍说雅文中学的\"四大守护神\"是蛇虫鼠蚁，蚊子还\"好像受过特种训练\"。"},{"stem":"子扬以\"柳\"为题且诗中不出现柳字时，背的第一首诗是什么？","options":["唐彦谦《垂柳》","李商隐《柳》","贺知章《咏柳》","白居易《杨柳枝》"],"answer":2,"explanation":"✅ \"碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。\"——虽名为《咏柳》，但诗中确实没有\"柳\"字。"},{"stem":"紫嫣在\"春风\"开头诗句接龙中用的诗句不包括以下哪句？","options":["\"春江水暖鸭先知\"","\"春风得意马蹄疾\"","\"春风又绿江南岸\"","\"春风十里扬州路\""],"answer":0,"explanation":"✅ D开头是\"春江\"而非\"春风\"。紫嫣接的\"春风\"诗句包括：春风十里上珠帘（杜牧）、春风又绿江南岸（王安石）、春风得意马蹄疾（孟郊）等。"},{"stem":"范校长（雅文中学校长）的外形被描写成什么？","options":["中等身材","高大威猛","矮胖","\"又高又瘦，看上去像根纤巧的牙签\""],"answer":3,"explanation":"✅ \"瘦得离谱，高得出奇，差不多可以去跟姚明打球，看上去像根纤巧的牙签。\"下巴\"凹凹凸凸，俨然一戈壁滩\"。"},{"stem":"年级行政叶东平的外形被描写得怎样？","options":["像明星","五官肥大到如\"留声机上的大喇叭\"","眉清目秀","相貌堂堂"],"answer":1,"explanation":"✅ \"面部上的东西什么都特别大……搞得鼻孔和耳朵仿如旧时留声机上面的大喇叭，令人有种局部大于整体的惊恐。\"——这句描写充满了讽刺。  ### 应用/推理题（5题）"},{"stem":"用古典诗词训练子女这件事，在今天看来最核心的价值是什么？","options":["复古主义","为了考试得高分","让孩子看起来有文化","培养语言敏感性、审美能力和文化底蕴"],"answer":3,"explanation":"✅ 文舟的诗词训练体系不是为了应试——他培养的是对语言韵律、意境的敏感性和对传统文化的亲近感，这些是超越考试的素养。"},{"stem":"妻子离开后，文舟独自抚养孩子成功的核心因素是什么？","options":["有亲戚帮忙","他始终没有放弃对孩子的教育投入——精神富养超越了物质贫困","经济条件好","孩子天赋特别好"],"answer":1,"explanation":"✅ 文舟在极度贫困中仍然坚持给孩子创造文化浸润的环境——这才是\"非主流式成长\"的核心。"},{"stem":"小说对雅文中学的描写（饭堂的虫子、校长的贪污、军训的形式主义）传达了什么态度？","options":["中立客观","尖锐的讽刺——揭露教育体制中的种种荒诞","无所谓","完全肯定"],"answer":1,"explanation":"✅ 全书以幽默讽刺的笔调揭示教育体制中的问题——从饭堂食品安全到校长贪污、从军训形式主义到教育资源分配不均。"},{"stem":"\"非主流式成长\"的\"非主流\"体现在哪里？","options":["职业教育","不上学在家自学","出国留学","不走常规的课外补习路线，而是通过家庭文化浸润培养深厚的文化底蕴"],"answer":3,"explanation":"✅ 核心是\"不依赖课外班和金钱堆砌的教育方式\"，而是\"贫困中有底蕴、阅读中见天地\"的家庭教育。"},{"stem":"文舟拒绝为了升职而巴结领导，坚持自己的教育理念和教学方式。这体现了他什么样的价值观？","options":["\"穷则独善其身\"——在逆境中坚守自己的原则和尊严","自我中心","不知变通","固执"],"answer":0,"explanation":"✅ 这正是文舟自己向孩子们传递的价值观——\"穷则独善其身，达则兼济天下\"。他用自己的行动做了示范。"}]},{"name":"论语可以这样读","author":"王文特（北京大学古典文献专业毕业，本书以逐章解读方式重新阐释《论语》，注重义理与","questions":[{"stem":"本书作者认为读书的\"本\"（根基）是什么？","options":["背诵全文","识字——从音韵训诂入手读懂原意","记住所有经典","广泛阅读"],"answer":2,"explanation":"✅ 作者在解读\"孝弟也者，其为仁之本与\"时指出历代注家因为不识\"仁\"实为\"人\"的借字而出洋相，强调\"读书也要务本，这个本就是识字\"。"},{"stem":"金圣叹被问\"子奚为不政\"时，他的回答是什么？","options":["天下有道则见，无道则隐","不义而富且贵，于我如浮云","我不想做官","学而第一，为政第二"],"answer":2,"explanation":"✅ 金圣叹回答说\"学而第一，为政第二\"——意思是做学问是第一位的，做官从政是第二位的。"},{"stem":"作者对\"孝弟也者，其为仁之本与\"中\"仁\"字的考证结论是什么？","options":["就是仁爱的仁","应该是\"人\"字——\"其为人之本与\"","应该是\"忍\"字","应该是\"任\"字"],"answer":0,"explanation":"✅ 作者通过考证《初学记》和《太平御览》的引文，确认\"仁\"实为\"人\"的借字，\"人\"字古体由于篆书转隶书而讹为\"仁\"。"},{"stem":"\"巧言令色，鲜矣仁。\"作者认为这一章是教人什么的？","options":["如何说话","如何学习","如何知人","如何治国"],"answer":0,"explanation":"✅ 作者明确说\"这一章是教人知人的\"。外表花言巧语和颜悦色的人，往往包藏祸心。李林甫、王莽、武则天都是巧言令色的极致表现。"},{"stem":"曾子\"吾日三省吾身\"中的第三省\"传不习乎\"，作者认为更合理的解释是什么？","options":["传统是否被传承","传家宝是否还在","传授给学生的东西自己是否已经熟练掌握","老师教的东西有没有复习"],"answer":3,"explanation":"✅ 朱熹解释\"传\"为\"受之于师\"，但作者认为前两句都是\"及人之事\"，\"传\"解释成\"传之于人\"（传授给学生的东西）更顺。"},{"stem":"\"贤贤易色\"中\"易色\"的含义，作者倾向于哪种解释？","options":["容易变色","平易和易的颜色","改变好色之心，重德不重色（论夫妇之道）","改变脸色"],"answer":2,"explanation":"✅ 作者认为如果\"易色\"不是讲夫妇之道，此段讲了父母、君、朋友却少了夫妇这一伦不合逻辑，所以是\"重德不重色\"。"},{"stem":"作者对\"无友不如己者\"的解释主张什么？","options":["不要随便交朋友","\"如\"解作\"像\"——交友要找志同道合者","不要跟不如自己的人交朋友","没有朋友是不如自己的"],"answer":2,"explanation":"✅ 作者引苏东坡的话——如果\"如\"解作\"胜\"，那么胜己者也不会与吾为友。孟子说\"一乡之善士斯友一乡之善士\"，这才是友\"如己者\"。"},{"stem":"子贡引《诗经》\"如切如磋，如琢如磨\"来回应孔子，朱熹由此提出什么成语？","options":["知行合一","温故知新","精益求精","切磋琢磨"],"answer":3,"explanation":"✅ 朱熹《集注》说：\"治之已精而益求其精也。\"可能就是成语\"精益求精\"的出处。"},{"stem":"作者如何理解\"人不知而不愠\"？","options":["人家不了解我，我也不生气","以上两种都说得通","我讲课学生听不明白，我也不生气","不知道的事也不生气"],"answer":0,"explanation":"✅ 作者认为两种解释都说得通，但第二种\"我讲课人家听不懂我也不生气\"似乎更为可取——因为三句话应是一个有机整体，是孔子一生事实的夫子自道。"},{"stem":"作者用禅宗神秀和惠能的诗来类比什么？","options":["学习的方法","君子和小人","孔子和老子","\"贫而无谄，富而无骄\"vs\"贫而乐，富而好礼\""],"answer":2,"explanation":"✅ 神秀\"时时勤拂拭\"是第一层境界（不为外物所动），惠能\"本来无一物\"是第二层境界（心外无物），恰好对应子贡说的两种层次。"},{"stem":"解释\"学而不思则罔，思而不学则殆\"时，作者考证\"殆\"字应作何解？","options":["懒惰","危险","精神疲殆","疑"],"answer":2,"explanation":"✅ 作者引王念孙《读书杂志》考证，下文有\"多闻阙疑，多见阙殆\"，\"殆\"也是疑的意思。"},{"stem":"\"攻乎异端，斯害也已\"——本书经考证后给出什么解释？","options":["研究异端学说，这是有害的","攻击其他的学说，这就会造成祸害","专心异端，才能消除祸害","攻击异端邪说，祸害就停止了"],"answer":3,"explanation":"✅ 作者通过《论语》用语之例考证\"攻\"应解为\"攻击\"，\"已\"为助词，\"异端\"为诸子百家之说。夫子的度量是海纳百川，如果攻击起来会造成世道人心之害。"},{"stem":"孔子说\"君子不器\"，作者对此的理解是什么？","options":["君子要什么都会","君子不需要专业技能","君子不是东西（开玩笑的说法）","君子不要像器具那样——超越具体功用，达到\"上达\"境界"],"answer":3,"explanation":"✅ 作者解释\"不器\"就是\"上达\"的意思——形而上者谓之道，形而下者谓之器。多材多艺多用仍旧是个\"器\"。最大之用乃是无用之用。"},{"stem":"《诗经》\"思无邪\"三字，本书作者给出了什么新解？","options":["\"邪\"义为\"徐\"——无邪是心无旁骛、专诚一志","思想没有邪恶之意","思无邪即不思考邪恶之事","思想纯正无邪"],"answer":0,"explanation":"✅ 作者考证\"邪\"义为\"徐\"（缓慢），\"无邪\"出自《诗·駉》，与\"无期\"\"无疆\"等义相近，是专诚一志的意思。解释为\"邪恶\"是望文生义。"},{"stem":"解释\"子张学干禄\"时，作者认为\"干禄\"最妥帖的解释是什么？","options":["求官位","治生之道","求俸禄","求福"],"answer":2,"explanation":"✅ 作者认为解为\"治生之道\"最为妥贴——子张问如何治生，孔子教他修德之道，言行无失，禄在其中。"},{"stem":"\"道之以政，齐之以刑，民免而无耻。道之以德，齐之以礼，有耻且格。\"作者对\"格\"字的考证结论是什么？","options":["正（归于正）","以上三种都可通，唯独\"至\"不太通","至","革（洗心革面）"],"answer":2,"explanation":"✅ 作者认为\"至\"讲不太通，\"革\"和\"正\"都可通，\"格革音同，三代音同互训的有很多\"。"},{"stem":"孟懿子问孝，孔子答\"无违\"，这里的\"无违\"指什么？","options":["不违背君主的命令","不违背自己的心","不违背父母之命","不违背礼"],"answer":3,"explanation":"✅ 孔子对樊迟解释时明确说\"生事之以礼，死葬之以礼，祭之以礼\"——无违的是礼，不是父母之命。作者评：\"乍见无违二字还以为是无违父母之命，下面转出无违于礼来，真是柳暗花明。\""},{"stem":"\"孔子谓季氏，'八佾舞于庭，是可忍也，孰不可忍也？'\"反映了孔子对什么的深恶痛绝？","options":["季氏的残暴","季氏的懒惰","季氏的奢侈","越礼（僭礼）行为"],"answer":3,"explanation":"✅ 作者明确指出\"越礼之事，孔子深恶而痛绝\"。《资治通鉴》开卷讲\"三家分晋\"——战国纷乱就是从僭礼发端。"},{"stem":"\"禘自既灌而往者，吾不欲观之矣。\"作者认为这句话是在讽刺什么？","options":["参加祭祀的人太少","祭祀仪式太无聊","鲁国国君僭礼","祭祀用品太奢侈"],"answer":2,"explanation":"✅ 鲁国本不该行禘礼而行了，孔子觉得不合礼制。"},{"stem":"观音菩萨的小故事\"求人不如求己\"，作者用来类比什么道理？","options":["上安下顺，父慈子孝，就最好了，哪里用得着祭谁","观音比泰山神更灵验","修行要靠自己","要经常反省自己"],"answer":0,"explanation":"✅ 作者引用此故事后说\"上安下顺，父慈子孝，就最好了，哪里用得着祭谁呢？\"这与\"非其鬼而祭之，谄也\"的精神相通。"},{"stem":"\"子欲去告朔之饩羊。子曰：'赐也！尔爱其羊，我爱其礼。'\"这体现了什么？","options":["子贡比孔子更务实","保留形式是为了不忘记可以恢复的实质","孔子反对浪费","孔子喜欢羊肉"],"answer":1,"explanation":"✅ 虽然告朔仪式已不举行，但保留饩羊让人还能记住有这种礼，还可以恢复。如果羊也去掉，礼可能就此消亡。"},{"stem":"林放问礼之本，孔子回答说\"礼，与其奢也，宁俭。丧，与其易也，宁戚。\"这句话的核心思想是什么？","options":["丧礼越隆重越好","礼的本质是诚敬之心，不在外在形式的完备","礼要越简单越好","礼应该奢俭结合"],"answer":1,"explanation":"✅ \"易\"是治理完备的意思，\"戚\"是内心悲哀。礼贵得宜适中，但如不能两全，则先质后文——诚敬为本质。"},{"stem":"孔子说\"周监于二代，郁郁乎文哉！吾从周。\"这句话表明了什么？","options":["孔子承认周朝继承了夏商二代的优点，文治昌盛","孔子认为周朝是最完美的","孔子完全否定夏商","孔子只喜欢周朝的文物制度"],"answer":0,"explanation":"✅ \"监\"的本意是以水为镜照自己，引申为借鉴。周代\"监于二代\"——借鉴和继承了夏商，文治昌盛，所以孔子\"从周\"。"},{"stem":"孔子对《韶》和《武》两种乐舞的评价体现了什么？","options":["不喜欢战争题材","\"闻其乐而知其德\"——通过音乐判断德政水平","对音乐形式的偏好","认为现代音乐不如古代"],"answer":1,"explanation":"✅ 《韶》歌颂大舜，\"尽美矣又尽善\"；《武》歌颂周武王，\"尽美矣未尽善\"。由此可知其德政的差异。"},{"stem":"作者用\"一团茅草乱蓬蓬，蓦地烧天蓦地空\"来类比什么？","options":["读书的方法","不俭、不知礼的人虽能勃然而兴，也会忽焉而亡","管仲的功业","孔子的学问"],"answer":1,"explanation":"✅ 作者在评论管仲\"器小\"时，引用了这首宋人题壁诗来对比说明\"不俭、不知礼的人，就算能勃然而兴，也会忽焉而亡\"。"},{"stem":"王夫之由音乐的道理谈出了什么？","options":["政治的道理","文章的道理——要有起承转合，要\"气盛\"","经济的道理","军事的道理"],"answer":0,"explanation":"✅ 王夫之从孔子谈乐引申出：作文要气盛，\"气盛则音之高下与语之短长者皆宜\"，天下事都有起承转合。"},{"stem":"孔子对管仲的评价是什么态度？","options":["全面肯定","全面否定","一分为二——承认功业，不讳言器量偏浅","避而不谈"],"answer":2,"explanation":"✅ 作者总结\"孔子对管仲的评价是一分为二的，既承认他的功业，又不讳言他局量偏浅。\""},{"stem":"\"获罪于天，无所祷也\"——孔子这句话的核心思想是什么？","options":["不要得罪老天爷","道义上有亏，无论求谁都没用","天是最高的神","要多祷告"],"answer":1,"explanation":"✅ 王孙贾用\"媚于奥，媚于灶\"来暗示应该阿附谁。孔子说\"得罪了天，向谁祷告也没有用\"——清初李颙说\"若附热躁进，于定命无秋毫之益，于名节有泰山之损\"。"},{"stem":"\"君子无所争。必也射乎！揖让而升，下而饮，其争也君子。\"作者对\"不争\"的理解是什么？","options":["君子软弱无能","不是教你不奋斗，而是\"天下事没什么好争的\"","什么都不做","只争射箭"],"answer":1,"explanation":"✅ 作者说\"不争也不是教你不奋斗\"，引用毛主席\"与天奋斗，其乐无穷\"。君子不争是觉得\"天下事没什么好争的，好像大人看小孩争糕饼\"。"},{"stem":"\"君子周而不比，小人比而不周\"中\"周\"和\"比\"的差别是什么？","options":["周是团结，比是对立","周是厚重，比是浅薄","周是忠诚，比是背叛","周是普遍（公），比是偏党（私）——公私一念之差"],"answer":3,"explanation":"✅ 朱子注\"周，普遍也。比，偏党也。皆与人亲厚之意，但周公而比私耳。\"作者评\"公私一念之差，就分出了君子小人\"。"},{"stem":"\"视其所以，观其所由，察其所安，人焉廋哉？\"作者认为这一章是教人什么的？","options":["如何知人","如何治国","如何修身","如何交友"],"answer":1,"explanation":"✅ 作者直接说\"孔子不是讲'患不知人'么，这一章便是讲如何知人的。\"看动机（所以）、看过程（所由）、看归宿（所安）。"},{"stem":"孟子说\"存乎人者，莫良于眸子\"，这与孔子哪句话精神相通？","options":["君子不器","巧言令色","人而无信","视其所以，观其所由，察其所安"],"answer":0,"explanation":"✅ 作者在介绍孟子以\"眸子\"知人的方法后，引出了两种方法——孔子的\"视其所以\"和孟子的\"观其眸子\"，都是教人知人的方法。"},{"stem":"本书认为\"文献\"二字的含义是什么？","options":["文是典籍，献是贤人","所有书面材料","书籍和资料","传统文化的总称"],"answer":1,"explanation":"✅ 作者说\"徵，同证。文，是典籍。献，就是贤，贤人。\"夏商二代礼制不能充分验证，是因为杞宋两国的文献（典籍和贤人）不够。"},{"stem":"\"色难\"一章讲的是什么？","options":["打扮很难","颜色很难辨认","孝最难的是对父母和颜悦色——养口体不如养志","改变脸色很难"],"answer":3,"explanation":"✅ 作者引用《孟子》曾子养曾皙的典故，说明曾子是\"养志\"（让父母心情舒畅），曾元是\"养口体\"（只管吃饱穿暖），真正的孝是养志而非养口体。"},{"stem":"全书引用毛主席语录最多的章节是关于什么的？","options":["阶级斗争","革命理论","学习方法","温良恭俭让"],"answer":1,"explanation":"✅ 在解释\"温良恭俭让\"时，作者引用了毛主席《湖南农民运动考察报告》中的话：\"革命不是请客吃饭……不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。\""},{"stem":"作者对\"为政以德，譬如北辰居其所而众星拱之\"给出了两种解释，其中第二种是什么？","options":["以武力服人","以法治国","以德服人","\"德\"解释为有德之人——治国要用有德之人"],"answer":0,"explanation":"✅ \"'德'也可解释成有德之人。'为政以德'就是治国要用有德之人。这样解释就更实一点。\""},{"stem":"王安石的《读孟尝君传》被作者用来阐述什么道理？","options":["用人之道——\"举直错诸枉，则民服\"","文章写作方法","法治的重要性","鸡鸣狗盗的重要"],"answer":1,"explanation":"✅ 在解读\"举直错诸枉，则民服\"时引用此文——孟尝君\"特鸡鸣狗盗之雄耳，岂足以言得士\"——全是鸡鸣狗盗之徒，所以真正的士人不来了。"},{"stem":"作者如何解读\"不患人之不己知，患不知人也\"？","options":["什么都不担心","不怕别人不了解自己，怕自己不了解别人","既怕别人不了解自己，也怕自己不了解别人","只担心别人不了解自己"],"answer":2,"explanation":"✅ 作者引《出师表》\"亲贤臣，远小人\"来说明知人的重要性——\"知人与否，小则关系自身，大则关系国家\"。又引王夫之的话批评\"患己知之不早\"的阿世心态。"},{"stem":"\"子入太庙，每事问。或曰：'孰谓邹人之子知礼乎？'\"孔子的回应是什么？","options":["我是在考别人","你们不懂礼","我确实不懂礼","是礼也（每事问本身就是礼）"],"answer":1,"explanation":"✅ 孔子说\"是礼也\"——\"每事问\"本身就是礼的表现，体现了忠信诚谨好学的态度。"},{"stem":"本书引用\"少成若天性，习惯成自然\"来说明什么？","options":["天性不可改","小时候养成的习惯至关重要——\"正邪雅俗，大多是以小时候一念之差分开的\"","天才不需要努力","人的命运是注定的"],"answer":3,"explanation":"✅ 作者引用此古谚说明\"以躬行为本\"的重要性。还讲述父亲幼时被问人生信条，答曰\"但做好事，莫问前程\"。"},{"stem":"\"慎终追远，民德归厚矣\"在作者爷爷那里的理解是什么？","options":["关于丧祭的","以前家庙匾上就是这四个字","两种都提到","关于始终如一的"],"answer":0,"explanation":"✅ 作者说两种解释都好——\"慎终追远\"既可以是\"丧尽其礼，祭尽其敬\"（丧祭），也可以是\"慎终如始，久要不忘平生之言\"。还提到\"以前家庙的匾上就是这四个字\"。"},{"stem":"\"道千乘之国，敬事而信，节用而爱人，使民以时。\"作者说这五点\"看起来浅显的未必浅显\"，原因是？","options":["这只是表面意思","语言优美","如果真有做到，虽大国可治","有历史典故"],"answer":2,"explanation":"✅ 作者说\"这五点看起来浅显，但是如果真有做到，虽大国可治……找到大本大源，其他的东西真是如高屋建瓴。\""},{"stem":"\"人而无信，不知其可也。大车无輗，小车无軏，其何以行之哉？\"这个比喻说明什么？","options":["马车比人更可靠","信用像车轮一样重要","造车需要信用","没有信用如同车没有关键连接部件，寸步难行"],"answer":3,"explanation":"✅ 輗和軏是车上的关键部位，没有它们车就走不了——信用就是人生的\"輗軏\"。"},{"stem":"本书对\"事君尽礼，人以为谄也\"的理解是什么？","options":["应该减少礼节","礼节是多余的","因为当时人不能尽礼，所以把尽礼的人当成谄媚","孔子确实在谄媚"],"answer":0,"explanation":"✅ 作者说\"人以为谄，其实是因为人不能尽礼。\"——不尽礼的人把正常的礼节当成了谄媚。"},{"stem":"\"君使臣以礼，臣事君以忠\"——作者对这句话的阐释核心是什么？","options":["君臣是平等的","上下各有责任——君对臣要守礼，臣对君要尽忠","君主可以随意对待臣子","臣忠于君最重要"],"answer":3,"explanation":"✅ 作者说\"以上临下，不难于有情，却难于有礼。以下事上不难于有礼，却难于有情。\"这句话体现了双向责任。"},{"stem":"1970级工农兵学员批判\"温故而知新\"为\"根本错误的\"，作者的态度是什么？","options":["中立","完全赞同","完全否定","以此为由提出对\"故\"的新解——解为\"己所素习\""],"answer":3,"explanation":"✅ 作者叙述了工农兵学员的批判后，提出现在把\"故\"解释成旧的知识\"显然是不合时宜的\"，解成\"己所素习\"（自己已经熟练掌握的）更好。"},{"stem":"\"射不主皮，为力不同科，古之道也。\"射箭不重穿透力的道理是什么？","options":["君子尚礼不尚力","节省力气","古代的箭质量不好","靶子做得不好"],"answer":0,"explanation":"✅ 作者说\"主皮之射就是崇尚武力。君子无所争，君子尚礼不尚力。\""},{"stem":"孟子说\"仁者如射，射者正己而后发，发而不中，不怨胜己者，反求诸己而已矣\"，这对应什么道理？","options":["反对竞争","射箭技巧","君子求诸己——凡事从自身找原因","射箭比射靶更重要"],"answer":0,"explanation":"✅ 射不中不怨恨胜过自己的人，反而从自己身上找原因——这就是\"君子求诸己\"的精神。"},{"stem":"如果一个人想学习如何\"知人\"，根据本书应该先用什么方法？","options":["查档案","多跟人聊天","看面相","先拿看人的法子来看自己——\"想要知人，先要自知\""],"answer":1,"explanation":"✅ 作者在\"视其所以\"章末尾说\"想要知人，先要自知。先拿看人的法子来看一看自己……把自己看明白了，责己再严厉一些，再去看别人。\""},{"stem":"全书中反复出现的一个核心读书方法论是什么？","options":["以《孟子》解《论语》，读第一手材料而非仅读注疏","记笔记","只读不思考","速读"],"answer":0,"explanation":"✅ 作者频繁引用《孟子》、王夫之等经典来互证，强调\"以《孟子》解《论语》是比较好的\"、结合多种版本互相参看，而非孤立地读经。"}]},{"name":"疯传","author":"乔纳·伯杰（Jonah Berger，宾夕法尼亚大学沃顿商学院市场营销学教授，通","questions":[{"stem":"根据本书研究，人们的购买决策有多大比例主要受口头传播影响？","options":["5%-10%","20%-50%","90%以上","60%-80%"],"answer":0,"explanation":"✅ 作者明确指出\"研究结果显示，我们有20%-50%的购买决策主要是受到口头传播的影响\"。"},{"stem":"作者总结的让传播具有感染力的原则共有几个？","options":["六个","十个","三个","四个"],"answer":2,"explanation":"✅ 六大原则：社交货币、诱因、情绪、公共性、实用价值和故事。"},{"stem":"\"社交货币\"这个比喻的核心含义是什么？","options":["用金钱换社交关系","花钱买朋友","通过分享信息来获得他人的好评和积极印象","在社交媒体上花钱打广告"],"answer":2,"explanation":"✅ \"就像人们使用货币能够购买商品和服务一样，使用社交货币能够获得家人、朋友和同事的更多好评和更积极的印象。\""},{"stem":"噜啦啦网站2009年的销售额达到了多少？","options":["350万美元","3.5亿美元","3.5亿美元","35亿美元"],"answer":1,"explanation":"✅ 噜啦啦要求会员注册才能购物，限时抢购的策略使其2009年销售额达到3.5亿美元。"},{"stem":"为什么有时候义工的积极性比拿钱的员工还高？","options":["义工没有工作压力","义工更有道德感","金钱会腐蚀个人的成就动机","义工比职业人士更专业"],"answer":1,"explanation":"✅ 作者明确指出\"金钱会腐蚀个人的成就动机。这就是为什么网上有很多义务的版主、活动组织者的原因。给他们道德感，而不是钱。\""},{"stem":"\"诱因\"策略中，奇巧巧克力的做法是什么？","options":["加大广告投入","将巧克力与咖啡关联——让人们想到咖啡就想到奇巧","降价促销","请明星代言"],"answer":1,"explanation":"✅ 奇巧经过调研发现人们吃巧克力时常伴随喝咖啡休息，于是创造广告\"拿着奇巧巧克力找咖啡，或者拿着咖啡找奇巧\"。这就是人为制造诱因。"},{"stem":"哪首歌因为名字叫《星期五》而在星期五的点播率特别高？","options":["《See You Again》","《Yesterday》","《Happy》","网上流行的某首歌"],"answer":1,"explanation":"✅ \"网上流行一首很难听的歌，仅仅因为它的名字叫《星期五》，人们在星期五那天的点播率特别高。\"这是\"周围环境刺激\"（诱因）的经典案例。"},{"stem":"在超市播放不同国家的音乐，消费者会倾向于购买对应国家的酒——这个实验说明了什么？","options":["法国酒更好喝","周围环境的刺激可以作为诱因影响行为","音乐影响心情","德国音乐更受欢迎"],"answer":0,"explanation":"✅ 播放法国音乐时多数人买法国红酒，换德国音乐则买德国红酒——环境刺激直接成为行为诱因。"},{"stem":"\"即使你是原始人，也可以购买政府雇员保险\"——这句广告词为什么很少被人谈论？","options":["太长了","不够幽默","虽然气势足但没有任何诱因","人们不喜欢保险公司"],"answer":0,"explanation":"✅ 作者明确指出这句话\"很有气势，但没有任何诱因。所以很少被人谈到。\"而百威的\"wassup\"风靡全球是因为年轻人见面喝酒就说这句话——有天然诱因。"},{"stem":"玛氏巧克力条与什么自然物同名为它的传播创造了天然诱因？","options":["地球","火星","太阳","月球"],"answer":1,"explanation":"✅ \"玛氏巧克力条因为与火星这个自然物同名，因此只要人们想到或谈及美国宇航局成功登陆计划，就会不自觉地想到玛氏巧克力条。\""},{"stem":"有效诱因最重要的因素是？","options":["广告投入","激活频率——刺激物在日常生活中出现的频繁程度","新颖性","趣味性"],"answer":1,"explanation":"✅ 最重要的是激活频率，\"即刺激物能够多么频繁地出现在人们的日常生活中\"。奇巧+咖啡、红牛+能量、加多宝+上火等都是高频诱因的经典例子。"},{"stem":"《美航毁了我的吉他》这首歌发布后，美航遭受了什么损失？","options":["被政府罚款","股价下跌10%，直接损失1.8亿美元","CEO辞职","赔了3500美元"],"answer":2,"explanation":"✅ 加拿大歌手戴夫的吉他被美航摔坏索赔无果，他把愤怒写成歌并拍成MTV。一天内点击300万次，四天后美航股价下跌10%，直接损失1.8亿美元。时代杂志将其列为十大金曲。"},{"stem":"根据心理学家的二维情绪分类，哪种情绪组合最容易激发传播行为？","options":["积极+低唤醒","高唤醒（无论积极或消极）","中性情绪","消极+低唤醒"],"answer":0,"explanation":"✅ 高唤醒的积极情绪（敬畏、兴奋）和高唤醒的消极情绪（愤怒、焦虑）都容易传播。低唤醒情绪（满足、悲伤）反而抑制传播。"},{"stem":"沃顿商学院的\"慢跑vs静坐\"实验中，慢跑组愿意分享信息的比例是多少？","options":["25%","75%","100%","50%"],"answer":0,"explanation":"✅ 慢跑组75%愿意分享，比静坐组高一倍——身体的唤醒也可以促进分享。"},{"stem":"什么情绪容易\"麻痹人们的行动能力\"从而抑制分享？","options":["焦虑","满足","恐惧","愤怒"],"answer":1,"explanation":"✅ \"有些情绪甚至有抑制行为的反效果。比如满足的情绪，容易麻痹人们的行动能力。失去一个宠物后你会什么也不想做，这就是低唤醒。\""},{"stem":"乔布斯为什么不能忍受苹果标志在笔记本打开时从对面看是反的？","options":["成本控制","公共可视性——让产品为他人在使用场景中做广告","设计美学","品牌一致性"],"answer":1,"explanation":"✅ \"乔布斯最重视公共可视性。乔布斯知道，人们会随时随地观察他人的所作所为，并随之模仿。\""},{"stem":"调查1500万辆轿车销售记录后，发现多大比例的销售受邻居影响？","options":["4","1","1","2"],"answer":2,"explanation":"✅ \"在调查了1500万辆轿车的销售记录后，乔纳·伯杰教授给出这样的结论，近八分之一的轿车销售受到像邻居这种的社会影响。\""},{"stem":"耐克的黄色腕带最终卖掉了多少条？","options":["8500万条","500万条","1000万条","1亿条"],"answer":1,"explanation":"✅ 耐克以阿姆斯特朗为主题发布黄色腕带，6个月卖光500万条，eBay炒到10倍价，最终卖掉8500万条。这体现了\"行为剩余\"的巨大力量。"},{"stem":"\"行为剩余\"是指什么？","options":["退货率","销售额减去成本","消费者在产品使用后还能留下的、影响他人的可见痕迹","消费者没花完的钱"],"answer":2,"explanation":"✅ \"人们在消费了产品之后还会做些什么，能否对周围的顾客产生进一步的影响，这就叫做行为剩余。\""},{"stem":"南希·里根的反毒品广告为什么反而让更多青少年吸毒？","options":["广告拍得太糟糕","广告让吸毒行为可视化，似乎成为常见现象","广告播放次数不够","青少年叛逆心理"],"answer":3,"explanation":"✅ 反毒品广告展示了吸毒场景，让吸毒行为\"可视化\"，给了青少年一种错觉——这似乎是一种常见的社会现象。"},{"stem":"一个原价350美元的烤炉降到250美元，另一个原价255美元降到240美元，为什么更多人选第一个？","options":["第一个品牌更好","第一个质量更好","第一个更便宜","人们根据比较原则（降幅）而非绝对经济原则评价"],"answer":2,"explanation":"✅ 这是2002年诺贝尔奖得主卡尼曼的\"有限理性原理\"——第一个降了100美元（看起来更划算），第二个只降了15美元，虽然绝对价格更低，但降幅不大。"},{"stem":"\"100规则\"建议什么？","options":["折扣不低于100美元才有吸引力","产品定价应该是100的倍数","价格低于100美元用百分比显示优惠，高于100美元用绝对金额","每年促销100天"],"answer":2,"explanation":"✅ \"商品价格以100美元为分界点，价格低于100美元时采用'%'显示价格优惠；高于100美元时采用绝对的金额折扣。\""},{"stem":"疫苗导致孤独症的帖子造成了什么影响？","options":["让儿童疫苗销售一落千丈（后证明是伪科学）","没有任何影响","推动疫苗研发","让更多人了解了孤独症"],"answer":0,"explanation":"✅ 该帖子\"使得儿童疫苗销售一落千丈。事后被证明这是一篇伪科学文章\"——但信息的有用性比其真实性更容易影响传播。"},{"stem":"特洛伊木马的故事被用来比喻什么？","options":["最好的战争策略","故事作为一种载体，让商业信息嵌入其中自然传播","希腊和特洛伊的战争","商业竞争"],"answer":3,"explanation":"✅ \"创建一个特洛伊木马即创建一个让人们持续谈论的载体，进而使人们持续地谈论我们的产品、思想和行为。\""},{"stem":"樊登读书会郭俊杰在面馆的故事体现了哪种传播原则？","options":["公共性","故事——将产品价值嵌入真实故事中","诱因","社交货币"],"answer":3,"explanation":"✅ 郭俊杰用iPad向面馆老板娘展示育儿视频，老板娘当场成为会员——这体现了将产品价值嵌入真实故事中的传播力量。"},{"stem":"作者认为商家在传播中常犯的最大误区是什么？","options":["关注怎样让人们谈论，却忽略了最想让人们谈论的内容","广告投入不够","价格太高","产品不够好"],"answer":1,"explanation":"✅ \"商家往往关注于怎样才能让人们谈论，而忽略了他们最想让人们谈论的内容。\"品牌或产品利益必须与故事相整合。"},{"stem":"根据本书，\"科学类文章\"流行的原因通常与以下哪种情绪有关？","options":["愤怒","快乐","敬畏之情","悲伤"],"answer":2,"explanation":"✅ \"科学类文章的渐进性创新或不断的发现与探索之旅能够激发出读者某种特殊的情绪，这就是敬畏之情。敬畏之情通过带给人震撼和感动来激发共享行为。\""},{"stem":"航空公司积分累积中，不到10%的人实际兑换里程却仍然累积，作者以此说明什么？","options":["积分制度设计失败","消费者很傻","杠杆原理——参与晋级游戏让人类找到社会中的优越感","航空公司的营销骗局"],"answer":2,"explanation":"✅ 这是社交货币中的\"杠杆原理\"——\"参加这样的晋级游戏可以让灵长类动物找到社会中的优越感\"，积分、徽章、等级卡都是这一原理的应用。"},{"stem":"根据本书，\"临时口碑传播\"和\"持续性口碑传播\"的区别在于什么？","options":["前者是线上，后者是线下","前者是正面，后者是负面","前者只发生在刚接触新事物时，后者可持续数周数月","前者快后者慢"],"answer":3,"explanation":"✅ 临时口碑传播发生在刚接触事物时，只宣传细节体验（电影、新奇有趣产品）；持续性口碑传播在长时间内持续（几周到几个月甚至更长）。"},{"stem":"以下哪种做法本书明确反对（作为反面教材）？","options":["通过展示错误行为来呼吁反对它","用稀缺性制造社交货币","用故事包装商业信息","在广告中出现消费场景"],"answer":0,"explanation":"✅ 南希·里根的反毒品广告让吸毒行为可视化→更多青少年吸毒。\"没有买卖就没有伤害\"同理。\"假如你不希望看到更多错误行为的发生，就不要向人们强调这些错误行为。\""},{"stem":"\"像闺蜜们说'别告诉别人'，这样的消息传得最快\"——这体现了什么策略？","options":["情绪策略","故事策略","稀缺性和专用性——让人感觉\"自己是自己人\"","诱因策略"],"answer":2,"explanation":"✅ 这是社交货币中的\"使人们感觉像自己人\"策略——稀缺性和专用性让会员感受到归属感，\"别告诉别人\"反而是传播最快的信号。"},{"stem":"美国口碑经纪公司的模式中，参与者不需要支付费用，他们能得到什么？","options":["公司股份","现金报酬","工作机会","提前使用新产品的权利和折扣券"],"answer":0,"explanation":"✅ \"代理公司不需要支付给参与者任何费用。参与者能够得到提前使用新产品的权利，而且不会有任何推销压力。\""},{"stem":"根据本书，创造人为诱因的前提条件是什么？","options":["请明星代言","做好搜索引擎优化","找到与人们日常生活中高频出现的事物的关联","有足够的广告预算"],"answer":3,"explanation":"✅ 奇巧利用咖啡（高频出现）、红牛利用能量、加多宝利用上火——都是将品牌与高频日常事物关联。\"一个强大的诱因会比引人注目的标语更具有宣传效果。\""},{"stem":"书中提到\"红色代表了太多东西，所以现在不能再诱发任何东西\"，这说明了什么？","options":["红色不好看","诱因不要过度连接——刺激频繁性与强度的配合度要恰当","颜色对营销没用","要用冷色调"],"answer":1,"explanation":"✅ \"如果把一个产品或一种思想与太多的事情相联接，就会导致人们记忆的不清晰。\"诱因需要精确而非泛滥。"},{"stem":"\"模仿产生的原因\"中，作者提到的\"社会证明\"是指什么？","options":["需要科学证据","需要名人推荐","需要政府审批","别人都这么做，我也该这么做，以证明我不是异类"],"answer":3,"explanation":"✅ \"这就是为什么排队越长的餐厅越多人去排队的原因\"——社会证明让人们觉得\"既然这么多人选，应该错不了\"。"},{"stem":"宝马广告《The Hire》中运用了什么来激发传播？","options":["消极情绪（枪战、绑架等危险场景）的高唤醒效果","幽默","明星效应","积极情绪"],"answer":0,"explanation":"✅ 一反阳光明媚的汽车广告套路，将宝马置于枪战、绑架、政变、器官运输等危险场景中——利用消极情绪的高唤醒效果成功激发传播。"},{"stem":"根据六大原则的清单，以下哪项搭配是错误的？","options":["情绪→用悲伤激发分享","公共性→让消费行为可视化","社交货币→让人们觉得自己内行","诱因→让产品与日常事物关联"],"answer":2,"explanation":"✅ 悲伤是低唤醒情绪，会抑制分享行为。应该用高唤醒情绪（敬畏、兴奋、愤怒、焦虑）来激发分享。"},{"stem":"书中提到的\"毒性寄生虫战略\"是什么？","options":["恶意抹黑竞争对手","在竞争对手产品中植入病毒","收购竞争对手","让竞争对手成为自己品牌的诱因（如百事可乐对可口可乐）"],"answer":3,"explanation":"✅ \"让竞争对手成为自己品牌的诱因也是一种高明的策略，这也被称为毒性寄生虫战略。比如百事可乐对可口可乐所做的事。\""},{"stem":"让更频繁地诱导产品可以增加多少口碑传播行为？","options":["50%","100%","5%","至少15%"],"answer":3,"explanation":"✅ \"更频繁地诱导产品能够增加至少15%的口碑传播行为。\""},{"stem":"为什么把\"吃蔬菜\"的倡议印在餐盘上比在食堂外挂条幅效果好？","options":["餐盘上的信息更权威","打饭那一刻，诱因是最直接的","餐盘更便宜","条幅不够美观"],"answer":3,"explanation":"✅ 环境刺激作为诱因，时机最重要——在决策发生的瞬间提供诱因，效果最直接。"},{"stem":"在超市播放法国音乐，多数人买法国红酒；换成德国音乐，多数人买德国红酒。这个案例体现了什么？","options":["法国红酒质量更好","德国啤酒更受欢迎","红酒和啤酒是替代品","消费者被环境中的音乐暗示而无意识地影响了选择"],"answer":0,"explanation":"✅ 这是诱因的典型案例——\"周围环境的刺激\"作为不易察觉的信号，引导了消费者的无意识选择。"},{"stem":"乔纳·伯杰的研究得出了关于\"兴趣大小与谈论次数\"的什么结论？","options":["兴趣大小、新奇性、刺激水平与人们谈论产品的次数没有关系","新奇性越高谈论越多","兴趣越大谈论越多","刺激水平越高谈论越多"],"answer":2,"explanation":"✅ 这是一个\"令人沮丧的结论\"——打破了很多广告人的常规假设。真正促进传播的是诱因而非新奇性本身。"},{"stem":"如果你想推广一个新产品，根据\"公共性\"原则，你应该怎么做？","options":["只向高端客户推荐","低调保密","只在网上宣传","让产品的使用尽可能在公开场合可见"],"answer":3,"explanation":"✅ \"让某些事物更具观察性，就可以让他们更好地被模仿\"——让消费行为可视化是公共性原则的核心。"},{"stem":"书中提到\"制造神秘和争议\"是铸造社交货币的要素之一，其原理是什么？","options":["神秘感让产品更高端","争议就是最好的广告","争议能吸引法律关注","神秘和争议让人们讨论时显得自己有独到见解（增加社交货币）"],"answer":0,"explanation":"✅ \"制造神秘和争议也是产生非凡吸引力的两大要素\"——当人们讨论有争议或神秘的话题时，传递的是\"我知道一些你不知道的事\"的社交货币。"},{"stem":"书中引用的\"有限理性原理\"由哪位诺贝尔奖得主提出？","options":["纳什","卡尼曼","萨缪尔森","弗里德曼"],"answer":3,"explanation":"✅ \"这就是2002年诺贝尔经济学奖得主卡尼曼的有限理性原理。人们并非绝对按照经济原则去评价事物，而是根据比较原则来评价事物。\""},{"stem":"一个化妆品制造商的APP\"不仅提供天气预报，还提供专业护肤策略\"——这种做法体现了什么？","options":["科技产品的高溢价","业务多元化","免费服务吸引客户","提供超越产品本身的实用价值，让顾客愿意分享"],"answer":3,"explanation":"✅ \"除了分享打折优惠信息之外，你还可以让顾客分享各种实用信息\"——天气预报APP附带专业护肤策略就是让品牌信息嵌入实用工具中。"},{"stem":"作者在全书最后提供的\"六原则清单\"意在做什么？","options":["作为实操检查表——对照每个原则审视自己的传播策略","总结全书","考读者","证明六个原则都正确"],"answer":0,"explanation":"✅ 六大原则构成一个完整的传播力评估框架，可用于检查产品、思想或行为是否具备疯传的潜质。"},{"stem":"根据本书，什么样的信息最有可能在朋友圈被分享？","options":["最长的文章","最客观中立的信息","能让分享者显得聪明、有趣、有见识的信息（社交货币）+ 高唤醒情绪 + 实用价值","最正式的文章"],"answer":0,"explanation":"✅ 本书的核心结论——高分享内容同时满足：提升分享者形象（社交货币）、激发高唤醒情绪、提供实用价值、嵌入易于传播的故事中。"},{"stem":"\"消极的评价或者恶劣的口碑\"也可能增加销量，本书给出了什么例子？","options":["可口可乐","没有这种可能","苹果公司","黄西、吴莫愁、京东网和奶茶妹"],"answer":1,"explanation":"✅ 黄西、吴莫愁都曾被负面评价包围，京东也因为\"奶茶妹\"话题引发大量讨论——但这些话题带来了巨大的曝光量。"},{"stem":"一个创业者想让自己的产品\"疯传\"，根据本书，他最不应该做的是哪件事？","options":["花钱请明星硬广","创建与品牌价值契合的故事","设计一个让用户显得有面子的分享机制","找到产品与日常高频事物的关联"],"answer":0,"explanation":"✅ 全书反复强调，传统广告（特别是单纯花钱买曝光的硬广）的效果远不如口头传播、社交货币、诱因等自然传播策略。花钱买广告是最低效的传播方式之一。"}]}];

function buildTabs(){
  var html=books.map(function(b,i){
    var answered=0;
    for(var j=0;j<b.questions.length;j++){if(answers[i+'-'+j]!==undefined)answered++;}
    return '<div class="book-tab'+(i===currentBook?' active':'')+'" onclick="switchBook('+i+')">'+b.name+'<div class="tab-progress">'+answered+'/'+b.questions.length+'</div></div>';
  }).join('');
  document.getElementById('bookTabs').innerHTML=html;
}
function switchBook(i){currentBook=i;currentQ=0;refresh();}
function refresh(){buildTabs();showQuestion();updateNavButtons();}
function goPrev(){if(currentQ>0){currentQ--;showQuestion();updateNavButtons();}}
function goNext(){var qs=books[currentBook].questions;if(currentQ<qs.length-1){currentQ++;showQuestion();updateNavButtons();}}
function updateNavButtons(){
  var qs=books[currentBook].questions;
  document.getElementById('btnPrev').disabled=(currentQ===0);
  document.getElementById('btnNext').disabled=(currentQ>=qs.length-1);
  var key=currentBook+'-'+currentQ, hint=document.getElementById('navHint');
  if(answers[key]===undefined){hint.textContent='未作答';return;}
  hint.textContent=(answers[key]===qs[currentQ].answer)?'✅ 正确':'❌ 错误';
}
function showQuestion(){
  var qs=books[currentBook].questions, q=qs[currentQ], b=books[currentBook];
  document.getElementById('qProgress').innerHTML='<span style="color:#f0c060;">'+b.name+'</span> · 第 <span class="q-number">'+(currentQ+1)+'</span> / '+qs.length+' 题';
  document.getElementById('qStem').innerHTML=q.stem;
  var body=document.getElementById('qBody'), key=currentBook+'-'+currentQ, prevAns=answers[key];
  body.innerHTML='<div class="options">'+q.options.map(function(opt,i){
    var cls='option';
    if(prevAns!==undefined){cls+=' disabled';if(i===q.answer)cls+=' correct';else if(i===prevAns&&prevAns!==q.answer)cls+=' wrong';}
    var label=String.fromCharCode(65+i);
    return '<div class="'+cls+'" onclick="'+(prevAns===undefined?'answerChoice('+i+')':'')+'">'+label+'. '+opt+'</div>';
  }).join('')+'</div>';
  var explDiv=document.getElementById('qExplanation');
  if(prevAns!==undefined&&q.explanation){explDiv.className='explanation show';explDiv.innerHTML='💡 '+q.explanation;}
  else{explDiv.className='explanation';explDiv.textContent='';}
  updateScoreboard();
}
function answerChoice(idx){
  var key=currentBook+'-'+currentQ;
  if(answers[key]!==undefined)return;
  answers[key]=idx;showQuestion();updateNavButtons();
}
function updateScoreboard(){
  var total=0,correct=0;
  for(var b=0;b<books.length;b++)for(var j=0;j<books[b].questions.length;j++){
    var key=b+'-'+j;if(answers[key]===undefined)continue;
    total++;if(answers[key]===books[b].questions[j].answer)correct++;
  }
  var wrong=total-correct, pct=total>0?Math.round(correct/total*100):0;
  var totalQ=0;for(var b=0;b<books.length;b++)totalQ+=books[b].questions.length;
  document.getElementById('sbProgress').textContent=total+'/'+totalQ;
  document.getElementById('sbCorrect').textContent=correct;
  document.getElementById('sbWrong').textContent=wrong;
  document.getElementById('sbScore').textContent=pct+'%';
}
function showAllAnswers(){books[currentBook].questions.forEach(function(q,qi){answers[currentBook+'-'+qi]=q.answer;});refresh();}
function resetCurrentBook(){books[currentBook].questions.forEach(function(_,qi){delete answers[currentBook+'-'+qi];});currentQ=0;refresh();}
function resetAll(){answers={};currentBook=0;currentQ=0;refresh();}
init();
</script>
</body>
</html>
