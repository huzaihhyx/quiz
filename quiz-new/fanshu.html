],"answer":2,"explanation":"✅ 成长型思维学生抓住学习机会积极报名，固定型思维学生为\"在短时间内看上去聪明\"宁愿不参加——把暴露不足看作危险。德韦克说\"固定型思维模式就这样将人们变成了不爱学习的人\"。"},{"stem":"德韦克指出固定型思维和抑郁症之间的关系是什么？","options":["两者无关","固定型思维者更乐观","固定型思维不会抑郁","固定型思维抑郁程度更高，且更倾向于什么都不做"],"answer":3,"explanation":"✅ 固定型思维者反复思考问题和挫折，\"有句话不停在我脑海里盘旋：你是个笨蛋\"。抑郁越深越破罐破摔。而成长型思维者抑郁越深，越能下定决心采取行动对抗问题。"},{"stem":"关于夸奖孩子的危险性，德韦克的研究发现了什么？","options":["夸奖总是好的","怎么夸都一样","不应该夸奖","夸\"你真聪明\"反而让孩子害怕挑战，选简单任务；夸\"你很努力\"让孩子更愿意挑战"],"answer":3,"explanation":"✅ 德韦克的经典实验：被夸\"聪明\"的孩子后续选择简单任务（保护聪明标签），成绩下降；被夸\"努力\"的孩子选择更难的任务，成绩提升。这章对家长和教育者有重要意义。"},{"stem":"哥伦比亚大学化学预科生的研究发现什么？","options":["所有学生都用同样方法学习","固定型思维学生更聪明","固定型思维学生即使学不会也不愿改变学习方法；成长型思维学生积极尝试不同学习方法","化学课很简单"],"answer":2,"explanation":"✅ 固定型思维学生阅读课本→不懂就再读一遍→背下来→考不好就认为\"化工不适合我\"。成长型思维学生\"寻找串联各讲座的主题\"\"不断审视错误直到弄明白\"\"保持学习动力\"。"},{"stem":"关于\"人是可以被改变的\"，德韦克的观点是什么？","options":["一切都可以被改变","什么都改变不了","能力可以通过努力培养，但并不是一切都要改变——有些个人偏好不需要改","只有智力可以改变"],"answer":2,"explanation":"✅ 德韦克举出租车司机的故事：他讨厌歌剧但父亲爱听，他花了很多年试图培养对歌剧的兴趣，完全没用。德韦克说\"饶了你自己吧，很多有教养的人都欣赏不了歌剧，为什么你就不能接受？\""},{"stem":"保罗·塞尚（Paul Cézanne）早期画展中大量作品非常糟糕，但他后来成了现代艺术奠基人之一。这说明什么？","options":["塞尚没有天赋","他运气好","艺术不需要技术","潜能需要时间绽放——\"成长型思维者知道想让潜能开花绽放需要一定时间\""],"answer":3,"explanation":"✅ 德韦克用塞尚的例子说明：即使是艺术大师，早期作品也可能很糟糕。潜能不是固定的——通过时间、磨炼和成长，人可以发展出惊人的能力。"},{"stem":"克里斯托弗·里夫（\"超人\"演员）颈部以下完全瘫痪后，他做了什么？","options":["靠药物维持","接受现实放弃","开始艰难复健训练，5年后恢复了部分活动能力——改变了科学对神经系统的认知","隐退"],"answer":2,"explanation":"✅ 里夫的案例是成长型思维的最高体现：医生说他必须\"接受现实\"，但他通过电击刺激训练，从手、到胳膊、到腿逐步恢复。他不仅提升了自身能力，还改变了医学对脊椎损伤恢复潜力的看法。"},{"stem":"德韦克认为人们对努力的态度在不同文化中有何表现？","options":["所有文化都同样重视努力","美国、法国等文化中都存在贬低努力的倾向——崇拜\"天生才能\"和\"不费吹灰之力的成功\"","没有差异","东方文化更不重视努力"],"answer":1,"explanation":"✅ 德韦克引用格拉德维尔的话：\"作为一个社会群体，我们更看重天生的、无须努力就能取得的成就\"。杜克大学报告、法国企业家谢瓦利埃的说法都证实了这种现象——在多种文化中人们都崇拜\"不费力的天才\"。"},{"stem":"关于孩子的固定型思维是如何形成的，德韦克的研究表明？","options":["只在学习中形成","天生的","成年后才形成","4岁就开始出现了——当孩子们开始有能力评估自己时，有些人开始畏惧挑战"],"answer":3,"explanation":"✅ 德韦克给4岁孩子选择拼图难度时，已发现固定型思维——他们选择安全的简单拼图，并说\"聪明的孩子不会犯错\"。思维模式从很小就开始形成，受环境、教育、评价方式影响。"},{"stem":"NBA总冠军教练菲尔·杰克逊（Phil Jackson）属于哪种类型的教练？","options":["铁腕独裁型","成长型思维——关注球员的全面发展和个人成长","放任自流型","固定型思维——只关注输赢"],"answer":1,"explanation":"✅ 书中描述杰克逊属于成长型思维教练的典范——他不仅关注胜利，更关注球员作为人的成长，尊重每个球员的独特性，培养团队合作而非依赖单个明星。"},{"stem":"如果你发现自己在说\"我就是不擅长数学\"，根据本书你应该怎么转化？","options":["找擅长数学的人帮忙做","接受这个事实","放弃数学","加上\"暂时还\"——\"我暂时还不擅长数学，但我可以通过努力和学习来提高\""],"answer":3,"explanation":"✅ 加上\"暂时还\"（not yet）就是成长型思维的核心转化。芝加哥某高中甚至用\"暂未通过\"（Not Yet）代替\"不及格\"（Fail），帮助学生认识到能力是可以发展的而不是固定的。"},{"stem":"心理学家罗伯特·斯腾伯格关于专长发展说了什么？","options":["专长和基因完全无关","\"人类的某项专长并不是固定的先天能力决定的，而是通过有目的的锻炼获得的\"","专长是天生的","专长只取决于环境"],"answer":1,"explanation":"✅ 斯腾伯格是当代智力研究权威，他的研究支持成长型思维——专长是锻炼培养出来的，不是固定天赋。他与前辈比奈的观点一致：\"一开始聪明的人不一定到最后还是最聪明的。\""},{"stem":"德韦克给追求\"不费吹灰之力达到完美\"的大学生的建议是什么？","options":["换专业","将挑战和努力看作成长的机会，而不是能力的缺失","降低标准","继续追求完美"],"answer":1,"explanation":"✅ 德韦克认为这种追求背后是固定型思维的陷阱——认为真正的聪明不需要努力。她建议学生重新认识努力的价值：努力不是能力不足的证明，而是激发潜能、取得成就的途径。"},{"stem":"一个7年级女孩总结成长型思维时说：\"我经常举手回答问题，因为如果错了，我的错误就可以得到纠正。\"这体现了什么？","options":["她很自信","不在乎面子","她喜欢表现","学习比\"显得聪明\"更重要——把犯错视为学习机会"],"answer":3,"explanation":"✅ 成长型思维者把犯错视为纠正和进步的机会，固定型思维者因怕犯错不敢举手。这个女孩说\"我通过这些做法来提升我的智力水平\"——完美诠释了成长型思维。"},{"stem":"德韦克说自己写这本书时的感受是什么？","options":["这是她做过最难的事之一，但她不介意让读者知道她付出了多少努力，因为这让她学到了一切","只是为了完成任务","后悔写这本书","很轻松"],"answer":0,"explanation":"✅ 德韦克用自身经历示范成长型思维：\"写这本书是我做过的最难的事情之一……在以前我确实希望你们觉得很容易，但现在我想让你们知道我为此付出了多少努力——以及它带给我的乐趣。\""}]},{"name":"认知天性","author":"彼得·C.布朗（Peter C. Brown，作家）、亨利·L.罗迪格三世（He","questions":[{"stem":"本书的核心发现是什么？","options":["反复阅读是最佳学习方法","耗费心血的学习才是深层次的，轻松的学习是无效的","天赋决定学习效果","学习越轻松效果越好"],"answer":1,"explanation":"✅ 从记忆研究中得出的最核心结论：学起来越吃力，记忆越长久牢固。\"轻松的学习就像在沙子上写字，今天写上，明天字就消失了。\""},{"stem":"什么是\"检索练习\"（Retrieval Practice）？","options":["从记忆中回想事实、概念或事件——如自测、小测验","听老师重复讲","抄写笔记","重新阅读课本"],"answer":0,"explanation":"✅ 检索练习就是主动从记忆中提取学过的知识。抽认卡是最简单的例子。检索本身会强化记忆、阻止遗忘——效果远好于重读课本或复习笔记。"},{"stem":"飞行员马特·布朗的培训发生了什么本质变化？","options":["从幻灯片被动听课→飞行模拟器主动检索练习（间隔+穿插+多样化）","从听课→听课","从飞行→理论","从理论→考试"],"answer":0,"explanation":"✅ 前7天纯粹坐在教室看幻灯片（\"填鸭速成\"），后11天在教室和飞行模拟器间轮换（主动参与、检索练习）。模拟器把抽象变形象、和个人息息相关，产生持久记忆。"},{"stem":"1分钱硬币实验说明什么？","options":["重复接触（见过无数次）不等于记住——\"重复本身并不能带来出色的长期记忆\"","需要加强常识教育","人们不认识硬币","硬币设计太复杂"],"answer":0,"explanation":"✅ 列出12张普通硬币图片让人找出正确的——几乎没人能做到。加州大学洛杉矶分校的教职员工也找不到离办公室最近的灭火器——尽管每天路过25年。"},{"stem":"哥伦比亚中学实验（社会学科和科学课）中小测验组与复习组的结果如何？","options":["小测验组科学课平均分A-，仅复习组C+","小测验组更低","复习组分数更高","没有差异"],"answer":0,"explanation":"✅ 八年级科学课上，纳入小测验的知识点平均分92(A-)，只复习不测验的知识点79(C+)。64%学生表示小测验减轻了考试焦虑，89%认为提升了学习效果。"},{"stem":"什么是\"间隔效应\"（Spacing Effect）？","options":["每天学习同一样东西","把练习分散在间隔时间中进行，比集中练习产生更牢固的长期记忆","连续学习效果最好","间隔越长越好"],"answer":1,"explanation":"✅ 有间隔的练习让记忆稍有遗忘后再检索——这需要更多努力，反而更巩固记忆。外科实习医生的显微手术实验是典型证明。"},{"stem":"外科显微手术培训实验中，一天上完四节课vs每周一节间隔一周，一个月后测试结果是什么？","options":["都失败了","间隔组在所有环节都远超集中组，16%集中组损伤了血管未完成手术","集中组表现更好","两组差不多"],"answer":1,"explanation":"✅ 间隔组在手术完成时间、手部移动次数、血管连接成功率、活鼠主动脉搏动情况等所有评估环节都优于集中组。更严重的是16%的集中组医生损伤了实验鼠其他血管未能完成手术。"},{"stem":"计算几何体体积的实验说明了什么？","options":["穿插练习即时成绩更差但一周后提高215%——63% vs 20%","两种方法没区别","不应该做数学题","集中练习效果最好"],"answer":0,"explanation":"✅ 集中组即时正确率89%，一周后仅20%；穿插组即时正确率60%，一周后63%。虽然开始时更费力，但长期记忆效果远胜集中练习。"},{"stem":"8岁孩子投沙包实验——只练3英尺距离vs练2英尺+4英尺距离，为什么后者在3英尺距离测验中表现更好？","options":["多样化练习提高了活学活用的能力——在不同条件下发展出更灵活的\"行为词汇表\"","随机结果","后者练得更多","3英尺太简单了"],"answer":0,"explanation":"✅ 多样化练习（不同距离投掷）让学习者更好地领悟背景差异，发展出更灵活的心理表征，适用范围更广。集中练习只在固定条件下有效而无法迁移。"},{"stem":"识别画家作品实验揭示的\"错觉\"是什么？","options":["集中组成绩更好","穿插组考试成绩更好，但学生仍坚持认为集中练习更有效——即使有亲身经历也不改变错误认知","两种方法一样好","学生能准确判断哪种方法更好"],"answer":1,"explanation":"✅ 穿插组的辨识效果更好，能正确归类从未见过的新作品，但学生仍相信集中练习更好。这证明了\"自以为精通\"的错觉非常顽固——\"集中练习的错误观念很难被拆穿\"。"},{"stem":"什么是\"合意困难\"（Desirable Difficulties）？","options":["学习中不应该有困难","短期让学习变慢但换来更牢固长期效果的困难——由比约克夫妇提出","任何困难都对学习有帮助","越难越好"],"answer":1,"explanation":"✅ 合意困难是那些能让学习过程更费力、但最终增强长期记忆和灵活应用的困难。如间隔练习、穿插练习、多样化练习、生成效应等。美国陆军跳伞学校就是利用合意困难培训的典型。"},{"stem":"学习的三个关键步骤是什么？","options":["预习、听课、复习","阅读、理解、记忆","输入、处理、输出","编码、巩固、检索"],"answer":3,"explanation":"✅ 编码=将感知转化为心理表征（短期记忆）；巩固=大脑稳定记忆痕迹并赋予含义、与已知关联（长期记忆）；检索=重新激活记忆强化路径（再巩固）。"},{"stem":"为什么\"生成效应\"（Generation Effect）对学习有效？","options":["因为生成正确答案很容易","不需要老师","只对简单问题有效","因为自己先尝试解决问题——即使失败——会让大脑在得知正确答案后进行更深层处理，建立更牢固连接"],"answer":3,"explanation":"✅ \"解决一个问题总要好过记住一个问题的答案。尝试一种解决方法但得出了错误的答案，也是要好于不去尝试的。\"——在被告知答案前自己的努力搜索会强化检索路径。"},{"stem":"反复阅读为什么效果不好？","options":["以上都是","不能永久记忆","流利阅读制造\"已经掌握\"的假象——元认知错觉","浪费时间"],"answer":0,"explanation":"✅ 反复阅读有三大不足：浪费时间、无法产生持久记忆、制造掌握假象。阅读越流利越觉得\"自己已掌握\"，但\"能背诵不等于理解、不等于会应用、不等于知道如何与已知联系\"。"},{"stem":"关于\"学习风格\"理论（视觉型/听觉型/动觉型），本书的立场是什么？","options":["缺乏实证支持——人类运用全部才能学习效果最好","部分正确","应该在教学中严格执行","完全支持"],"answer":0,"explanation":"✅ 广为流传的\"教学形式要与学习风格匹配\"的理论没有研究支撑。实证研究表明，运用\"眼观六路耳听八方\"的全部才能学习，效果要超过只用最熟悉的风格。"},{"stem":"什么是\"心智模型\"（Mental Model）？","options":["智商模型","人格类型","通过大量练习将复杂理论或连续技能融合为有意义的整体——大脑里的\"应用程序\"","心理疾病的一种"],"answer":2,"explanation":"✅ 如棒球击球手的心智模型=判断球路类型+击球姿势+跑垒策略+对手战术——全部融合为一个整体反应。经验丰富的球员比新手能更好处理球场上的繁多易变信息。"},{"stem":"本书提到\"在学习这件事上，谁的建议最有效\"，以下哪个答案正确？","options":["传统方法","直觉和经验","网上搜索到的建议","有实证研究基础的科学建议"],"answer":3,"explanation":"✅ 本书基于40多年认知心理学的实证研究——\"我们尽量避免讨论学术研究本身\"，而是把经过科学检验的成果转化为实用策略。那些\"点击几下鼠标就可获得\"的建议往往没有研究基础。"},{"stem":"关于测验的反馈时机，研究发现什么？","options":["不需要反馈","反馈对学习无影响","立即反馈最好","稍微延迟反馈比立即反馈产生更好的长期学习效果"],"answer":3,"explanation":"✅ 立即反馈就像自行车两侧的辅助轮——会让学习者产生依赖。延迟反馈让学习者在间隔一段时间后再检索和纠正，强化长期记忆。"},{"stem":"神经外科医生迈克·埃伯索尔德的故事说明了什么？","options":["直觉最重要","外科手术很危险","反思（晚上回想手术+思考改进方案）是一种有效的学习方式——检索+细化+演练","医生不应该思考太多"],"answer":2,"explanation":"✅ 埃伯索尔德描述：晚上回家回想手术中发生了什么，思考怎么改进缝合方式，第二天试验。\"反思会涉及多种认知活动：从记忆中检索知识、和新体验联系起来、预先演练下次可能的不同做法。\""},{"stem":"安德鲁·索贝尔教授的政治经济学课从\"填鸭教学+两次大考\"改成什么模式后效果显著提升？","options":["9次有计划的定期小测验替代突击测验和两次大考","完全取消考试","增加作业量","让学生自学"],"answer":0,"explanation":"✅ 最初尝试9次突击测验→学生厌恶、三分之一退课。后改为9次有计划的定期小测验+取消期中和期末大考→出勤率提高、作业质量天壤之别、课堂讨论热火朝天。"},{"stem":"跳伞学校的培训模式体现了哪些学习原则？","options":["随机培训","纯粹的理论教学","只用了集中练习","间隔练习+穿插练习+多样化练习+循序渐进难度+模拟真实条件"],"answer":3,"explanation":"✅ 从沙坑→2英尺平台→滑索→12英尺平台→34英尺跳伞塔→实地跳伞5次，每一步都模拟真实条件，不允许做笔记，测验是主要授课工具，体现了合意困难的原则。"},{"stem":"加州理工大学棒球队的击球实验证明了什么？","options":["集中练习效果更好","棒球不需要训练","随机穿插不同球路练习的球员击球表现明显更好——即使他们在练习中看起来没有那么熟练","天赋决定一切"],"answer":2,"explanation":"✅ 集中组同一种球连打15下，穿插组三种球路随机出现。6周后穿插组击球表现明显更好，即使他们都是有经验的球员。这再次证明：感觉学得慢 ≠ 学得不好。"},{"stem":"关于\"以写促学\"（Write-to-Learn）作为反思形式，研究发现了什么？","options":["写作对学习没有帮助","用自己的话撰写总结的学生成绩远高于只抄录的学生","抄录和自写效果一样","只有理科适用"],"answer":1,"explanation":"✅ 800多名大学生实验中，用自己的话重述概念并举例细化的学生考试得分远高于只从幻灯片中一字不差抄录的学生。两个月后虽然效果有所下滑但仍不错。"},{"stem":"关于记忆和遗忘，以下哪个说法正确？","options":["一旦记住就永远不会忘","遗忘是不可逆的","遗忘不是失去知识本身，而是失去了找到这些知识的检索线索","反复阅读能防止遗忘"],"answer":2,"explanation":"✅ 书中用\"杰克和吉尔→杰克和琼→杰克和珍妮\"的例子说明：被遗忘的不是知识本身，而是能让你找到并检索这些知识的线索。普鲁斯特的\"酸柠檬花茶蛋糕唤醒记忆\"同理——正确线索能打开旧记忆。"},{"stem":"关于\"学习迁移\"（Transfer），以下哪个描述正确？","options":["只有天才才能实现迁移","迁移是自动发生的","多样化、有间隔、有穿插的练习能提高在新环境下运用所学的能力","知识不能从一个领域迁移到另一个领域"],"answer":2,"explanation":"✅ 模拟真实情况中的挑战（如跳伞培训的渐进式多样化训练、棒球随机球路练习）能提高学习迁移——在新环境下运用所学。这就验证了\"把训练当成比赛，才能把比赛当成训练\"。"},{"stem":"本书驳斥了\"学习风格\"理论，原因是什么？","options":["所有学生都一样","实证研究不支持——没有证据显示匹配学习风格的教学效果更好","教学风格不重要","作者不喜欢这个理论"],"answer":1,"explanation":"✅ 书中明确指出：\"人类在学习时可以运用多种天分，而且在'眼观六路耳听八方'，运用全部才能和智谋学习时，效果要超过只用最熟悉的风格学习。\""},{"stem":"关于\"细化\"（Elaboration）的学习方法，以下哪个是正确的？","options":["用自己的语言把新知识表达出来，把它和已知联系起来","把问题变得更复杂","反复抄写","死记硬背"],"answer":0,"explanation":"✅ 细化就是理解新知识的过程——用自己的话表达、和已知关联。书中举例：学热空气湿度→联想空调滴水、夏天暴雨后变凉爽。\"新旧知识间的关联越多，就越有助于记忆。\""},{"stem":"关于睡眠对学习的影响，本书怎么说？","options":["睡眠似乎在巩固记忆中扮演重要角色——两次练习间隔至少一天是不错的做法","越少睡眠学习效果越好","只要睡了就行","睡眠与学习无关"],"answer":0,"explanation":"✅ 书中提到\"睡眠似乎在巩固记忆的工作中扮演了重要角色，所以在两次练习间至少间隔一天应该是不错的做法。\""},{"stem":"\"莱特纳盒子\"（Leitner Box）是什么？","options":["记忆药物","电脑程序","一个间隔练习系统——把抽认卡分到不同盒子，根据掌握程度决定练习频率","一种玩具"],"answer":2,"explanation":"✅ 德国科学家莱特纳发明的间隔练习体系：四个文件盒，盒子1（经常错→最频繁练习），盒子2（熟练→频率减半），以此类推。错过就往前挪一个盒子。掌握越好→练习越少→但永远不会彻底消失。"},{"stem":"本书提到\"智力水平在很大程度上由本人掌控\"，依据是什么？","options":["每当学到新东西时大脑就会发生改变——神经元连接被强化","主观感觉","所有人生来智力相同","智商测试可以提升"],"answer":0,"explanation":"✅ \"每当你学到新东西时，大脑就会发生改变——经验会被一点一滴地存储起来。不可否认每个人的天资不同，但我们可以通过学习，通过开发心智模型，来获得分析问题、解决问题以及创造新事物的能力。\""},{"stem":"海军陆战队中尉米娅·布伦戴特的跳伞培训故事体现了什么学习原则？","options":["不允许记笔记+测验是主要授课工具+难度逐步递增+多样化模拟→合意困难的有效应用","天赋决定一切","体能是关键","勇气比技术重要"],"answer":0,"explanation":"✅ 跳伞学校是合意困难的完美培训系统：不允许记笔记→倾听观察→从沙坑到34英尺塔到5次实地跳伞。她的第三次跳伞出了意外（撞到别人的降落伞），但培训让她冷静\"游出来\"。"},{"stem":"米娅第三次跳伞出了什么意外？","options":["设备故障","跳到了另一个伞兵张开的降落伞上面，被裹住——但她\"游\"了出来","降落伞没打开","降落在错误地点"],"answer":1,"explanation":"✅ 她落在前一个跳伞者的降落伞上被裹住。因为受过培训，她没有恐慌，挥动手臂\"游\"出了别人的伞，同时操控自己的伞躲开这个人。"},{"stem":"认知心理学家关于\"犯错\"在传统教学和现代观念中经历了怎样的转变？","options":["态度没有变化","认为永远不该让学生犯错","从斯金纳的\"无错误辨别学习\"（消除犯错机会）→认识到犯错也是努力的一部分，有纠正性反馈时犯错不会学到错误的东西","从认为犯错有用→认为犯错没用"],"answer":2,"explanation":"✅ 20世纪五六十年代斯金纳推崇\"无错误学习\"，现在认识到\"犯错并获得纠正性反馈时，学到的绝不是错误\"。\"对于认识到学习是困难过程、犯错是常事的人来说，他们会更愿意接受挑战。\""},{"stem":"关于\"知识诅咒\"（Curse of Knowledge）或\"错觉\"，以下哪个属于常见的学习错觉？","options":["流利阅读产生\"已掌握\"的感觉","反复接触产生\"记住了\"的感觉","听课很轻松产生\"理解了\"的感觉","以上都是"],"answer":3,"explanation":"✅ 书中强调元认知错觉的多种表现：流利阅读=假掌握、反复接触≠记住（1分钱实验）、听精彩的课≠理解了（考试时想不起来）。这些错觉让我们使用错误方法且不自知。"},{"stem":"关于自测（Self-testing），本书对学生最重要的建议是什么？","options":["不要自测","自测会让人焦虑","有规律地进行自测——重新校准自己知道什么、不知道什么","只在考试前自测"],"answer":2,"explanation":"✅ \"对于学习者来说，最好的习惯之一应该是进行有规律的自测，重新校准自己知道什么、不知道什么。\"西点军校毕业生把自测寻找重点的方法称为\"找方位\"——在高地找到参照物确保不迷失。"},{"stem":"加利福尼亚州立理工大学棒球队实验的球员对训练有何感受？","options":["两种训练都很舒服","穿插练习让他们感觉很有效","集中练习让他们感觉进步快，穿插练习让他们感觉不熟练——但实际数据相反","没有区别"],"answer":2,"explanation":"✅ 这再次证明了\"感觉\"的错误：集中组打同一种球\"舒服\"\"看上去很熟练\"；穿插组不确定下一球类型\"似乎没那么熟练\"。但6周后，穿插组实际击球表现显著更好。"},{"stem":"关于\"穿插练习\"在识别鸟类种类上的应用，研究发现？","options":["不需要训练","随机看没有用","集中看一个科效果更好","穿插看不同科的鸟效果更好，因为能帮助辨别物种间差异"],"answer":3,"explanation":"✅ 穿插练习提高了对不同种类差异性的辨识能力，同时不影响对同一类共性的学习。学习\"概念性知识\"（如分类学）尤其受益于穿插练习。"},{"stem":"道格拉斯·拉尔森医生对医学培训中\"参会听讲座\"的评价是什么？","options":["非常有效","不可或缺","应该增加","浪费资源——\"在一次被学习方法研究证明无效的活动上投入如此多的资源，是非常糟糕的一件事\""],"answer":3,"explanation":"✅ 拉尔森说医生们参会\"吃饭、听课、离场\"，从不复习、不测验、不回顾，参会内容很快忘光。\"如果要设计教育与培训体系避免或干预持续性遗忘\"，他建议会议结束时做小测验，之后安排有间隔的检索练习。"},{"stem":"关于\"用自己话复述\"vs\"抄录\"的对比实验，两个月后效果如何？","options":["完全没区别","都忘光了","抄录组反超","\"以写促学\"组的优势依然存在，虽然有所下滑但效果仍不错"],"answer":3,"explanation":"✅ 用自己的话重述概念并举例细化的学生，在两个月后的测试中成绩仍然高于只抄录的学生——虽然差距有所缩小，但长期效果依然显著。"},{"stem":"本书作者给学生的核心学习策略建议包括哪几条？","options":["反复阅读+集中练习","多看+多听+多练","检索练习+间隔练习+穿插练习+细化+生成+反思+校准","只做笔记"],"answer":2,"explanation":"✅ 第8章\"给学生的学习策略\"汇总了本书所有核心方法：练习从记忆中检索新知识（自测）、有间隔地安排检索练习、穿插学习不同但相关的主题、用细化（自己的话表达、和已知关联）、生成（先试解再看答案）、反思（回顾核心+联系+改进）、校准（用客观工具判断自己真正知道什么）。"},{"stem":"《圣路易斯邮讯报》公益漫画给的学习建议是什么？这反映了什么问题？","options":["\"专心致志，重复、重复、重复\"——这恰恰是本书要批判的错误方法","间隔练习","多样化学习","检索练习"],"answer":0,"explanation":"✅ 大众媒体给出的学习建议恰恰是研究证明无效的方法（反复重复）。这说明\"我们使用的学习方法在很大程度上受到假说、传言与直觉的影响\"，而非科学证据。"},{"stem":"关于\"学习一个新系统需要忘记旧系统\"的问题，本书怎么解释？","options":["新旧知识互不干扰","完全遗忘旧知识","被忘掉的不是知识本身，而是检索旧知识的线索——新线索取代旧线索","应该避免学新东西"],"answer":2,"explanation":"✅ 学意大利语时法语单词跳出来、在英国靠左行驶——\"被忘掉的不是知识本身，而是能让你找到并检索这些知识的线索。\"新线索取代了旧线索，但旧知识仍然存储在大脑中。"},{"stem":"《追忆似水年华》中，一块蘸了酸柠檬花茶的蛋糕唤起了叙述者全部童年记忆，这说明了什么？","options":["普鲁斯特记忆特别好","正确的线索可以激活被遗忘已久的记忆——记忆还在，只是缺少检索线索","蛋糕有魔力","记忆会永远消失"],"answer":1,"explanation":"✅ 书中以此说明：\"背景可以激发记忆，想打开一把旧锁，就需要正确的钥匙。\"你所见所闻可以唤醒很多回忆。\"大多数人都与普鲁斯特有类似的经历。\""},{"stem":"关于\"考试焦虑\"，经常进行低权重的小测验有什么效果？","options":["让焦虑更严重","增加焦虑","没有效果","有助于缓解焦虑——因为从更大范围上分担成绩，考试不再是\"一锤子买卖\""],"answer":3,"explanation":"✅ 经常性的低权重测验让学生更适应测验环境、更准确了解自己的水平、分散成绩压力。不再是一考定终身，焦虑自然降低。"},{"stem":"本书对于\"填鸭式学习\"（Cramming）的态度是什么？","options":["所有人都应该用","短期可能通过考试，但长期遗忘严重——\"像贪食症，吃得不少但很快吐出来\"","是唯一方法","有效"],"answer":1,"explanation":"✅ 填鸭式练习是集中练习的一种形式，\"一直被比作贪食症——吃得不少，但没过多久基本上都吐出来了。\"可能让你通过期中考试，但期末考试时大部分已遗忘。"},{"stem":"关于\"知识诅咒\"或\"已知的未知与未知的未知\"，拉姆斯菲尔德的著名分类中最后一句话是什么？","options":["\"所有的已知\"","\"已知的已知\"","\"未知的未知——那些我们不知道自己不知道的事情\"","\"已知的未知\""],"answer":2,"explanation":"✅ 美国前国防部长拉姆斯菲尔德2002年说：\"有些事是已知的已知；有些事是已知的未知；但是还有未知的未知——那些我们不知道自己不知道的事情。\"本书用此说明元认知问题：学生不知道自己哪里没掌握。"},{"stem":"佐治亚大学橄榄球教练杜利让四分卫\"把战术带回家，在头脑中复习演练\"，这对应什么学习方法？","options":["盲目练习","心理演练（Mental Rehearsal）——一种反思和检索练习的形式","集中练习","体力训练"],"answer":1,"explanation":"✅ 杜利说:\"你完全可以在头脑中回顾一下……在心里走上一两步，过一遍，就模拟了将要发生的情况。\"这与神经外科医生埃伯索尔德晚上回顾手术的做法完全一致——都是心理检索和反思。"},{"stem":"关于书本第1章提到的爱因斯坦那句话\"创造力比知识更重要\"，本书作者的态度是什么？","options":["应该在教学中减少知识传授","这种二分法大错特错——没有知识基础，创造力是无源之水","创造力确实比知识重要","完全同意"],"answer":1,"explanation":"✅ 作者说\"你肯定不希望看到自己的神经外科医生或载你飞过太平洋的机长穿着这种T恤\"。\"对要用到的东西一无所知，是不配谈实用的。\"知识+创造力缺一不可——这是关于学习的核心理念之一。"},{"stem":"如果你正在准备一个重要的资格考试，根据本书，最有效的备考策略是什么？","options":["做大量笔记和思维导图","考前一周集中复习","反复阅读教材","从第一天起就用自测（检索练习）、间隔安排复习、穿插不同主题、用自己的话解释概念"],"answer":3,"explanation":"✅ 全书的研究一致指向：自测（不是反复阅读）+间隔复习（不是考前突击）+穿插不同主题+细化（用自己的话解释）。这些方法感觉费力但效果最持久。笔记和思维导图可以作为辅助但不能替代检索练习。"},{"stem":"书中用了一句什么话来总结\"检索\"对记忆的作用？","options":["\"记忆就像相片永不褪色\"","\"遗忘是不可阻止的\"","\"努力检索不如反复阅读\"","\"检索给记忆这条绳子打了结\""],"answer":3,"explanation":"✅ 这是书中一段优美的比喻：\"孩子用绳子把蔓越莓穿起来做项链，挂到树上后却发现蔓越莓从绳子的另一端掉下来了。不打结，就做不出绳串。检索给记忆这条绳子打了结。重复检索能让记忆更清透，而且它把记忆这条绳子又缠了一圈，使其变得更牢靠。\""}]},{"name":"蛤蟆先生去看心理医生","author":"罗伯特·戴博德（Robert de Board），剑桥大学塞尔文学院毕业，曾任教","questions":[{"stem":"蛤蟆第一次去见苍鹭时，苍鹭问了一个让蛤蟆感到困惑的问题：\"谁是我的来访者？是你，还是他们？\"苍鹭这么问的目的是什么？","options":["暗示蛤蟆的朋友们才是真正需要咨询的人","让蛤蟆意识到咨询必须出于自愿，为自己而来","测试蛤蟆的智商","确认谁付钱"],"answer":1,"explanation":"✅ 苍鹭明确说\"心理咨询向来是一个自发的过程，咨询师和来访者双方都得出于自愿\"，只有当蛤蟆是为自己而不是为取悦朋友们才想咨询时，双方才能真正合作。这是心理咨询的基本原则。"},{"stem":"苍鹭用\"情绪温度计\"让蛤蟆评估感受，刻度从1到10。蛤蟆第一次打分时，他的分数是多少？","options":["1和2之间","8","5","1"],"answer":0,"explanation":"✅ 蛤蟆\"毫不犹豫地在1和2中间做了记号\"，并且承认三个月前有自杀念头。这说明他当时处于非常严重的抑郁状态。"},{"stem":"\"儿童的基本情感\"中，苍鹭列出了哪四种基本情感？","options":["快乐和深情、愤怒、悲伤、恐惧","快乐、悲伤、嫉妒、恐惧","快乐、愤怒、内疚、恐惧","快乐、愤怒、悲伤、焦虑"],"answer":0,"explanation":"✅ 苍鹭在白纸板上依次写下了：快乐和深情、愤怒、悲伤、恐惧。他把这些比作\"红黄蓝三原色\"，认为它们是所有婴儿与生俱来的基本情感。"},{"stem":"蛤蟆回忆说\"父亲经常在我表现不好时冲我发怒\"，他因此形成了什么行为模式？","options":["顺从行为——同意、取悦、道歉、依赖","撒谎和逃避","对抗和反抗","冷漠和疏离"],"answer":0,"explanation":"✅ 蛤蟆说\"除了顺从我父母的意愿之外，我还总是想要取悦他们\"\"几乎在我做任何事前，我都会为了安抚父亲而先道歉\"。这是\"适应型儿童\"的典型表现。"},{"stem":"苍鹭说\"没有一种批判比自我批判更强烈，也没有一个法官比我们自己更严苛\"。这是在讨论什么问题？","options":["蛤蟆的\"父母自我状态\"如何运作——他在审判自己","獾对蛤蟆的批判","社会的道德评判","蛤蟆对他人的批判"],"answer":0,"explanation":"✅ 蛤蟆一直认为自己没有\"挑剔型父母状态\"，因为他从不发火。但苍鹭引导他发现：他的\"父母状态\"不在审判别人，而在审判他自己。\"我判定了自己有罪，然后谴责自己。\""},{"stem":"苍鹭用一个什么比喻来解释婴幼儿期孩子与父母的关系？","options":["小星球上只有三个人，两个巨人一个小孩","学校里老师和学生的关系","花园里的花朵和园丁","牢房里的囚犯和看守"],"answer":0,"explanation":"✅ 苍鹭说：\"想象在一个很小的星球上只住着三个人：你和其他两个人。那两个人的身高比你高一倍还多，所有的事情你都得完完全全依赖他们……\"这生动地说明了婴幼儿的处境——完全依赖、无处可逃。"},{"stem":"苍鹭把人的三种自我状态称为什么？","options":["依赖、独立、共生","儿童状态、成人状态、父母状态","本我、自我、超我","感性、理性、本能"],"answer":1,"explanation":"✅ 苍鹭将其称为\"自我状态的三位一体\"：父母、成人、儿童状态，代表了人格的结构。这三种状态各有其生存价值，但只有\"成人状态\"才能学到关于自我的新知识。"},{"stem":"蛤蟆大学时被学院牧师引用圣经经文批评，那句经文是什么意思？","options":["你被称在天平里，显出你的亏欠","宽恕你的敌人","你要爱人如己","你要悔改"],"answer":0,"explanation":"✅ 学院牧师引用了但以理书第五章的经文\"弥尼，弥尼，提客勒，乌法珥新\"，意为\"你被称在天平里，显出你的亏欠\"。蛤蟆说这是对他最伤人的批评之一。"},{"stem":"獾来访要求蛤蟆辞去什么职务？","options":["板球俱乐部主席","村学校校董","教区委员","老兵协会主席"],"answer":1,"explanation":"✅ 獾不请自来，要求蛤蟆因\"健康原因\"辞去校董一职，由他取而代之。蛤蟆开始想妥协，后来在咨询后鼓起勇气留了便条拒绝，表示\"经过再三思考，我不会辞职\"。"},{"stem":"\"PLOM\"这个心理游戏的全称是什么意思？","options":["Play Like Old Man（像老人一样玩）","Please Love Only Me（只爱我一个）","People Like Obvious Menace（人们喜欢明显的威胁）","Poor Little Old Me（可怜弱小的我呀）"],"answer":3,"explanation":"✅ 苍鹭说蛤蟆很会玩\"PLOM\"这个游戏，即\"可怜弱小的我呀\"。蛤蟆一开始不承认自己在玩游戏，后来才理解自己确实在用\"自怜猛烈地攻击自己\"。"},{"stem":"蛤蟆在讲述人生故事后，发现自己大半辈子像什么？","options":["困在井里的青蛙","迷失的羔羊","孤独的狼","笼中的小鸟"],"answer":3,"explanation":"✅ 苍鹭问\"大篷车旅行出事后，笼子里的小鸟怎么样了\"，鼹鼠把它带回家照顾了。蛤蟆想到\"自己大半辈子都像那只可怜的笼中鸟一样\"，开始思考\"他会从过去的人生里挣脱出来找到自由吗？\""},{"stem":"四个人生坐标中，\"我好；你也好\"这个坐标有什么特殊性？","options":["最容易达到","不是静止状态，而是动态过程，需要靠行为和态度持续展示","意味着再也不会有烦恼","最普遍"],"answer":1,"explanation":"✅ 苍鹭强调\"'我好；你也好'并非静止的状态，而是动态的过程。你不能说'好了，我终于到了'，好像登顶珠穆朗玛峰一样。\"这是一种需要终身践行的信念。"},{"stem":"蛤蟆的父亲在蛤蟆小时候，最严厉的惩罚方式是什么？","options":["打他","用冰冷的声音说\"回你的房间去，没想好怎么道歉不准下楼\"","把他关在门外","扣零花钱"],"answer":1,"explanation":"✅ 蛤蟆回忆父亲时说\"不需要（打），只要一个眼神就足够了……他最严厉的惩罚就是用冰冷的声音说：'回你的房间去。没想好怎么道歉，不准下楼！'\""},{"stem":"苍鹭认为\"愤怒的人从不觉得内疚\"的原因是什么？","options":["他们总在怪罪别人，把内在的恐惧对外投射","他们的愤怒是合理的","他们从不在乎别人","他们天生没有内疚感"],"answer":0,"explanation":"✅ 苍鹭说\"愤怒的人从不觉得内疚，因为他们总在怪罪别人。他们自卫的方式，是把自己内在的恐惧对外投射到别人身上，这样就能把对自己的怒火转向别人。\""},{"stem":"蛤蟆对苍鹭说\"你从来不告诉我你是怎么看我的\"，这发生在什么时候？","options":["倒数第二次面谈（爆发对抗的那次）","最后一次面谈","中间某次面谈","第一次面谈"],"answer":0,"explanation":"✅ 在倒数第二次面谈中，蛤蟆终于爆发了：\"你好像总要让我承认错误和失败……有时候，你那样子就像我父亲。好吧，我想我受够了！\"苍鹭说这是\"移情\"和成长的重要一步。"},{"stem":"苍鹭说蛤蟆的情感变化经历了什么过程？","options":["从愤怒到平静","从逃避到面对","从抑郁到快乐","从依赖到对抗依赖，再到独立"],"answer":3,"explanation":"✅ 苍鹭总结道：\"在咨询过程中，我从依赖变成了对抗依赖，然后最终走入了独立的状态。\"蛤蟆补充说：\"你其实总在引导我回答自己的问题，引导我进入'成人状态'。\""},{"stem":"蛤蟆的家族座右铭是什么？","options":["勇往直前","诚实正直","勤奋致富","捍卫名誉"],"answer":3,"explanation":"✅ 当苍鹭说蛤蟆\"对自己不诚实\"时，蛤蟆\"真要发火了，好歹他的家族座右铭可是'捍卫名誉'\"。"},{"stem":"关于\"情商\"，苍鹭认为高情商的人最重要的能力是什么？","options":["能说会道","善于谈判","高智商","能控制冲动，懂得延迟满足"],"answer":3,"explanation":"✅ 苍鹭说高情商的人\"有强大的自我意识，了解自己的情感。他们能管理情绪，能从悲伤和不幸中重新振作。但也许最重要的是，他们能控制冲动，也懂得延迟满足，从而避免轻率的决定和不妥的行为。\""},{"stem":"蛤蟆送给苍鹭的告别礼物是什么？","options":["一条领结","一瓶酒","一只自己用胡桃木做的小木碗","一本书"],"answer":2,"explanation":"✅ 蛤蟆说：\"我拿庄园里被风刮倒的胡桃树自己做的……就当是纪念我们一起合作的时光。\"苍鹭说会永远珍藏它。"},{"stem":"蛤蟆回忆起小时候，母亲只有在什么情况下才会拥抱他？","options":["只有父亲不在场时","只有生病时","每天晚上","从不拥抱"],"answer":0,"explanation":"✅ 蛤蟆说母亲\"抱过我几回，可绝不会当着父亲的面抱我。父亲在时，母亲对我就比平时严厉，这让我感到内疚和担忧。\"这是\"适应型儿童\"形成的重要环境因素。"},{"stem":"鼹鼠为什么对河鼠感到不满？","options":["河鼠不喜欢他","河鼠不管他","河鼠太自私","河鼠太能干了，总让他活在自己的影子里"],"answer":3,"explanation":"✅ 鼹鼠\"感到几乎没法做他自己，因为他总活在河鼠的影子里\"。河鼠划船更好、打绳结更多花样，还经常纠正鼹鼠的做法。鼹鼠\"宁愿河鼠不要总这么能干，能允许他用自己的方式去尝试，哪怕做错了也没关系\"。"},{"stem":"蛤蟆第一次见到苍鹭时，等待他说话的过程中发生了什么？","options":["苍鹭立刻开始训话","苍鹭给他倒了杯茶","苍鹭沉默地看着他，让蛤蟆感到极度不自在","苍鹭让他填表格"],"answer":2,"explanation":"✅ \"苍鹭走进了房间……在蛤蟆对面的椅子上坐了下来，道过早安，接着便无声地看着蛤蟆。蛤蟆早已习惯人们同他说话，正等着苍鹭开启一场冗长的训诫，可什么动静也没有。\""},{"stem":"苍鹭认为\"自证预言\"是什么意思？","options":["相信命运","我们会控制事件的发生，从而确保预言会成真","预测未来的能力","读书预测"],"answer":1,"explanation":"✅ \"'自证预言'的意思是，我们会控制事件的发生，从而确保预言会成真。我们会确保自己的世界和预期的一样。\"这与人生坐标密切相关——一旦选择了某种看待世界的角度，就会不断确认和支持这一信念。"},{"stem":"\"猜猜我在想什么\"游戏中，谁通常是赢家？","options":["学生","双方","老师","旁观者"],"answer":2,"explanation":"✅ 苍鹭突然不耐烦地问蛤蟆一个很难的问题，然后笑着说这就是\"猜猜我在想什么\"游戏——\"很多年来，老师一直对学生玩这个游戏，老师当然是赢家了。学生肯定觉得自己很蠢……而老师赢了无知的学生，就能获得优越感。\"这是心理游戏的典型例子。"},{"stem":"蛤蟆在最后一次面谈时，在情绪温度计上给自己打了几分？","options":["满分10分","9分，其实可以打10分","8分","5分"],"answer":1,"explanation":"✅ 蛤蟆说\"今天我给自己打9分，其实可以打10分，但我想给未来留些余地，或许事情会变得更好。\"从1~2分到9分，这是他十次咨询后巨大变化的直接体现。"},{"stem":"苍鹭认为泪水（哭泣）意味着什么？","options":["需要被制止","悲伤的原因是真实可见的，哭是因为和情绪做了联结","求助信号","软弱的表现"],"answer":1,"explanation":"✅ 苍鹭说：\"如果你要更好地理解自己，就需要跟自己的情绪做联结，并理解这些情绪。如果你否认它们，不论是用无视还是压抑的方式，结果都像是做了截肢……你在某种程度上成了一个残缺的人。\""},{"stem":"蛤蟆是如何拒绝獾要求他辞去校董的？","options":["留了张便条","当面拒绝","让朋友转告","什么都没做"],"answer":0,"explanation":"✅ 蛤蟆说\"我觉得如果见到他，我准会输……所以我给他留了张便条，告诉他经过再三思考，我不会辞职，因为我身体好多了。\"这是蛤蟆第一次鼓起勇气反抗獾——\"他过去是绝不敢反抗老獾的\"。"},{"stem":"蛤蟆和苍鹭一共进行了多少次正式面谈？","options":["8次","10次","12次","5次"],"answer":1,"explanation":"✅ 蛤蟆看了看日志本后说：\"不算糟糕的初次见面，我们一共面谈了十次，感觉上却不止十次。\"这是一个完整的心理咨询周期。"},{"stem":"在最后的聚会上，河鼠宣布了什么计划？","options":["结婚","去伦敦工作","搬到南部的海边小镇，管理一家书店并写书","继续留在河岸"],"answer":2,"explanation":"✅ 河鼠说他要搬到\"南部的灰色海边小镇\"，和朋友海鼠一起管理一家叫\"旅人大全\"的书店，还打算写一本书，可能叫\"灌木丛中的微风\"或别的什么。"},{"stem":"蛤蟆在最后聚会上宣布了什么重大决定？","options":["找了份工作，创办房地产公司","继续当富家公子","结婚生子","去旅行"],"answer":0,"explanation":"✅ 蛤蟆说\"我找了份工作\"，准备和几个朋友一起成立房地产公司\"骑士、蛤蟆与弗兰克\"，设在伦敦。他还卖掉了蛤蟆庄园，在村里买了一栋\"老教区\"的房子。"},{"stem":"苍鹭说\"愤怒的人从不觉得内疚\"后还补充了一个有意思的现象，是什么？","options":["他们从来不会抑郁","他们朋友很少","他们总是很成功","他们也从不快乐"],"answer":0,"explanation":"✅ 苍鹭说\"关于这类人的心理状态，还有一个有意思的现象，那就是他们从来不会抑郁。\"蛤蟆很吃惊，苍鹭解释说\"因为愤怒能够非常有效地抵抗抑郁\"。"},{"stem":"蛤蟆的曾用名（受洗时的教名）是什么？","options":["亚历山大","西奥菲勒斯","乔治","托马斯"],"answer":1,"explanation":"✅ 蛤蟆说\"没几个人知道我受洗时的教名是西奥菲勒斯\"，而父亲一喊\"西奥菲勒斯！\"他就吓得两腿发软。这名字代表了父亲对他的严厉管教。"},{"stem":"什么是\"成人自我状态\"？","options":["比儿童状态更高级","不需要父母状态","用理性而不是情绪化的方式来行事，能应对此时此地正在发生的现实","像大人那样行事"],"answer":2,"explanation":"✅ 苍鹭说\"成人自我状态\"指\"我们用理性而不是情绪化的方式来行事。它让我们能应对此时此地正在发生的现实状况。在这个状态下，我们能计划、考虑、决定、行动，我们能理性而合理地行事。\""},{"stem":"苍鹭用什么例子来说明\"心理游戏\"中的\"共谋\"？","options":["酗酒","赌博","撒谎","偷窃"],"answer":0,"explanation":"✅ 苍鹭说\"假如你认为生活让你不快乐，不善待你，那么今天喝醉就是你用的某种方法，它可以印证明天你会感觉悲惨的预期。换句话说，你创造了一个'自证预言'。\"酗酒是一种心理游戏——玩家最终会产生糟糕的、不快乐的情绪。"},{"stem":"\"适应型儿童\"与\"自然型儿童\"的区别是什么？","options":["适应型儿童是后天学来的，自然型是与生俱来的","两者没有区别","适应型儿童是\"自然型儿童\"为应对父母而做出的调整","适应型儿童更聪明"],"answer":2,"explanation":"✅ 苍鹭在\"儿童自我状态\"下面画了一个圆，分两半：上半是\"自然型儿童\"（基本情感），下半是\"适应型儿童\"（为适应父母权威而调整的行为）。蛤蟆的大部分行为都来自\"适应型儿童\"。"},{"stem":"蛤蟆在讲述自己因偷车被追捕的经历时，河鼠对他的反应是什么？","options":["保持沉默","热情倾听","骂他\"寒酸、邋遢、丢人现眼\"，叫他去换衣服","帮他策划逃跑"],"answer":2,"explanation":"✅ 蛤蟆回忆河鼠\"非但没兴趣听，还说我吹牛，指责我'寒酸、邋遢、丢人现眼'，非要我去换身衣服。\"蛤蟆当时\"还没等衣服干，就开始跟他讲我的历险\"，结果被泼了冷水。"},{"stem":"苍鹭认为咨询中\"学习一直是个双向的过程\"，这说明什么？","options":["来访者需要教咨询师","咨询就是互相教","咨询师也需要收费","咨询师也在咨询过程中学习成长"],"answer":3,"explanation":"✅ 当蛤蟆送木碗时，苍鹭说\"它会提醒我在与你合作时所学到的一切\"。蛤蟆很吃惊说\"原来你也会学习\"，苍鹭回答\"在咨询中，学习一直是个双向的过程，只是彼此学到的东西不同\"。"},{"stem":"蛤蟆发现自己对獾\"忏悔只是表象\"，真正的原因是什么？","options":["他真的觉得自己错了","他想讨好獾","他怕獾打他","他在防御獾对他的攻击，不是发自内心的东西就不能带来真正的改变"],"answer":3,"explanation":"✅ 蛤蟆现在意识到\"那时在獾面前的忏悔只是表象，其实他是在防御獾对他的攻击。不是发自内心的东西，就不能带来真正的改变。\""},{"stem":"蛤蟆的祖父是做什么的？","options":["牧师","教师","创立了老艾比酿酒厂","军人"],"answer":2,"explanation":"✅ 蛤蟆说祖父科尼利厄斯\"创立了老艾比酿酒厂\"，还曾指着年幼的蛤蟆对工头说\"这可是未来的董事长\"，而蛤蟆\"感到害怕\"——\"即使在那么小的时候，我就知道自己不想在那个地方工作！\""},{"stem":"蛤蟆发现自己的\"挑剔型父母状态\"表现在哪里？","options":["挑剔别人","挑剔食物","审判自己","没有挑剔型父母状态"],"answer":2,"explanation":"✅ 蛤蟆一直认为自己没有\"父母状态\"，因为他不发火、不批评别人。但苍鹭引导他发现他的父母状态\"运作起来和獾的方式非常不同\"——他在审判自己。\"我判定了自己有罪，然后谴责自己。\""},{"stem":"蛤蟆在咨询后有了什么变化？（鼹鼠总结）","options":["变得更有钱了","变得更爱说话了","变得更沉默了","更会倾听了，更友善、更平和"],"answer":3,"explanation":"✅ 鼹鼠对河鼠说：\"他更会倾听了……他开始懂得倾听，而且看上去是真的能听进我们的话。以前，你连一句话都说不完，他就来插嘴。说心里话，他看上去更友善、更平和，没以前那么烦人了。\""},{"stem":"在最后道别时，老獾宣布了什么重大消息？","options":["他要搬家","他要退休了","他被推选为下一届选举的议会候选人","他要结婚"],"answer":2,"explanation":"✅ 獾郑重地宣布\"我被推选为下一届选举的议会候选人了！\"河鼠说他\"很会演说，为人正直，还真正把河岸和野树林的每个居民都放在心上\"。"},{"stem":"关于\"独立性\"和\"共生性\"，苍鹭是怎么说的？","options":["两者没有区别","共生性更重要","独立性更重要","独立性是新发现的自主权，共生性是成熟和自我接纳，能接纳他人、有效联结"],"answer":3,"explanation":"✅ 苍鹭说：\"独立性隐含了做自己的自豪感……独立的人时刻守护新发现的自主权……共生性则体现出成熟和自我接纳，还包括求同存异地接纳他人。共生性可以让你在社交和工作上与别人有效联结，协同合作。\""},{"stem":"蛤蟆回忆起父亲把他从膝上推开的事，这说明什么？","options":["父亲身体不好","父亲不爱他","他太胖了","他太渴望得到父爱，做出傻里傻气的举动，反而遭到拒绝"],"answer":3,"explanation":"✅ \"也许是我太渴望得到他的爱了，就会犯傻，做一些傻里傻气的举动。有一次，他把我从他膝上推了下去，还对我母亲说：'我受不了他这副样子！'接着便走出了房间。而我只能放声大哭。\"这是蛤蟆寻求父爱却遭拒的深刻记忆。"},{"stem":"蛤蟆的抑郁最先被谁发现的？","options":["苍鹭","獾","鼹鼠","河鼠"],"answer":2,"explanation":"✅ 鼹鼠去看望蛤蟆时，发现庄园一片破败，\"旧衣服底下是蛤蟆！\"蛤蟆说\"我现在整个人都不太好\"便放声大哭。鼹鼠回去后告诉了河鼠，朋友们决定帮他找心理咨询师。"},{"stem":"蛤蟆的领结对书中有什么象征意义？","options":["没有特殊意义","只是装饰","代表他的财富","代表他对自我的坚持和个性——父亲不喜欢他戴领结，他却一直戴着"],"answer":3,"explanation":"✅ 蛤蟆说\"从那时起我开始佩戴领结，还记得我在家戴领结让父亲感到强烈的不满。那是头一次，他的反应让我有一种真实的满足感。我想，如果他对我不满，至少说明我还有本事让他不满！自那以后我便一直戴着领结。\"领结象征着他的自我认同和独立精神。"},{"stem":"\"本我所在，自我相依\"这句话是谁的名言，在书中有什么作用？","options":["阿德勒的，说明自卑与超越","弗洛伊德的，苍鹭用它来说明理解童年是理解自己的关键","荣格的，说明自我与本我的关系","霍妮的，说明焦虑的来源"],"answer":1,"explanation":"✅ 苍鹭在第五章中说：\"弗洛伊德曾说，'本我所在，自我相依。'……理解你的童年就是理解你自己的关键线索，这贯穿我们咨询的全过程。\""},{"stem":"（推理题）如果一个人长期处于\"我不好；你好\"的人生坐标中，他最可能做什么？","options":["独立自主","玩\"我真不幸\"或\"可怜弱小的我\"等受害者游戏，容易抑郁","成为领导者","积极竞争"],"answer":1,"explanation":"✅ 苍鹭明确指出处在这个坐标的人\"认为自己是生活的受害者，所以他们就玩那些会把他们变成受害者的游戏\"，如\"我真不幸\"和\"PLOM\"。这类人容易抑郁，觉得自己不够好，无法掌控人生。"},{"stem":"（应用题）一个总是挑剔、批评下属的领导者，根据书中的分析，最可能处于什么状态？","options":["自然型儿童状态","成人自我状态","挑剔型父母自我状态，\"我好；你不好\"的人生坐标","适应型儿童状态"],"answer":2,"explanation":"✅ 苍鹭分析獾时说，他处于\"挑剔型父母状态\"，玩着\"NIGYYSOB\"（我抓到你了，你个混蛋）的游戏，处在\"我好；你不好\"的坐标中。这类人\"总需要攻击或者谴责别人\"，\"从来不会抑郁\"——因为\"愤怒能够非常有效地抵抗抑郁\"。"},{"stem":"（推理题）苍鹭说\"你还要为自己的不快乐责怪别人多久\"，这句话的核心意思是什么？","options":["责怪没有用，你需要为自己负责，因为只有这样才能真正开始改变","不要想太多","不快乐是不可避免的","不快乐是别人的错"],"answer":0,"explanation":"✅ 苍鹭引导蛤蟆明白：停止责怪别人、为自己负责，才能认识到自己对自己是有自主权的。\"如果你为自己负责，就会认识到你对自己是有自主权的。因此你就知道自己有力量来改变处境，更重要的是，有力量改变你自己。\"这是全书最核心的成长主题。"}]},{"name":"高效能人士的七个习惯","author":"史蒂芬·柯维（Stephen R. Covey），美国著名管理学家、教育家和作家","questions":[{"stem":"柯维认为，近200年来美国成功学文献发生了怎样的趋势变化？","options":["从强调品德转向强调个人魅力","从强调努力转向强调天赋","从强调合作转向强调竞争","从强调技巧转向强调品德"],"answer":0,"explanation":"✅ 柯维研究发现，前150年强调品德（诚信、谦虚等），一战后转向强调个人魅力（沟通技巧、积极思维等），这种转变让人偏离了成功与幸福的轨道。"},{"stem":"柯维用鹅和金蛋的寓言来比喻什么？","options":["产出与产能必须保持平衡","养鹅比存钱更划算","贪心的人没有好下场","财富积累需要时间"],"answer":0,"explanation":"✅ 金蛋代表产出(P=Production)，鹅代表产能(PC=Production Capability)。杀鹅取蛋是\"重蛋轻鹅\"，最终一无所有。效能在于P与PC的平衡。"},{"stem":"柯维在纽约地铁上经历了怎样的\"思维转换\"（Paradigm Shift）？","options":["看到一个吵闹孩子的父亲，最初愤怒后转为同情","发现坐错了方向","突然想通了一个商业难题","意识到自己应该换工作"],"answer":0,"explanation":"✅ 柯维在地铁上看到一个男人任凭孩子吵闹，他忍无可忍去指责，结果那人说孩子的母亲一小时前刚过世。柯维的愤怒瞬间转为同情——这就是思维转换：换个角度看问题，一切都变了。"},{"stem":"弗兰克尔在纳粹集中营中发现的人性最基本原则是什么？","options":["团结就是力量","痛苦会让人变得更强大","希望是人类生存的根本","在刺激与回应之间，人有选择的自由"],"answer":3,"explanation":"✅ 虽然纳粹能控制弗兰克尔的生存环境和肉体，但他的自我意识是独立的，他可以决定外界刺激对自己的影响程度。他运用想象力、良知等天赋找到了内心的自由。"},{"stem":"“关注圈”和“影响圈”的区别是什么？","options":["两者没有区别","影响圈是工作，关注圈是生活","关注圈更大，影响圈更小","关注圈是关心的事，影响圈是能掌控的事"],"answer":3,"explanation":"✅ 关注圈包括所有你关心的事，影响圈是其中你能够掌控和改变的部分。积极主动者专注影响圈，使其不断扩大；消极被动者紧盯关注圈中不可控的事，影响圈反而缩小。"},{"stem":"柯维对一位抱怨\"我和太太已经不再爱对方\"的男士的回答是什么？","options":["去爱她","等感觉回来","那就离婚吧","去看婚姻顾问"],"answer":0,"explanation":"✅ 柯维说\"爱是一个动词，爱的感觉是爱的行动所带来的成果\"。不是先有感觉再行动，而是先行动（为她服务、聆听、欣赏、肯定）然后感觉才会来。"},{"stem":"\"以终为始\"意味着什么？","options":["以人生最终目标为衡量一切的标准","只关注结果不关注过程","从最后一步倒着做事","做事拖延到最后一刻"],"answer":0,"explanation":"✅ 以终为始意味着在做任何事之前，先认清方向，以你最终想成为什么样的人为标准来指导当下的行动。柯维让读者想象自己的葬礼——你希望人们怎样评价你？"},{"stem":"柯维说\"任何事物都需经过两次创造\"，这两次分别是什么？","options":["第一次是个人创造，第二次是团队创造","第一次是智力创造，第二次是体力创造","构思和实践","设计和制造"],"answer":1,"explanation":"✅ 第一次创造是在头脑中构思（智力创造），第二次创造是付诸实践（体力创造）。以建筑为例，必须先有设计图（第一次创造），然后才施工（第二次创造）。"},{"stem":"时间管理矩阵中，高效能人士最应该聚焦哪个象限？","options":["重要且紧急","紧急但不重要","不重要也不紧急","重要但不紧急"],"answer":3,"explanation":"✅ 第二象限\"重要但不紧急\"包含：建立人际关系、规划长期目标、防患于未然、学习和自我提升等。聚焦第二象限可以提前预防危机，减少第一象限的\"救火\"。"},{"stem":"柯维提出的七习惯对应什么成熟路径？","options":["学习→工作→退休","幼稚→成熟→衰老","被动→主动→领导","依赖→独立→互赖"],"answer":3,"explanation":"✅ 习惯一至三帮助从依赖到独立（个人领域成功），习惯四至六帮助从独立到互赖（公众领域成功），习惯七是持续更新。互赖是最高层次——\"我们\"可以合作创造更大价值。"},{"stem":"双赢思维的核心是什么？","options":["永远优先保证自己赢","寻求对双方都有利的方案，不成就好聚好散","让步妥协各取所需","先想办法让对方赢"],"answer":1,"explanation":"✅ 双赢不是妥协折中（双方都失望），而是创造性地让双方都满意。如果不能双赢，柯维建议\"好聚好散\"（No Deal）——宁可这次不合作，也不破坏关系。"},{"stem":"柯维说\"知彼解己\"指的沟通原则是什么？","options":["先表达自己再听别人","知己知彼才能百战百胜","只说对方想听的话","先理解别人，再争取让别人理解自己"],"answer":3,"explanation":"✅ 大多数人聆听时不是在理解对方，而是在准备自己的回应。真正的移情聆听是以理解为目标的倾听——站在对方的角度，感受对方的情绪。"},{"stem":"统合综效（Synergy）的含义是什么？","options":["1+1=2 精确配比","1+1<2 资源浪费","各做各的不干扰","1+1>2 创造性合作"],"answer":3,"explanation":"✅ 统合综效指整体大于部分之和。尊重差异、取长补短，通过创造性合作能找到比任何一方最初想法都更好的解决方案。"},{"stem":"柯维用\"灯塔\"来比喻什么？","options":["原则","领导力","努力的方向","成功的目标"],"answer":0,"explanation":"✅ 柯维讲了一个战舰和灯塔的故事：船长命令\"灯塔\"转向，结果发现那是灯塔而不是船。原则如同灯塔——是不容动摇的自然法则。\"我们不可能打破法则，只能在违背法则的时候让自己头破血流。\""},{"stem":"柯维认为\"习惯\"由哪三个要素构成？","options":["思维、情感、行为","目标、行动、反馈","知识、技巧、意愿","时间、精力、毅力"],"answer":2,"explanation":"✅ 知识告诉\"做什么\"和\"为何做\"，技巧告诉\"如何做\"，意愿促使\"想要做\"。要养成一个习惯，三者缺一不可。"},{"stem":"下列关于\"个人魅力论\"的描述，哪个是柯维的观点？","options":["个人魅力论是华而不实的捷径，治标不治本","个人魅力论和品德论同样重要","个人魅力论是成功的关键","个人魅力比品德更重要"],"answer":0,"explanation":"✅ 柯维认为个人魅力论如同阿斯匹林和创可贴，只能暂时缓解表象问题，无法解决深层问题。只有根植于品德（诚信、谦虚、勇气等）的成功才能持久。"},{"stem":"柯维说\"除非你愿意，否则没人能伤害你\"，这句话体现了哪个习惯？","options":["知彼解己","积极主动","以终为始","要事第一"],"answer":1,"explanation":"✅ 这句话出自埃莉诺·罗斯福，体现了\"积极主动\"的核心：伤害我们的并非悲惨遭遇本身，而是我们对于悲惨遭遇的回应。"},{"stem":"甘地也说过类似的话：\"除非拱手相让，否则没人能剥夺我们的____\"？","options":["自尊","权力","财富","自由"],"answer":0,"explanation":"✅ 与埃莉诺·罗斯福的话（\"除非你愿意，否则没人能伤害你\"）异曲同工，都体现了积极主动的精神——我们有选择回应方式的自由。"},{"stem":"弗兰克尔发现人生有哪三种主要价值观？","options":["过去、现在、未来","金钱、权力、名誉","经验价值观、创造价值观、态度价值观","个人价值观、家庭价值观、社会价值观"],"answer":2,"explanation":"✅ 经验价值观来自自身经历，创造价值观源于个人独创，态度价值观是面对困境时的回应。三种中境界最高的是态度价值观——即使身处纳粹集中营，也能选择自己的态度。"},{"stem":"柯维建议用多少天来试验\"积极主动\"原则？","options":["21天","30天","7天","66天"],"answer":1,"explanation":"✅ 柯维建议读者用30天亲身实践积极主动原则，把全部精力投入影响圈，从各种小事开始，许下承诺并予以兑现。"},{"stem":"\"习惯是知识、技巧与意愿的交集\"——如果一个人知道要运动但从不运动，缺的是哪个要素？","options":["知识和技巧都缺","意愿","知识","技巧"],"answer":1,"explanation":"✅ 知道该运动（知识），也知道怎么运动（技巧），但就是不想动——缺的是意愿。三种要素缺一不可。"},{"stem":"柯维关于女儿生日派对上不肯分享玩具的故事，说明了什么？","options":["孩子天生自私","当一个人没有真正体会过\"拥有\"，就无法真正\"付出\"","严厉管教最有效","贿赂是最好的教育方式"],"answer":1,"explanation":"✅ 柯维反思，或许女儿需要先经历拥有，然后才会付出。他在意其他家长的眼光，用权威逼女儿就范，反而伤害了关系。真正成熟的做法是让孩子体会拥有的感觉，再教她付出的价值。"},{"stem":"\"如果把生活中心放在金钱上\"会有什么问题？","options":["钱越多越幸福","赚到钱就一切都好了","永远不会满足","不会有什么问题"],"answer":2,"explanation":"✅ 柯维列举了多种常见\"生活中心\"及其弊端：以配偶为中心→情绪随对方起伏；以金钱为中心→永远不够；以工作为中心→退休后迷失；以自我为中心→自私狭隘。最好的生活中心是以原则为中心。"},{"stem":"柯维讲\"两个指挥官\"的故事（战舰vs灯塔），想说明什么？","options":["军队纪律的重要性","海上航行要小心","原则是不容动摇的，如同灯塔","上级的命令必须执行"],"answer":2,"explanation":"✅ 船长命令对方转向，对方回答\"这里是灯塔，建议你转向\"。原则如同灯塔，我们不能打破原则，只能在违背原则时让自己头破血流。"},{"stem":"一个护士听完柯维\"积极主动\"演讲后站起来大喊\"我自由了！\"，她自由于什么？","options":["找到了新工作","病人终于出院了","认识到自己可以选择不痛苦","辞职了"],"answer":2,"explanation":"✅ 她曾看护一个极其挑剔的病人，每天都很痛苦。听到柯维说\"除非我自愿，否则没有什么事可以伤害到我\"后，她认识到自己有能力选择不被他人的行为控制。"},{"stem":"柯维建议，如果发现自己在说\"但愿\"\"我办不到\"\"我不得不\"，意味着什么？","options":["你在寻求帮助","你在使用消极被动的语言","你在合理规划","你在诚实面对现实"],"answer":1,"explanation":"✅ 消极被动的语言往往暴露推卸责任的意图。\"我不得不\"意味着被外界控制，实际上人可以选择回应方式。积极主动的语言是\"我可以\"\"我选择\"。"},{"stem":"\"没有正确的生活，就没有真正卓越的人生\"——这句话出自谁？","options":["戴维·斯塔·乔丹","史蒂芬·柯维","亚里士多德","梭罗"],"answer":0,"explanation":"✅ 这是美国生物学家及教育家戴维·斯塔·乔丹的名言，被柯维在第一章开头引用，点明了品德成功论的核心。"},{"stem":"少妇/老妇的双关图实验（哈佛商学院经典实验）说明什么？","options":["条件作用对认知有强大影响力，思维定式决定你看到什么","有些人视力更好","年龄会影响判断","人的视力有差异"],"answer":0,"explanation":"✅ 预处理10秒钟看少妇像的同学都认为图片是少妇，看过老妇像的都认为是老妇。10秒的条件作用尚如此强大，更何况一生的条件作用——这就是思维定式的力量。"},{"stem":"柯维说\"效能\"的公式是什么？","options":["效能=产出-产能","效能=产出+产能","效能=产出×产能","效能=产出÷产能"],"answer":3,"explanation":"✅ 效能在于产出与产能的平衡。但更准确地说是两者都重要，不能只看公式。既要金蛋（产出），又要养好鹅（产能）。"},{"stem":"习惯七\"不断更新\"包含哪四个层面？","options":["身体、精神、智力、社会/情感","工作、生活、家庭、社交","学习、运动、饮食、休息","健康、财富、关系、事业"],"answer":0,"explanation":"✅ 习惯七\"不断更新\"（Sharpen the Saw）在身体（运动、营养、压力管理）、精神（价值观、使命）、智力（阅读、写作、学习）、社会/情感（服务、移情、统合综效）四个层面持续更新，是磨刀不误砍柴工。"},{"stem":"柯维讲他儿子打橄榄球时如何对待错误？","options":["和教练讨论","反复看录像","打开表带再扣上——以示清空记忆","写日记反思"],"answer":2,"explanation":"✅ 他儿子每次犯错后，都会\"吧嗒\"一声打开表带再扣上，象征相关记忆已被清除，从此轻装上阵，不让错误影响后续决策和比赛。"},{"stem":"柯维认为\"不能双赢就放弃交易\"，这条原则体现了什么？","options":["从不妥协","好聚好散(No Deal)是双赢思维的一种高尚选择","缺乏谈判技巧","消极逃避"],"answer":1,"explanation":"✅ 双赢思维的精髓不是每次都要\"赢\"，而是如果不双赢，宁可不做这笔交易。好聚好散意味着双方保留关系，未来还有合作可能。"},{"stem":"柯维在女儿三岁生日派对上用了哪五招来让女儿分享玩具？（按顺序）","options":["威胁→利诱→讲道理→武力→放弃","利诱→要求→讲道理→威胁→武力","要求→讲道理→利诱→威胁→武力","讲道理→利诱→威胁→武力→放弃"],"answer":2,"explanation":"✅ 1.要求\"把玩具分给大家\"；2.讲道理\"你去别人家他们也会分给你\"；3.利诱\"分给小朋友，爸爸奖励口香糖\"；4.威胁\"看我怎么罚你\"；5.武力——直接抢走玩具。这暴露了他当时的不成熟。"},{"stem":"关于\"人类四种独特天赋\"，以下哪项不在其中？","options":["自我意识","想象力","记忆力","独立意志"],"answer":2,"explanation":"✅ 人类拥有的四种独特天赋是：自我意识（审视自己的思维）、想象力（超越现实进行创造）、良知（明辨是非）、独立意志（不受外力影响自行其是）。记忆力不是这四种之一。"},{"stem":"以下哪句话体现了\"以终为始\"的精神？","options":["走一步看一步","享受当下最重要","忙碌的人未必出成果，梯子搭错了墙就白费工夫","计划赶不上变化"],"answer":2,"explanation":"✅ \"以终为始\"的核心是用最终目标衡量当下行动。很多人拼命埋头苦干，到头来发现追求成功的梯子搭错了墙——所以先明确目标方向最重要。"},{"stem":"柯维认为\"积极主动\"和\"积极思考\"的区别是什么？","options":["积极主动就是不顾后果地行动","没有区别","积极主动重在行动和选择，不只是在脑子里想","积极思考比积极主动更重要"],"answer":2,"explanation":"✅ 积极主动不仅是态度，更是对自己人生的责任——个人行为取决于自身抉择而非外在环境。它不同于\"积极思考\"（仅停留在思维层面），而是要求主动采取行动、创造有利环境。"},{"stem":"关于销售主管面对独断专行老板的故事，那位最终获得老板重用的主管做了什么？","options":["设法弥补老板的缺失、缓冲下属压力","跳槽到竞争对手公司","拍老板马屁","联合其他主管对抗老板"],"answer":0,"explanation":"✅ 其他主管聚在走廊抱怨推卸责任，而这位积极主动的主管则：老板颐指气使→他缓冲减轻下属压力；老板发布矛盾指示→他设法配合其长处。最终他的影响圈扩大了，老板凡事都要征求他的意见。"},{"stem":"柯维建议读者用\"以教师角色\"来阅读本书，具体做法是什么？","options":["边读边做教案","写读书论文","对书中观点进行批判","预计在48小时内与人分享或讨论读书心得"],"answer":3,"explanation":"✅ 柯维建议读者以老师的角色阅读，在48小时内向别人分享讨论。这种心态可以增强记忆、加深体会、扩大视野，还有更强烈的动机去运用书中原则。"},{"stem":"\"品德成功论\"认为成功之本是什么？","options":["聪明才智","积极思维","社会形象和沟通技巧","诚信、谦虚、忠诚、勇气、公正、勤勉等品德"],"answer":3,"explanation":"✅ 品德成功论认为诚信、谦虚、忠诚、节欲、勇气、公正、勤勉、朴素等品德才是成功之本。本杰明·富兰克林的自传就是这个时期的代表作。"},{"stem":"如果问你\"在弥留之际，你希望自己花更多时间做什么？\"柯维说没有人会回答什么？","options":["陪家人","工作或看电视","旅行","读书"],"answer":1,"explanation":"✅ 柯维在教学中最常问的问题：\"有多少人在弥留之际，希望自己花更多时间工作或看电视？\"答案是没有人。人们想到的是爱人、家人和付出过爱心的人。"},{"stem":"关于\"依赖→独立→互赖\"成熟模式，以下哪个描述正确？","options":["独立是最高成就","依赖和互赖本质相同","三者没有优劣之分","互赖是比独立更成熟的高级概念"],"answer":3,"explanation":"✅ 独立确实比依赖成熟，但并非最高成就。互赖才是更高级的概念——既能自力更生，又懂得合作比单干更有成效。只有独立的人才能选择互赖。"},{"stem":"柯维用\"个人魅力\"来指什么？","options":["个人性格魅力","长得好看","性格、社会形象、行为态度、人际关系和公关技巧等成功捷径","有气质的谈吐"],"answer":2,"explanation":"✅ 柯维用\"个人魅力论\"指一战后兴起的一种成功观念：认为成功更多取决于性格、社会形象、行为态度、人际关系及公关技巧，而非品德。其中有些是金科玉律，有些则是玩弄手段。"},{"stem":"如果一个学生说\"我不得不随网球队去外地比赛所以请假\"，柯维会怎么回应？","options":["让他写检讨","问他\"你是自愿还是不得不去\"，帮他认识到这是自己的选择","果断准假","拒绝请假"],"answer":1,"explanation":"✅ 柯维会帮学生分析：不去会被开除→你不想要这个结果→所以你选择去比赛。不要说\"我不得不\"，而要承认这是你的选择——这才叫积极主动。"},{"stem":"柯维引用梭罗的哪句话来说明\"从根本上解决问题比表面修修补补更重要\"？","options":["\"万物皆有其时\"","\"大道至简\"","\"活在当下\"","\"一棵邪恶的大树，砍它枝叶千斧，不如砍它根基一斧\""],"answer":3,"explanation":"✅ 行为和态度是枝叶，思维定式是根基。只改变表面行为不改变思维定式，就如同砍枝叶而不砍根基——抓住了根本才能让生活出现实质性的进展。"},{"stem":"以下哪种做法最能体现\"要事第一\"？","options":["把日程排满","每周做计划，优先安排\"重要但不紧急\"的事","同时处理多个任务","先处理紧急的邮件"],"answer":1,"explanation":"✅ \"要事第一\"的核心是把时间花在第二象限（重要但不紧急）：预防性措施、建立关系、规划、学习、授权等。这需要每周规划，而不是被紧急事务牵着鼻子走。"},{"stem":"一个经理问柯维\"怎样对付懒散不称职的员工\"，有人开玩笑说\"投手榴弹\"。柯维如何反驳？","options":["扣工资就行","这太残忍了","用法律手段更好","你怎么不这样对待顾客呢？说\"不想买就滚蛋\"？"],"answer":3,"explanation":"✅ 柯维用产出/产能平衡原则指出：你希望员工如何对待顾客，就要如何对待员工。对员工喊\"不好好干就走人\"和对顾客喊\"不想买就滚蛋\"本质相同——都是在杀鹅取蛋。"},{"stem":"柯维引用的这句话是谁说的：\"谁也无法说服他人改变，因为我们每个人都守着一扇只能从内开启的改变之门\"？","options":["亚里士多德","弗格森（Marilyn Ferguson）","梭罗","弗兰克尔"],"answer":1,"explanation":"✅ 美国作家玛丽莲·弗格森的名言，被柯维用来强调改变必须由内而外——不管动之以情还是说之以理，我们都不能替别人开门。"},{"stem":"以下哪个选项不是柯维说的\"三类资产\"之一？","options":["知识产权","金融资产","人力资产","物质资产"],"answer":0,"explanation":"✅ 柯维将人类资产分为三类：物质资产（如割草机——不保养会报废）、金融资产（本金不能动——动用了赚钱能力就下降）、人力资产（最重要——关系需要维护）。"},{"stem":"假设你是经理，下属A总是推卸责任找借口，根据\"积极主动\"原则，最有效的做法是？","options":["替他做完工作","严厉批评他","帮他认识到\"你可以选择自己的回应方式\"，培养其责任感","直接开除"],"answer":2,"explanation":"✅ 积极主动原则认为，人可以选择回应的方式。与其批评或代劳，不如帮助对方认识自己的选择自由，逐步培养责任感。"},{"stem":"柯维引用《旧约》中约瑟的故事来说明什么？","options":["被卖为奴也能因积极态度而翻转命运","顺从命运安排","复仇是正当的","好人没好报"],"answer":0,"explanation":"✅ 约瑟17岁被兄弟卖到埃及为奴，又遭诬陷入狱13年，但他始终积极处世——不是想着\"如果……就好了\"，而是\"我可以……\"。最终他掌管了整个埃及，成为一人之下万人之上的人物。"}]},{"name":"关键对话干货版","author":"科里·帕特森、约瑟夫·格雷尼、罗恩·麦克米兰、艾尔·史威茨勒（通过20多年研究和","questions":[{"stem":"本书将\"关键对话\"定义为哪种类型的对话？","options":["重要商业谈判","观点迥异、充满风险、双方表现出强烈情绪的对话","书面形式的沟通","只有高层才能参与的对话"],"answer":0,"explanation":"✅ 关键对话的三个特征——双方意见完全不同；容易伤害彼此甚至造成严重后果；对话中情绪容易激烈。"},{"stem":"书中列举的16种关键对话场景不包括以下哪一项？","options":["给宠物看病","指出老板不对的想法","让朋友还钱","应对青春期叛逆儿女"],"answer":2,"explanation":"✅ 16种场景包括：结束感情、让朋友还钱、指出老板不对、应对青春期儿女、探讨出轨问题、批评同事表现等，不包括宠物相关。"},{"stem":"对7000多名医护人员的调查中，能对医生违规行为提出问题的护士比例是多少？","options":["50%","84%","不到8%","95%"],"answer":2,"explanation":"✅ 84%的人看到同事违规，但能提出问题的护士不到8%，医生面对关键对话不退缩的比例也接近8%。"},{"stem":"善于应对关键对话的企业在快速调整预算方面的优势是什么？","options":["比其他公司慢","与其他公司持平","比其他公司快2倍","比其他公司快5倍"],"answer":1,"explanation":"✅ 善于应对关键对话的企业\"快速调整预算的能力比其他公司快5倍\"。"},{"stem":"马克曼对夫妻关系的10年跟踪研究发现，掌握了关键对话能力的夫妻有什么变化？","options":["不再争吵","离婚率不变","婚姻失败或不幸比例下降50%以上","收入提高"],"answer":1,"explanation":"✅ 掌握了关键对话能力的夫妻，婚姻走向失败或不幸的比例明显下降50%以上。他的离婚预测准确度高达90%。"},{"stem":"恶性黑色素瘤患者实验中，能有效表达自己的患者组死亡率是多少？","options":["50%","30%","20%","9%"],"answer":1,"explanation":"✅ 表达自己看法的患者组死亡率9%，不表达组30%——有效沟通让致死率下降2/3。"},{"stem":"医院扁桃体切除手术错误截去脚趾的案例中，至少有多少人心存疑虑却没有表达？","options":["全部","至少7位","3位","5位"],"answer":1,"explanation":"✅ 至少有7位相关人士心存疑虑却不表达——\"如果谁都不敢畅所欲言，错误的决策就难以避免。\""},{"stem":"\"共享观点库\"的核心价值是什么？","options":["让老板听取员工意见","共享观点库是实现协同效应的前提——整体思维的力量远大于个体观点总和","让讨论更民主","记录所有观点"],"answer":0,"explanation":"✅ \"整体思维（最终选择）的力量远远大于个体观点的总和，共享观点库是实现协同效应的前提。\""},{"stem":"CEO格瑞塔被质问\"你让我们双面打印，自己却花15万买家具\"时，她的反应体现了什么？","options":["压制质问者","先审视自己的真正目的，然后坦诚面对问题","沉默回避","转移话题"],"answer":0,"explanation":"✅ 她思考了四个核心问题后平静下来，回应\"这个问题提得很好，我必须讨论一下。谢谢你这样做，这说明你对我非常信任。\""},{"stem":"面对关键对话，作者建议首先自问的四个问题中不包括哪个？","options":["要想实现这些目标我该怎么做","我希望对方付出什么代价","我希望为我们之间的关系实现什么目标","我希望为自己实现什么目标"],"answer":1,"explanation":"✅ 四个问题是：为自己实现什么目标、为对方实现什么目标、为关系实现什么目标、我该怎么做。"},{"stem":"关键对话中三种\"沉默形式\"是什么？","options":["不说话、看手机、睡觉","掩饰、逃避、退缩","哭泣、喊叫、摔门","沉默、微笑、点头"],"answer":1,"explanation":"✅ 掩饰（嘲讽、乱夸奖）、逃避（顾左右而言他）、退缩（随便找理由退出）是三种沉默形式。"},{"stem":"对话中出现的\"贴标签\"属于哪种破坏安全的行为？","options":["有效沟通","言语暴力","建设性批评","沉默"],"answer":2,"explanation":"✅ 代表言语暴力的三种行为：控制（打断、绝对性字眼）、贴标签（类比成某类人）、攻击（贬低和威胁）。"},{"stem":"在夫妻\"亲热话题\"案例中，妻子说\"我不希望看到任何让彼此失望的事，我是想找到一种方式让我们都感到亲密\"——这使用了什么技巧？","options":["综合陈述法","主动引导","确认感受","对比法——用否定打消误解，用肯定确认真实目的"],"answer":0,"explanation":"✅ \"我不希望……而是希望\"就是对比法——否定部分用于消除不安全感的误解，肯定部分确认对对方的尊重和真实目的。"},{"stem":"\"修复安全氛围的四步法\"的正确顺序是什么？","options":["积极寻找共同目的→识别策略背后的目的→开发共同目的→共同构思新策略","共同构思新策略→开发共同目的→积极寻找共同目的→识别策略背后的目的","识别策略背后的目的→共同构思新策略→积极寻找共同目的→开发共同目的","开发共同目的→识别策略背后的目的→积极寻找共同目的→共同构思新策略"],"answer":0,"explanation":"✅ 正确顺序为：积极寻找共同目的→识别策略背后的目的→开发共同目的→和对方共同构思新策略。"},{"stem":"玛利亚（被同事抢功）用了什么方法控制情绪？","options":["找老板投诉","回顾行为方式→确定感受→分析感受背后的想法→寻找想法背后的事实","压抑情绪","发泄情绪后冷静"],"answer":1,"explanation":"✅ 对话高手的做法——回顾自己的行为方式→确定情绪→分析情绪背后的想法→寻找事实依据，把想法和事实分开。"},{"stem":"以下哪种属于对话\"低手\"常用的三种借口？","options":["受害者想法、大反派想法、无助者想法","沉默、暴力、逃避","积极反思、主动沟通、寻求共赢","道歉、对比、倾听"],"answer":1,"explanation":"✅ \"低手\"三种借口：受害者想法——\"这不是我的错\"；大反派想法——\"这都是你造成的\"；无助者想法——\"这事我也没有办法\"。"},{"stem":"在旅馆账单误会案例中，妻子说\"我担心的是旅馆问题。要知道，我妹妹就是在那家旅馆发现她老公有婚外情的\"——这对应综合陈述法的哪一步？","options":["鼓励尝试","征询对方观点","分享事实","试探性地提出想法"],"answer":2,"explanation":"✅ \"这件事我不必担心吧？你觉得这个账单会有什么问题吗？\"——她先分享了事实（账单），然后试探性地提出想法（担心婚外情），接着征询对方观点。"},{"stem":"\"综合陈述法\"的五个步骤中第一步是什么？","options":["分享事实——从最少争议、最有说服力的事实谈起","说出自己的想法","征询对方观点","做出试探表述"],"answer":1,"explanation":"✅ 五步顺序为：分享事实→说出想法→征询对方观点→做出试探表述→鼓励尝试。\"从最少争议、最有说服力的事实谈起\"是最安全的方式。"},{"stem":"母亲引导女儿谈论\"小混混男友\"时，最后使用了什么倾听技巧让女儿卸下防备？","options":["沉默等待","转移话题","主动引导——说出自己的猜测来鼓励对方开口","威胁"],"answer":2,"explanation":"✅ 母亲在女儿沉默后说\"你看我的想法对不对。你穿成这样是因为觉得无法从男生那里得到关注和重视，是这样吗？\"——这就是主动引导，说出最符合情况的猜测。"},{"stem":"四种倾听技巧按顺序排列是？","options":["确认感受→询问观点→重新描述→主动引导","重新描述→主动引导→询问观点→确认感受","主动引导→确认感受→询问观点→重新描述","询问观点→确认感受→重新描述→主动引导"],"answer":3,"explanation":"✅ 询问观点（表明有兴趣）→确认感受（通过理解对方感受增强安全感）→重新描述（重述对方表达以表明理解）→主动引导（如果对方退缩，说出猜测鼓励分享）。"},{"stem":"美航摔坏吉他被编成歌的事件中（在《疯传》中也出现过），体现了什么核心概念？","options":["公司管理的失败","品牌忠诚度","情绪的力量——愤怒这种高唤醒情绪可以激发病毒式传播","法律诉讼的效果"],"answer":2,"explanation":"✅ （注意此题跨书）但本题测试的是关键对话知识：情绪问题需要用关键对话来化解，而不是压抑后以破坏性方式爆发。"},{"stem":"面对\"总是迟到的员工\"，本书建议不要只谈论迟到本身，而应讨论什么？","options":["交通状况","扣工资","是否信守承诺的模式问题","换工作"],"answer":2,"explanation":"✅ \"你不能和他探讨迟到本身，而要谈是否信守承诺的问题。只有关注模式问题而非单一事件、分析提炼反复出现行为背后的动因，才能帮助他解决问题。\""},{"stem":"当一个下属对你说\"你以为你是谁，不过比我高一级\"，对话高手会怎么回应？","options":["暂停当前讨论，转而说明\"刚才提高嗓门对我喊叫的行为很不尊重我\"","叫他滚出去","降低姿态道歉","离开现场"],"answer":0,"explanation":"✅ 对话高手\"对以下犯上的问题绝不宽容，他们会以尊重对方的方式提出问题，暂停当前讨论，转而说明其错误。\""},{"stem":"当对方的观点与你完全不同时，作者建议用什么方法继续沟通？","options":["转移话题","赞同（认同的部分）+补充（完善不完善的部分）+比较（找出差异共同探索）","坚持己见","直接否定"],"answer":3,"explanation":"✅ 三要点——赞同对方观点中你认同的部分；补充遗漏部分；观点完全不同时，邀请对方一起寻找和说明不同之处。"},{"stem":"作者建议处理\"性骚扰问题\"的第一步是什么？","options":["辞职","搜集证据","建立共同目的——\"我想和你谈谈一些影响我们合作的事情，虽然棘手但谈开了会让我们成为更好的合作伙伴\"","直接向HR投诉"],"answer":3,"explanation":"✅ 以建立共同目的开始对话，然后用综合陈述法阐明具体行为及其影响。"},{"stem":"在处理\"总是为自己找借口的员工\"时，正确做法是什么？","options":["接受借口","先发制人堵住所有借口，要求对方承诺解决问题","直接开除","讨论借口是否合理"],"answer":1,"explanation":"✅ \"先发制人，堵住所有的借口，要他们承诺解决问题。不要讨论借口，而要讨论错误的行为模式问题。\"如\"不管用什么办法，你必须保证按时到校。你能保证明天8点准时到吗？\""},{"stem":"书中提到\"对话原则：先反省自己\"对应的关键问题是什么？","options":["我做错了什么","对方错在哪","我的真正目的是什么？怎么做才能实现这些目的","谁先开始的"],"answer":2,"explanation":"✅ 第一章原则就是\"先反省自己\"，核心是关注真实目的——我/对方/关系的目的是什么，怎么做才能实现。"},{"stem":"\"让对方感觉安全就不会选择沉默或暴力方式应对\"——为此对话者需要特别注意什么？","options":["只关注对话内容","打开五官，既关注对话内容又观察对话气氛","只顾表达自己","避免眼神接触"],"answer":2,"explanation":"✅ \"既关注对话内容（确保主题不偏离目标），又要观察对话气氛（参与对话者的反应）\"。只有在双方一直有互动的情况下对话才能继续。"},{"stem":"当对方误解你的目的时，最有效的做法是什么？","options":["固执己见","暂停对话，用对比法消除误解","妥协让步","更用力地解释"],"answer":3,"explanation":"✅ 用\"我不希望……而是希望\"的对比法——先否定对方认为你不尊重他或别有目的的误解，再肯定你对他的尊重和真实目的。"},{"stem":"\"提出反对意见，引起了CEO克里斯的反感\"——只有凯文成功完成了关键对话，他的方式是什么？","options":["严厉指责CEO","沉默接受","会后私下说","直截了当陈述事实，同时充分尊重对方——\"克里斯，我能和你讨论一个问题吗\""],"answer":0,"explanation":"✅ 凯文说\"克里斯，我能和你讨论一个问题吗？\"——然后直陈事实。他做到\"100%坦诚，同时又保证100%尊重对方\"。"},{"stem":"凯文作为8位副总中唯一敢于直言的，他心中想的是什么？","options":["这样做有什么风险","其他副总怎么想","如何对克里斯100%坦诚同时100%尊重","是否会丢掉工作"],"answer":2,"explanation":"✅ 对话高手避免\"傻瓜式的选择\"（要么反对把老板惹急，要么沉默接受不管公司是否遭殃），他们想的是\"如何100%坦诚同时100%尊重\"。"},{"stem":"为什么作者说\"我们唯一能控制的只能是自己\"？","options":["因为自己是权力最大的","因为别人不可信","因为规则不允许控制别人","因为不能强迫别人改变——只能控制好自己的观察和反应"],"answer":0,"explanation":"✅ \"我们没办法要求别人，只能想法控制好自己。\"具体是密切关注自己的做法以及这些做法造成的影响，\"不能只顾表达自己，不观察对方的感受和反应。\""},{"stem":"夫妻对话案例中，丈夫说\"我不知道这件事该怎么解决。我总是欲望强烈，好像解决方式只有一个\"——这处于四步法的哪一步之后？","options":["第三步——开发共同目的之后","第四步——共同构思新策略之前","第二步——识别策略背后的目的之后","第一步之后"],"answer":3,"explanation":"✅ 妻子在前三步已经完成了建立共同目的的过程（从\"不希望你违心配合\"到\"让彼此都感到关爱和受重视\"），丈夫此时正准备进入第四步——共同构思新策略。"},{"stem":"玛利亚最终与路易的对话中，路易承认了什么？","options":["他确实想抢功劳","他意识到在玛利亚不在场的情况下单独行动不妥，并为此道歉","玛利亚能力不足","老板让他这么做的"],"answer":1,"explanation":"✅ 路易解释说他想先和老板讨论有争议的地方，但后来也意识到在玛利亚不在场的情况下这么做确实不妥，并为主导演示道歉。"},{"stem":"本书处理\"不遵守程序规则、喜欢制造惊奇的人\"时建议什么？","options":["不再分配任务","减少合作","直接开除","任务分配后明确两个要点——完成任务的明确时间、遇事必须马上联系沟通不能先斩后奏"],"answer":3,"explanation":"✅ 对于不及时沟通、关键时刻制造麻烦的人，需要明确告诉：完成任务的明确时间+遇事必须马上联系沟通。"},{"stem":"关于如何陈述自己的想法，本书提出三项要点中\"你要谦逊\"意味着什么？","options":["表示自己错了","降低声音","不自信","承认自己的观点只是供对方思考和评判的逻辑起点，不是一个决断"],"answer":0,"explanation":"✅ 三项要点——自信（随时可以讨论任何问题）、谦逊（自己的观点不是决断而是供思考的起点）、有技巧（全心全意分享敏感信息）。"},{"stem":"当发现对方总是在逃避重要问题的对话时，作者的第一建议是什么？","options":["先反省自身，从简单问题谈起，努力营造安全感","找第三方介入","强迫对方谈话","放弃沟通"],"answer":2,"explanation":"✅ \"先反省自身，和对方从简单问题谈起，努力营造安全感，并关注对方言行。尽可能了解对方的行为动机。保有足够的耐心和信心。\""},{"stem":"在对话中遇到\"忍无可忍，以至于出口伤人\"的情况，作者的建议是什么？","options":["转身离开","及时道歉挽回局面，然后利用综合陈述法表明真实观点","继续发泄","忍下去"],"answer":3,"explanation":"✅ 因为长期压抑而导致爆发伤人的情况，一定要及时道歉挽回局面，然后利用综合陈述法表明自己的真实观点。"},{"stem":"对于那些\"没有办法对照关键对话原则去对话的人\"，作者的策略是什么？","options":["强制对方接受规则","找上级介入","放弃对话","放慢节奏，先问两个问题——\"让我最苦恼的什么？他最容易解决的是什么？\"然后每次只选择问题的一个方面"],"answer":3,"explanation":"✅ \"首先放弃他们是例外的臆想，放慢解决问题的节奏，先问自己两个问题\"——由此作为突破口，逐步推进。"},{"stem":"在本书的最终\"速读清单\"中，与\"控制情绪\"对应的关键问题共有几个？","options":["5个","3个","2个","4个"],"answer":3,"explanation":"✅ 清单中\"控制情绪\"对应四个关键问题——我是否故意忽略自己的责任？一个理智正常的人为什么会这样做？我的真实目的是什么？要实现目的我需要做什么？"},{"stem":"本书认为企业或团队变革成功的关键是什么？","options":["新目标的遵守和服从","领导者的权威","奖惩制度","有人违反规定时，团队成员能否与对方展开关键对话"],"answer":0,"explanation":"✅ \"企业或团队变革成功的关键，不在于团队成员对新目标的遵守和服从，而在于有人违反规定时，他们能否和对方展开关键对话。\""},{"stem":"处理\"让自己产生信任危机的行为\"时，本书强调什么原则？","options":["就事论事，一次失败很正常，不能用失信作为惩罚手段","惩罚失信者","从此不再信任对方","要求对方写保证书"],"answer":2,"explanation":"✅ \"讨论信任感相关问题，必须就事论事。一次失败、失信，很正常，只要眼前能继续信任对方即可。同时不能用失信作为惩罚对方的手段，即不能盲目夸大问题。\""},{"stem":"在关键对话中获得成功的关键第一步是什么？","options":["深呼吸十次","明确对方的问题","找到第三方","从\"心\"开始——先审视自己的目标"],"answer":3,"explanation":"✅ 全书开篇原则就是\"从心开始\"，所有对话高手的共同点是遇到困难时先审视自己的目标，而不是被情绪俘获。"},{"stem":"当对方用\"你之前又没说我不能叫她白痴\"来为自己辩解时，这属于什么行为模式？","options":["合理反驳","承认错误","玩文字游戏——纠缠于具体行为而非行为模式","真诚沟通"],"answer":0,"explanation":"✅ \"对话高手对这类情形会既关注探讨行为也关注探讨结果，不会纠缠于某个具体行为的讨论，而是探讨行为模式问题。让对方清楚知道玩文字游戏不会骗到任何人。\""},{"stem":"本书建议处理\"麻烦而隐私的问题\"（如同事不讲个人卫生）时该怎么做？","options":["传小纸条","用对比法以尊重对方的方式说出感受，建立共同目的营造高度安全感","让HR去说","隐忍不发"],"answer":3,"explanation":"✅ \"不能用隐忍不发的方式。你可以用对比法，以尊重对方的方式说出自己的感受，和对方建立共同目的，营造高度安全感，让对方也加入'今后怎么办'的问题讨论。\""},{"stem":"在处理\"下属唯命是从缺乏自主意识\"时，如果问题出在前任领导而非自己，应怎么做？","options":["等待问题自行解决","开除下属","召开会议向所有成员公开说明——提出问题→征求意见→奖励说真话的人→用自我否定鼓励不同观点→必要时离开让大家自由讨论","不管不问"],"answer":3,"explanation":"✅ 通过公开会议鼓励不同观点，\"奖励说真话的人\"，用自我否定的方式鼓励表达。"},{"stem":"\"愤怒的时候可以暂停对话\"——这个建议的核心理由是什么？","options":["情绪主导时无法有效沟通，需要探寻对方产生愤怒的原因和动机","冷静的人更讲道理","避免打架","给上级面子"],"answer":0,"explanation":"✅ \"咱们先停一下，冷静之后再重新谈吧\"，暂停的目的是借此探寻让对方产生愤怒的原因，了解其行为动机。"},{"stem":"在\"旅馆账单\"案例中，妻子的一系列做法完美体现了哪套技巧？","options":["倾听四法+主动引导","综合陈述法+对比法","对比法+四步法","控制情绪四问"],"answer":0,"explanation":"✅ 妻子先分享事实（账单），试探性提出想法（担心婚外情），征询观点，做出试探表述（\"我不必担心吧\"），鼓励尝试（\"你觉得行吗\"）——完整使用综合陈述法+对比法。"},{"stem":"根据全书逻辑，以下哪一项是\"关键对话\"中最先应该做的？","options":["离开现场","直接说出你的不满","从反省自己开始——\"我的真正目的是什么\"","让对方先说"],"answer":1,"explanation":"✅ 全书第一条原则就是\"先反省自己\"，对应的核心问题是\"我的真正目的是什么？\"——自己的目的、他人的目的、关系的目的。"},{"stem":"如果有人问你\"面对一个让你极度愤怒但又不得不对话的人该怎么办\"，根据本书，最佳建议是什么？","options":["把气撒出来再说","找朋友诉苦然后回去吵","先回顾自己的行为方式→分析愤怒背后的想法→区分事实和主观臆断→用综合陈述法陈述事实和试探性想法→倾听对方观点","暂时离开"],"answer":0,"explanation":"✅ 这道应用题涵盖了全书最核心的技巧链条：控制情绪（回顾行为→分析想法→区分事实）→综合陈述法→倾听。这正是玛利亚案例的完整流程。"}]},{"name":"即兴演讲-汉弗莱","author":"朱迪思·汉弗莱","questions":[{"stem":"汉弗莱提出的\"领导者讲话脚本\"包含哪四个部分？","options":["抓手、要点、结构体、呼吁行动","问题、分析、结论、建议","自我介绍、演讲内容、总结、致谢","开场、正文、结尾、提问"],"answer":0,"explanation":"✅ 第十章详细介绍：脚本模板=抓手（吸引听众）→要点（核心观点）→结构体（论据支撑）→呼吁行动（唤起行动）。这个模板可扩展可收缩，适用于从电梯对话到正式演讲的各种场景。"},{"stem":"一个\"好的要点\"应具备多少个特征？","options":["6个","10个","4个","3个"],"answer":0,"explanation":"✅ 第十一章列出六个特征：①是自己的观点；②简单清晰的一句话；③有吸引力；④承载信念；⑤积极正面；⑥清晰可辨（让听众能识别出\"这就是要点\"）。"},{"stem":"在\"领导者讲话脚本\"中，\"抓手\"的作用是什么？","options":["与听众建立连接，吸引注意力","提出核心观点","提供论据和数据","要求听众采取行动"],"answer":0,"explanation":"✅ 第十章和第十三章：抓手是\"口头的握手\"，目的是在一开始就吸引听众、建立融洽关系。可以是友好的问候、对前面讨论的引述、延续某人的观点，或者表达关心。"},{"stem":"关于即兴演讲的准备，汉弗莱的核心观点是？","options":["\"即兴\"这个词本身就包含了\"准备\"的意思","准备会破坏即兴的自然感","只有正式演讲需要准备","即兴就是不要准备，临场发挥"],"answer":0,"explanation":"✅ 第八章：英文\"off the cuff\"（即兴）原指在衬衫袖口记笔记然后照着读。从古希腊的德摩斯梯尼到丘吉尔、乔布斯，最伟大的\"即兴\"演讲者其实都做了充分准备。"},{"stem":"以下哪种结构体模式是按照\"描述情况+给出反应\"来组织的？","options":["情况/反应模式","时间顺序模式","方法模式","原因模式"],"answer":0,"explanation":"✅ 第十二章四种结构体模式：①原因模式（罗列支持要点的理由）；②方法模式（列出具体行动方式）；③情况/反应模式（先描述挑战/情况，再描述如何应对）；④时间顺序模式（按时间线展开）。"},{"stem":"\"呼吁行动\"部分可以采取以下哪种形式？","options":["只能用\"谢谢大家\"","可以是将话语权交给对方、要求做出决定、介绍后续步骤、鼓励他人、传达最后通牒或激发合作","只能要求对方做决定","可以什么都不说直接结束"],"answer":1,"explanation":"✅ 第十三章列举呼吁行动的六种形式：①将话语权交回对方；②要求做出最终决定；③介绍后续步骤；④鼓励他人；⑤传达最后通牒；⑥激发合作。"},{"stem":"汉弗莱认为，真实性领导力最核心的含义是什么？","options":["不对任何人表达负面情绪","分享真实的自我，包括想法、信念、感受、脆弱和故事","想说什么就说什么","始终保持严肃正式"],"answer":1,"explanation":"✅ 第五章：真实性领导力意味着在即兴对话中保持真实性、开放性，在私人层面与公众建立连接。包含六个方面：真实处于当下、分享想法、分享信念和价值观、分享感受、分享脆弱、分享故事。"},{"stem":"在做项目进展汇报时，汉弗莱最推荐的方式是？","options":["用领导者讲话脚本：抓手→正面要点→结构体论据→呼吁行动","只汇报好消息","按照时间顺序从头到尾讲","详细列出所有事实和数据"],"answer":0,"explanation":"✅ 第十四章：项目汇报要避免只谈事实的信息倾卸。应该在汇报伊始就提出积极正面的要点，然后用结构体提供论据，最后以呼吁行动结束。这是向与会者\"营销\"你的项目和你的能力的时刻。"},{"stem":"电梯对话（电梯营销）最关键的要素是？","options":["越详细越好","不要说太多话","30秒内传达核心信息——你是谁、你在做什么、为什么重要","只交换名片"],"answer":2,"explanation":"✅ 第十五章：电梯营销的关键是快速传达核心信息。利用领导者讲话脚本的四部分（抓手-要点-结构体-呼吁行动），在极短时间内让高管/决策者记住你是做什么的以及你带来的价值。"},{"stem":"关于敬酒词和致敬词，汉弗莱的核心建议是？","options":["保持积极正面、做好调查、使用脚本模板","讲几个有趣的糗事","越短越好","念准备好的稿子"],"answer":0,"explanation":"✅ 第十七章特别强调：切勿讲让人尴尬的糗事（书中反例：一位高管分享了退休员工的迟到、愚蠢幽默等糗事）。好的致敬词要\"保持积极正面、做好调查了解对象、使用领导者讲话脚本\"。"},{"stem":"汉弗莱建议在\"了解听众\"的三个时间点是什么？","options":["讲话后收集反馈即可","讲话前、讲话中、讲话后","讲话前、讲话开始时、讲话结束时","只讲话前需要了解"],"answer":1,"explanation":"✅ 第九章提出了\"讲话前、讲话中、讲话后\"三个时间点了解听众。讲话前分析听众知识水平和关注点；讲话中观察肢体语言和注意力；讲话后反思效果并寻求反馈。"},{"stem":"在会议中\"分享观点\"时，最重要的是？","options":["等到被点名再说话","附和领导的意见","最后发言做总结","知道自己想表达什么观点以及有什么论据支撑"],"answer":3,"explanation":"✅ 第十四章：即使在非正式讨论中，领导者也应该准备好自己的观点和论据。有人问到你的时候，你能清晰有力地回应——这不只是回答，更是展示你领导力的时刻。"},{"stem":"\"信息倾泻\"式讲话的问题是什么？","options":["太短了","太正式","太情绪化","只有信息没有观点，听众不知道讲话者想说什么"],"answer":3,"explanation":"✅ 第六章和第十一章反复指出：很多人说话时基于内容而非观点——围绕一个话题给出大量信息，却没有一个核心的\"我认为\"\"我相信\"。听众听完后困惑：\"所以你的意思是？\""},{"stem":"\"尊重\"在即兴演讲中的重要性体现在哪里？","options":["尊重自己、尊重组织、尊重管理者、尊重同事——四个维度缺一不可","尊重只是形式","尊重会削弱演讲的力量","尊重只对上级重要"],"answer":0,"explanation":"✅ 第七章提出了四个尊重维度：①尊重组织（正面支持公司，不在公开平台抱怨）；②尊重管理者（建设性互动而非公开指责）；③尊重同事（有团队精神，不诋毁）；④尊重自己（维护个人品牌，不自我贬损）。"},{"stem":"在求职面试中运用领导者讲话脚本，以下哪项是正确的？","options":["面试官问什么就答什么不需要观点","不需要准备脚本","准备脚本但不主动全篇背诵，而是在回答问题时从中抽取内容","把脚本逐字逐句背下来然后全部主动说出来"],"answer":2,"explanation":"✅ 第十五章：面试脚本要牢记在心但不逐字背诵——面试官引导谈话，你从脚本中抽取抓手、要点、论据和案例来回应。这样听起来自然、即兴且充满自信，而非机械背诵。"},{"stem":"汉弗莱提出\"保持专注\"的原因是？","options":["专注使人更专业","上级要求简洁","现代人注意力时长只有8秒，比金鱼还少1秒","听众期望听到长篇大论"],"answer":2,"explanation":"✅ 第六章引用美国国家生物技术信息中心数据：人类平均注意力从2000年的12秒降至2013年的8秒。这意味着即兴演讲者必须每隔8秒抓回听众注意力，长篇大论必然失去听众。"},{"stem":"书中提到的最重要领导力信息\"引领当下\"指的是什么？","options":["做出正确的决策","成为团队的榜样","永远做第一个发言的人","在每一次对话、每一次互动中都有意识地施加积极影响"],"answer":3,"explanation":"✅ 全书贯穿的核心概念：\"引领当下\"意味着抓住每一个即兴时刻来影响和激励他人。无论是一对一对话、团队会议还是电梯偶遇，每次开口都可以是领导力时刻。"},{"stem":"关于\"缩减演讲\"，汉弗莱的三种方法是？","options":["只讲前一半、发给听众资料、缩短时间","道歉然后加快速度讲完","删掉内容、加速讲话、跳过幻灯片","放弃幻灯片讲核心想法、选择关键幻灯片、只阐述要点"],"answer":3,"explanation":"✅ 第十六章三种缩减方法：①放弃幻灯片，只讲核心想法（抓手→要点→结构体→呼吁行动）；②只选4-6张关键幻灯片来讲；③只阐述要点（一句话概括核心观点）。最糟糕的做法是加速把所有内容讲完。"},{"stem":"以下哪种属于\"呼吁行动\"的正确形式？","options":["\"散会\"","\"感谢大家，我的演讲完了\"","\"以上就是我的全部内容\"","\"我的观点就是这些，你对此有什么看法？\""],"answer":3,"explanation":"✅ 第十三章：呼吁行动是将话筒交还给听众、邀请对方参与对话、要求做出决定或明确下一步行动。\"你有什么看法？\"\"我希望你能批准\"\"我们一起头脑风暴吧\"都是好的呼吁行动。"},{"stem":"在社交活动中进行\"一对一社交\"时，汉弗莱建议的关键是？","options":["知道自己想从谈话中获得什么，有明确的焦点","让对方一直说话","讲自己的全部经历","先聊天气再进入正题"],"answer":0,"explanation":"✅ 第十五章引用伊恩·戈登和尼克的例子说明：成功的社交对话都有明确的焦点——你想获得职业建议？你想了解某个行业？你想获取人脉？在谈话前想清楚目标，会让你在10分钟内收获颇丰。"},{"stem":"关于\"要点\"的描述，以下哪项不正确？","options":["要点应该积极正面","要点可以有多个","要点是简单清晰的一句话","要点承载着你的信念"],"answer":1,"explanation":"✅ 第十一章明确指出：要点只能有一个。太多观点和没有观点一样糟糕——都会使听众头脑混乱。一个好的即兴演讲围绕一个核心观点展开。"},{"stem":"汉弗莱建议如何应对被人要求\"缩减到5分钟\"的情况？","options":["快速把所有内容念完","放弃幻灯片，用抓手→要点→结构体→呼吁行动讲述核心想法","说\"这不可能\"","只放PPT快速翻页"],"answer":1,"explanation":"✅ 第十六章：被要求缩减时，最佳做法是不用幻灯片，直接用脚本模板讲核心想法。\"在几分钟内，我将分享我的观点……这就是我希望的……这就是为什么……这就是我建议的行动。\"用卡片记录要点以做提示。"},{"stem":"汉弗莱强调\"向最优秀的人学习\"可以通过什么方式实现？","options":["看他们的演讲视频","直接约谈他们，并且在对话中明确表达你想要什么","读他们的书就行","参加他们举办的培训"],"answer":1,"explanation":"✅ 第十五章例子：尼克想从事联合国维和工作，他直接约见了加拿大驻联合国大使，明确说\"我来这里是要学习实现梦想该走的步骤\"。这种直接的、有准备的对话让他获得了宝贵的指导和更多资源。"},{"stem":"汉弗莱认为即兴演讲最大的敌人是什么？","options":["缺乏自信","没有观点和结构——想什么说什么、想到哪说到哪","缺乏词汇量","普通话不标准"],"answer":1,"explanation":"✅ 全书：最糟糕的即兴演讲是\"信息倾卸\"——想到什么说什么，没有核心观点（要点），没有组织（结构体），听众听完不知道他想表达什么。解决方案是用领导者讲话脚本模板来组织思维。"},{"stem":"关于\"观点的重要性\"，书中提到哪家电信公司的竞标故事？","options":["沃达丰","中国电信","未具名电信公司——要点\"我们是令人安心的唯一供货商\"胜出","AT&T"],"answer":2,"explanation":"✅ 第十一章：一家电信公司向航空航天公司竞标，招标方要求\"用十个以内的词回答为什么选你们\"。多数供应商手忙脚乱，只有一位准备好了要点的客户说了\"我们是令人安心的唯一供货商\"，最后胜出。"},{"stem":"\"尊重你的管理者\"的正确理解是？","options":["不对老板说任何负面的话","建设性互动——知无不言、提出新观点、提出对公司和老板都有利的建议，同时尊重老板的最终决定","无条件执行老板的决定","拍上司马屁"],"answer":1,"explanation":"✅ 第七章：尊重管理层不意味着阿谀奉承。最好的员工是与上司进行建设性互动的员工——提出好想法、理解不是每个建议都会被采纳、支持最终决定。公开挑战或恶意批评则是职场毒药。"},{"stem":"在敬酒词中讲故事时应避免什么？","options":["讲让人尴尬的糗事，即使当事人也在笑","讲关于新郎/新娘的故事","保持积极正面","简短致辞"],"answer":0,"explanation":"✅ 第十七章明确警告：幽默不能取代领导力。某人讲退休员工的迟到、愚蠢幽默和派对糗事，大家笑了但心里为当事人难堪。好的致敬词要找到真正的、正面的感悟，而非收集让人尴尬的轶事。"},{"stem":"什么是\"口头的握手\"？","options":["抓手部分——在即兴演讲开场吸引听众并与他们建立连接","演讲时的肢体语言","结束时的致谢","见面时的打招呼"],"answer":0,"explanation":"✅ 第十三章：\"把手部分看作是一种'口头的握手'\"——它是你与听众之间的第一次连接，可以是问候、引述、表达感谢或谈及共同经历，目的是让听众愿意跟着你走。"},{"stem":"汉弗莱建议在\"展示真实性\"时应该分享什么？","options":["把一切都分享出来","只谈工作不谈私人生活","分享当下、想法、信念、感受、脆弱和故事","只分享成功故事"],"answer":2,"explanation":"✅ 第五章六个策略：①真实处于当下；②分享想法；③分享信念和价值观；④分享感受；⑤分享脆弱；⑥分享故事。但注意：分享脆弱不能削弱领导力（如公开演讲时说\"我讨厌演讲\"就不合适）。"},{"stem":"书中讲到的\"领导者vs管理者\"的区别，在沟通层面主要体现在？","options":["领导者说话更少","领导者不需要沟通","领导者只说不做","领导者引领听众——每次开口都有明确的要点并带动行动"],"answer":3,"explanation":"✅ 全书核心：领导者和普通人在沟通上的差异不是声音大小或职位高低，而是\"引领\"——每次讲话都有清晰的要点、令人信服的论据和明确的行动呼吁，能够影响和激励他人。"},{"stem":"\"即兴\"的英文\"off the cuff\"最初的含义是？","options":["在衬衫袖口上做笔记然后照着念","随意说话","把手放在口袋里","脱掉外套"],"answer":0,"explanation":"✅ 第八章：\"off the cuff\"一词在1936年首次出现时，与人们在衬衫袖口上记笔记的习惯相关。政治家、演员一直使用这种方法，把发言稿记在纸制袖口上，然后在讲话时偷看。"},{"stem":"书中提到特鲁多总理在什么情境下展示了即兴演讲能力？","options":["外交演讲","被记者要求解释量子计算时","竞选辩论","国会质询"],"answer":1,"explanation":"✅ 第八章：加拿大总理特鲁多在宣布5000万美元科研资金后，一位记者开玩笑地请他解释量子计算。特鲁多欣然接受并给出了清晰精彩的即兴回答，视频被疯狂传播。《名利场》称他为\"你梦中的男人\"。"},{"stem":"汉弗莱集团帮助一位电信公司销售主管在竞标中获胜，他的要点是什么？","options":["\"我们是令人安心的唯一供货商\"","\"我们经验最丰富\"","\"我们价格最低\"","\"我们的技术最好\""],"answer":0,"explanation":"✅ 第十一章：当招标方要求\"用十个以内的词回答为什么选你们\"时，这位主管说了\"我们是令人安心的唯一供货商\"——这就是要点（一句话承载信念），最终胜出。要点可以改变一切。"},{"stem":"书中提到哪位著名演讲家在司机开门时说\"请稍等，我还在看我的即席演讲稿\"？","options":["乔布斯","丘吉尔","林肯","肯尼迪"],"answer":1,"explanation":"✅ 第八章：丘吉尔坐车到演讲地点，司机为他开门，他却不下车，说\"请稍等，我还在看我的'即席'演讲稿\"。这个经典段子说明了即使是最伟大的即兴演讲者也在做充分准备。"},{"stem":"书中警告不要使用什么样的\"抓手腕\"？","options":["\"早上好\"","\"很高兴见到你\"","\"我正想找你\"","\"你的家人怎么样了？\"——可能导致对方讲很长时间家庭故事偏离主题"],"answer":3,"explanation":"✅ 第十三章提醒小心\"偏离正轨的抓手\"：如果问\"你的家人怎样了？\"结果对方可能滔滔不绝讲母亲生病的故事。抓手要吸引注意力并导向主题，而非引入无关话题。"},{"stem":"汉弗莱特别提到哪一个职业的面试让她最有成就感？","options":["教师","律师","医生（帮助年轻人准备医学院面试）","工程师"],"answer":2,"explanation":"✅ 第十五章开篇：一位客户请汉弗莱指导女儿准备医学院面试。通过共同努力，她成功被心仪的医学院录取并最终成为一名急诊科医生。这说明准备脚本对面试成功至关重要。"},{"stem":"在\"了解听众\"一节中，书里提到在日本的棒球比喻故事的教训是什么？","options":["日本人喜欢棒球","应该用当地语言演讲","演讲要生动有趣","注意跨文化差异——在日本的即兴演讲中使用\"全速前进\"\"把球打出场地\"等棒球比喻让人困惑不解"],"answer":3,"explanation":"✅ 第九章：一位副总裁在日本的即兴演讲中使用了大量棒球术语（\"把油门踩到底\"\"把球打出场地\"），结果日本听众完全没理解。这说明在跨文化场合必须了解听众的文化背景和习惯用语。"},{"stem":"克林特·伊斯特伍德在2012年大会上做了什么被汉弗莱用作反面教材？","options":["精彩的演讲","拒绝发言","即兴唱歌","对空椅子假装与总统对话的即兴表演，事后称为人生最困扰的\"傻事\""],"answer":3,"explanation":"✅ 第八章反面教材：伊斯特伍德2012年在大会上即兴设计滑稽短剧，对一把空椅子假装与总统对话，说错数字还说脏话。几年后他承认那是人生中最大的困扰——一个短暂的即兴时刻付出了巨大的声誉代价。"},{"stem":"关于电梯营销的\"世界巡回赛\"是在哪里举办的？","options":["纽约帝国大厦","上海中心大厦","多伦多CN电视塔","迪拜塔"],"answer":2,"explanation":"✅ 第十五章：\"电梯营销世界巡回赛\"在多伦多加拿大国家电视塔举办——企业家在乘坐世界最高电梯的旅程中向投资者做公司介绍，裁判和投资者在电梯行程中听取营销，获胜者获得种子基金。"},{"stem":"汉弗莱集团的资深合伙人建议客户写出多少条信念？","options":["3条","10条","5条","1条"],"answer":2,"explanation":"✅ 第五章：\"我要求他们写出自己的五个信念，然后对他们说'我们一起来探索一下每个信念'。\"这个练习帮助领导者在即兴演讲中触及真实的自我。"},{"stem":"一位副总裁学到当老板说\"只有5分钟\"时，最好的做法是？","options":["加速讲完30页PPT","说改期再讲","只放PPT不说话","提炼为抓手、要点、结构体和呼吁行动"],"answer":3,"explanation":"✅ 第十章脚本的可扩展性：30分钟演示→5分钟就是内容提要——抓手→要点→结构体→呼吁行动。汉弗莱建议准备提示卡：第一张写要点，后面几张分别写结构体的论据，最后一张写呼吁行动。"},{"stem":"书中提到哪位管理学作家的书帮助解释了比尔·盖茨的魅力来源？","options":["吉姆·柯林斯","彼得·德鲁克","西蒙·斯涅克——《从\"为什么\"开始》","迈克尔·波特"],"answer":2,"explanation":"✅ 第五章引用西蒙·斯涅克《从\"为什么\"开始》：盖茨的魅力不在于口若悬河，而在于他与听众分享自己的信念。尽管害羞难为情，人们却抓住他的每句话反复回味数周、数月甚至数年。"},{"stem":"\"要点的力量\"一节中，詹姆斯向CEO汇报坏消息的案例说明什么？","options":["应由下级间接汇报","用要点结构（紧急→问题→解决方案→请求批准）比信息倾卸更有效","坏消息不应该汇报","直接报告结果就行"],"answer":1,"explanation":"✅ 第十一章：詹姆斯最初汇报井钻事故时是\"信息倾卸\"——讲了很久没有重点，CEO恼怒地问\"到底出了什么事\"。修改后以要点为基础：先警示紧急情况，再说问题和解决方案，请求批准。CEO立刻同意。"},{"stem":"罗伯特·肯尼迪致小马丁·路德·金的悼词成功的主要原因是？","options":["政治正确","篇幅长","辞藻华丽","发自内心的真实感受+事先有准备+现场即兴调整"],"answer":3,"explanation":"✅ 第十七章案例分析：肯尼迪抵达机场时听到金被枪杀的消息，把准备好的竞选演讲稿塞进口袋，即兴发表悼词。他引用希腊诗人埃斯库罗斯的诗句，用不到5分钟的讲话感动了世界，当晚该城市没有发生暴乱。"},{"stem":"汉弗莱学习到的重要教训——在一次社交活动中她做了什么导致尴尬？","options":["穿错衣服","对一位正在交谈的CEO大喊\"嗨，吉姆\"试图插话，但被完全忽略","喝多了","没带名片"],"answer":1,"explanation":"✅ 第十五章：汉弗莱参加\"非请勿入\"的社交活动，看到认识的CEO正与一群人交谈，她走过去大喊\"嗨，吉姆\"，以为对方会暂停谈话，结果被完全忽略。教训：必须有外交敏感度，等到对方有空时再上前。"},{"stem":"你突然被告知要把30分钟演讲缩减到3分钟，最佳做法是？","options":["只讲第一页和最后一页","说\"做不了\"，坚持30分钟","快速念一遍所有PPT","用领导者讲话脚本：抓手一句话→核心要点一句话→结构体用最简单的方式给出三个论据→呼吁行动一句话"],"answer":3,"explanation":"✅ 第十六章：微型演讲稿就是围绕脚本模板压缩。记住：要点不能丢、论据选最关键的、呼吁行动必须保留。放弃幻灯片，\"在几分钟内分享我的观点\"。"},{"stem":"你在电梯里遇到公司CEO，只有30秒时间，说什么最有效？","options":["\"您好，我是XX部门的小X，一直在负责XX项目，最近我们刚刚实现了……(一个具体成果)，希望能有机会向您详细汇报\"","\"今天天气真好\"","假装没看到","\"您吃了吗\""],"answer":0,"explanation":"✅ 第十五章电梯营销：抓住抓手（打招呼/自我介绍）→要点（一个成就或一个请求）→呼吁行动（\"希望能有机会进一步汇报\"）三要素。C是最好的脚本，让CEO记住你并可能给你一个后续机会。"},{"stem":"一位同事在会上发言后，你不同意他的观点。如何回应？","options":["\"我完全同意\"（违心）","沉默不语","\"我理解你的想法（抓手），我还有一点点不一样的看法（过渡），我认为在这件事上……因为……所以建议我们……\"","\"你说的不对，我认为……\""],"answer":2,"explanation":"✅ 第十三章抓手+第十四章分享观点：切忌\"我不同意\"或\"你说的不对\"开头。用\"我理解你的想法，我也分享一下我的看法\"或\"是这样，我还有一点点不一样的看法\"来保持安全氛围，然后用脚本表达你的观点。"},{"stem":"你被要求为新入职的同事做3分钟即兴分享，如何组织？","options":["说\"我没什么好说的\"","讲自己刚入职时的所有糗事","抓手：\"欢迎加入我们的团队！\"→要点：\"我相信在这里你会收获三样东西\"→结构体（方法模式）：第一、第二、第三→呼吁行动：\"如果有什么需要帮助的，随时来找我\"","只讲公司规章制度"],"answer":2,"explanation":"✅ C使用了完整的领导者讲话脚本——抓手（欢迎建立连接）、要点（一句话承载核心观点）、结构体（方法模式列出三样收益）、呼吁行动（鼓励对方并开放帮助）。这样的即兴发言既有温度又有结构，能给新人留下深刻印象。"},{"stem":"你需要在团队会议中汇报一个进展不太理想的项目，怎么讲才能维持信心？","options":["直接说\"项目失败了\"","让别人替你汇报","\"目前项目遇到了一些挑战（抓手），但我相信我们能够克服（要点）。因为：第一，我们已经找到了问题的根源；第二，团队已经制定了应对方案；第三，类似问题在其他项目中也成功解决过（结构体）。接下来我需要大家配合……（呼吁行动）\"","只汇报好的部分"],"answer":2,"explanation":"✅ 第十一章：要点应该是积极正面的，即使面临挑战——\"但我相信我们可以……\"。用\"情况/反应模式\"的结构体：先明确挑战（诚实面对），再展示应对方案（给人信心），最后以具体行动呼吁结束（推动前进）。"}]},{"name":"有钱人和你想的不一样","author":"田口智隆（日本财务自由实践者，28岁时负债500万日元，后通过改变思维方式实现财","questions":[{"stem":"作者28岁时经历了什么人生低谷？","options":["被公司裁员","欠债500万日元，月收入仅13万日元","创业公司倒闭","投资失败血本无归"],"answer":0,"explanation":"✅ 作者自述28岁时\"沉溺于赛马、老虎机、麻将、夜店、名牌，深陷巨额信用卡透支的地狱，欠账500万日元，月收入只有13万日元\"。"},{"stem":"下雨天买伞的案例中，作者认为有富人潜质的人会选择什么？","options":["不买伞，淋雨跑回去","借别人的伞","商场高价高质伞","便利店500日元的塑料伞"],"answer":2,"explanation":"✅ 富人看重使用时长和综合价值。塑料伞\"每月买两把，一年超1万日元\"，高质伞性价比更高，还要考虑给人留下的印象。"},{"stem":"A先生用5万日元的万宝龙笔，最重要的理由是什么？","options":["显示自己有钱","万宝龙笔的书写效果更好","笔是信任的象征，能给商业伙伴\"可以信赖\"的印象","朋友都这样用"],"answer":2,"explanation":"✅ A先生说\"高质笔不会写不出字，因为昂贵所以更爱惜。笔是信任的象征。使用高质笔会给予商业伙伴'可以信赖'的印象。\""},{"stem":"日本彩票头奖中奖者中，多大比例最终破产？","options":["90%","70%","30%","50%"],"answer":1,"explanation":"✅ 作者明确指出\"日本彩票头等奖中奖者中，七成最后破产失败\"，说明即使获得巨款，没有富人的价值标准也留不住钱。"},{"stem":"富人选择在\"便利店ATM\"而非\"银行门店\"取现金的理由是什么？","options":["手续费更便宜","便利店更近","节省时间——\"时间就是金钱\"","银行服务不好"],"answer":1,"explanation":"✅ 作者说\"完全不会产生任何价值的排队，在富人眼里就是很浪费时间的一件事情\"。同时也要注意选择与便利店合作免手续费或有手续费优惠的银行。"},{"stem":"要成为富人，买房还是租房？","options":["不买房也不租房","在市中心租房","在郊外贷款买大房子","全款买小房子"],"answer":1,"explanation":"✅ 贷款买房失去成为富人的\"本钱\"——万事以还贷优先，投资变成第二顺位。租房可灵活应对风险，且住在市中心节省通勤时间。"},{"stem":"\"万金油\"式的人为什么难以成功？","options":["运气不好","工作不够努力","人际关系不好","学得太杂，失去专业竞争力"],"answer":1,"explanation":"✅ 作者指出\"什么都能解答的讲师没有存在感\"，\"什么都能用的'万金油'会让自己很没有存在感。如果你在做的工作其他人都能做，那么就完全没有意义。\""},{"stem":"从投资角度看，富人认为股价什么时候是买入的好时机？","options":["股价大幅跌落时","股价长期平稳时","股价迅速上升时","任何时候都适合"],"answer":0,"explanation":"✅ 作者以雷曼兄弟破产时为例说明\"低谷就是最大的机会\"，\"越是不景气，越是投资的好机会\"。"},{"stem":"投资从什么时候开始最好？","options":["攒够100万日元","有1万日元就可以开始","攒够1000万日元","退休以后"],"answer":0,"explanation":"✅ \"获得了财富的人，往往是从现在能做的事开始做起来。就算手头只有1万日元，也会去购买能力范围内的理财产品\"，先获得投资体验再慢慢积累。"},{"stem":"作者建议回复工作邮件的最佳方式是什么？","options":["永远不回复","每天统一回复一次","每周回复一次","收到后立即回复"],"answer":1,"explanation":"✅ 即时回复会打断集中状态，人的精神只能集中30-60分钟。成功人士\"统一回复一次邮件\"，把精力集中在能直接产生价值的\"主业\"上。"},{"stem":"作者推荐用什么方式管理时间表？","options":["不管理，随性而为","手写笔记本备忘录","助理帮忙管理","智能手机APP"],"answer":1,"explanation":"✅ 手写笔记本可以\"回顾过去\"，在跟重要的人再次见面时可以翻看记录记住首次见面细节，传达\"与你的相会是重要的事\"，起到人脉管理的作用。"},{"stem":"提前多久到达约定地点，是成功人士的通常做法？","options":["提前2小时","提前3分钟","提前30分钟","准时到达"],"answer":2,"explanation":"✅ 提前30分钟可以沉着应对变故，在附近咖啡店等待。作者还建议约定地点选在书店附近，等待时可以看到最新资讯作为谈资。"},{"stem":"\"包里面的状态，就是你头脑中的状态。\"这句话说明了什么？","options":["应该买更大的包","包包越贵重越好","不用包的人最聪明","成功人士的包很轻，因为他们清楚什么是必需的"],"answer":0,"explanation":"✅ 成功人士头脑中已经进行了思考和整理，知道当天需要和不需要什么，不会把所有东西一股脑儿装进包里。"},{"stem":"花2万日元买水钻手机壳的女企业家，作者认为这笔钱属于什么性质？","options":["绝对的浪费","对她而言是投资","属于储蓄","单纯的消费"],"answer":0,"explanation":"✅ 因为每次看到心情舒畅干劲十足（情绪价值），每个见面的人都会以此为话题打开局面（社交工具），所以对她而言是\"投资\"。"},{"stem":"消费税上涨的消息传来，富人与普通人的反应有何不同？","options":["富人和普通人反应一样","富人会分析\"接下来该怎么做\"，将其视为重新规划收入和支出的契机","富人会觉得是坏事，然后感叹运气不好","富人生气，普通人高兴"],"answer":1,"explanation":"✅ 富人不会停在\"好\"\"不好\"上，而是想\"按照过去模式生活肯定行不通，要么减少支出要么增加收入，开始一项副业\"——\"低谷就是机会\"。"},{"stem":"在保险公司工作了7年的作者发现，能持续出业绩的人有什么共同特点？","options":["最勤奋","能获得外界支持——客户自动相互介绍","口才最好","人脉最广"],"answer":1,"explanation":"✅ \"能不断出成果的人，不用自己事事亲力亲为地去努力，自有客户自动相互介绍，客源慢慢扩大。\"其秘诀是\"成为反馈者\"。"},{"stem":"作者选择推荐\"新生银行\"是因为什么？","options":["最具知名度","与7-11便利店合作，取款无手续费","利息最高","服务态度最好"],"answer":2,"explanation":"✅ 新生银行虽然门店少，但与全日本7-11合作，存取款无手续费。作者强调要\"用战略的眼光去选择银行\"，长远来看每月手续费积少成多是一笔浪费。"},{"stem":"本书建议买保险时做什么选择？","options":["不买任何保险","定期保险","终身保险","买最高额保险"],"answer":1,"explanation":"✅ \"富人将'保险'和'储蓄'分开来考虑\"，保险是\"以防万一的保障\"，储蓄应投资获取更大收益。20-30岁的年轻人与其买高额保险，不如把钱用于自我投资。"},{"stem":"富人对于子女教育的倾向是什么？","options":["必须学数理化","随孩子自己决定","支持学习外语，不反对去国外非名牌大学","一定要上国内名校"],"answer":2,"explanation":"✅ 作者认为\"好好学习英语\"，加上中文，就可以畅游商业世界。吉姆·罗杰斯为女儿聘中文教师的例子。名校不等于成功，全球化时代外语是关键。"},{"stem":"富人乘坐新干线时的选择通常是什么？","options":["永远指定席","永远自由席","不坐新干线","灵活选择——平时自由席，节假日或重要场合指定席"],"answer":3,"explanation":"✅ 作者认识的投资家\"出差时基本非指定席。公众假期则指定席。见客户时会预订高级酒店。跟家人旅行舍得花钱。\"核心是\"看重性价比\"。"},{"stem":"富人在便利店支付时的选择是什么？","options":["赊账","信用卡透支","现金支付","电子支付"],"answer":2,"explanation":"✅ \"成大器的人，会注意不让身边的人遭受损失。\"电子支付省去找零时间，收银员一键搞定，等候客人也不抱怨。且电子支付不能赊账，不会造成浪费。"},{"stem":"想要增加收入，作者建议的最佳方式是什么？","options":["辞职创业","定时下班做副业","积极加班，争取晋升","等待公司加薪"],"answer":2,"explanation":"✅ \"身为员工通过晋升获得成功的，还真是没有。\"工资上涨有限度，副业可以自己做主。先培育收入第二渠道，等超过主业再考虑创业。"},{"stem":"作者认为一个人应该使用几张信用卡？","options":["1张","5张","越多越好","不用信用卡"],"answer":0,"explanation":"✅ 信用卡越多越难管理自己的收支。富人用1张信用卡且\"一次付清\"，不用设定还款金额的分期模式。"},{"stem":"巴菲特在投资上的基本路线是什么？","options":["只投资外汇","长期投资，坚决不做短线","每天短线操作","只投资房地产"],"answer":3,"explanation":"✅ 作者提到\"巴菲特基本投资路线就是长期投资，坚决不做短时间获益的投资\"，他在自己擅长的领域一决胜负。"},{"stem":"销售员贷款买劳力士手表的案例说明了什么？","options":["不应借钱消费","所有人都应该买奢侈品","好的借款可以成为赚钱的原动力","炫富很重要"],"answer":3,"explanation":"✅ 借款分\"有益的借款\"和\"有害的借款\"。该销售员借贷款买高级手表和西装是为了赢得客户信任，最终成为成功经营者。\"漫长的攒钱时间里，机会也就错失了。\""},{"stem":"富人在阅读方面的习惯是什么？","options":["既读自己喜欢的，也关注畅销榜","只读自己喜欢的书","只读专业书籍","不读书"],"answer":1,"explanation":"✅ \"爱读书的富人多\"，每周读书超10本的朋友很多。\"读书的数量和收入的多少呈正比\"。富人也关注畅销榜，因为\"畅销榜中有这个时代的气息\"。"},{"stem":"作者提倡的\"钱包管理\"方法是什么？","options":["用短钱包放在裤子后口袋","随便放就行","用长钱包，保持整洁，纸币平整叠放","不用钱包"],"answer":2,"explanation":"✅ 长钱包让纸币\"舒服\"不被折叠，放在上衣内袋。作者说\"钱包整洁了，财神愿意回来\"，这不是迷信而是\"尊重金钱的人会赢得金钱\"。"},{"stem":"富人们关于\"家庭财务管理\"的做法多是怎样的？","options":["妻子给丈夫发零花钱","夫妻各自管理自己的收入","全部交给妻子管","全部交给银行理财"],"answer":2,"explanation":"✅ \"零花钱制度虽然可以减少支出，却不能帮助增加收入。\"自己控制钱包才能管理收支，做出独立的财务判断。"},{"stem":"在作者看来，成功人士的日程表有什么特征？","options":["只安排工作不休息","完全不做计划","有很多空余时间","总是排得满满的"],"answer":3,"explanation":"✅ \"时间安排得满满的人，不可能取得成功。\"满满的日程说明时间被别人占用，没有空当就抓不住机会。空余时间可做\"个人作战会议\"。"},{"stem":"乘坐新干线的\"指定席vs自由席\"选择中，作者认为富人的核心判断标准是什么？","options":["舒适度","面子","速度","性价 比"],"answer":0,"explanation":"✅ 作者认识的投资家按性价比衡量事物：\"出差基本非指定席。公众假期才选指定席。\"同时强调\"'反正是公司的钱'这种想法的人难成大器\"。"},{"stem":"F先生投资失败5年的根本原因是什么？","options":["市场不好","运气太差","没有在自己擅长的领域深耕，频繁换方法","本金太少"],"answer":2,"explanation":"✅ F先生\"5年内尝试了各种投资方法，虽然见过小利，到头来财富没有增长还赔了不少。\"真正的成功投资者都\"在自己擅长的领域一决胜负\"。"},{"stem":"对于\"只有一站地的距离\"，富人的选择通常是什么？","options":["坐公交","打车","骑车","步行"],"answer":0,"explanation":"✅ \"富人的生活不可少运动元素。\"时间充裕、天气好的时候步行。\"最重要的健康管理，就是适度运动\"。一位富豪说\"我愿意用我的财产换取我的健康\"。"},{"stem":"关于\"赚钱\"的态度，作者建议什么？","options":["认为钱是万恶之源","不谈论金钱","诚实对待自己的欲望","谦逊低调，爱财不言"],"answer":3,"explanation":"✅ 作者主张\"若真的期待财务自由，不如诚实地对待自己的欲望\"。\"对金钱有强烈欲望的人，能够发达致富\"——但不是为了炫耀，而是视财富为投入时间和精力的合理回报。"},{"stem":"书中提到的\"富人反馈原则\"是指什么？","options":["给客户送礼物","得到建议后去实践并把结果反馈给建议者","定期向领导汇报工作","给员工发奖金"],"answer":1,"explanation":"✅ 作者持续一年向投资家反馈阅读邮件后的实践成果，最终被邀请一起办讲座。作者说：\"我自己的感受就是，我很愿意去帮助那些认真读了我发布的信息，然后积极实践，将成果反馈给我的人。\""},{"stem":"吉姆·罗杰斯骑摩托车环游世界获得成功的启示是什么？","options":["摩托车是最佳交通工具","冒险比计算更重要","旅行本身就是投资","\"外出的距离等于收入的多少\"——通过亲身体验获取商业洞见"],"answer":3,"explanation":"✅ 罗杰斯在旅行中\"亲眼看到各国经济、社会、人们生活状态\"，把这些亲眼所见和亲身所感发挥在投资事业中。移动距离与收入成正比。"},{"stem":"对于一个选择理财培训师作为职业的人，作者最重要的建议是什么？","options":["在\"自己喜欢的、擅长的\"小领域深度挖掘","考取所有相关证书","什么都要学","找最赚钱的方向"],"answer":0,"explanation":"✅ \"在自己小小领域里面深耕，会有很多机会找上门来。想追求事业的广度，还是先把脚下的领域研究透了再说吧。\""},{"stem":"选择电子支付而非现金支付体现了富人什么特质？","options":["不让身边的人遭受损失","花钱更大方","追求科技潮流","不想带现金"],"answer":2,"explanation":"✅ \"成大器的人，不但会考虑切身的利益，还会为对方打算。\"电子支付省去找零钱时间，不让收银员和其他排队顾客等待。"},{"stem":"对F先生频繁切换投资方法的失败经历，作者认为正确的投资态度应该是什么？","options":["只存银行","在一种方法上精通后再考虑扩展","不投资最好","同时做多种投资"],"answer":3,"explanation":"✅ \"在彻底弄明白一项投资方法之前就转移目标，到头来还是一场空。\"需要先在自己的优势领域站稳脚跟。"},{"stem":"作者建议如何处理保险和储蓄的关系？","options":["买最便宜的保险","不买保险全存银行","保险就是储蓄","两者分开——保险防万一，储蓄做投资"],"answer":3,"explanation":"✅ \"富人将'保险'和'储蓄'分开来考虑。保险就是以防万一的保障。与其将保险功能以外的钱存进保险公司，不如充分进行投资。\""},{"stem":"书中建议如果想让孩子成功，最应该优先培养什么能力？","options":["领导力","外语能力（英语+中文）","数学能力","考试能力"],"answer":3,"explanation":"✅ 作者认为\"世界人口1/4把英语作为日常沟通工具\"，\"英语是通往未来的敲门砖\"。建议至少学习\"英文和中文\"。"},{"stem":"为什么有人选择1万日元高质伞而不是500日元塑料伞——最核心的思维差异是什么？","options":["更有钱","以长远性价比衡量，而非只看单价","不喜欢塑料","更爱面子"],"answer":0,"explanation":"✅ 这是全书最核心的观点——富人以使用时长和综合价值衡量事物，普通人只看眼前的价签。塑料伞一年买多把超1万日元，高质伞性价比反而更高。"},{"stem":"成功人士时间表\"有很多空余\"的目的是什么？","options":["等人约","偷懒","做\"个人作战会议\"——思考事业和未来","能做更多工作"],"answer":2,"explanation":"✅ \"个人作战会议\"即自己面对自己，思考工作方向、回顾总结问题、积极展望未来。有的富人为此专门预订高级酒店安静思考。"},{"stem":"书中提到好的借款和坏的借款的根本区别是什么？","options":["借款时间长短","利率高低","借款金额大小","是用于投资（赚钱原动力）还是消费（无价值浪费）"],"answer":3,"explanation":"✅ 作者的经验——坏的借款\"为了打老虎机、赛马、泡吧\"，好的借款\"能成为赚钱的原动力，为了早还掉借款而拼命工作\"。"},{"stem":"作者指出，喜欢在公开场合谈论金钱的人有什么特征？","options":["理财能力更强","更诚实","以金钱为标准判断事物，容易看不到事物本质","是真正的富人"],"answer":0,"explanation":"✅ \"富人深知这个道理，在人前是不会谈论金钱这个话题的。\"以金钱为标准的人\"容易看不到事物的本质\"——跳槽时只盯工资，不看是否喜欢、是否有前景。"},{"stem":"本书认为富人更倾向于怎样度过一站地的距离？","options":["坐公交去","步行去","只在天气好时步行","打车去"],"answer":3,"explanation":"✅ \"在时间充裕、天气良好的时候，会自己步行前往。\"但如果是下雨天见客户，则毫不犹豫打车——\"身上湿漉漉的会让对方感觉不快\"。"},{"stem":"以下哪一项最符合本书对\"富人选择标准\"的概括？","options":["凭感觉选","选最便宜的","以长远眼光、综合价值和性价比为衡量标准","选最贵的"],"answer":3,"explanation":"✅ 全书通过雨伞、笔、信用卡、保险、住房、投资等几十个案例反复证明——富人的核心选择标准是长远眼光+综合价值+性价比，而非简单看价格。"},{"stem":"关于收集信息的习惯，富人和普通人最大的区别是什么？","options":["富人\"活用信息\"——思考\"别人会如何反应\"，而普通人\"收集信息\"后就满足","富人看更多新闻","富人看报纸，普通人看网络","富人不关心新闻"],"answer":0,"explanation":"✅ 同样是\"便利店100日元咖啡畅销\"的新闻，普通人的反应是\"我也买来尝一尝\"，富人则会思考咖啡连锁店营业额受影响的连锁反应和投资机会。"},{"stem":"富人人际关系中的\"反馈\"体现在什么方面？","options":["频繁参加社交活动","给客户送礼","获得建议→实践→汇报结果→建立深度信任","名片交换"],"answer":0,"explanation":"✅ 作者通过持续一年向投资家反馈实践成果，最终获得被邀请合作的机会。反馈说明认真和诚信，更容易获得贵人帮助。"},{"stem":"本书将零花钱制度的主要缺点总结为什么？","options":["管钱太麻烦","老公花钱太多","夫妻容易吵架","可以减少支出但无法增加收入"],"answer":1,"explanation":"✅ \"零花钱制度虽然可以减少支出，却不能帮助增加收入。也就是，无法致富。\"而且被控制用度后，判断事物的\"标准\"也会降低。"},{"stem":"如果有人问你\"到底应该买哪把伞\"，根据本书逻辑，你最应该反问什么？","options":["\"除了价格之外，你还考虑了什么？\"","\"今天会不会停雨？\"","\"你喜欢什么颜色？\"","\"你带了多少钱？\""],"answer":0,"explanation":"✅ 这正是全书核心的浓缩——\"你是否考虑过价格以外的因素？\"富人和普通人的分水岭不在于钱多钱少，而在于是否用长远眼光和综合价值来做每一次选择。"}]},{"name":"最重要的事只有一件","author":"加里·凯勒（Gary Keller）和杰伊·帕帕森（Jay Papasan）。凯","questions":[{"stem":"凯勒公司的转机来自于导师给了他什么建议？","options":["找到14个关键人并安排到正确职位上","裁员50%","融资上市","多做市场营销"],"answer":0,"explanation":"✅ 导师说\"耶稣需要12个门徒，而你只需要14个关键人\"。凯勒专注做这一件事后，公司不到三年实现盈利，利润连续10年以40%速度增长。"},{"stem":"凯勒发现关键人业绩提升的秘诀是什么？","options":["从\"本周最重要三项工作\"到\"本周最重要一项工作\"","延长工作时间","加薪激励","增加KPI考核"],"answer":0,"explanation":"✅ 他试着从\"本周几项工作\"到\"本周最重要的三项\"，再到\"本周最重要的两项\"，都不见效。最后问\"本周最重要的一项工作是什么？完成它其他都变得简单或不必要\"，14个关键人业绩直线上升。"},{"stem":"多米诺骨牌几何级数增长的寓意是什么？","options":["做好一件事的威力可以推倒远远更大的事","失败会连锁反应","骨牌游戏有益身心","团队合作最重要"],"answer":0,"explanation":"✅ 物理学家证明，一块骨牌可以推倒比它大50%的另一块。推到第57块已经能到达月球。寓意：做好一件恰当的事，其能量足以推动数件事甚至更多。"},{"stem":"关于\"待办事项清单\"，凯勒的核心观点是什么？","options":["大多数清单只是\"存活清单\"，需要升级为\"成功清单\"","每件事都要列在清单上","清单越长越好","根本不该用清单"],"answer":0,"explanation":"✅ 普通待办清单是\"存活清单\"——只能帮你应付日子。成功清单短小精悍，只聚焦最重要的一件事。清单上靠前的事不过是你先想到的，并不代表重要。"},{"stem":"帕累托法则（80/20法则）在本书中的极端应用是什么？","options":["从20%中再找20%，不断缩小直到找到最重要的那一件事","把时间平均分配","80%的事都不用做","只做20%的事"],"answer":0,"explanation":"✅ 凯勒说80/20法则只是第一步。你要继续缩小：从20%中找20%（即4%），再找20%（即0.8%），直到找到最重要的那一件事。"},{"stem":"斯坦福教授纳斯关于\"多面手\"的研究得出了什么结论？","options":["多面手抓不住重点，每件事都做得不怎么样","多面手更适合管理岗位","多面手效率更高","多面手是天生的领导者"],"answer":0,"explanation":"✅ 纳斯原以为多面手有特殊能力，研究发现他们其实\"抓不住重点，实在无法令人羡慕\"。同时处理几件事等于同时搞砸几件事。"},{"stem":"多任务处理的注意力切换成本是多少？","options":["简单任务≤25%，复杂任务高达100%或以上","没有成本","5%~10%","50%左右"],"answer":0,"explanation":"✅ 研究人员戴维·迈耶称：简单任务的时间成本≤25%，复杂任务成本高达100%或以上。员工每天平均有28%的时间浪费在任务转换上。"},{"stem":"凯勒认为\"养成一个习惯\"平均需要多少天？","options":["66天","100天","30天","21天"],"answer":0,"explanation":"✅ 伦敦大学2009年研究发现，养成习惯平均需要66天（最少18天，最多254天）。21天是自助小组的说法，被科学证明不现实。"},{"stem":"棉花糖实验中，能等待15分钟不吃糖的孩子后来表现如何？","options":["成绩更好、大学入学考试平均高210分、更善于处理压力","没有显著差异","更胖","更内向"],"answer":0,"explanation":"✅ 米加尔追踪500多名儿童30多年发现：能拿到第二颗棉花糖的孩子成绩更好，SAT高210分，更自信，肥胖率低30%，更少药物依赖。"},{"stem":"法官假释决策案例说明了什么？","options":["法官需要更好的培训","法官都很公正","下午的囚犯更坏","意志力会随消耗而降低——早餐后通过率65%，下午几乎为零"],"answer":3,"explanation":"✅ 研究涉及1112个听证会和8位法官。早餐后假释通过率65%，下午几乎为零。原因是意志力耗尽后，法官自动进入\"默认选项\"——拒绝保释。"},{"stem":"凯勒认为\"工作与生活平衡\"是什么？","options":["不重要","一个神话和谎言，应该追求\"制衡\"","完全可以实现的理想状态","可以通过时间管理实现"],"answer":1,"explanation":"✅ 凯勒认为绝对的平衡不存在，非凡成就需要专注与时间，必然打破平衡。应该用\"制衡\"替代：工作中长线制衡（聚焦最重要的事），生活中短线制衡（关键要素一个都不能长期忽略）。"},{"stem":"\"橡皮球和玻璃球\"比喻中，哪个是玻璃球？","options":["工作","家庭、健康、朋友、诚信","爱好","金钱"],"answer":1,"explanation":"✅ 詹姆斯·帕特森说：工作是个橡皮球，掉到地上会弹回来；家庭、健康、朋友、诚信是玻璃做的，一旦掉下来就磨损、破裂甚至粉碎。"},{"stem":"凯勒提出的\"关键问题\"（The Focusing Question）是什么？","options":["我今天赚了多少钱？","如何同时完成所有任务？","明天要做什么？","我能做的最重要的事是什么？做了这件事就会让其他事都变得更简单或不必要了？"],"answer":3,"explanation":"✅ 这是全书最核心的公式。它把复杂世界简化为一个焦点，帮助你找到第一张多米诺骨牌。"},{"stem":"关键问题的第三部分\"让其他事变得更简单或不必要了\"对应什么比喻？","options":["阿基米德的\"给我一个支点，我就能撬动地球\"","温水煮青蛙","二八定律","滚雪球效应"],"answer":0,"explanation":"✅ 做了这件最重要的事之后，你会发现很多事变得简单甚至不需要做了。这就是找到支点（杠杆点）的意义。"},{"stem":"\"好问题\"的标准是什么？","options":["小而模糊","大而具体","大而模糊","小而具体"],"answer":1,"explanation":"✅ 只有大而具体的问题才能推动前进、拓展思路。小而具体（如\"如何使销量增加5%\"）起点太低，大而模糊（\"我怎样才能成功\"）没有方向。"},{"stem":"关于\"自律\"，凯勒的核心观点是什么？","options":["自律是天生的","每天都要高度自律","成功人士在各方面都很自律","自律不是成功的必要条件——只需要选准一个正确习惯训练自己"],"answer":3,"explanation":"✅ 凯勒认为没有人是\"完全自律\"的。成功人士只是在关键事情上训练自己养成习惯。养成习惯后就不再需要自律。一次只培养一个习惯，平均需要66天。"},{"stem":"迈克尔·菲尔普斯被幼儿园老师诊断为什么问题？他后来如何逆袭？","options":["阅读障碍→成了作家","社交障碍→成了演说家","智商低→靠努力考上名校","多动症→通过专注游泳这一习惯成为奥运史上奖牌最多的人"],"answer":3,"explanation":"✅ 菲尔普斯被老师评价\"完全没法集中精力\"，但他14岁起坚持每周7天、每天水下6小时训练，把全部精力集中在一件事上，最终获得22枚奥运奖牌。"},{"stem":"意志力可以比作什么？","options":["越用越强","固定不变的天赋","永不枯竭的泉水","手机电量——每天早晨满格，随使用减少，可以充电恢复"],"answer":3,"explanation":"✅ 意志力像手机电量条，每天早晨满格，随每次使用而消耗。\"你每拒绝一次诱惑，就消耗一点。拒绝次数越多，燃油储备就越少，直到用光为止。\""},{"stem":"研究证明，给大脑补充什么可以恢复意志力？","options":["什么都不吃","咖啡因","大量饮水","能缓慢升高血糖的食物（碳水化合物、蛋白质等）"],"answer":3,"explanation":"✅ 2007年研究证明：动用意志力后血糖急剧降低。补充加纯糖柠檬汁的实验组出错率是补充代糖组的一半。意志力是\"精神食粮\"——大脑消耗身体1/5的能量。"},{"stem":"\"志存高远\"在本书中被怎样证明是正确的？","options":["没有人知道自己的极限，选更高的目标能释放更大潜能","永远达不到所以不该设","大目标让人恐惧应该避免","只适用于商业领域"],"answer":0,"explanation":"✅ 凯勒说每个人都不知道自己在追求进步方面的极限，担心浪费时间是没必要的。如果别人说\"你永远无法超越某水平\"，你自然会选择更高的目标——不想给自己设限。"},{"stem":"苹果公司iPhone团队的组建者斯科特·福斯特招募人才时看重什么？","options":["有多年经验的","有发展型思维、愿意接受挑战和犯错的","名校毕业","有固定型思维追求完美的"],"answer":1,"explanation":"✅ 福斯特引用了德韦克的研究（两种思维模式），寻找以\"发展眼光\"看问题的人——愿意犯错、奋斗、学习成长。"},{"stem":"凯勒把自己早期拼命工作的状态形容为什么？","options":["享受过程","游刃有余","快乐高效","咬紧牙关、握紧拳头、挺胸收腹、屏住呼吸——最后进了医院"],"answer":3,"explanation":"✅ 凯勒描述早期的自己\"凌晨起床、7点半开会、把迟到者锁在门外、把自己烧成灰烬\"，结果进了医院。后来他发现放松、做更少的事反而更成功。"},{"stem":"安德鲁·卡内基给商学院学生的成功黄金法则是什么？","options":["多元化投资","把所有的鸡蛋放在同一个篮子里，然后看好那个篮子","把鸡蛋放在不同篮子里","寻找风口"],"answer":1,"explanation":"✅ 卡内基说：\"别把所有的鸡蛋都放在一个篮子里\"这句话其实是错误的。你必须把所有鸡蛋放在同一个篮子里，然后看好那个篮子。马克·吐温也赞同这个说法。"},{"stem":"关于\"我能做的最重要的事是什么\"，以下哪个理解是错的？","options":["\"能做\"意味着你要采取可能的行动","答案必须是一件事而不是很多事","\"能做\"等于\"必须做\"或\"将会做\"","你必须做出判断和选择"],"answer":2,"explanation":"✅ 凯勒特别强调\"能做\"≠\"必须做\"\"可能做\"\"将会做\"。很多事我们必须做、可能做、将会做，但永远不去做。\"能做\"意味着采取实际行动，比\"想做\"更强大。"},{"stem":"\"我做了哪件最重要的事之后，其他的事就会变得更简单或不必要了？\"如果你在一天开始问自己这个问题，效果是什么？","options":["会导致拖延","会什么都不想做","会找到当天第一张多米诺骨牌，其他事要么变得简单要么可以不做","浪费时间思考"],"answer":2,"explanation":"✅ 这就是聚焦问题的用途——帮你找到当天的支点（最重要的事），完成它后其他事或简单或不需要做了，从而高效利用有限时间。"},{"stem":"凯勒如何用吉他的例子说明\"缩小范围\"？","options":["每天练多种技巧","每天只练20分钟小调布鲁斯音阶，这个单一目标帮他敲开了摇滚乐大门","买最贵的吉他","学所有和弦"],"answer":1,"explanation":"✅ 凯勒40岁开始学吉他，每天只练20分钟。音乐大师告诉他\"只练一个技巧——音阶\"。他选择了小调布鲁斯音阶——仅这一个目标就帮他打开了摇滚乐大门。"},{"stem":"关于\"成功人士都是自律之人\"这个说法，凯勒认为是什么？","options":["一个谎言——与其说他们是自律的，不如说他们训练自己养成了关键习惯","完全正确","只有一半正确","要看具体什么领域"],"answer":0,"explanation":"✅ 凯勒说自律是一个流行的谎言。成功不是靠马拉松式的自律达成，而是选准一个正确习惯训练自己。养成习惯后就不再费力，看起来像自律的人其实只是有了好习惯。"},{"stem":"凯勒所说的\"四个小偷\"指什么？","options":["四种偷走你效率的东西","不能说不、害怕混乱、糟糕的健康习惯、逆境","小偷只有三个","四种浪费时间的人"],"answer":1,"explanation":"✅ 第三部分\"四个小偷\"指偷走你生产力的事物：①不能说不（对不重要的事说不）；②害怕混乱（专注最重要的事时其他方面会有些混乱，这是正常的）；③糟糕的健康习惯（精力管理）；④逆境（环境不支撑你的目标）。"},{"stem":"比尔·盖茨的案例在本书中如何说明\"只做一件事\"？","options":["盖茨靠多元投资","盖茨靠运气","盖茨中学遇到关键人→创办微软专注基础解码器→首富→基金会专注疫苗","盖茨做了很多事"],"answer":2,"explanation":"✅ 盖茨中学迷上编程→遇到保罗·艾伦→为\"牵牛星8800\"写解码器→微软专注这一件事→首富15年→基金会又专注一件事（疫苗）。每个阶段都聚焦一个最关键目标。"},{"stem":"下列哪项不是本书提出的\"真理\"部分内容？","options":["确定优先事务","找到生活目标","三个承诺","面面俱到"],"answer":3,"explanation":"✅ 本书第三部分\"成就卓越\"包含：找到生活目标、确定优先事务、高效生活、三个承诺（做到最好、向目标出发、对结果负责）、四个小偷（阻碍效率的事物）。"},{"stem":"凯勒关于\"答案\"的论述：如何找到正确答案？","options":["设定基准（研究成功者做法）+寻找趋势（为答案找到方向）","问更多人","靠直觉","上网搜索"],"answer":0,"explanation":"✅ 凯勒认为找到正确答案需要研究成功人士的经验（设定基准），同时寻找趋势和最佳实践，最后把两者结合。别人的研究和经验是最好的起点。"},{"stem":"凯勒的小故事——妻子朋友母亲的布料说明了什么？","options":["退休要早规划","等待会让你永远错过——不要为了未来而牺牲现在","节俭是美德","布料很重要"],"answer":1,"explanation":"✅ 朋友的母亲省吃俭用买了一柜子布料，计划退休后做衣服去旅行。结果退休前一年得癌症去世了。父亲守着柜子里的布料——那些未曾实现的沉甸甸的诺言。时间不等人。"},{"stem":"关于\"目的、优先事务和生产力\"的关系，哪个表述正确？","options":["生产力决定一切","先有生产力然后才有目的","目的（人生目标）→优先事务（最重要的事）→生产力（高效行动）","三者无关"],"answer":2,"explanation":"✅ 凯勒构建了一个链条：清晰的目的（你人生的终极目标是什么）决定你的优先事务（当下最重要的一件事），优先事务决定你的生产力（高效执行）。"},{"stem":"以下哪项不是\"三个承诺\"之一？","options":["做到精通（追求卓越而非平庸）","从\"E\"到\"P\"（从创业型到目标型）","多任务处理","对结果负责"],"answer":2,"explanation":"✅ 三个承诺是：①做到精通（成为你领域内最好的人）；②从\"E\"（Entrepreneurial创业型，随心所欲）到\"P\"（Purposeful目标型，有系统有方法）；③遵循问责周期（对结果负责）。"},{"stem":"凯勒描述\"从E到P\"是什么意思？","options":["从员工到老板","从贫穷到富有","从\"创业型\"随心所欲到\"目标型\"有系统有方法","从邮件到电话"],"answer":2,"explanation":"✅ \"E\"（Entrepreneurial）指凭感觉、随心所欲做事；\"P\"（Purposeful）指有明确目标、有系统、有方法地做事。成功需要从E模式转变为P模式。"},{"stem":"凯勒把时间分为哪几块来管理？","options":["工作日和周末","工作时间和休息时间","留出空闲时间、留出做优先事务的时间、留出做计划的时间","上午和下午"],"answer":2,"explanation":"✅ 凯勒建议时间分三块：①留出空闲时间（休息和恢复）；②留出做优先事务的时间（每天最早、精力最好的4小时用于最重要的事）；③留出做计划的时间（每周反思）。"},{"stem":"凯勒说的\"高效生活\"中，每天应该留出多长时间给最重要的事？","options":["1小时","20分钟","全天","4小时"],"answer":3,"explanation":"✅ 凯勒建议每天最早、精力最好的时间留出4小时做那件最重要的事。这段时间神圣不可侵犯，关掉手机、邮件和一切干扰。"},{"stem":"凯勒说养成\"每天问自己关键问题\"的习惯需要多久？","options":["21天","66天","100天","30天"],"answer":1,"explanation":"✅ 与习惯养成一样，大概66天（有的需要几个月）坚持下来，直到\"寻找那件最重要的事\"成为你生活的一部分。"},{"stem":"关于\"制衡\"，以下哪个描述正确？","options":["生活中所有方面都要平均用力","不需要制衡","工作用长线制衡（聚焦一件事），生活用短线制衡（各要素不长期忽略）","工作和生活都短线制衡"],"answer":2,"explanation":"✅ 凯勒区分两种制衡：事业成功需要长线制衡——长期聚焦于最重要的事，其他事失衡是正常的；个人生活需要短线制衡——快速在各要素间调整，确保没有一个长期被忽略。"},{"stem":"J.K.罗琳在写第一本《哈利·波特》时就设想了什么？","options":["电影改编计划","周边商品","从第一年到第七年霍格沃茨的完整故事","主题公园"],"answer":2,"explanation":"✅ 罗琳在写第一本时就设想了主人公在霍格沃茨7年后发生的一切。凯勒以此说明志存高远——从一开始就有大局观和长远规划。"},{"stem":"关于\"逆境\"环境不利于目标，凯勒的建议是什么？","options":["放弃目标","忍受环境","等待环境自己变好","换个环境或找人支持"],"answer":3,"explanation":"✅ 凯勒说如果环境不支撑你的目标——换一个环境或找一些支持你的人。你不必独自面对，可以找教练、导师或同伴互相监督。"},{"stem":"凯勒40岁学吉他时，埃里克·约翰逊告诉他只练一个技巧，这体现了什么原则？","options":["快速学习","分散投资","极度聚焦——找到关键中的关键","什么都学一点"],"answer":2,"explanation":"✅ 在有限时间（每天20分钟）内只能聚焦一个点。小调布鲁斯音阶就是这个领域的\"最重要的那一件事\"——掌握它就能打开整个摇滚乐的门。"},{"stem":"凯勒说\"成功的诀窍是选准一个正确的习惯\"，这里的\"一个\"强调的是？","options":["习惯的种类只能是1种","一次只培养一个习惯，循序渐进","数量恰好是1","总共只需要一个习惯"],"answer":1,"explanation":"✅ 凯勒说超级成功人士不是超人，他们只是有选择性地努力养成了多个好习惯——但每次只培养一个，循序渐进。没有谁意志力强大到能一次养成好几个习惯。"},{"stem":"凯勒对\"舒适区\"的态度是什么？","options":["舒适区最重要","永远待在舒适区","当你经历伟大，你就会变得伟大——不要怕超出舒适区","舒适区是安全的港湾"],"answer":2,"explanation":"✅ 凯勒说志存高远意味着走出舒适区。强大的过程本身就是成长的过程。\"看上去不可翻越的高山，当你站在山顶时就发现它可能只是一个小山丘\"。"},{"stem":"以下哪种做法是在实践\"成功清单\"而非\"存活清单\"？","options":["把想到的事都写下来","列出所有待办事项然后按紧急程度排序","从所有待办事项中反复筛选，直到确定今天唯一最重要的一件事","列出今天要做10件事并逐一完成"],"answer":2,"explanation":"✅ 成功清单的核心是从一堆事中不断缩小范围，直到找到最重要的那一件。不是把事情排序，而是不断淘汰不重要的，最后只留一件事。"},{"stem":"凯勒引用的这句俄罗斯谚语说明了什么？\"若同时追两只兔子，你一只也抓不到。\"","options":["一次只能做一件事","兔子跑得太快","打猎需要技巧","专注一件事的重要性"],"answer":3,"explanation":"✅ 这是全书的开篇题词，完美概括了\"最重要的事只有一件\"的核心理念——分散精力什么都得不到，聚焦一处才能成功。"},{"stem":"阿瑟·吉尼斯开办第一家酿酒厂时签了多长的租约？这说明了什么？","options":["50年","9000年","10年","没有签租约"],"answer":1,"explanation":"✅ 吉尼斯签了9000年租约。凯勒以此说明志存高远——他根本不打算做小生意，从第一天就在为几百年的基业做准备。"},{"stem":"凯勒将时间视为一种投资。他每日为最重要的事留出4小时，这种做法最像什么？","options":["等别人分配时间","先给自己发工资——把最好的时间投资在最重要的事上","借钱投资","存钱到银行"],"answer":1,"explanation":"✅ 凯勒说每天最先、最好的时间应该留给最重要的事——就像给自己发工资。不是先处理别人的紧急需求，而是先完成自己的关键任务。这是一种自我投资。"},{"stem":"如果你是创业者，根据本书你应该如何规划每天的时间？","options":["随机安排","先处理所有邮件和信息","从简单小事做起热身","把早上精力最好的4小时留给最重要的一件事，屏蔽一切干扰"],"answer":3,"explanation":"✅ 凯勒的核心建议：每天最早的、意志力最强的时间段用于那件最重要的事，关掉手机和邮件，专注4小时。其他杂事放到意志力减弱后再处理。"},{"stem":"凯勒最后领悟到\"一生只做一件事\"这个真理后，他的生活发生了什么变化？","options":["做得越来越少，故意少做，反而更成功，生活比以往更美好","不再工作","收入下降","更忙碌了"],"answer":0,"explanation":"✅ 凯勒说放弃谎言后，他\"做得越来越少，而且是故意这么做的\"，反而更成功了。\"我比以前轻松多了，前面的路变得更宽阔了，我又能自由呼吸了。\""}]},{"name":"恰如其分的自尊","author":"克里斯托弗·安德烈（法国心理学家、精神科医师、畅销书作家）& 弗朗索瓦·勒洛尔（","questions":[{"stem":"本书将自尊比喻为一栋建筑，它的三大支柱不包括以下哪一项？","options":["自强","自我观","自信","自爱"],"answer":0,"explanation":"✅ 三大支柱是自爱、自我观、自信。自爱是无条件的自我接纳，自我观是对自身优缺点的评估，自信是行动层面的自我信念。书中没有将\"自强\"列为支柱。"},{"stem":"在自尊三大支柱中，作者认为\"最难以补救\"的是哪一根支柱的缺失？","options":["自爱的缺失","三根支柱同样难以补救","自信的缺失","自我观的缺失"],"answer":0,"explanation":"✅ 书中明确指出\"因为缺乏家庭的爱而导致缺乏自尊是最难补救的\"，自爱是自尊的基石。一位32岁小学教师的自述典型地展现了自爱缺失者的痛苦：她无法相信有人会因为爱她而与她共度一生。"},{"stem":"一个孩子从小被父母过度保护，拥有充足的爱但从未独立面对挫折，他最可能出现什么情况？","options":["自爱充足但自信和行动力薄弱","稳定高自尊","全面低自尊","不稳定低自尊"],"answer":0,"explanation":"✅ 作者明确指出\"三大支柱可能割裂\"。被过度保护的孩子虽然自爱充足，但从未独立面对困难，会导致\"自信\"和\"行动力极度薄弱\"，停留在\"温室花朵\"的状态。"},{"stem":"一位猎头在面试中更看重什么来判断候选人的职场适配度？","options":["候选人面对质疑时的反应","候选人的年龄和居住地","候选人的学历和技能证书","候选人过往的薪资水平"],"answer":0,"explanation":"✅ 书中描述猎头招聘的判断逻辑：\"比起纸面技能，更看重候选人面对质疑时的反应。能客观承认不足、不辩解不自卑的人，职场适配度更高。\"这实际上就是自尊水平在职场场景中的直接投射。"},{"stem":"戴高乐将军在1940年6月法国沦陷后从伦敦发出抗战号召，这个案例在书中被用来论证自尊的哪一个维度？","options":["积极的自我观带来的内在力量","家庭教养决定自尊上限","自信来源于反复行动","自爱的无条件性"],"answer":0,"explanation":"✅ 作者引用戴高乐的例子说明\"如果一个人对自己的评价和期待是积极的，它会成为一种内在力量，让人经受挫折考验，达成最高目标\"。戴高乐对自己命运的远大期望与他对法国的想法一致，这让他在至暗时刻选择了站出来。"},{"stem":"书中用哪两个人的自传对比来展现高自尊和低自尊的自我表达差异？","options":["贝多芬与莫扎特","卢梭与富兰克林","拿破仑与托尔斯泰","莎士比亚与塞万提斯"],"answer":1,"explanation":"✅ 作者对比了卢梭《忏悔录》（低自尊：通篇自我剖析、展露不堪）与富兰克林《回忆录》（高自尊：主动罗列人生成就、坦然认可自身价值），鲜明展现两者自我描述方式的迥异。"},{"stem":"书中提到一个实验：给150人完全相同的性格解读，结果多少人认为精准贴合自身？","options":["130人","75人","50人","100人"],"answer":0,"explanation":"✅ 书中写道\"实验：给150人完全相同的性格解读，130人认为精准贴合自身\"。这个巴纳姆效应的实验被用来论证：自尊越低，越容易被星座、塔罗等笼统话术打动，根源是自我认知模糊，需要外部答案定义自己。"},{"stem":"根据本书的分类，一个在聚会中因为玩游戏失利就当众发脾气摔门离开的人，最可能属于哪一类自尊？","options":["不稳定高自尊","不稳定低自尊","稳定低自尊","稳定高自尊"],"answer":0,"explanation":"✅ 书中描述不稳定高自尊的典型行为\"持续向外证明自我，热衷炫耀，一点玩笑、批评都会激烈反击\"。书中案例：\"聚会中男士游戏失利，当场发脾气摔门离场\"——正是对失败过度敏感、无法接受自我形象受损的表现。"},{"stem":"低自尊者在行动层面的核心驱动力是什么？","options":["规避失败","取悦他人","追求卓越","自我实现"],"answer":0,"explanation":"✅ 书中明确概括：\"低自尊者行动驱动力是规避失败，高自尊者是追逐成功。\"低自尊者选择保守、不愿冒险、停留在安全区；高自尊者主动探索、乐于试错，但更容易冲动冒险。"},{"stem":"\"冒名者综合征\"最常出现在哪一类人群中？","options":["所有自尊类型","低自尊人群","不稳定高自尊","稳定高自尊"],"answer":1,"explanation":"✅ 书中指出低自尊人群普遍存在\"幸福焦虑、冒名者综合征\"：取得成就时无法坦然接纳，内心担忧\"假象迟早被戳穿\"，典型应对方式是弱化自身功劳、转移夸奖、贬低自己成果。"},{"stem":"根据书中实验，哪一组人主动选择观看负面评价的比例最高？","options":["普通人群（50%）","低自尊人群（64%）","高自尊人群（25%）","抑郁症患者（82%）"],"answer":3,"explanation":"✅ 书中给出数据：抑郁症患者82%主动选择观看负面评价，低自尊人群64%，高自尊仅25%。低自尊者潜意识认为批评更加真实，倾向于反复确认自身缺陷。"},{"stem":"书中用电影《2001太空漫游》中哪个角色来类比高自尊者面对批评时的反应？","options":["宇航员戴夫","神秘黑石碑","太空婴儿","电脑HAL9000"],"answer":3,"explanation":"✅ 作者用HAL9000比喻某些高自尊者：\"如同电影中HAL9000电脑，无法接受自身出错，进而攻击人类。\"高自尊者会主动过滤负面评价，更信任赞美，被质疑时容易反击、维护自身。"},{"stem":"根据四大分类，一个长期逆来顺受、默认自己一无是处、外界正向反馈也无法打动的人，属于哪种自尊类型？","options":["稳定高自尊","稳定低自尊","不稳定低自尊","不稳定高自尊"],"answer":1,"explanation":"✅ 稳定低自尊的特征是\"长久逆来顺受，默认自己一无是处，外界正向反馈无法打动，极少主动寻求改变\"。作者以作家乔兰为代表：文字全程流露自我否定，看淡得失，不期待任何认可。"},{"stem":"书中提到哪种家庭教育模式最容易培养出\"恰如其分的自尊\"？","options":["包庇型","放任型","严厉型","激励型"],"answer":3,"explanation":"✅ 激励型教育\"平衡规则与无条件关爱\"，既能提供情感安全感，又有清晰的边界和引导，最有利于培养均衡、恰如其分的自尊。严厉型造成焦虑自卑；包庇型形成不稳定高自尊；放任型导致稳定低自尊。"},{"stem":"关于自尊的\"多重性\"，书中举了哪个职业人士的案例来说明领域割裂？","options":["一位30岁业务代表","一位32岁小学教师","一位48岁医生","一位40岁工程师"],"answer":2,"explanation":"✅ 48岁医生的案例：事业一路晋升，依旧持续自我怀疑，永远嫉妒更优秀的同行。事业成功并未治愈他的整体低自尊——这就是\"整体自尊论\"的有力证据，某个领域的成功不一定能自动提升全部自尊。"},{"stem":"人在什么时候自尊初次产生显性表达？","options":["3岁左右赢得游戏后主动炫耀时","小学入学后","1岁左右开始说话时","婴儿出生后"],"answer":0,"explanation":"✅ 书中描述\"3岁孩子赢得游戏后主动向家人炫耀，是自尊初次显性表达\"。到4岁左右开始在意同伴是否喜欢自己，会因不被接纳难过。自尊从对成就的喜悦逐渐发展为关注他人评价。"},{"stem":"威廉·詹姆斯的自尊公式是什么？","options":["自尊 = 他人评价 × 自我感觉","自尊 = 自爱 + 自我观 + 自信","自尊 = 成功 × 自信","自尊 = 成功 ÷ 自我期待"],"answer":3,"explanation":"✅ 詹姆斯公式：自尊 = 成功 ÷ 自我期待。两条提升路径：增加成功，或降低过高的期待。完美主义者自我期待趋近无限大，即便成就斐然依然无法满足，长期低迷。"},{"stem":"\"自尊投资理论\"将童年获得的爱与认可比喻为什么？","options":["信誉额度","信心存款","心理初始资本","情感账户"],"answer":2,"explanation":"✅ 书中将童年获得的爱与认可比作\"心理初始资本\"：资本充足（高自尊）敢于冒险试错、不怕失败；资本匮乏（低自尊）极度规避风险、害怕任何失败。这是一个经济学的隐喻。"},{"stem":"镜像自我理论认为，自尊很大程度上建立在我们预判的什么之上？","options":["社会阶层","自己真实的优缺点","他人的评价（我们以为别人怎么看我们）","基因遗传"],"answer":2,"explanation":"✅ 镜像自我理论的核心：自尊很大程度建立在我们预判的他人评价之上。一句批评对自尊的打击远大于一句赞美。低自尊者对排斥和负面评价极度敏感，更容易从众，迎合群体观点。"},{"stem":"当低自尊者被迫在\"极度欣赏自己的人\"和\"客观评价自己的人\"之间做长期伴侣选择时，他们更倾向于选择谁？","options":["客观评价自己的人，甚至偏向负面评价的人","两者概率均等","极度欣赏自己的人","无所谓"],"answer":0,"explanation":"✅ 书中实验发现：在短期暧昧中低自尊者会选择极度欣赏自己的人，但在长期伴侣选择中更偏向客观甚至负面评价自己的人。潜意识认为对方看透了自己的本质，不会失望。"},{"stem":"本书认为导致自尊受损最严重的
