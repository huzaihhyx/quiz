<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>广论手抄第一本 · 100题测验</title>
<style>* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
  background: #1a1a2e; color: #e0d5b7; min-height: 100vh;

}
.wrapper { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
.container { width: 100%; }
h1 {
  text-align: center; font-size: 1.4rem; color: #f0c060;
  border-bottom: 2px solid #f0c060; padding-bottom: 0.5rem; margin-bottom: 0.3rem;
}
.subtitle { text-align: center; color: #a09070; font-size: 0.85rem; margin-bottom: 1.5rem; }

.layer-tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.layer-tab {

}
.layer-tab:hover { background: #30305a; color: #d0c090; }
.layer-tab.active { background: #3a3050; border-color: #f0c060; color: #f0c060; font-weight: bold; }
.layer-label { display: block; font-size: 0.7rem; color: #706050; margin-top: 2px; }

.question-area { background: #22223a; border: 1px solid #3a3a5a; border-radius: 8px; padding: 1.5rem; }
.q-progress { font-size: 0.8rem; color: #706050; margin-bottom: 1rem; text-align: right; }
.q-number { color: #f0c060; font-weight: bold; }

.q-type-badge {
  display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 3px;
  margin-bottom: 0.8rem; font-weight: bold;
}
.type-choice { background: #2a4a3a; color: #4ecb71; }
.type-tf { background: #4a3a2a; color: #e0a040; }
.type-match { background: #3a2a4a; color: #b080e0; }

.q-stem { font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.2rem; color: #d8cfa0; }

.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  padding: 0.7rem 1rem; background: #2a2a44; border: 1px solid #3a3a5a;
  border-radius: 6px; cursor: pointer; transition: all 0.15s; line-height: 1.5;
}
.option:hover { background: #30305a; }
.option.selected { border-color: #f0c060; background: #3a3050; }
.option.correct { border-color: #4ecb71; background: #1a3a2a; color: #4ecb71; }
.option.wrong { border-color: #e05050; background: #3a1a2a; color: #e05050; }
.option.disabled { pointer-events: none; opacity: 0.7; }

.tf-options { display: flex; gap: 12px; }
.tf-btn {
  flex: 1; padding: 0.8rem; text-align: center; border-radius: 6px;
  cursor: pointer; background: #2a2a44; border: 1px solid #3a3a5a;
  font-size: 1rem; transition: all 0.15s;
}
.tf-btn:hover { background: #30305a; }
.tf-btn.selected { border-color: #f0c060; background: #3a3050; }
.tf-btn.correct { border-color: #4ecb71; background: #1a3a2a; color: #4ecb71; }
.tf-btn.wrong { border-color: #e05050; background: #3a1a2a; color: #e05050; }
.tf-btn.disabled { pointer-events: none; opacity: 0.7; }

.match-area { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
.match-col { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
.match-item {
  padding: 0.5rem 0.8rem; background: #2a2a44; border: 1px solid #3a3a5a;
  border-radius: 4px; cursor: pointer; font-size: 0.9rem; text-align: center;
  transition: all 0.15s; line-height: 1.4;
}
.match-item:hover { background: #30305a; }
.match-item.src-selected { border-color: #f0c060 !important; background: #3a3050 !important; }
.match-item.target-selected { border-color: #80c0f0 !important; background: #2a3050 !important; }
.match-item.matched { border-color: #4ecb71 !important; background: #1a3a2a !important; color: #4ecb71; pointer-events: none; }
.match-label { font-size: 0.75rem; color: #706050; text-align: center; margin-bottom: 6px; }

.explanation {
  margin-top: 1rem; padding: 0.8rem 1rem; background: #1a1a30; border-left: 3px solid #f0c060;
  border-radius: 0 6px 6px 0; font-size: 0.85rem; line-height: 1.6; display: none;
  color: #c0b090;
}
.explanation.show { display: block; }

.score-area {
  text-align: center; margin-top: 1.5rem; padding: 1rem; background: #1a1a30;
  border-radius: 8px; display: none;
}
.score-area.show { display: block; }
.score-number { font-size: 2rem; color: #f0c060; font-weight: bold; }
.score-detail { color: #a09070; font-size: 0.85rem; margin-top: 0.3rem; }

.btn-row { display: flex; gap: 10px; margin-top: 1rem; justify-content: center; flex-wrap: wrap; }
.btn {
  padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; border: none;
  font-size: 0.9rem; font-family: inherit; transition: all 0.15s;
}
.btn-correct { background: #2a4a3a; color: #4ecb71; }
.btn-correct:hover { background: #3a5a4a; }
.btn-reset { background: #3a3a5a; color: #a09070; }
.btn-reset:hover { background: #4a4a6a; color: #d0c090; }
.btn-all { background: #4a3a2a; color: #e0a040; }
.btn-all:hover { background: #5a4a3a; }

/* 导航按钮 */
.nav-row { display: flex; gap: 10px; margin-top: 0.8rem; justify-content: center; align-items: center; }
.nav-hint { color: #706050; font-size: 0.8rem; min-width: 80px; text-align: center; }
.btn-nav {
  background: #3a3a50; color: #c0b090; padding: 0.5rem 1.2rem;
  border-radius: 6px; cursor: pointer; border: 1px solid #4a4a6a;
  font-size: 0.9rem; font-family: inherit; transition: all 0.15s;
}
.btn-nav:hover { background: #4a4a60; color: #e0d5b7; }
.btn-nav:disabled { background: #2a2a35; color: #5a5a5a; border-color: #3a3a3a; cursor: not-allowed; }

.btn-summary { background: #cba6f7; color: #1e1e2e; }
.btn-summary:hover { background: #b4befe; }

#scoreboard { display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 8px 16px; width: 100%; box-sizing: border-box; }
#scoreboard > div { white-space: nowrap; }
</style>
</head>

</div>

// ==================== 题库 ====================

var DAY_DATA = [

      "A. 觉得讲得太深奥,听不懂",
      "B. ",

      "C": "日常法师特别提醒:听懂了就觉得别的经论",
      "D": "这不是日常法师在书名解释中讨论的问题。"
    },
    "type": "choice"

  {
    "stem": "日常法师解释书名时说,修行要做到三样东西。除了'质'(对不对)和'量'(够不够)之外,第三样是什么?",
    "options": [

const L1 = DAY_DATA.slice(0, 10);
const L2 = DAY_DATA.slice(10, 20);
const L3 = DAY_DATA.slice(20, 30);
const L4 = DAY_DATA.slice(30, 40);
const L5 = DAY_DATA.slice(40, 50);
const L6 = DAY_DATA.slice(50, 58);

const layers = [
  { name: "第1关", sub: "题解: 书名含义", questions: L1, icon: "\ud83d\udcd6" },
  { name: "第2关", sub: "宗喀巴大师", questions: L2, icon: "\u2728" },
  { name: "第3关", sub: "阿底峡尊者", questions: L3, icon: "\ud83d\udd25" },
  { name: "第4关", sub: "造者殊胜", questions: L4, icon: "\ud83c\udfaf" },
  { name: "第5关", sub: "圣教无违", questions: L5, icon: "\ud83c\udf0d" },
  { name: "第6关", sub: "现为教授", questions: L6, icon: "\ud83d\udca1" },
];
let currentLayer = 0;
let currentQ = 0;
let answers = {};
let matchSelectedSrc = null;

function init() { buildTabs(); showQuestion(); }

function buildTabs() {
  var tabsHtml = layers.map(function(l, i) {
    return '<div class="layer-tab ' + (i === currentLayer ? 'active' : '') + '" onclick="switchLayer(' + i + ')">' +
    l.icon + ' ' + l.name + '<span class="layer-label">' + l.sub + '</span></div>';
  }).join('');
  document.getElementById('layerTabs').innerHTML = tabsHtml;
}

function switchLayer(i) {
  currentLayer = i; currentQ = 0; matchSelectedSrc = null; refresh();
  updateScoreboard();
}

function refresh() { buildTabs(); showQuestion(); updateScore(); updateNavButtons(); }

function goPrev() {
  if (currentQ > 0) { currentQ--; matchSelectedSrc = null; showQuestion(); updateNavButtons(); }
}

function goNext() {
  const qs = layers[currentLayer].questions;
  if (currentQ < qs.length - 1) { currentQ++; matchSelectedSrc = null; showQuestion(); updateNavButtons(); }
  else if (currentLayer < layers.length - 1) {
    currentLayer++;
    currentQ = 0;
    matchSelectedSrc = null;
    seasonTotalQ = layers[currentLayer].questions.length;
    showQuestion();
    updateNavButtons();
  }
}

function updateNavButtons() {
  const qs = layers[currentLayer].questions;
  document.getElementById('btnPrev').disabled = (currentQ === 0);
  document.getElementById('btnNext').disabled = (currentQ >= qs.length - 1);
  const key = currentLayer + '-' + currentQ;
  const hint = document.getElementById('navHint');
  if (answers[key] === undefined) { hint.textContent = '未作答'; return; }
  const q = qs[currentQ];
  let isCorrect = false;
  if (q.type === 'match') {
    if (typeof answers[key] === 'object') {
      isCorrect = Object.entries(answers[key]).every(function(e) { return q.corrects[parseInt(e[0])] === e[1]; });
    }
  } else if (q.type === 'tf') {
    var a = answers[key];
    isCorrect = (a === 1 && q.answer === false) || (a === 0 && q.answer === true) || (a === q.answer);
  } else {
    isCorrect = (answers[key] === q.answer);
  }
  hint.textContent = isCorrect ? '✅ 正确' : '❌ 错误';
}

function showQuestion() {
  const qs = layers[currentLayer].questions;
  const q = qs[currentQ];
  const total = qs.length;
  document.getElementById('qProgress').innerHTML = '第 <span class="q-number">' + (currentQ+1) + '</span> / ' + total + ' 题';

  const badge = document.getElementById('qTypeBadge');
  const typeMap = { choice: ['选择题', 'type-choice'], tf: ['判断题', 'type-tf'], match: ['连线题', 'type-match'] };
  badge.className = 'q-type-badge ' + typeMap[q.type][1];
  badge.textContent = typeMap[q.type][0];

  document.getElementById('qStem').innerHTML = q.stem;

  const body = document.getElementById('qBody');
  const key = currentLayer + '-' + currentQ;
  const prevAns = answers[key];

  if (q.type === 'choice') {
    body.innerHTML = '<div class="options">' +
      q.options.map(function(opt, i) {
        var cls = 'option';
        if (prevAns !== undefined) {
          cls += ' disabled';
          if (i === q.answer) cls += ' correct';
          else if (i === prevAns && prevAns !== q.answer) cls += ' wrong';
        }
        return '<div class="' + cls + '" onclick="' + (prevAns === undefined ? 'answerChoice(' + i + ')' : '') + '">' + opt + '</div>';
      }).join('') + '</div>';
  } else if (q.type === 'tf') {
    var qAnsNum = (q.answer === true || q.answer === 0) ? 0 : 1;
    body.innerHTML = '<div class="tf-options">' +
      '<div class="tf-btn' + (prevAns === 0 ? ' selected' : '') + (prevAns !== undefined ? (0 === qAnsNum ? ' correct' : (prevAns === 0 ? ' wrong' : '')) + ' disabled' : '') + '" onclick="' + (prevAns === undefined ? 'answerTF(true)' : '') + '">✅ 正确</div>' +
      '<div class="tf-btn' + (prevAns === 1 ? ' selected' : '') + (prevAns !== undefined ? (1 === qAnsNum ? ' correct' : (prevAns === 1 ? ' wrong' : '')) + ' disabled' : '') + '" onclick="' + (prevAns === undefined ? 'answerTF(false)' : '') + '">❌ 错误</div>' +
      '</div>';
  } else if (q.type === 'match') {
    var matched = (prevAns && typeof prevAns === 'object') ? prevAns : {};
    var allDone = Object.keys(matched).length === q.left.length;
    var html = '<div class="match-area">';
    html += '<div class="match-col"><div class="match-label">左列（点击后再点右列连线）</div>';
    q.left.forEach(function(item, i) {
      if (matched[i] !== undefined) {
        html += '<div class="match-item matched">' + item + ' → ' + q.right[matched[i]] + '</div>';
      } else {
        html += '<div class="match-item src-selected" onclick="selectMatchSrc(' + i + ')" id="match-src-' + i + '">' + item + '</div>';
      }
    });
    html += '</div><div class="match-col"><div class="match-label">右列</div>';
    q.right.forEach(function(item, i) {
      if (Object.values(matched).includes(i)) {
        html += '<div class="match-item matched">' + item + '</div>';
      } else {
        html += '<div class="match-item" onclick="selectMatchTarget(' + i + ')" id="match-tgt-' + i + '">' + item + '</div>';
      }
    });
    html += '</div></div>';
    if (allDone) {
      var allCorrect = Object.entries(matched).every(function(e) { return q.corrects[parseInt(e[0])] === e[1]; });
      html += '<div style="margin-top:1rem; text-align:center; color:' + (allCorrect ? '#4ecb71' : '#e05050') + '; font-weight:bold;">' +
        (allCorrect ? '🎉 全部正确！' : '❌ 有错误，请重做') + '</div>';
    }
    body.innerHTML = html;
  }

  var explDiv = document.getElementById('qExplanation');
  if (prevAns !== undefined) {
    var expText = '';
    if (q.explanations) {
      var expKey = String.fromCharCode(65 + prevAns);
      expText = q.explanations[expKey] || '';
    } else if (q.explanation) {
      expText = q.explanation;
    }
    if (expText) {
      explDiv.className = 'explanation show';
      explDiv.textContent = '💡 ' + expText;
    } else {
      explDiv.className = 'explanation';
      explDiv.textContent = '';
    }
  } else {
    explDiv.className = 'explanation';
    explDiv.textContent = '';
  }
}

function answerChoice(idx) {
  var key = currentLayer + '-' + currentQ;
  if (answers[key] !== undefined) return;
  answers[key] = idx;
  showQuestion(); updateScore(); updateNavButtons(); updateScoreboard();
}

function answerTF(val) {
  var key = currentLayer + '-' + currentQ;
  if (answers[key] !== undefined) return;
  answers[key] = val ? 0 : 1;
  showQuestion(); updateScore(); updateNavButtons(); updateScoreboard();
}

function selectMatchSrc(idx) {
  matchSelectedSrc = idx;
  document.querySelectorAll('.match-item').forEach(function(el) { el.classList.remove('src-selected'); });
  var el = document.getElementById('match-src-' + idx);
  if (el) el.classList.add('src-selected');
  var q = layers[currentLayer].questions[currentQ];
  var matched = answers[currentLayer + '-' + currentQ] || {};
  document.querySelectorAll('.match-item').forEach(function(el) { el.classList.remove('target-selected'); });
  q.right.forEach(function(_, i) {
    if (!Object.values(matched).includes(i)) {
      var tel = document.getElementById('match-tgt-' + i);
      if (tel) tel.classList.add('target-selected');
    }
  });
}

function selectMatchTarget(ti) {
  if (matchSelectedSrc === null) return;
  var key = currentLayer + '-' + currentQ;
  var matched = answers[key];
  if (!matched || typeof matched !== 'object') matched = {};
  if (matched[matchSelectedSrc] !== undefined) return;
  matched[matchSelectedSrc] = ti;
  answers[key] = matched;
  matchSelectedSrc = null;
  showQuestion(); updateScore(); updateNavButtons();
  updateScoreboard();
}

function updateScore() {
  var area = document.getElementById('scoreArea');
  var qs = layers[currentLayer].questions;
  var correct = 0, total = 0;
  qs.forEach(function(q, qi) {
    var key = currentLayer + '-' + qi;
    var ans = answers[key];
    if (ans === undefined) return;
    total++;
    if (q.type === 'match') {
      if (typeof ans === 'object') {
        if (Object.entries(ans).every(function(e) { return q.corrects[parseInt(e[0])] === e[1]; })) correct++;
      }
    } else {
      if (q.type === 'tf') {
        if ((ans === 1 && q.answer === false) || (ans === 0 && q.answer === true) || (ans === q.answer)) correct++;
      } else {
        if (ans === q.answer) correct++;
      }
    }
  });
  if (total > 0) {
    area.className = 'score-area show';
    area.innerHTML = '<div class="score-number">' + correct + ' / ' + total + '</div>' +
      '<div class="score-detail">正确率 ' + Math.round(correct/total*100) + '% （共' + qs.length + '题，已答' + total + '题）</div>';
  } else {
    area.className = 'score-area';
  }
}

// === Scoreboard update ===
function updateScoreboard() {
  var total = 0, correct = 0;
  for (var l = 0; l < layers.length; l++) {
    var qs = layers[l].questions;
    for (var i = 0; i < qs.length; i++) {
      var key = l + '-' + i;
      if (answers[key] === undefined) continue;
      total++;
      var q = qs[i];
      if (q.type === 'choice') {
        if (answers[key] === q.answer) correct++;
      } else if (q.type === 'tf') {
        var a = answers[key];
        if ((a === 1 && q.answer === false) || (a === 0 && q.answer === true) || (a === q.answer)) correct++;
      } else if (q.type === 'match') {
        if (typeof answers[key] === 'object') {
          var allOk = true;
          for (var j = 0; j < q.corrects.length; j++) {
            if (q.corrects[j] !== answers[key][j]) { allOk = false; break; }
          }
          if (allOk) correct++;
        }
      }
    }
  }
  var wrong = total - correct;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById('sbProgress').textContent = total + '/49';
  document.getElementById('sbCorrect').textContent = correct;
  document.getElementById('sbWrong').textContent = wrong;
  document.getElementById('sbScore').textContent = pct + '%';
}

function showSummary() {
  var panel = document.getElementById('summaryPanel');
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  var allCorrect = [], allWrong = [], unansweredQ = [];
  var totalCorrect = 0, totalWrong = 0;
  for (var l = 0; l < layers.length; l++) {
    var qs = layers[l].questions;
    for (var i = 0; i < qs.length; i++) {
      var key = l + '-' + i;
      var q = qs[i];
      if (answers[key] === undefined) {
        unansweredQ.push({ layer: l, qi: i, q: q });
        continue;
      }
      var isCorrect = false;
      if (q.type === 'choice') {
        isCorrect = answers[key] === q.answer;
      } else if (q.type === 'tf') {
        var a = answers[key];
        isCorrect = (a === 1 && q.answer === false) || (a === 0 && q.answer === true) || (a === q.answer);
      }
      var entry = { layer: l, qi: i, q: q, your: answers[key] };
      if (isCorrect) { allCorrect.push(entry); totalCorrect++; }
      else { allWrong.push(entry); totalWrong++; }
    }
  }
  var answered = totalCorrect + totalWrong;
  var h = '<h2 style="color:#f9e2af;margin:0 0 8px;">📋 测验总结</h2>';
  h += '<p style="color:#a6adc8;margin:0 0 4px;">已答' + answered + '/42题 · ✅' + totalCorrect + ' · ❌' + totalWrong;
  if (unansweredQ.length > 0) h += ' · ⚠️未答' + unansweredQ.length;
  h += '</p>';
  h += '<div style="background:#313244;height:6px;border-radius:3px;margin:12px 0;overflow:hidden;"><div style="background:#a6e3a1;height:100%;width:' + (answered/49*100) + '%;border-radius:3px;transition:width 0.3s;"></div></div>';
  
  if (allWrong.length > 0) {
    h += '<h3 style="color:#f38ba8;margin:20px 0 12px;">❌ 答错的题（' + allWrong.length + '题）</h3>';
    for (var wi = 0; wi < allWrong.length; wi++) {
      var w = allWrong[wi];
      h += '<div style="background:#302030;padding:12px 16px;margin:8px 0;border-radius:8px;border-left:3px solid #f38ba8;">';
      h += '<div style="color:#f38ba8;font-size:12px;">' + layers[w.layer].name + ' 第' + (w.qi+1) + '题</div>';
      h += '<div style="margin:6px 0;">' + w.q.stem + '</div>';
      h += '<div style="font-size:12px;margin:4px 0;">你的答案：<span style="color:#f38ba8;">' + w.q.options[w.your] + '</span></div>';
      h += '<div style="font-size:12px;">正确答案：<span style="color:#a6e3a1;">' + w.q.options[w.q.answer] + '</span></div>';
      h += '</div>';
    }
  }
  
  if (allCorrect.length > 0) {
    h += '<h3 style="color:#a6e3a1;margin:20px 0 12px;">✅ 答对的题（' + allCorrect.length + '题）</h3>';
    for (var ci = 0; ci < allCorrect.length; ci++) {
      var c = allCorrect[ci];
      h += '<div style="background:#203020;padding:12px 16px;margin:8px 0;border-radius:8px;border-left:3px solid #a6e3a1;">';
      h += '<div style="color:#a6e3a1;font-size:12px;">' + layers[c.layer].name + ' 第' + (c.qi+1) + '题</div>';
      h += '<div style="margin:6px 0;">' + c.q.stem + '</div>';
      h += '<div style="font-size:12px;">你的答案：<span style="color:#a6e3a1;">' + c.q.options[c.your] + '</span></div>';
      h += '</div>';
    }
  }
  
  if (unansweredQ.length > 0) {
    h += '<h3 style="color:#f9e2af;margin:20px 0 12px;">⚠️ 尚未作答（' + unansweredQ.length + '题）</h3>';
    for (var ui = 0; ui < unansweredQ.length; ui++) {
      var u = unansweredQ[ui];
      h += '<div style="background:#2a2a30;padding:10px 16px;margin:6px 0;border-radius:6px;font-size:13px;color:#a6adc8;">' + layers[u.layer].name + ' 第' + (u.qi+1) + '题：' + u.q.stem.substring(0,50) + '…</div>';
    }
  }
  panel.innerHTML = h;
  panel.scrollIntoView({behavior: 'smooth'});
}


function showAllAnswers() {
  var qs = layers[currentLayer].questions;
  qs.forEach(function(q, qi) {
    var key = currentLayer + '-' + qi;
    if (q.type === 'match') {
      var obj = {};
      q.corrects.forEach(function(ti, si) { obj[si] = ti; });
      answers[key] = obj;
    } else {
      answers[key] = q.answer;
    }
  });
  refresh();
  updateScoreboard();
}

function resetCurrentLayer() {
  var qs = layers[currentLayer].questions;
  qs.forEach(function(_, qi) { delete answers[currentLayer + '-' + qi]; });
  currentQ = 0; matchSelectedSrc = null; refresh();
  updateScoreboard();
}

function resetAll() {
  answers = {}; currentLayer = 0; currentQ = 0; matchSelectedSrc = null; refresh();
  updateScoreboard();
}

init();
</script>

</div>
