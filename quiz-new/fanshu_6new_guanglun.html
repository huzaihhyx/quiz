r:0,explanation:"✅ 答案是A。柯维的回答只有三个字：\"去爱她。\"柯维的意思是：\"爱\"不是一个\"名词\"（一种'等它降临的感觉'），而是一个\"动词\"（一种'你可以主动去做的行动'）。别\"被动地等着'爱的感觉回来'\"，而要\"主动地去'爱'——去关心她、去付出、去做出爱她的行动\"，\"感觉\"会随之而来。这个\"主动造作、功不唐捐\"的道理，和广论讲\"发心、造作\"完全一致：日常法师反复讲，\"感情、善缘\"不是\"天掉下来\"的，是\"自己去做、去培养、去创造\"出来的；\"做了，才有；不做，就没有\"。所以正确答案是A。\"爱\"是动词，不是名词——去\"做\"，去\"爱\"，而不是\"等着\"。"},{stem:"柯维让读者做一个有点\"晦气\"、却极其有力的想象练习：想象你要去参加自己的葬礼——亲戚、朋友、同事、家人都会上台致辞，悼念你的一生。柯维问你：你希望他们怎么评价你？你希望自己在他们心目中，是一个怎样的人？这个练习，引出了第二个也极重要的习惯\"以终为始\"。《广论》讲\"念死无常、暇满难得\"也讲这个道理——日常法师反复讲，\"把'死'、把'人生的终点'常挂在心头，人就知道'这一生到底该做什么、该抓紧什么'\"；\"由'念死'，反观'现在'，才能'精进地'过好每一天，不虚度\"。那么，\"以终为始\"意味着什么？",options:["从最后一步倒着做事", "只关注结果不关注过程", "以人生最终目标为衡量一切的标准", "做事拖延到最后一刻"],answer:2,explanation:"✅ 答案是C。\"以终为始\"意味着\"以人生的最终目标（你希望成为什么样的人、留下什么）为衡量一切的标准\"——先想清楚\"终点\"（你这一生，终极想要成为什么样的人、达成什么），然后\"倒推\"回\"现在\"，用这个\"终点的标准\"来指导\"当下的每一个选择\"。这样，你的每一天、每一个决定，都是\"朝着那个终点\"走，而不是\"随波逐流、得过且过\"。这个\"念死无常、反照当下\"的道理，和广论讲\"念死\"完全一致：日常法师反复讲，把\"死\"、把\"人生的终点\"常挂在心头，人就知道\"这一生到底该做什么、该抓紧什么\"；由\"念死\"反观\"现在\"，才能\"精进地过好每一天，不虚度\"。所以正确答案是C。\"以终为始\"——先想清楚\"你要去哪里\"，再谈\"你现在怎么走\"。"},{stem:"柯维提出了一个看似简单、却极具穿透力的观点：\"任何事物，都需要经过两次创造。\"理解这个观点，你就理解了\"以终为始\"为什么如此重要——因为大多数人，恰恰是\"跳过了第一次创造\"，直接\"撞\"进了第二次。《广论》讲\"先思后行、如理作意\"也讲这个道理——日常法师反复讲，\"做任何事，都要'先在'心里'想清楚''（如理思惟、规划意图），再'下手'去做\"；\"不先'想清楚'就'乱做'，往往是'盲修瞎练、事倍功半'\"。那么，柯维说\"任何事物都需经过两次创造\"，这两次分别是什么？",options:["第一次是智力创造，第二次是体力创造", "设计和制造", "构思和实践", "第一次是个人创造，第二次是团队创造"],answer:0,explanation:"✅ 答案是A。柯维说\"任何事物都经过两次创造\"：第一次是\"智力创造\"（在脑子里、在心里，先\"想清楚、构思、规划蓝图\"），第二次是\"体力创造\"（把想清楚的蓝图，用实际的行动\"做出来\"）。比如盖房子，先得\"画图纸\"（智力创造），再\"施工\"（体力创造）。大多数人\"跳过了第一次创造\"（没想清楚就猛做），结果\"做了半天才发现方向错了\"。这个\"先思后行、如理作意\"的道理，和广论讲\"先如理思惟再修\"完全一致：日常法师反复讲，做任何事，都要\"先在\"心里\"想清楚\"（如理思惟、规划意图），再\"下手\"去做；不先\"想清楚\"就\"乱做\"，往往是\"盲修瞎练、事倍功半\"。所以正确答案是A。\"先在脑子里想清楚，再在现实里做出来\"——别跳过\"第一次创造\"。"},{stem:"柯维提出了一个著名的\"时间管理矩阵\"，把每天要做的事，按照\"重要/不重要\"和\"紧急/不紧急\"两个维度，分成四个象限。他明确指出：高效能人士和普通人最大的区别，就在于他们把时间花在哪个象限上——而这个象限，恰恰是普通人最容易忽略、最爱拖延的。《广论》讲\"善择要务、先务本\"也讲这个道理——日常法师反复讲，\"要把'最重要、最根本'的事，放在'最先、最多'的时间去做\"；\"不能'被眼前的'急事''牵着走，而'忘了'那件'真正重要'的'大事'\"。那么，高效能人士把最多的时间花在哪个象限？",options:["不重要也不紧急", "重要且紧急", "重要但不紧急", "不重要但紧急"],answer:2,explanation:"✅ 答案是C。高效能人士把最多的时间花在\"重要但不紧急\"这个象限——比如\"锻炼身体、经营关系、学习规划、长期战略\"这些\"很重要、但眼下不做也不会立刻出事\"的事。普通人恰恰\"忽略\"这个象限，整天\"被'重要且紧急'的救火'和'不重要'的杂事'牵着走\"，导致\"重要但不紧急\"的事\"永远拖延\"，最终\"重要但不紧急\"又\"拖成了重要且紧急\"，陷入\"救火-拖延-救火\"的恶性循环。这个\"善择要务、先务本\"的道理，和广论完全一致：日常法师反复讲，要把\"最重要、最根本\"的事放在\"最先、最多\"的时间去做，不能被\"眼前的急事\"牵着走而忘了\"真正重要的大事\"。所以正确答案是C。把时间留给\"重要但不紧急\"的\"本\"——而不是整天\"救火\"。"},{stem:"柯维把人的成熟，描述成一个\"由依赖到独立、再由独立到互赖\"的成长过程。他说，这就像人的成长从不成熟走向成熟，是一个\"不能跳级、循序渐进\"的次第——很多人\"卡\"在某个阶段，就是因为\"想跳过\"前一个阶段。《广论》讲\"修学次第、不可躐等\"也讲这个道理——日常法师反复讲，\"修学要'按次第'，'下下'的'根基'打好了，才谈得上'上上'的'果'\"；\"'躐等、跳级'，往往'欲速则不达'\"。那么，柯维描述的人的成熟过程，正确的顺序是什么？",options:["依赖→互赖→独立", "独立→依赖→互赖", "依赖→独立→互赖", "互赖→独立→依赖"],answer:2,explanation:"✅ 答案是C。柯维描述的人成熟过程，正确顺序是\"依赖→独立→互赖\"。\"依赖\"是\"婴儿期\"（凡事靠别人、不自主）；\"独立\"是\"成年期\"（我能自立、我对自己负责）；\"互赖\"是\"更成熟期\"（我自立了，还能和别人合作共赢、彼此成就）。这是\"不能跳级\"的次第：没有\"独立\"（自立的能力和责任感），就谈\"互赖\"（合作），只会变成\"互相依赖、寄生\"。这个\"次第不可躐等\"的道理，和广论讲\"修学次第\"完全一致：日常法师反复讲，修学要\"按次第\"，\"下下的根基打好了，才谈得上上上的果\"；\"躐等、跳级\"，往往\"欲速则不达\"。所以正确答案是C。先\"自立\"（独立），再\"共赢\"（互赖）——成熟的次第，不可乱。"},{stem:"柯维在谈\"人际关系的成功\"时，总结了六种\"人际交往的模式\"：利人利己（双赢）、损人利己、损己利人、两败俱伤、独善其身，以及一种叫\"好聚好散\"（No Deal）的模式。他指出，在\"实在无法达成'双赢'\"的情况下，最成熟、最高尚的选择，恰恰是这个\"好聚好散\"。《广论》讲\"随缘、不强求\"也讲这个道理——日常法师反复讲，\"能'和合'、能'两利'最好；实在'和合'不了，就'善巧地'放下，'彼此不伤'\"，\"这比'勉强纠缠、互相伤害'高出很多\"。那么，柯维所说的\"好聚好散\"（No Deal）是什么意思？",options:["宁可两败俱伤也不让步", "寻求对双方都有利的方案，不成就好聚好散", "总是委屈自己、一味成全别人", "只管自己的利益，不顾别人"],answer:1,explanation:"✅ 答案是B。\"好聚好散\"（No Deal）的意思是\"寻求对双方都有利的方案，如果实在达不成'双赢'，就'好聚好散'\"——在合作中，首先\"努力寻求'双赢'（对双方都有利）的方案\"；但如果\"实在找不到双赢\"（双方根本利益无法调和），那么\"最成熟、最高尚\"的选择，不是\"勉强成交（必然一方受损）\"，而是\"坦诚地'谈不拢就不做'，好聚好散\"，\"不伤和气、不欠人情、彼此尊重\"。这个\"随缘不强求、彼此不伤\"的道理，和广论完全一致：日常法师反复讲，能\"和合、两利\"最好；实在\"和合\"不了，就\"善巧地放下，彼此不伤\"——这比\"勉强纠缠、互相伤害\"高出很多。所以正确答案是B。双赢 \"谈不拢\"，就\"好聚好散\"——不委屈自己，也不亏欠别人。"},{stem:"柯维在讲\"如何与人沟通\"时，提出了一个既简单又极难做到的原则：先\"理解别人\"，再\"争取让别人理解自己\"。他说，我们大多数人\"倾听\"的目的，根本不是\"理解对方\"，而是\"等着轮到我说\"或者\"准备反驳对方\"——这就导致沟通\"鸡同鸭讲、各说各话\"。《广论》讲\"恒顺众生、先调自心\"也讲这个道理——日常法师反复讲，\"要'利益'别人、'感化'别人，先要'听懂'他、'了解'他、'设身处地'为他着想\"；\"先'放下'自己的'成见'，'听'进去别人在讲什么，才能'真正'帮到他\"。那么，柯维\"知彼解己\"（先理解再被理解）的原则是什么？",options:["只说别人爱听的", "先理解别人，再争取让别人理解自己", "只要听不需要说", "先表达自己再听别人"],answer:1,explanation:"✅ 答案是B。柯维\"知彼解己\"的原则是\"先理解别人，再争取让别人理解自己\"——沟通时，\"先别急着表达自己、别急着反驳\"，而是\"先'设身处地'去'听懂'对方（他的感受、他的立场、他的需要）\"；当你\"真正理解\"了对方，对方才会\"感觉到被尊重\"、才会\"愿意也来听你理解你\"。这个\"先理解人、再被理解\"的道理，和广论讲\"恒顺众生、先调自心\"完全一致：日常法师反复讲，要利益、感化别人，先要\"听懂他、了解他、设身处地为他着想\"；先\"放下自己的成见，听进去别人在讲什么\"，才能\"真正帮到他\"。所以正确答案是B。\"先求理解，再求被理解\"——这是沟通和修行共同的\"金钥匙\"。"},{stem:"柯维提出了一个贯穿\"公众领域成功\"的核心概念——统合综效（Synergy）。这个词听起来有点学术，但意思非常朴素，也极其深刻：当不同的人、不同的资源\"真诚地协作\"时，会产生一种\"超越各部分简单相加\"的力量。《广论》讲\"众缘和合、共成善业\"也讲这个道理——日常法师反复讲，\"众人齐心、各尽所长地和合共事，能成就'单靠一个人、一个法'做不到的大利益\"；\"'和合'的功德，是'不可思议'的\"。那么，\"统合综效\"（Synergy）的核心含义是什么？",options:["各做各的不干扰", "1+1<2 资源浪费", "1+1>2 创造性合作", "1+1=2 精确配比"],answer:2,explanation:"✅ 答案是C。\"统合综效\"的核心含义是\"1+1>2 的创造性合作\"——当\"彼此尊重差异、真诚协作\"时，两个或更多人、更多资源\"合起来\"，能创造出\"远大于各部分简单相加\"的结果。它不是\"简单的相加\"，也不是\"各干各的\"，而是一种\"激发出全新、更高层次成果\"的\"协同效应\"。这个\"众缘和合、共成善业\"的道理，和广论讲\"和合\"完全一致：日常法师反复讲，众人齐心、各尽所长地和合共事，能成就\"单靠一个人、一个法\"做不到的大利益；\"和合的功德，是不可思议的\"。所以正确答案是C。\"统合综效\"的前提，是\"尊重差异、真诚协作\"——\"1+1\"的伟大，在于能\"大于2\"。"},{stem:"柯维讲了一个很有画面感的故事：深夜的大海上，一艘战舰正在航行，舰长看到前方有一束灯光迎面而来，便发信号让对方\"让开\"。对方回话说\"请你让开\"。舰长火了，亮明身份说\"我是战舰舰长，命令你让开！\"对方却平静地回了一句让他瞬间清醒的话。原来，那束灯光来自一座\"灯塔\"。《广论》讲\"正见与真理不容动摇\"也讲这个道理——日常法师反复讲，\"有些'道理、原则'，就像'灯塔'一样，是'客观、不变、不容动摇'的\"，\"不是'谁的官大、谁的嗓门大'就能'改变'它\"。那么，这个\"战舰与灯塔\"的故事，比喻的是什么？",options:["成功的目标", "努力的方向", "客观不变的道德原则", "领导者和领导力"],answer:2,explanation:"✅ 答案是C。\"战舰与灯塔\"的故事，比喻的是\"原则\"——那座\"灯塔\"，代表着\"客观、不变、不容动摇\"的\"自然法则和道德原则\"（如诚实、公正、因果、产出与产能平衡）。战舰（哪怕舰长官再大、再命令\"灯塔让开\"）也\"改变不了\"灯塔的位置；同样，\"个人、组织、权威\"也\"改变不了\"这些\"客观原则\"。违背原则，必然\"撞岩\"。这个\"正见与真理不容动摇\"的道理，和广论讲\"法性、因果铁律\"完全一致：日常法师反复讲，有些\"道理、原则\"，就像\"灯塔\"一样，是\"客观、不变、不容动摇\"的；不是\"谁的官大、谁的嗓门大\"就能\"改变\"它——\"因果\"的铁律，就是如此。所以正确答案是C。别想着\"改变原则\"，要\"顺应原则\"——否则只会\"撞上灯塔\"。"},{stem:"柯维说，一个好的\"习惯\"，不是凭空产生的，也不是单靠\"毅力\"就能养成的。他提出了一个关于\"习惯\"的经典公式，用三个要素的\"交集\"来定义\"真正的习惯\"——缺了任何一个，都形不成\"习惯\"。《广论》讲\"闻思修、愿行相资\"也讲这个道理——日常法师反复讲，\"要'成'一个'善法'、一个'好习惯'，需要'三样'：'懂道理'（知）、'会方法'（能）、'愿意去做'（愿）\"，\"缺一不可\"。那么，柯维认为，构成\"习惯\"的三个要素是什么？",options:["目标、行动、反馈", "知识、技巧、意愿", "时间、精力、毅力", "思维、情感、行为"],answer:1,explanation:"✅ 答案是B。柯维认为构成\"习惯\"的三个要素是\"知识、技巧、意愿\"——\"知识\"是\"知道'做什么、为什么做'\"（懂道理）；\"技巧\"是\"会做\"（掌握'怎么做'的方法）；\"意愿\"是\"想要做\"（有'发自内心'的动力）。三者\"交集\"，才构成\"真正的习惯\"：光\"知道\"不\"会做\"不行，光\"会做\"不\"愿意做\"也不行，\"愿\"而没有\"知\"和\"能\"更不行。这个\"闻（知）、思（会）、修（愿）\"的道理，和广论讲\"闻思修、愿行相资\"完全一致：日常法师反复讲，要成一个善法、一个好习惯，需要三样——\"懂道理（知）、会方法（能）、愿意去做（愿）\"，缺一不可。所以正确答案是B。\"习惯\"是\"知、能、愿\"三者的交集——三样齐，习惯才真正立得住。"},{stem:"一战之后，美国成功学兴起了一股\"个人魅力论\"的潮流——它教你如何微笑、如何包装形象、如何用话术打动别人，许诺给你\"快速成功\"的捷径。柯维对这种潮流，给出了一个旗帜鲜明的批判，认为它\"治标不治本\"。《广论》讲\"戒定慧为本、方便为末\"也讲这个道理——日常法师反复讲，\"'表面文章、花巧技巧'，只是'枝末'的'方便'，'根本'的'戒定慧'（品德、正见）不修，是不能'真正'成就的\"；\"'治标'能'一时'，'治本'才能'长久'\"。那么，柯维对\"个人魅力论\"的核心评价是什么？",options:["个人魅力论和品德论同样重要", "个人魅力论是华而不实的捷径，治标不治本", "个人魅力论是成功的关键", "个人魅力比品德更重要"],answer:1,explanation:"✅ 答案是B。柯维对\"个人魅力论\"的核心评价是\"它是华而不实的捷径，治标不治本\"——它教你\"表面的技巧\"（微笑、包装、话术），能在\"一时\"获得好感、给人一种\"成功\"的假象，但因为它\"没有触及'品德'这个根本\"，所以\"经不起'时间'和'考验'\"——一个\"有魅力、没品德\"的人，终究会\"露馅、失信\"。这个\"重本轻末\"的道理，和广论讲\"戒定慧为本、方便为末\"完全一致：日常法师反复讲，\"表面文章、花巧技巧\"只是\"枝末的方便\"，\"根本的戒定慧（品德、正见）\"不修，是不能\"真正\"成就的；\"治标能一时，治本才能长久\"。所以正确答案是B。\"个人魅力\"是\"枝叶\"，\"品德\"是\"根本\"——只在\"枝叶\"上使力，树是长不牢的。"},{stem:"柯维在讲\"积极主动\"这个习惯时，引用了一句罗斯福夫人（埃莉诺·罗斯福）的名言。这句话的精髓，用极简练的语言，点出了\"你的态度，由你自己主宰\"这一\"积极主动\"的核心精神——外界可以伤害你的处境，但伤害不了\"你选择如何回应\"的自由。《广论》讲\"心主权、不随境转\"也讲这个道理——日常法师反复讲，\"'外在'的人事物'动不了'你，只有'你自己''同意'、'你自己'肯，它才能'影响'到你的'心'\"。那么，罗斯福夫人这句\"没有你的同意，任何人都不能让你觉得'低人一等'\"的名言，传达的是哪个习惯的精神？",options:["以终为始", "知彼解己", "要事第一", "积极主动"],answer:3,explanation:"✅ 答案是D。罗斯福夫人这句名言——\"没有你的同意，任何人都不能让你觉得低人一等\"——传达的正是\"积极主动\"习惯的精神：来自外界的\"轻视、侮辱、打击\"，本身\"不能\"让你\"自卑、愤怒、受伤\"，除非你\"自己同意、自己选择\"去\"被它影响\"。你拥有\"选择如何回应的自由\"，这是\"积极主动\"的根基。这个\"心主权、不随境转\"的道理，和广论讲\"不随烦恼转、自作主宰\"完全一致：日常法师反复讲，\"外在\"的人事物\"动不了\"你，只有\"你自己同意、你自己肯\"，它才能\"影响\"到你的\"心\"——\"心\"的\"主权\"，本在自己。所以正确答案是D。\"任何人都不能伤害你，除非你同意\"——这就是\"积极主动\"的精神内核。"},{stem:"除了罗斯福夫人，柯维还引用了另一位历史伟人说过的一句极其相似的话。这个人用另一种方式，表达了\"世界上有一种东西，别人'拿不走'也'给不了'，除非'你自己'放弃或'自己'去建立\"。这句话，点出了\"积极主动\"的另一个重要维度——\"内在的尊严，由自己守护\"。《广论》讲\"自信、自珍、不轻自弃\"也讲这个道理——日常法师反复讲，\"人最宝贵、最别人'夺不走'的，是'自己'的'善根'、'佛性'、'自尊'\"；\"'自己'不'看轻'自己，别人就'看轻'不了你\"。那么，柯维引用的另一位伟人说的\"别人拿不走、给不了的\"，指的是什么？",options:["自由", "财富", "权力", "自尊"],answer:3,explanation:"✅ 答案是D。柯维引用的另一位伟人说的\"别人拿不走、给不了的\"，指的是\"自尊\"——\"自尊\"（一个人对自己价值的认可和坚守），既\"不能被别人夺走\"（除非你自己放弃），也\"不能由别人赐予\"（除非你自己去建立）。它牢牢掌握在自己手里。这个\"自珍、自尊、不轻自弃\"的道理，和广论讲\"自信自尊、不轻自弃\"完全一致：日常法师反复讲，人最宝贵、最别人夺不走的，是\"自己的善根、佛性、自尊\"；\"自己不看清自己，别人就看清不了你\"——\"自尊\"，是\"由内而外\"建立起来的。所以正确答案是D。\"自尊\"——别人夺不走、也赐不了，全看你自己\"要不要、守不守\"。"},{stem:"弗兰克尔在集中营的极端经历，让他不仅发现了\"选择的自由\"，还总结出了支撑人生意义的\"三类价值观\"。这三类价值观，几乎涵盖了\"人在任何处境下，都能找到意义\"的三种途径。《广论》讲\"一切的境遇皆可转为道用\"也讲这个道理——日常法师反复讲，\"无论是'顺境、逆境'，无论是'能做的、不能做的'，只要'有正见'，都能'转'成'修行的资粮'、'生意义'\"。那么，弗兰克尔总结的支撑人生意义的三类价值观是什么？",options:["过去、现在、未来", "金钱、权力、名誉", "经验价值观、创造价值观、态度价值观", "个人价值观、家庭价值观、社会价值观"],answer:2,explanation:"✅ 答案是C。弗兰克尔总结的支撑人生意义的三类价值观是\"经验价值观、创造价值观、态度价值观\"——\"经验价值观\"（通过'经历、体验'（爱、美、自然）获得意义）；\"创造价值观\"（通过'创造、贡献'（工作、作品、帮助他人）获得意义）；\"态度价值观\"（当'经历和创造'都被外界剥夺时（如集中营），通过'选择以什么态度面对苦难'来获得意义）。这三类，覆盖了\"任何处境下都能找到意义\"的途径。这个\"一切境遇皆可转为道用\"的道理，和广论完全一致：日常法师反复讲，无论是\"顺境、逆境\"，无论是\"能做的、不能做的\"，只要有\"正见\"，都能\"转成修行的资粮、生意义\"。所以正确答案是C。意义不只在\"顺境\"，更在\"逆境\"——\"态度\"，是任何人都夺不走的、最后的意义来源。"},{stem:"柯维深知，\"积极主动\"不是一个\"听了就懂的'道理'\"，而是需要\"亲身实践\"才能\"内化\"的\"能力\"。因此，他在书中给读者布置了一个\"为期一个月\"的实践任务——在一个具体的时间长度里，\"刻意地\"用\"积极主动的方式\"去生活、去回应每一个情境。《广论》讲\"数数串习、长时熏修\"也讲这个道理——日常法师反复讲，\"一个'善法'、一个'好习惯'，不是'听一遍、懂道理'就能'成'，要'长时间、反复地'去'修、去串习'，才能'内化成自己的'操守和体力'\"。那么，柯维给读者布置的\"积极主动\"实践任务，时长是多少天？",options:["21天", "7天", "30天", "66天"],answer:2,explanation:"✅ 答案是C。柯维布置的\"积极主动\"实践任务，时长是\"30天\"——让读者\"连续30天\"，刻意地用\"积极主动的语言和行为\"来生活（比如用主动式语言代替被动式、专注于影响圈、为自己的一切负责），把这个\"习惯\"通过\"反复实践\"真正\"内化\"。这个\"数数串习、长时熏修\"的道理，和广论讲\"串习、熏修\"完全一致：日常法师反复讲，一个善法、一个好习惯，不是\"听一遍、懂道理\"就能\"成\"，要\"长时间、反复地去修、去串习\"，才能\"内化成自己的操守和体力\"——\"习惯\"是\"练\"出来的，不是\"听\"出来的。所以正确答案是C。\"30天\"的\"刻意练习\"，是把\"道理\"变成\"能力\"的必要过程。"},{stem:"前面讲过，柯维认为\"习惯 = 知识 + 技巧 + 意愿\"的\"交集\"。这个公式里，有一个要素最为关键、也最容易被忽视——它决定了前两个要素（知识和技巧）\"能不能真正转化成'行动'\"。没有它，再多\"知识\"和\"技巧\"都只是\"纸上空谈\"。《广论》讲\"愿心为动力、无愿不成行\"也讲这个道理——日常法师反复讲，\"'知道'了（知）、'会'了（能），如果'不想做'（无愿），一切都'落空'\"；\"'愿'是'动力'，是'推动'你去'做'的那股'力'\"。那么，在\"习惯 = 知识 + 技巧 + 意愿\"这个公式中，最关键的、决定了\"行动\"能否发生的是哪一项？",options:["意愿", "知识", "知识和技巧都缺", "技巧"],answer:0,explanation:"✅ 答案是A。在\"习惯=知识+技巧+意愿\"中，最关键的、决定\"行动\"能否发生的是\"意愿\"——因为\"知识\"让你\"知道怎么做\"、\"技巧\"让你\"会做\"，但只有\"意愿\"（发自内心'想要去做'的动力）才能\"推动\"你\"真的去做\"。没有\"意愿\"，再多的\"知\"和\"能\"都只是\"纸上\"的空谈。这个\"愿为动力、无愿不成行\"的道理，和广论讲\"愿心\"完全一致：日常法师反复讲，\"知道\"了（知）、\"会\"了（能），如果\"不想做\"（无愿），一切都\"落空\"；\"愿\"是\"动力\"，是\"推动\"你去\"做\"的那股\"力\"——\"发愿\"，是\"起行\"的前提。所以正确答案是A。\"知道\"和\"会\"，都不如\"愿意\"——\"愿\"才是\"行动\"的发动机。"},{stem:"柯维在书中坦诚地分享了自己的一段\"失败\"的育儿经历——这段经历，是他后来\"思维转换\"的生动案例。他曾想\"教育\"孩子学会\"分享\"，用了讲道理、利诱、威胁等各种办法，都失败了；直到他\"想通\"了一个道理，问题才迎刃而解。《广论》讲\"未得先舍、次第不颠倒\"也讲这个道理——日常法师反复讲，\"'没有'的东西（没得到的、没体会过的），是'舍'不出去的\"；\"要先'拥有'、先'体验'，才能谈'放下'、谈'布施'\"。那么，柯维从\"教育孩子分享失败\"这件事中，想通了什么道理？",options:["当一个人没有真正体会过\"拥有\"，就无法真正\"付出\"", "孩子天生就是自私的", "严厉管教才最有效", "用礼物贿赂是最好的教育方式"],answer:0,explanation:"✅ 答案是A。柯维想通的道理是\"当一个人没有真正体会过'拥有'，就无法真正'付出'\"——他一直\"逼\"孩子\"分享\"（付出），但孩子\"还没有'拥有感'（体验过'这件东西完全属于自己'）\"，所以\"舍不得、不愿分享\"，怎么\"逼\"都没用。他醒悟后，改变策略，\"先让孩子'拥有'\"（安全感、归属感），孩子\"体会到拥有\"后，反而\"自然愿意分享\"了。这个\"未得先舍、次序不可颠倒\"的道理，和广论讲\"布施的次第\"完全一致：日常法师反复讲，\"没有\"的东西（没得到的、没体会过的），是\"舍\"不出去的；要先\"拥有、先体验\"，才能谈\"放下、谈布施\"——\"次序颠倒\"，欲速则不达。所以正确答案是A。别急着\"要求别人'付出'\"——先让他\"体会到'拥有'\"，\"付出\"才会自然发生。"},{stem:"柯维提出了一个非常犀利的问题：\"你的生活的'中心'（重心）在哪里？\"他观察到，大多数人虽然从未认真思考过这个问题，却在不知不觉中，把生活的\"中心\"放在了某个\"外在的、会变化的事物\"上（比如配偶、家庭、金钱、工作、享乐、敌人、自我……）。他警告：把中心放在这些\"易变\"的事物上，人会永远处于\"不安全、不满足\"的焦虑中。《广论》讲\"皈依、依止不迁变之正道\"也讲这个道理——日常法师反复讲，\"把'心'寄托在'无常、会变坏'的事物上，是'靠不住'的，终归'失望'\"；\"要'依止'那'不变、可靠'的'正见'、'三宝'，心才'安'\"。那么，柯维指出\"以金钱为中心\"的人会怎样？",options:["钱越多越幸福", "不会有什么问题", "永远不会满足", "赚到钱就一切都好了"],answer:2,explanation:"✅ 答案是C。柯维指出\"以金钱为中心\"的人会\"永远不会满足\"——因为\"金钱\"是一个\"无底洞\"：赚了10万想100万，赚了100万想更多，\"钱的量\"永远没有\"够\"的时候；把\"生活中心\"放在金钱上，人就永远活在\"不满足、不安全感\"里。这个\"依止无常外物、终不满足\"的道理，和广论讲\"无常、不可依\"完全一致：日常法师反复讲，把\"心\"寄托在\"无常、会变坏\"的事物（钱财、地位、他人）上，是\"靠不住\"的，终归\"失望、不满足\"；要依止那\"不变、可靠\"的\"正见、三宝\"，心才\"安\"。所以正确答案是C。\"金钱\"填不满\"心的空洞\"——因为\"中心\"放错了地方。"},{stem:"柯维讲了一个关于\"一个舰长在海上遇到一艘固执的'船'\"的故事（就是前面那个\"战舰与灯塔\"的故事的完整版）。这个故事表面在讲\"航海\"，实则揭示了一个深刻的道理：这个世界上，有些东西是\"不容商量、不容撼动\"的——无论你是什么身份、多大权势，都\"改变不了\"它。《广论》讲\"因果、法性如如不变\"也讲这个道理——日常法师反复讲，\"'因果、法性'就像'自然界的'规律'一样，是'客观、不变'的，不因'任何人的意志、地位'而'改变'\"。那么，\"战舰与灯塔\"的故事（舰长命令灯塔让开）说明了什么？",options:["军队纪律的重要性", "原则是不容动摇的，如同灯塔", "上级的命令必须执行", "海上航行要小心"],answer:1,explanation:"✅ 答案是B。这个故事说明\"原则是不容动摇的，如同灯塔\"——舰长可以\"命令\"任何\"船\"让路，但他\"命令不动\"那座\"灯塔\"，因为灯塔\"纹丝不动、不容商量\"。同样，世界上存在一些\"客观的、不变的\"原则（诚实、公正、因果、产出与产能平衡），它们\"像灯塔一样\"不容个人意志\"撼动\"——违背原则，必然\"撞岩\"。这个\"因果法性如如不变\"的道理，和广论讲\"法性不变\"完全一致：日常法师反复讲，\"因果、法性\"就像\"自然界的规律\"一样，是\"客观、不变\"的，不因\"任何人的意志、地位\"而\"改变\"——\"佛出世或不出世，法性常在\"。所以正确答案是B。原则如灯塔，不容撼动——顺之者昌，逆之者\"撞岩\"。"},{stem:"柯维在一次\"积极主动\"主题的演讲结束后，一个护士突然站起来，激动地大喊：\"我自由了！我自由了！\"原来，她照顾病房里一个\"全世界最难缠、最讨厌的病人\"多年，一直觉得自己是\"被迫忍受这个病人\"的\"受害者\"，痛苦不堪。但听完\"积极主动\"的演讲，她突然想通了。她\"自由\"了，不是因为她\"辞职\"了，而是因为她的\"心\"变了。《广论》讲\"转烦恼为道用、境不缚心\"也讲这个道理——日常法师反复讲，\"'痛苦'的根源，往往不是'外境'，而是'自己'把它'执'成'痛苦'；\"一'转念'、一'放下'，'外境'没变，'心'却'解脱'了\"。那么，那个护士为什么喊\"我自由了！\"？",options:["找到了新工作", "病人终于出院了", "认识到自己可以选择不痛苦", "终于辞职离开了"],answer:2,explanation:"✅ 答案是C。护士喊\"我自由了\"，是因为她\"认识到自己可以选择不痛苦\"——她一直以为\"是那个难缠的病人'逼'我痛苦\"，是\"被动受害者\"；听完演讲后，她领悟到\"我可以'选择'不痛苦\"——\"病人\"没变，但\"我可以选择以'不痛苦、积极'的态度去面对\"。这个\"转念解脱\"的领悟，让她一下子\"自由\"了。这个\"境不缚心、转烦恼为道用\"的道理，和广论完全一致：日常法师反复讲，\"痛苦\"的根源，往往不是\"外境\"，而是\"自己\"把它\"执\"成\"痛苦\"；一\"转念\"、一\"放下\"，\"外境\"没变，\"心\"却\"解脱\"了。所以正确答案是C。\"自由\"不在\"换掉外境\"，而在\"换掉你'看待'外境的'心'\"。"},{stem:"柯维提供了一种极其简单、却极其有效的\"自我诊断\"工具——\"语言检测\"。他说，你只要听听自己平时的\"口头禅\"，就能立刻判断出自己是\"积极主动\"还是\"消极被动\"。因为一个人说话的方式，往往\"暴露\"了他内心深处\"如何看待自己\"。\"我被逼的\"\"我没办法\"\"我只能这样\"\"要是……就好了\"——当你频繁使用这类语言时，说明你在\"把责任推给外界\"。《广论》讲\"警策自心、观照起心动念\"也讲这个道理——日常法师反复讲，\"听一个人'说的话'，就能'观'出他的'心'是'自主'还是'随烦恼转'\"。那么，当你频繁说\"我被逼的、我没办法、我只能这样\"时，说明什么？",options:["你在诚实面对现实", "你在使用消极被动的语言", "你在合理规划", "你在寻求帮助"],answer:1,explanation:"✅ 答案是B。当你频繁说\"我被逼的、我没办法、我只能这样\"时，说明\"你在使用消极被动的语言\"——这类语言，把\"责任\"和\"主动权\"全部推给了\"外界\"（别人、环境、命运），把自己\"定位\"成\"无能为力的受害者\"。而\"积极主动\"的语言，是\"我选择、我能、我可以、让我看看有什么办法\"——把\"主动权\"和\"责任\"收回自己手里。这个\"观心、警策\"的道理，和广论讲\"观照起心动念\"完全一致：日常法师反复讲，听一个人\"说的话\"，就能\"观\"出他的\"心\"是\"自主\"还是\"随烦恼转\"；\"语言\"，是\"心\"的外在表现。所以正确答案是B。从\"语言\"入手，觉察自己的\"心模式\"——\"被动的语言\"背后，是\"被动的心\"。"},{stem:"哈佛商学院做过一个非常经典的心理学实验。他们给两组学生看一张\"双关图\"（同一张图，既像\"少妇\"又像\"老妇\"）。先给第一组看一张\"清晰的青年女子照片\"，再给第二组看一张\"清晰的老妇人照片\"，最后两组一起看那张\"双关图\"。结果，两组人\"各执一词、互不相让\"，都坚信自己看到的是\"少妇\"或\"老妇\"。这个实验，揭示了\"认知\"的一个惊人真相。《广论》讲\"先入为主、成见障眼\"也讲这个道理——日常法师反复讲，\"人一旦'先'认定了一个'见'，就会'戴着这个'有色眼镜'去看一切，'再也看不到'别的'真相'\"；\"'成见'（邪见、先入之见），是'智慧'最大的障碍\"。那么，这个\"少妇/老妇双关图\"实验说明了什么？",options:["年龄大小会影响判断", "不同人的视力存在差异", "有些人的视力天生更好", "条件作用对认知有强大影响力，思维定式决定你看到什么"],answer:3,explanation:"✅ 答案是D。这个实验说明\"条件作用对认知有强大影响力，思维定式决定你看到什么\"——两组人看到的是\"同一张图\"，却因为\"先前被'条件化'（分别看了青年女子/老妇的照片）\"，形成了\"不同的'思维定式'\"，于是\"各自只看到自己'预想'的那个'样子\"，并\"坚信'事实'就是如此\"。这说明：我们的\"认知\"不是\"镜子反射客观\"，而是\"被'先入之见、思维定式'（范式）深刻塑造的\"。这个\"先入为主、成见障眼\"的道理，和广论讲\"成见（邪见）障智慧\"完全一致：日常法师反复讲，人一旦\"先\"认定了一个\"见\"，就会\"戴着这个有色眼镜\"去看一切，\"再也看不到\"别的\"真相\"；\"成见（邪见、先入之见），是智慧最大的障碍\"。所以正确答案是D。\"你以为的'事实'，可能只是你的'思维定式'\"——这正是\"范式转换\"（思维转换）如此重要的原因。"},{stem:"在讲解\"效能\"的概念时，柯维给出了一个关于\"效能\"的公式。不过需要特别提醒的是，这个公式是柯维为了\"强调'产出'和'产能'的'相对'关系\"而提出的一个\"思维模型\"。\"效能\"的高低，正是由这个公式里\"分子\"和\"分母\"的比例决定的。《广论》讲\"权衡轻重、护持因缘\"也讲这个道理——日常法师反复讲，\"要看'一件事'值不值、成效高不高，不能只看'果'（产出），还要看'因'（产能、代价）\"，\"要'权衡'两者的比例\"。那么，柯维给出的\"效能\"公式是什么？",options:["效能=产出×产能", "效能=产出÷产能", "效能=产出-产能", "效能=产出+产能"],answer:1,explanation:"✅ 答案是B。柯维给出的\"效能\"公式是\"效能=产出÷产能\"——\"产出\"是\"果\"（你想要的结果），\"产能\"是\"因\"（生产这些结果所需的\"能力\"和\"资源\"）。这个公式的深意在于：追求\"高效能\"，是要追求\"产出\"和\"产能\"的\"平衡与合理比例\"（既要产出，也要维护产能），而不是\"片面'最大化'某一项\"。这个\"权衡因果、护持因缘\"的道理，和广论讲\"权衡轻重\"完全一致：日常法师反复讲，要看一件事值不值、成效高不高，不能只看\"果（产出）\"，还要看\"因（产能、代价）\"，要\"权衡\"两者的比例——\"因\"伤了的\"果\"，是\"不可持续\"的。所以正确答案是B。\"效能=产出÷产能\"——别只顾\"拿蛋\"，忘了\"养鹅\"。"},{stem:"七个习惯的第七个，是\"不断更新\"。柯维用一个\"伐木工人\"的寓言来引出它：一个伐木工人拼命砍树，累得满头大汗，一个路人建议他\"歇一歇、把锯子磨一磨\"，他却说\"我太忙了，没时间磨锯！\"柯维指出，这个\"没时间磨锯\"的人，正是很多\"忙碌却低效\"的人的写照。《广论》讲\"借假修真、护持法器\"也讲这个道理——日常法师反复讲，\"身体、精神（这个'法器'）要'时常'养护、调养，才能'更好地'用来'修行、做事'\"；\"'累垮'了'法器'，反而'什么都做不成'\"。那么，\"不断更新\"这个习惯，涉及哪四个层面的\"修整\"？",options:["学习、运动、饮食、休息", "工作、生活、家庭、社交", "身体、精神、智力、社会/情感", "健康、财富、关系、事业"],answer:2,explanation:"✅ 答案是C。\"不断更新\"涉及\"身体、精神、智力、社会/情感\"四个层面——\"身体\"（锻炼、饮食、休息）；\"精神\"（价值澄清、冥想、亲近艺术与自然等\"养心\"）；\"智力\"（阅读、学习、写作等\"练脑\"）；\"社会/情感\"（投入情感账户、服务他人、与人联结）。这四方面\"均衡地更新\"，才能\"持续地'高效能'\"——就像\"磨锯子\"，是\"为了更好地砍树\"。这个\"护持法器、借假修真\"的道理，和广论完全一致：日常法师反复讲，身体、精神（这个\"法器\"）要\"时常养护、调养\"，才能\"更好地用来修行、做事\"；\"累垮了法器，反而什么都做不成\"。所以正确答案是C。\"磨刀不误砍柴工\"——四个层面\"不断更新\"，才是\"持续高效能\"的秘密。"},{stem:"柯维的儿子打橄榄球。在比赛场上，犯错几乎是不可避免的——而如何对待\"错误\"，恰恰是区分\"优秀\"和\"平庸\"的关键。柯维的儿子，就想出了一个\"很独特、也很有效\"的方法，来\"处理自己的错误\"，让自己\"不被错误拖住、能轻装上阵\"。这个方法，看似有点\"仪式感\"，却蕴含着深刻的智慧。《广论》讲\"忏悔、放舍过去\"也讲这个道理——日常法师反复讲，\"对'过去'的'错误'，要'如法'地'忏悔、放舍'，然后'轻装'向前\"，\"'揪着'过去的'错误'不放，是'沉重的'负担\"。那么，柯维的儿子用什么方法来\"处理比赛中的错误\"？",options:["赛后写日记反思错误", "和教练讨论失误原因", "打开表带再扣上——以示清空记忆", "反复回看比赛录像"],answer:2,explanation:"✅ 答案是C。柯维的儿子用来\"处理错误\"的方法是\"打开表带再扣上——以示清空记忆\"：每次在比赛中犯错，他就\"把表带打开、再扣上\"，用这个\"简单的动作\"作为一个\"仪式\"，告诉自己\"这个错误已经过去、翻篇了\"，从而\"清空\"掉\"对自己的懊恼和纠结\"，\"轻装上阵\"打下一球。这个\"忏悔、放舍过去\"的智慧，和广论讲\"发露忏悔、放舍\"完全一致：日常法师反复讲，对\"过去\"的\"错误\"，要\"如法地忏悔、放舍\"，然后\"轻装\"向前；\"揪着过去的错误不放，是沉重的负担\"。所以正确答案是C。别让\"上一个错误\"拖住你——\"仪式性地放下它\"，才能\"全情投入\"当下。"},{stem:"在讨论\"双赢思维\"时，柯维提出了一个很多人难以接受、甚至有点\"反常识\"的观点：\"如果不能双赢，就好聚好散。\"他把\"好聚好散（No Deal）\"看作\"双赢思维\"的一种\"高尚选择\"，而不是\"失败的妥协\"。这背后，是\"不委屈、不亏欠\"的成熟智慧。《广论》讲\"随缘、不强求、彼此不伤\"也讲这个道理——日常法师反复讲，\"能'和合共成'善事最好；'和合'不了，就'善巧'地'放下'，'不强求、不亏欠、彼此不伤'\"，\"这本身就是一种'高'的'境界'\"。那么，柯维把\"好聚好散（No Deal）\"看做什么？",options:["消极逃避困难", "缺乏谈判技巧所致", "好聚好散(No Deal)是双赢思维的一种高尚选择", "从不做出任何妥协"],answer:2,explanation:"✅ 答案是C。柯维把\"好聚好散（No Deal）\"看作\"双赢思维的一种高尚选择\"——当\"双方根本利益\"确实无法调和、找不到\"双赢\"方案时，\"好聚好散\"（坦诚地说\"谈不拢就不做\"，彼此尊重、不伤和气）反而比\"勉强成交（必然一方受损、甚至两败俱伤）\"更高尚、更成熟。它不是\"软弱、逃避\"，而是\"有原则、有底线\"的\"成熟选择\"。这个\"随缘不强求、彼此不伤\"的道理，和广论完全一致：日常法师反复讲，能\"和合共成\"善事最好；\"和合\"不了，就\"善巧地放下，不强求、不亏欠、彼此不伤\"——这本身就是一种\"高\"的境界。所以正确答案是C。\"谈不拢就体面地散\"——不委屈自己，也不亏欠别人，这是\"双赢思维\"的完整版。"},{stem:"前面提到柯维在女儿三岁生日派对上的\"失败育儿\"经历。柯维在书中非常坦诚地、甚至有点自嘲地，详细复盘了自己当时\"用尽了手段\"却\"一步步走向失败\"的全过程。这个\"手段的递进\"，生动地展示了\"当我们的'心'（思维定式）错了时，再多的'技巧'都只会让事情越搞越糟\"。《广论》讲\"根本错了、枝末再精亦无益\"也讲这个道理——日常法师反复讲，\"'根'（正见、心态）错了，'枝叶'（方法、技巧）再'精巧'，也'无益'，甚至'越做越错'\"。那么，柯维当时\"教育\"女儿\"分享\"，依次用了哪些手段？",options:["要求→讲道理→利诱→威胁→武力", "威胁→利诱→讲道理→武力→放弃", "利诱→要求→讲道理→威胁→武力", "讲道理→利诱→威胁→武力→放弃"],answer:0,explanation:"✅ 答案是A。柯维当时\"教育\"女儿分享，依次用了\"要求→讲道理→利诱→威胁→武力\"这五种手段：先\"直接要求\"她分享；不行就\"讲道理\"；还不行就\"利诱\"（给好处）；再不行就\"威胁\"（不给就怎样）；最后甚至\"武力\"（动手）——结果\"一步步升级\"却\"全都失败\"，女儿\"越哭越凶、越闹越僵\"。这个\"根错则枝末皆废\"的道理，和广论讲\"根本错了、枝末再精亦无益\"完全一致：日常法师反复讲，\"根（正见、心态）错了，枝叶（方法、技巧）再精巧，也无益，甚至越做越错\"。所以正确答案是A。当\"思维定式\"（根）错了（他认为是\"孩子'该'分享、被逼着分享\"），再多的手段（讲道理、利诱、威胁、武力）都只会\"越搞越糟\"。"},{stem:"在弗兰克尔的理论基础上，柯维进一步总结出了\"人类区别于动物的四种独特天赋\"（也叫四种人类禀赋）。这四种天赋，让人类\"拥有'选择'的力量\"，从而能够\"积极主动\"——而动物、以及被\"消极被动\"支配的人，是\"用不上\"这四种天赋的。《广论》讲\"人的殊胜功德（思择力、自主力）\"也讲这个道理——日常法师反复讲，\"人之所以'胜过'畜生，正是因为'人'能'思惟、能抉择、能自主'，有'修行、转凡成圣'的'能力'\"；\"这是'人'最'宝贵'的'禀赋'（暇满人身）。那么，以下哪一项【不是】柯维所说的\"四种独特天赋\"之一？",options:["记忆力", "独立意志", "自我意识", "想象力"],answer:0,explanation:"✅ 答案是A。这道题问哪一项\"不是\"四种独特天赋之一。柯维总结的\"四种人类天赋\"是\"自我意识\"（能觉察自己的思维和情绪）、\"想象力\"（能超越现实、在脑中创造）、\"良知\"（能分辨是非善恶）和\"独立意志\"（能不受外界影响、自主选择行动）。所以\"记忆力\"【不是】这四种天赋之一（此外柯维说的是\"良知\"，不是\"记忆力\"）。这个\"人是万物之灵、有思择自主力\"的道理，和广论讲\"暇满人身、人的殊胜\"完全一致：日常法师反复讲，人之所以\"胜过\"畜生，正是因为人能\"思惟、能抉择、能自主\"，有\"修行、转凡成圣\"的\"能力\"——这是人最宝贵的\"禀赋\"（暇满人身）。所以正确答案是A。\"自我意识、想象力、良知、独立意志\"——这是人\"能选择、能精进\"的四种\"本钱\"。"},{stem:"在讲\"以终为始\"这个习惯时，柯维提到了一个非常形象、又有点扎心的比喻，用来提醒那些埋头苦干、却从不抬头看一眼\"方向对不对\"的人。他说，这样的人\"再勤快、再高效\"都没用，因为一开始\"方向\"就错了。《广论》讲\"先正见、后正行\"也讲这个道理——日常法师反复讲，\"'方向'（正见、目标）错了，'努力'（行动）越'多'、越'快'，'偏差'就'越大'\"；\"要'先'把'方向'搞对，再谈'用力'\"。那么，柯维用什么比喻来提醒\"忙碌却方向错误\"的人？",options:["走一步看一步、随波逐流", "享受当下才是最重要", "计划总赶不上变化", "忙碌的人未必出成果，梯子搭错了墙就白费工夫"],answer:3,explanation:"✅ 答案是D。柯维用的比喻是\"忙碌的人未必出成果，梯子搭错了墙就白费工夫\"——一个人\"拼命地、高效地\"爬梯子（勤奋工作），但如果\"梯子搭错了墙\"（方向、目标错了），那么他\"爬得越高、越快\"，离\"真正的目标\"反而\"越远\"——\"白费工夫\"。这里的\"梯子搭在哪面墙\"，就是\"以终为始\"要解决的问题。\"先正见、后正行\"的道理，和广论完全一致：日常法师反复讲，\"方向（正见、目标）错了，努力（行动）越多、越快，偏差就越大\"；要\"先把方向搞对，再谈用力\"。所以正确答案是D。先\"看清'梯子搭在哪面墙'\"，再\"拼命爬\"——\"以终为始\"，就是\"先校准方向\"。"},{stem:"很多人会想当然地把\"积极主动\"和\"积极思考\"混为一谈，以为\"积极主动\"就是\"凡事往好处想\"\"保持乐观心态\"。柯维却指出，这是一个重大的误解——\"积极思考\"只是\"积极主动\"的一小部分，而且\"只停留在脑子里\"是\"远远不够\"的。《广论》讲\"解行并重、贵在实行\"也讲这个道理——日常法师反复讲，\"光'懂得'、光'想通'了道理（解），如果不'落实到'行动（行），是'空'的\"；\"'修行'（地熟行持），贵在'真的去做'\"。那么，柯维强调的\"积极主动\"与\"积极思考\"的本质区别是什么？",options:["积极主动重在行动和选择，不只是在脑子里想", "没有区别", "积极思考比积极主动更重要", "积极主动就是不顾后果地行动"],answer:0,explanation:"✅ 答案是A。\"积极主动\"与\"积极思考\"的本质区别是\"积极主动重在'行动'和'选择'，不只是在脑子里想\"——\"积极思考\"是\"在脑子里'往好处想'\"（心态层面）；而\"积极主动\"是\"落实在'行动'和'选择'上\"：面对刺激，\"主动地'选择'回应方式\"、并\"实际地'去行动、去改变'\"，而不仅仅是\"心里换个好心态\"。柯维强调，光\"想\"不\"做\"，不算\"积极主动\"。这个\"解行并重、贵在实行\"的道理，和广论讲\"闻思修、解行相应\"完全一致：日常法师反复讲，光\"懂得\"、光\"想通\"了道理（解），如果不\"落实到行动\"（行），是\"空\"的；\"修行（地熟行持），贵在真的去做\"。所以正确答案是A。\"积极主动\"是\"动词\"，不是\"形容词\"——是\"去选择、去行动\"，不是\"光想想\"。"},{stem:"柯维讲了一个关于\"销售主管面对独断专行的老板\"的经典案例，来区分\"积极主动\"和\"消极被动\"的选择。这位销售主管的老板\"独断专行、听不进意见\"，还把\"市场下滑、业绩不佳\"的责任\"全推给手下\"。面对这样的处境，销售主管可以有多种\"被动\"的选择，但柯维赞赏的是另一种\"主动\"的选择。《广论》讲\"随缘应化、转逆缘为道用\"也讲这个道理——日常法师反复讲，\"面对'难缠的人、糟糕的境'，'消极' 的人只会'抱怨、逃避、对抗'；'积极' 的人，会'看我能'在这个境里头'做点什么、成长什么、利益什么'\"。那么，面对\"独断专行\"的老板，柯维赞赏销售主管怎么做？",options:["拍老板马屁", "联合其他主管对抗老板", "跳槽到竞争对手公司", "设法弥补老板的缺失、缓冲下属压力"],answer:3,explanation:"✅ 答案是D。面对\"独断专行\"的老板，柯维赞赏销售主管\"设法弥补老板的缺失、缓冲下属压力\"——不\"拍马屁\"、不\"联合对抗\"、不\"消极跳槽\"，而是\"积极主动地\"在自己\"影响圈\"内做事：主动去\"补上\"老板\"独断\"带来的\"信息缺失\"和\"决策盲区\"，同时\"缓冲\"老板的\"粗暴\"给下属造成的\"压力\"。这样，他\"不是被动的受害者\"，而是\"主动的、有价值的贡献者\"（也因此\"影响圈\"越来越大）。这个\"转逆缘为道用、随缘应化\"的道理，和广论完全一致：日常法师反复讲，面对\"难缠的人、糟糕的境\"，消极的人只会\"抱怨、逃避、对抗\"；积极的人会\"看我能在这个境里头做点什么、成长什么、利益什么\"。所以正确答案是D。\"积极主动\"不挑环境——在任何环境里，都问\"我能主动做点什么\"。"},{stem:"柯维给读者提了一个非常具体、也非常实用的读书建议——这个建议，能让你的阅读效果\"翻倍\"。它的核心是\"带着'输出'的'意识'去读\"：你要在心里\"预设\"一个\"48小时内要和别人分享、讨论这本书\"的目标，这样你读书时就会\"更专注、更主动地'理解和消化'\"。《广论》讲\"闻法后、如理作意、随转分享\"也讲这个道理——日常法师反复讲，\"'听'了、'读'了，要'思惟'、'消化'，还要'把它'讲出来、转施'给别人\"，\"'讲'的过程，正是'深一层消化'的过程\"；\"'法施'，是'最殊胜'的'功德'之一\"。那么，柯维建议的\"让阅读效果翻倍\"的方法是什么？",options:["写一篇完整的读书论文", "对书中观点进行系统批判", "边读边做详细教案", "预计在48小时内与人分享或讨论读书心得"],answer:3,explanation:"✅ 答案是D。柯维建议的\"让阅读效果翻倍\"的方法是\"预计在48小时内与人分享或讨论读书心得\"——带着\"我很快要讲给别人听、和别人讨论\"的\"预期目标\"去读，你就会\"读得更专注、更主动地去理解和提炼要点\"，\"吸收\"效果远胜于\"漫无目的地翻\"。\"输出倒逼输入\"，是这个方法的精髓。这个\"闻后思惟、转施分享\"的道理，和广论讲\"法施、转施\"完全一致：日常法师反复讲，\"听\"了、\"读\"了，要\"思惟、消化\"，还要\"把它讲出来、转施给别人\"；\"讲\"的过程，正是\"深一层消化\"的过程；\"法施\"，是\"最殊胜\"的\"功德\"之一。所以正确答案是D。带着\"要讲给别人听\"的预期去读——\"教\"，是最好的\"学\"。"},{stem:"柯维将美国成功学的历史，大致划分成了两个阶段：前150年的\"品德时代\"，和一战后兴起的\"个人魅力时代\"。在前一个时代，成功学著作反复强调的，是一系列\"内在的、稳定的\"品质——这些品质，才是柯维认为\"真正\"决定一个人\"长期成功\"的\"根\"。《广论》讲\"戒德为本、善行为基\"也讲这个道理——日常法师反复讲，\"'品德'（戒、慈、忍……这些'内在的善'）是'一切成就'的'根基'\";\"'舍'掉了'品德'这个'根'，'外'面的'枝叶'再繁茂，也'不长久'\"。那么，前150年\"品德时代\"的成功学，强调的核心是什么？",options:["诚信、谦虚、忠诚、勇气、公正、勤勉等品德", "积极进取的思维", "社会形象和沟通技巧", "出众的聪明才智"],answer:0,explanation:"✅ 答案是A。前150年\"品德时代\"的成功学，强调的核心是\"诚信、谦虚、忠诚、勇气、公正、勤勉等品德\"——这些\"内在的、稳定的道德品质\"。那时的著作认为，\"真正的成功\"，根植于一个人的\"品德\"（诚信待人、勤勉做事、公正仁慈），而不是\"外在的技巧\"。柯维主张\"回归品德\"，因为\"品德\"才是\"长期成功\"的\"根\"。这个\"戒德为本、善行为基\"的道理，和广论讲\"品德为根本\"完全一致：日常法师反复讲，\"品德（戒、慈、忍……这些内在的善）是\"一切成就\"的根基\"；\"舍\"掉了\"品德\"这个\"根\"，\"外\"面的\"枝叶\"再繁茂，也\"不长久\"。所以正确答案是A。\"品德\"是\"根\"，\"技巧\"是\"枝\"——前150年的古人，比我们更懂这个\"根本\"。"},{stem:"柯维在教学中，有一个他\"最常问学生\"的问题。这个问题，往往能让那些整天忙忙碌碌、追逐外在成功的学生\"瞬间安静下来、陷入深思\"——因为它直指一个\"被忙碌掩盖\"的真相。柯维借这个问题，提醒人们：别在\"临终\"时才\"后悔\"这一生\"把时间都用错了地方\"。《广论》讲\"念死无常、反照人生\"也讲这个道理——日常法师反复讲，\"把'死'放在眼前，反过来问自己：'这一生，我到底在忙什么？值不值得？'\"，\"这个'反思'，能让人'幡然醒悟'、'重新排定'人生的'优先'\"。那么，柯维\"最常问学生\"的、直指人生优先的问题是哪一个？",options:["工作或看电视", "出门旅行走走", "静心读书", "陪家人"],answer:0,explanation:"✅ 答案是A。柯维最常问学生的问题（大意）是\"如果你只剩下一周的寿命，你会怎么安排这最后一周？\"——而多数学生的回答，都集中在\"陪家人、旅行、读书、完成有意义的事\"上，却\"几乎没有一个人\"说\"我想多工作一会儿、多看会儿电视\"。柯维借这个\"反差\"，提醒人们：既然\"你明知'临终'最想做什么\"，为什么\"现在\"却把\"最多的时间\"花在\"工作（忙碌）或看电视（消磨）\"上？这个\"念死反照、重排优先\"的道理，和广论讲\"念死无常\"完全一致：日常法师反复讲，把\"死\"放在眼前，反过来问自己\"这一生，我到底在忙什么、值不值得\"，这个\"反思\"能让人\"幡然醒悟、重新排定人生的优先\"。所以正确答案是A。别等\"临终\"才后悔——现在就用\"终点\"的视角，重排你的\"优先\"。"},{stem:"前面讲过，柯维把成熟路径划分为\"依赖→独立→互赖\"。很多人（包括很多高成就者）都有一个普遍的\"误解\"：以为\"独立\"（不靠别人、自己能干）就是\"最高\"的成熟境界了。柯维却指出，\"独立\"只是\"中途站\"，真正的、更高级的成熟是\"互赖\"。《广论》讲\"自利利他、发菩提心为上\"也讲这个道理——日常法师反复讲，\"'独善其身'（自利）是'小乘'，能'自利利他'、发'菩提心'（利他），才是'大乘'、才是'上'的'道'\"；\"'利他'，是比'自利'更'高'的境界\"。那么，柯维如何纠正\"独立是最高成就\"这个误解？",options:["三者没有优劣之分", "独立是最高成就", "互赖是比独立更成熟的高级概念", "依赖和互赖本质相同"],answer:2,explanation:"✅ 答案是C。柯维纠正\"独立是最高成就\"这个误解，指出\"互赖是比独立更成熟的高级概念\"——\"独立\"只是\"成熟的中途站\"（从\"依赖\"走出来、能\"自立\"）；但人类的\"更高成就\"，在于\"互赖\"（能\"自立\"的人，彼此\"合作、共赢、成就彼此\"）。\"独立\"的人\"自己强\"，\"互赖\"的人\"能'借着'彼此'让大家都强'\"，后者是\"更高的成熟\"。这个\"自利利他、利他为上\"的道理，和广论讲\"发菩提心\"完全一致：日常法师反复讲，\"独善其身（自利）是小乘，能'自利利他'、发菩提心（利他），才是大乘、才是上的道\"；\"利他，是比自利更高的境界\"。所以正确答案是C。\"独立\"是\"自立\"，\"互赖\"是\"共赢\"——从\"独善\"走向\"兼济\"，才是更高的成熟。"},{stem:"在批判一战后的成功学潮流时，柯维反复使用了一个术语——\"个人魅力\"，以及由此衍生的\"个人魅力论\"。这个术语，指的是一整套\"关于'外在形象'和'人际技巧'的'速成'学问\"。理解它，才能理解柯维\"为什么对这股潮流忧心忡忡\"。《广论》讲\"末、表、装饰之非\"也讲这个道理——日常法师反复讲，\"只在外表、言谈、形象这些'表面'下功夫，而'不修'内在的'品德、正见'，是'舍本逐末'\"。那么，柯维所说的\"个人魅力\"具体指什么？",options:["长得好看、仪表出众", "优雅有气质的谈吐", "个人独特的性格魅力", "性格、社会形象、行为态度、人际关系和公关技巧等成功捷径"],answer:3,explanation:"✅ 答案是D。柯维所说的\"个人魅力\"具体指\"性格、社会形象、行为态度、人际关系和公关技巧等成功捷径\"——一整套\"教你如何在'外表、形象、谈吐、人际'上'包装'自己、'快速'赢得'好感'和'成功'\"的\"表面功夫\"和\"速成技巧\"。柯维主张\"品德\"为本，而这些\"个人魅力\"技巧只是\"枝末\"，若\"离了品德\"就成了\"华而不实的捷径\"。这个\"末、表、装饰之非\"的道理，和广论讲\"舍本逐末\"完全一致：日常法师反复讲，只在\"外表、言谈、形象\"这些\"表面\"下功夫，而不修\"内在的品德、正见\"，是\"舍本逐末\"。所以正确答案是D。\"个人魅力\"是\"表面的技巧\"，\"品德\"是\"内在的根\"——可别只学\"末\"、丢了\"本\"。"},{stem:"柯维在他任教的过程中，经常遇到学生用\"被动式语言\"来请假、来解释自己的行为（比如\"我不得不去参加XX\"）。柯维没有简单地\"批准\"或\"拒绝\"，而是用一种\"巧妙的方式\"，帮助学生\"看清\"自己言语背后的\"被动心态\"。《广论》讲\"善巧引导、令自觉察\"也讲这个道理——日常法师反复讲，\"真正'会教'的人，不'直接'替人'下结论'，而是'引导'对方'自己'去'觉察、反省'，这样才'入心'\"。那么，面对学生说\"我不得不去\"，柯维是怎么做的？",options:["果断批准他的请假", "让他写一份检讨书", "拒绝批准他的请假", "问他\"你是自愿还是不得不去\"，帮他认识到这是自己的选择"],answer:3,explanation:"✅ 答案是D。面对学生\"我不得不去\"，柯维会问他\"你是自愿去的，还是不得不去？\"——用这个\"问题\"引导学生\"觉察\"：其实\"去不去\"是\"你自己选择\"的结果，\"没有人'逼'你'不得不'去\"，是你\"自愿\"选择去的。这样，学生就\"看清\"了自己\"把选择权'推给'外界\"的\"被动心态\"，从而\"学会'为自己的选择负责'\"。这个\"善巧引导、令自觉察\"的道理，和广论讲\"善巧接引\"完全一致：日常法师反复讲，真正\"会教\"的人，不\"直接\"替人\"下结论\"，而是\"引导\"对方\"自己\"去\"觉察、反省\"，这样才\"入心\"。所以正确答案是D。\"不得不\"是\"被动\"的语言外衣——撕开它，你才能\"看见\"那个\"主动选择的自己\"。"},{stem:"柯维在阐述\"思维定式是根本、行为态度是枝叶\"时，引用了一句极其有力、极具画面感的名言——出自《圣雄甘地》(梭罗、爱默生、林肯也被认为说过类似的话)。这句话用一个\"砍树\"的比喻，道出了\"改变'根'比改变'枝叶'重要一万倍\"的真理。《广论》讲\"从根本处用功\"也讲这个道理——日常法师反复讲，\"'对治'烦恼、'改变'人，要从'根本'的'见地、观念'上'下手'，比'在'枝叶'（表面行为）上'费力'有效'百千万倍'\"。那么，柯维引用的这句\"砍树\"名言是什么？",options:["\"活在当下\"的处世智慧", "\"大道至简\"的朴素道理", "\"万物皆有其时\"的哲理", "\"一棵邪恶的大树，砍它枝叶千斧，不如砍它根基一斧\""],answer:3,explanation:"✅ 答案是D。柯维引用的这句名言是\"一棵邪恶的大树，砍它枝叶千斧，不如砍它根基一斧\"——意思是：一棵\"坏树\"（代表\"错误的行为、态度、结果\"），你\"在枝叶上\"砍一千斧（改表面行为），不如\"在根基上\"砍一斧（改变\"根本的思维定式、观念\"）来得彻底。因为\"枝叶\"是\"根\"生出来的，\"根\"一砍，\"枝叶\"自然枯萎。这个\"从根本处用功\"的道理，和广论完全一致：日常法师反复讲，\"对治\"烦恼、\"改变\"人，要从\"根本\"的\"见地、观念\"上\"下手\"，比\"在枝叶（表面行为）上费力\"有效\"百千万倍\"。所以正确答案是D。别在\"枝叶\"（表面）上\"白费千斧\"，要在\"根基\"（思维定式）上\"下那一斧\"。"},{stem:"前面的\"时间管理矩阵\"讲过，高效能人士聚焦\"第二象限\"（重要但不紧急）。但\"要事第一\"这个习惯，还需要一个\"具体可操作\"的落地方法——柯维给出的，是一种\"以周为单位、以原则为中心\"的计划方法。这个方法，把\"计划\"从\"逐日排满日程\"升级成了\"每周先定'重点'\"。《广论》讲\"定课、规划、先务本\"也讲这个道理——日常法师反复讲，\"要'有规律、有计划'地修行\"，\"先把'最重要、最根本'的'功课'定下来、放进去，其余'顺带'安排\"，\"不能'随波逐流、东抓一下西抓一下'\"。那么，柯维推荐的\"要事第一\"的落地方法是什么？",options:["先去处理所有紧急的邮件", "每周做计划，优先安排\"重要但不紧急\"的事", "同时并行处理多个任务", "把日程排得满满当当"],answer:1,explanation:"✅ 答案是B。柯维推荐的\"要事第一\"落地方法是\"每周做计划，优先安排'重要但不紧急'的事\"——把\"计划单位\"从\"天\"提升到\"周\"：每周挑一个固定时间，\"以原则为中心、以角色（丈夫/父亲/员工/学习者…）为框架\"来规划，把\"重要但不紧急\"的事（如锻炼、学习、家庭、战略）\"优先排进\"日历，\"守住\"这些时间，其余\"琐事\"围绕它们安排。这个\"定课、规划、先务本\"的道理，和广论讲\"定课\"完全一致：日常法师反复讲，要\"有规律、有计划\"地修行，先把\"最重要、最根本\"的\"功课\"定下来、放进去，其余\"顺带\"安排，不能\"随波逐流、东抓一下西抓一下\"。所以正确答案是B。别被\"眼前的琐事\"牵着走——\"每周\"先把\"要事\"定下来、守住它。"},{stem:"柯维在一次研讨会上，一位经理向他诉苦：\"我的员工又懒散又敷衍，我该怎么对付他们？\"这时，旁边另一位经理（这家公司的\"客户\"之一）忍不住说了一句\"一针见血\"的话，让那位抱怨的经理哑口无言、面红耳赤。《广论》讲\"将心比心、己所不欲勿施于人\"也讲这个道理——日常法师反复讲，\"你怎么对待'内在的人'（家人、员工），就'照见'了你的'心'；'对外'的'虚伪客气'，瞒不过'自己'的'真心'\"；\"要'一视同仁'地'慈悲'，不能'内外有别'\"。那么，那位\"客户经理\"是怎么\"怼\"这位抱怨员工懒散的经理的？",options:["用法律手段解决更好", "你怎么不这样对待顾客呢？说\"不想买就滚蛋\"？", "直接扣他们工资就行", "这样对待员工太残忍了"],answer:1,explanation:"✅ 答案是B。那位\"客户经理\"怼道：\"你怎么不这样对待顾客呢？说'不想买就滚蛋'？\"——言下之意：你对\"外部\"的\"顾客\"百般\"客气、讨好\"，却对\"内部\"的\"员工\"\"又懒又敷衍\"地\"抱怨、想'对付'\"；你要真是\"那种'对人的态度'\"，为什么不对\"顾客\"也\"甩脸色、说难听话\"？这句话\"照见\"了那位经理\"内外不一、双重标准\"的心态。这个\"将心比心、一视同仁\"的道理，和广论讲\"慈悲平等\"完全一致：日常法师反复讲，你\"怎么对待内在的人（家人、员工）\"，就\"照见\"了你的\"心\"；\"对外\"的\"虚伪客气\"，瞒不过\"自己\"的\"真心\"；要\"一视同仁地慈悲，不能内外有别\"。所以正确答案是B。你对\"顾客\"有多客气，就想想自己\"对员工（家人）\"是不是\"也那样\"——\"内外如一\"，才是真修养。"},{stem:"在阐述\"产出/产能平衡\"时（鹅与金蛋的寓言），柯维把人类拥有的\"资产\"分成了三类，并分别用生动的例子说明了\"只消耗、不维护\"这些资产会带来什么后果。其中有一类资产，\"维护\"的方式不是\"休息\"，而是另一种更微妙的动作。《广论》讲\"护持三种资粮（智慧、功德、法财）\"也讲这个道理——日常法师反复讲，\"有些'资粮'（如'智慧、功德、信誉'）要'持续'地'串习、守护'，而不是'静止'地'存着'就'保值'\"。那么，以下哪一项是柯维所说的\"三类资产\"之外、【并非】三类资产之一的？",options:["人力资产", "金融资产", "物质资产", "知识产权"],answer:3,explanation:"✅ 答案是D。这道题问哪一项\"不是\"柯维所说的\"三类资产\"之一。柯维把资产分成三类：\"物质资产\"（如机器、厂房，需要保养维护）、\"金融资产\"（如金钱、投资，需要理财增值）、\"人力资产\"（如身体、技能、人际关系，需要持续投资维护）。而\"知识产权\"【不算】柯维说的\"三类资产\"之一（它属于\"无形资产\"，但柯维所用的分类是\"物质/金融/人力\"这三类）。这个\"护持资粮\"的道理，和广论讲\"护持三种资粮\"相通：日常法师反复讲，有些\"资粮（智慧、功德、信誉）\"要\"持续地串习、守护\"，而不是\"静止地存着就保值\"。所以正确答案是D。柯维的\"三类资产\"是\"物质、金融、人力\"——别把\"知识产权\"也算进去。"},{stem:"柯维的\"积极主动\"原则，不仅适用于\"自我修炼\"，也适用于\"管理他人\"。假设你是一位经理，你手下有个下属，一遇到困难就抱怨\"这不是我的错\"\"我没办法\"\"上面不支持我\"——典型地把自己当成\"受害者\"。柯维会建议你，不要\"简单地'批评'或'替他把活干了'\"，而要帮他做一件\"更根本\"的事。《广论》讲\"助人自立、令其自觉觉他\"也讲这个道理——日常法师反复讲，\"'帮人'，最高明的是'帮'他'自己'立起来、'自己'觉悟\"，\"而不是'替他'把事'包办'了，让他'更依赖'\"。那么，面对\"受害者心态\"的下属，柯维建议经理怎么做？",options:["索性替他做完工作", "帮他认识到\"你可以选择自己的回应方式\"，培养其责任感", "直接把他开除掉", "严厉批评他一顿"],answer:1,explanation:"✅ 答案是B。面对\"受害者心态\"的下属，柯维建议经理\"帮他认识到'你可以选择自己的回应方式'，培养其责任感\"——不是\"简单批评\"（治标）、不是\"开除\"（逃避）、不是\"替他做\"（让他更依赖），而是\"引导他\"觉察：\"你不是'受害者'，你'有'选择的自由和'责任'。\"帮助他\"把'被动'的心态'转'成'主动'的'责任感'，让他\"自己\"站起来承担责任。这个\"助人自立、令其自觉\"的道理，和广论讲\"助人自立\"完全一致：日常法师反复讲，\"帮人\"最高明的是\"帮他\"自己\"立起来、自己\"觉悟\"，而不是\"替他\"把事\"包办\"了，让他\"更依赖\"。所以正确答案是B。\"授人以鱼\"不如\"授人以渔\"——帮下属\"找回'责任'和'选择权'\"，比\"替他做\"重要得多。"},{stem:"柯维在书的最后，引用了一个《旧约圣经》里极为震撼的人物故事——约瑟的故事。约瑟17岁时被自己的哥哥们\"嫉妒\"、出卖为奴，又被诬陷下狱，人生跌到谷底。但他始终没有\"被仇恨和自怜\"吞噬，而是\"选择\"以一种\"积极、宽恕、负责\"的态度面对，最终\"翻转\"了自己的命运，成为埃及的宰相，还\"饶恕\"了当年害他的哥哥们。《广论》讲\"转逆缘为道用、忍辱成诸功德\"也讲这个道理——日常法师反复讲，\"'逆境'、'迫害'，正是'修'忍辱、'积'功德、'成就'道业'的最好'时机'\"；\"会'转'的人，'最大'的'苦难'能'转'成'最大'的'善'\"。那么，柯维引用\"约瑟被卖为奴却翻转命运\"的故事，想说明什么？",options:["复仇是正当合理的", "顺从命运的安排", "好人往往没有好报", "被卖为奴也能因积极态度而翻转命运"],answer:3,explanation:"✅ 答案是D。柯维引用\"约瑟被卖为奴却翻转命运\"的故事，想说明\"被卖为奴也能因'积极态度'而翻转命运\"——约瑟遭受\"被哥哥出卖、被诬陷下狱\"的\"巨大逆境\"，但他\"不怨天尤人、不沉溺自怜\"，而是\"选择\"以\"积极、负责、宽恕\"的态度面对一切，最终\"困境\"反而成了他\"成长、翻身\"的\"跳板\"。故事的核心，是\"态度\"决定\"命运的走向\"。这个\"转逆缘为道用、忍辱成德\"的道理，和广论完全一致：日常法师反复讲，\"逆境、迫害\"正是\"修忍辱、积功德、成就道业\"的最好\"时机\"；\"会转的人，最大的苦难能转成最大的善\"。所以正确答案是D。命运不由\"遭遇\"决定，由你\"面对遭遇的态度\"决定——\"逆境\"是\"炼金石\"。"}]}
];
let currentBook=0, currentQ=0, answers={};
function init(){buildTabs();showQuestion();updateNavButtons();}
function buildTabs(){
  var html=books.map(function(b,i){
    var answered=0;
    for(var j=0;j<b.questions.length;j++){if(answers[i+'-'+j]!==undefined)answered++;}
    return '<div class="book-tab'+(i===currentBook?' active':'')+'" onclick="switchBook('+i+')">'+b.name+'<div class="tab-progress">'+answered+'/'+b.questions.length+'</div></div>';
  }).join('');
  document.getElementById('bookTabs').innerHTML=html;
}
function switchBook(i){currentBook=i;currentQ=0;refresh();}
function refresh(){buildTabs();showQuestion();updateNavButtons();}
function goPrev(){if(currentQ>0){currentQ--;showQuestion();updateNavButtons();}}
function goNext(){var qs=books[currentBook].questions;if(currentQ<qs.length-1){currentQ++;showQuestion();updateNavButtons();}}
function updateNavButtons(){
  var qs=books[currentBook].questions;
  document.getElementById('btnPrev').disabled=(currentQ===0);
  document.getElementById('btnNext').disabled=(currentQ>=qs.length-1);
  var key=currentBook+'-'+currentQ, hint=document.getElementById('navHint');
  if(answers[key]===undefined){hint.textContent='未作答';return;}
  hint.textContent=(answers[key]===qs[currentQ].answer)?'✅ 正确':'❌ 错误';
}
function showQuestion(){
  var qs=books[currentBook].questions, q=qs[currentQ], b=books[currentBook];
  document.getElementById('qProgress').innerHTML='<span style="color:#f0c060;">'+b.name+'</span> · 第 <span class="q-number">'+(currentQ+1)+'</span> / '+qs.length+' 题';
  document.getElementById('qStem').innerHTML=q.stem;
  var body=document.getElementById('qBody'), key=currentBook+'-'+currentQ, prevAns=answers[key];
  body.innerHTML='<div class="options">'+q.options.map(function(opt,i){
    var cls='option';
    if(prevAns!==undefined){cls+=' disabled';if(i===q.answer)cls+=' correct';else if(i===prevAns&&prevAns!==q.answer)cls+=' wrong';}
    var label=String.fromCharCode(65+i);
    return '<div class="'+cls+'" onclick="'+(prevAns===undefined?'answerChoice('+i+')':'')+'">'+label+'. '+opt+'</div>';
  }).join('')+'</div>';
  var explDiv=document.getElementById('qExplanation');
  if(prevAns!==undefined&&q.explanation){explDiv.className='explanation show';explDiv.innerHTML='💡 '+q.explanation;}
  else{explDiv.className='explanation';explDiv.textContent='';}
  updateScoreboard();
}
function answerChoice(idx){
  var key=currentBook+'-'+currentQ;
  if(answers[key]!==undefined)return;
  answers[key]=idx;showQuestion();updateNavButtons();
}
function updateScoreboard(){
  var total=0,correct=0;
  for(var b=0;b<books.length;b++)for(var j=0;j<books[b].questions.length;j++){
    var key=b+'-'+j;if(answers[key]===undefined)continue;
    total++;if(answers[key]===books[b].questions[j].answer)correct++;
  }
  var wrong=total-correct, pct=total>0?Math.round(correct/total*100):0;
  var totalQ=0;for(var b=0;b<books.length;b++)totalQ+=books[b].questions.length;
  document.getElementById('sbProgress').textContent=total+'/'+totalQ;
  document.getElementById('sbCorrect').textContent=correct;
  document.getElementById('sbWrong').textContent=wrong;
  document.getElementById('sbScore').textContent=pct+'%';
}
function showAllAnswers(){books[currentBook].questions.forEach(function(q,qi){answers[currentBook+'-'+qi]=q.answer;});refresh();}
function resetCurrentBook(){books[currentBook].questions.forEach(function(_,qi){delete answers[currentBook+'-'+qi];});currentQ=0;refresh();}
function resetAll(){answers={};currentBook=0;currentQ=0;refresh();}
init();
</script>
