<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青春修炼手册 · 精华25题（定制版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #0f0f23; color: #c8d0e0; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; line-height: 1.8; overflow-x: hidden; }
canvas#fx { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

.app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* ===== 顶部统计栏 ===== */
.topbar { position: sticky; top: 0; z-index: 100; background: #0f0f23ee; backdrop-filter: blur(10px); border-bottom: 1px solid #2a2a4a; padding: 10px 16px; }
.topbar-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.topbar-title { font-size: 15px; font-weight: 700; color: #f0c060; white-space: nowrap; }
.stats { display: flex; gap: 14px; font-size: 12px; }
.stat { text-align: center; }
.stat-num { font-size: 18px; font-weight: 800; line-height: 1.2; }
.stat-label { font-size: 10px; color: #556677; }
.stat-right .stat-num { color: #2ecc71; }
.stat-wrong .stat-num { color: #e74c3c; }
.stat-rate .stat-num { color: #f0c060; }
.progress-bar { height: 3px; background: #1a1a2e; border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f0c060, #e8a830); border-radius: 2px; transition: width .3s; width: 0%; }

/* ===== 类别标签 ===== */
.cat-badge { display: inline-block; font-size: 11px; padding: 3px 12px; border-radius: 20px; margin-bottom: 14px; font-weight: 600; }
.cat-money { background: #e74c3c22; color: #e74c3c; }
.cat-risk { background: #f39c1222; color: #f39c12; }
.cat-relationship { background: #9b59b622; color: #9b59b6; }
.cat-growth { background: #3498db22; color: #3498db; }

/* ===== 题目区域 ===== */
.quiz-area { flex: 1; padding: 20px 16px; }
.question-card { background: #1a1a2e; border-radius: 16px; padding: 24px 20px; border: 1px solid #2a2a4a; }
.question-card.animate-in { animation: cardIn .35s ease; }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.q-num-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.q-num { background: #2a2a4a; color: #f0c060; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.q-type { font-size: 11px; color: #556677; }
.stem { font-size: 15px; color: #c8d0e0; line-height: 2; margin-bottom: 22px; }
.stem b { color: #f0c060; font-weight: normal; }

/* ===== 选项 ===== */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { background: #1e1e3a; border: 1.5px solid #2e2e4e; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all .15s; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #b0b8c8; }
.opt:active { transform: scale(.98); }
.opt .letter { font-weight: 700; color: #667788; flex-shrink: 0; min-width: 20px; }
.opt:hover { border-color: #f0c06033; }
.opt.correct { background: #0d3d1a; border-color: #2ecc71; }
.opt.correct .letter, .opt.correct .text { color: #7dd87d; }
.opt.wrong { background: #3d0d0d; border-color: #e74c3c; }
.opt.wrong .letter, .opt.wrong .text { color: #e07070; }
.opt.disabled { pointer-events: none; }
.opt.dim { opacity: 0.4; }

/* ===== 解析 ===== */
.exp-box { margin-top: 18px; padding: 18px; background: #0f0f23; border-radius: 12px; border-left: 3px solid #f0c060; display: none; }
.exp-box.show { display: block; animation: cardIn .25s; }
.exp-title { font-size: 13px; font-weight: 700; color: #f0c060; margin-bottom: 10px; }
.exp-body { font-size: 14px; color: #a0a8b8; line-height: 2; }
.exp-source { font-size: 11px; color: #455566; margin-top: 12px; padding-top: 10px; border-top: 1px solid #1a1a2e; }

/* ===== 导航按钮 ===== */
.nav-bar { display: flex; gap: 12px; padding: 16px; border-top: 1px solid #1a1a2e; }
.nav-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s; }
.nav-btn:active { transform: scale(.97); }
.nav-btn.prev { background: #1a1a2e; color: #667788; border: 1px solid #2a2a4a; }
.nav-btn.next { background: #f0c060; color: #0f0f23; }
.nav-btn.finish { background: #2ecc71; color: #0f0f23; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ===== 开始页 ===== */
.start-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 40px 24px; }
.start-page h1 { color: #f0c060; font-size: 28px; margin-bottom: 8px; }
.start-page .game-tag { background: #f0c060; color: #0f0f23; font-size: 11px; font-weight: 700; padding: 4px 16px; border-radius: 20px; margin-bottom: 20px; letter-spacing: 2px; }
.start-page .desc { color: #8899aa; font-size: 14px; line-height: 2; margin-bottom: 28px; max-width: 380px; }
.start-page .desc strong { color: #f0c060; }
.start-btn { background: #f0c060; color: #0f0f23; border: none; padding: 14px 44px; border-radius: 30px; font-size: 17px; font-weight: 800; cursor: pointer; transition: all .2s; box-shadow: 0 4px 20px #f0c06033; }
.start-btn:active { transform: scale(.95); }

/* ===== 结束页 ===== */
.finish-page { text-align: center; padding: 48px 24px; }
.finish-page h1 { color: #f0c060; font-size: 26px; margin-bottom: 8px; }
.finish-page .score-big { font-size: 48px; font-weight: 900; color: #f0c060; margin: 20px 0; }
.finish-page .score-label { font-size: 14px; color: #8899aa; }
.cat-breakdown { margin: 28px 0; }
.cat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1a1a2e; border-radius: 10px; margin-bottom: 8px; }
.cat-row .cat-name { font-size: 14px; }
.cat-row .cat-stat { font-size: 13px; color: #8899aa; }
.restart-btn { background: #1a1a2e; color: #f0c060; border: 1px solid #f0c060; padding: 12px 36px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; }

/* ===== 震动动画 ===== */
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.shake { animation: shake .3s; }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="app" id="app">
  <!-- 开始页 -->
  <div class="start-page" id="startPage">
    <div class="game-tag">🎮 NEW DUNGEON</div>
    <h1>青春修炼手册</h1>
    <p style="color:#556677;font-size:13px;margin-bottom:24px;">精华25题 · 针对性设计 · 约40分钟</p>
    <div class="desc">
      你好，我是林小棠。高三，国际部，AP倒计时。<br>
      零花钱永远不够，皮肤出了又想买，网恋第三次被已读不回，隔壁班那个男生连我名字都不知道。<br><br>
      但最近我翻了一些书，发现<strong>那些让我焦虑的事，几百年前就有人想明白了。</strong><br><br>
      这套题会根据你的做题表现自动调整——哪里薄弱就多练哪里。<br>
      每道题选完会立刻看到专属解析，选错也有针对你选项的独立讲解。<br><br>
      准备好了吗？
    </div>
    <button class="start-btn" onclick="startQuiz()">▶ 开始冒险</button>
  </div>

  <!-- 答题页（动态填充） -->
  <div id="quizPage" style="display:none;">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">🌟 青春修炼手册</div>
        <div class="stats">
          <div class="stat"><div class="stat-num" id="sDone">0</div><div class="stat-label">已做</div></div>
          <div class="stat stat-right"><div class="stat-num" id="sRight">0</div><div class="stat-label">正确</div></div>
          <div class="stat stat-wrong"><div class="stat-num" id="sWrong">0</div><div class="stat-label">错误</div></div>
          <div class="stat stat-rate"><div class="stat-num" id="sRate">—</div><div class="stat-label">正确率</div></div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <div class="quiz-area" id="quizArea">
      <!-- 题目动态渲染 -->
    </div>

    <div class="nav-bar">
      <button class="nav-btn prev" id="btnPrev" onclick="prevQuestion()" disabled>← 上一题</button>
      <button class="nav-btn next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- 结束页 -->
  <div class="finish-page" id="finishPage" style="display:none;">
    <div style="font-size:48px;margin-bottom:12px;">🎉</div>
    <h1 id="finishTitle">通关！</h1>
    <p style="color:#8899aa;font-size:14px;">你已完成全部题目</p>
    <div class="score-big" id="finalScore">0%</div>
    <div class="score-label" id="finalLabel">总正确率</div>
    <div class="cat-breakdown" id="catBreakdown"></div>
    <button class="restart-btn" onclick="restart()">↻ 重新开始</button>
  </div>
</div>

<script src="youth_essence25.js"></script>
<script>
// ===== 全局状态 =====
let history = [];          // [{qid, chosen, correct, category}]
let currentIndex = -1;      // 当前在history中的位置
let doneSet = new Set();    // 已做过的题目id
let catStats = {            // 各类别统计
  money:        { right: 0, total: 0 },
  risk:         { right: 0, total: 0 },
  relationship: { right: 0, total: 0 },
  growth:       { right: 0, total: 0 }
};
const CAT_NAMES = {
  money: '💰 金钱与消费',
  risk: '⚠️ 风险与判断',
  relationship: '💜 人际与亲密关系',
  growth: '🌟 人生抉择与自我成长'
};

// ===== 加载本地存储 =====
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('youth2_state'));
    if (saved) {
      history = saved.history || [];
      doneSet = new Set(history.map(h => h.qid));
      catStats = saved.catStats || catStats;
      currentIndex = history.length - 1;
    }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('youth2_state', JSON.stringify({ history, catStats }));
}

// ===== 开始 =====
function startQuiz() {
  document.getElementById('startPage').style.display = 'none';
  document.getElementById('quizPage').style.display = 'block';
  loadState();
  if (history.length === 0) {
    // 第一题从money类开始（林小棠的故事入口）
    const q = QUESTIONS.find(q => q.category === 'money' && q.id === 1) || pickNextQuestion();
    pushQuestion(q);
  } else {
    currentIndex = history.length - 1;
    renderCurrent();
  }
  updateStats();
}

// ===== 自适应选题 =====
function pickNextQuestion() {
  const remaining = QUESTIONS.filter(q => !doneSet.has(q.id));
  if (remaining.length === 0) return null;

  const r = Math.random();
  let pool;

  if (r < 0.55) {
    // 55%概率：从最弱类别出题
    const cats = Object.entries(catStats).filter(([,s]) => s.total >= 3);
    if (cats.length > 0) {
      cats.sort((a,b) => (a[1].right/a[1].total) - (b[1].right/b[1].total));
      const weakest = cats[0][0];
      pool = remaining.filter(q => q.category === weakest);
      if (pool.length === 0) pool = remaining;
    } else {
      pool = remaining;
    }
  } else if (r < 0.70) {
    // 15%概率：抽查最强类别（巩固）
    const cats = Object.entries(catStats).filter(([,s]) => s.total >= 3);
    if (cats.length > 0) {
      cats.sort((a,b) => (b[1].right/b[1].total) - (a[1].right/a[1].total));
      const strongest = cats[0][0];
      pool = remaining.filter(q => q.category === strongest);
      if (pool.length === 0) pool = remaining;
    } else {
      pool = remaining;
    }
  } else {
    // 30%概率：随机
    pool = remaining;
  }

  return pool[Math.floor(Math.random() * pool.length)];
}

function pushQuestion(q) {
  if (!q) {
    showFinish();
    return;
  }
  history.push({ qid: q.id, chosen: null, correct: null, category: q.category, answered: false });
  currentIndex = history.length - 1;
  saveState();
  renderCurrent();
}

// ===== 渲染当前题 =====
function renderCurrent() {
  const h = history[currentIndex];
  const q = QUESTIONS.find(x => x.id === h.qid);
  if (!q) return;

  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'question-card animate-in';

  // 类别标签
  const catBadge = `<span class="cat-badge cat-${q.category}">${CAT_NAMES[q.category]}</span>`;

  // 选项
  const optsHtml = q.options.map(opt => `
    <div class="opt" data-letter="${opt.letter}" onclick="selectOption(${q.id}, '${opt.letter}')">
      <span class="letter">${opt.letter}.</span>
      <span class="text">${opt.text}</span>
    </div>
  `).join('');

  // 解析
  const expHtml = h.answered ? `
    <div class="exp-box show">
      <div class="exp-title">📖 ${h.chosen === q.correct ? '✅ 答对了！' : '💡 看看解析'}</div>
      <div class="exp-body">${q.explanations[h.chosen] || q.explanations[q.correct]}</div>
      <div class="exp-source">${q.source}</div>
    </div>
  ` : '';

  card.innerHTML = `
    <div class="q-num-row">
      <span class="q-num">第 ${currentIndex + 1} 题</span>
      <span class="q-type">共 ${QUESTIONS.length} 题题库</span>
    </div>
    ${catBadge}
    <div class="stem">${q.stem}</div>
    <div class="opts">${optsHtml}</div>
    ${expHtml}
  `;
  area.appendChild(card);

  // 如果已答，恢复选项状态
  if (h.answered) {
    const opts = area.querySelectorAll('.opt');
    opts.forEach(o => {
      o.classList.add('disabled');
      const letter = o.dataset.letter;
      if (letter === q.correct) o.classList.add('correct');
      else if (letter === h.chosen) o.classList.add('wrong');
      else o.classList.add('dim');
    });
  }

  // 更新导航按钮
  document.getElementById('btnPrev').disabled = currentIndex <= 0;
  const btnNext = document.getElementById('btnNext');
  if (!h.answered) {
    btnNext.textContent = '选择答案后继续 →';
    btnNext.disabled = true;
  } else {
    btnNext.disabled = false;
    btnNext.textContent = (currentIndex >= history.length - 1 && doneSet.size >= QUESTIONS.length) ? '完成 🎉' : '下一题 →';
  }

  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== 选择选项 =====
function selectOption(qid, letter) {
  const h = history[currentIndex];
  if (h.answered) return;
  const q = QUESTIONS.find(x => x.id === qid);

  h.chosen = letter;
  h.correct = (letter === q.correct);
  h.answered = true;
  doneSet.add(qid);

  // 更新类别统计
  catStats[q.category].total++;
  if (h.correct) catStats[q.category].right++;

  saveState();
  updateStats();

  // 渲染选项状态
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => {
    o.classList.add('disabled');
    const l = o.dataset.letter;
    if (l === q.correct) o.classList.add('correct');
    else if (l === letter) o.classList.add('wrong');
    else o.classList.add('dim');
  });

  // 显示解析
  const card = document.querySelector('.question-card');
  const expBox = document.createElement('div');
  expBox.className = 'exp-box show';
  expBox.innerHTML = `
    <div class="exp-title">📖 ${h.correct ? '✅ 答对了！' : '💡 看看解析'}</div>
    <div class="exp-body">${q.explanations[letter]}</div>
    <div class="exp-source">${q.source}</div>
  `;
  card.appendChild(expBox);

  // 动画
  if (h.correct) {
    celebrate();
    playCorrectSound();
  } else {
    const card2 = document.querySelector('.question-card');
    card2.classList.add('shake');
    setTimeout(() => card2.classList.remove('shake'), 300);
    playWrongSound();
  }

  // 启用下一题按钮
  const btnNext = document.getElementById('btnNext');
  btnNext.disabled = false;
  btnNext.textContent = '下一题 →';
}

// ===== 导航 =====
function nextQuestion() {
  const h = history[currentIndex];
  if (!h || !h.answered) return;

  // 如果是最后一题且有更多题目
  if (currentIndex >= history.length - 1) {
    const next = pickNextQuestion();
    if (!next) {
      showFinish();
      return;
    }
    pushQuestion(next);
  } else {
    // 前进到已有的下一题
    currentIndex++;
    renderCurrent();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCurrent();
  }
}

// ===== 统计 =====
function updateStats() {
  const done = history.filter(h => h.answered).length;
  const right = history.filter(h => h.answered && h.correct).length;
  const wrong = done - right;
  const rate = done > 0 ? Math.round(right / done * 100) + '%' : '—';

  document.getElementById('sDone').textContent = done;
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRate').textContent = rate;

  // 进度条
  const pct = Math.round(doneSet.size / QUESTIONS.length * 100);
  document.getElementById('progFill').style.width = pct + '%';
}

// ===== 完成页 =====
function showFinish() {
  document.getElementById('quizPage').style.display = 'none';
  const fp = document.getElementById('finishPage');
  fp.style.display = 'block';

  const done = history.filter(h => h.answered).length;
  const right = history.filter(h => h.answered && h.correct).length;
  const rate = done > 0 ? Math.round(right / done * 100) : 0;

  document.getElementById('finalScore').textContent = rate + '%';

  // 各类别表现
  const bd = document.getElementById('catBreakdown');
  bd.innerHTML = Object.entries(catStats).map(([cat, s]) => {
    const r = s.total > 0 ? Math.round(s.right / s.total * 100) : 0;
    const bar = '█'.repeat(Math.round(r/10)) + '░'.repeat(10 - Math.round(r/10));
    return `<div class="cat-row">
      <span class="cat-name">${CAT_NAMES[cat]}</span>
      <span class="cat-stat">${s.right}/${s.total} · ${r}%</span>
    </div>`;
  }).join('');
}

// ===== 重新开始 =====
function restart() {
  history = [];
  doneSet.clear();
  catStats = {
    money: { right: 0, total: 0 },
    risk: { right: 0, total: 0 },
    relationship: { right: 0, total: 0 },
    growth: { right: 0, total: 0 }
  };
  currentIndex = -1;
  localStorage.removeItem('youth2_state');
  document.getElementById('finishPage').style.display = 'none';
  document.getElementById('startPage').style.display = 'flex';
}

// ===== 音效 =====
function playCorrectSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function playWrongSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

// ===== 天女散花动画 =====
function celebrate() {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const emojis = ['✨','🌟','💫','⭐','🎉','🎊','💖'];
  const colors = ['#f0c060','#e74c3c','#2ecc71','#3498db','#9b59b6','#f39c12'];
  const particles = [];
  const count = 50;

  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const velocity = 4 + Math.random() * 8;
    const isEmoji = Math.random() > 0.4;

    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2 - 50,
      vx: Math.cos(angle) * velocity,
      vy: Math.sin(angle) * velocity - 4,
      gravity: 0.18,
      life: 1.0,
      decay: 0.012 + Math.random() * 0.008,
      size: 14 + Math.random() * 12,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      type: isEmoji ? 'emoji' : 'circle',
      content: isEmoji ? emojis[Math.floor(Math.random() * emojis.length)] : colors[Math.floor(Math.random() * colors.length)]
    });
  }

  let frame = 0;
  const maxFrames = 120;

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;

    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;

      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.rot += p.vr;
      p.life -= p.decay;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);

      if (p.type === 'emoji') {
        ctx.font = p.size + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.content, 0, 0);
      } else {
        ctx.fillStyle = p.content;
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    });

    frame++;
    if (alive && frame < maxFrames) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  animate();
}

// ===== 初始化 =====
loadState();
</script>
</body>
</html>
