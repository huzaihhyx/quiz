quizData.jzx = {"title": "广论九住心专题", "questions": [{"stem": "你第一次尝试打坐，闭上眼把注意力放在呼吸上。三秒后想到晚饭吃什么，五秒后开始腿痒，十秒后回忆起白天跟同事吵架。这个阶段在九住心里叫什么？", "options": ["A. 等持——你已经在入定的路上了，只是还不太熟练", "B. 内住——你成功把心从外面收回来放到所缘上了，但它立刻又跑掉。这是听闻力成办的第一个阶段，就像第一次把野马拴在柱子上", "C. 近住——你的心已经靠近所缘了，只是还不够稳定", "D. 调伏——你的心在调伏过程中，需要更多耐心"], "type": "choice", "answer": 1, "explain": "第一心「内住」的定义是「从一切外所缘境摄录其心，令其攀缘内所缘境」——把心从外面收回来放到所缘上，就算成功了。至于放上去之后立刻又跑掉？那是正常的。就像第一次把野马拴在柱子上——拴住了但马还在挣扎。这个阶段靠的是听闻力——你听到了「把心放在呼吸上」这个教授，然后照着做。"}, {"stem": "假设你修了一周，打坐时心能在呼吸上连续待30秒了（虽然30秒后还是会跑）。跟第一天的三秒相比进步了。这属于九住心的哪个阶段？", "options": ["A. 调伏——你的心已经被调伏了", "B. 安住——你已经能稳定安住了", "C. 续住——心能在所缘上稍微连续安住了，虽然时间不长。由思惟力成办。就像马虽然还挣脱，但拴住的时间变长了", "D. 等持——你已经接近入定了"], "type": "choice", "answer": 2, "explain": "第二心「续住」：「初所系心令不散乱，即于所缘相续而住。」从三秒进步到三十秒就是续住——心开始在所缘上有了连续性。这个阶段靠思惟力——你不只是听教授了，还反复思惟练习。但要注意：续住阶段心还是会频繁跑掉，区别是它能稍微多待一会儿了。"}, {"stem": "你在第30天打坐。心放在呼吸上，突然想到「待会儿要交报告」。但在念头冒出的瞬间你就发现了——「啊，心跑了！」——然后立刻把注意力拉回呼吸。这个「散了→发现→拉回」的循环对应哪个阶段？", "options": ["A. 内住——因为你还是散乱了", "B. 安住——由忘念向外散时，速知散已，还复安置前所缘境。关键词是「速知」——散了能很快发现并拉回来", "C. 专注一趣——你完全不散乱了", "D. 等持——你已经自动入定了"], "type": "choice", "answer": 1, "explain": "第三心「安住」的核心特征是「速知散已，还复安置」——散了能快速察觉并回来。注意：安住阶段还是会散乱！区别在于恢复速度。内住续住阶段散了可能几分钟都不知道；到了安住，几秒钟就能发现并拉回。这靠忆念力——你的正念开始有力了，一走神就像触动了警报。"}, {"stem": "学骑自行车的比喻：第一阶段你刚上车就摔（内住）；第二阶段能蹬两下了但还晃（续住）；第三阶段摔了能迅速爬起来重新上车（安住）；第四阶段你能骑一小段了，虽然偶尔还歪——这对应九住心的哪一阶段？", "options": ["A. 调伏——你开始享受骑车的乐趣", "B. 近住——你的念力增强了，心不怎么往外跑了。马渐渐习惯了绳子，不再拼命挣脱", "C. 寂静——你看到不骑车的过患", "D. 等持——你完全不用想了"], "type": "choice", "answer": 1, "explain": "第四心「近住」：「从广大境数摄其心，令性渐细上上而住。」念力进一步增强，心不怎么往外散了。安住阶段是「散了拉回」，近住阶段是「不怎么散了」——因为正念的绳子越来越有力，心渐渐习惯了待在所缘上，像马习惯了绳子后不再拼命挣脱。"}, {"stem": "你修定三个月了。今天上座后心特别安定，你突然感到一种从未有过的宁静和舒服——「哇，原来定下来是这种感觉！真好！」你开始期待每天的打坐时间。这个心理变化对应哪一阶段？", "options": ["A. 寂静——你止息了对散乱的喜爱", "B. 专注一趣——你在长时间专注", "C. 最极寂静——你在斩断微细烦恼", "D. 调伏——由思惟正定功德，令于正定心生欣悦。你尝到了定的甜头，心生欢喜"], "type": "choice", "answer": 3, "explain": "第五心「调伏」的关键是「思惟正定功德，令于正定心生欣悦」——你开始体验到禅定的功德（宁静、清明、安乐），因此对修定生起了欢喜心。这是正知力成办的第一个阶段。但要注意：五欲（色声香味触）和三毒的干扰还在，只是你有能力不跟它们跑了。广论引《声闻地》说要先于五境三毒取其过患。"}, {"stem": "到了第六心「寂静」，你经历了一个有趣的变化：以前刷完手机后打坐，脑子里还想着短视频的内容；现在你发现「想手机」这个念头本身让你觉得烦躁不安——散乱从「有趣的诱惑」变成了「讨厌的干扰」。为什么？", "options": ["A. 因为你已经完全断除了贪欲", "B. 因为你太累了，不想动脑子", "C. 因为你看到了散乱的过患——于散乱观其过失，于三摩地止息不喜。正知力让你认识到了恶寻思和随烦恼的扰乱性质", "D. 因为你的手机坏了"], "type": "choice", "answer": 2, "explain": "第六心「寂静」：「于散乱观其过失，于三摩地止息不喜。」关键转变是——以前觉得散乱是享受（刷手机多快乐），现在看到散乱的过患（它打乱了我的定力、让我心烦）。这是正知力的深层运作：不仅知道散乱存在（第五心的层次），还认识到散乱是有害的。恶寻思和随烦恼还能冒出来，但你已经不跟随了。"}, {"stem": "第七心「最极寂静」像什么感觉？想象你在专心看书，突然一个念头冒出来「去看看朋友圈吧」——你甚至还没意识到这个念头变成行动，它就已经被掐灭了。就像手里拿着苍蝇拍，苍蝇刚起飞就被拍死。这靠的是什么力？", "options": ["A. 串习力——你已经太熟练了，完全不用想", "B. 思惟力——你在思维分析烦恼的过患", "C. 听闻力——你听过的教授在保护你", "D. 精进力——微细烦恼刚冒头就立刻斩断，不能容忍。「贪心忧等起，应如是寂静」"], "type": "choice", "answer": 3, "explain": "第七心「最极寂静」靠精进力。跟第六心的区别是反应速度：第六心是「看到过患不跟随」，第七心是「刚冒头就斩断」——连不跟随这个过程都省了。《声闻地》说「由失念故，若起如前所说寻思及随烦恼，随生寻断，能不忍受。」注意它还是会有烦恼冒出来，只是你的反应速度极快，一冒就断。"}, {"stem": "到了第八心「专注一趣」和第九心「等持」，沉掉已经不能障碍定力了。两者的区别是：第八心还需要努力维持（有功用），第九心完全不用努力（无功用）。就像开车：八心是新手全神贯注但不熄火了，九心是老手不用想就能开。", "options": ["A. 四作意是独立的四种修行方法，跟九住心没有对应", "B. 力励运转（第一至五心）→ 有间缺运转（第六至八心）→ 无功用运转（第九心）", "C. 力励运转（第一二心）→ 有间缺运转（第三至七心）→ 无间缺运转（第八心）→ 无功用运转（第九心）", "D. 九住心每一心对应一个作意"], "type": "choice", "answer": true, "explain": "完全正确。广论引《声闻地》说第八心「由有作行令无缺间，于三摩地相续而住」——沉掉不障了但还需要努力维持（有功用）。第九心「不由加行不由功用，心三摩地任运相续」——完全不用努力，心自然安住（无功用）。四作意中八心是「无间缺运转」（没有间断但需要努力），九心是「无功用运转」（既无间断也不用努力）。广论比喻如读书至极串熟——最初发起欲诵，虽中间心散，所读任运不断。"}, {"stem": "将六力与它们成办的住心阶段配对。", "options": ["A. 四作意是独立的四种修行方法，跟九住心没有对应", "B. 力励运转（第一至五心）→ 有间缺运转（第六至八心）→ 无功用运转（第九心）", "C. 力励运转（第一二心）→ 有间缺运转（第三至七心）→ 无间缺运转（第八心）→ 无功用运转（第九心）", "D. 九住心每一心对应一个作意"], "type": "choice", "answer": 2, "explain": "六力是九住心背后的心理能力。前两个力（听闻、思惟）是入门阶段——靠外部信息和自己思考。中间两个力（忆念、正知）是核心——念力拉住心，知力觉察沉掉。最后两个力（精进、串习）是成熟阶段——精进力斩细烦恼，串习力让一切自动化。六力有递进关系：无前力则后力不生。"}, {"stem": "广论用四作意来描述九住心中「需要多大努力」的变化。以下哪组对应关系是正确的？", "options": ["A. 四作意是独立的四种修行方法，跟九住心没有对应", "B. 力励运转（第一至五心）→ 有间缺运转（第六至八心）→ 无功用运转（第九心）", "C. 力励运转（第一二心）→ 有间缺运转（第三至七心）→ 无间缺运转（第八心）→ 无功用运转（第九心）", "D. 九住心每一心对应一个作意"], "type": "choice", "answer": 2, "explain": "广论引《声闻地》明确说四作意对应九心：①力励运转=内住+续住（需要极大努力才能把心放上去和维持）；②有间缺运转=安住到最极寂静五心（沉掉还在，中间有间断）；③无间缺运转=专注一趣（沉掉不能为障，无间断但仍需努力）；④无功用运转=等持（既无间断也不用努力）。这是从「咬牙硬撑」到「毫不费力」的完整光谱。"}, {"stem": "有趣的问题：广论说初二心（内住、续住）和中间五心（安住到最极寂静）都需要努力，但初二心叫「力励运转」、中间五心叫「有间缺运转」。为什么不都叫力励运转？", "options": ["A. 因为初二心连入定都做不到，中间五心能入但有时间断——前者的主要困难是「进不去」，后者是「进去了待不住」", "B. 因为佛陀这样命名，不需要理由", "C. 因为初二心比中间五心更重要", "D. 因为古文翻译的问题"], "type": "choice", "answer": 0, "explain": "广论自问自答了这个疑问：「初二心中，心入不入定，后者极长，中间五心住定时长。」意思是初二心大部分时间不在定中（散乱时间远多于住定时间），所以叫力励运转——主要特征是「拼命努力」。中间五心住定时间变长了，但沉掉还会间断，所以叫有间缺运转——主要特征是「有时在定有时不在」。虽然中间五心也需要努力，但住定的比例已经不同了。"}, {"stem": "广论引《摄波罗蜜多论》说：「由无间瑜伽，精勤修静虑，如数数休息，钻木不出火，瑜伽亦如是，未得胜勿舍。」这段话的意思是：修定像钻木取火，如果钻一会儿停一会儿（数数休息），永远出不了火。所以必须不间断地修。", "options": ["A. 念力是「拉住心不让它跑」的绳索，知力是「检查心有没有在状态」的监控——前者防散乱，后者防沉掉", "B. 念力让你入定，知力让你出定", "C. 念力和正知是同一个东西的两个名字", "D. 念力比知力重要得多"], "type": "choice", "answer": true, "explain": "广论用钻木取火的比喻强调「不间断」的重要性。如果修两天停三天，每次都从零开始，永远到不了九住心。但这不是说不能休息——广论在讲精进时说了「息舍力」（累了就适当休息）。关键是不要「弃舍所修加行」——你可以今天修完休息，但不能修一个月就彻底放弃换法门。这种人「必不能成」奢摩他。"}, {"stem": "六力中，「忆念力」和「正知力」是修定的核心工具。如果用一句话来区分它们的功能，以下哪个最准确？", "options": ["A. 念力是「拉住心不让它跑」的绳索，知力是「检查心有没有在状态」的监控——前者防散乱，后者防沉掉", "B. 念力让你入定，知力让你出定", "C. 念力和正知是同一个东西的两个名字", "D. 念力比知力重要得多"], "type": "choice", "answer": 0, "explain": "广论引《中观心论》：「意象不正行，当以正念索，缚所缘坚柱，慧钩渐调伏。」心如狂象，正念是绳索（把象拴在所缘柱子上），正知是钩子（象歪了就用钩子拉回来）。念力的作用是「令心不散于所缘」——直接拉住。知力的作用是「觉了沉掉将生未生」——间接监控。两者必须配合：只有念没有知，可能陷在沉没中不自知；只有知没有念，知道了也拉不住。"}, {"stem": "广论说九住心的每一步都是前一步的果，没有前一步就到不了后一步。如果你想直接跳到第九心「不用努力任运入定」，结果会怎样？", "options": ["A. 如果根器足够利，确实可以跳过前面的阶段直接到第九心", "B. 可以通过某种药物或特殊的呼吸法直接体验", "C. 可以通过特别的灌顶或加持直接到达", "D. 不可能——广论明确说「能生此者，先须一类功用依念正知」——没有前面的忆念力和正知力的训练，串习力无从谈起。就像没有学过握方向盘的人不可能直接「熟练驾驶」"], "type": "choice", "answer": 3, "explain": "广论层层追溯：第九心需要第八心为因（先须功用），第八需要第七（先须断微细烦恼），第七需要五六（先须有力正知），五六需要三四（先须忆念），三四需要一二（先须安住相续），一二需要所闻教授。整条链不能跳过。这就是「次第决定」——不可能跳过基础直接到高阶，就像不会走就想跑。"}, {"stem": "你修到了第九住心——不用努力心就自然安住，有无分别、安乐、光明的体验。你激动地跟师父说：「我开悟了！」师父该怎么回答？", "options": ["A. 「恭喜你！第九住心就是开悟的境界，你已证果了。」", "B. 「你已经超越了九住心，可以直接修密法了。」", "C. 「你需要继续修，等到看到佛菩萨的显现才算开悟。」", "D. 「别急。第九住心如果未得身心轻安，只是奢摩他随顺，不是真奢摩他，更不是开悟。有无分别安乐光明不等于证空性。」"], "type": "choice", "answer": 3, "explain": "广论卷十六反复强调这个误区：「然得此定，有无分别安乐光明而严饰者，误为已生根本后得共相合糅无分别智。」——有无分别、安乐、光明就觉得是开悟了，是最常见的错误。宗喀巴大师说第九住心甚至「未能入小乘道，何况大乘」——因为它缺乏出离心和菩提心的摄持，也缺乏无我正见。定力和智慧是两件事：定力让心不散乱，智慧才断烦恼。"}, {"stem": "广论说：第九住心必须生起身心轻安才算奢摩他。关于轻安的体验，以下哪个描述最接近广论的说法？", "options": ["A. 轻安就是觉得身体很轻，好像飘起来了", "B. 轻安的前相是头顶似重而起——不是头痛的那种重，而是一种特殊的充实感。然后风大遍全身，身体粗重感消失，身心调柔堪能如欲而转", "C. 轻安就是全身发热出汗，像运动后的感觉", "D. 轻安是心理上的快乐，跟身体无关"], "type": "choice", "answer": 1, "explain": "广论说轻安的生起有过程：先现起身轻安的「前相」——头顶感觉似重而起（一种特殊的充实感，不是不适）。然后体内的风大（气）变得调柔，遍及全身，身体的粗重感消失——这叫身轻安。身轻安引生心轻安——心从粗重中解脱，变得调柔，能如欲而转（想安住哪里就安住哪里）。轻安不是简单的「轻飘飘」，而是身心从束缚中获得的真实自由。"}, {"stem": "广论说了一个关键区分：「奢摩他随顺」vs「真奢摩他」。如果你到了第九住心但没得轻安，你的定是什么性质？", "options": ["A. 它是真奢摩他，只是程度较浅", "B. 它什么都不是，只是浪费时间", "C. 它是「奢摩他随顺作意」——跟奢摩他方向一致但还没到目的地。它还是欲界心，没有超出欲界", "D. 它比奢摩他更高级"], "type": "choice", "answer": 2, "explain": "广论引《解深密经》说：「乃至未得身心轻安，于此中间所有作意……非奢摩他，是名随顺奢摩他胜解相应作意。」这是欲界的心一境性——在欲界里最高的定力，但因为没有轻安，没有超出欲界的粗重性。一旦轻安生起，就从欲界心升到了色界地的「作意」，那时才叫真奢摩他。区别在于「堪能性」——有没有真正摆脱身心的粗重。"}, {"stem": "外道（非佛教的修行者）也能修到第九住心甚至更高的定力，但因为他们没有无我正见和出离心，定力退了照样轮回。", "options": ["A. 集修止资粮（六种）→选所缘→依九住心次第修→第九心生起→得身心轻安→成就奢摩他→以止为基修观（毗钵舍那）", "B. 听法→打坐→九住心→开悟→成佛", "C. 受戒→闭关→念咒→见本尊→得定", "D. 看书→思维→理解空性→直接入定"], "type": "choice", "answer": true, "explain": "广论卷十七明确说：「惟三摩地不能断惑。如诸外道，惟三摩地不能断惑。」外道也能修到无色界最深的非想非非想处定，但因为没有无我智慧（不知道烦恼的根本是我执），烦恼的种子完好无损。定力只是一块石头暂时压住了草——石头搬走草照长。所以广论反复强调：得止之后必须修观（毗钵舍那），以无我慧断烦恼根。"}, {"stem": "综合全卷：一个人从散乱凡夫到成就奢摩他，完整路径是怎样的？以下哪个排列正确？", "options": ["A. 集修止资粮（六种）→选所缘→依九住心次第修→第九心生起→得身心轻安→成就奢摩他→以止为基修观（毗钵舍那）", "B. 听法→打坐→九住心→开悟→成佛", "C. 受戒→闭关→念咒→见本尊→得定", "D. 看书→思维→理解空性→直接入定"], "type": "choice", "answer": 0, "explain": "广论的修止路径极为严密：①先集六资粮（住随顺处、少欲、知足、断杂务、清净尸罗、断贪等寻思）——这是很多人忽略的基础；②选择适合自己根性的所缘；③依九住心次第渐修（不可跳过任何一步）；④第九心生起后检查是否得轻安；⑤得轻安=奢摩他成就；⑥然后以止为基修毗钵舍那——「先止后观」是次第决定。整条路径从散乱到定成就，每一步都有明确标准和检验方法。"}, {"stem": "最后一道综合题。广论说修九住心时，修者最常犯的错误是什么？这个错误在今天仍然极为普遍。", "options": ["A. 把第九住心的无分别安乐光明误认为开悟/证空性——忽略了轻安这个分界线，更忽略了得止后还必须修观。宗喀巴大师说「尤有众多……误为已生无上瑜伽之圆满次第者」", "B. 修的时间太短——应该每天至少坐八小时", "C. 所缘选错了——应该统一用呼吸作为所缘", "D. 坐姿不标准——应该用全跏趺坐"], "type": "choice", "answer": 0, "explain": "宗喀巴大师在卷十六反复破斥这个误区：有人到第九心有无分别安乐光明，就误以为是「根本后得共相合糅无分别智」（开悟）；甚至有人误以为是密宗「无上瑜伽圆满次第」。大师说这些全是误解——第九心连小乘道都没入，何况大乘？正确的态度是：如实认识自己在九住心的哪个阶段，不拔高不贬低；得止后继续修观，以无我慧断烦恼根。修定是手段不是目的——「惟三摩地不能断惑」。"}]};
quizData.money = {"title": "有钱人和你想的不一样", "questions": [{"stem": "下午三点，暴雨突降。你站在便利店门口，必须马上赶回公司开会。眼前两把伞：左边塑料伞，400日元，轻飘飘的，上次那把用了一次就散了架；右边是一把折叠伞，8000日元，做工扎实，骨架是碳纤维的。你口袋里就一张一万日元的钞票。选哪把？给你三秒——不对，你现在到底是什么心态在选？", "options": ["A. 高质伞——好伞用三五年，你买它的钱平摊到每次下雨比塑料伞还便宜。而且一把像样的伞拿在手里，别人看你的第一反应都不一样。", "B. 塑料伞——就淋一段路，400日元搞定，花8000日元够买20把，一次性的东西没必要上好的在雨里绕弯子省钱的人，跟自己说「明天开始好好对待自己」", "C. 两把都不买——用包挡着头冲出去，淋就淋了，反正又不是没淋过雨，表面上看这似乎是最符合常理的做法你此刻正被400日元定义——这就是你的时间价值", "D. 找同事借一把——你在办公室的人际关系就是你的移动伞库，表面上看这似乎是最符合常理的做法一把伞是今天的4万，你和400日元之间只差一个念头"], "type": "choice", "answer": 0, "explain": "这就是田口智隆全书开篇的那道题。塑料伞的「便宜」是假的——你买十次就等于买了一把好伞，还搭上了你的形象管理。富人算的账是：这东西我能用多久？而不是这东西现在多少钱。当然，他说的前提是你会珍惜它——如果买了好伞也随手乱丢，那确实不如买塑料的。"}, {"stem": "你在银行门口排队，前面七个人，ATM机屏幕上显示「等待时间约12分钟」。你手机上有一封急需回复的工作邮件。转头看见隔壁便利店里的ATM，空荡荡的，但取一次要108日元手续费。你的大脑里两拨人在打架——一拨说「12分钟而已」，另一拨在叫「108日元也是钱啊」。富人脑子里想的是第三件事，是哪一件？", "options": ["A. 去便利店ATM——12分钟乘以一辈子取钱的次数，够你站好几天。而且你只要选对银行，连108日元手续费都能免掉。", "B. 银行ATM排队——108日元够买一瓶饮料了，12分钟玩玩手机就过去了，不差这点时间12分钟的队排的不是ATM，是你的时间在所有免费事物里转圈", "C. 先回去处理邮件改天再取——反正钱又不会过期，不急着用就先放着，表面上看这似乎是最符合常理的做法把急着要换零钱放在一边「改天再取」=改天这个计划堆到了下个月", "D. 找人代排——给他200日元小费请他帮忙，你赚了时间他赚了钱，表面上看这似乎是最符合常理的做法付小费让人代排是承认时间有标价的第一步，但你要想清楚这个标价对不对"], "type": "choice", "answer": 0, "explain": "富人对时间价值极度敏感——不是抠门，是计算。如果12分钟的无意义等待乘以一辈子取钱的次数，你等于在ATM机前面站了几天。田口智隆说了一个东西：「如果在便利店ATM取一次收108日元，一个月取3次，10年就是4万日元，30年就是12万——够带家人去趟不错的温泉旅馆了。」选银行的时候考虑ATM手续费和合作便利店数量，这叫战略思维。"}, {"stem": "你今年32岁，存了300万日元，正在犹豫一个所有同龄人都在吵的问题：郊区贷款买套4LDK的大房子，首付刚好够，月供25万，还30年；还是在市中心租个1LDK的公寓，月租18万，省下的7万去理财。你妈跟你说：「租房就是在帮房东还贷款。」你爸说：「买吧，自己的房子才有安全感。」你的富朋友说了一句话让你愣住了。他说了什么？", "options": ["A. 郊区贷款买房——自己名下的房子才是真资产。30年后还清全归你，租金交30年你什么都没留下房贷是银行的一门大生意，你付的利息在侧面搭的是别人的大楼", "B. 市区租房——不用背30年负债，随时可以换工作换城市。年轻时的灵活性和剩余资金比你拥有一套还没还完的房子重要得多。", "C. 买市区小公寓——缩小面积缩短贷款年限到15年，折中方案最有安全感买到就踏实了——踏实这个词换成数字的话值你30年的流动性", "D. 郊区买房后租出一间——自住加收租，两份收入对冲一份月供，表面上看这似乎是最符合常理的做法指望租客稳定交租来填月供，你需要先算清你请得起几次空置"], "type": "choice", "answer": 1, "explain": "田口智隆在第二章花了很大篇幅讲这件事。贷款买房最致命的不是利率高低，而是它会改变你的所有决策优先序——「还贷第一」变成人生默认模式，你不敢裸辞创业、不敢降薪换行业。而富人在原始积累阶段需要的是最大程度的灵活性和剩余资金。他认识的大部分富人在成为富人之前，都租房。"}, {"stem": "你在便利店排队结账。前面那个人翻遍了身上所有的口袋，钱包、裤兜、外套内袋，终于在某个缝里找到了一枚1日元硬币，笑眯眯地递给收银员。后面六个人在等着。你用三秒钟扫了一眼自己的支付选项——现金、微信、支付宝、银行卡。你选了哪个，才算在富人的频道上？", "options": ["A. 现金付——精确到日元，硬币攒多了还能拿去银行存，积少成多也是钱硬币攒满一只储蓄罐=你付出了一个下午的每周分类垃圾的时间成本", "B. 银行卡付——信用卡积分一年下来返的礼券够换张机票，能薅多少薅多少积分换机票的本质是把消费大头交给冲动换来消费小头的免费", "C. 电子支付——每笔都有记录可查。更重要的是别让后面的人看着你翻零钱——这不只是方便的问题，是你的专业形象问题。", "D. 现金付顺便聊两句——跟收银员混熟，便利店也是信息集散地，表面上看这似乎是最符合常理的做法跟收银员混熟的社交回报率能不能超过你的一通真正有用的电话"], "type": "choice", "answer": 2, "explain": "不只是支付速度的问题。田口智隆反复强调：富人对钱的态度是「清醒」而不是「随意」。穷人花现金因为「反正也不多」，富人用电子支付因为「我要知道每一分钱去哪了」。更微妙的一点——排队时翻找零钱的人，传递给他人的印象是「我连几元钱都紧张」，这在商务社交中是一种看不见的减分。"}, {"stem": "保险推销员坐在你对面的沙发上，面前摆着两份计划书。左边是定期保险：每年保费2万日元，保额3000万，保到60岁。右边是终身保险：每年保费12万日元，保额一样，但「终身保障+储蓄功能，60岁以后还能返钱，等于白送保障」。推销员笑得很真诚。你翻到了最后一页的退保现金价值表，低头用计算器按了两分钟。然后你做了富人一定会做的选择。", "options": ["A. 终身保险——保障加储蓄一步到位，老了还能拿回来，怎么看都是白送的保障保险公司的精算师永远比你更懂账本——终身险是他们最挣钱的产品", "B. 全不买——自己每月存一笔当应急金，不给保险公司赚管理费自存应急金=把专业财务规划外包给了连记账都坚持不下来的自己", "C. 各买一半——既有定期低保费又有终身储蓄功能，哪边都不偏废折中买保险≈「两边都能接受」，翻译过来是两边都没为你做到最好", "D. 定期保险——把保障和投资拆开，省下的保费自己去投，收益率远高于终身险退回来的钱。"], "type": "choice", "answer": 3, "explain": "田口智隆说的核心原则：不要把一个工具当两个用。终身保险把「保障」和「储蓄」绑在一起，结果是保障不够便宜，储蓄不够高回报。富人把这两件事拆开——买最便宜的纯保障（定期保险），剩下的钱自己去投资。推销员力推终身保险是因为佣金是定期的好几倍——他笑那么甜是有原因的。"}, {"stem": "你孩子五岁。太太说：「该报个英语班了，一年20万日元，班上有他三个幼儿园同学。」你妈说：「钢琴也报上吧，女孩子的气质从小抓起。」你爸说：「我刚看到学区房价格又涨了，再不换就来不及了。」你翻着报名表，突然想起田口智隆说家长们最爱犯的一个错——给孩子的教育砸钱，砸的方向全偏了。偏在哪？", "options": ["A. 英语班优先——全球化时代语言第一位，等长大了再补语言关就晚了，时间窗口很重要一年20万的课程≈一套完整教材的钱，教材能重复看，课堂只能跟进度", "B. 先教管钱——教小孩怎么分配零花钱、记流水账。这本事学校不教父母也不教，长大后他们得花20年重新学", "C. 全不报班——小孩就该尽情玩，过早卷培训班可能把好奇心和创造力都扼杀在摇篮里不报班不等于不管，而是提醒你问自己：我愿意每周花多少时间亲自带娃", "D. 试听再决定——英语和钢琴各报一期，看看孩子对哪个有天然的倾向试听课后孩子说都喜欢——因为每节课都有糖果和贴纸，别被甜蜜收买了"], "type": "choice", "answer": 1, "explain": "田口智隆的痛点一击中的：我们花十几年学数学英语，但没人教过你怎么管理一笔钱。富人的孩子从小听爸妈讨论投资、看爸妈记账、参与家庭财务决策。这不是天赋——是环境。而普通家庭把「教育」等同于「报班」，却从来不教那个决定他们一生财务状况的底层技能。"}, {"stem": "你刚跟朋友聊到上次旅行的旅馆，他第一反应脱口而出：「多少钱一晚？」你愣了一下——不是问他环境好不好、服务怎么样、温泉是真温泉还是烧开水，而是问价钱。田口智隆见过太多这样的人了。他说看一个人能不能变有钱，不用看他的存折余额，听他接到推荐时的第一反应就够了。这句话什么意思？", "options": ["A. 先问价格合理——消费前不问价怎么判断值不值得？价格是决策的第一步价格是第一条光谱，但一条光谱照不出一个完整的假期", "B. 先问回头率——一个地方好不好，看多少人愿意反复去，复购率是硬指标复购率高说明这个店不踩雷，但也许这次旅行你正想踩一踩新雷", "C. 先搜网评——群众的眼睛最雪亮，看住过的人怎么说比一个人的推荐更可靠大众评价=中庸之道，有惊喜有坑的地方往往评分忽上忽下", "D. 但富人先问「值不值」，最后才问「多少钱」——顺序反了，你所有决策都先用价格在做过滤。"], "type": "choice", "answer": 3, "explain": "田口智隆说富人有一套「价值优先」的判断顺序：1）这东西好不好？2）对我有没有用？3）我需不需要？——这三个问题全部通过之后，第四个问题才是：4）多少钱？而穷人会把第四个问题提到第一个来回答，然后用「太贵了吧」把前三个问题全部跳过。一辈子都在用价格过滤世界，从没打开过价值那扇门。"}, {"stem": "你跟另一半正在为「谁管钱」冷战。她说：「我每个月给你发零花钱，剩下的我来管。」你说：「各管各的，自由。」你一个已经财务自由的师兄听完了你俩的对话，说了一句让人不太舒服但是对的话。他说了什么？", "options": ["A. 老婆管钱——女人心细不会漏账，家里一本账最清楚，省得两个人管出矛盾记账员不等于CFO，清楚的账本挡不住糊涂的投资决策", "B. 各管各的互不干涉——钱是自己的事，谁也不管谁最省摩擦，表面上看这似乎是最符合常理的做法互不干涉到年底一个人发现花了三倍预算，另一个人才发现管家的活有多累", "C. 各自管但定期对账——「发零花钱」模式把一方变员工一方变老板。两个人都对财务走向有掌控，才是合伙经营这个家。", "D. 请家庭理财顾问——第三方最客观公正，有争议时也比夫妻吵架强顾问再专业，他要知道你家的真实财务状况也得靠你每周老实交代"], "type": "choice", "answer": 2, "explain": "田口智隆见过太多「发零花钱」模式的家庭——它在心理层面制造了一种微妙的失衡：一方觉得自己在「领工资」，另一方觉得在「管下属」。久而久之，领钱的那个人对家庭财务完全丧失了主动权和关注力。而富人家庭大多采用「双人驾驶」模式——两个人都盯着仪表盘，谁也不会睡着。"}, {"stem": "晚上十点半，你在加班。手机震了一下，是老婆发来的链接——一个「30天副业小白月入10万」的训练营，学费3万日元。你看了一眼日历：这个月已经买了两个课程了，一个做跨境电商的，一个学视频剪辑的，都还没打开过。你揉揉眼睛，想起田口智隆说的一个扎心的事实：想增加收入这件事，大部分人选的路恰好是堵死的那条。堵在哪？", "options": ["A. 准时下班深耕副业——加班是在建别人的资产。你订十个课程一个没学，不是缺知识是缺执行。", "B. 加班拼晋升——副总位置快空出来了，这时候表现好年底就能坐上，翻倍薪水值得熬把未来押在老板办公室的椅子底下，那个椅子的轮子是可能朝你碾过来的", "C. 两边同时搞——累就累点，两条腿走路哪边先通就先走哪边两边搞半天你既当不上副总也辞不掉副业，最后变成了在两头打酱油", "D. 辞职全职干——业余时间做不出深度，不如破釜沉舟赌一把辞职赌一把的前提是你已经用业余时间的验证跑通了至少四五个月"], "type": "choice", "answer": 0, "explain": "田口智隆在这道题里打了一个巴掌给一颗糖。巴掌是：你报课不学，买的不是知识，是「我已经在努力了」的幻觉。糖是：准时下班找一个方向深耕的人，比加班攒晋升积分的人更有出路——因为前者在建造自己的资产，后者在建造别人的资产。方向对，笨功夫值钱；方向错，忙是白费。"}, {"stem": "聚餐，有人说了句：「有钱也未必幸福啊，你看那个谁谁谁，那么有钱还不是离婚了。」桌上好几个人点头附和。你旁边的财务顾问K先生，从包里拿出一支5万日元的万宝龙笔，在纸巾上写了两个数字：3000和0。他说：「我访谈过3000个富人，至今没遇到一个说『真后悔变有钱了』的。」然后他解释了说「有钱未必幸福」这句话的人，到底是什么心态。", "options": ["A. 他说得对——钱确实不是幸福全部，有钱了照样抑郁离婚的案例比比皆是新闻媒体报道的「有钱人离婚」跟「普通人离婚」的关键差在报道想不想播", "B. 他身边有反例——肯定认识有钱但不幸福的人，所以才这么笃定，表面上看这似乎是最符合常理的做法用一个个例来反驳一个趋势=统计里的逆向认知偏见翻了一个面", "C. 个人价值观问题——有人要钱有人要闲有人要陪伴，每个人的幸福配方不一样用价值辩论回避实际议题，是餐桌上最舒服也最不值钱的口水", "D. 穷人的自我安慰——潜台词是「反正我也变不了有钱，先说服自己钱没用」。真有3000万存款的人没有一个会退回去。"], "type": "choice", "answer": 3, "explain": "田口智隆对这个句式毫不留情：承认吧，你不是在讨论哲学——你是在给自己一个不下场的理由。访谈3000个富人之后，他最深的感受之一是：大多数「反金钱」的论调，来自对变有钱这件事完全没有信心的人。真正有钱的人反而不说这话——因为他们的烦恼跟钱无关，但他们的选择自由，全是钱给的。"}, {"stem": "你在车展上看到一块劳力士绿水鬼，标价120万日元。你刚入职做销售才半年，月薪税后25万，但你已经在心里把「买了这块表之后客户更信任我、签单率提升30%、半年回本」的账算好了。你甚至跟银行打电话问了消费贷利率。这时候田口智隆会按住你的手，然后讲一个你不太想听的故事。", "options": ["A. 买——销售行业，你的形象就是第一份信用背书，一块好表能让客户多看你一眼客户不会拍着劳力士说「就因为你戴这个表我才签合同」", "B. 买二手的——中古店能省一半，品相好的戴上谁也看不出来新旧二手品省一半钱，修一次把省的吐回去一半——然后你再修一次", "C. 先别买——等一个月收入就能买下它的时候戴着，它是奖章。现在贷款买，每次看表先看到的是催款通知", "D. 买精工就够了——5万日元功能一样精准，多花100万只买了个logo平价替代品能跑准时间，但戴着它你的心里已经有了一只原版"], "type": "choice", "answer": 2, "explain": "田口智隆自己年轻时就是反面教材——28岁，欠债500万日元，赛马、老虎机、名牌，全沾了。他最清楚那种「买了这个东西我就会变好」的幻觉。富人的法则是：先让能力配得上装备，再让装备配得上你。用月薪25万的收入去贷款买120万的表，你不是在投资形象——你是在制造每个月底看到账单时的窒息感。"}, {"stem": "你在行业交流会上认识了一个做不动产的前辈。一周后他主动给你发消息，推荐了一个小项目。两个月后他又给你打了电话：「你上次提到的那本会计书，我买来看了，特别好，谢了。」你挂了电话突然意识到一件事：不是你运气好遇到了贵人——是你做的某一件不起眼的小事，触发了这个循环。是什么？", "options": ["A. 你面善交流会上认识一周就推项目给你=他在你身上试自己的销售转化率", "B. 你会回报——哪怕只是「你推荐那本书我去看了特别好」一句话。", "C. 你专业能力强——对方在你身上看到了潜力，提前投一笔关系光研究不出手=在旱地上学游泳学到第六年", "D. 你那天穿搭到位小钱试试看≈用小钱养了一个大幻想，而这个幻想最耗你的精力"], "type": "choice", "answer": 1, "explain": "田口智隆的结论很朴素：人和人之间的合作循环，是靠「回报」这个动作来延续的。很多人觉得：「人家帮我一次，又不缺我的回报。」然后这条线就断了。相反，那些不断被介绍机会的人，都有一个共同习惯——哪怕只是「谢谢你上次推荐的餐厅，我去吃了，超棒」这种一句话，都会发。正是这种动作，让他们的社交网络一直处于活跃状态。"}, {"stem": "政府宣布消费税从8%涨到10%。新闻弹窗刚出来，你身边的同事群里一片哀嚎：「活不下去了」「工资不涨只涨税」。但你注意到部门里最有钱的那个老张只是在微笑，然后默默打开了某张电子表格。他到底在看什么？", "options": ["A. 抱怨两句然后照样过日子——该买还得买，税涨了就从别的地方省回来抱怨完不行动=「等明年我就开始健身」，效果等同于零", "B. 研究受益股——消费税涨对零售利好，提前布好局能把多交的赚回来财政政策利好哪个板块不是一条新闻能给出答案的", "C. 打开账本找优化——别人哀嚎的时候他在算：哪些支出可以砍，省下的全投进资产。", "D. 趁涨税前去囤货——把接下来半年的大件消费全提前办了，直接硬省囤货省下的钱有一半会在保质期前被你自己扔进垃圾桶"], "type": "choice", "answer": 2, "explain": "田口智隆在书中讲了一个简单但有力的对比：听到消费税上涨，穷人哀叹「日子不好过了」然后继续原来的生活；富人第一时间打开账本，找对应的优化空间。抱怨不产生任何东西——但调整消费结构、提高储蓄投资比率，这些动作会产生复利。同样的外部冲击，有人被冲击撞飞，有人拿冲击当信号重新校准。"}, {"stem": "你站在一家文具店，左边是手写的A5笔记本（皮面，1500日元），右边是手机App里的日历（免费，带云同步）。田口智隆的眼睛在你背后盯着，他知道你要选什么——也知道你的选择直接暴露了你对时间的态度。你选了哪个，才算走在富人的路上？", "options": ["A. 手机App——免费还能云同步，任何设备都能看，设置提醒功能不会漏任何一件事手机日历防不了的是你连解锁屏幕都懒得点的那一瞬间", "B. 两个都用——手机设提醒加闹钟，笔记本做规划和复盘，各取所长维护两个系统≈你跟自己开了两张时间账单，回头对账的时候谁都说不清", "C. 手写笔记本——App只花0.3秒点关闭。手写让你被迫停留30秒，想「这事值不值得记」。", "D. 什么都不用——靠脑子记最牢固，工具越多人脑越懒靠脑子记的前提是你的脑子没有同时被35个其他事项占据"], "type": "choice", "answer": 2, "explain": "田口智隆访谈的富人里，手写日程本几乎是标配。不是因为老派——是因为一个你不得不面对的事实：打开手机App你只花了0.3秒就关闭了，用手写你被迫停留30秒。这30秒里你会想「这事值不值得写进去」「这周还有什么」。手写的作用不是记录，是筛选。"}, {"stem": "下雨了，下一站就到了，只有800多米。你可以打车（起步价730日元，2分钟到），也可以走路（大约8分钟，但鞋会湿）。田口智隆追问的不是「花不花得起730日元」——他在看另一个东西，一个绝大多数人注意不到的细节。你在看他看你什么？", "options": ["A. 走路——顺便呼吸新鲜空气，省下的730日元还能买杯咖啡，一举多得省下起步价等15分钟走800米，你这是在用健身房的配速去赶商务会议", "B. 打车——湿着鞋进办公室，你需要15分钟才能找回舒服的状态，还要在同事面前调整。这8分钟花730日元。", "C. 坐一站地铁——105日元最快最不湿鞋，不用纠结值不值的问题地铁+步行=两段不可控时间，而会议室的椅子已经空空在等", "D. 看心情——下雨天打车，晴天走路，随性而为不把自己逼太紧看心情=把自己交给天气预报，但天气不是你的项目经理"], "type": "choice", "answer": 1, "explain": "田口智隆用这道题击碎了「富人很抠」的刻板印象。穷人以为富人在每一分钱上都精打细算——恰好相反。富人在「值得」的地方毫不犹豫。湿着鞋进公司，你需要15分钟恢复状态，你的第一印象分在悄悄往下掉。这8分钟x730日元是一个超高回报率的投资——问题是大部分人在付款的那一瞬间只看到了730日元。"}, {"stem": "你在钱包柜台前。左边是短钱包（折叠式，塞满鼓得像个小炸弹），右边是长钱包（展开式，钞票平放不用折）。田口智隆看到你用的那个鼓鼓囊囊的短钱包，就会知道他面前这个人离财务自由还有多远。为什么一个钱包能暴露这么多？", "options": ["A. 短钱包——装裤兜里就走，紧凑方便，日本就是崇尚小而美的民族鼓得像炸弹的钱包炸掉的是你在收银台前面翻找时所有人的耐心", "B. 长钱包防盗——放西装内袋不容易被掏，安全感也是品质生活的基础防不防盗和有没有气场，两件事之间横着「你的钱包到底塞了啥」", "C. 长钱包——把钱平放不折皱，掏出来的时候是平整的。就这一秒的体面会让你花钱时多犹豫一下，一年的差距就是从这一秒开始的。", "D. 长钱包可放名片——商务场合一掏出来就有型，短钱包掏出来像刚毕业能放名片=乍一看像老板——拉开拉链发现全是过期收据的那一瞬间原形毕露"], "type": "choice", "answer": 2, "explain": "田口智隆说这是他给6000多个受金钱困扰的人做讲座之后，最笃定的一个观点之一。不是风水，是行为心理学：一张被折得皱巴巴的钱，你在花的时候没有任何心疼；一张平整如新的钱，你会犹豫一下。就这一下犹豫，够你在那一天少买一杯没必要的咖啡。一两个不起眼的犹豫，一年差距就拉开了。长钱包不只是钱包——是你的财务行为微调器。"}, {"stem": "你的钱包里躺着几张信用卡——问题是你真的需要它们吗？田口智隆问你这个问题的时候，不是在建议你从五张减到三张这么简单的数学题。他问的是你对待「借钱」这件事的整个心态。正确的答案是怎样的？", "options": ["A. 多办几张——不同卡不同积分策略，餐饮一张出行一张网购一张，羊毛最大化多张卡=多个还款日，忘一个=信用卡公司教你什么叫「年化18%」", "B. 两张——主卡加备用，一张出了问题马上有另一张顶着，表面上看这似乎是最符合常理的做法主卡+备用=两边的积分都落在「差点就能换」的尴尬位置", "C. 一张不要——全部储蓄卡，花自己已有的钱才最心安理得，表面上看这似乎是最符合常理的做法一辈子不用信用卡=一辈子不建信用记录，亏掉的是未来贷款的无形折扣", "D. 最多一张——每多一张就是多一条告诉你「下个月再还也行」的岔路。把它当支付工具而不是信用工具，刷多少当月全部还清。"], "type": "choice", "answer": 3, "explain": "田口智隆自己是欠债500万日元爬出来的人——他最清楚信用卡分期的陷阱。一张卡的月还款看起来不多，但三张叠在一起，「下个月再还」就变成了默认选项。而他认识的富人几乎都有一条铁律：刷多少，当月全额还清。分期不是「缓解压力」——是把压力打包好、加点利息、递到你下个月的自己手里。"}, {"stem": "书店，你在两本书之间犹豫。左边是你喜欢的推理小说，600日元；右边是一本不认识的商业书，1800日元——封面上印着「畅销50万册」，但你翻了几页觉得有点枯燥。田口智隆说你面前这个选择题，判断了你的信息摄入系统是在「喂养自己」还是在「取悦自己」。富人选哪边？", "options": ["A. 买推理小说——读书就选自己喜欢的，硬啃不感兴趣的书效率低下还坚持不了——买一本侦探小说和买一本商业书之间最大的差异不是价格差，是打开后你脑子里的画面完全不一样", "B. 书店里翻完不买——把商业书速读完知识到手，再花钱买小说回家享受——日式节俭帮你省到最后，发现最需要省的是思维模式", "C. 只买商业书——既然是自我投资的时间，就不该花在任何不能增值的阅读上——把日本式的精打细算当成信仰，但真正的学问在算盘之外", "D. 两本都买——只看喜欢的东西，你一辈子在同一条回声通道里转。畅销书代表着一种你没见过的视角，先知道世界上有人在那样想。"], "type": "choice", "answer": 3, "explain": "田口智隆的观察一针见血：穷人的书架摆满了他们已经喜欢的东西，富人的书架上一半是他们「应该看但不想看」的东西。这不是在说小说不好——是在说：如果你从不主动接触令你不舒服的信息，你的认知框架永远不会变化。而你的收入增长速度，永远追不上你的认知增长速度——从来没反过来的。"}, {"stem": "早上一睁眼，你拿起手机刷了15分钟新闻——头条是昨天的交通事故死了三个人，然后是明星离婚、某公司股价闪崩、天气预报说明天有台风。你放下手机开始洗漱——这时你脑子里全是刚才那场车祸的画面。田口智隆说你看新闻的方式，决定了你一天的注意力质量。富人和普通人的信息摄入方式，差在哪一个关键点上？", "options": ["A. 富人有助理筛信息——有助理筛信息很爽，但等你做到那水平你先得学会在噪音中自己提取信号", "B. 富人先运动再看——运动完心情好是事实，但天天运动完读负面新闻≈你花钱给自己买了把焦虑喷头", "C. 富人基本不看新闻——付费的信息确实好，但买单的人没有告诉你他付的是多少试错成本换来的", "D. 富人第一问永远是「这跟我今天有关系吗」——没关系的直接跳过。"], "type": "choice", "answer": 3, "explain": "田口智隆在「收集信息」这道题里点出了一个很少有人注意的事实：信息时代最稀缺的能力不是接收信息的速度，而是过滤信息的速度。穷人在交通事故新闻上投入了三分钟真实的情绪，然后一整天散发出的微妙的负面状态影响了两次谈判、一次报价。这三分钟的情绪成本，比任何手续费都贵得多。"}, {"stem": "你认识一个女企业家，年收入过亿，手机壳上镶满了水钻，花了2万日元。你在心里嘀咕了一句：「这也太浮夸了吧，2万日元能买三部Kindle了。」田口智隆听到这句话会反问你一个问题，让你立刻闭嘴。他问的是？", "options": ["A. 太浮夸了——用功能和价格去衡量一个表达自我的装饰品，跟用量尺去评价一首诗一样", "B. 换个角度看——她的手机壳是社交冰凿。陌生人一句「好闪」她就接住了话。", "C. 个人自由——别人花自己的钱想怎么花怎么花，轮不到我去评判——你可以不认同她的手机壳，但她赚到的每一个亿都不需要你的审美批准", "D. 她在补童年——小时候买不起的东西现在有财力了就要补回来——你站在自己的钱包里评判别人的钱包，这个角度的偏差天然存在"], "type": "choice", "answer": 1, "explain": "田口智隆的态度从不极端——他反对浪费，但他也反对「穷人用自己的省钱标准去批判富人的投资决策」。女企业家的水钻手机壳不是消费——它是社交润滑剂。你去衡量这个行为的时候，要从回报端看，不是从成本端看。你自己花了3万日元买过的一堆用不上的东西，那才叫浪费。区别在于：她的「看似浪费」有产出，你的「看起来不浪费」毫无产出。"}, {"stem": "你在新干线上，车突然停了——前方信号故障，预计延误60分钟。全车人叹气。你翻着手机日历：三小时后在大 个「我存到了10万」的小胜，你的大脑会释放多巴胺，会觉得自己能行。这种感觉比养老金计算器上的任何数字都更值钱——因为它是你持续行动的唯一燃料。"}, {"stem": "你今年有一笔50万日元的富余——投资自己（报个高阶技能认证课程）还是投资市场（买股票基金）？田口智隆在这个问题上有一票：他从自己欠债500万到财务自由的路径里，给了很明确的优先级。", "options": ["A. 先投自己——前提是这项技能能在一年内拉高你的年收入。你现在挣400万，花50万涨到600万——年回报率40%。", "B. 投资市场——用钱去赚钱早开始一分钟都是优势，被动收入上来了再去补技能50万放市场一年赚的可能刚够你请人吃几顿饭", "C. 各分一半——25万报技能课提升主业，25万进市场熟悉投资手感各分一半=两边都不够火候——学得半生不熟，投得小心翼翼", "D. 算清楚回报再定——对比课程涨价潜力和当前大盘估值，选高的那个算清ROI再决策——但人的变数不是任何一张表格能捕获的"], "type": "choice", "answer": 0, "explain": "田口智隆从泥潭里爬出来的路径就是这句话的注脚。他28岁负债500万，靠什么翻盘？不是投资——那时候他连本金都没有。他靠的是提升自己：扩展人脉、学习新技能、进入收入更高的领域。等到本金积累到一定量级，市场投资才开始有意义。本金不够的时候，最好的杠杆是你自己。"}, {"stem": "周五傍晚你收到两条微信。一条是同行群里的@所有人：「周六晚六点银座居酒屋，AA制，来喝酒！」另一条是你上个月认识的一个创业者单独发的：「老张这周六晚有个餐会，四五个做贸易的朋友，想介绍你们认识。」田口智隆问你：你觉得哪个对你的未来更有用？", "options": ["A. 去小型私局——二十人的桌子上你只是其中一杯酒。三五人深聊一晚，建立的联系比一百人面前转一圈更牢固。", "B. 去大群聚餐——人多信息量大范围广，你永远算不准哪个路人会成为你的贵人大群里信息密度跟参加人数成反比，真正关键的事都是小窗说的", "C. 两个都去——先去大群混个脸熟再去小局深度聊，两边便宜都不落下今晚你帮别人做了一次充场，自己的时间表被塞满了一整晚", "D. 看谁请——别人请的就去，AA的看当天心情，谁愿意投资你你就回馈谁看谁请客——你把人际关系变成了精密的收支流水，算得越细朋友越少"], "type": "choice", "answer": 0, "explain": "田口智隆在人际关系这一章里有一个观点贯穿始终：质量比数量重要一百倍。他认识的最成功的连接人，从不组织大型聚会——他们一次只介绍两个人给另一个人。原因很简单：深度的对话需要时间、安静的环境、和专注的注意力。大型AA聚餐里你的注意力被分割成十几份，每一份都是碎片——而碎片换不来信任。"}, {"stem": "你认识两个人——A君：计算机工程师，想找投资圈人脉；B君：做天使投资的，正在找一个能帮看技术的人。你手里同时有这两张牌。田口智隆说，就看你「怎么介绍」——这一手牌打得好不好，决定了你是「偶尔组局」还是「持续组局」的人。该打在什么时候、什么方式？", "options": ["A. 组个饭局——五六个人一起吃一顿，让A和B在轻松自然的氛围里认识起来，效率最高做牵线人你很善良，但牵完线后事态的发展你已经管不到了", "B. 先摸清需求再精准搭——分别问清楚他们真需要什么怕碰到什么样的人，用心把两边配对了再一条消息搭上线。", "C. 拉个微信群退群——高效的现代社交方式，剩下的让他们自己聊退了群=退出了后续——所有后续动作都在你不在场的地方发生", "D. 两边各夸——在A面前夸B靠谱，B面前说A沉稳，等人水到渠成了再捅破两边各夸=让别人对你的期待各加了一成，见面那天两成都可能落空"], "type": "choice", "answer": 1, "explain": "田口智隆说介绍人这件事是「社交领域的复利投资」。你每次认真介绍两个人——花时间了解双方需求、选对时机和场合——都在积累「这个人把别人当回事」的口碑。而那些拉群就退、敷衍了事的介绍方式，第一次看上去效率很高——但你不会有第二次了，因为没有人会再信任你的推荐。"}, {"stem": "你想推进一个重要的合作关系。合伙人说：「下周二晚上我请你吃一顿好的，边吃边聊。」你准备答应的时候突然想起田口智隆说的一句话：如果是富人来安排这顿饭，他几乎永远会选一个你没有想到的时间。什么时间？", "options": ["A. 晚餐——酒过三巡什么话都敢说，人是晚上的时候最放松最容易信任别人酒醒后再看昨晚的记录，通常你会删掉至少一半的「就这么定了」", "B. 午餐——90分钟天然边界让对话不拖沓。大脑在正午是最高效的时候，晚餐喝酒后聊的内容第二天你只记得一半。", "C. 早餐——能早起赴约的人已经在自律这件事上赢了全城的人——学校没教过，朋友圈天天在强化，所以你从来没怀疑过早起赴约的坚持让人敬佩，但敬佩不等于他的桌上有你想要的方案", "D. 下午茶——比午餐随意比晚餐清醒，完美踩在正式和轻松的分界线上下午茶=你坐在正式和暧味之间，哪边都不足够深入"], "type": "choice", "answer": 1, "explain": "田口智隆在所有受访的富人中发现了一个惊人一致的规律：他们的重要商务饭局几乎全部是午餐，不是晚餐。不是因为省钱——是因为效率。午餐的「天然时间边界」让对话不会无意义地拖长到三四个小时；清醒的头脑确保了讨论的质量；饭后各自回归工作，推进节奏不会被一顿饭打断一整天。90分钟的午餐>4小时的晚餐——前提是你讨论的是正事。"}, {"stem": "五个人走进一家餐厅。菜单翻开了，前四个人说：「我也来一样的。」剩下你一个人，菜单上有一道你看名字就想试的菜——是个冷门的日式煮鱼。你又瞄了一眼别人点的照烧鸡腿，看起来安全可靠。你翻来覆去，最后还是说了句：「我跟他们一样。」田口智隆听到这句话，会叹气。他叹什么？", "options": ["A. 跟别人点一样——商务餐最保险，吃太奇怪别人会多看你两眼，没必要找麻烦跟人点一样的你变成了一桌人里背景墙上的花纹——安全但留不下痕迹", "B. 点自己想要的——「我也一样」说的不是食物——是你在每一次选择面前默认找安全区。决策力是肌肉，从点菜开始练。", "C. 等别人点了参考——收集信息再做判断是理性策略，饭桌上不是秀个性的地方等别人先点=你把这一餐的节奏交给了可能根本不在乎吃什么的那个人", "D. 主动推荐一道——由我来做选择，既能打破僵局又能顺便展示一下主导力主动推荐=你在用一桌子人的味蕾赌你一个人的眼光"], "type": "choice", "answer": 1, "explain": "田口智隆在这道题里的切入角度特别巧妙——日常场景里藏着一个人做决策的底层模式。从众不是错——但当你发现自己在每一个小事上都本能说出「跟他们一样」的时候，你就该警觉了。决策能力是一种肌肉——你不练它，它就萎缩。先在点菜这件事上学会忠于自己的需求，然后才是合同、谈判、投资。"}, {"stem": "你收到了一个不算请求的请求——一个不熟的客户亲戚家的孩子，「希望能来公司实习一个月，你帮忙安排一下。」这件事不在你职责范围内，而且你知道这个孩子对你公司的业务完全没有帮助，甚至可能添乱。你脑海里已经浮现出接下来一个月各种麻烦的画面。但同时你又不想得罪那个客户。田口智隆直接给了答案——一个让你有点意外的答案。", "options": ["A. 学会漂亮地拒绝——解释清楚为什么不适合你，再指一个替代方向。强拉自己去帮不情愿的忙，后期全是互相消耗。", "B. 答应——多帮一次多开一条路，你不知道将来哪一天这人就会成为你的关键环每次答应都是一张口子，等口子大到关不住，你的善意已经变成了别人的导航", "C. 先答应再想办法退——面子先给足，如果实在搞不定再找个客观理由送走先答应再退=折磨翻倍——希望被你亲手搭好又亲手拆掉", "D. 冷处理——不回绝也不答应，拖得够久他自然去找别人，不失面子也不担责任冷处理=你做得聪明，对方感受得一清二楚——沉默是大路最响的喇叭"], "type": "choice", "answer": 0, "explain": "田口智隆在这里打了一个很多人不敢打的拳：学会拒绝比学会答应更能保护你的人际关系。答应一件你根本不想做的事，你接下来全程都在用敷衍的态度让它烂掉——最终的结局比一开始就拒绝更糟糕。重点是拒绝的方法——告诉对方为什么不适合、然后给一个建设性的替代方向。这样对方虽然被拒绝，但他知道你是认真思考过的——不是随便打发他的。"}, {"stem": "你到处在问「怎么才能赚到第一桶金」。书店里翻完了三十本成功学，YouTube上刷了几百个创业视频，你觉得你看得够多了。田口智隆把椅子拉近了一点，说出了他实现财务自由路上最不要脸但最有效的一个方法。这个方法，在知识付费时代非常反直觉。", "options": ["A. 模仿已验证的模式——找到一个成功的范本，把他每一步拆开复制。你做不到他100分但能做到50分，先活着再优化。", "B. 找到独特性做原创——复制别人永远只能跟在后面吃灰，创新才是真正的护城河真正的创新不在「不做别人做过的」，在乎把别人的路走到最极限再转一点弯", "C. 坚持自己的路——任何真正的成功都是靠自己一步步踩出来的，表面上看这似乎是最符合常理的做法坚持没错，错在分不清「这条路是我的」和「这条路是我唯一知道的」", "D. 多方向快速试——每个方向投三个月时间去验证，数据比直觉更诚实多方向试错=每个方向回头时你会发现付出的时间比以为的多"], "type": "choice", "answer": 0, "explain": "田口智隆在全书结尾端出了他最直白的方法论。他28岁负债500万的时候，跟自己说了一句话：「谁成功，我模仿谁。」他把成功的富人当成活样本——不是看他们的结果，是拆解他们每一步在做什么。然后照单全收地执行。这个方法既不酷也不性感——但它比90%的「原创」都要高效。因为大多数人所谓的「创新」，不过是在绕远路走到一个别人已经站在那的点上。先跟上，再超越。"}, {"stem": "最后一题。田口智隆在全书结语里抛了一个测试——你走进一个人的家，看到他的书架。哪一种人更有可能变有钱？这是全书浓缩到极点的一道题。", "options": ["A. 满墙商业书——勤奋好学是认知升级的唯一通道，知识量决定财富量全屋商业书=你的大脑被公司价值观远程占领了，下班后还在服职场役", "B. 空书架——不被书本框住的人直觉最准，实践出真知不需要纸上谈兵空书架=极简主义的最高境界连自己读过的那些字都减没了", "C. 满墙文学作品——小说能培养的同理心和叙事能力才是商业决策的底层操作系统文学作品有同理心没错，但一本烂小说花掉的时间跟你买了一本烂商业书一样", "D. 翻烂的薄薄几本——100本书在架子上只是装饰。你跟富人的差距不在读过多少本，在于用过多少条。"], "type": "choice", "answer": 3, "explain": "全书结语。田口智隆从负债500万到财务自由的人生归纳成一句话：不是你知道多少，是你用了多少。100本书在架子上只是装饰——但10本被你翻烂的书，是你真实走出来的路。测验的全部42道选择题，也都指向同一个东西：选择本身不会让你有钱——但每一次你用富人的方式去选，你就不再是原来那个你了。"}]};
quizData.swan = {"title": "黑天鹅", "questions": [{"stem": "你是一只火鸡。主人每天早上8点准时来喂食，已经喂了七百多天了。鸡棚里的老火鸡拍胸脯说：「放心，我活了三年，一天没断过。」你还挺得意地用数学算了一下：连续730天喂食，明天吃上饭的概率高达99.86%，模型回测全绿灯。然后第731天到了——12月第四个星期四的早上。门开了，走进来的人手里拿的不是谷物。你犯的错到底是什么？", "options": ["A. 我的概率没算对，应该多加几个小数点", "B. 我把「从来没发生过」当成「永远不会发生」了。真正要命的事，恰恰是你数据库里从来没有出现过的那件事——对火鸡叫感恩节，对银行叫2008年，对泰坦尼克号船长叫冰山", "C. 我应该在700天的时候就跑，规律超过700天都不靠谱", "D. 我应该去收集全国所有火鸡的数据，看看别的农场有没有感恩节屠杀的先例"], "type": "choice", "answer": 1, "explain": "这是全书最有名的比喻。火鸡的数据量够大了——730天。但它的问题不是数据不够，而是它以为没发生过的事就不会发生。塔勒布引用了哲学家波普尔的一句话：1000天的平安证明不了什么，但第1001天的灾难可以推翻一切。你越觉得安全的时候，往往最危险——因为你的警觉全卸掉了。"}, {"stem": "1941年，一个犹太小男孩在黎巴嫩的战火中看着自己的家被炸成废墟。几十年后他跑到华尔街做交易员，在1987年股灾那天赚够了钱，提前退休，坐在曼哈顿的公寓里写了一本书。书的开头就问读者一个很损的问题——你去书店翻那些成功CEO的自传，看完觉得自己学到了「成功的秘诀」。他真的学到了吗？来，做个思想实验。", "options": ["A. 自传太美化了，CEO们只讲好听的，把失败的经历都跳过去了", "B. 你看到的只是活下来的人。那些做了完全相同的事、但失败了的人——他们的故事烂在坟里了，从来没人去采访他们。书店的书架上全是幸存者，所以你误以为成功的路是清晰的——其实你连那些死在半路上的人长什么样都不知道", "C. 自传应该找第三方记者写，当事人写的东西太主观", "D. 成功经验没普适性，因为每个人的运气成分差太远了"], "type": "choice", "answer": 1, "explain": "沉默的证据。2000年前古罗马有个叫西塞罗的人讲过一个故事：有人拿一幅画给一个不信神的人看，画上是一群遇海难时祈祷然后活下来的人。说：你看，祈祷有用。不信神的人问了一句：「那些祈祷了但还是淹死的人，画像在哪？」那些死掉的人开不了口，能从海底爬出来到处宣讲的人不存在。书店的畅销书架，就是那幅只画了幸存者的画。"}, {"stem": "你在拉斯维加斯，已经连赢了20把。旁边的人全围过来了，有人叫你「黄金之手」，有人给你买酒。你也有点飘了——连赢20把的概率，百万分之一啊。这时候塔勒布走到你旁边，在你耳朵边上说了一句话，你听完就笑不出来了。", "options": ["A. 「你应该现在就走，赌场的游戏长期期望值是负的」", "B. 「你让100万只猴子每只抛20次硬币，总会有一只连抛20次正面。那只猴子此刻正觉得自己是天才，另外999999只猴子已经默默走了——你不会在任何新闻里看到它们。你觉得你现在像不像那只猴子？」", "C. 「你的策略确实有效，这时候应该加倍下注」", "D. 「连赢20把不算什么，真正的高手能连赢50把」"], "type": "choice", "answer": 1, "explain": "沉默的证据的又一个版本。有基金连续十年跑赢大盘？有创业者连续三次上市？在足够大的样本里，纯靠运气也会有人连续表现惊人。问题不是这些人是不是真的有本事——问题是那些同样水平但运气不好的人，你一个名字也说不出来。赌场里走运的新手继续赌，觉得自己是天才；不走运的人悄悄走了，再也没人见过他们。媒体只报道活下来的那个。"}, {"stem": "你半夜接到好朋友的电话，他的声音在发抖：「我把全部积蓄放进了一个对冲基金，叫长期资本管理公司。他们的团队里有俩诺贝尔经济学奖得主！他们用的数学模型说，亏10%以上的概率是宇宙年龄的好几倍分之一——根本不可能亏！」你听了后背发凉，因为你记得塔勒布管这套模型叫一个什么来着。", "options": ["A. 「伟大的对称原理」——因为市场涨跌是对称的嘛", "B. 「智力大骗局」。这种模型（钟形曲线）假设极端事件概率小到不用理它。但现实里，极端事件不仅会发生，而且它决定了一切。长期资本管理公司在1998年一夜之间亏了40亿美元，用的就是这批诺贝尔奖得主建的模型。美联储不得不出手救，不然全球金融系统就崩了", "C. 「市场的随机游走模型」——你应该用布朗运动来替代", "D. 「模型风险」——问题在于他们用了正态分布，换成t分布就能躲开1998年那场灾难"], "type": "choice", "answer": 1, "explain": "第十五章的标题就叫「钟形曲线——智力大骗局」。默顿和斯科尔斯——两个诺贝尔奖得主——建的长期资本管理公司，用世界上最精美的高斯模型，算出来风险小到天文数字级别的概率。然后1998年俄罗斯违约——模型里「绝对不可能发生」的事发生了，一夜没了40亿。"}, {"stem": "你在埃及沙漠里参加考古队的挖掘。半夜三点，你的同事举着一块刚出土的石碑兴奋地叫起来——上面刻着三种文字，完美印证了他关于亚历山大某个战役日期的推论。全队都嗨了。你站在旁边，点了根烟，慢悠悠说了一句话，让所有人都安静了。", "options": ["A. 「这石碑的年代需要做碳14定年，不能只看上面的文字就下结论」", "B. 「这块石碑能活下来纯属运气。这片沙漠里的古城，每一座都在石头上刻东西——99%的石碑早就风化、碎裂、被人砸碎盖房子了。我们能看到的只是刚好没碎的那1%。你基于这1%的幸存者构建了整部历史——但你怎么知道你漏掉的那99%说了什么？」", "C. 「古代人喜欢在碑文上夸大事实，不能全信」", "D. 「你应该对比其他出土的文献交叉验证，单凭一块石碑没有说服力」"], "type": "choice", "answer": 1, "explain": "沉默的证据不光适用于人，也适用于物体。你能在博物馆看到的东西，都是「幸存者」——没被打碎、没被熔掉、没被地震埋掉的。你基于这些幸存者构建的历史，怎么说都像是完整的——但其实你看到的只是幸存者的故事。那些碎掉的东西可能在对你喊：「你错啦！」——但你已经听不见了。"}, {"stem": "1960年代的巴黎，一个叫珍妮的女人坐在咖啡馆里等了三个小时。约好的出版商没来。这是她收到的第23封退稿信。她的手稿把神经科学、哲学、自传小说全揉在一起——编辑们连「这是虚构还是非虚构」都回答不了。五年之后，这本书卖了上千万册，被翻译成40种语言。塔勒布讲这个故事不是为了鼓励你「坚持就是胜利」。他要说的是完全不同的一件事。", "options": ["A. 有才华早晚会被发现——珍妮的故事就是最好的例子", "B. 出版业是个典型的极端斯坦——一本超级畅销书能吞掉整个市场，但它在爆火之前，没有一个专家能提前把它从稿堆里认出来。所有编辑都在装模作样地「预测」，但其实预测准确率和瞎蒙没区别。更要命的是——他们会自动忘掉自己拒绝过的那些后来大卖的书，只记得偶尔蒙对的那一次，然后告诉自己：「我是专业的」", "C. 编辑没有神经科学背景，看不懂这种跨学科的好东西", "D. 珍妮刚好碰到了一个能理解她的编辑——说明人脉比书的质量重要"], "type": "choice", "answer": 1, "explain": "第二章的核心故事。珍妮（叶夫根尼娅）的书稿被几十个编辑拒绝，五年后它就是一只出版业的黑天鹅——没人预测到、影响力极其巨大、事后每个人都觉得自己「其实早就看出来了」。塔勒布的结论很残酷：在极端斯坦的领域里，重大的成功几乎从来不可预测。事后诸葛亮式的解释，都是人类事后自己编来提高自信的故事。"}, {"stem": "你参加了一场晚宴，桌上坐了一个物理学家和一个经济学家。物理学家说：「人类体重平均70公斤，标准差15，出现一个4900公斤的人的概率，得在3后面写几百个零——宇宙从诞生到现在的时间都不够用。」经济学家点头：「没错，同样的道理，出现一个身价800亿美元的人的概率也差不多是零。」塔勒布放下酒杯，笑了。他在笑什么？", "options": ["A. 这两个人的数学都不及格，概率不能这么类比", "B. 经济学家犯了一个致命的错误：体重是「平均斯坦」——你把地球上最重的人塞进1000个人的样本里，他占总重量的0.6%，掀不起浪。但你把比尔盖茨塞进1000个人的样本里，他的钱占总额的99.9%，其他人全是零头。财富是「极端斯坦」——极端值不是例外，极端值就是一切", "C. 经济学家把均值算错了，应该用中位数而不是均值", "D. 财富的极端值是制度问题，靠税收就能把它拉回正常范围"], "type": "choice", "answer": 1, "explain": "全书最核心的二分法。体重、身高、每天吃多少卡路里——这些属于平均斯坦，一个异常值改变不了什么。财富、书的销量、城市人口、股市涨跌——这些属于极端斯坦，一个异常值吞掉全部。你把平均斯坦的数学工具（钟形曲线、高斯分布）套在极端斯坦上，你就会算出「百年一遇崩盘的概率接近于零」——然后在1987年或者2008年被现实一巴掌扇醒。"}, {"stem": "你是出版社的资深编辑，老板让你预测下一季的畅销书。你画了一堆图表——作者的学术背景分析、目标读者画像、过往三年同类书的销量曲线——觉得自己在用科学做预测。塔勒布看了你的报告，在上面画了一个巨大的红叉，然后让你做一件事，做完之后你自己就脸红了。", "options": ["A. 「你读过最近十年最畅销的书吗？你知道它们在被出版之前，有多少个编辑拒绝过？」", "B. 「把你过去十年做过的每一次预测全部翻出来——不准删掉猜错的那些。你猜对了几次？是不是跟扔骰子差不多？但你的大脑会自动忘掉那些让你丢脸的预测，然后放大偶尔蒙对的那一次——然后你就真的相信自己有预测能力了。这叫自欺欺人」", "C. 「你的模型漏了社交媒体的影响因子，把Twitter话题热度加进去就好了」", "D. 「你应该把线性回归换成随机森林，机器学习比你手画的图表靠谱得多」"], "type": "choice", "answer": 1, "explain": "预测之耻。塔勒布说他这辈子没见过一个敢把预测记录全部摊开来的专家——不是找借口不摊，而是他们的大脑自己就把那些失败的预测删掉了。这是一种人类自带的bug：每次预测错误后，我们的记忆会自动修改当初的预测，让自己觉得「其实我当时也没那么确定」。再过几年，你可能连自己预测过这件事都忘了。"}, {"stem": "1914年6月28日，萨拉热窝。一个塞尔维亚青年枪杀了奥匈帝国的皇储。一周之内，欧洲全部大国卷进了战争，四年后900万人死了，四个帝国崩溃了。战后，历史学家写了一篇雄文：「一战的爆发是必然的——帝国主义的矛盾、军备竞赛、同盟体系的锁定……一切在1914年之前就注定了。」塔勒布合上这本书，说这位历史学家撒了所有谎里最不要脸的一个。什么谎？", "options": ["A. 历史学家忽略了刺杀者的个人能动性——如果没有那个刺客，一战就不会发生", "B. 这是「马后炮」的极致：一战爆发之前，整个欧洲沉浸在将近100年的和平里，最顶尖的知识分子都在写「人类文明已经超越了战争」。一战真的发生了之后，历史学家跑回去到处找「原因」，找出了一大堆，然后说「你看，都是必然的」——但如果一战没发生呢？他们同样能回头找100个「和平是必然的」的理由。人类的这种能力，叫事后合理化", "C. 历史学家的分析忽略了经济因素在战争中的作用", "D. 同盟体系根本不是战争的原因，是造出来背锅的——真正的责任在英国"], "type": "choice", "answer": 1, "explain": "叙述谬误。1910年，有个经济学家写了一本全球畅销书，论证「战争在经济上不理性，所以不可能发生」。大家都信了。四年后一战来了。战后历史学家做的事情很搞笑：回头去找原因，拼成一个完整的故事，然后说「早就注定了」。但如果你倒过来想——如果一战没发生呢？他们同样能找到100个理由来证明「和平是必然的」。历史是一台往后看的机器，不是往前看的望远镜。"}, {"stem": "你开车在沙漠里迷路了。油箱马上见底，手机没信号。你把一张十年前出版的1:100000比例尺的地图铺在引擎盖上——上面有一条虚线标着「季节性河流」，沿河应该有个绿洲。你趴在上面算了一个小时：距离、方向、预计到达时间，精确到小数点后两位。然后你照着地图的方向开了过去。两天后搜救队找到了你的尸体，你手里还紧紧攥着那张地图。你临死前犯的最后一个错误是什么？", "options": ["A. 没带GPS，纸质地图不行", "B. 你把这幅地图的「精度」当成了它的「准确度」。地图上的每个坐标都精确得吓人——但这只让你那个虚假的模型看起来更专业了。那个所谓的「绿洲」可能40年前就干了，那条「河流」根本就不存在。而你对模型精致程度的迷恋，让你忘了问一个最基本的问题——这张地图画的到底是不是真的", "C. 「我应该多带几桶水，找不到绿洲也能撑到救援」", "D. 「出发前应该问当地向导——本地人的经验比任何地图都靠谱」"], "type": "choice", "answer": 1, "explain": "塔勒布对着华尔街那些风险模型师的嘲讽。他们的VaR模型算到小数点后六位——「明天亏了超过X百万的概率是0.000017%」——精准到让你有安全感。但这些精度全都是虚假的：它假设世界按钟形曲线运行，不会出现胖尾。地图画得再好看，画的是一个不存在的绿洲，精度越高你死得越快。你需要的不是更准的预测——你需要意识到你的预测本身就是个骗局。"}, {"stem": "你大学室友跑来拉投资：「哥们，我的商业计划书写了180页！未来五年的现金流预测我精确到了角！市场调研显示87%的客户会买！模型显示三年内市场份额第一名概率94%！就差200万启动资金！」你一边翻他打印得像麦肯锡报告一样的计划书，一边想起塔勒布说过创业最讽刺的真相。你决定不投。为什么？", "options": ["A. 94%的成功率明显夸大了，80%以下才能考虑", "B. 几乎所有真正改变世界的公司——苹果、Google、星巴克——它们最后做出来的东西跟最初的商业计划书完全是两码事。一份精致到过分详细的计划书，不是在证明你有远见——它恰恰暴露了你对未来的恐惧：你试图用Excel表格来驱散不确定性，但创业这件事本身就意味着你根本不知道三年后会发生什么", "C. 应该先做MVP验证市场，计划书写得再好看都没用", "D. 现金流预测不能精确到角，应该有正负15%的浮动空间"], "type": "choice", "answer": 1, "explain": "预测之耻的实践版。塔勒布说：事情越复杂、时间越长，预测就越离谱——而创业几乎是世界上最复杂的事情之一。真正成功的创业者不是在预测未来，而是在确保自己能在各种可能的未来里活下来。这就是杠铃策略的一端：不要试图猜未来长什么样——保证自己不倒下，然后反复试，直到正面黑天鹅撞到你身上。"}, {"stem": "你被拉去面试两家公司的CEO。A公司过去五年每年增长20%，CEO上过三次封面，出过《我的管理哲学》，商学院拿他当案例。B公司同期只增长3%，CEO的脸你都没见过。塔勒布在边上一直摇头，让你想一个统计学实验。你想了想，把准备投A的那张支票收了回来。", "options": ["A. 应该查一下这两个CEO的教育背景和管理理念，不能只看增长数字", "B. 你假设有10000个CEO，能力完全相同，每年增长是抛硬币决定的——正面20%，反面-5%。五年后，约300个CEO会因为纯运气连续五年都是20%。这300个人会写自传、上封面、被商学院研究——而另外9700个名字你永远听不到。记者和学者也需要故事来卖钱——所以他们愿意相信这些「天才」真的有什么秘诀", "C. 应该把两个公司的战略方案拿来对比，看长期竞争力", "D. 纯看增长不公平——要扣掉行业平均增速再看超额收益"], "type": "choice", "answer": 1, "explain": "塔勒布管这个叫「计算认识论引擎」——用计算机模拟随机过程，然后看哪些人看起来像天才。你取10000个随机变量（CEO），用抛硬币模拟业绩，五年后靠纯随机就会有几百个人看起来像行业领袖。这些「领袖」自己都相信了——因为人类不可能把自己的成功归结为运气。然后管理学家跑来写案例，记者跑来采访，全世界都在问「他做对了什么？」——答案很可能是：投硬币投出了连续五次正面。"}, {"stem": "在地铁上，你看着对面那个人手机上的财经新闻——屏幕上49位经济学家正在预测未来半年GDP：3.2%、2.9%、3.5%……每个都精确到小数点后一位。底下不起眼地写着一行小字：「基于XX宏观经济模型，置信水平95%。」你旁边的退休老交易员嘿嘿笑了，低声说：「我干了30年，没见过一个敢把自己的预测记录摊开来看的经济学家——但我见过多得数不清的、假装不记得自己预测错误的经济学家。」", "options": ["A. 经济学家的问题是他们预测的时间跨度太短了，应该做3-5年的中长期预测", "B. 小数点后一位，95%置信区间——全是骗人的装扮。如果你真的把每个经济学家过去十年做的每一次预测全部拽出来——不准删除，不准修改记忆——你会发现他们的预测准确率比「去年是多少今年就是多少」这个最弱智的外推法还要差。但他们不会这么做——因为人的大脑有种神奇的功能叫「自动忘记丢人的事」", "C. 95%不够，要提到99%才能真正反映不确定性", "D. 宏观经济模型的问题是数据来源太单一了——如果加入卫星图片分析工业活动，准确率能大幅提升"], "type": "choice", "answer": 1, "explain": "第十章花了一整章的篇幅来证明一件事：专家的预测，烂到令人发指——但最妙的是没有人去跟踪这些预测。不是不想跟踪，是人类的大脑会自动清除失败的预测记忆。心理学家做过实验：人们在预测错误后会修改自己当初的记忆，让自己觉得「我当时其实也没那么确定」。你以为你在信专家——其实你是在信一群连自己都骗了的人。"}, {"stem": "有人给你两颗药丸。第一颗：吞下去，50%的概率你长生不老——你愿意为它付多少钱？你大概会说：不付钱，或者意思意思。第二颗：你已经长生不老了，但有一种病毒有50%的概率明年杀死你——你愿意为解药付多少钱？你大概会说：倾家荡产也得买。注意：你给出了完全不同的答案，但这两个问题在数学上是同一件事。塔勒布说，这暴露了人类大脑里最要命的bug，也是我们总是低估黑天鹅的根本原因。", "options": ["A. 这是损失厌恶——人们对失去的感受比获得强大概两倍", "B. 两个问题数学上完全等价——但第一个是「额外得到一个好东西」，第二个是「额外失去一个好东西」。人类对「失去已经拥有的」的恐惧，远远大于对「可能得到但还没拿到」的渴望。这就是为什么我们无法正视黑天鹅：我们已经「拥有」每天的日常平稳，所以对威胁这种平稳的事——哪怕概率极低——也应该极度重视。但我们恰好相反：我们花大钱买彩票（博正面黑天鹅），却不愿意花小钱做准备（防负面黑天鹅）", "C. 这说明人们对概率的理解有误——50%在不同时间尺度上含义不同", "D. 这是搭便车效应——每个人都盼着别人出钱防灾，自己搭顺风车"], "type": "choice", "answer": 1, "explain": "塔勒布把行为经济学（卡尼曼的发现）跟黑天鹅理论缝在了一起。人类的直觉有两个致命的坑：1）对「失去已有之物」过度恐慌；2）对「从没发生过的灾难」完全麻木。这就是为什么2008年金融危机之前，没人愿意花大钱去防一种「从来没人见过的」系统性崩盘。崩盘之后，所有人突然都愿意花天价买「再也不会崩盘」的保险。同一种硬币，正面和反面。"}, {"stem": "你是2000年前古罗马的一个贵族，靠海运贸易赚了钱——20条商船，满载橄榄油和葡萄酒，跑在地中海上。你的朋友很担心你：「你不怕遇到风暴吗？一条船沉了你就亏5%！」你笑了笑说了一段话——这段话说出来的时候，华尔街的风险管理理论还差两千年才能勉强摸到你的边。", "options": ["A. 「我已经向海神波塞冬献了祭品，他不会让风暴打到我的船队上」", "B. 「我80%的钱买了最稳的罗马国债，还在乡下买了田种地——就算20条船全沉，我明天的早餐还是热乎的。剩下20%的钱分散在20条船上——任何一条船满载而归，都是意外暴利。风暴可能会来——但风暴来的时候，我要么安然无恙，要么笑了」", "C. 「我只在夏天出海，避开冬季风暴季，这样沉船的概率就降了九成」", "D. 「我在亚历山大港买了海运保险——把风险转移给保险商了」"], "type": "choice", "answer": 1, "explain": "杠铃策略——从古罗马哲学家塞内加那里继承来的核心操作逻辑，横跨《黑天鹅》和《反脆弱》两本书。杠铃的两头：一头极度安全（大部分资产放在雷打不动的地方），另一头极度投机（用小钱博可能出现的大爆发）。中间地带——不温不火、不高不低——是最危险的：它让你以为你很安全，但其实你在负面黑天鹅中会受伤，而正面黑天鹅来了你也赚不够。"}, {"stem": "你到一家对冲基金面试。面试官拍出两张收益图：「A交易员，过去三年每个月稳定赚1%-2%，最大回撤0.5%，Sharpe比率3.2。B交易员，大部分时间在亏小钱，偶尔突然暴赚，Sharpe比率只有0.7，最大回撤12%。你选哪个？」你盯着这两张图看了很久，想起了塔勒布在华尔街混了二十年后说的一句狠话，然后给出了一个让他笑了的回答。", "options": ["A. A明显更优秀——高Sharpe、低回撤，风控到位", "B. A看起来完美，但月月赚钱的策略往往是在「压路机前面捡硬币」——靠卖深虚值期权赚保费，每次1%，稳得像银行利息。直到某一天——可能是今天，可能是明年——压路机碾过来了。一天亏损吃掉前三年所有的盈利，连带本金。B看起来很丑，但它每天亏的都是可控的小钱，赚的却是没有上限的大钱——它站在正面黑天鹅的一边", "C. 两个策略应该搭配着用，做一个风险平价的组合", "D. B的问题在回撤太大——给他加一个止损线把回撤压到5%以内就行了"], "type": "choice", "answer": 1, "explain": "这是塔勒布自己的交易哲学。他在华尔街做了二十年衍生品——亲眼看着无数「稳定盈利」的基金在一次黑天鹅事件中灰飞烟灭。平稳的小盈利通常是伪装的尾部风险——你在给市场卖保险，直到某一天市场向你要一笔你根本付不起的赔偿金。塔勒布的做法是反过来的：每天付小额的「保险费」（可控亏损），等待某一天市场给你一个超大的回报。他的核心原则就一句话：有利因素必须大于不利因素。"}, {"stem": "你们公司要上一个大型IT项目。项目经理抱来一本200页的PDF——甘特图、关键路径、里程碑、风险评估一应俱全。风险评估那章用蒙特卡洛模拟算出了「项目失败概率2.3%」。一切看起来都在掌控之中。你翻到最后一页的附录，发现这个项目依赖了127个外部因素——任何一个供应商撂挑子、任何一条监管政策变动，整个计划立刻崩。你合上报告，想起了塔勒布对风险管理的评价。", "options": ["A. 蒙特卡洛模拟的方法没问题，但输入数据要更精确——让各部门重新提交估计参数", "B. 这份风险评估表是一堆精致的废话——它把「模型内部的」风险算到了小数点后三位，但对「模型外部的」风险——那些数据里从来没出现过的事——完全瞎了。127个外部依赖，就是127个随时可能爆的黑天鹅。你不需要2.3%这个数字——你需要回答一个问题：这127件事里任何一件发生，你这个项目还活得下去吗？如果答案是「活不下去」，那就别做了", "C. 把127个外部因素全部纳入敏感性分析，做压力测试", "D. 项目失败概率没估好——应该用帕累托分布来替代正态分布做蒙特卡洛模拟"], "type": "choice", "answer": 1, "explain": "塔勒布对风控行业的终极吐槽：你们管的是「你们模型里能算出来的风险」，不是真正的风险。真正的黑天鹅——那些模型从来没见过、数据库中从来没出现过、你甚至想都没想到过的——根本不在你的模型里。保险精算师可以把车祸算得准准的，但算不出双子塔被飞机撞。你需要的不是一串更精致的数字——你需要问一个最原始的问题：「如果这事崩了，我会不会死？」如果答案是「会」——那2.3%也好、0.0003%也好，趁早别干。"}, {"stem": "你走进一家书店，「成功学」专区摆满了《高效能人士的七个习惯》、《从优秀到卓越》、《基业长青》……每本书都说自己发现了成功的底层密码，每本都有大量的案例研究支撑，每本都写得让你觉得自己离成功就差看完这300页。但你突然想起来——那本《基业长青》里评选的「卓越企业」，在被写进书之后的十年里，大部分表现平平，有些倒闭了，有些退市了。塔勒布说这不是偶然——这是必然。", "options": ["A. 因为这些书研究的是过去的成功企业，过去不等于未来", "B. 这些书的研究方法从根上就是残废的——它们从「已经成功」的企业往回找「成功的原因」。听起来像在做科学研究，但你如果在十年前用同一套标准去挑「未来会成功的」企业——你会发现你挑股的能力跟一只黑猩猩扔飞镖差不多。这不是因为这些书写得不好——是因为你只看到了幸存者，没看到死了的。那些做了完全相同的事但失败了的公司，没人给它们出书", "C. 研究的时间跨度太短了——应该追踪企业50年以上再写书", "D. 大企业一旦成功久了就容易官僚化——这不是统计问题，是人性问题"], "type": "choice", "answer": 1, "explain": "塔勒布专打成功学畅销书的脸。《基业长青》的作者自己也承认了——书里的「卓越公司」后来大部分没跑赢大盘。但这不只是数据过时的问题——是方法论本身的破产。你无法从幸存者身上学到成功的原因，因为那些做了同样的事情但失败了的人，不会出现在你的样本里。想明白什么东西导致成功？你先得去研究死掉的公司——那些埋了的、倒闭了的、名字都被人忘了的。这才是沉默的证据的正确打开方式。"}, {"stem": "你站在一个岔路口。左边那条路叫「我知道」——路修得平整整齐，两边修剪过的灌木，路牌上写着「前方距离精确到米」。右边那条路叫「我不知道」——杂草丛生，蜿蜒消失在大雾里，没有路标，没有任何关于前面有什么的提示。你看到绝大部分的旅人毫不犹豫地拐进了左边。塔勒布站在路口，看着这熙熙攘攘的人流，对你说了一句话。这句话是他花了几十年，在华尔街、在学术界、在黎巴嫩的战火里反复验证过的东西。", "options": ["A. 「跟大家走左边吧——几千年的人类智慧告诉我们，走已知的路最安全」", "B. 「别信左边路上那些人脸上的自信——他们手里的路标是画在一张他们自己都没走过的地图上的。右边这条路看起来吓人，但承认「我不知道」才是真正的聪明。预测人类的未来是人类干过的所有蠢事里最嚣张的一种——但你不需要预测未来才能活得好。你只需要保证自己不管哪种未来来了，都死不了。这就是和黑天鹅共存——不猜它什么时候来，只确保它来了你还在」", "C. 「走左边的路也可以——但记得带个GPS，科技能弥补人类的预测短板」", "D. 「你应该自己踩出第三条路——别被两个选项困住，走中间最稳妥」"], "type": "choice", "answer": 1, "explain": "全书的最终信仰。塔勒布不反对人类有知识——他反对的是人类假装自己拥有的那些「假知识」。2008年金融危机、一战、泰坦尼克号、长期资本管理公司的崩掉——这些灾难的共同点不是「人类不够聪明」，是「人类太把自己当回事了」。真正的智慧是承认自己看不清未来。然后你做的不是去猜黑天鹅什么时候来——而是确保黑天鹅来的时候，你不会变成那只火鸡。"}, {"stem": "你参加了一场投资分享会。一位穿着考究的「量化女神」在台上展示她的算法：过去十年年化35%，最大回撤才5%，Sharpe比率4.8，曲线美得像画出来的一样。台下掌声雷动，有人当场就要签合同。你旁边一个头发花白的老头小声说：「1998年我见过一模一样的PPT。那个讲师的两个老板后来得了诺贝尔奖。他们用的数学比台上这位还要华丽。基金的名字叫长期资本管理公司。后来的事你应该知道了。」散会后你没去投资——不是因为你不信量化，而是因为你想起了一件事。", "options": ["A. 量化策略天然不可靠——应该坚持价值投资", "B. 过去十年完美的曲线说不定正好说明这是最危险的东西——它恰好覆盖了一段没有大黑天鹅的太平日子。一段从来没被暴风雨打过的航行记录，不是在证明船有多结实——而是让你放松了警惕，以为自己漂在游泳池里。那只火鸡在被宰的前一天，数据表现也是完美的。真正测试一个策略的不是它在太平日子里赚了多少，而是它在末日级别的灾难里能不能活", "C. 这个算法有过拟合的风险——得看它在完全没见过的数据上表现如何", "D. 年化35%意味着超过3倍杠杆——这种回报不可能持久"], "type": "choice", "answer": 1, "explain": "全书开头和结尾的呼应——火鸡的故事在这里画了一个圈。一段平滑得不像真的历史记录，往往比一段有波折的记录更危险，因为它成功地让你相信「风险已经没了」。塔勒布在华尔街见过的一场又一场灾难，都有一个共同的序幕：「最近这段时间太平得不像话，所以大家开始相信灾难不会来了。」泰坦尼克号的船长1907年说过：「我这辈子没见过失事船只。」1912年船沉了。没发生过，不等同于不会发生。但最要命的是——「没发生过」恰恰是最容易让人放松警惕的毒药。"}]};
quizData.trade = {"title": "以交易为生", "questions": [{"stem": "你刚入市不久，连续做对三笔赚了30%。你开始觉得「我可能是个天才」，准备加大仓位。埃尔德会怎么警告你？", "options": ["A. 把利润取出来，用本金继续做", "B. 大胆加仓——运气来了要抓住，利润是奔跑出来的", "C. 停下来——连续盈利后最容易过度自信，这时候犯的错误往往最大。先休息一天，冷静一下再决定", "D. 问别人意见，不要自己做决定"], "type": "choice", "answer": 2, "explain": "酗酒者匿名会的经验：连续盈利时的亢奋感会扭曲判断。埃尔德说交易最大的敌人是情绪——过度自信和恐惧交替破坏你的决策。"}, {"stem": "你持有的股票突然暴跌，账面亏损15%。你的第一反应是什么是不对的？", "options": ["A. 按止损纪律出场，然后分析这笔交易哪里出了问题", "B. 「它会回来的」，继续持有等反弹", "C. 检查基本面有没有变化，再决定", "D. 看其他指标有没有支撑位"], "type": "choice", "answer": 1, "explain": "埃尔德：「寄托于希望是失败的策略。」亏损时的「它会回来」是最危险的自欺欺人。纪律是交易者的生命线——计划好的止损，必须执行。"}, {"stem": "你发现自己总是在周五下午冲动交易、追涨杀跌。埃尔德建议你怎么办？", "options": ["A. 周末多学习，提高自己的技术水平", "B. 周五下午只做模拟盘，不动真钱", "C. 开始记录「交易日志」——写下每笔交易前的想法和情绪状态。连续记录两周后，你可能会发现：周五下午你太累了，不该交易", "D. 周五下午找别人帮你交易"], "type": "choice", "answer": 2, "explain": "埃尔德强调交易日志是自我认知的工具。你不记录情绪，就永远看不清自己的模式。发现周五下午总是冲动→那周五下午就关掉交易软件。认识自己比学任何指标都重要。"}, {"stem": "埃尔德本人曾是酗酒者。他从匿名戒酒会的12步康复法中学到了什么对交易至关重要的东西？", "options": ["A. 承认自己无法控制市场，就像酒鬼承认自己无法控制酒精。放下控制欲，才能专注于自己能控制的事——自己的纪律、仓位、止损", "B. 交易和喝酒一样，会上瘾，要戒掉", "C. 交易要用「戒断法」，一段时间不交易才能清醒", "D. 匿名戒酒会的交易秘密：每天早上跟自己说「今天我不亏钱」"], "type": "choice", "answer": 0, "explain": "匿名戒酒会的核心是「承认无力」→「寻求帮助」→「每日自省」。交易同理：承认你控制不了市场（放下预测），专注于你能控制的（仓位、止损、纪律），每天做自我排查。"}, {"stem": "你做了详细的技术分析，选了一只看起来完美的标的。结果它走反了。你应该？", "options": ["A. 重新审视分析，找出哪里判断错了", "B. 加仓摊低成本，等它回来", "C. 接受「最好的分析也可能被市场否定」——你的任务不是预测对，而是错了的时候亏得少。止损出局，找下一个机会", "D. 换一个更准的指标再分析一次"], "type": "choice", "answer": 2, "explain": "埃尔德：「市场就像一个巨大的合唱团，不会因为你的独唱而改变旋律。」再完美的分析也只是你的假设。市场永远是对的——错了就认，小亏出来，比死扛强一万倍。"}, {"stem": "「如果你的交易让你睡不着觉，那么你的仓位太大了。」这句话背后的道理是？", "options": ["A. 交易应该让人兴奋，睡不着说明你在认真对待", "B. 睡觉比交易重要，健康第一", "C. 这说明你的策略有问题，跟仓位无关", "D. 仓位大小直接影响你的决策质量——仓位太大→恐惧和贪婪主宰大脑→所有技术分析都白做了，因为你会被情绪绑架"], "type": "choice", "answer": 3, "explain": "埃尔德的核心观点：仓位必须小到让你能平静地执行计划。一旦仓位大到让你心跳加速、睡不着觉，你的理性大脑已经下线——剩下的只是赌徒。"}, {"stem": "一只股票放量突破前期高点，所有人都说「牛市来了，冲」。你怎么看？", "options": ["A. 先看看成交量——突破放量能支持，但如果看到太多人狂热涌入，可能是顶部信号。埃尔德说「当所有人都站在船的一边时，船会翻」", "B. 跟着冲——群众的眼睛是雪亮的", "C. 技术突破就是买入信号，不用想太多", "D. 等回调再买，不追高"], "type": "choice", "answer": 0, "explain": "群众心理的两面性：上涨时群众互相强化推高价格（泡沫），下跌时恐慌互相传染砸出深坑。聪明的交易者利用群众的极端情绪——在大家都恐慌时悄悄买，在大家都狂热时悄悄卖。"}, {"stem": "你在股吧看到一个帖子说「这只股票跌了三天了，明天必然反弹」。按埃尔德的观点，这句话的问题在哪？", "options": ["A. 跌三天不够，要跌五天才反弹", "B. 没有必然——群体行为不是机械的钟摆。恐慌可能持续比你想的更久。你应该等信号而不是预测信号", "C. 股吧帖子不能信，都是庄家骗散户的", "D. 反弹需要有利好配合，光跌不够"], "type": "choice", "answer": 1, "explain": "埃尔德：不要预测群体的情绪何时转向。从恐惧到恐慌再到彻底绝望是一个过程，这个过程可能比你以为的长得多。你唯一能做的是等反转信号出现再动手。"}, {"stem": "一只股票连续暴涨后开始震荡，成交量从巨大慢慢缩小。这个现象意味着什么？", "options": ["A. 主力在出货，散户还在接盘", "B. 这是洗盘，后面还有更大的涨幅", "C. 上涨的动力在衰竭——想买的人都进场了，没有新的买盘推动价格继续涨。这是一个警示信号", "D. 缩量是好事，说明筹码稳定了"], "type": "choice", "answer": 2, "explain": "价格趋势需要新的参与者来维持。连续上涨后成交量萎缩=增量资金减少→上涨乏力。这不是洗盘（洗盘需要恐慌性的量），而是趋势疲惫的信号。"}, {"stem": "你看到一波急跌里突然放出了巨大的成交量意味着什么？", "options": ["A. 恐慌盘终于涌出来了——当最恐惧的人都在挥泪斩仓时，卖盘衰竭的拐点可能就在眼前。这不是加仓的信号，但可能是空头力量耗尽的标志", "B. 主力在出货，赶紧跟着卖", "C. 这是行情刚开始跌，后面还有更多", "D. 放量是好事，说明有人接盘"], "type": "choice", "answer": 0, "explain": "恐慌性抛售（capitulation）是群体心理的极端表现。放量暴跌→该卖的都卖了→卖方力量耗尽→反弹可能来。但埃尔德强调：不抄底！等价格确认反转再进场。"}, {"stem": "埃尔德说「价格是一切市场参与者投票的结果」。以下哪件事最能体现这个意思？", "options": ["A. 你看了某大V的分析觉得股票会涨，决定买入", "B. 均线金叉所以买", "C. 基本面好的股票一定会涨，只是时间问题", "D. 一只股票财报超预期但股价反而跌了——说明聪明钱可能在借利好出货。价格包含了所有参与者的信息，比任何单一分析都更真实"], "type": "choice", "answer": 3, "explain": "价格是市场所有参与者（主力、散户、机构、内幕人）用真金白银投票的结果。财报好但跌=有人知道你不知道的事/有人在出货。相信价格信号，别跟市场争对错。"}, {"stem": "你发现每次某个银行的财报公布后，股价的反应总是「反直觉」的。这意味着？", "options": ["A. 这个市场的参与者不理性", "B. 你应该反着做，财报好就卖，财报差就买", "C. 这个银行的基本面有问题", "D. 「预期」已经在财报公布前反映在价格里了。财报数据只是确认或否定市场之前的预期，价格未来的走势取决于实际数据和预期之间的差距"], "type": "choice", "answer": 3, "explain": "市场在交易「预期」而不是「事实」。财报是滞后数据——市场已经提前定价了各种可能。最终的涨跌取决于：实际数据vs市场预期，哪个更强。"}, {"stem": "你在图表上看到一个完美的头肩顶形态。接下来你必须确认什么才能判断这个形态有效？", "options": ["A. 颈线有没有被有效跌破——如果在颈线放量跌破，这个形态才算确认。没有跌破之前，它只是「可能」的头肩顶", "B. 右肩必须比左肩高", "C. 成交量必须从左到右递减", "D. 头肩顶的形态漂亮就够了"], "type": "choice", "answer": 0, "explain": "埃尔德：形态必须等到关键位确认。颈线跌破并伴随放量=头肩顶确认。提前在「可能形成」的时候进场=赌博。等待确认会错过一部分利润，但能让你的胜率大幅提高。"}, {"stem": "看到一只股票在支撑位上反复测试了四次但不破。这让你想起了什么？", "options": ["A. 支撑很强，可以大胆买入", "B. 越多的测试越危险——因为更多的买家已经进场了。如果第五次跌破支撑，下方已经没有多少买盘提供保护。每次测试都在消耗支撑的「弹药」", "C. 这只是正常的整理形态", "D. 支撑位被测试的次数越多越稳固"], "type": "choice", "answer": 1, "explain": "支撑不是越测越牢——每次测试都在消耗潜在买盘。测试四次后如果第五次跌破，恐慌会比第一次就来得更猛，因为那些在支撑位买入的人全被套了。"}, {"stem": "一只股票的趋势线被跌破后又很快拉回去，这个动作叫什么？", "options": ["A. 应该止损了，趋势已经坏了", "B. 这只是正常的震荡", "C. 回抽确认——跌破不一定是真的，但如果跌破后不久收回并站稳，说明是一次「熊陷阱」——空头被诱骗进场，多头反攻", "D. 假突破——散户被洗出去了"], "type": "choice", "answer": 3, "explain": "经典技术现象：「熊陷阱」——跌破关键位→空头以为趋势反转做空→价格迅速收回→空头被迫平仓推动价格进一步上涨。这是需要灵活应对的情况，不能死守「趋势破了就卖」。"}, {"stem": "你画了一条上升趋势线，发现价格沿着它走了八个月。这个趋势线有什么特点？", "options": ["A. 时间越长的趋势线越可靠", "B. 长趋势线破了就是大行情", "C. 趋势线越久远，市场对它的「记忆」越模糊。这是一个参考，但最近的支撑/阻力比八个月前的线重要得多", "D. 八个月的趋势线是核心支撑位"], "type": "choice", "answer": 2, "explain": "埃尔德：旧趋势线的参考价值随时间递减。市场更关注近期形成的支撑和阻力，因为近期参与者的成本在那里。八个月前的趋势线只是背景噪音。"}, {"stem": "跳空缺口（股票跳空高开）在图表分析中的核心意义是什么？", "options": ["A. 跳空说明有重大利好", "B. 跳空一定会回补，所以回补时再买", "C. 跳空说明主力在偷偷建仓", "D. 跳空代表强烈的情绪共识——所有人都想在同一个价格买/卖，以至于中间的价格没有人交易。缺口越宽，市场情绪越极端"], "type": "choice", "answer": 3, "explain": "缺口代表「所有人都同意」的瞬间——多头一致看涨或空头一致看跌，中间价格无人问津。缺口通常会形成未来的支撑/阻力。但埃尔德不建议「赌回补缺口」，而应把缺口当参考位。"}, {"stem": "埃尔德说技术分析最大的价值不是「预测」，而是什么？", "options": ["A. 提供一套客观的决策框架——技术分析不能告诉你市场会去哪，但它能告诉你「如果到了这里，你的假设可能是错的」。它帮你管住自己，而不是帮你打败市场", "B. 预测明天的涨跌方向", "C. 找到最佳的进场点位", "D. 给基本面提供验证"], "type": "choice", "answer": 0, "explain": "技术分析不是水晶球——它的价值是建立「如果X发生，则Y」的规则框架。趋势线破了=离场，不管你觉得多可惜。这套框架让你不再靠感觉做决策。"}, {"stem": "MACD金叉了但价格不涨，反而横盘。这是怎么回事？", "options": ["A. MACD反映了速度的变化——金叉说明下跌动能在减弱，但不等于上涨动能已经来了。你可能看到的是一个「底部背离」或是震荡行情里的假信号", "B. MACD是滞后指标，金叉时行情已经走完了", "C. 金叉就是买点，耐心等待即可", "D. 这个MACD参数设置不对，需要调整"], "type": "choice", "answer": 0, "explain": "埃尔德反复强调：指标说的是动能变化，不是方向。「下跌减速」和「开始上涨」是两回事。在横盘市场中，MACD经常给出反复的假信号——你需要结合趋势和成交量来判断。"}, {"stem": "RSI（相对强弱指数）低于30了，这是不是超卖=买点？", "options": ["A. 是的，RSI<30就是超卖，应该买入", "B. 不一定——在熊市的急跌中，RSI可以长时间停在30以下。超卖只是说下跌速度太快了，不代表马上反弹。你需要等RSI回到30以上确认拐点", "C. RSI<20才是真正的超买", "D. RSI是用来判断趋势强弱的，不是用来买卖的"], "type": "choice", "answer": 1, "explain": "埃尔德：「超卖」是必要条件不是充分条件。RSI<30说明下跌过猛，但不等于马上反弹——恐慌可以持续很久。等RSI回到30以上=恐慌结束的信号，再进场。"}, {"stem": "你把MACD、RSI、布林带、均线都用上，结果它们给出的信号互相矛盾。怎么办？", "options": ["A. 把更多指标加上，看哪边多听哪边", "B. 用成交量来最终裁决", "C. 简化——埃尔德说「五个指标不如三个，三个不如一个你真正理解指标的用法」。矛盾信号说明市场在震荡，这时候最好的策略是观望，而不是硬找一个方向", "D. 哪个指标最近最准就用哪个"], "type": "choice", "answer": 2, "explain": "指标堆砌=决策瘫痪。埃尔德推荐三重滤网系统——不同时间框架配合，而不是同框架堆指标。当你看到矛盾信号时，市场本身就在犹豫——你不应该替市场做决定。"}, {"stem": "埃尔德发明的「三重滤网交易系统」的核心思想是什么？", "options": ["A. 用三套不同的指标互相验证", "B. 用三个不同来源的消息综合决策", "C. 在不同时间框架上做决策——长周期定方向（周线看涨），中周期找震荡（日线回调），短周期找进场点（小时线突破）。就像先看地图再走路", "D. 买三个不同板块分散风险"], "type": "choice", "answer": 2, "explain": "三重滤网=跨时间框架。第一层（周线）：用趋势指标定方向，只顺着大趋势交易。第二层（日线）：用震荡指标在大趋势的回调中找机会。第三层（小时线）：在回调末端精准进场。"}, {"stem": "有人跟你说「这个指标85%的胜率，跟着买就对了」，你会怎么反应？", "options": ["A. 警惕——胜率从来不单独存在。一个85%胜率的系统如果10次赢赚1块、1次输亏100块，结果一样破产。你应该关心的是「盈亏比」而不是胜率", "B. 先看看是不是真的，如果是就跟着做", "C. 问问他用什么参数，自己试试", "D. 85%太高了，肯定是骗子"], "type": "choice", "answer": 0, "explain": "埃尔德强调：胜率不单独有意义。明星系统胜率80%但每次赚1块亏20块=长期必死。一个胜率只有40%但盈利是亏损三倍的=正期望值。亏多少比赢多少次重要得多。"}, {"stem": "均线系统最容易被忽略的一个致命缺陷是什么？", "options": ["A. 均线滞后，拐点出现后才给信号", "B. 均线对跳空缺口反应太慢", "C. 均线需要至少100根K线才有意义", "D. 均线在趋势中好用，但在横盘震荡中会产生连续亏损——每次金叉进场、死叉出场都是在高买低卖。识别「趋势还是震荡」比均线参数本身重要100倍"], "type": "choice", "answer": 3, "explain": "均线的阿喀琉斯之踵：横盘震荡。趋势中均线是赚钱机器（顺势持长），震荡中均线是绞肉机（来回打脸）。埃尔德建议：先判断当前是趋势还是震荡，再决定用不用均线。"}, {"stem": "股价涨了3%但成交量只有平时的三分之一。这个现象告诉你什么？", "options": ["A. 没有量的上涨说明市场不认可，大概率会跌回来——就像没有观众的掌声，再大的动作也没有意义", "B. 缩量上涨是最好的上涨形态，说明筹码被锁定了", "C. 跟量没关系，涨了就是涨了", "D. 主力在控盘，偷偷拉高"], "type": "choice", "answer": 0, "explain": "成交量验证价格——上涨需要买单流入。缩量上涨=参与者减少=上涨动力不足。就像派对里人越来越少，说明派对快散了。"}, {"stem": "一只股票在下跌过程中，成交量从放大逐渐缩小到极低水平。这通常意味着什么？", "options": ["A. 没有人关心这只股票了，赶紧卖掉", "B. 卖盘衰竭——该卖的人基本都卖了，剩下的持有者宁愿持有也不割肉。虽然不是买点，但至少说明下跌最凶的阶段可能过去了", "C. 主力在吸筹，缩量是故意的", "D. 成交量低就是没有机会，不要浪费时间"], "type": "choice", "answer": 1, "explain": "下跌中的缩量=卖方兴趣在减退。恐慌最激烈的时候已经过去（那段时间成交量大）。现在虽然还没看到买方进场，但卖方力量已经大幅弱化——转折可能近了。"}, {"stem": "持仓量（Open Interest）增长同时价格上涨，说明什么？", "options": ["A. 只有多头在加仓，空头不动", "B. 这是顶部的信号，应该减仓", "C. 多空都在加仓，但在打架中多头暂时领先——这是牛市最健康的态势。如果后续持仓量下降+价格上涨，说明空头在认输平仓，趋势可能接近尾声", "D. 持仓量没有意义，只看价格就行"], "type": "choice", "answer": 2, "explain": "持仓量+价格的组合分析：价涨+量增=新多头进场，趋势健康；价涨+量减=空头认赔出场，趋势可能见顶。期货交易中持仓量是独有的重要信息。"}, {"stem": "埃尔德说成交量能帮助判断「突破」的真假。有效突破的特征是？", "options": ["A. 价格突破前期高点就算有效突破", "B. 连续三天收盘在突破位之上", "C. 突破的形态足够明显", "D. 价格突破关键位+成交量明显放大→突破有效。如果突破时量没有变化→大概率是「假突破」——很快就会回落"], "type": "choice", "answer": 3, "explain": "成交量是突破的「证人」。无量的突破=没有新的参与者认同这个价格→缺乏维持新价位的动力→很容易被拉回来。放量突破=大资金在表态→值得跟进。"}, {"stem": "你看一只股票的日线成交量，发现突然冒出平常5倍的量，但价格基本没动。这是什么信号？", "options": ["A. 主力在换庄，卖了又买了", "B. 异常放量平价=多空分歧极大但暂时势均力敌。这是一场大战的前兆——一旦某一方认输，行情会很猛烈。不要急着站队，等方向出来再跟", "C. 这一定是洗盘", "D. 这股票没人关注了"], "type": "choice", "answer": 1, "explain": "放量滞涨/滞跌=有大量买卖在某个价位交锋，但谁也没赢。就像两个重量级拳手僵持——迟早有一方会倒，而且倒的方向就是行情的方向。耐心等他们分出胜负。"}, {"stem": "为什么埃尔德说「时间框架」本身就是一种重要的分析维度？", "options": ["A. 不同时间框架给出的交易机会数量不同", "B. 时间框架决定你的持仓时间", "C. 大时间框架比小时间框架更重要", "D. 同一只股票，周线可能是上涨趋势，日线可能是回调，小时线可能是震荡。你是短线交易者就不能拿着周线看涨的理由扛日线回调——时间框架是你在哪个维度参与游戏的规则"], "type": "choice", "answer": 3, "explain": "三重滤网的核心：先确定你的主时间框架（你是做日线还是小时线），然后向上的时间框架定趋势（不允许逆势），向下的时间框架找进场。不同时间框架给出的是不同维度的「游戏规则」。"}, {"stem": "你发现指数在涨但大多数个股在跌，也就是「二八行情」。这说明什么？", "options": ["A. 这只是板块轮动，很正常", "B. 指数涨就是牛市，个股跌只是个例", "C. 权重股在护盘，不用怕", "D. 上涨缺乏「宽度」——少数大市值股票在拉指数，多数中小盘其实已经在跌。这是上涨趋势不健康的信号。如果指数跌但多数个股在涨，相反——可能是底部"], "type": "choice", "answer": 3, "explain": "市场宽度是判断大势的重要维度。少数拉抬指数而多数下跌=聪明的资金可能已经在出货，散户还在追那几个领涨股。埃尔德说：「用指数的趋势判断整体方向，但也要看内部的健康度。」"}, {"stem": "期权交易中「时间衰减」（Theta）对你有什么实际影响？", "options": ["A. 时间越长期权越值钱", "B. 你不仅要对方向对，还要对时机对——即使股票最终涨到你预期的价位，如果花的时间太长，期权的时间价值已经归零，你照样亏钱。买方跟时间赛跑，卖方靠时间赚钱", "C. 期权跟股票一样，时间不影响价值", "D. 快到期的期权更值钱"], "type": "choice", "answer": 1, "explain": "Theta是期权买方的大敌——每天自动亏钱。这决定了期权交易策略：买方必须在短期内发生大幅运动才能赚钱，卖方靠时间流逝稳定收割。大多数散户买期权都在赌方向+赌时间，双重难度。"}, {"stem": "埃尔德建议做「价差策略」（比如买入一只看涨期权同时卖出一只更高执行价的看涨期权）。这个策略的好处是？", "options": ["A. 限制最大亏损同时保留盈利空间——你不会暴富，但也不会一夜亏光。用卖出期权的权利金收入抵消买入期权的成本，本质上是「成本摊薄+风险封顶」", "B. 锁定利润，不用操心", "C. 两头赚钱，稳赢", "D. 比单纯买期权赚得更多"], "type": "choice", "answer": 0, "explain": "垂直价差=买一个方向+卖一个更远的方向，本质是把极端暴涨的部分「卖掉」换取成本降低。虽然上限被锁了，但盈亏比和胜率都更可控。适合不想赌命只想稳定赚钱的人。"}, {"stem": "指数成分股的定期调整会导致什么现象？", "options": ["A. 没有任何影响，指数调整是正常操作", "B. 被调入的股票会永远涨", "C. 纳入指数的股票会被大量被动基金强制买入——短期内价格被推高。反之，被剔除的股票会被强制卖出。这种「被动资金流动」跟基本面无关，但对价格影响真实", "D. 被剔除的股票永远都不应该再买"], "type": "choice", "answer": 2, "explain": "指数效应：被动基金跟踪指数，指数调成分→被动基金必须跟着调→大量资金流入/流出。这是纯粹资金面事件，跟公司好坏无关。可以利用这种短期的非理性波动。"}, {"stem": "一个朋友推荐你一只「内幕消息」股票。按埃尔德的标准你该怎么做？", "options": ["A. 跟着买——有消息渠道就是优势", "B. 先小仓位试试，对了再加", "C. 问清楚消息来源，可信就跟", "D. 拒绝——你不知道这个「内幕」已经有多少人知道、已经被消化了多少。而且未经核实的信息是一个极端的脆弱性来源：消息错误=亏损，消息正确但已消化=亏损，消息正确但时机不对=亏损"], "type": "choice", "answer": 3, "explain": "「内幕消息」是典型的脆弱性：你不知道它已经过了多少手、价格已经反映了多少。即使消息是真的，你可能是在最贵的时候接盘。靠消息交易=把自己的命运交给别人。"}, {"stem": "埃尔德说「每笔交易亏损不超过总资金的2%」。你的本金10万，单笔最大亏损是多少？", "options": ["A. 2000元——2%是硬性边界，不管你觉得这笔机会有多好。如果你连续亏5笔，本金还剩9万，你还能翻盘。如果一笔亏30%，再想赚回来需要涨42%", "B. 看情况——好的机会可以放宽到5%", "C. 5000元，因为有时候市场波动大", "D. 1000元，越保守越好"], "type": "choice", "answer": 0, "explain": "2%铁则是生存底线。连续亏损是所有交易者的宿命（再好的系统也有连续亏损），2%保证你亏完50%需要遇到极端的连续亏损（统计学上极难发生）。一旦突破2%，你的「心理账户」就从理性计算模式切换到赌徒复仇模式。"}, {"stem": "你的胜率只有35%，但平均盈利是亏损的3倍。这个系统能赚钱吗？", "options": ["A. 不能，胜率太低怎么赚钱", "B. 可以赚钱——数学上每笔期望值=35%×3R-65%×1R=1.05R-0.65R=+0.4R，正期望值。这就是为什么只关心胜率是错误的，盈亏比比胜率重要得多", "C. 要看行情好不好", "D. 胜率必须提高到50%以上才行"], "type": "choice", "answer": 1, "explain": "数学不会骗人：胜率35%+盈亏比3:1=正期望值。交易本质不是在「猜对」，而是在「错了亏得少，对了赚得多」。这正是趋势交易的本质——多数时候小亏止损，少数时候大赚。"}, {"stem": "埃尔德强调「交易的秘决不在于对市场的判断，而是对自我的管理」。他建议一个严肃的交易者每天必做的三件事是？", "options": ["A. 看新闻、看研报、复盘", "B. 盯盘、追涨停、看龙虎榜", "C. 写交易日志（情绪+决策记录）、做交易计划（明天的「如果A则B」规则）、计算盈亏比和仓位。这三件事跟市场无关，全是对自己的管理", "D. 学新技术、回测策略、模拟交易"], "type": "choice", "answer": 2, "explain": "日志→反省自己的错误模式；计划→提前制定明天的规则防止盘中冲动；盈亏比和仓位计算→确保每笔交易都在风险可控的范围。这三件事是你「对自己的系统」，市场只是背景板。"}, {"stem": "你决定做职业交易者，但家人不支持。埃尔德会给你什么建议？", "options": ["A. 坚持梦想，总有一天能证明自己", "B. 听家人的，不要做职业交易者", "C. 做职业交易者不需要家人支持", "D. 先别全职——至少有一年的稳定盈利记录、至少有12个月的生活费储备，再考虑全职。不要在你还需要向别人证明什么的时候放弃工资收入——压力会在你最脆弱的时候摧毁你的纪律"], "type": "choice", "answer": 3, "explain": "「走入交易者」是埃尔德最后一章的核心：何时全职、如何过渡、需要什么条件。没钱的压力会扭曲你的决策——当你需要靠交易养家时，2%止损变成了「让我扛一扛吧，扛回来这个月就有饭吃了」。这是灾难的开始。"}, {"stem": "你同时持有了5只不同行业的股票，以为自己在「分散风险」。埃尔德怎么看？", "options": ["A. 同时持有5个方向不一定分散——如果大市暴跌，这5只会一起跌。真正的分散是做「不相关的策略组合」。覆盖不同的市场条件（牛市/熊市/震荡），而不只是不同的股票", "B. 5只太少了，应该至少20只", "C. 5只足够了，关键是选股质量", "D. 分散是骗人的，集中火力才有收益"], "type": "choice", "answer": 0, "explain": "股票数量≠风险分散——系统性风险（全市场暴跌）无法通过加股票对冲。真正的分散是用多个不相关的策略或资产。比如趋势跟踪+均值回归，A策略在B策略亏钱时赚钱。"}, {"stem": "回顾这本经典交易书，埃尔德想传达的最核心的一条原则是什么？", "options": ["A. 学好技术分析就能在市场赚钱", "B. 市场不可预测，你唯一能控制的是你自己——仓位、止损、情绪、纪律。技术分析只是帮助你执行纪律的工具，不是帮你预测的魔法", "C. 做长线就能赚钱", "D. 只要有信心就能做到"], "type": "choice", "answer": 1, "explain": "整本书从心理（Ch1-2）讲到分析工具（Ch3-5）再讲到交易系统（Ch6-7），最后落到风险管理（Ch8-10）。这条弧线告诉你：工具在中间，而心理和风控才是两端真正的支柱。"}]};
