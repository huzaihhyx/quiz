quizData.sc01 = {"title": "手抄稿01", "questions": [{"type": "choice", "stem": "日常法师讲解《菩提道次第广论》时，用「蒙古大夫」比喻什么？", "options": ["A. 讲经说法但自己不修行的人", "B. 不懂道理却乱修一通的修行人", "C. 只管念佛不读经典的人", "D. 西藏密宗的上师"], "answer": 1, "explain": "法师说：「我们生了病要找医生，如果对医生有没有本事、药对不对都不知道，随便找一个蒙古大夫，随便弄点药吃吃，病治不好，反而加重苦。」这就是「盲修瞎炼」——连毛病在哪都没搞清，就敢下猛药，结局比治之前还惨。学佛也是，不懂道理闷着头修，修了半天修的是「我」，我越修越大，离佛越修越远。"}, {"type": "choice", "stem": "「菩提」二字，日常法师用哪两个字来解释？", "options": ["A. 清净", "B. 觉悟", "C. 慈悲", "D. 涅槃"], "answer": 1, "explain": "法师讲得非常直白：「菩提翻成功我们中文叫作觉，觉悟些什么呀？平常我们说自觉、觉他、觉行圆满。」更接地气的解释是：你想离苦得乐对不对？但你没搞清怎么才能离苦怎么才能得乐，而佛陀是「彻底完全觉悟了，告诉我们这个道理」。所以菩提就是「彻底搞清楚了的觉悟」。"}, {"type": "choice", "stem": "日常法师解释「次第」时，用了哪个生活中的比喻？", "options": ["A. 爬楼梯——必须一阶一阶上", "B. 看病——得先诊断再开药", "C. 开车——要会挂档才上路", "D. 种田——先耕地再播种"], "answer": 0, "explain": "法师说：「任何走这个路，一定有个次第。比如我们爬楼梯，一定是下面一阶阶上来，没有一件事情是例外的。」他接着又举烧饭为例：不能说反正要水、要火，先烧完了再洗米——烧焦了怎么吃？次序一乱，本来给你营养的，反而把你毒死。这个比喻太狠了，一步错步步错。"}, {"type": "choice", "stem": "西藏佛教史中，朗达玛灭佛发生在哪个时期？", "options": ["A. 唐朝初年松赞冈布之后", "B. 宗喀巴大师出生之后", "C. 阿底峡尊者入藏之后", "D. 赤松德贞传了几代以后"], "answer": 3, "explain": "法师讲：赤松德贞（即持松德贞）传了几代后，「有一个皇帝叫朗达玛，他反对佛法，听了黑苯教的影响，整个把佛法摧毁」，相当于唐朝唐武宗会昌灭佛的同一时期。朗达玛灭佛后西藏佛法一蹶不振一百多年，直到阿底峡尊者才重新振兴。这段历史说明佛法盛衰完全看有没有具量的传承者。"}, {"type": "choice", "stem": "藏文是怎么来的？日常法师提到松赞冈布做了什么？", "options": ["A. 松赞冈布自己发明了一套文字", "B. 从唐朝引入汉字改造而成", "C. 直接使用梵文书写", "D. 派大臣到印度学母语，回来后创建藏文"], "answer": 3, "explain": "法师说松赞冈布「特别派一个大臣到别的地方去，学好了带回来。最后学的是印度，把印度那个母语，经过了他自己的认识以后，适应西藏，造了那个藏文。」所以藏文脱胎于梵文，这也是为什么藏译佛典如此精准——文字系出同源，翻译起来有天然优势。"}, {"type": "choice", "stem": "日常法师形容太虚大师的佛教观时，用了什么对比？", "options": ["A. 大庙vs小庙——整体教法需要各方配合", "B. 大船vs小船——大乘比小乘载得人多", "C. 茅篷vs摩天大厦——个人修行与整体弘扬", "D. 大河vs小溪——佛法源远流长"], "answer": 2, "explain": "法师说太虚大师是「八宗并弘」的代表：「个人修，造个小茅篷，拜佛也在里面，吃饭也在里面，睡觉也在里面，修行成功就行；可要把三宝形相撑起来的是一间大庙——你要有大殿、有寮房、有大寮，各式各样的配合。」茅篷和大庙的对比太精准：一门深入对个人修是必须的，但对整个佛教的弘扬来说远远不够。"}, {"type": "choice", "stem": "「菩提道次第广论」中的「广」字是什么意思？", "options": ["A. 文章篇幅长", "B. 涵盖的宗派广泛", "C. 广大无边的高深境界", "D. 详细地说明这件事"], "answer": 3, "explain": "法师说：「广是详细地来说明这件事情。」重点不在篇幅大，而在于详细——把从凡夫到成佛的每一步都掰开揉碎了讲清楚。他还特别说明自己用最通俗的名字来讲，目的是让人能修、能证，不是搞学术研究。"}, {"type": "choice", "stem": "宗喀巴大师一天能讲多少部大论？", "options": ["A. 7部", "B. 11部", "C. 21部", "D. 49部"], "answer": 2, "explain": "法师说：「他曾经在一个法会上面，一天同时开讲十五部大论，实际上讲完了十七部大论。以后曾经最高的讲二十一部大论。」想想看，我们一天听一堂课就累得不行，人家一天讲二十一部论，每部都要旁征博引全部的经论——这不是「一个人顶一个佛学院」的问题，是一个人顶二十一个佛学院。"}, {"type": "choice", "stem": "宗喀巴大师看病的故事说明了什么？", "options": ["A. 大师本来想当医生，后来转修佛法", "B. 大师认为学佛必须先学医", "C. 大师的绝顶聪明令名医都惊讶", "D. 大师生病时自学医术把自己治好"], "answer": 2, "explain": "法师讲宗喀巴刚进西藏不久生病去看医生，结果他在讨论病情时发表意见，所有名医的共同感受是：「不是我在给他看病，而是我遇见了一个最好的医学教授，上了一课！」这个年轻人把脉就知道该用什么药。法师提醒我们：这么聪明的人尚且广学一切，我们有什么资格说「我只要念佛就够了」？"}, {"type": "choice", "stem": "宗喀巴大师改革后的西藏佛教，到今天持续了大约多久？", "options": ["A. 100多年", "B. 300多年", "C. 600多年", "D. 1000多年"], "answer": 2, "explain": "法师明确说：「经过宗喀巴大师这样一次彻底改革以后，西藏的佛教如日中天，到今天已经有六百多年了。」从元末明初到现在六百余年，虽然也在慢慢向下走，但「还保持着非常完整的内容」。一个改革能有六百年生命力，说明宗喀巴不是小修小补，是抓住了根本。"}, {"type": "choice", "stem": "阿底峡尊者是哪个国家的人？", "options": ["A. 西藏人", "B. 汉人", "C. 尼泊尔人", "D. 印度人"], "answer": 3, "explain": "阿底峡尊者是东印度一个大国的王子，出生在宋太宗年间。他从小绝顶聪明、一心想出家。后来到西藏弘法，被称为「第二仁能」（第二个佛）。法师特别强调阿底峡「在印度所有一切的宗派都崇奉他——念佛的跟了他一定成功，参禅的跟了他一定成功」，这才是真正的大圆满。"}, {"type": "choice", "stem": "阿底峡尊者十几岁时做过一件什么事，展示了惊人的智慧？", "options": ["A. 背诵了三藏十二部经典", "B. 听一堂因明课就替老师上阵辩赢外道", "C. 建造了当时西藏最大的寺院", "D. 写了《菩提道次第广论》"], "answer": 1, "explain": "法师讲了一个精彩故事：阿底峡十五岁时听了一堂因明课，当时他的老师正跟外道辩论，辩了好几场不分胜负。老师生病不敢出阵，大家一筹莫展时，阿底峡自动请缨——结果一去就辩赢了！法师感慨：「几岁啊？十五岁哦！要我们现在十五岁什么都不懂哦。」所以聪明不是问题，聪明却老实修才是真本事。"}, {"type": "choice", "stem": "阿底峡尊者到西藏花了多长时间渡海？", "options": ["A. 三天", "B. 十三个月", "C. 三个月", "D. 三年"], "answer": 1, "explain": "阿底峡尊者为了到金洲求法（去学菩提心教授），在海上航行了十三个月。法师用这个例子说明：真正的大善知识为求法是不惜生命的。我们呢？下雨不想去上课、天热不想念经——跟尊者比，我们的「精进」差了多少个量级？"}, {"type": "choice", "stem": "法师说阿底峡尊者掌管多少把印度大庙的钥匙？", "options": ["A. 十八把", "B. 一把", "C. 三百六十把", "D. 一百零八把"], "answer": 3, "explain": "法师说阿底峡尊者「临离开印度到西藏去的时候，不晓得是一百零八把，还是八百把……当年印度大庙所有的钥匙都在他身上，十八部哪一部最彻底圆满认识的就是他。」钥匙代表传承的正宗——小乘大乘、性宗相宗，全都在他手里。这个比喻太形象了：佛法的大门只有一把万能钥匙，那就是圆融。"}, {"type": "choice", "stem": "归敬颂中第一个归敬的对象是谁？", "options": ["A. 释迦牟尼佛", "B. 文殊师利菩萨", "C. 弥勒菩萨", "D. 阿底峡尊者"], "answer": 0, "explain": "归敬颂第一偈：「俱胝圆满妙善所生身，成满无边众生希愿语，如实观见无余所知意，于是释迦尊主稽首礼。」先归敬释迦世尊。法师把身语意三层讲得很妙：释迦牟尼的身不是我们有漏的「痛苦之本」，而是妙善净业感得的圆满之身，所以我们皈依他不是偶像崇拜，是为了学他那样。"}, {"type": "choice", "stem": "弥勒菩萨在传承中代表什么？", "options": ["A. 智慧——深见", "B. 戒律——清淨行持", "C. 慈悲——广行方便", "D. 禅定——止观双运"], "answer": 2, "explain": "法师说得很清楚：弥勒菩萨代表方便（大悲），是「广行」这一支的源头。打个比方：母亲对子女有无限慈悲，但如果只有爱心没有正确的教导方法，就叫「溺爱」——「溺爱的溺，三点水加一个强弱的弱，宠爱反而把子女弄坏了。」所以光有慈悲不够，还得有智慧。弥勒代表了慈悲，文殊代表了智慧。"}, {"type": "choice", "stem": "龙树菩萨和無著菩萨在传承体系中分别代表什么？", "options": ["A. 龙树=戒律，無著=禅定", "B. 龙树=深见（智慧），無著=广行（方便）", "C. 龙树=小乘，無著=大乘", "D. 龙树=密教，無著=显教"], "answer": 1, "explain": "法师说：龙树菩萨代表了文殊大士的深观（智慧），無著菩萨代表弥勒菩萨一系的广行（方便）。这两支就像钢筋水泥——「钢筋加上水泥，水泥加上钢筋，那个房子才造成功很完整的结构」。你把它们拆开？对不起，骨是骨、肉是肉，房子塌了。性宗相宗绝对不能割裂，一割裂就完蛋。"}, {"type": "choice", "stem": "法师用什么比喻说明性宗和相宗不能分开？", "options": ["A. 左手和右手", "B. 父亲和母亲", "C. 太阳和月亮", "D. 钢筋和水泥"], "answer": 3, "explain": "「这个就像钢筋、水泥一样——钢筋加上水泥，水泥加上钢筋，那个房子才造成功很完整的结构。」法师怒斥「性相角立」：很多人把性宗和相宗搞成了牛的兩隻角，各是各的。实际上哪能拆开？钢筋没水泥立不住，水泥没钢筋一压就碎。学佛一样，光偏一边，最终两樣都不是。"}, {"type": "choice", "stem": "法师说「方便出下流」是什么意思？", "options": ["A. 只重慈悲方便而忽视智慧，结果反而堕落", "B. 修行不用太多方法，简单就好", "C. 方便法门是给下等人修的", "D. 念佛是最方便的下手处"], "answer": 0, "explain": "法师说得直白：「偏重方便慈悲的人，不可以忽视智慧……讲处处方便，现在的话叫『方便出下流』，完了！」什么意思？一味讲慈悲、讲方便、讲随缘，讲到最后就不要智慧了，结果是「尽管你一番好心，说我要弘揚佛法，修了半天到地狱里去了！那不修还好！」这话太扎心了——没有智慧的慈悲，比毒药还可怕。"}, {"type": "choice", "stem": "法师讲「师承」的重要性时用了什么比喻？", "options": ["A. 过河要有船，学法要有经", "B. 房子要打地基，修行要拜师父", "C. 汽车要有牌子，佛法要有传承", "D. 看病要找名医，学佛要找明师"], "answer": 2, "explain": "法师说：「世间的所有东西，都有它这样圆满的来源，何况是佛法！」他举例：买车你知道这是福特的、那是宾士的，每个牌子背后都是一群工程师的智慧结晶。「所以我这个牌子哪来的？哦，说这个牌子一点都不错的！」学法也一样，传承师承不是虚的——你的师父的师父的师父能一路追溯到佛本人，这才叫正宗。"}, {"type": "choice", "stem": "阿底峡尊者把哪两个传承统摄到一个人身上？", "options": ["A. 深见和广行", "B. 小乘和大乘", "C. 显教和秘教", "D. 天台和华严"], "answer": 0, "explain": "「攝二大車善傳流，深見廣行無錯謬，圓滿道心教授藏，敬禮持彼然燈智。」「然燈智」即阿底峡。深见=智慧=龙树→文殊；广行=慈悲=無著→弥勒。两条传承到了阿底峡身上汇成一股，圆满无缺。法师解释为什么不在两个人身上分开而要合到一个人：因为分开久了会偏向——「偏重智慧的人往往把方便忽视；偏重大悲的人会把智慧忽视」，必须合起来才能圆融。"}, {"type": "choice", "stem": "「今勤瑜伽多寡聞，廣聞不善於修要」描述的是哪两种偏差？", "options": ["A. 学密不学显，学显不学密", "B. 参禅的不念佛，念佛的不参禅", "C. 讲经的不讲戒，持戒的不讲经", "D. 修行的不学教理，学教理的不修行"], "answer": 3, "explain": "这是宗喀巴大师造本论的核心动机。第一种人：「我要修行，学那么多干嘛？」——结果盲修瞎炼。第二种人：「我要广学多闻」——结果变成了「空口说白话」，拿高标准当照妖镜照别人，唯独不照自己。法师痛心：「讲修行的人不要多听闻，不要多懂道理，而道理本身是告诉你为什么要修行、如何去修行的！」不懂道理怎么修？瞎猜呗。"}, {"type": "choice", "stem": "法师讲「看破放下自在」时，为什么说很多人自以为懂了其实没懂？", "options": ["A. 因为他们不去庙里修行", "B. 因为他们看破的是世间名利的「看破」，而不是生死根源的「看破」", "C. 因为他们没有出家", "D. 因为他们没有师父"], "answer": 1, "explain": "法师以自身经验自嘲：刚看到「看破放下自在」六个字，「啊，美啊！懂了！」结果呢？「看破的是股票稍微放掉一点，儿女的事情稍微减轻一点，但心里还缠在这个地方。」想拿这六个字跳出轮回？门都没有。文字懂了不等于你真懂了，「看破」两个字小学生都认识，但生死根本你看破了没？「我」还在那里算个啥？"}, {"type": "choice", "stem": "《法华经》和《华严经》都是圆教经典，但成佛速度差别有多大？", "options": ["A. 差距不大，一个快几年一个慢几年", "B. 《法华》快，《华严》慢", "C. 《法华》→舍利弗还需无量阿僧祇劫成佛；《华严》→善财童子一生取办", "D. 两部经说的成佛时间完全一样"], "answer": 2, "explain": "法师对比两个圆教经典：舍利弗——「大智」、佛弟子中智慧第一、无量劫跟佛——尚且需要供养两百万恒河沙诸佛才能成佛。而善财童子「十信满心」就能一生取办。差距是多少？「天文数字，天文数字都无法形容！」关键不在于两部经谁高谁低，而在于：你有没有遇到圆满的教授。有→善财路子；没有→舍利弗路子，中间时间全在三恶道受苦。"}, {"type": "choice", "stem": "「化城喻品」中，佛陀为什么要变现一个城？", "options": ["A. 让大家休息一下，再继续走", "B. 因为成佛太远，给大家一个中间目标", "C. 考验弟子的信心", "D. 显示神通"], "answer": 0, "explain": "法师用最通俗的语言讲：去远方求宝，路太长，大家又渴又热又累想退心。佛陀就现一个化城：「到了到了！」大家进了城吃饱喝足，佛陀说：「还没到哦，下面还有路哦！」这时大家精神振作了，继续走。这个比喻说明：佛说的小乘（罗汉果）就是化城——先让你不要退心，真正的目的地是成佛。可惜很多人到了化城就不走了，以为到了终点。"}, {"type": "choice", "stem": "舍利弗在《法华经》的华严会上听法时是什么状态？", "options": ["A. 醍醐灌顶，大开圆解", "B. 睡着了", "C. 边听边记笔记", "D. 如聋如啞，聽不曉得說什麼"], "answer": 3, "explain": "法师说佛第一时讲《华严》时，「大智如舍利弗坐在华严会上，听《华严经》是如聋如哑，听不晓得他说些什么东西」。连智慧第一的舍利弗都听天书，何况我们？法师又举一例：带小孩子去盛大宴会，回来问他看见什么——「巧克力糖。」大人呢？看见的是政治领袖发表伟论。根器不同，看到的世界完全不同。所以不要用你的小脑袋妄测佛的境界。"}, {"type": "choice", "stem": "法师说有人「闭门造车」，但学佛的人经常连什么程度都不到？", "options": ["A. 连车轱辘都没见过", "B. 车上路但是逆向行驶", "C. 造了车但没上路", "D. 「在门外空转，门都没摸到」"], "answer": 3, "explain": "法师的原话：「我们中国有一句话叫『闭门造车』，现在不是，门都没摸到，乃至于是什么？在原地踏步，我们自己觉得在修学佛法。」「修了半天，不是修的佛法，是修的『我』，把那个『我』越弄越大。」这就是为什么很多人念佛越念烦恼越重——念的是佛号，养的是我执。"}, {"type": "choice", "stem": "法师讲「照妖镜」比喻时，说的是修行人常见的什么毛病？", "options": ["A. 老觉得自己修行不如别人", "B. 太容易被外界干扰", "C. 拿佛法高标准照别人，唯独没照到自己", "D. 不善于辨别正邪"], "answer": 2, "explain": "「末法的时期叫斗诤坚固」，为什么？因为学了佛法，认识了更高的标准，拿这个来照别人：「天底下所有的人是妖魔鬼怪」——只剩一个没照到：自己。法师说这就像个照妖镜，本来是用来净化自己的，结果用错了方向。「我是越弄越大」就是从这里来的。所以法师反复强调：佛法用来衡量的第一对象是自己，不是别人。"}, {"type": "choice", "stem": "法师用「烧饭」比喻质、量、次第三个要素，其中次第乱了的后果是什么？", "options": ["A. 菜里面还有泥巴农药，「不但不增加营养，还把你毒死」", "B. 饭还能吃，只是口感差", "C. 味道不好但营养还在", "D. 只是浪费时间，没其他问题"], "answer": 0, "explain": "法师的原比喻：质=米不能是泥沙（蒸沙煮饭不行），量=几个人吃多少要够，次第=不能先烧再洗。「菜从田里拔出来，烧完了再洗——里面都是泥巴，还有农药，你吃下去，本来给你营养的，反而把你毒死。」修行也一样：道理对（质）、功夫够（量）、次序不能乱（次第）——三个缺一不可。现代人最容易犯的就是次第错乱，好高骛远。"}, {"type": "choice", "stem": "法师讲「拆房子重建」比喻什么？", "options": ["A. 修行遇到了瓶颈", "B. 寺庙年久失修需要翻新", "C. 没有总体规划，每次升级都得推倒重来", "D. 出家人要舍弃旧生活重新开始"], "answer": 2, "explain": "法师说很多人修行像盖房子：「造一层的时候觉得马马虎虎，造了再说。要造二层，还可以；造到三层的话，把三层全部拆光，地基重来。造到四层五层，又全部拆光全部重来。」这就是没有一开始就规划好「摩天大厦」的后果。法师说正确的做法：「先把基础稳固——虽然现在没力量造摩天大厦，但没关系，我一步步来，从基础造好，然后一层一层上去。」有规划的人生不返工。"}, {"type": "choice", "stem": "法师说的「茅篷」和「摩天大厦」对比，重点不在规模，而在什么？", "options": ["A. 茅篷是为自己修，大厦是为佛法整体弘扬——但大厦要有完整规划", "B. 茅篷省钱，大厦费钱", "C. 茅篷住着舒服，大厦住着不安心", "D. 茅篷象征小乘，大厦象征密教"], "answer": 0, "explain": "个人修茅篷没问题——门一关，拜佛吃饭睡觉都在里面，修行成功就行。但弘扬佛法不能只靠茅篷——得有大殿、寮房、大寮等完整配套。法师的核心洞察是：不管是茅篷还是大厦，「一开始要有完整规划」。盖茅篷不用想那么多，但你要知道最终目标是大厦的话，你现在盖的每一步都会为将来打基础。这就是为什么学广论——先看全貌，再选一门深入。"}, {"type": "choice", "stem": "「三士夫」指的是哪三种修行人？", "options": ["A. 出家人、在家人、居士", "B. 下士、中士、上士", "C. 声闻、缘觉、菩萨", "D. 比丘、比丘尼、沙弥"], "answer": 1, "explain": "「往趣一切种智地位胜士法範，三种士夫，一切行持，所有次第，无所缺少。」法师解释下士、中士、上士「就像我们念书一样，小学、中学、大学」。每个人的目标都是成佛（一切种智），但根据根器不同，修行的起点和路径有层次之分——不是佛法有高低，是人有不同起点。这个三士道的架构就是本论最核心的骨架。"}, {"type": "choice", "stem": "论前应具有哪三样东西才算「三門清淨」？", "options": ["A. 身清净、口清净、意清净", "B. 轨範語淨、学者相續淨、所说清淨", "C. 信清淨、解清淨、行清淨", "D. 戒清净、定清淨、慧清淨"], "answer": 1, "explain": "那兰陀寺的传承标准：「一、轨範語淨——老师自己修持清净，所讲之法也清净；二、学者相續淨——听的人根器要够；三、所说法清淨——法本身要圆满，不能只讲局部。」法师特别提醒第三点：就算是大乘法，《金刚经》偏讲空、《楞严》偏讲有——单独拿出来都不算圆满。必须是能从小乘到大乘到密乘、从凡夫到佛地全涵盖的，才算圆满教法。"}, {"type": "choice", "stem": "法师用小乘戒来说明什么道理？", "options": ["A. 小乘戒比大乘戒更严格", "B. 没有小乘戒的基础就没有菩萨戒，修大乘不能丢小乘根本", "C. 小乘戒已经过时了", "D. 学密乘可以不守小乘戒"], "answer": 1, "explain": "「没有小乘的基本的戒就没有菩萨戒，没有菩萨戒就没有金刚乘的三昧耶戒。」法师拿阿底峡尊者为例：这位大成就者学戒时「无所不通，四个根本部、二十部派分得清清楚楚」，持戒时「最细微的戒绝不有犯」。那些说「我是大乘的，小乘不要」的人，等于说「我要盖三楼，地基不要」——楼没盖起来就塌了。"}, {"type": "choice", "stem": "法师说「瞎子摸象」的比喻说明什么问题？", "options": ["A. 每个学佛的人都摸到了一部分佛法，但不能以偏概全", "B. 人人都有佛性，只是被遮蔽了", "C. 盲修瞎炼也能有点成就", "D. 修行像摸象，全靠运气"], "answer": 0, "explain": "「像瞎子摸象一样——是的，我们摸到了象，可是我们毕竟是瞎子，摸到一部分！」摸到腿说象是柱子，摸到耳朵说象是扇子——每个都对局部，但每个都错在整体。学佛也一样：你念佛是对的，但说「只有念佛对，其他都不行」——这就是摸到了象腿就说整头象都长这样。法师说正确的态度是：「应该有一个认识是摸到了象，千万要想办法多体会、多听闻，了解全貌，不要执着于自己。」"}, {"type": "choice", "stem": "法师讲「般舟三昧」的故事中最震撼的细节是什么？", "options": ["A. 每天走二十小时，腿肿得按下去一个洞不弹回来", "B. 在走的过程中见到佛", "C. 三个月就大彻大悟", "D. 一边走一边念佛号"], "answer": 0, "explain": "法师讲述了一个他认识的修行人闭般舟三昧的经历：「那个手按下去，手指拿掉，一个洞，就不回来了。」脚肿→大腿肿→下半身全肿。还有：累得靠在墙上「一靠就睡着了，睡着了就咚跌下来」。法师用这个故事说明：真正的修行是极苦的，不是念两句佛号就觉得「我在修行」。而更关键的是——这样苦行还「离开开悟远得很」。知道这个尺度，才不会把一点点轻安体验当成了不起的境界。"}, {"type": "choice", "stem": "法尊法师在本论中的地位是什么？", "options": ["A. 《菩提道次第广论》的作者", "B. 将《菩提道次第广论》从藏文译为汉文的翻译者", "C. 宗喀巴大师的弟子", "D. 阿底峡尊者的传承者"], "answer": 1, "explain": "法师高度评价：「真正到西藏去学藏密的还是有一堆人，而这个里边，结果对目前介绍这个藏密过来的，最了不起的一个大功臣，就是那『（法）尊法师』。」本论从藏文变成汉文，法尊法师是头号功臣。宗喀巴造论，法尊翻译，日常法师讲解——一个千年的佛法宝藏，要经过多少代人的接力才能到我们手上。我们如果不珍惜，对得起谁？"}, {"type": "choice", "stem": "西蕆佛教史的顺序应该是？", "options": ["A. 莲花生→松赞冈布→阿底峡→宗喀巴", "B. 松赞冈布→赤松德贞→莲花生→朗达玛灭佛→阿底峡→宗喀巴", "C. 宗喀巴→阿底峡→莲花生→松赞冈布", "D. 阿底峡→宗喀巴→松赞冈布→莲花生"], "answer": 1, "explain": "法师是按照时间线讲的：松赞冈布（唐初）奠基→赤松德贞请静命大师和莲花生大士→朗达玛灭佛（毁掉一切）→一百多年黑暗期→阿底峡尊者入藏（宋初）→三百多年后宗喀巴大师（元末明初）再改革。整个西藏佛教史就是一部「有了传承就兴盛、断了传承就衰败」的兴衰史。"}, {"type": "choice", "stem": "法师说阿底峡尊者最后去西蕆的时候，印度大庙的上座怎么说？", "options": ["A. 「你走了我们寺院就没人了」", "B. 「印度是佛教宗主国，你一走，印度佛法就完了」", "C. 「你去西蕆三年必须回来」", "D. 「带我去吧」"], "answer": 1, "explain": "那兰陀寺（或尸羅寺）的大上座对来请阿底峡的西藏人说：「如果阿底峡尊者一走的话，我们印度佛法就完了！」注意——「那个时候有这么多大善知识，居然说阿底峡尊者一走印度佛法就完了。」这说明阿底峡不是一般的大德，而是「能仁第二」——第二个佛。一个人决定一个国家的佛法存亡，这叫传承中轴。"}, {"type": "choice", "stem": "综观本论的整个架构，日常法师最核心想传达的讯息是什么？", "options": ["A. 念佛就是最好的修行法门", "B. 学佛要先对整个教法有圆满认识，再选一门深入", "C. 西藏的佛法比汉地更殊胜", "D. 要学密宗才能成佛"], "answer": 1, "explain": "法师反复强调：「我在这个本论一开头说明，我并不是建议大家要学哪一个宗派或者哪一个法门，完全不是！……一开头的时候，先心平气和、耐下心来，把佛要告诉我们的正确圆满的教法认识，然后你再开始一口气走的话，这就是一生取办。」这就是说：先看清楚地图，再决定走哪条路——不是不让你念佛，是让你念得对、念得上去、念到上品上生。"}]};

quizData.daobase = {"title": "道前基础", "questions": [{"type": "choice", "stem": "你去听一场讲座，手机屏幕朝下扣在桌上、心里默念「这老师讲得好烂」、还频繁刷短视频——按《广论》的「断器三过」，你同时犯了哪几个？", "options": ["A. 覆器——心不专注，纯属过客", "B. 污器——心存邪执，自带偏见滤镜", "C. 漏器——听完即忘，左耳进右耳出", "D. 三过全占，一场讲座白来"], "answer": 3, "explain": "《广论》以器皿喻闻法者：覆器如杯口朝下，天降甘露不入——对应听法时「不属耳」、心散乱；污器如杯中有垢，甘露被染——对应「邪执等起心有过失」、带偏见；漏器如杯底穿孔，甘露不住——对应「由妄念等之所失坏」、听过就忘。你三样全占了，等于白听。《广论》引《听闻集》云：「听闻随转修心要，少力即脱生死城」，闻法之利如此巨大，把手机收起来认真听吧！"}, {"type": "choice", "stem": "《广论》说听法要「依六种想」，其中第一种是「于自安住如病想」。这里的「病」指的是什么？", "options": ["A. 感冒发烧，得赶紧找医生", "B. 贪瞋痴三毒，是无始以来的「慢性绝症」", "C. 社会内卷导致的精神内耗", "D. 佛法难闻的「营养不良症」"], "answer": 1, "explain": "《广论》引《入行论》云：「若遭常病逼，尚须依医言，况长遭贪等，百过病所逼。」这里的「病」指贪瞋痴三毒烦恼病。宗喀巴大师说我们是被三毒「极大的干病」逼迫着，却「竟无能知自是病者」——这才是最可怕的！迦摩巴说普通人感冒都会赶紧看病，我们被烦恼折腾了无量劫，却从不觉得自己有病。六想的后五个是：说法师是医生、教授是药方、修行是服药、如来看作善士、愿正法久住。整套就是把学佛当成治病救人来看！"}, {"type": "tf", "stem": "《广论》认为，只要遇到好的善知识，弟子什么条件都不用具备，自然能学成。", "answer": false, "explain": "大错特错！《广论》明确说「能依学者之相」必须具备三个条件：正住（不堕党类）、具慧（能辨别善恶正邪）、希求（对上求正法有广大的渴望）。原文说「纵得完具一切德相知识，然于其师亦难了知。若知彼已能亲近者，必须自具是诸德相。」翻译成大白话：给你配个最好的师父，你自己不是那块料，也白搭。就像给不爱运动的人请了一流的健身教练——他根本不会去练。善知识是外缘，内心品质是内因，缺一不可。"}, {"type": "choice", "stem": "《广论》说的善知识「十德相」里，前三德是调伏（戒）、寂静（定）、近寂静（慧），这三者的关系像什么？", "options": ["A. 就像驾照三科，科一、科二、科三平行考，没有先后", "B. 就像健身的三层金字塔：先能控制行为（戒），再内心平静（定），最后产生真实智慧（慧）", "C. 就像选修课，选一个拿手的方向就够了", "D. 就像米其林评级，拥有任意一个即算合格"], "answer": 1, "explain": "《广论》说「自未调伏，而调伏他，无有是处。故其尊重能调他者，须先调伏自类相续。」翻译：自己都没搞定自己，还想搞定别人？不可能的！三学层层递进：尸罗（戒）如驯烈马的衔铁，把狂奔的心马给管住了→寂静（定学）依念正知令心内寂静住→近寂静（慧学）依奢摩他观择真义。三者是次第增上关系，就像健身先会基础动作、再稳定核心、最后才上大重量。一个连自己情绪都管不住的老师，说能带你了脱生死——你敢信？"}, {"type": "choice", "stem": "弟子对善知识应该「视师如佛」，但《广论》也说「不应随便授其鼻肉」。这两句话矛盾吗？", "options": ["A. 矛盾，一篇经文自打脸", "B. 不矛盾——「视师如佛」前提是先观察确认是具德之师，不是随便谁都能交托", "C. 要看心情，心情好就视师如佛", "D. 「鼻肉」是比喻要给师父上供的意思"], "answer": 1, "explain": "完全不矛盾！《广论》原文：「于其德前乃可施行，任于谁前不能随便授其鼻肉。」「授鼻肉」是藏地俗语——牛鼻子被穿了绳就任人牵着走。比喻不能随便对谁都不加分辨地盲从。「视师如佛」是有前提的：先观察善知识是否具足十德相，确认后再依止，这才修信为根本、视师如佛。宗喀巴大师非常清醒：先观察、再确认、再依止。这不是自相矛盾，而是既防盲从又防邪信的精妙设计——观察阶段你得擦亮眼，依止之后你得放下审视心。"}, {"type": "tf", "stem": "根据《广论》，如果不善依善知识，最严重的后果是「功德未生不生，已生退失」，而且会堕入恶趣。", "answer": true, "explain": "正确。《广论》「未依过患」一节明确列出：未依止善知识，于现世中遭疾疫非人损恼，于未来世堕恶趣经无量劫受大苦。《现在佛现证三摩地经》云：「若彼于师住嫌恨心，或坚恶心，或恚恼心，能得功德，无有是处。」又说未生功德不会生起，已生功德也会退失。更可怕的是《金刚手灌顶续》说谤师者住无间等极苦地狱。但要注意——这不是恐吓，而是指出因缘法则：断了善知识这个最关键的增上缘，修行这条船就直接搁浅了。"}, {"type": "choice", "stem": "「暇满人身」到底有多难得？《广论》用了一个著名的比喻来让人感受——这个比喻是？", "options": ["A. 半山腰悬崖上抓一棵救命稻草", "B. 盲龟在茫茫大海中，一百年才浮出水面一次，恰巧把脖子伸进一块漂流的木板孔里", "C. 猴子在键盘上乱敲打出一本《哈姆雷特》", "D. 沙漠里挖出一瓶82年的拉菲"], "answer": 1, "explain": "《广论》引《入行论》云：「是故薄伽梵，说人极难得，如龟项趣入，海漂轭木孔。」这就是著名的「盲龟值木喻」——一只瞎眼海龟每百年才浮上海面一次，茫茫大海中漂着一块有孔的轭木随波逐流，龟头恰好伸进孔中，这概率有多低？得暇满人身比这还要稀罕！而且《广论》还用「爪上尘vs大地土」的对比：从恶趣死能生善趣者如指甲缝里的灰，继续留在恶趣的如大地的泥土。听完这个，你还敢说「今生先享乐，来生再修行」吗？"}, {"type": "choice", "stem": "《广论》列出的「八无暇」包括：地狱、饿鬼、旁生、长寿天、边地、根不具、邪见、无佛出世。假设你是一个整天吃喝玩乐的欲界天人，为什么也算「无暇」？", "options": ["A. 因为天人寿命太长，太无聊了", "B. 因为欲界天人「常为欲事散乱」，太快乐了根本想不起来修行", "C. 因为天人没有佛法可听", "D. 因为天人不具备人类的身体"], "answer": 1, "explain": "《广论》引《八无暇论》指出：长寿天中的欲界天「常为欲事散乱」，被五欲享乐给缠住了。《亲友书释》说：「此八处中，以无闲暇，修作善品，故名无暇。」无暇——不是没空喝咖啡，是没法修行！太苦不行（地狱饿鬼旁生被苦逼着没法修），太乐也不行（天人乐不思修）。就像一个人天天泡在迪士尼，哪有心思去想「人生意义」？所以人类是修行的最优配置——不太苦也不太乐，恰好能产生出离心。你能读这段话本身就是暇满的铁证！"}, {"type": "choice", "stem": "「十圆满」分「五自圆满」和「五他圆满」，以下哪一项属于「五他圆满」？", "options": ["A. 生为人道、地处中土、六根具足", "B. 佛降世、说正法、教法住世、随教转、有悲愍者", "C. 业未倒（没造五无间罪）、信依处（信三藏是白法根本）", "D. 身体健康、经济自由、时间充足"], "answer": 1, "explain": "B是五他圆满——环境层面的条件，靠自己搞不定，得依靠他人或时代因缘。A是自圆满的前三条（人、生中、根具），C是自圆满的后两条（业未倒、信处）。《广论》明确：「此五属于自身所摄，是修法缘，故名自满......此五属于他身所有，是修法缘，故名他满。」自圆满是你自己的配置（身体、智力、信仰、行为），他圆满是时代给你发的外部buff（有没有佛出世、佛法还在不在、有没有人教你、有没有人供养你）。你生而为人、脑子好使、没造五逆——这是你手里的牌；但你还得赶上佛法住世的时代、有人教你、有人支持你——这才是王炸组合！"}, {"type": "tf", "stem": "《广论》说的「暇满义大」，意思是拥有暇满人身主要可以用来升职加薪、走上人生巅峰。", "answer": false, "explain": "大错特错！《广论》「明其义大」一节说：「若未清净修习正法，仅为命存以来引乐除苦而劬劳者，旁生亦有！」翻译：如果人生只用来吃喝玩乐、解决温饱，那你跟动物有什么区别？动物也会觅食避险！暇满的「义大」在于它能成办「决定胜」（解脱成佛）和「增上生」（后世增上善趣）二种大义。《弟子书》云：「善逝道依将成导众生，广大心力人所获得者，此道非天龙得非非天。」这条成佛之道，天人龙族都无缘，唯有人能得。拿暇满人身换工资涨两千——相当于拿兰博基尼去送外卖。"}, {"type": "choice", "stem": "《广论》的「三士道」框架中，下士道追求什么？中士道追求什么？上士道追求什么？", "options": ["A. 下士求升官发财、中士求环球旅行、上士求宇宙真理", "B. 下士求来世人天善趣、中士求个人解脱轮回、上士求成佛度一切众生", "C. 下士修气功、中士修禅定、上士修神通", "D. 下士是小学、中士是初中、上士是高中"], "answer": 1, "explain": "《广论》三士道框架非常清晰：下士道修死无常、三恶趣苦、皈依三宝、深信业果，所求是「来世不堕恶趣，生于人天善趣」；中士道修四圣谛（苦集灭道）、十二缘起，所求是「个人从轮回中解脱」，出离心为主；上士道修菩提心、六度四摄，所求是「成佛普度一切众生」。重点是「共」字——共下士道不仅是下士修，中士、上士也要修，因为谁都不想堕恶趣嘛！原文说得好：「若趣上上三乘五道，必须完具下下乘道功德种类。」大白话：想考研（上士道）？先把高中的（下士道）和本科的（中士道）给我搞定！"}, {"type": "choice", "stem": "《广论》说「若未清净修习正法，仅为命存以来引乐除苦而劬劳者，旁生亦有。」这句话换成现代比喻，最贴近的是？", "options": ["A. 你每天朝九晚五只为还房贷吃饭，跟一只搬面包屑回窝的蚂蚁没有本质区别", "B. 森林里的猴子也会摘水果，所以人类不该吃饭", "C. 动物也有快乐，人类不该追求快乐", "D. 旁生比人类更会生活"], "answer": 0, "explain": "《广论》这句话极其犀利——你辛苦搬砖一生，如果终极目的只是「活下去+舒服点」，那蚂蚁搬家、蜜蜂采蜜也在干同样的事！原文出自《弟子书》：「犹如象儿为贪著，深阱边生数口草，欲得无成堕险坑，愿现世乐亦如是。」大象为了吃井口的几根草而跌落深渊——我们为了眼前那点薪水、那点享乐，把能成佛的暇满人身给糟蹋了，跟那头傻象有什么两样？暇满的意义在于修行正法——不是让你不工作，而是让你在基本的生存之外，别忘了来这人间的真正原因是什么。"}, {"type": "choice", "stem": "《广论》「修持轨理」中说的「加行六法」，第一法是什么？", "options": ["A. 马上开始冥想打坐", "B. 洒扫住所、陈设佛像供品", "C. 念诵经文一百遍", "D. 发朋友圈告知今天要修行了"], "answer": 1, "explain": "《广论》明确说「初加行法有六，乃是金洲大师传记。」第一法：「善洒扫所住处所，庄严安布身语意像。由无谄诳求诸供具，端正陈设。」把屋子打扫干净，把佛像、经书、佛塔摆好，用真诚的心准备供品布置好。然后是归依发心、观想资粮田、修七支供（礼敬、供养、忏悔、随喜、请转法轮、请佛住世、回向）、供曼陀罗、祈祷。六加行全程其实就是「正式修行前的热身」——就像健身前拉伸，弹琴前调音。不经热身直接上强度，容易拉伤；不经加行直接入正修，容易散乱。"}, {"type": "choice", "stem": "《广论》「正行」部分区分了「观察修」与「止修」。以下哪个说法符合《广论》的观点？", "options": ["A. 真正的修行只有止修——放空大脑，什么也不想", "B. 真正的修行只有观察修——不断思维法义", "C. 两者都不可或缺，该观察的时候观察，该止住的时候止住", "D. 观察修是闻思阶段的事，修行阶段只应止修"], "answer": 2, "explain": "《广论》花了大量篇幅破斥「修行只应止修」的邪见。原文：「故以数数观察而修，及不观察住止而修，二俱须要。」宗喀巴大师甚至说：「若许一切修习皆止修者，如持一麦说一切谷，皆惟是此，等同无异」——你拿一粒麦子就说所有谷物都是麦子，糊涂透顶！具体什么时候用哪种？修信心、暇满、无常苦、业果、菩提心——这些需要让心「猛利恒常变改其意」的，就得观察修（反复思维）；修止（三摩地）时需要心住一所缘，就得止修。二者像炒菜的火功和调料——缺火功菜不熟，缺调料菜没味，你非得说「做菜只能用火」？"}, {"type": "choice", "stem": "《广论》破斥「支那和尚堪布」的什么邪见？", "options": ["A. 认为只需诵经不需要持戒", "B. 认为一切分别都是「相执」，障碍成佛，应舍弃一切观察修", "C. 认为出家人不需要供养", "D. 认为密宗高于显宗"], "answer": 1, "explain": "《广论》明确指出：「又说一切分别是相执故，障碍成佛，弃舍一切观察之修，此为最下邪妄分别，乃是支那和尚堪布之规。」这位「支那和尚」指的是唐代入藏的禅宗僧人大乘和尚（摩诃衍），他主张「无想无念、不起分别」，完全否定观察思维的作用。宗喀巴大师借用比喻驳斥：如金匠打金，先火烧去垢、再水洗润泽，才能打造成首饰——观察修就像火烧水洗的过程，去除内心垢秽、令心对善法润泽，然后才堪能安住于止修。「不经过思维抉择就直接想什么都不想，那不叫修行，叫发呆。」"}, {"type": "choice", "stem": "《广论》说未修中间（两座正修之间）应「修习四种资粮」来引发止观的正因。这四种资粮不包括以下哪一项？", "options": ["A. 密护根门——守护六根，不被境界牵引", "B. 正知而行——行住坐卧时刻带着正知", "C. 饮食知量——吃饭不过量、不贪著", "D. 背诵佛经十小时不间断"], "answer": 3, "explain": "《广论》原文：「复应学习四种资粮，是易引发奢摩他道、毗钵舍那道之正因，所谓密护根门，正知而行，饮食知量，精勤修习悎寤瑜伽。」四种资粮中没有「死记硬背十小时」，那是内卷不是修行。有意思的是四种资粮里还包括「怎么睡觉」！《广论》说应当右侧卧如狮子卧，带着光明想、正念、正知和起想入睡。为什么要这样睡？原文：「法尔令身，能不缓散，虽睡沉已，亦不忘念，睡不浓厚，无诸噩梦。」翻译：你这么睡，睡着了都不散乱、不做噩梦、能早起。修行不是只在蒲团上那几十分钟，下座后怎么吃饭、怎么走路、怎么睡觉——全部算在修行账上！"}, {"type": "choice", "stem": "《广论》说正修时的「完结」（回向）非常关键。以下哪个比喻最能说明其重要性？", "options": ["A. 吃完饭要买单，修行完要回向", "B. 把一滴水放进大海，只要大海不干，这滴水就永远存在", "C. 考完试要交卷，修完行要回向", "D. 写完代码要git commit，修完行要回向"], "answer": 1, "explain": "《广论》回向支说：「以上六支善，表举所有一切善根，悉与一切有情共同，以猛利欲乐回向令成大菩提因，永无罄尽。」又说：「其回向者，是使积集，净治长养诸善，虽极微少，令增广多。又使现前诸已感果将罄尽者，终无穷尽。」一滴水放在空气中，很快就干涸了；放进大海，跟大海同体，永不干涸。同理，修行的善根不做回向，就像沙滩上的字，一阵风吹没了；回向一切众生共成佛道，就是把这一滴水倒进成佛的大海，功德世世不尽。这跟git commit还不一样——git只能保存，回向可是增长+保存双buff！"}, {"type": "tf", "stem": "根据《广论》，初学者修行应该「一次坐很久」，因为修行时间越长效果越好。", "answer": false, "explain": "正好相反。《广论》「完结」一节说：「此复初修，若时长久，易随掉沉自在而转。此若串习，极难医改，故应时短，次数增多。」初学者一坐三小时，大概率掉举（心浮散乱）或昏沉（睡着了），养成恶习后极难改。正确做法：短时间、高频率——像练俯卧撑一样，与其一次做100个动作变形养成坏习惯，不如一次做10个、一天做10组。甚至《广论》还引了句幽默的话：「有欲修心，即便截止，则于后次心欲趣入。若不尔者，见座位时，即觉发呕！」翻译：修到还有点意犹未尽就停，下次你会期待上座；如果每次修到想吐，看到打坐垫就想逃走——这不就是被卷怕了的学生看到教室就想呕吗！"}, {"type": "choice", "stem": "恭喜你穿越了！眼前是15世纪西藏色拉寺的辩经场，一群僧人在讨论：阿底峡尊者究竟凭啥被尊为「造者殊胜」？以下哪项关于尊者的描述是真实的？", "options": ["A. 尊者21岁前就精通了内明、因明、声明、医方明、工巧明等五明，外道跟他辩论后当场怀疑人生", "B. 尊者在印度时当过18个大寺院的住持（「尊居十八部一切顶中时」），各派都把他当至宝", "C. 尊者曾经三次在金刚座大菩提寺用法战击败外道，狮吼声一出对方「脑浆崩」（辩论溃败的比喻）", "D. 以上全是"], "answer": 3, "explain": "三项都对！阿底峡尊者的「造者殊胜」不是随便说的。据《八十赞》记载，尊者21岁内善巧六十四种技艺及五明（A对），辩论所向披靡。他在印度的声望极高，「尊居十八部，一切顶中时」——摩羯陀境内所有寺院都奉他为顶严（B对）。他还三次在胜金刚座大菩提寺以法战败外道，「以狮吼声语，一切脑浆崩」是比喻辩论大胜（C对）。广论先讲「造者殊胜」就是为了证明这个法源清净——说此道的人不是一般人，是真正通达教证二法的大善知识。"}, {"type": "choice", "stem": "阿底峡尊者为了求菩提心教授，坐船多久到了什么地方？这段故事说明了什么？", "options": ["A. 坐船3个月到斯里兰卡，向龙树菩萨求中观——说明中观最重要", "B. 坐船13个月到苏门答腊（金洲），向金洲大师求法——说明为了正法可以跋山涉海", "C. 骑马走了3年到中原，向玄奘大师学唯识——说明唯识最重要", "D. 步行了10年到尼泊尔，向莲花生大师求密法——说明密法最重要"], "answer": 1, "explain": "尊者赴金洲（今苏门答腊）求法，海上航行长达13个月。金洲大师持唯识宗见，与尊者后来持的中观见不同，但尊者始终视金洲大师为「诸尊重中无能匹者」。为什么？因为尊者的大乘菩提心教授、大乘道整体次第都是从金洲大师处获得的。这说明「见」可以有胜劣（中观比唯识究竟），但「恩」不能忘——法的整体次第和菩提心传承才是根本。这也是广论「通达一切圣教无违」的活榜样：不同宗派见解并非水火不容。"}, {"type": "choice", "stem": "广论开头先讲「造者殊胜」再讲「法殊胜」，宗喀巴大师这样安排的逻辑是什么？", "options": ["A. 跟现代卖课的逻辑一样——先把你讲师的履历吹一遍，让你觉得值", "B. 纯属偶然，宗大师写到一半发现忘了介绍作者，临时补上的", "C. 因为「法根源净」——如果造者本人不清净，那法再漂亮也没用。造者殊胜→信心生起→法殊胜→更珍惜", "D. 为了让读者知道阿底峡是个印度人，证明藏传佛法不是藏人自己编的"], "answer": 2, "explain": "广论科判明确说：「为显其法根源净故开示造者殊胜」。这不是现代营销套路，而是止迦摩啰室啰（超戒寺）的传统——讲法前先说「正法造者殊胜、正法殊胜、如何讲闻法规理」。法的清净来自传承的清净：如果造论者自己没证量、没传承，那法就是空中楼阁。先让你知道阿底峡尊者的功德——他通达五明、戒定慧圆满、诸本尊摄受——你对这法才会产生真实的敬重心。有了这份敬重，「法殊胜」才能入心，不是知识灌输而是内心转化。"}, {"type": "choice", "stem": "广论讲「法殊胜」有四个，被称为「四殊胜」。假设你在色拉寺的课堂上打瞌睡被老师点名，老师问：「四殊胜」是啥？", "options": ["A. 通达一切圣教无违、一切圣言现为教授、易于获得胜者密意、极大罪行自趣消灭", "B. 殊胜的食材、殊胜的火候、殊胜的刀工、殊胜的摆盘", "C. 殊胜的智慧、殊胜的慈悲、殊胜的方便、殊胜的神通", "D. 殊胜的发心、殊胜的正行、殊胜的回向、殊胜的证果"], "answer": 0, "explain": "四殊胜是广论的核心卖点之一！①「通达一切圣教无违」：显密、大小乘、各宗各派都是成佛之道的一部分，互不矛盾；②「一切圣言现为教授」：所有佛经不是拿来供着念着玩的，而是可以直接拿来修的实修指南；③「易于获得胜者密意」：靠自己啃经论几十年也未必懂，但依着广论的教授能快速通达佛的密意；④「极大罪行自趣消灭」：懂了前三者，就不会再犯谤法罪——觉得这经好那经不好——罪业自然消失。"}, {"type": "choice", "stem": "师兄跟你说：「学大乘就够了，小乘的东西太低劣不需要学！」作为刚学广论的人，你应该怎么回应？", "options": ["A. 「有道理！大乘包含小乘，学了也没坏处，你先帮我把小乘的书烧了吧」", "B. 「不对！根据「通达一切圣教无违」，大乘道包含共道和不共道，小乘所说诸道是共道部分，大乘人要修真菩萨道必须遍学三乘。说不学小乘的，是相违因！」", "C. 「你说得对，但佛陀当年也是先讲小乘的，给个面子学一下吧」", "D. 「学不学无所谓，反正我修的是密法，密法超越显教，不用管那些」"], "answer": 1, "explain": "广论明确破斥这种观点！原文说「是大乘人故，不应学习劣乘法藏者，是相违因」。为什么？因为要度众生，你得懂三乘之道——声闻乘、独觉乘、菩萨乘都要通达，才能对不同根机的众生说法。而且大乘道不全是「不共」的，相当一部分是跟小乘「共」的（如戒律、止观基础）。只学不共、舍弃共道，就像盖高楼不打地基。连密咒乘都要受三昧耶时发誓「无余受外密，三乘正妙法」，你显教的反而排斥小乘？"}, {"type": "choice", "stem": "广论说「极大罪行自趣消灭」中的「极大罪行」指的是什么罪？为什么说它「极大」？", "options": ["A. 杀生罪——因为杀生断众生命根，罪业最大", "B. 淫欲罪——阻碍修行成道，是最大障碍", "C. 谤法罪——觉得「这经好那经不好」「这是菩萨学的这不是菩萨学的」，这等于谤佛谤法谤僧，比毁一切塔、杀尽阿罗汉还重", "D. 不信因果——否定因果就肆无忌惮作恶，是一切罪的根源"], "answer": 2, "explain": "「谤法」是广论特别警告的重罪。《遍摄一切研磨经》说：如来所说圣语，觉得一类好一类不好，就是谤法。谤法即是谤佛、谤法、谤僧三宝全谤了。《三摩地王经》更吓人地说：毁谤契经的罪，比毁掉整个南瞻部洲的一切佛塔还重，比杀光恒河沙数阿罗汉还重！「极大」两个字一点不夸张——因为谤法直接断人慧命。反过来，一旦你通过广论懂了「所有佛语皆是成佛方便」，谤法的念头自然消除，这就是「自趣消灭」——不用刻意断，知见对了罪自然消失。"}, {"type": "choice", "stem": "如果你穿越成阿底峡尊者的弟子，尊者晚年被迎请到西藏后做了什么事？以下哪项正确？", "options": ["A. 尊者到了西藏后发现藏人根器太差，收拾行李回印度了", "B. 尊者发现藏地的苯教势力太强，就放弃弘法，改行开药铺行医为生", "C. 尊者到了西藏后就闭关修密法，发誓除了少数弟子外不见任何人", "D. 尊者造了《菩提道炬论》（即《菩提道次第》的根本），在阿里住了3年、聂塘住了9年、卫藏住了5年，把正法规模重新建立起来"], "answer": 3, "explain": "尊者入藏是因缘和合的结果。西藏的「天尊师长叔侄」（智光和菩提光）多次派人去印度迎请，拏错译师等历尽艰辛才把尊者请来。菩提光王请尊者造一部「总摄一切经咒要义、束为修行次第」的论典，尊者就造了《菩提道炬论》——这就是广论的根本。尊者住阿里3年、聂塘9年、卫藏5年，「圣教规模，诸已没者从新建树，诸略存轨倍令增广，诸被邪解垢秽染者皆善治除」。广论原文特别强调尊者对西藏的深恩——没有阿底峡，藏传佛教后面的面貌完全不同。"}, {"type": "choice", "stem": "色拉寺的课堂上，一位师兄举手问：「我只想修行，不想多闻，天天打坐不就行了？」用广论的「三慧」次第来回复他，正确的是：", "options": ["A. 「随喜！修行就是修心，多闻只会增长知见障，打坐才是真功夫」", "B. 「多闻是出家人的事，在家居士专心念一句佛号就够了」", "C. 「你可以一边打坐一边听录音带，这样多闻和修行可以同步进行」", "D. 「闻慧→思慧→修慧是有次第的：先从善知识那里听闻（闻慧），再用自己的理智思惟抉择（思慧），最后数数串习思慧所决定的义理（修慧）。跳过多闻直接修的，就像「如示跑处另向余跑」——给你指了东边你偏往西跑！」"], "answer": 3, "explain": "广论卷二花了大量篇幅破斥「不要多闻只管修」的邪见！三慧的次第极其严格：闻所成慧→思所成慧→修所成慧。修慧从思慧生，思慧从闻慧生——多闻才能多思，多思才能多修。如果闻思抉择的是一个东西，修行时却修另一个无关的东西，就像「如示跑处另向余跑」——赛马场上给你指了跑道，你偏往别处跑，这不是笑话吗？宗大师还辛辣地说：鼓吹不须多闻的人，把多学经论的人跟从来没学过的人放在一起修，两人修出来居然「全无多寡」——那你这所谓的独特口诀有何用？"}, {"type": "choice", "stem": "广论用「如示跑处另向余跑」比喻什么错误？赛马场上发生了什么？", "options": ["A. 比喻修行人跑错方向——闻思告诉你该修无常观，结果你去修大威德金刚了", "B. 比喻有人把「讲」和「修」当成两码事——通过闻思抉择了应修的法义，但实际修的时候却修另外一套毫不相关的东西", "C. 比喻宗喀巴大师年轻时候参加赛马比赛输了，悟出了修行不能盲修瞎练的道理", "D. 比喻善知识带徒弟跑了半程自己先溜了，留下徒弟原地迷茫"], "answer": 1, "explain": "这个比喻来自《修次第后编》：「如示跑地，而应随跑。」意思是赛马前先告诉你往哪跑，你就必须往那跑，不能示了东边你跑西边。广论用这个比喻批判一种流行错误：把经论当成「讲说」用的理论，跟「修行」无关；真正修行时另有口诀心要。宗大师说：如果你通过闻思抉择了「无常观」的正确修法，那修的时候就应该串习你所抉择的无常观——不是另外再想一个东西！将讲修割裂的人，等于否定了佛陀建立「闻思修」三慧次第的智慧，这是对圣言的大不敬。"}, {"type": "choice", "stem": "有人对阿底峡尊者大喊：「阿底峡请教授！」尊者怎么回答的？这句话搞笑背后有什么深意？", "options": ["A. 尊者说：「你没看到我在吃饭吗？」——说明修行也要注意时间场合", "B. 尊者说：「你先磕一万个大头再来说话」——说明恭敬心是基础", "C. 尊者说：「哈哈，我却具有好好耳根，言教授者，谓是信心信信」——教授的核心是信心，不是什么高深口诀", "D. 尊者说：「我正忙着造论呢，明天再来」——说明论典比口头教授重要"], "answer": 2, "explain": "这段是广论中的经典场景！敦巴（仲敦巴）问尊者：藏地修行人很多，怎么没见谁获得殊胜功德？尊者说：大乘功德一切从尊重（善知识）生起，你们藏地人对师父只有凡庸想——觉得「也就那样」，功德从哪儿生出来？这时有人大喊「阿底峡请教授」，尊者幽默地回：「哈哈，我耳朵好着呢——你要的教授就是『信心、信心』！」尊者连说两个「信」，点出核心：真教授不在什么秘诀口诀，在「信」。对善知识没有真信，给再多口诀也没用。反过来，有信的话，一句「信心信」就够了。"}, {"type": "choice", "stem": "敦巴（仲敦巴）是阿底峡尊者在西藏最重要的弟子。以下关于敦巴的故事，哪个在广论中有记载？", "options": ["A. 敦巴每天给尊者做饭，有一天做了红烧牦牛肉，尊者赞不绝口，从此藏传佛教允许吃肉", "B. 敦巴创建了色拉寺，并规定僧人可以不用戒律只修密法", "C. 敦巴12岁就背诵了整部《大藏经》，被称为藏地的「神童班智达」", "D. 敦巴一个人只依止了不到五位善知识（「尊重鲜少，数未过五」），在修行初期容易被师过动摇时，这种少而精的依师方式是更好的"], "answer": 3, "explain": "广论讲了桑朴瓦和敦巴两种依师风格的对比：桑朴瓦到处听法，师父极多——甚至路边一个在家居士说法他也坐下听。弟子觉得有失威仪，他说「我得二益」（既闻法又修了谦下）。敦巴则「尊重鲜少，数未过五」，师父不超过五位。哪种更好？博朵瓦和公巴仁勒喇嘛讨论后认为：对修行还没稳固、容易看到师父过失就退失信心的人来说，敦巴的少而精更好。这不是说桑朴瓦错——人家心量广大不怕多——而是对普通根机，「少而精」更稳妥。"}, {"type": "choice", "stem": "广论卷二说到修行有两种方式：「观察修」和「止修」。有人主张「止修才是真修行，观察修只是闻思不是修」，宗大师怎么破的？", "options": ["A. 宗大师说「你说得对，止修才是真功夫」——跟禅宗一个路数", "B. 宗大师说「观察修和止修都是方便，最终都要超越，什么都不想才是最高境界」", "C. 宗大师说「二者缺一不可，如锻金师先用火烧（观修除过）再用水洗（观修生功德），然后止修才能得真正的三摩地。你说只要止修，好比拿着一个麦子就说所有谷物都是麦子」", "D. 宗大师说「聪明人用观察修，笨人用止修，看你根器选择」"], "answer": 2, "explain": "广论卷二专门有一节「破除于此修轨邪执分别」讲这个。宗大师的立场非常清晰：观察修（思择修）和止修（不思择止住修）两者都必须有，缺一不可。比喻很精妙：如黠慧锻师将金银先用火烧（喻观修过患，去除烦恼恶业垢秽），再用水洗（喻观修功德，令心润泽），经过反复烧洗后金属极柔软堪能，才能打造精美首饰（喻得妙三摩地）。谁说观察修不是修，就像「持一麦说一切谷皆是此」。修信、修暇满难得、修菩提心，这些都要靠观察修才能令心变改——不观察，心不会动。"}, {"type": "choice", "stem": "广论里记载了一个故事：敦巴在大译师智者集会的地方，看到一片泥滩，他做了什么？尊者说了什么？", "options": ["A. 敦巴脱光衣服把泥扫干净，又不知从哪弄来干白土铺好，在尊者面前做了个供坛。尊者笑着说：「奇哉，印度也有像你这样的人」", "B. 敦巴在旁边咕哝「卫生怎么这么差」，然后绕过去了——尊者批评他不够慈悲", "C. 敦巴念了一个咒语，泥滩立刻变成莲花池——尊者说你还得继续修", "D. 敦巴叫来小和尚打扫，被尊者教育了一顿「要自己动手」"], "answer": 0, "explain": "这是在讲「如世间仆使心」——依师时的心态。敦巴身为大译师集会的参与者（不是无名小卒），看到泥滩后二话不说把自己衣服脱了、亲手扫泥、铺白土、做供坛。这不是作秀——是发自内心觉得「为师父做事是天经地义」，没有任何「我这么大咖怎么能扫地」的骄慢。尊者的赞叹「印度也有像你这样的人」意味着：这种放下身段、亲力亲为的精神，在佛法兴盛的印度也不多见。这个故事展示了「加行亲近轨理」——身语承事，不是嘴上恭敬。"}, {"type": "choice", "stem": "民国时太虚大师为广论写序，他称赞广论的根本原因是什么？", "options": ["A. 因为广论文笔优美、用词典雅，是文学杰作", "B. 因为广论把密法讲得特别透彻，让人一看就想学密宗", "C. 因为广论「力阐上士道必经中下士道」，密宗行人也必须遍学一切经律论——这个「次第决定、数量决定」的体系让藏传佛教避免了汉传佛教「各宗互斥」的弊病", "D. 因为广论是宗喀巴大师写的，太虚大师作为汉人崇拜藏传大师"], "answer": 2, "explain": "太虚大师在序言中深刻分析了汉传佛教的困境：禅宗排斥经论、净土劝人不学教理、天台贤首被判为「劣机所学」没人自认劣根，结果「唯仗沿习风俗以支持，学校兴而一呼迷信，几溃颓无以复存」。反观藏传佛教在西藏四五百年「独能卓然安住，内充外弘」，太虚大师认为核心原因是广论「力阐上士道必经中下士道」，即使趣入密宗的人也必须以一切经律论作为教授——不废自宗、不余他法，「巧能安立一切言教皆趣修证」。这就是汉传佛教最缺的「各宗不打架」的体系。"}, {"type": "choice", "stem": "广论的「道前基础」和后面的「三士道」是什么关系？用盖房子来比喻的话：", "options": ["A. 道前基础是打地基：先让你认识盖房子的人（造者殊胜）、知道这套图纸有多牛（法殊胜）、学会看图纸的方法（听闻轨理）、找到靠谱的工头（亲近善知识），地基打好了三士道才盖得上去", "B. 道前基础是售楼处的宣传册，三士道才是真正的工地——看不看无所谓", "C. 道前基础和三士道是平行的——道前学不会可以直接跳过学三士道", "D. 道前基础是给笨人准备的，利根的人可以跳过直接学上士道"], "answer": 0, "explain": "道前基础不是可选的「前菜」，是必须的「地基」。广论的四门结构很清晰：①造者殊胜（法源清净）→②法殊胜（四殊胜，对法生信）→③如何讲闻（听闻轨理+说法轨理+完结轨理）→④亲近善知识（道之根本）+修持轨理。这就像盖房子：先确认设计师靠谱、图纸优秀，然后学会怎么看图、施工规范，最后找到好工头。地基打好了，「三士道」的正行才能顺利开展。宗大师把「听闻轨理」放最前面，因为不会听法的人，听再多也是左耳进右耳出；把「亲近善知识」叫「道之根本」，因为没有善知识引导，自己盲修瞎练等于没有舵手的船。"}, {"type": "choice", "stem": "广论把「亲近善知识」称为「道之根本」，为什么不是「道之第一步」而是「根本」？", "options": ["A. 因为「根本」听起来比「第一步」更玄，宗大师喜欢用酷炫的词", "B. 因为「第一步」已经被其他经典用了，广论只能用「根本」避免重复", "C. 因为藏文「根本」这个词最早就是用来形容善知识的，宗大师只是照抄传统", "D. 因为「第一步」只是一开始的步骤，「根本」是贯穿始终的命脉——没有善知识，下士道的皈依因果你修不起来、中士道的出离心发不起来、上士道的菩提心更无从发起。树没根会死，修行没善知识也是死路"], "answer": 3, "explain": "「根本」和「第一步」有本质区别。第一步意味着「做完这一步就可以往前走了」，根本意味着「树活着就得有根支撑」。《菩萨藏经》说：从最初的菩萨行到最终的佛果，一切功德「皆赖尊重为本，从尊重出，尊重为生及为其处」。博朵瓦也说：连世间学手艺都得有师傅，何况你刚从恶趣出来想走到没去过的地方（成佛），能不找向导吗？而且敦巴问阿底峡尊者「藏人修行没成就为什么」，尊者直说「你们看师父只当凡庸想，功德怎么生」。"}, {"type": "choice", "stem": "广论卷一末尾和卷二开头的「修持轨理」讲了修行的完整流程：加行→正行→完结。如果把这套流程用到你今天的生活中，正确的是：", "options": ["A. 加行=泡杯咖啡，正行=开始看书，完结=发朋友圈打卡——这就算修了", "B. 加行=打扫净处陈设佛像+无谄供品+端正坐姿+归依发心（为利众生愿成佛），正行=对所修法义如理作意，完结=以至诚猛利的心把修法所积的善根回向给一切有情成佛。每一步都跟「道」绑定", "C. 加行=上香磕头，正行=念经（念出声就算），完结=说一句「回向法界众生」——有形式就行", "D. 加行=找个舒服的地方，正行=盘腿打坐什么都不想，完结=伸个懒腰——轻松自在就是禅"], "answer": 1, "explain": "广论的修持轨理极其严谨，不是走形式！加行有六：①善洒扫所住处所，庄严安布佛像经函等；②无谄心端严陈设供品；③于舒适坐具端正结跏趺坐或半跏趺坐；④观想资粮田（皈依境）；⑤以七支供积资净障；⑥供养曼扎、启白三事（祈请加持令心与法相应等）。正行分观察修和止修两种。完结（结行）是至心回向。这个流程贯穿整个道次第——从念死无常到止观双运，全部都是加行→正行→完结的模块化架构。宗大师说：只做加行没正行是戏论，只做正行没加行是不恭敬，不加回向善根易失坏。三环缺一不可。"}, {"type": "choice", "stem": "广论一开头就花大量篇幅讲「听闻轨理」（怎么听法），为什么宗大师把这事放在这么前面？", "options": ["A. 因为宗大师是个完美主义者，什么事情都要先讲规矩", "B. 因为听闻是入道的第一道门——「由闻知诸法，由闻遮诸恶，由闻断无义，由闻得涅槃」。但你不会听的话，闻了也白闻。好比倒扣的杯子倒不进水（覆器）、脏杯子污染水（秽器）、漏杯子存不住水（漏器），要成为具相闻器才能受益", "C. 因为当时的僧人太吵了，上课不遵守课堂纪律，宗大师没办法才先讲规矩", "D. 因为「听闻」是密法中最重要的部分，必须先讲"], "answer": 1, "explain": "广论的「断器三过」比喻极其精准：①覆器（倒扣的杯子）——人到场心不在，听不进去（对治：专注属耳）；②秽器（脏杯子）——带着偏见、邪执听法，法水进去被染污（对治：意善敬住）；③漏器（漏底杯子）——听了但记不住、不思维，法水漏光了（对治：以一切心思惟听闻）。如果不先搞定这三个毛病，后面讲再多法也是耳边风。而且广论还讲「依六种想」：把自己当病人、法师当医生、法当药、修行当治病、如来做善士想、正法做久住想。这六种精神准备做好了，听每一句法都跟吃药一样认真。"}, {"type": "choice", "stem": "「暇满人身」和「道总建立」的关系是什么？广论为什么在讲修行之前先讲这两个？", "options": ["A. 暇满人身告诉你「这人身太难得了赶紧修别浪费」（推动力），道总建立告诉你「修行的完整路线图长这样别走岔了」（方向感）——一个给动力，一个给方向，缺哪一个都修不下去", "B. 暇满人身是让你感恩自己当人，道总建立是摆出课表给你看——两者之间没什么直接关系", "C. 暇满人身是给下士道准备的，道总建立是给上士道准备的——不同阶段不同内容", "D. 这两个都是用来凑科判数量的，没什么深层逻辑"], "answer": 0, "explain": "广论的结构逻辑极其严密。在正式开始修三士道之前，先要解决两个根本问题：「为什么要修」（动力）和「修什么、怎么修」（方向）。「暇满」解决动力问题：你得人身比中彩票还难，而且随时会死，不修就浪费了；而且暇满人身能成办后世增上生和究竟决定胜（成佛），价值大到不可想象。但光有动力没方向不行——所以有「道总建立」：告诉你整个成佛之路分三士道，下士道（人天果）→中士道（解脱果）→上士道（成佛果），每一步含什么内容、为什么必须按这个次第。两个合起来就是「急迫感+路线图」。"}, {"type": "choice", "stem": "【综合题】你穿越到色拉寺，宗喀巴大师问你：「道前基础阶段，最重要的三件事是什么？」以下哪个回答最符合广论的精神？", "options": ["A. 认识法源→掌握学法方法→找到善知识并如理依止。即：从「听闻轨理」学会怎么把佛法听进去，从「造者殊胜+法殊胜」生起对法的真实信心，从「亲近善知识+修持轨理」建立正确的修行方式和依师关系", "B. 学五部大论、考格西学位、辩经——知识水平最重要", "C. 多布施、多放生、多念咒——积累福报最重要", "D. 出家、闭关、不跟任何人来往——远离世俗最重要"], "answer": 0, "explain": "道前基础总结起来就是三件事：①「学法的方法」——听闻轨理（断器三过、依六种想）、讲说轨理、完结轨理，让你具备「如理听闻、如理思维」的能力。不是「知道很多」就叫学好，要「知道怎么学」才算入门；②「对法生信」——造者殊胜（法源清净）+法殊胜（四殊胜），不是盲目信，是基于认识的敬重心；③「找到路并走下去」——亲近善知识（道之根本）+修持轨理（加行正行完结），知道怎么依师、怎么修、修完怎么回向。这三件事像是学法的「基础设施」，后面的暇满、无常、皈依、业果（下士道）、出离心（中士道）、菩提心（上士道）全都是在这个基础设施上运行的。基础设施没建好，上面的楼盖多高都会塌。"}]};

  var total = 0;
  for(var k in allProgress){ total += Object.keys(allProgress[k]||{}).filter(x=>x!=='done').length; }

  var t = 0;
  for(var k in allProgress){
    if(allProgress[k] && typeof allProgress[k]==='object'){
      for(var q in allProgress[k]){ if(q!=='done' && allProgress[k][q]!==null) t++; }

  }
  document.getElementById('totalAnswered').textContent = t;
}

function goHome(){
  document.getElementById('quiz').classList.remove('show');
  document.getElementById('shelf').style.display='block';
  curQuiz = null;
  // 刷新书架显示进度
  var grid = document.getElementById('bookGrid');
  if(grid) {
    // 重新渲染书架以更新进度
    location.reload();
  }
}

function showQ(){
  if(!curQuiz) return;
  var qs = curQuiz.questions;
  var q = qs[curQ];
  var total = qs.length;
  var key = curQ;
  var prev = answers[key];

  document.getElementById('pFill').style.width = ((curQ+1)/total*100)+'%';
  
  var h = '<div class="q-prog">第 '+(curQ+1)+' / '+total+' 题</div>';
  h += '<div class="q-stem">'+q.stem+'</div>';

  if(q.type==='choice' && q.options){
    h += '<div class="q-opts">';
    q.options.forEach(function(opt,i){
      var c='q-opt';
      if(prev!==undefined){c+=' dis';if(i===q.answer)c+=' ok';else if(i===prev)c+=' no';}
      var ck=prev===undefined?' onclick="ansQ('+i+')"':'';
      h+='<div class="'+c+'"'+ck+'>'+opt+'</div>';
    });
    h+='</div>';
  } else if(q.type==='tf'){
    var an = q.answer?0:1;
    h+='<div class="tf-row">';
    [0,1].forEach(function(i){
      var lb=['✅ 正确','❌ 错误'];var c='tf-btn';
      if(prev!==undefined){c+=' dis';if(i===an)c+=' ok';else if(i===prev)c+=' no';}
      var ck=prev===undefined?' onclick="ansTF('+i+')"':'';
      h+='<div class="'+c+'"'+ck+'>'+lb[i]+'</div>';
    });
    h+='</div>';
  }

  if(prev!==undefined && q.explain){
    h+='<div class="q-exp show">💡 '+q.explain+'</div>';
  }

  document.getElementById('qBody').innerHTML=h;
  document.getElementById('btnPrev').disabled=(curQ===0);
  
  var nh=document.getElementById('navHint');
  if(prev===undefined){nh.textContent='·';nh.style.color='#ddd';}
  else{
    var ok=false;
    if(q.type==='tf'){ok=(prev===(q.answer?0:1));}
    else{ok=(prev===q.answer);}
    nh.innerHTML=ok?'<span style="color:#07c160">✓</span>':'<span style="color:#ff5b5b">✗</span>';
  }

  // 最后一题
  if(curQ===total-1 && prev!==undefined){
    document.getElementById('btnNext').textContent='查看成绩';
    document.getElementById('btnNext').onclick=function(){showResult();};
  } else {
    document.getElementById('btnNext').textContent='下一题 ›';
  }
}

function ansQ(i){answers[curQ]=i;saveProgress();showQ();}
function ansTF(i){answers[curQ]=i;saveProgress();showQ();}

function saveProgress(){
  if(!curQuiz) return;
  // 从localStorage获取原始数据
}

function nav(d){
  if(!curQuiz) return;
  var total=curQuiz.questions.length;
  if(d===-1&&curQ>0){curQ--;showQ();}
  if(d===1&&curQ<total-1){curQ++;showQ();}
}

function showResult(){
  var total=curQuiz.questions.length,correct=0;
  curQuiz.questions.forEach(function(q,i){
    if(answers[i]===undefined)return;
    if(q.type==='tf'){if(answers[i]===(q.answer?0:1))correct++;}
    else{if(answers[i]===q.answer)correct++;}
  });
  var pct=Math.round(correct/total*100);
  var ic=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'👍':'💪';
  var bar=pct>=70?'#07c160':pct>=50?'#ffa500':'#ff5b5b';
  var msg=pct>=90?'太厉害了！你已经深入掌握了这个主题，可以去挑战更难的题了。':
          pct>=70?'不错！大部分内容都掌握了。看看解析里的部分，再加深一下就完美了。':
          pct>=50?'及格了！建议回去重新读一遍，重点关注答错的部分。':
          '别灰心！学习就是一个不断深入的过程。看看解析，再来挑战一次吧。';
  
  document.getElementById('qBody').innerHTML='<div class="r-page"><div class="r-icon">'+ic+'</div><div class="r-score">'+correct+'<span style="font-size:24px;color:#ccc">/'+total+'</span></div><div class="r-total">答对 '+correct+' 题，共 '+total+' 题</div><div class="r-bar"><div class="r-bar-fill" style="width:'+pct+'%;background:'+bar+'"></div></div><div class="r-pct" style="color:'+bar+'">'+pct+'%</div><div class="r-msg">'+msg+'</div><div class="r-actions"><button class="r-btn r-share" onclick="shareResult('+correct+','+total+')">📋 分享成绩</button><button class="r-btn r-retry" onclick="retry()">🔄 再做一次</button><button class="r-btn r-home" onclick="goHome()">📚 返回书架</button></div></div>';
  document.getElementById('btnPrev').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('navHint').style.display='none';
}

function retry(){
  curQ=0;answers={};
  document.getElementById('btnPrev').style.display='';
  document.getElementById('btnNext').style.display='';
  document.getElementById('navHint').style.display='';
  showQ();
}

function shareResult(c,t){
  var pct=Math.round(c/t*100);
  var text='我在「'+(curQuiz.title||'读书答题')+'」中答对了 '+c+'/'+t+' 题（'+pct+'%）！来挑战吧 📚';
  if(navigator.share){
    navigator.share({title:'读书答题',text:text,url:location.href});
  } else {
    var full=text+'\n'+location.href;
    if(navigator.clipboard){
      navigator.clipboard.writeText(full);
      alert('成绩已复制！去微信群或朋友圈粘贴分享吧 📋\n\n'+full);
    } else {
      prompt('复制以下内容分享：',full);
    }
  }
}
</script>
