<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>读书答题 · 读过的书，考一下才知道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--green:#07c160;--bg:#f5f6f8;--card:#fff;--text:#1a1a1a;--sub:#888;--radius:16px;--shadow:0 2px 16px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}

/* 书架 */
#shelf{max-width:520px;margin:0 auto;padding:0 16px 100px}
.shelf-header{text-align:center;padding:50px 0 24px}
.shelf-logo{font-size:52px;margin-bottom:8px;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.shelf-title{font-size:28px;font-weight:800;background:linear-gradient(135deg,#07c160,#0af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.shelf-sub{font-size:13px;color:var(--sub);margin-top:8px}
.shelf-stats{display:flex;justify-content:center;gap:24px;margin-top:16px}
.stat{text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--green)}
.stat-label{font-size:11px;color:var(--sub)}

.book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.book-card{background:var(--card);border-radius:var(--radius);padding:22px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.book-card:active{transform:scale(.95);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.book-card .b-icon{font-size:38px;margin-bottom:8px;display:block}
.book-card .b-name{font-size:14px;font-weight:700;line-height:1.3}
.book-card .b-desc{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-card .b-count{display:inline-block;background:#f0f0f0;color:#888;font-size:10px;padding:3px 10px;border-radius:10px;margin-top:8px;font-weight:600}
.book-card .b-badge{position:absolute;top:8px;right:8px;background:#ff5b5b;color:#fff;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600}

/* 答题页 */
#quiz{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:none;z-index:100;overflow-y:auto;max-width:520px;margin:0 auto}
#quiz.show{display:block}
.q-header{position:sticky;top:0;background:#fff;z-index:10;padding:14px 16px 10px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:10px}
.back-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--green);cursor:pointer;border-radius:50%;background:#f5fff8}
.q-title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{width:60px;height:4px;background:#f0f0f0;border-radius:2px}
.pbar-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}

.q-body{padding:24px 20px 140px}
.q-prog{font-size:12px;color:var(--sub);margin-bottom:14px}
.q-stem{font-size:17px;line-height:1.75;margin-bottom:22px;color:#222}
.q-opts{display:flex;flex-direction:column;gap:10px}
.q-opt{padding:15px 16px;background:#f9f9f9;border:2px solid #f0f0f0;border-radius:13px;cursor:pointer;transition:all .15s;font-size:15px;line-height:1.55;position:relative;padding-right:40px}
.q-opt:active{transform:scale(.98);background:#f3f3f3}
.q-opt.sel{border-color:var(--green);background:#f0fff5}
.q-opt.ok{border-color:var(--green);background:#f0fff5;font-weight:500}
.q-opt.ok::after{content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--green);font-size:20px;font-weight:bold}
.q-opt.no{border-color:#ff5b5b;background:#fff5f5}
.q-opt.no::after{content:'✗';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#ff5b5b;font-size:20px;font-weight:bold}
.q-opt.dis{pointer-events:none}

.q-exp{margin-top:14px;padding:14px 16px;background:linear-gradient(135deg,#f0fff5,#fafdff);border-left:3px solid var(--green);border-radius:0 12px 12px 0;font-size:14px;line-height:1.75;color:#555;display:none}
.q-exp.show{display:block;animation:su .3s ease}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;padding:22px;text-align:center;border-radius:13px;font-size:18px;font-weight:600;cursor:pointer;border:2px solid #f0f0f0;background:#f9f9f9;transition:all .15s}
.tf-btn:active{transform:scale(.98)}
.tf-btn.ok{border-color:var(--green);background:#f0fff5;color:var(--green)}
.tf-btn.no{border-color:#ff5b5b;background:#fff5f5;color:#ff5b5b}
.tf-btn.dis{pointer-events:none}

.match-area{display:flex;gap:12px}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px}
.match-lbl{font-size:11px;color:var(--sub);text-align:center;margin-bottom:4px}
.match-it{padding:11px 8px;background:#f9f9f9;border:2px solid #f0f0f0;border-radius:10px;cursor:pointer;font-size:12px;text-align:center;transition:all .15s;line-height:1.3}
.match-it:active{transform:scale(.96)}
.match-it.ss{border-color:var(--green);background:#f0fff5}
.match-it.mm{border-color:var(--green);background:#f0fff5;color:var(--green);pointer-events:none}

.q-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f5f5f5;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;z-index:10}
.nv-btn{padding:10px 26px;border-radius:24px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.nv-btn:disabled{opacity:.25}
.nv-prev{background:#f0f0f0;color:#666}
.nv-next{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(7,193,96,.3)}

/* 成绩 */
.r-page{text-align:center;padding:50px 24px 120px}
.r-icon{font-size:72px;margin-bottom:12px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.r-score{font-size:54px;font-weight:800;color:var(--green);letter-spacing:-1px}
.r-total{font-size:16px;color:var(--sub);margin-top:6px}
.r-pct{font-size:18px;font-weight:700;margin-top:12px}
.r-msg{font-size:14px;color:#777;margin:24px 16px;line-height:1.6}
.r-bar{width:200px;height:8px;background:#f0f0f0;border-radius:4px;margin:20px auto;overflow:hidden}
.r-bar-fill{height:100%;border-radius:4px;transition:width 1s ease}
.r-actions{display:flex;flex-direction:column;gap:10px;margin-top:28px;max-width:280px;margin-left:auto;margin-right:auto}
.r-btn{padding:14px;border-radius:13px;font-size:15px;font-weight:600;border:none;cursor:pointer}
.r-share{background:var(--green);color:#fff;box-shadow:0 2px 12px rgba(7,193,96,.3)}
.r-retry{background:#f0f0f0;color:#666}
.r-home{background:#fff;color:var(--green);border:1.5px solid var(--green)}

/* loading */
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loading .spinner{width:32px;height:32px;border:3px solid #f0f0f0;border-top-color:var(--green);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* footer */
.shelf-footer{text-align:center;padding:30px 0;color:#ccc;font-size:11px}

@media(min-width:521px){body{background:#e8eaed}#shelf,#quiz{box-shadow:0 0 30px rgba(0,0,0,.08)}#shelf{border-radius:0 0 20px 20px;margin-top:20px;padding-top:30px}#quiz{border-radius:20px;margin-top:0;overflow:hidden}}
</style>
</head>
<body>

<div id="shelf">
  <div class="shelf-header">
    <div class="shelf-logo">📚</div>
    <div class="shelf-title">读书答题</div>
    <div class="shelf-sub">读过的书，考一下才知道读懂了多少</div>
    <div class="shelf-stats">
      <div class="stat"><div class="stat-num" id="totalBooks">-</div><div class="stat-label">本书</div></div>
      <div class="stat"><div class="stat-num" id="totalQs">-</div><div class="stat-label">道题</div></div>
      <div class="stat"><div class="stat-num" id="totalAnswered">0</div><div class="stat-label">已作答</div></div>
    </div>
  </div>
  <div class="book-grid" id="bookGrid">
    <div class="loading"><div class="spinner"></div>加载中...</div>
  </div>
  <div class="shelf-footer">读书答题 · 由 OpenClaw 驱动</div>
</div>

<div id="quiz">
  <div class="q-header">
    <div class="back-btn" onclick="goHome()">‹</div>
    <div class="q-title" id="qTitle"></div>
    <div class="pbar"><div class="pbar-fill" id="pFill"></div></div>
  </div>
  <div class="q-body" id="qBody"></div>
  <div class="q-nav">
    <button class="nv-btn nv-prev" id="btnPrev" onclick="nav(-1)">‹ 上一题</button>
    <span id="navHint" style="font-size:12px;color:#aaa;min-width:30px;text-align:center"></span>
    <button class="nv-btn nv-next" id="btnNext" onclick="nav(1)">下一题 ›</button>
  </div>
</div>

<script>
var quizData = {};
quizData.anti = {"title": "反脆弱", "questions": [{"stem": "塔勒布把世间万物分成三类：脆弱、强韧、反脆弱。一场突如其来的裁员风暴中，谁属于「反脆弱」的？", "options": ["A. 做了五年自由职业的设计师，手里同时有三个客户，被裁一个马上能接新活", "B. 大公司里干了二十年的老员工，除了这份工作什么都不会", "C. 刚入职半年的新人，技能还没磨出来", "D. 公司HR，裁完别人自己也害怕被裁"], "type": "choice", "answer": 0, "explain": "反脆弱的本质是从混乱中获益。自由职业者有多元收入来源，一次冲击不但伤不了他，反而可能让他找到更好的客户。就像九头蛇，砍掉一个头长出两个。"}, {"stem": "希腊神话里三个形象代表了脆弱、强韧、反脆弱。九头蛇被砍一个头长两个头，它代表什么？", "options": ["A. 反脆弱——它不仅不怕伤害，还从伤害中变得更强", "B. 脆弱——越砍越恨，最终还是会死的", "C. 强韧——不管怎么砍它都能恢复原样", "D. 既脆弱又强韧，要看砍它的武器是什么"], "type": "choice", "answer": 0, "explain": "九头蛇是反脆弱的完美象征：你砍它一个头，它长出两个——伤害让它变得更强。达摩克利斯之剑是脆弱的（一点风吹草动就完蛋），凤凰是强韧的（死了重生但不变强）。"}, {"stem": "两兄弟各自创业。哥哥把全部积蓄押在一个项目上，弟弟同时做三个小项目。谁更反脆弱？", "options": ["A. 哥哥——集中火力才能做大事", "B. 弟弟——小错误、可逆、快速试错。一个小项目失败了没关系，任何一个成功了都可能带来大回报", "C. 一样——看谁的项目方向好", "D. 都不反脆弱，创业本身就是脆弱的"], "type": "choice", "answer": 1, "explain": "弟弟的做法就是「杠铃策略」——大部分资源放在安全的地方，小部分去博高回报。错误小而可逆，成功则非线性放大。这就是塔勒布说的「喜欢错误」，因为每次小错都在教你东西。"}, {"stem": "为什么塔勒布说「游客」比「漫游者」更脆弱？", "options": ["A. 游客花钱更多，更容易被骗", "B. 游客有精确的行程表——飞机晚点两小时整个计划就崩了。漫游者没有固定计划，走到哪算哪，意外反而可能带来惊喜", "C. 游客不懂当地语言，沟通困难", "D. 漫游者更穷，没什么可失去的"], "type": "choice", "answer": 1, "explain": "游客追求精确的预测和控制，一旦出现计划外的波动（晚点、关门、下雨）就崩溃。漫游者拥抱不确定性，走到哪算哪，意外的发现往往是最好的经历。这就是反脆弱。"}, {"stem": "塔勒布说「对傲慢者友好无异于对友好者傲慢」。餐厅老板明知供应商用的食材有问题但不说——这属于什么？", "options": ["A. 自我保护，在商言商没什么问题", "B. 这是供应商的问题，跟餐厅没关系", "C. 共同欺诈——看到欺诈而不揭露，你就是同谋。这是塔勒布的第一条伦理原则", "D. 应该先跟供应商沟通，不行再说"], "type": "choice", "answer": 2, "explain": "塔勒布第一条伦理原则：「如果你看到欺诈而不揭露欺诈，那么你就是同谋。」这不是法律问题，是道德底线。沉默就是纵容。"}, {"stem": "为什么塔勒布认为小企业和个体户比大公司员工更反脆弱？", "options": ["A. 小企业赚得更多", "B. 小企业主更聪明", "C. 大公司员工像一个高度优化的零件——依赖单一系统，一旦公司裁员或者整个行业衰退就无处可去。小企业主手里有客户、有技能、有灵活度", "D. 大公司员工福利好所以风险低"], "type": "choice", "answer": 2, "explain": "大公司员工是脆弱的典型——高度优化、依赖单一系统、没有备选方案。小企业主和手艺人则是反脆弱的——收入来源多元，技能可迁移，一次失败只伤皮毛。"}, {"stem": "一个健身的人和一个从不运动的人，谁更反脆弱？为什么？", "options": ["A. 从不运动的人——没有受伤风险，更安全", "B. 看年龄，年轻人怎么都行", "C. 看练什么，跑步的反脆弱，举重的不反脆弱", "D. 健身的人——每次锻炼其实是在给身体施压（微小的伤害），身体为了应对下一次压力会变得更强。这就是「过度补偿」"], "type": "choice", "answer": 3, "explain": "健身就是典型的反脆弱机制：施加微小压力→身体过度补偿→变得更强。肌肉酸痛是「小错误」，身体会为了应对下一次而增长。不运动的人表面上安全，实际上越来越脆弱（骨质疏松、肌力下降）。"}, {"stem": "塔勒布说现代化社会有一个「天真的干预主义」通病。下面哪个例子属于它？", "options": ["A. 没生病就天天吃保健品「预防」——你不知道身体真正的平衡状态是什么，乱加东西可能破坏原来的平衡，造成医源性损伤", "B. 老中医根据望闻问切开药方", "C. 感冒了多喝热水多休息", "D. 定期体检了解自己的身体状况"], "type": "choice", "answer": 0, "explain": "天真的干预主义：「我看到一个问题，我就要干预它」——却没想过干预本身可能比问题更糟。医疗上的过度用药、经济上的过度调控，都是「想帮忙反而害了你」。塔勒布说减法（去掉有害的）往往比加法（加新东西）更安全。"}, {"stem": "一个基金经理过去五年每年都跑赢大盘，跟一个过去五年有两年亏损但其他三年大赚的人，谁更反脆弱？", "options": ["A. 有亏损但大赚的人——表面上波动大，但他的亏损小而可逆，大赚却能改变一切。五年全赢的人可能只是运气好，隐藏着一次毁灭性暴跌的风险", "B. 年年跑赢的更稳定更好", "C. 看谁赚的总量多", "D. 都一样，市场面前人人平等"], "type": "choice", "answer": 0, "explain": "这是塔勒布的核心洞见：看起来稳定的东西可能隐藏巨大的脆弱性（负偏态黑天鹅），看起来波动的东西可能是反脆弱的（正偏态黑天鹅）。小的损失+大的收益=反脆弱。"}, {"stem": "「医源性损伤」是塔勒布反复提到的一个词。它的核心意思是？", "options": ["A. 医生故意伤害病人", "B. 医生出于好意给你治病，但治疗本身造成了新的伤害——而且这个伤害比原来的病还严重。比如一个小手术引发感染，一粒药引发了严重的副作用", "C. 病人不遵医嘱导致病情恶化", "D. 医药公司的药太贵了，穷人看不起病"], "type": "choice", "answer": 1, "explain": "医源性损伤（iatrogenics）指治疗行为本身造成的伤害。塔勒布说：对人体的干预如果是不必要的，宁可不要——身体有自愈能力。这延伸到经济政策、教育、管理等各领域：好心帮倒忙。"}, {"stem": "苏联计划经济和美国自由市场，哪个更脆弱？为什么？", "options": ["A. 美国——市场太乱了，危机不断", "B. 苏联——工人没积极性", "C. 苏联——一个集中化的系统，上面一个决定错了全国跟着遭殃。美国市场每天都有公司破产，但正是这种「小失败」让整个系统不断自我修复", "D. 一样脆弱，任何经济体系都有问题"], "type": "choice", "answer": 2, "explain": "塔勒布的分权vs集权：集中的系统（苏联）像一个不能犯错的人——错一次就致命。分散的系统（市场）每天都有小错误，但错误是局部的、可逆的、有信息的。大系统容易引发黑天鹅，小系统的错误只是白噪声。"}, {"stem": "为什么塔勒布反对「指导性研究」（领导说我们今年要攻克XXX），而推崇「随机自由探索」？", "options": ["A. 指导性研究太贵了，浪费纳税人的钱", "B. 指导性研究太慢，自由探索更快", "C. 最大的发现往往不是「目标导向」出来的——青霉素是意外发现的，微波炉也是。当研究者有自由去探索任何方向时，运气和意外发现才有空间发挥作用", "D. 他不反对指导性研究，他只是推崇两种都要做"], "type": "choice", "answer": 2, "explain": "塔勒布说：真正的重大发现很少来自于「我们要发明X」的规划，而是来自于自由探索中的偶然。反脆弱的自由探索——试很多小方向，大部分失败无所谓，一个意外发现改变一切。这就是可选择性的力量。"}, {"stem": "某公司CEO看到季度利润下滑，马上裁员砍预算。这个做法的问题在哪？", "options": ["A. 裁员会让员工士气更低落", "B. 裁员成本太高，不如降薪", "C. 应该先自己降薪而不是裁员工", "D. CEO犯了「天真干预主义」——他想消除短期波动，但砍掉的可能是未来增长的关键部门。短期波动是必要的噪音，消灭波动往往消灭了系统的适应能力"], "type": "choice", "answer": 3, "explain": "塔勒布的核心论点：波动是系统保持反脆弱性的必要条件。把所有波动都熨平（像打鸡血稳增长），表面好看了，实际上系统失去了应激能力，变得极度脆弱——下一次小风波就能搞崩。森林防火把小火烧没了，结果积累了燃料，一场大火全烧光。"}, {"stem": "塔勒布说世界可以分成「平均斯坦」和「极端斯坦」。股票收益率属于哪个？", "options": ["A. 极端斯坦——一天跌10%比一年涨10%的影响都大。少数极端事件决定了整体回报，正态分布在这不管用", "B. 平均斯坦——每天的涨跌都差不多，总体稳定", "C. 两者混合，看时间段", "D. 牛市是平均斯坦，熊市是极端斯坦"], "type": "choice", "answer": 0, "explain": "金融收益率是极端斯坦的典型：黑天鹅事件（一天跌10%）对整体影响远超日常波动。平均斯坦（如人的身高）是正态的——你见过姚明但不会见过20米高的人。极端斯坦里你无法用平均数预测。"}, {"stem": "有人每天看天气预报决定穿什么。有人带一件外套同时装一把伞，不看天气预报。谁对不确定性处理得更好？", "options": ["A. 看预报的人——信息多总比信息少好", "B. 带外套和伞的人——他不是在「预测」天气，而是在「应对」天气的各种可能性。这比任何天气预报都可靠", "C. 看预报但多带一件备用的人", "D. 两种方法效果一样"], "type": "choice", "answer": 1, "explain": "塔勒布的核心智慧：不要预测，要准备。「杠铃策略」就是：对最坏情况做好保护（带伞），同时保留上升空间。预测天气=脆弱（预测错了就淋雨），准备各种可能=反脆弱（下雨打伞，晴天外套）。"}, {"stem": "胖子托尼和知识分子苏格拉底的对话揭示了什么？", "options": ["A. 知识分子比街头聪明人更懂世界", "B. 托尼用「如果这个人是错的，他自己会受伤吗？」来判断一切。他没有华丽的逻辑，但他只信那些提出者自己也在承担风险的观点。而很多理论家「讲的头头是道，自己不承担任何后果」", "C. 苏格拉底的逻辑推理胜过了托尼的直觉", "D. 两个人都对，只是角度不同"], "type": "choice", "answer": 1, "explain": "塔勒布的核心伦理：「切身利益」（skin in the game）。胖子托尼判断一个观点的标准很简单——说这话的人自己信不信？他自己承担风险吗？如果经济学家预测经济衰退却不做空，别信他。"}, {"stem": "塞内加（古罗马斯多葛哲学家）为什么被塔勒布视为反脆弱的典范？", "options": ["A. 他很有钱，不用担心生活", "B. 他每天冥想，心如止水", "C. 他不是靠消除不确定性来获得安宁——而是主动想象最坏的情况（比如失去所有财富），然后练习在心里接受它。这样真正的损失来临时，他已经免疫了", "D. 他放弃了一切财富，过苦行僧生活"], "type": "choice", "answer": 2, "explain": "塞内加的智慧：天天想着可能会失去一切，结果当真的失去了反而不慌。这和现代人的做法相反——现代人回避思考风险，结果风险来了被击垮。心理上的反脆弱：提前消化最坏结果。"}, {"stem": "为什么塔勒布说「预测」这件事本身就是脆弱的？", "options": ["A. 因为预测总是错的，没有例外", "B. 预测的成本太高，不值得", "C. 预测在后视镜里看永远是对的，但当下没用", "D. 预测让你产生虚假的安全感——你以为你知道了，就不做准备了。而不预测的人反而对任何情况都有准备。越精确的预测，越容易在意外面前崩溃"], "type": "choice", "answer": 3, "explain": "精确预测的悖论：你以为知道了就不会准备（脆弱），你不知道所以什么都准备了（反脆弱）。塔勒布不是让我们完全放弃预测，而是「不要依赖预测做关键决策」——用杠铃策略取代预测。"}, {"stem": "一个人买了地震保险结果几年没地震，另一个人没买保险结果真地震了。塔勒布怎么评价？", "options": ["A. 买保险的人亏了，浪费了几年保费", "B. 看地震概率，概率低的地方不必买", "C. 保险公司的过错，应该强制要求所有人买", "D. 买保险的人在玩「杠铃策略」——花小额保费用来防止毁灭性损失（杠铃的安全端）。至于另一端（投资、事业），仍然可以有高回报。没买保险的人是脆弱的一一一把自己暴露在黑天鹅下"], "type": "choice", "answer": 3, "explain": "杠铃策略的精髓：用一小部分资源消除毁灭性风险（买保险），然后用剩下的资源去博取高回报。地震没来=白花了保费=错了，但这个错是小的、可承受的。地震来了=保险救了命=极端斯坦的正向回报。"}, {"stem": "为什么硅谷的投资哲学「快速失败」是反脆弱的？", "options": ["A. 每次失败都是一个小型实验——成本可控，但每次都在教你什么行不通。大量小失败+一两个大成功=爆炸式回报。这就是反脆弱的「可选择权」", "B. 因为美国人天生乐观，失败了也不怕", "C. 因为硅谷公司钱多，烧得起", "D. 这不是反脆弱，这只是赌博"], "type": "choice", "answer": 0, "explain": "可选择权（optionality）是反脆弱的核心机制：你有N次小成本尝试的机会，大部分失败无所谓，只要有一个成功了，回报可以覆盖所有失败的成本还多得多。这是不对称性：损失有下限，收益无上限。"}, {"stem": "为什么一个成功的创业者在找到方向之前，通常会经历多次失败？塔勒布怎么解释？", "options": ["A. 创业者运气不好，前几次没碰上对的风口", "B. 这不是运气——这是「自由探索+反复试错」的反脆弱过程。每一次失败都排除了一个错误方向，积累了信息和经验。最终找到的那个方向，之所以能成功，恰恰是因为前面失败了足够多次", "C. 创业者不够聪明，需要积累经验", "D. 社会对失败的宽容度不够，如果有更多支持就不会失败"], "type": "choice", "answer": 1, "explain": "塔勒布：「错误是信息。」在反脆弱系统中，小错误不是损失，是学费。每一次失败都在缩小搜索范围。这跟进化论一样——基因突变大部分是坏的，但偶尔一个好的突变就能改变物种。"}, {"stem": "「教鸟儿如何飞行」是一个什么性质的错误？", "options": ["A. 教学上的创新，人类在帮助动物", "B. 现代理性主义的傲慢——鸟儿不需要空气动力学教科书就会飞。同样，很多有效的实践（手工艺、传统、经验法则）不需要「理论解释」就能运行得很好", "C. 一个寓言故事，没有什么实际意义", "D. 是科学进步的例子，说明理论可以指导实践"], "type": "choice", "answer": 1, "explain": "塔勒布用这个比喻讽刺「理论先行」的思维方式。很多行之有效的做法（如传统的饮食、手工技艺）在科学解释之前就已经在用了。实践往往领先理论，反过来「为实践找到理论依据」反而可能毁掉好的做法。"}, {"stem": "以下哪个体现了「可选择性」的反脆弱思维？", "options": ["A. 把所有钱存银行定期，安全第一", "B. 分散投资，买50只不同的股票", "C. 90%资金放在极其安全的资产上，10%去投高风险高回报的早期项目。亏了最多10%，赚了可能翻10倍", "D. 借钱加杠杆赌一个方向，赢了财务自由输了从头再来"], "type": "choice", "answer": 2, "explain": "这就是杠铃策略+可选择性：一端是极度安全（亏损有限），一端是高风险高回报（收益无限）。中间地带（所谓「中等风险」）反而是最危险的——你以为你控制了风险，其实黑天鹅躲在里面。"}, {"stem": "为什么要「保持愚蠢」而不是「变得更聪明」？", "options": ["A. 聪明反被聪明误，糊涂一点活得更开心", "B. 真正的大智慧就是不计较", "C. 这里的「愚蠢」指：承认你不知道，然后去试。如果你觉得自己很聪明（知道市场会怎么走），你就不会做风控。如果你承认自己愚蠢（不知道），你才会分散、买保险、留余地", "D. 这是乔布斯的商业策略，跟反脆弱无关"], "type": "choice", "answer": 2, "explain": "塔勒布：「保持愚蠢」=保持对不确定性的敬畏。自以为聪明的人制定精确预测，结果被黑天鹅打脸。承认愚蠢的人做足了准备，黑天鹅来了反而受益。智力上的谦逊=反脆弱，智力上的傲慢=脆弱。"}, {"stem": "一个手艺人（木匠、电工）和一个中层管理者，谁更反脆弱？", "options": ["A. 管理者——有稳定工资和五险一金", "B. 都反脆弱，现代社会机会很多", "C. 都不反脆弱，收入都不稳定", "D. 手艺人——他的技能可以带到任何地方，不依赖单一雇主。市场需求再差，总会有人需要修水管。管理者离开了公司这个平台，他的「管理技能」可能一文不值"], "type": "choice", "answer": 3, "explain": "手艺人拥有「可迁移技能」和「多元化潜在客户」——这是反脆弱的两个特征。中层管理者看似稳定，但他的价值高度依赖于公司的特定系统，一旦被裁很难找到同等位置。"}, {"stem": "塔勒布说脆弱性可以用数学来精确描述——它跟「非线性」有关。一块玻璃和一根弹簧，哪个是「凸性」的？", "options": ["A. 弹簧——你越用力压它，它的反弹力增长得比压力更快（非线性）。玻璃压到极限就碎（凹性），弹簧压得越狠弹得越猛（凸性）", "B. 玻璃——因为它是透明的，能看清本质", "C. 都是凸性，因为都有弹性", "D. 都不是，凸性只跟金融有关"], "type": "choice", "answer": 0, "explain": "凸性（convexity）是反脆弱性的数学表达：损失有限（压到极限也不会负），收益放大（弹力随压力增加而超比例增长）。期权就是典型的凸性工具。凹性相反——平时看起来没事，压到极限就崩溃（玻璃、银行、高度负债的系统）。"}, {"stem": "如果有人告诉你「这个投资产品的平均回报率是8%」，按塔勒布的观点你该问什么？", "options": ["A. 这个产品是哪个公司发行的？", "B. 最大的单年亏损是多少？平均数字在极端斯坦里没有意义——你可能连续三年赚5%，第四年亏80%，平均还是正数，但你已经破产了", "C. 管理费用是多少？", "D. 我可以投多少钱？"], "type": "choice", "answer": 1, "explain": "詹森不等式（Jensen's Inequality）告诉塔勒布：在非线性（凸性或凹性）的世界里，「平均」毫无意义甚至有害。一个凹性的风险（脆弱）平时都赚钱，一次亏光。你应该关心的是脆弱性（最大亏损），不是平均值。"}, {"stem": "把铅变成黄金和把黄金变成铅，哪个更容易？塔勒布怎么用这个比喻？", "options": ["A. 铅变金更容易——炼金术士就是这么干的", "B. 两者一样难", "C. 金变铅更容易——把好东西变坏太容易了（一个错误决策毁掉一个公司），但把坏事变好很难。这就是为什么「不犯错」比「做对事」更重要——否定法", "D. 这是两回事，不能放在一起比较"], "type": "choice", "answer": 2, "explain": "塔勒布的「炼金石」比喻：凹性（脆弱）系统：一次亏损能把之前所有盈利清零（金变铅）。凸性（反脆弱）系统：多个小亏损+一个大盈利=质的飞跃（铅变金）。不对称性决定了你最终是铅还是金。"}, {"stem": "塔勒布反复强调「做多波动性」（long volatility）是反脆弱的。以下哪个行为是「做多波动性」？", "options": ["A. 买一只蓝筹股长期持有，不管涨跌", "B. 每天做T+0短线交易", "C. 买指数基金长期定投", "D. 在市场暴跌时买便宜的看涨期权——跌了最多亏期权费，涨了赚几十倍。你实际上是在「买波动」而非「买上涨」"], "type": "choice", "answer": 3, "explain": "做多波动性=从波动中获益。期权是典型的不对称工具：最大亏损=期权费（有限），潜在收益=无限。日常持有现金+暴跌时买入期权=杠铃策略的金融版。波动越大你越赚。"}, {"stem": "「剥夺政治权利的反脆弱性」——塔勒布说禁止某些东西反而让它更强大。为什么？", "options": ["A. 人的逆反心理，越禁止越想尝试", "B. 被禁止的东西往往是对的", "C. 这只是极权国家的宣传工具，没有实际作用", "D. 如果不准公开讨论一个观点，它的传播反而会转入地下更隐蔽地蔓延，更难追踪和反驳。公开争论中的坏观点自然会被淘汰，禁掉反而给了它生命力"], "type": "choice", "answer": 3, "explain": "塔勒布：言论和观点的「禁果效应」——压制一个观点就是给它打广告。真正的反脆弱是让它在公开市场争论，坏观点自然消亡。禁掉=不让它见光=保护了它。"}, {"stem": "塔勒布的伦理核心：一个人说的和他做的是否一致。经济学家预测经济衰退却不做空，这意味着？", "options": ["A. 他根本不信自己说的话——真正相信自己判断的人会用自己的钱去下注。没有「切身利益」的观点一文不值", "B. 他有职业道德，不能用自己的预测牟利", "C. 做空风险太大，经济学家也是普通人", "D. 他预测的是长期趋势，短期不一定要操作"], "type": "choice", "answer": 0, "explain": "skin in the game（切身利益）是塔勒布最核心的伦理原则。如果一个人预测某件事会发生但他自己不以任何方式承担后果，那他对自己的预测根本不信。像胖子托尼说的：「如果错了，他自己会受伤吗？」"}, {"stem": "塔勒布为什么说「中产阶级的道德缺陷」是现代社会的一个大问题？", "options": ["A. 中产阶级经常「转移脆弱性」——比如经理人让公司冒险，公司倒闭他拿遣散费走人，员工和股东承担损失。他得到了冒险的好处，却不承担冒险的代价。这是道德上的盗窃", "B. 中产阶级太在意别人的看法，活得很累", "C. 中产阶级不关心社会底层", "D. 中产阶级消费太多资源"], "type": "choice", "answer": 0, "explain": "脆弱性转移=让别人为你的错误买单。银行高管拿高额奖金，出了事让纳税人救——他们获得冒险的好处（奖金），不承担冒险的代价（破产）。这本质上是把反脆弱的一面留给自己，把脆弱的一面转移给别人。"}, {"stem": "罗马斯多葛派和现代学术界，哪个更符合「切身利益」原则？", "options": ["A. 现代学术界——有严谨的同行评审制度", "B. 罗马斯多葛派——塞内加写「财富不重要」的时候是非常有钱的人，他对自己的话语承担全部风险。而现在许多学者写的东西和私下说的完全不同，论文不承担真实世界的后果", "C. 两者都很符合，都是追求真理的人", "D. 都不符合，人性在任何时代都一样"], "type": "choice", "answer": 1, "explain": "塔勒布极度崇拜古罗马斯多葛派——他们「言行合一」，说财富不重要就用行动证明，说勇敢就自己去上战场。而现代学术界很多人发表论文是为了职称而不是真理，错了也不用承担任何实际后果。"}, {"stem": "一个人口口声声说「要帮助穷人」，但自己从不捐钱也不做义工。塔勒布会怎么评价？", "options": ["A. 他至少传播了正能量，也有贡献", "B. 每个人能力不同，不能要求人人都做同样的事", "C. 空头支票——没有切身利益的道德表态不是道德，是自我感动。真想帮助穷人，你应该捐出自己的钱或者时间去承担真实的成本", "D. 说总是比做容易，但说也有说的价值"], "type": "choice", "answer": 2, "explain": "塔勒布的「信念承诺」：如果你信某件事，你就要为它承担风险。没有承担风险的信念是假的。就像一个人说某股票会涨但自己不买——他其实不信。道德也是一样。"}, {"stem": "塔勒布说「妥协就是纵容」。为什么对温和派来说这很难接受？", "options": ["A. 温和派缺乏勇气", "B. 温和派没有自己的立场", "C. 这只是塔勒布的极端观点，现实需要妥协", "D. 因为温和派喜欢说「两边都有道理」——但面对欺诈和不道德的行为，沉默和中立就是帮凶。就像看到一个人偷东西你不报警，你客观上帮了他。道德问题没有中间地带"], "type": "choice", "answer": 3, "explain": "塔勒布的道德立场极为鲜明：「对傲慢者友好无异于对友好者傲慢」。当面对明显的不道德行为时，「中立」就是选边站——你选了不道德的那一边。这和「切身利益」一脉相承。"}, {"stem": "这本700页的《反脆弱》，如果用一句话总结其核心行动指南，最准确的是？", "options": ["A. 多读书少做事，知识就是力量", "B. 努力工作攒钱，减少不必要的消费", "C. 相信直觉，不要相信数据和分析", "D. 把大部分资源放在极其安全的地方，小部分去博取非线性回报。不要试图预测未来，而是让自己在任何未来中都能获益。少做加法（干预），多做减法（去除脆弱性）"], "type": "choice", "answer": 3, "explain": "反脆弱的行动指南三件套：①杠铃策略（极度安全+极度冒险，避开平庸的中间地带）；②可选择性（大量低成本试错，损失有限、收益无限）；③否定法（少做多余的事，去掉脆弱源比增加保护更重要）。"}]};
quizData.gl14 = {"title": "广论卷14", "questions": [{"stem": "宗喀巴大师说，大小乘一切功德都是止和观的果。一个每天念经拜佛但心猿意马的人，和一个每天只坐十五分钟但心能定住的人，谁的修行进步更快？", "options": ["A. 坐十五分钟的人，因为定力才是功德的基础，散乱心做事力量微薄", "B. 念经拜佛的人，因为他做的事情多，积累的功德大", "C. 一样快，功不唐捐嘛，做什么都是修行", "D. 看谁更虔诚，跟时间长短没关系"], "type": "choice", "answer": 0, "explain": "广论说「心散乱所作，佛说无义利」。有了定力，修什么善法都有大力；没有定力，心散乱的时候所修善法力量微弱。"}, {"stem": "一个人修行多年，做了很多功课但内心依然烦躁。广论会怎么诊断他的问题？", "options": ["A. 他缺的不是功课量，而是没有修「止」——心不能安住在一个所缘上", "B. 他业障太重，需要先消业障再谈修行", "C. 他应该换一个更殊胜的法门，这个法不适合他", "D. 修行本来就是慢工夫，再熬几年就好了"], "type": "choice", "answer": 0, "explain": "广论明确指出：一切功德都是止观之果。你做的任何修行如果心是散乱的，力量就很小。问题不在功课的量，在心的质量。"}, {"stem": "有人问：「止观不是修行到很高层次才需要的东西吗？我现在连基础都没打好。」广论的回答是？", "options": ["A. 对，先修好基础戒律和布施，再来谈止观", "B. 错，止观贯穿一切修行层次，不是高级专属品——把心定在一个善所缘上就是止，观察思考法义就是观", "C. 无所谓，每个人根器不同，有人不需要止观也能成就", "D. 止观是密宗才修的，显宗不需要"], "type": "choice", "answer": 1, "explain": "广论引用《解深密经》：三乘所有功德都是止观之果。专注呼吸是止，思惟无常是观——从一开始就在修。"}, {"stem": "有人在修行群里问：「有没有一个法门能统摄所有禅定？」广论怎么回答？", "options": ["A. 没有，各种禅定法门差异很大，不可能统摄", "B. 净土宗的念佛三昧可以统摄一切", "C. 有，就是止和观——像一棵树的树干，其他所有禅定都是枝叶", "D. 这个问题本身就不对，禅定不能统摄"], "type": "choice", "answer": 2, "explain": "广论说：就像一棵树有无边枝叶花果，但根本是树干。一切三摩地都可以归为止观两大类。不求庞杂，求根本。"}, {"stem": "广论引经文说「众生为相缚，及为粗重缚，要勤修止观，尔乃得解脱。」这里「相缚」和「粗重缚」分别指什么？", "options": ["A. 相缚是执着色相美丑，粗重缚是身体沉重懒惰", "B. 相缚是贪爱财物，粗重缚是脾气暴躁", "C. 相缚是别人对你的看法，粗重缚是自己给自己的压力", "D. 相缚是对外境的颠倒认知，靠止来断；粗重缚是内心深处的习气，靠观来断"], "type": "choice", "answer": 3, "explain": "广论解释：相缚是「于外境前后所生颠倒习气」由止对治；粗重缚是「心相续中所有习气」由观对治。"}, {"stem": "有人觉得只要多做好事、持戒清净就够了，不需要刻意修定。广论怎么看？", "options": ["A. 完全正确，戒律是根本，定力自然就有了", "B. 持戒和定力是两回事——持戒是好习惯，但心散乱时依然散乱，没有止力善法力量微弱", "C. 不持戒不能修定，必须先持戒清净再谈修定", "D. 这个问题不重要，随缘就好"], "type": "choice", "answer": 1, "explain": "广论说戒定慧是次第，但不是「持戒好了自动就有定」。就像吃得好不代表有肌肉，得练。"}, {"stem": "广论说：「若不能灭不乐修定，乐定障品所有懈怠，初即于定不令趣入。」这对禅修初学者有什么实际启发？", "options": ["A. 要先找到最好的禅修方法，方法不对怎么修都没用", "B. 初学者不能自己修，必须有老师盯着", "C. 修定最大的敌人不是昏沉掉举，而是一开始的懒惰——要多想想禅定的好处，对定产生强烈的向往，否则连门都进不去", "D. 先要把身体锻炼好，身体好了才能修定"], "type": "choice", "answer": 2, "explain": "广论说五过失中懈怠是第一要害——「纵一获得亦不能相续，速当退失」。修定前先要对定产生强烈的希求心。没有动力，其他都免谈。"}, {"stem": "广论说奢摩他（止）的定义包含两个要素，缺一个就不是真正的止。这两个要素是？", "options": ["A. 盘腿打坐和数呼吸，缺一不可", "B. 入定和出定都很自如，不能有勉强", "C. 看到光明相和听到声音才算入止", "D. 心能专注安住于一个所缘，并且生起身心轻安喜乐——不是硬撑的专注，是轻松自然的专注"], "type": "choice", "answer": 3, "explain": "广论明确：奢摩他=心于境能任运住+生起身心轻安。不是咬牙死撑的专注，是轻松自然的。"}, {"stem": "毗钵舍那（观）的核心是什么？广论针对一个著名的错误观点做了激烈辩论。", "options": ["A. 观是用智慧去观察和思择法义，不是无分别的呆坐。当年有位禅僧主张「什么都不想就是修行」，被宗喀巴大师引经据典激烈驳斥", "B. 观就是什么也不想，放空自己，不思善不思恶", "C. 观就是看破红尘，一切皆空，无所得", "D. 观需要上师加持才能生起，自己修不出来"], "type": "choice", "answer": 0, "explain": "广论专门批评了支那堪布主张的「全不作意」。宗喀巴引《解深密经》说毗钵舍那就是「正思择、最极思择」，是清醒的观察思考，不是放空发愣。"}, {"stem": "有个人说：「我能一坐三小时不动，心也很静，应该算是证到止了吧？」广论怎么判断？", "options": ["A. 就是止，能坐很久不动说明定力很深", "B. 关键看有没有入定的感觉，时间长短不重要", "C. 不一定——如果没有生起身心轻安（那种由内而外的舒畅快乐），只是普通的三摩地，不是真正的奢摩他", "D. 能坐三小时已经很厉害了，肯定是止"], "type": "choice", "answer": 2, "explain": "广论严格区分：轻安是分水岭。没有轻安的定只是「奢摩他随顺」，不等于真正的奢摩他。"}, {"stem": "广论用了一个极其形象的比喻来说明为什么要止观双修。这个比喻是什么？", "options": ["A. 鸟要有两只翅膀才能飞，缺一不可", "B. 船要浆和舵配合才能航行，缺一不行", "C. 吃饭要筷子碗配合，光有饭没筷子吃不了", "D. 夜间看壁画——灯要够亮（观慧）而且不能被风吹动（止力）。灯暗看不清，灯亮但被风吹也看不清，必须灯亮又稳定"], "type": "choice", "answer": 3, "explain": "广论用「灯」和「风」的比喻：观慧是灯（照明真实），止是挡风（让灯不摇晃）。只有灯没有挡风罩→风一吹就摇，看不清。只有罩没有灯→一片黑。必须双修。"}, {"stem": "有人先拼命修观（思惟空性），心散乱得像风中烛火。他应该怎么调整？", "options": ["A. 先停下来修止——等心能安住不散乱了，再回头看空性，会发现以前模糊的道理突然清楚了许多", "B. 继续修观，多思惟自然心就不乱了", "C. 放弃空性，改修别的法门", "D. 两个都不修，找上师灌顶直接开悟"], "type": "choice", "answer": 0, "explain": "广论说：「未奢摩他前，虽以观慧观无我义，心极动摇如风中烛……若成止后而善观察，则已灭除极动过失。」先得止，再修观。"}, {"stem": "「声闻不见如来种性，以定力强故慧力劣故。菩萨虽见而不明显，慧力强故定力劣故。惟有如来遍见一切，止观等故。」这段经文的核心寓意是？", "options": ["A. 声闻不如菩萨，菩萨不如佛，差距在功德量的积累上", "B. 修行成败不在偏重某一边——声闻偏定（安稳但智慧不够），菩萨偏慧（聪明但心不稳），佛是定慧完全平衡", "C. 修定比修慧容易，所以声闻比菩萨先成就", "D. 三种修行人的境界不一样，跟修行方法无关"], "type": "choice", "answer": 1, "explain": "《大般涅盘经》这段话完美诠释止观平衡：修行不是比谁定力深或谁聪明，是比谁定慧均等——像灯又亮又不被风吹。"}, {"stem": "广论说只修止不修观能压住烦恼，但有什么致命缺陷？", "options": ["A. 压住的烦恼会加倍反弹回来，比原来更严重", "B. 只修止的人会变迟钝，智慧越来越差", "C. 只修止容易走火入魔，有危险", "D. 只能暂时压住烦恼的「现行」（表面表现），断不了烦恼的「种子」（根）。就像把草割了根还在，一浇水又长出来"], "type": "choice", "answer": 3, "explain": "广论引《修次中编》：「惟修止，惟能暂伏烦恼现行，不能断障。」《解深密经》：「由静虑故降伏烦恼，由般若故断诸随眠。」止是压，观才能断根。"}, {"stem": "有人质疑：「我先学懂了空性道理，然后一边定住心一边观察空性，止和观不就同时修了吗？为什么非要先修止再修观？」广论的回答是？", "options": ["A. 理解空性不必须先有止，散乱心也能学。但真正的毗钵舍那需要轻安为体性，轻安必须在止的基础上修观才能生起。轻安是分水岭", "B. 不可能同时修，因为止是无分别的、观是有分别的，互相矛盾", "C. 这是最高级的修法，一般人做不来所以必须先修止", "D. 理论上可以同时修，但实际操作太难所以分开"], "type": "choice", "answer": 0, "explain": "广论精微辨析：学空性（正见）不需要止，散乱心也能理解。但「毗钵舍那」不是普通思考，以轻安为体性——没有止就没有轻安，没有轻安就不叫毗钵舍那。"}, {"stem": "止观修行的「分水岭」是什么？广论反复强调的标准是？", "options": ["A. 能坐多久不动——少于两小时的不算入止", "B. 轻安的生起——修止到生起身心轻安才是奢摩他；依止修观到以观察引发轻安才是毗钵舍那。两层轻安，两个分水岭", "C. 能否见到光明或听到声音", "D. 上师的认证——自己说了不算"], "type": "choice", "answer": 1, "explain": "轻安是硬标准。修止→生轻安→奢摩他。依奢摩他修观→以观察力引发新轻安→毗钵舍那。两层轻安，两个分水岭。"}, {"stem": "修止前要准备六种资粮。如果闭关修定，哪个环节是「地基中的地基」？", "options": ["A. 找一个安静的地方住下来", "B. 找一个好上师指导", "C. 清净戒律+观察贪欲过患+住在合适的环境——这三样是主要的，缺了根本修不起来", "D. 先学会跏趺坐（双盘）的姿势"], "type": "choice", "answer": 2, "explain": "六资粮中「尤以清净尸罗、观欲过患、住相顺处为其主要」。持戒清净内心不乱，看到欲望过患才有动力，环境合适才能安心。"}, {"stem": "「我等惟觉是教授过，专求教授。然定不生，是未安住资粮所致。」这话对现代修行人有什么警示？", "options": ["A. 别总想着换法门找秘笈——定修不起来不是因为方法不够好，是基本条件没准备好。就像地没翻好就怪种子不好", "B. 教授法门很重要，要找最高级的才能成就", "C. 修行要有耐心，只要坚持就一定能成功", "D. 应该多跟善知识学习，少自己瞎搞"], "type": "choice", "answer": 0, "explain": "善知识敦巴这句话一针见血：人总以为「这个方法不行，换一个」，其实不是方法问题，是自己六资粮没到位。"}, {"stem": "广论介绍「九住心」的修止次第。这九步的实质是什么？", "options": ["A. 九种不同的打坐姿势，从简单到困难依次掌握", "B. 九个修行阶段，每阶段换一个所缘对象，从粗到细", "C. 心从完全散乱→慢慢能收回来→逐渐稳定→最后不费力地安住在一个所缘上。一个从「打仗」到「自动巡航」的过程，始终同一个所缘", "D. 九个咒语，依次念诵能入定"], "type": "choice", "answer": 2, "explain": "九住心：内住→续住→安住→近住→调伏→寂静→最极寂静→专注一趣→等持。从头到尾同一所缘，只是心的稳定程度在提升。"}, {"stem": "修止时要用「八断行」对治「五过失」。五个过失中，第一个也是必须最先克服的是？", "options": ["A. 昏沉——修着修着就睡着了", "B. 懈怠——懒得修，对修定没有热情。不先解决这个，后面的昏沉掉举都无从谈起", "C. 掉举——心不断往外跑，想东想西", "D. 忘失所缘——修着修着忘了自己在修什么"], "type": "choice", "answer": 1, "explain": "广论说五过失中懈怠是第一要害：「若不能灭不乐修定，初即于定不令趣入。」懒是最大的敌人——连开始都开始不了，谈什么昏沉掉举。"}, {"stem": "佛经说了好几种修止的「所缘」（专注对象），如观呼吸、观不净、修慈心等。应该怎么选？", "options": ["A. 随便选一个自己喜欢的就行，效果都一样", "B. 必须从观呼吸开始，这是最基础的", "C. 观佛像效果最好，其他都不如", "D. 看你的性格弱点来——贪心重的人观不净（看身体真实样子），瞋心重的人修慈悲观，散乱重的人观呼吸。对症下药"], "type": "choice", "answer": 3, "explain": "广论引《声闻地》详细分类：贪增上→不净观，瞋增上→慈悲观，痴增上→缘起观，慢增上→界差别观，寻思增上→呼吸观。精准对症，不是随便选。"}, {"stem": "有人说：「修定就是什么都不想，所缘都不要，那才是最高的空性。」广论怎么驳斥？", "options": ["A. 空性确实是什么都不想，这个人说的是对的", "B. 自相矛盾——你说「安住无所缘」，那心总得有个地方安住吧？你那个「要什么都不缘」的念头本身就是所缘。而且是不是修空性，要看有没有通达空性的智慧，不是看想不想", "C. 这是密宗的观点，显宗不这么认为", "D. 需要很高根器才行，初学者不能这么做"], "type": "choice", "answer": 1, "explain": "广论犀利指出：「彼必先念我当持心必令于境全不流散，次持其心，是则缘于惟心所缘。」你说什么都不缘，你那个要什么都不缘的念头就是在缘的东西。逻辑上的自我矛盾。"}, {"stem": "修止仪轨包括打坐姿势细节（舌抵上颚、眼垂注鼻端等）。为什么要强调这些身体细节？", "options": ["A. 这是密宗的秘密法门，有特殊能量通道", "B. 这是一种传统仪式，必须遵守才有传承加持", "C. 主要是为了看起来庄严肃穆，跟实际修行关系不大", "D. 身体姿势直接影响心的状态——端正不歪就不容易昏沉，舌抵上颚口水不乱流不分散注意，眼微闭不太紧不太松恰到好处"], "type": "choice", "answer": 3, "explain": "广论把身威仪讲得很实在：结跏趺坐有五因缘——速发轻安、能久坐不累、不同于外道、令人敬信、佛所开许。舌抵上颚、眼垂鼻端都是为了调身以安心的实用技术。"}, {"stem": "有人说：「我打坐时感觉很舒服，身体轻飘飘的，心里很开心，这应该就是奢摩他了吧？」广论怎么判断？", "options": ["A. 不一定——没有证空性的定也能生起舒服和开心的感觉。要看你的舒服是否来自心真正安住于所缘的轻安，还是仅仅久坐带来的生理放松", "B. 就是奢摩他，有轻安和喜乐就对了", "C. 需要看入定的深度，至少要坚持半小时以上才算", "D. 关键是看有没有见到禅相（nimitta），没有就不算"], "type": "choice", "answer": 0, "explain": "广论警告：「诸未趣向空性之定，亦有极多明了安乐及无分别。」不能以「舒服」「清晰」「不想事」来判断是不是真正的止观。"}, {"stem": "达到第九住心「等持」之后，接下来会发生什么？", "options": ["A. 直接开悟了，不需要再修什么", "B. 需要上师灌顶才能进入下一个阶段", "C. 继续修下去，等持的心不断深入，最终生起身心轻安——那一刻才叫奢摩他成就。九住心只是描述了过程，轻安才是临门一脚", "D. 等持之后自然就会起神通了"], "type": "choice", "answer": 2, "explain": "广论强调：九住心只是修止的过程描述，真正的奢摩他是在等持之后生起轻安才成立。九住心是方法（因），轻安是成果（果）。达到第九不意味成功。"}, {"stem": "用一句话总结广论卷十四的核心思想，最准确的表述是？", "options": ["A. 修行就是打坐，打得越久越好", "B. 持戒是最根本的，定慧都是附属品", "C. 心能安住（止）和智慧观察（观），是修行的两条腿——缺一条都走不远。而且要先练好止这条腿，观才能真正有力。轻安是检验是否练好的标准", "D. 人人都能开悟，只要有信心和耐心"], "type": "choice", "answer": 2, "explain": "卷十四通篇讲：止观是一切修行功德的基础；各有标准（轻安是分水岭）；必须双修（风中烛喻）；先止后观（次第决定）；具体怎么修（六资粮→九住心→所缘选择）。"}]};
quizData.gl14q = {"title": "广论卷一至四", "questions": [{"stem": "广论引《听闻集》说闻法有极大利益。以下哪个不属于闻法的胜利？", "options": ["A. 闻法能让我们了解什么是善什么是恶，从而遮止造恶、行持善法", "B. 闻法能生起智慧，最终断除烦恼、获得解脱", "C. 闻法能让我们在世间获得名声、地位和财富，因为知识就是力量", "D. 闻法能破除无明黑暗，如同灯烛照亮黑暗中的一切"], "type": "choice", "answer": 2, "explain": "广论引《听闻集》说：「由闻知诸法，由闻遮诸恶，由闻断无义，由闻得涅槃。」闻法的利益在于知法遮恶、断无义、得涅槃，跟世间名利地位无关。把闻法当作获取世俗利益的工具，恰恰违背了闻法的目的。"}, {"stem": "广论说听法者要「断器三过」。其中「覆器」指的是听法时心不在焉、东想西想，就像把容器倒扣着，再怎么倒水也装不进去。", "options": ["A. 于法作药物想——因为病人需要先拿药才能治病", "B. 于法师作医师想——因为只有先认识到自己病了（烦恼病），才会去找医生（善知识）治疗", "C. 于如来作善士想——因为佛陀是最高明的医生", "D. 于正法理起久住想——因为佛法久住才能利益更多人"], "type": "choice", "answer": true, "explain": "断器三过：①覆器——虽然身在听法，但心不专注，法水不入；②污器——虽然听了，但带着偏见、邪见或为名利而听，如同脏碗盛水；③漏器——听了就忘，不复习不思维，如同漏底容器。覆器是最基本的过失——先要专心听，才有后面的清净和忆持问题。"}, {"stem": "广论说听法时应依六种想。其中「于己作病人想」之后，紧接着应该是哪种想？为什么这个顺序很重要？", "options": ["A. 于法作药物想——因为病人需要先拿药才能治病", "B. 于法师作医师想——因为只有先认识到自己病了（烦恼病），才会去找医生（善知识）治疗", "C. 于如来作善士想——因为佛陀是最高明的医生", "D. 于正法理起久住想——因为佛法久住才能利益更多人"], "type": "choice", "answer": 1, "explain": "六种想是有逻辑次第的：先确认自己有烦恼病（病人想），才会去找善知识（医师想），然后接受教授（药物想），认真修习（疗病想），恭敬说法者（善士想），祈愿正法久住。第一步「病人想」最关键——如果觉得自己没病，后面一切都谈不上。"}, {"stem": "广论说善知识应具备十种德相。以下哪组正确列出了其中最核心的三种？", "options": ["A. 神通广大、辩才无碍、相貌庄严——因为弟子需要被超自然力量折服", "B. 戒、定、慧三学清净——因为只有自己修证了才能引导别人，这是最基础的资格", "C. 年高腊长、弟子众多、寺庙宏大——因为规模代表实力", "D. 精通仪轨、擅长焰口、会打卦算命——因为信众需要这些服务"], "type": "choice", "answer": 1, "explain": "六度论师说：「所知识者，若是持戒增上，定增上，慧增上。」戒定慧三学是善知识最核心的德相。其他七种（多闻、通达真实、德增上、善说法、具悲悯、精进、断疲厌）都是在三学基础上的补充。「神通」「规模」「仪轨」都不是广论强调的标准。"}, {"stem": "广论强调弟子对善知识要「修信为根本」，甚至要「视师如佛」。这个要求的真正含义是什么？", "options": ["A. 必须相信自己的上师在客观上就是佛的化身，否则就是犯戒", "B. 这是藏传佛教特有的制度，汉传和南传佛教不需要", "C. 弟子必须无条件服从善知识的一切命令，包括不合理的要求", "D. 善知识确实可能犯错误，但弟子不应观察过失，因为寻过失会障碍自己得到加持和利益"], "type": "choice", "answer": 3, "explain": "广论引《不可思议秘密经》说不应观察善知识的过失。原因不是「上师不可能犯错」，而是弟子不断盯着过失，内心就会产生不敬和排斥，从而障碍自己从善知识那里获得教授的利益。这是一种实修策略——保护自己的信心不被分别念破坏，而非要求盲从。"}, {"stem": "广论用「盲龟值木」的比喻来说明暇满人身的难得。这个比喻的核心意思是什么？", "options": ["A. 每个人都有成佛的可能，就像盲龟终有一天会碰到木板", "B. 佛法如同木板，众生如同盲龟，只要坚持终能相遇", "C. 修行就像盲龟在黑暗中摸索，需要有耐心和毅力", "D. 在无边大海中，一只盲龟每百年浮出水面一次，头恰好钻进一块漂浮木板的孔中——得人身的概率比这还低"], "type": "choice", "answer": 3, "explain": "盲龟值木的比喻出自《庄严经论》：大海中一只盲龟，百年才浮出海面一次，海面上一块木板有一个小孔——盲龟的头恰好钻入孔中的概率，比获得暇满人身还要大。这不是说「不可能」，而是强调在无量轮回中，得人身闻佛法是极其稀有珍贵的，不可虚度。"}, {"stem": "广论提出「三士道」的修道框架——下士、中士、上士。为什么要让学人先修中下士道，而不是直接修上士道？", "options": ["A. 中下士道是上士道的基础和前行——没有厌离生死的心（中士）和畏惧恶趣的心（下士），所谓的菩提心就是空洞的口号", "B. 因为上士道太难了，只有少数利根人能修，普通人只能修下士道", "C. 因为三士道是三个不同的目标，修行人需要选择其中之一", "D. 因为宗喀巴大师按难度排序，从易到难逐步教学，跟基础无关"], "type": "choice", "answer": 0, "explain": "广论的核心教义之一：「共下士道」「共中士道」——中下士道不是独立的终点，而是上士道的必经之路。如果不知道恶趣苦（下士），就不会真心修行；如果不厌离轮回（中士），就不会真正发菩提心求解脱度众生。基础打不好，上士道的菩提心就是空中楼阁。"}, {"stem": "广论说念死无常有三个根本思惟。以下哪个不属于这三根本？", "options": ["A. 思惟死后会投生何趣——通过占卜或神通预知自己下一世去哪里，以便提前准备", "B. 思惟死无定期——今日会不会死谁也说不准，不能依赖「我还有时间」", "C. 思惟死时除法以外一切无益——财物、亲友、身体都带不走，唯有善业跟随", "D. 思惟决定死——凡是有生必有死，佛菩萨罗汉都要入灭，何况凡夫"], "type": "choice", "answer": 0, "explain": "三根本是：决定死、死无定期、死时除法余皆无益。每根本还配三因共九因。第四个「预知投生何处」不在三根本中——重要的是现在就修，而不是去算命占卜。何况凡夫没有神通，占卜也不可靠。广论说：「现见一切死殁之中，赞为一死，如是一死亦无定期。」"}, {"stem": "有人想：「我还年轻，今天大概率不会死，等我老了再修也不迟。」广论如何破斥这种心态？", "options": ["A. 用神通证明你确实可能今天死，用恐吓让你害怕", "B. 如果觉得「今天不会死」而推迟修行，那么每一天都会这么想——直到真的死了也没修。而且年轻不代表不会死，死缘比活缘更多", "C. 承认这种想法有道理，但建议先做一些简单的善事积累资粮", "D. 广论并不反对这种想法，只是说老年修行效果更好"], "type": "choice", "answer": 1, "explain": "广论引《入行论》：「从今至白法，所存日无多，何能办不死？」死无定期意味着「今天不会死」只是一个猜测，不是确定的事实。如果允许自己基于这个猜测推迟修行，那么每一天都会找到新的借口。真正修行人的心态是「今日会死」，这样每一天都会被当成最后一天来善用。"}, {"stem": "将恶趣苦的类型与其特征配对。", "options": ["A. 信心和虔诚——信三宝是真实的，虔诚地礼拜供养", "B. 畏惧恶趣苦和深信三宝能救护——因为害怕三恶趣的苦，而且确信只有三宝有能力救自己", "C. 智慧和慈悲——用智慧了解苦的真相，用慈悲对待一切众生", "D. 传承和戒律——有清净的传承和受了皈依戒"], "type": "choice", "answer": 1, "explain": "八热地狱是恒温炽燃、反复死活的极端痛苦；近边地狱围绕在大有情地狱周围，是逃出八热后又陷入的附属地狱；寒冷地狱是极度冰冻导致身体冻裂的痛苦；独一地狱则散处于人间、海边、山中等处，众生因个别业力独自受苦。"}, {"stem": "广论说皈依的「因」有两个。以下哪组正确？", "options": ["A. 信心和虔诚——信三宝是真实的，虔诚地礼拜供养", "B. 畏惧恶趣苦和深信三宝能救护——因为害怕三恶趣的苦，而且确信只有三宝有能力救自己", "C. 智慧和慈悲——用智慧了解苦的真相，用慈悲对待一切众生", "D. 传承和戒律——有清净的传承和受了皈依戒"], "type": "choice", "answer": 1, "explain": "广论引《摄抉择分》说皈依的因有二：①由怖畏——对恶趣苦和轮回苦生起真实的恐惧；②由信解——深信三宝有能力救护自己脱离这种苦。只有恐惧没有信心（如外道怕鬼），或只有信心没有恐惧（不觉得自己有危险），都不是真正皈依的因。"}, {"stem": "广论说，已皈依三宝的佛弟子可以同时皈依世间天神，只要把三宝放在第一位就行了。", "options": ["A. 业决定——善业决定感乐果，恶业决定感苦果，丝毫不会错乱", "B. 业增长广大——微小的善恶业会随着时间增长成巨大的果报", "C. 业力可以转移——通过做足够的善事可以抵消恶业，使恶业的果报消失", "D. 业不作不受——如果没有造某种业，就不会受那种果；已造的业不会失坏"], "type": "choice", "answer": false, "explain": "广论明确说皈依后有应遮止的学处：「不归依天神等」——世间天神自己还在轮回中，没有能力救护别人，向他们皈依违背了皈依佛的根本誓。但广论不是说不能恭敬天神——恭敬和皈依是两回事。可以恭敬如朋友，但不能皈依为救护者。"}, {"stem": "广论说业果有四个总相。以下哪个不属于这四个总相？", "options": ["A. 业决定——善业决定感乐果，恶业决定感苦果，丝毫不会错乱", "B. 业增长广大——微小的善恶业会随着时间增长成巨大的果报", "C. 业力可以转移——通过做足够的善事可以抵消恶业，使恶业的果报消失", "D. 业不作不受——如果没有造某种业，就不会受那种果；已造的业不会失坏"], "type": "choice", "answer": 2, "explain": "四总相是：业决定、业增长广大、不作不受、作已不失。第三个选项「业力可以转移」是错误的——广论明确说「作已不失」，已造的业不会凭空消失。但恶业可以通过忏悔（四力忏悔）来减弱或改变其果报形式，这跟「转移/抵消」不同，忏悔是改变业力的成熟条件。"}, {"stem": "十恶业中，身恶业有三种。以下哪组是正确的？", "options": ["A. 杀生、妄语、饮酒——包括身体和语言的恶业", "B. 杀生、偷盗、邪淫——三种身体造作的恶业", "C. 偷盗、邪淫、嗔恚——混合了身业和意业", "D. 杀生、邪淫、绮语——混合了身业和语业"], "type": "choice", "answer": 1, "explain": "十恶业分三类：身三（杀、盗、淫）、语四（妄言、绮语、两舌、恶口）、意三（贪、嗔、痴/邪见）。身恶业只有杀生、偷盗、邪淫这三种，其余选项都混入了语业或意业。每种恶业又有四种果报：异熟果、等流果、增上果和士用果。"}, {"stem": "将八苦与其核心特征配对。", "options": ["A. 身体疼痛、心情焦虑等明显的苦受——这是人人都能感受到的苦", "B. 快乐消失时产生的失落感——因为快乐是无常的，所以快乐本身也包含苦", "C. 行走站立时的身体疲劳——所以叫「行」苦", "D. 一切有为法都在刹那生灭，被烦恼和业力推动着不由自主地流转——这才是苦的真正本质"], "type": "choice", "answer": 3, "explain": "八苦是广论中士道思惟苦谛的核心。前七苦是具体的表现，第八「五取蕴苦」是总——所有苦的根源在于我们有一个由烦恼取著而生的身心（五取蕴）。只要还在轮回中，五取蕴就不断生灭，苦就不断产生。"}, {"stem": "广论说苦有三种：苦苦、坏苦、行苦。以下哪个描述最准确地表达了「行苦」？", "options": ["A. 身体疼痛、心情焦虑等明显的苦受——这是人人都能感受到的苦", "B. 快乐消失时产生的失落感——因为快乐是无常的，所以快乐本身也包含苦", "C. 行走站立时的身体疲劳——所以叫「行」苦", "D. 一切有为法都在刹那生灭，被烦恼和业力推动着不由自主地流转——这才是苦的真正本质"], "type": "choice", "answer": 3, "explain": "苦苦是明显的苦受，坏苦是快乐变坏时的苦，行苦是一切有为法的不自主性——被烦恼和业推动着刹那生灭。广论说行苦才是苦谛的真正所指：即使在不苦不乐的舍受状态中，只要还在轮回中，身心就不断被烦恼和业力裹挟，像被绑在火宅中一样。前两苦是行苦的表现。"}, {"stem": "广论说烦恼的根本是什么？一切生死轮回的源头是什么？", "options": ["A. 贪欲——因为贪求各种东西才造业，造业才轮回", "B. 嗔恨——嗔恨是最强的破坏力，能毁坏一切善根", "C. 愚痴——没有知识学问，所以才会做错事", "D. 无明我执（萨迦耶见）——把本来无我的五蕴执着为一个实有的「我」，由此产生一切烦恼和轮回"], "type": "choice", "answer": 3, "explain": "广论引《释量论》说：「一切过根本，即坏聚见（萨迦耶见）。」萨迦耶见就是把五蕴（色受想行识）执着为有一个独立、真实的「我」。有了「我」，就有「他」，就有贪（喜欢我的/他的）、嗔（不喜欢我的/他的）、慢（我比他强）等烦恼。断除我执就是断除轮回的根本。"}, {"stem": "广论讲十二缘起——无明、行、识、名色、六入、触、受、爱、取、有、生、老死。一支一支地流转下去，构成生死轮回。以下关于十二缘起的说法，哪个正确？", "options": ["A. 十二支是固定不变的先后顺序，每次轮回都必须完整地经历全部十二支", "B. 十二缘起讲的是前世今生的因果关系，每一支对应一世的寿命", "C. 十二支可以归纳为能引（无明行识）、所引（名色六入触受）、能生（爱取有）、所生（生老死）四组", "D. 十二缘起只有理论意义，实修中用不上"], "type": "choice", "answer": 2, "explain": "广论按《本地分》把十二支归纳为四组：能引支（无明→行→识）——引生后世的种子；所引支（名色→六入→触→受）——被引出的果报；能生支（爱→取→有）——将种子催熟为后有；所生支（生→老死）——正式受生的果。这个分类帮助修行人找到断除轮回的关键：断「爱取」就不会生「有」。"}, {"stem": "广论说灭谛的「灭」指的是消灭一切现象、进入什么都没有的虚空状态。", "options": ["A. 持戒就是严格遵守所有的戒条，一条都不能犯，否则就没有成就的可能", "B. 持戒是为了显示自己比别人修行好，让信众生起恭敬心", "C. 戒的体性是「思」，是一种断除身语恶行的决意，通过防护造恶来保护一切善法不损失", "D. 只要有戒律清净就一定能开悟，不需要修定和慧"], "type": "choice", "answer": false, "explain": "灭谛的「灭」不是消灭一切现象，而是「灭除烦恼和苦」——当烦恼的因（我执无明）被智慧火烧尽后，苦的相续就停止了。灭谛是烦恼和苦的永久止息，是一种离系所显的寂静状态，不是虚无。佛陀在灭谛中依然可以说法、度众生。"}, {"stem": "广论说「戒是一切善法的根本」。以下关于持戒的说法，哪个最接近广论的原意？", "options": ["A. 持戒就是严格遵守所有的戒条，一条都不能犯，否则就没有成就的可能", "B. 持戒是为了显示自己比别人修行好，让信众生起恭敬心", "C. 戒的体性是「思」，是一种断除身语恶行的决意，通过防护造恶来保护一切善法不损失", "D. 只要有戒律清净就一定能开悟，不需要修定和慧"], "type": "choice", "answer": 2, "explain": "广论引《入中论》说戒的体性是「思」（一种心理功能），它的作用是防非止恶。持戒不是死守条文，而是培养一种决意——「我不造这种恶业」。这种决意保护了已有的善法（不被恶业破坏），也为定和慧打下了基础。犯了戒可以如法忏悔，不是一犯就完了。"}, {"stem": "广论说戒定慧三学有因果关系。这个因果关系是怎样的？", "options": ["A. 三学可以同时修，没有严格的先后顺序——戒定慧是一体的", "B. 定最重要，得了定之后戒律自然清净，智慧自然生起", "C. 智慧最重要，有了智慧自然能持戒和得定", "D. 依戒生定，依定发慧——戒律清净后心不散乱才能得定，得定后才能生起真实智慧"], "type": "choice", "answer": 3, "explain": "广论引《梵问经》说依戒生定、依定发慧。这不是说戒律圆满之前完全不能修定，而是说戒律是定的基础——身语不清净的人内心总有不安和悔恨，心无法安住。定又是发慧的助缘——散乱心虽然也能理解空性，但要现证空性需要定力支撑。所以三学有层层递进的因果关系。"}, {"stem": "将七因果教授的修心次第与其内容配对。", "options": ["A. 因为只有在确认「一切众生都曾做过我的母亲」之后，念恩、报恩、慈、悲才有真实的基础——否则慈悲只是一种抽象的善良", "B. 因为佛教重视孝道，所以要把众生都当成母亲来孝顺", "C. 知母只是一种冥想技巧，帮助放松心情", "D. 因为在无量轮回中众生确实都做过我们的母亲，这是客观事实，不承认就是不尊重因果"], "type": "choice", "answer": 0, "explain": "七因果的顺序有严格逻辑：知母→念恩→报恩→慈→悲→增上意乐→菩提心。前六支是菩提心的因，第七支是果。关键转折在「增上意乐」——从「愿众生离苦」（慈悲，声闻也有）升级为「我要亲自来做这件事」（增上意乐，大乘特有），由此自然生起「要成佛才有能力做到」的菩提心。"}, {"stem": "七因果教授为什么第一步要修「知母」？直接修慈心和悲心不行吗？", "options": ["A. 因为只有在确认「一切众生都曾做过我的母亲」之后，念恩、报恩、慈、悲才有真实的基础——否则慈悲只是一种抽象的善良", "B. 因为佛教重视孝道，所以要把众生都当成母亲来孝顺", "C. 知母只是一种冥想技巧，帮助放松心情", "D. 因为在无量轮回中众生确实都做过我们的母亲，这是客观事实，不承认就是不尊重因果"], "type": "choice", "answer": 0, "explain": "慈悲心的强弱取决于跟对象的亲密程度——对母亲自然容易生起感恩和关爱。如果确认在无始轮回中每一个众生都曾无数次做过我的母亲、以同样的慈爱养育过我，那么对一切众生的念恩报恩心就能生起，慈心悲心就有了坚实的基础。不是抽象地「要对所有人好」，而是有具体感情基础的。"}, {"stem": "广论还介绍了寂天菩萨的「自他相换」菩提心修法。以下哪个最准确地表达了自他相换的核心？", "options": ["A. 把自己的快乐给别人，把别人的苦拿来自己受——关键在「交换」", "B. 爱执自己是一切痛苦的根源，爱执他人是一切快乐的根源——把「爱自己的心」转换成「爱他人的心」", "C. 放弃自我，完全为别人活，不考虑自己的任何需求", "D. 穿别人的鞋子走路，体会别人的感受——培养同理心"], "type": "choice", "answer": 1, "explain": "自他相换不是字面意义上的「交换苦乐」（这在实际操作中很困难），而是转换爱执的对象：原来把「我」放在中心、一切围绕自己转（这是苦因），现在把「他人」放在中心、一切围绕利益他人转（这是乐因）。广论引《入行论》说：「何需更繁语？凡愚求自利，牟尼唯利他。」"}, {"stem": "菩提心分为「愿菩提心」和「行菩提心」。以下哪个描述正确？", "options": ["A. 愿心和行心是两种不同的法门，修一种就够了", "B. 愿心是初地菩萨的境界，行心是八地以上菩萨的境界", "C. 愿心是发愿成佛度众生，行心是受菩萨戒后实际修六度万行——愿心是起点，行心是落实", "D. 愿心是出家人才有的，行心是在家居士修的"], "type": "choice", "answer": 2, "explain": "广论引《入行论》说愿心如「我想去某个地方」，行心如「我正在路上走」。愿菩提心是发自内心地发誓「为利益众生而成佛」，行菩提心是受菩萨戒之后实际修习六波罗蜜。愿心功德极大，但如果不落实为行心，就像想远行却不迈步一样。"}, {"stem": "广论说六度（布施、持戒、忍辱、精进、静虑、般若）已经摄尽了一切菩萨行，不需要再修其他法门。", "options": ["A. 前前为后后的基础——先能布施放下财物，才能持戒不放逸；能持戒才忍得住苦；能忍才精得进；精进才能得定；得定才能发慧", "B. 按佛陀说法的时间顺序排列，没有特别含义", "C. 按难度从低到高排列，布施最容易修所以排在前面", "D. 按功德大小排列，般若功德最大所以排在最后"], "type": "choice", "answer": true, "explain": "广论引《菩萨地》说六度摄尽一切菩萨行：布施摄财物利益的众生、持戒摄不恼害众生、忍辱摄耐苦、精进摄增长善法、静虑摄清净心、般若摄如实知见。一切菩萨行都可以归入这六类中。所以修六度就是修一切菩萨行，不需要另求其他。"}, {"stem": "六度的排列顺序为什么是布施→持戒→忍辱→精进→静虑→般若？", "options": ["A. 前前为后后的基础——先能布施放下财物，才能持戒不放逸；能持戒才忍得住苦；能忍才精得进；精进才能得定；得定才能发慧", "B. 按佛陀说法的时间顺序排列，没有特别含义", "C. 按难度从低到高排列，布施最容易修所以排在前面", "D. 按功德大小排列，般若功德最大所以排在最后"], "type": "choice", "answer": 0, "explain": "广论说六度前前生后后：布施对治悭吝、放下了财物执着后，持戒才容易清净；持戒清净不造恶，遇到违缘才能忍辱；能忍才能精进不退；精进积累资粮，心才能安定（静虑）；心定之后才能如实观察诸法实相（般若）。这个顺序是因果逻辑，不是难度排序。"}, {"stem": "菩萨为什么必须修六度，而不能只修其中一两种？", "options": ["A. 因为六度是一个套餐，缺任何一度其他几度都不起作用", "B. 因为不同的众生需要不同的度来度化——贫穷的用布施、造恶的用持戒、受苦的用忍辱等", "C. 六度各对治一种障碍（悭吝、破戒、嗔恚、懈怠、散乱、愚痴），缺一度就有一类烦恼对治不了，菩提心就无法圆满", "D. 因为这是佛陀的规定，不需要理由，照做就行"], "type": "choice", "answer": 2, "explain": "广论说六度各别对治一种障碍：布施对治悭吝、持戒对治破戒、忍辱对治嗔恚、精进对治懈怠、静虑对治散乱、般若对治愚痴。如果只修几度，未对治的烦恼就会障碍修行。同时六度互为助缘——布施时需要持戒清净、忍辱耐烦、精进不懈等。所以六度要齐修。"}, {"stem": "广论说布施波罗蜜多的体性是什么？关键在什么？", "options": ["A. 布施的数量——给得越多功德越大，关键在于尽量多给", "B. 布施的方式——必须以恭敬心、跪拜式地递给对方，否则不算如法布施", "C. 布施的对象——给佛僧三宝的功德最大，给普通人功德小", "D. 施心——布施波罗蜜多的体性是「善的思心所」，即施舍的心，而不只是看外在的给予行为"], "type": "choice", "answer": 3, "explain": "广论引《菩萨地》说施波罗蜜多的体性是「善思」——一种善的决意心。重要的是施心（舍心）而非数量。一个穷人真诚地布施一碗饭，功德可能比富翁勉强布施万金更大。当然施心圆满到究竟时，连自己的身体财富都能施，但这不是一开始就要求的。"}, {"stem": "将持戒的三聚净戒与其内容配对。", "options": ["A. 无生法忍——证得无生法忍的圣者才有的境界，凡夫不能修", "B. 安受苦忍——修行和生活中遇到寒冷、饥饿、疾病等苦时，能忍受不动摇", "C. 谛察法忍——对甚深佛法（如无我、空性）的道理能信解接受，不动摇", "D. 耐怨害忍——别人伤害自己时，不愤怒不报复，而是如理思维为什么受苦"], "type": "choice", "answer": 0, "explain": "三聚净戒是菩萨戒的总纲：摄律仪戒（防恶）是基础，摄善法戒（修善）是自利，饶益有情戒（度生）是利他。三者不是各自独立的，而是互相含摄——持摄律仪戒时也在修善法和利益众生。广论说摄律仪戒是三聚净戒的根本，没有它后两种戒就失去了基础。"}, {"stem": "广论说忍辱有三种。以下哪个不属于这三种？", "options": ["A. 无生法忍——证得无生法忍的圣者才有的境界，凡夫不能修", "B. 安受苦忍——修行和生活中遇到寒冷、饥饿、疾病等苦时，能忍受不动摇", "C. 谛察法忍——对甚深佛法（如无我、空性）的道理能信解接受，不动摇", "D. 耐怨害忍——别人伤害自己时，不愤怒不报复，而是如理思维为什么受苦"], "type": "choice", "answer": 0, "explain": "三种忍辱是耐怨害忍、安受苦忍、谛察法忍。前两种是面对伤害和艰苦时的忍，第三种是面对甚深法义时的忍（信解心）。第四个「无生法忍」是圣者的境界，不是广论在菩萨行部分所说的忍波罗蜜多的三种分类。但谛察法忍是凡夫也可以修的——通过闻思建立对空性的信解。"}, {"stem": "广论说精进被甲精进。这个比喻——「如战士披甲」——想表达什么？", "options": ["A. 精进就是要有防护心，保护自己不受伤害", "B. 比喻修行人要像军人一样有纪律，每天按时起床打坐", "C. 精进就是穿上法衣、念诵咒语来保护自己", "D. 披甲代表对修行的坚定决心和勇气——在踏上修行路之前，先在心里下定决心「不管遇到什么困难我都要坚持到底」"], "type": "choice", "answer": 3, "explain": "广论引《入行论》说被甲精进如「先披甲」——在开始修菩萨行之前，内心先发起强烈的誓愿：「即使我一个人要经历无量劫的苦行来度一切众生，我也决不退缩。」这种心力就是「铠甲」，在实际遇到困难和疲厌时能保护自己不退转。"}, {"stem": "广论认为持戒的功德胜过布施的功德，因为持戒能保护一切善法不损减。", "options": ["A. 是的，忍辱就是忍耐不发火，靠意志力压住情绪", "B. 不是——忍辱的真正修法是如理思维：观察对方是被烦恼控制的、观察苦的因缘、思维忍辱的利益和嗔恚的过患，从根本上去除愤怒", "C. 不是——真正的忍辱是远离让你生气的人和环境，不去面对", "D. 是的，佛法的忍辱跟世间的忍耐没有区别"], "type": "choice", "answer": true, "explain": "广论引《入中论》说：「尸罗能摄施等福德，不令失坏。」布施积累的善法，如果没有戒律保护，很容易被恶行破坏。戒律就像容器——没有戒，布施等善法就像放在漏底的容器里。所以经中说持戒的功德胜过布施，不是说布施不重要，而是说戒是守护一切善法的根本。"}, {"stem": "很多人理解忍辱就是「强压怒火不发作」。广论说的耐怨害忍是这样修的吗？", "options": ["A. 是的，忍辱就是忍耐不发火，靠意志力压住情绪", "B. 不是——忍辱的真正修法是如理思维：观察对方是被烦恼控制的、观察苦的因缘、思维忍辱的利益和嗔恚的过患，从根本上去除愤怒", "C. 不是——真正的忍辱是远离让你生气的人和环境，不去面对", "D. 是的，佛法的忍辱跟世间的忍耐没有区别"], "type": "choice", "answer": 1, "explain": "广论说耐怨害忍的修法不是硬忍，而是用智慧去思维：①对方是被烦恼控制的、不由自主的，就像被魔控制的病人；②自己受苦是过去的业所感的；③嗔恚会毁坏善根、障碍修行。通过这样的思维，愤怒自然消融——不是压制，而是从根源上化解。"}, {"stem": "广论说精进的体性是什么？以下哪个最准确？", "options": ["A. 精进就是忙忙碌碌、从早到晚不停做事——越忙越精进", "B. 精进的体性是「缘善法的心所」——对修习善法生起欢喜踊跃的心", "C. 精进就是打坐时间越长越好，最好是双盘几小时不动", "D. 精进是不吃不睡地修行，像苦行一样折磨自己"], "type": "choice", "answer": 1, "explain": "广论引《入行论》说精进是「缘善法踊跃」——对善法生起欢喜和热情。精进不等于忙碌——如果忙的是世俗事务，再忙也不是精进。精进的标准是心有没有在善法上欢喜运作。一小时的禅修如果心力充沛、欢喜安住，比十小时昏沉散乱地熬更有精进之德。"}, {"stem": "将四摄法与其含义配对。", "options": ["A. 同事指的是跟众生一起工作、一起生活——融入他们的生活圈子才能度化他们", "B. 同事指的是在工作中修行——把工作场所当作道场", "C. 同事指的是菩萨与菩萨之间的合作——同修之间的互相帮助", "D. 同事是自己先实践所教导的法——如果自己没做到，教别人就没有说服力，所以放在最后作为最高标准"], "type": "choice", "answer": 3, "explain": "四摄是菩萨度化众生的四种方法。先以布施让众生欢喜无匮，再以爱语随顺他们的根机说法，然后以利行引导他们修善，最后以同事——自己先做到——让他们信服效仿。同事是最高境界：不是「我教你怎么做」，而是「我做给你看」。"}, {"stem": "四摄中「同事」的含义是什么？为什么放在最后？", "options": ["A. 同事指的是跟众生一起工作、一起生活——融入他们的生活圈子才能度化他们", "B. 同事指的是在工作中修行——把工作场所当作道场", "C. 同事指的是菩萨与菩萨之间的合作——同修之间的互相帮助", "D. 同事是自己先实践所教导的法——如果自己没做到，教别人就没有说服力，所以放在最后作为最高标准"], "type": "choice", "answer": 3, "explain": "广论说同事是「随力随能修行何等善法，令他亦修彼善法」。佛陀先说「我自己也修此法」，众生才会信受。如果法师教人忍辱自己却发脾气，教人持戒自己却偷盗，弟子就不会信服。同事放在最后，是因为必须先经历布施（让众生欢喜）、爱语（说法）、利行（引导修行），最后才能以自身的实践来证明。"}, {"stem": "广论说静虑（禅定）的体性是心于一境专注不散乱，但静虑本身不能断除烦恼。", "options": ["A. 般若是缘如所有性和尽所有性的拣择慧——如所有性是诸法空性（胜义谛），尽所有性是因果缘起（世俗谛）", "B. 般若是世间聪明才智——学识渊博、记忆力强、善于辩论", "C. 般若是一种直觉——不需要逻辑思维，直接感悟真理", "D. 般若就是念经持咒产生的神秘智慧"], "type": "choice", "answer": true, "explain": "广论说静虑的体性是「心一境性」——心安住在一个对象上不散乱。但定力只能压伏烦恼（像石头压草），不能根除烦恼（像拔草除根）。要断烦恼必须依靠般若智慧——现证无我空性。所以静虑是工具、是助缘，不是最终目的。外道也能修出极深的禅定，但因为没有无我智慧，烦恼的根还在。"}, {"stem": "广论说般若（智慧）波罗蜜多的体性是什么？它拣择的对象是什么？", "options": ["A. 般若是缘如所有性和尽所有性的拣择慧——如所有性是诸法空性（胜义谛），尽所有性是因果缘起（世俗谛）", "B. 般若是世间聪明才智——学识渊博、记忆力强、善于辩论", "C. 般若是一种直觉——不需要逻辑思维，直接感悟真理", "D. 般若就是念经持咒产生的神秘智慧"], "type": "choice", "answer": 0, "explain": "广论说般若的体性是「拣择」，它所拣择的对象有二：如所有性（诸法的究竟实相——空性、无我）和尽所有性（诸法的现象差别——因果、缘起、五蕴等）。般若不是世间的聪明（那只是分别心的运作），而是以无分别智现证空性，同时以后得智如实了知因果缘起。"}, {"stem": "广论反复强调智慧与方便必须双修。以下哪个比喻最能说明这个道理？", "options": ["A. 智慧如鸟的右翅，方便如左翅——只靠一只翅膀飞不起来，必须双翼齐展", "B. 智慧如灯，方便如油——灯没有油就不亮，油没有灯就不发光", "C. 智慧如种子，方便如水肥——种子需要水肥才能生长", "D. 智慧是目的，方便是手段——目的比手段重要"], "type": "choice", "answer": 0, "explain": "广论引《维摩诘经》说：「无方便慧缚，有方便慧解；无慧方便缚，有慧方便解。」鸟的双翅比喻最贴切：智慧（证空性）和方便（慈悲、布施等菩萨行）缺一不可。只有智慧不修方便，落入小乘涅槃；只有方便不修智慧，在轮回中不能解脱。两者必须同时修。"}, {"stem": "广论说六度为什么只有六种，不多不少？", "options": ["A. 因为佛陀刚好说了六种，没有特别的原因", "B. 因为六是吉祥数字，代表六道众生都能得度", "C. 因为六度对治六种障碍、满足三种成就——布施等对治悭等六种悭吝，前三种（施戒忍）成就是增上生（人天福报），后两种（定慧）成就是决定胜（解脱），精进通二者", "D. 因为修行只能从六个方面入手，不存在第七种修行"], "type": "choice", "answer": 2, "explain": "广论引《菩萨地》说六度数量决定有三个理由：①对治六种障碍（悭、破戒、嗔、懈怠、散乱、愚痴）；②成就三种利益（施戒忍成就增上生——人天安乐的因；定慧成就决定胜——解脱的因；精进通二者）；③随顺利他自利（前三偏利他，后二偏自利，精进通二者）。不多不少，恰好圆满。"}, {"stem": "从最初的发菩提心到最终成佛，整条道路可以概括为：以菩提心为动机，以六度为正行，以四摄为利他方便，以止观双修为定慧等持，最终圆成佛果。", "type": "tf", "answer": true, "explain": "这正是广论三士道修心次第的完整架构。下士道（畏恶趣苦→皈依→业果）和中士道（出离心→四谛→三学）是基础，上士道（菩提心→六度→四摄→止观）是正行。一切回向无上菩提，就是从初发心到成佛的完整道次第。广论之所以被称为「菩提道次第」，正是因为它给出了这条从凡夫到成佛的完整路径。"}]};
quizData.glfull = {"title": "广论全卷贯通", "questions": [{"stem": "广论说贪欲圆满须具五相。以下哪项不属于这五相？", "options": ["A. 耽著心——对自己的财物深深执着，不愿意失去", "B. 饕餮心——看到别人的资产生出爱味，觉得真好看真想要", "C. 覆蔽心——被贪欲蒙蔽，不知羞耻、不知过患、不知出离", "D. 慈悲心——看到众生受苦生起同情，想要帮助他们脱离苦难"], "type": "choice", "answer": 3, "explain": "贪欲五相是：耽著心、贪婪心、饕餮心、谋略心（想「他的何时归我」）、覆蔽心。五缺一即不圆满。慈悲心是善法，跟贪欲完全无关。广论详细列出五相是为了让修行人逐一检查自己是否具足——如果不具足，说明贪心还未到圆满程度，但仍有轻微贪心需要对治。"}, {"stem": "广论说邪见是十不善业中最重的。为什么邪见比杀生等更严重？", "options": ["A. 因为邪见能断一切善根——一旦生起「没有因果、没有前后世」的定解，就会随心所欲造一切恶，随顺一切恶行随意所行", "B. 因为邪见涉及信仰问题，信仰错误比行为错误的后果更严重", "C. 因为邪见的人通常会教唆别人也接受错误观念，影响范围比杀一个人大得多", "D. 因为邪见是由痴究竟，而痴是三毒中最难断的"], "type": "choice", "answer": 0, "explain": "广论说邪见能断一切善根，是十不善中最重者。原因是：善根的生起依赖于信因果、信前后世的基础。一旦这个基础被邪见摧毁（谤因、谤果、谤作用——认为没有因果、没有前后世），所有善法都失去了根基，修行人就会「随顺诸恶随意所行」。其他恶业只造一业，邪见则打开了一切恶业的大门。"}, {"stem": "广论说「业经百劫亦不亡失」，意味着已经造下的恶业绝对无法净化，只能等果报成熟承受。", "options": ["A. 对父母师长造善恶业的力量与对普通人一样——业力只看动机不看对境", "B. 福田门——在佛法僧三宝和父母师长处，即使微小的善恶也会放大成极大的果报", "C. 只有大的行为才有果报，心里想想不管对谁都没有业力", "D. 对境的差别只影响福报的大小，跟恶业的轻重无关"], "type": "choice", "answer": false, "explain": "广论明确说「作已不失」，但同时也开示了四力忏悔——破坏现行力（追悔）、对治现行力（念诵供养造像持名等）、遮止罪恶力（防护不再犯）、依止力（皈依菩提心）。即使顺定受业也能通过四力忏悔来净化。「不亡失」的密意是：如果不修对治力，业不会自己消失。忏悔清净与从未犯过在相续上有差别——一个是有过已除，一个是本无其过。"}, {"stem": "广论引《分别一切业报经》讲「具力业门」——同样的善恶行为，因为对境不同，果报轻重差别极大。以下哪个说法正确？", "options": ["A. 对父母师长造善恶业的力量与对普通人一样——业力只看动机不看对境", "B. 福田门——在佛法僧三宝和父母师长处，即使微小的善恶也会放大成极大的果报", "C. 只有大的行为才有果报，心里想想不管对谁都没有业力", "D. 对境的差别只影响福报的大小，跟恶业的轻重无关"], "type": "choice", "answer": 1, "explain": "广论说具力业门有四：福田门（三宝师长父母处略作损益得大福大罪）、所依门（有戒者修行超胜无戒者千倍）、事物门（法施超财施）、意乐门（菩提心摄持施一花超无量供养）。比喻：铁丸虽小亦沉水（有戒者虽犯小罪亦重），铁器虽大能上浮（无戒者虽犯大罪亦可轻）。"}, {"stem": "佛陀讲四谛（苦集灭道）时，先说苦谛再说集谛，这违反了「因在前果在后」的正常次第。广论如何解释这个「违次第」？", "options": ["A. 这是文献传抄的错误，原本应该是先说集谛再说苦谛", "B. 这是佛陀说法的方便——如医生先让病人知道有病（苦），再找病因（集），知可治愈（灭），然后服药（道）", "C. 因为苦谛比集谛更重要，所以放在前面先讲", "D. 因为苦谛容易理解，集谛太深了，初学者听不懂"], "type": "choice", "answer": 1, "explain": "广论引《瑜伽师地论》用看病的比喻解释：先令知病（苦谛）→寻病因（集谛）→知可愈（灭谛）→服药治疗（道谛）。如果先说集谛（病因），病人不知道自己有病，就不关心病因是什么。所以佛陀违因果次第先说苦，是为了引导众生——不知苦则不求解脱，知苦才能生起厌离心。"}, {"stem": "广论用「热痈」（热疮）的比喻来解释三苦（苦苦、坏苦、行苦）。如果热痈上洒了凉水暂时感到舒服，这对应的是哪种苦？", "options": ["A. 苦苦——因为凉水刺激热疮，产生新的痛苦", "B. 这不算苦，是真实的快乐——只是程度上比较轻微", "C. 行苦——因为感受本身是无常的", "D. 坏苦——因为这种舒服只是前苦暂时止息产生的错觉，当凉水变温舒服消失时就变成苦"], "type": "choice", "answer": 3, "explain": "热痈比喻：①痈本身炽热疼痛=行苦（粗重随逐，一切时皆有）；②洒冷水暂时止息热痛产生舒服感=坏苦（世俗所谓的「快乐」其实只是苦暂歇）；③触及热水等加剧疼痛=苦苦（明显的苦受）。广论以此破斥「人天安乐是真快乐」的执着——世间乐只是前苦暂息的错觉，不是自性之乐。"}, {"stem": "广论说「业如种子，烦恼如水土」。关于业和烦恼在生死轮回中的关系，以下哪个说法正确？", "options": ["A. 只要不造新业就不会轮回——旧业会自然过期", "B. 业种子虽然存在，但如果没有烦恼（水土）滋润就不会发芽结果；反之只要有烦恼，纵然没有宿业也会立刻新造——所以断生死的根本在断烦恼而非断业", "C. 业和烦恼同等重要，必须同时断才能解脱", "D. 只要多做善业就能自然消除烦恼"], "type": "choice", "answer": 1, "explain": "广论引《俱舍论》说业如种子，烦恼如水土。种子再好没有水不发芽；有水没有种子也可以找新种子。所以阿罗汉虽然还有过去世的业种子，但烦恼已断（水断了），业种子就无法感果。反之凡夫如果不断烦恼，纵然旧业消了也会不断造新业。所以断除生死的根本在断烦恼（特别是我执无明），而非逐一消业。"}, {"stem": "广论说十二缘起可归纳为四组。其中「能生支」包含哪几支？为什么它如此关键？", "options": ["A. 能生支是「无明、行、识」——因为无明是轮回的起点", "B. 能生支是「生、老死」——因为它们直接产生了苦果", "C. 能生支是「爱、取、有」——它把过去种下的业种子催熟为必定感果的状态，是连接过去因和未来果的关键环节", "D. 能生支是「名色、六入、触、受」——它们是被催生的果报"], "type": "choice", "answer": 2, "explain": "十二支四组：能引（无明→行→因位识）、所引（名色→六入→触→受）、能生（爱→取→有）、所生（生→老死）。关键在能生支：过去的业种子虽然种下了（能引），但如果在「爱、取」阶段不被滋润，就不会变成「有」（必定感果的成熟业）。所以修行人断除贪爱（爱支）就能阻止业种子成熟——这是中士道实修的关键。"}, {"stem": "广论说戒定慧三学中，戒如大地为一切功德根基，因此不持戒也能得定发慧，只是效果差一些。", "options": ["A. 修行人应该先对付普通敌人，再对付烦恼——因为烦恼比较容易断", "B. 烦恼是从内心生的，一旦根除就没有藏身之处；而外部敌人可以躲在其他地方再回来——所以战胜烦恼才是真正的勇士，战胜外部敌人如斩死尸", "C. 烦烦恼和外部敌人一样危险，都需要持续战斗", "D. 既然烦恼断根后不会再来，可以慢慢来，不急"], "type": "choice", "answer": false, "explain": "广论引《入中论》说「戒是一切德依处，如动不动依于地」。戒不是「效果好坏」的问题，而是「有没有地基」的问题——没有大地就没有草木建筑。身语不清净的人内心总有不安和悔恨（恶作），心无法安住，定就无从谈起。所以戒是定的前提条件，不是「有了更好」的可选项。"}, {"stem": "广论说烦恼一旦被智慧拔根，就不可能再报复。但普通敌人被赶走后还能卷土重来。由此可以得出什么结论？", "options": ["A. 修行人应该先对付普通敌人，再对付烦恼——因为烦恼比较容易断", "B. 烦恼是从内心生的，一旦根除就没有藏身之处；而外部敌人可以躲在其他地方再回来——所以战胜烦恼才是真正的勇士，战胜外部敌人如斩死尸", "C. 烦烦恼和外部敌人一样危险，都需要持续战斗", "D. 既然烦恼断根后不会再来，可以慢慢来，不急"], "type": "choice", "answer": 1, "explain": "广论引《入行论》说：「庸常怨敌一驱出，还住他方如旧住。烦恼何能如是？拔根已去何处住？」烦恼是从我执无明生的，一旦智慧现证无我，烦恼的根就被拔了，没有地方可以藏身再回来。所以修行人最大的勇气应该用在战胜烦恼上，而不是对付外部敌人——后者「如斩死尸」，因为不斩也终将死去。"}, {"stem": "广论引寂天菩萨说「尽世所有乐，悉从利他生；尽世所有苦，皆从自利起」。以下哪个说法最准确地体现了这句话的精神？", "options": ["A. 利他就是利己——帮助别人最终自己也会快乐，所以利他的本质还是自利", "B. 爱执自己是所有痛苦的根源，爱执他人是所有快乐的根源——不是「利他为了自己快乐」，而是将爱执的焦点从自己转换到他人", "C. 这句话是鼓励世人多做善事，跟修行解脱没有直接关系", "D. 只要完全不考虑自己就能消除一切痛苦"], "type": "choice", "answer": 1, "explain": "广论自他相换的核心不是「利他来利己」（这本质上还是我爱执），而是彻底转换爱执的对象——把「把我放在第一位」换成「把他人放在第一位」。凡夫无量劫来自利结果仍在轮回受苦，佛陀无量劫利他结果圆满成佛——这就是最好的对照。增上意乐（商主跳粪坑救子）正是从「愿众生离苦」升级为「我来做」的关键。"}, {"stem": "广论讲发菩提心的四缘中，有一缘是「不忍圣教将灭」。为什么这种动机特别有力？", "options": ["A. 因为佛法是世间最珍贵的宗教，有义务保护它的传承", "B. 因为佛法的存灭直接关系到无数众生的利乐——圣教若灭，众生就失去了离苦得乐的指引。为了护持能利益一切众生的佛法而发菩提心，心量极大", "C. 因为护持佛法有很大的福报，死后能生天", "D. 因为这是僧团的职责，在家居士不需要关心"], "type": "choice", "answer": 1, "explain": "广论说四缘中第三缘（不忍圣教寝灭）是「主要因缘」。因为佛陀已入灭，能度众生的就是圣教（教法）。如果圣教灭了，众生就像在黑暗中找不到出路一样。为了让圣教住世利益众生，自己必须成佛——只有佛才能最圆满地弘扬圣教。这种发心不是为了某个宗教的利益，而是为了一切众生能不能接触到离苦的方法。"}, {"stem": "将七因果教授的修心次第与核心内容配对。", "options": ["A. 空慧是父亲，菩提心是母亲——因为智慧最重要", "B. 菩提心和空慧是同一种功德的两面，没有区别", "C. 菩提心是父亲（不共因），空慧是母亲（共因）——菩提心决定大小乘的「种姓」，空慧是三乘共通的", "D. 父子喻说的是传承关系——上师如父，弟子如子"], "type": "choice", "answer": true, "explain": "七因果的关键在「增上意乐」——声闻独觉也有慈心和悲心（愿众生离苦得乐），但他们没有「我来做」的承担力。菩萨之所以是菩萨，就在于从「愿」升级为「行」——亲自跳入轮回的粪坑救出如母众生。由此自然生起「只有成佛才有能力做到」的菩提心。"}, {"stem": "广论说菩提心是大乘的不共因，证空慧是三乘的共因。这意味着通达空性的人不一定是大乘行者。", "options": ["A. 空慧是父亲，菩提心是母亲——因为智慧最重要", "B. 菩提心和空慧是同一种功德的两面，没有区别", "C. 菩提心是父亲（不共因），空慧是母亲（共因）——菩提心决定大小乘的「种姓」，空慧是三乘共通的", "D. 父子喻说的是传承关系——上师如父，弟子如子"], "type": "choice", "answer": true, "explain": "广论用父子喻：菩提心如父（种子），空慧如母。藏人之子必是藏种——父定子姓；但母可生各种子。证空慧是声闻、独觉、菩萨三乘共同的因，不能区分大小乘。只有菩提心才是大乘不共的判别标准——所以「我通达空性就是大乘」是错误观念，离菩提心纵通空性亦堕声闻。"}, {"stem": "广论用「父子喻」来说明菩提心与空慧的关系。以下哪个说法正确？", "options": ["A. 空慧是父亲，菩提心是母亲——因为智慧最重要", "B. 菩提心和空慧是同一种功德的两面，没有区别", "C. 菩提心是父亲（不共因），空慧是母亲（共因）——菩提心决定大小乘的「种姓」，空慧是三乘共通的", "D. 父子喻说的是传承关系——上师如父，弟子如子"], "type": "choice", "answer": 2, "explain": "广论引《明显句论》说：菩提心如种子（不共因），空慧如水肥等（共因）。藏人的孩子一定是藏种——父定子姓（不共因）；但母亲可以生各种孩子（共因）。同样，证空慧是三乘共通的——声闻也证人无我，独觉也证，菩萨也证。但只有菩提心能判别「这是大乘」。所以判别大小乘不在空慧，在菩提心。"}, {"stem": "广论说大悲心在修行的初、中、后三个阶段都最为重要。以下哪个比喻正确描述了大悲的「中重要」？", "options": ["A. 大悲如种子——在修行开始时如同种子生起一切善法", "B. 大悲如果实——成佛之后大悲成熟，度化一切众生", "C. 大悲如雨水——修行中间阶段，虽然发了心但有情暴恶难以调伏，大悲心让菩萨不退怯，如庄稼赖雨水生长", "D. 大悲如阳光——贯穿整个修行过程普照一切"], "type": "choice", "answer": 2, "explain": "月称论师说大悲「初重要如种子，中重要如水分增长，后重要如果实成熟」。初：大悲是发菩提心的前导（如呼吸是命根前导）。中：菩萨在漫长修行中面对有情的暴恶、自己的退缘，没有大悲心坚持就会像声闻一样退入涅槃。后：成佛后「不住涅槃」继续度生全靠大悲。三阶段缺一不可。"}, {"stem": "广论引寂天菩萨，用「商主跳粪坑救孩子」的比喻说明什么？", "options": ["A. 说明修行人要不怕脏不怕苦，能忍一切艰苦环境", "B. 说明慈悲心和增上意乐的区别——母亲见子堕粪坑会哭泣悲号但不敢跳（有慈悲无承担），商主父亲毫不犹豫亲自跳进去救出（有慈悲更有「我来做」的增上意乐）", "C. 说明商人比修行人更有勇气", "D. 说明物理上的脏东西也是修行的一部分"], "type": "choice", "answer": 1, "explain": "这是广论说明「增上意乐」最核心的比喻。三界如不净坑，众生如堕其中的孩子。声闻独觉如慈母——有慈悲但缺乏行动力，只是「愿众生离苦」。菩萨如商主父——不只发愿，而是「我自己来度」。这个从「愿」到「行」的跨越，就是从慈心悲心到增上意乐的升华，也是菩萨区别于二乘的关键。"}, {"stem": "广论说智慧与方便必须双修。以下哪个比喻最能说明这个道理？", "options": ["A. 智慧如灯，方便如油——灯无油不亮，油无灯不照", "B. 智慧是目的，方便是手段——目的比手段重要", "C. 智慧如种子，方便如水——种子需要水才能生长", "D. 智慧如鸟的右翅，方便如左翅——缺一只翅膀飞不起来"], "type": "choice", "answer": 3, "explain": "广论引《维摩诘经》说「无方便慧缚，有方便慧解」。鸟的双翅比喻最贴切：智慧（证空性）和方便（慈悲、布施等菩萨行）缺一不可。只有慧没有方便，落入小乘涅槃；只有方便没有慧，在轮回中不能解脱。卷十还用「多画师合画王像」的比喻——每个画师各画一部分，缺了谁都不完整。"}, {"stem": "广论说布施波罗蜜多圆满的标准是「等到所有众生都不再贫穷时才算圆满」。", "options": ["A. 如警察巡逻——到处巡逻抓犯人，防止恶行发生", "B. 如城墙保护城市——把城墙修得越高越厚就越安全", "C. 如用皮铺满大地——你想用皮革铺满整个大地免得脚被刺扎伤，不可能；但穿一双鞋就等于遍地都铺了皮——同样，无法让所有众生都不伤害自己，但持好戒（能断心）就等于防护了一切", "D. 如法官判决——对恶行进行惩罚和制裁"], "type": "choice", "answer": false, "explain": "广论明确说：布施圆满在心不在外。如果标准是消除一切众生的贫困，那佛陀的布施也未圆满（世间仍有穷人）。布施波罗蜜多圆满的标准是「自心破除悭执」——施舍的心修到究竟，连身体财富都能施时，就叫布施度圆满。但这不是说一开始就要施身——悲心未清净前不应施身（非时施为魔业）。"}, {"stem": "广论说持戒的体性是「能断之心」。以下哪个比喻最能说明这个道理？", "options": ["A. 如警察巡逻——到处巡逻抓犯人，防止恶行发生", "B. 如城墙保护城市——把城墙修得越高越厚就越安全", "C. 如用皮铺满大地——你想用皮革铺满整个大地免得脚被刺扎伤，不可能；但穿一双鞋就等于遍地都铺了皮——同样，无法让所有众生都不伤害自己，但持好戒（能断心）就等于防护了一切", "D. 如法官判决——对恶行进行惩罚和制裁"], "type": "choice", "answer": 2, "explain": "广论引《入行论》的鞋底覆地喻：无处驱鱼令不杀，由得能断心说为尸罗度。持戒波罗蜜多圆满的标准不在「让一切众生都不受伤害」（这在成佛前不可能），而在「自心断除损害众生的决意」。这种决意圆满了，戒度就圆满了——跟外部环境无关。"}, {"stem": "广论说忍辱的核心修法不是「硬压怒火」，而是「如理思维」。当别人伤害自己时，以下哪个思维方式是广论推荐的？", "options": ["A. 观察对方是被烦恼控制的——就像被魔控制的病人身不由己，不是他真心要伤害我，是烦恼在驱使他", "B. 想想他为什么对我这么坏，是不是我做错了什么", "C. 告诉自己忍辱是美德，发脾气有损形象", "D. 想想这个人前世可能也伤害过我，这是我的果报"], "type": "choice", "answer": 0, "explain": "广论的耐怨害忍修法：①观察对方是被烦恼控制的病人——如果有人拿棍子打你，你不会恨棍子，同样打你的人也被烦恼（嗔恨）所控制，恨的是烦恼而非人。②观察自己受苦是过去的业所感。③思维嗔恚过患——一念嗔心摧毁千劫善根。通过这样的智慧思维，愤怒从根源上消融，不是靠意志力压制。"}, {"stem": "广论说苦有五种功德。以下哪项不属于这五种功德？", "options": ["A. 苦能驱使我们生起出离心——如果不知道苦就不会想解脱", "B. 苦能消除骄慢——经历苦难让人谦卑，不会目中无人", "C. 苦能引发对众生的悲愍心——自己受过苦才知道众生的苦", "D. 苦能让我们获得更多人的同情和关注"], "type": "choice", "answer": 3, "explain": "苦的五功德：①驱出离、②除骄慢、③羞作恶（苦是不善业的果，提醒自己不造恶）、④欢修善、⑤引悲愍。获得同情和关注不是苦的功德——那是世俗的、自我中心的反应。广论说苦的真正价值在于：它是修行的动力和悲心的基础。截手指免杀罪则大欢喜——人间小苦能免地狱大苦，应该高兴才对。"}, {"stem": "广论说精进有三种违缘（障碍）。如果你觉得「我现在还年轻，修行的事等退休再说」，这属于哪种违缘？", "options": ["A. 推延懈怠——虽然想修但一直推迟，总觉得自己还有时间", "B. 贪著下劣事业——忙着做世间琐事，觉得这些比修行更重要", "C. 自轻退屈——觉得自己没有能力修行，不是这块料", "D. 这不是违缘，是合理的人生规划"], "type": "choice", "answer": 0, "explain": "三种违缘：①推延懈怠（觉得「还有时间」——死无定期！）；②耽著下劣事业（把世间事看得比修行重要）；③自轻退屈（「我做不到」）。对治推延的方法是念死无常——如果今天会死，你还会说「等退休」吗？对治自轻的方法是：连蚊虻这样的小虫都能成佛，我为什么不能？"}, {"stem": "广论说修精进需要四种力。其中「欢喜力」的作用是什么？", "options": ["A. 欢喜力就是保持好心情——开心地做事就不觉得累", "B. 欢喜力是对未来成佛后的果报感到欢喜", "C. 欢喜力是看到别人修行好而生欢喜心", "D. 欢喜力是对善法生起无厌足的欢喜——就像小孩子玩游戏永远不觉得累一样，修行也要越修越欢喜"], "type": "choice", "answer": 3, "explain": "四力：胜解力（对善法生起坚固信解，让精进生起）、坚固力（发愿不退，让精进不退）、欢喜力（对善法事业欢喜踊跃无厌足，让精进持续）、息舍力（累了就适当休息调节，让精进可持续）。欢喜力的比喻：如童仆逐盗缓追耐久——太猛则乏。又如《入行论》说「为令集善业，欢喜如童戏」。"}, {"stem": "广论说静虑（禅定）的体性是心于一境专注不散乱，但静虑本身不能断除烦恼。", "options": ["A. 智慧如灯——照亮黑暗中的一切", "B. 智慧如画龙点睛——前五度是龙身，智慧是点上去的眼睛，有了眼睛龙就活了", "C. 智慧如国王——前五度是大臣，一切听从智慧指挥", "D. 智慧如铠甲——保护修行人不受烦恼侵害"], "type": "choice", "answer": true, "explain": "定力只能压伏烦恼（如石头压草），不能根除（如拔草除根）。要断烦恼必须依靠般若智慧——现证无我空性。外道也能修出极深的禅定（如无色界四空定），但因为缺乏无我智慧，烦恼的种子还在。广论卷十七明确说「惟三摩地不能断惑」。所以静虑是工具——是发慧的助缘，不是最终目的。"}, {"stem": "广论说般若为五度之眼。以下哪个比喻最能说明智慧在六度中的地位？", "options": ["A. 智慧如灯——照亮黑暗中的一切", "B. 智慧如画龙点睛——前五度是龙身，智慧是点上去的眼睛，有了眼睛龙就活了", "C. 智慧如国王——前五度是大臣，一切听从智慧指挥", "D. 智慧如铠甲——保护修行人不受烦恼侵害"], "type": "choice", "answer": 1, "explain": "广论引《摄颂》说五度如盲，慧为导引。比喻如画师画毕王像后不点眼——不点眼就不值钱，点眼后方为珍宝。前五度（布施到静虑）如果没有般若引导，就像没有眼睛的人——能走但看不清方向，最终到不了目的地。般若让前五度成为「波罗蜜多」（到彼岸）——因为只有智慧才认识到三轮体空。"}, {"stem": "广论说修奢摩他（止）时必须依一所缘，不可频繁更换。为什么？", "options": ["A. 因为每个所缘对应不同的本尊，换了就得罪本尊", "B. 因为祖师传承规定了只能用一个所缘，不能自行选择", "C. 心如未调之象，必须用正念的绳索系在一个坚固的柱子（所缘）上才能调伏——如果不断换柱子，大象永远调不了", "D. 因为换所缘会消耗很多心理能量，导致疲惫"], "type": "choice", "answer": 2, "explain": "广论引圣勇论师：「应于一所缘，坚固其意志，若转多所缘，意为烦恼扰。」心如狂象——正念如绳，所缘如柱。把象系在一根柱子上，它会渐渐安静；如果不断换柱子，它每次都被搅动。不过所缘的选择因人而异：贪行者缘不净、嗔行者缘慈、寻思行者缘呼吸、等分行者随意。选定了就不要换。"}, {"stem": "广论详述九住心次第。从第一住心「内住」到最后「等持」，以下哪个描述正确反映了修行进展？", "options": ["A. 从需要极大努力勉强安住，到中间时有散乱但能拉回，最后完全不用努力心自然安住", "B. 从一开始就很轻松，越修越深入，中间没有困难", "C. 九住心是顿悟的过程，每一步都是质的飞跃", "D. 到了第三住心就已经完全不会散乱了"], "type": "choice", "answer": 0, "explain": "九住心对应四作意：①力励运转（内住、续住——需要极大努力）；②有间缺运转（安住到最极寂静——能安住但还有沉掉间断）；③无间缺运转（专注一趣——沉掉已断但仍需努力）；④无功用运转（等持——不用努力心自然安住）。这是渐次的、需要长时间串习的过程，不可能一蹴而就。即使到了第九心（等持），如果没有生起身心轻安，仍然不叫奢摩他。"}, {"stem": "广论卷十七的核心论点：只修止不修观如外道不能断惑。以下哪段经文最能证明这一点？", "options": ["A. 《金刚经》说「凡所有相皆是虚妄」", "B. 《心经》说「色即是空空即是色」", "C. 《三摩地王经》说「虽善修正定，不能破我想，后为烦恼乱，如外道修定」——即使定了，没破我执还会被烦恼扰乱", "D. 《法华经》说「唯有一乘法」"], "type": "choice", "answer": 2, "explain": "广论引《三摩地王经》反复强调：仅有定力不能断烦恼种子。因为烦恼的根是我执无明，只有现证无我的智慧才能断它。定力让心不散乱，但不直接对治无明——就像在黑暗中安静坐着，虽然不动但看不见真相。外道也能修到无色界最深的非想非非想处定，但定力退了照样轮回。"}, {"stem": "广论说修毗钵舍那之前，必须先得无我正见。有人认为「修空就是什么都不想」。广论如何破斥？", "options": ["A. 广论同意这个说法——只是要求在「什么都不想」之前先理论理解一下", "B. 广论说「什么都不想」是更高层次的修行，初学者做不到", "C. 广论说「什么都不想」跟动物冬眠没有区别——必须先以智慧决择无我义，然后用观察慧反复思择，才能引生无分别智。因果不必相顺——如两木摩擦生火反焚两木", "D. 广论说「什么都不想」是禅宗的方法，藏传佛教不这么修"], "type": "choice", "answer": 2, "explain": "广论卷二十四明确说：以分别慧观察无我（虽然是有分别的），能引生无分别圣智。因果不必相顺——两树为风振触便有火生，火生已还焚两树。如果「什么都不想」就是修空，那昏迷的人和无想天的众生都在修空了。必须先以正理决择「我」不可得，确立定解，然后缘此定解修止观。"}, {"stem": "广论卷二十讨论「所破」时说，必须破得恰到好处——不能太过也不能不及。以下哪种情况属于「破太过」？", "options": ["A. 破了一切法的存在——连因果缘起都否定了，认为「空就是什么都没有」", "B. 只破俱生我执所执的「我」，不破世俗缘起的「我」", "C. 只破了宗派假立的「我」，没有破俱生我执", "D. 认为名言中色声等法是有自性的"], "type": "choice", "answer": 0, "explain": "广论说所破有两种错误：①破太过——把一切法都否定掉了，落入断见，否认因果业报；②破不及——只破理论上的「我」，没破俱生我执所执的自性。正确的是：破诸法的「自性有」（不依名言识安立而境上自体有），但不破名言缘起有。如绳蛇喻——蛇在绳上根本没有（破自性），但绳本身是有的（不破名言）。"}, {"stem": "广论用车喻（七相观察）来抉择人无我。关于车与车的支分（零件）的关系，以下哪个说法是广论的结论？", "options": ["A. 车就是零件的总和——把所有零件加在一起就是车", "B. 车根本不存在，只是我们的幻觉", "C. 车是一种超越零件的实体——零件组装后产生了新的存在", "D. 车与零件在七种关系中都不成立自性：不是一（车≠零件）、不是异（车离零件无处可寻）、不是能依所依、不是互相拥有、不是零件的积聚、不是形状——车惟是名言假立"], "type": "choice", "answer": 3, "explain": "广论卷二十二用车喻七相抉择：「一、异、能依、所依、具支、支聚、形状」——在七种关系中，车跟零件的关系都经不起自性的推察。但这不是说「没有车」——车在名言中是有的（能坐、能开、能装东西），只是没有自性。车是依零件等因缘、由名言识安立的假有。同样，「我」也是依五蕴由名言安立的假有。"}, {"stem": "广论说诸法「非自生、非他生、非共生、非无因生」。其中「破他生」时说「若因果自性异，则从火焰亦应生黑暗」。这个论证的逻辑是什么？", "options": ["A. 如果因和果是自性不同的两个实体（他），那么「他」就变成了一个完全没有限定性的概念——一切法互为「他」，火焰跟黑暗也是「他」，那火焰也该生出黑暗", "B. 火焰和黑暗都是物理现象，可以互相转化", "C. 这个论证有逻辑漏洞——实际上因果确实是「他」的关系", "D. 这是一种比喻，不是说火焰真的不能生黑暗"], "type": "choice", "answer": 0, "explain": "广论引《入中论》说：如果因和果有自性异体（他性），那一切法互相之间都是「他」（不同的实体），火焰和黑暗是「他」，种子和芽也是「他」——没有任何理由说种子能生芽而火焰不能生黑暗。破的是「因果间有自性异体」这个前提，不是破世俗的「因生果」。缘起的因果如幻是有作用的，但不成立自性的他生。"}, {"stem": "广论说缘起和性空是一义的——「此等皆是缘起故，故是空义」。", "options": ["A. 能看到佛菩萨的显现", "B. 能在定中坐很久不动", "C. 完全没有杂念了，心如明镜", "D. 在已得奢摩他（止）的基础上，以观察慧思择无我义，由观察力自力引生身心轻安——此时才叫真实毗钵舍那"], "type": "choice", "answer": true, "explain": "广论反复强调：龙猛不共之宗是「由缘起因说自性空」——正因为诸法依因缘而起（缘起），所以没有独立的自性（空性）。缘起和空不是两件事，是一件事的两面。说「缘起」就在说「空」，说「空」就在说「缘起」。如果只说「空」不承认缘起就是断见，如果只说缘起不承认空就是常见。中道正见就是「缘起故性空，性空故缘起」。"}, {"stem": "广论卷二十四总结止观双运时说：毗钵舍那成就的标准是什么？", "options": ["A. 能看到佛菩萨的显现", "B. 能在定中坐很久不动", "C. 完全没有杂念了，心如明镜", "D. 在已得奢摩他（止）的基础上，以观察慧思择无我义，由观察力自力引生身心轻安——此时才叫真实毗钵舍那"], "type": "choice", "answer": 3, "explain": "广论说：修观乃至未生身心轻安，只是「随顺毗钵舍那」；由观慧思择的力量引生了新的身心轻安时，才叫「真实毗钵舍那」。注意：这里的轻安不是之前修止时得到的轻安，而是由观察慧自力新引生的轻安——标志观的成就。止和观各自有各自的轻安标准，不能混为一谈。"}, {"stem": "从广论全24卷整体来看，「以经印经」——前后贯通。以下哪组主题最能体现广论「次第决定」的核心原则？", "options": ["A. 卷一的「亲近善知识」→ 卷二十四的「止观双运」——善知识是修行的起点，止观双运是终点，中间的一切都离不开善知识的引导", "B. 卷一的「断器三过」→ 卷十七的「观察慧是修观的必须」——听法时要专心（覆器），修观时要主动用智慧分析，两者的共通点是「不能什么都不想」", "C. 卷四的「十二缘起」→ 卷二十二至二十三的「人法二无我」——十二缘起说明轮回如何从无明产生，人无我和法无我是破除无明的具体方法，前后是病因和治疗的关系", "D. 以上三组都体现了前后贯通的次第原则"], "type": "choice", "answer": 3, "explain": "广论最殊胜之处就是次第井然、前后印证。亲近善知识是入道之门（卷一），到止观双运成佛（卷二十四），中间每一步都有因果逻辑。听法时的「专心听闻」和修观时的「以慧观察」都反对「什么都不想」的懒汉修法。十二缘起指出轮回的病根是俱生无明，人无我和法无我正是拔除无明之根的智慧手术刀。三者合一即「以经印经」。"}, {"stem": "有人问：「广论说一切法无自性，那因果也不成立了？行善和造恶还有什么区别？」广论的回答是什么？", "options": ["A. 在胜义谛中因果确实不成立，但在世俗谛中还是要遵守——两套不同的真理", "B. 无自性恰恰是因果成立的前提——如果法有自性（不依赖因缘而自体存在），那它就不会因为因缘而改变，因果反而不能成立。正因为无自性，诸法才能随因缘而生灭", "C. 这是广论中自相矛盾的地方，宗喀巴大师也没有完全解决这个问题", "D. 在修行的高级阶段确实善恶没有区别，但初学者还是要分善恶"], "type": "choice", "answer": 1, "explain": "广论引《中论》说「以有空义故，一切法得成」。如果法有自性（固定不变的本质），那种子永远不会发芽（因为种子的自性就是种子）。正因为种子没有自性（空性），它才能在因缘聚合时变成芽。所以空性是缘起的前提，不是缘起的否定。破的是「自性之因果」，不是「缘起之因果」。分不清这两者就会堕入断见。"}, {"stem": "广论全论的修行次第可以概括为一个从凡夫到成佛的完整路径。以下哪个排列是正确的？", "options": ["A. 闻法→修止→修观→发菩提心→持戒→成佛", "B. 修空性→发菩提心→修六度→成佛——直接从空性入手最快", "C. 亲近善知识→暇满人身→念死无常→皈依业果（下士道）→出离心四谛（中士道）→菩提心六度四摄（上士道）→止观双运→密乘", "D. 受戒→修定→开悟→度众生——按戒定慧顺序就行"], "type": "choice", "answer": 2, "explain": "广论的殊胜在于「三士道次第」：以下士道（畏恶趣苦、皈依、业果）为基础，以中士道（出离心、四谛）为桥梁，以上士道（菩提心、六度四摄、止观）为正行。每一步都是前一步的延续，不能跳过。卷二十四总结说「下下为上上基础」——没有出离心的人发不起真实菩提心，没有菩提心的人修止观也只是世间禅定。整个道次第是「道之根本在亲近善知识」。"}, {"stem": "广论说「以分别慧观察无我义，能生无分别圣智」。这意味着因果可以不相顺——用有分别的观察，生起无分别的证悟。", "options": ["A. 「共」是指下士道和中士道不仅是下士和中士的修行目标，更是上士（菩萨）必须共同经过的基础阶段——发菩提心之前必须先有下中士的出离心", "B. 「共」是指大家一起来修——团体修行的意思", "C. 「共」是指佛教各宗派共同承认的教义——南传藏传汉传都认可的", "D. 「共」是指公共课程——初级的共同课程"], "type": "choice", "answer": true, "explain": "广论卷二十四引《迦叶请问经》：「两树为风振触便有火生，火生已还焚两树。」两棵树（有分别的观察）摩擦生火（无分别智），火生起后反而焚毁了两棵树（分别亦息）。因果不必相顺——不是为了「无分别」就要「不分别」，恰恰相反，是通过猛利的分别观察，最终引生了不依赖分别的现证。这是广论最精微的辩证之一。"}, {"stem": "广论强调「共下士道」「共中士道」——「共」的含义是什么？", "options": ["A. 「共」是指下士道和中士道不仅是下士和中士的修行目标，更是上士（菩萨）必须共同经过的基础阶段——发菩提心之前必须先有下中士的出离心", "B. 「共」是指大家一起来修——团体修行的意思", "C. 「共」是指佛教各宗派共同承认的教义——南传藏传汉传都认可的", "D. 「共」是指公共课程——初级的共同课程"], "type": "choice", "answer": 0, "explain": "广论最大的特色之一就是「共道」的概念。下士道（皈依业果）和中士道（出离心）不只是下士和中士修的，上士也必须修——因为菩提心的基础是出离心（如果自己都不想脱离轮回，怎么可能真心想度众生脱离轮回？）。所以叫「共下士道」「共中士道」——是菩萨与下中士共通的修行基础。"}, {"stem": "如果你是广论的初学者，以下哪种学习方法是广论本身推荐的？", "options": ["A. 从卷一「听闻轨理」开始，依次学习善知识的德相、暇满难得、念死无常，逐步建立道次第的完整理解——不跳过任何一步", "B. 直接跳到卷十七以后学中观正见——因为空性是最高的法", "C. 先背颂科判，理解全论的结构，再选自己感兴趣的部分深入", "D. 先修禅定体验一下，再回来学理论"], "type": "choice", "answer": 0, "explain": "广论全论就是在论证「次第决定」——前前为后后的基础。卷一「听闻轨理」（断器三过、依六种想）是一切学习的开始；然后是亲近善知识（没有善知识的引导无法正确理解法义）；然后是暇满难得（认识修行的机会有多珍贵）；然后是念死无常（生起紧迫感）。跳过前面的基础直接学高深的法，就像没有地基就建楼阁——注定会塌。"}, {"stem": "广论全24卷，从最初的「亲近善知识」到最后的「止观双运」，贯穿始终的主线是：以出离心为动力，以菩提心为目标，以空性正见为手段，以方便六度为正行，最终圆成佛果。", "type": "tf", "answer": true, "explain": "这就是广论「三士道修心次第」的完整概括。出离心（来自思惟苦无常）是修行的动力引擎；菩提心（来自慈悲和增上意乐）是大乘的方向；空性正见（来自闻思和观察修）是断除烦恼的利剑；六度四摄（布施到般若+四摄）是菩萨的具体行持；止观双运（奢摩他+毗钵舍那）是定慧等持的修证方法。五者缺一不可，构成了从凡夫到成佛的完整蓝图。"}]};
quizData.glord = {"title": "广论次第专题", "questions": [{"stem": "广论卷一说修行的所缘境「数量次第，先须决定」。如果有人今天修这个、明天修那个，随遇所缘就去修，广论怎么看？", "options": ["A. 这样很好——说明心很灵活，能适应不同的所缘", "B. 只要有上师指导就可以随意更换所缘", "C. 这是修行的最大障碍——从最初就养成恶习，终生善行悉成过失。必须先决定所修的数量和次第，如所决定不令修余", "D. 初学者可以随便修，到高级阶段才需要固定次第"], "type": "choice", "answer": 2, "explain": "广论卷二明确说：「若从最初令成恶习，则终生善行，悉成过失。故于所修诸所缘境，数量次第，先须决定。次应发起猛利誓愿，谓如所定，不令修余。」这说明修行如建楼——先有图纸（数量次第决定），再施工（如所决定修习），不能盖到哪算哪。"}, {"stem": "广论卷二说闻、思、修三慧有「次第生起之理」。有人认为可以直接从修开始，不需要多闻多思。广论如何破斥？", "options": ["A. 广论同意——修最重要，闻思只是为不懂的人准备的", "B. 只有禅宗才强调不立文字，藏传佛教不这么认为", "C. 闻思修可以同时进行，没有固定的先后", "D. 广论破斥：「如示跑处另向余跑，则前所说悉无系属」——不按闻→思→修的次第，等于指了东边往西跑，一切开示全部失去关联。串习闻思所决定义虽非修成，然许是修"], "type": "choice", "answer": 3, "explain": "广论引《道炬论》及诸大论典说闻思修有必然的次第：先听闻法义（闻慧），再如理思惟（思慧），最后数数串习（修慧）。如果跳过闻思直接修，「如示跑处另向余跑」——等于教练告诉你跑道在东边你偏往西跑。而且广论说得很清楚：「是二论中所说一切道之次第，皆说为修」——闻思的次第本身就是修。"}, {"stem": "广论卷六说佛陀讲四谛时先说苦谛再说集谛，这违反了「因在前果在后」的正常次第，是因为佛陀讲错了。", "options": ["A. 修行的速度取决于根器——利根人可以跳过下下直接修上上", "B. 下等的法比上等的法更好——因为「下下」能引导「上上」", "C. 修行要循序渐进——先修最低的法（下下），自然会引导到最高的法（上上）", "D. 「下下」和「上上」是不同的法——先修完一个再换下一个"], "type": "choice", "answer": false, "explain": "广论引《瑜伽师地论》说这是「违因果次第而宣说」，但有至大修持扼要——如医生治病：先让病人知病（苦），再寻病因（集），知可治愈（灭），然后服药（道）。如果先说集谛（病因），病人不知自己有病，就不关心病因是什么。「故须如是次第引导学者」——这是教学次第，不是因果次第。"}, {"stem": "广论卷三说「若生下下，可导上上」。这句话揭示了广论修行次第的核心原则。以下哪个理解最准确？", "options": ["A. 修行的速度取决于根器——利根人可以跳过下下直接修上上", "B. 下等的法比上等的法更好——因为「下下」能引导「上上」", "C. 修行要循序渐进——先修最低的法（下下），自然会引导到最高的法（上上）", "D. 「下下」和「上上」是不同的法——先修完一个再换下一个"], "type": "choice", "answer": 2, "explain": "广论卷三引《陀罗尼自在王请问经》「黠慧宝师渐磨摩尼」的比喻——宝石匠打磨宝石不是一下子磨到底，而是逐步用不同工具渐次打磨。修行也是：「若生下下，可导上上，故于自道非为迂缓。」下下法不是与上上法不同的东西——它就是上上法的基础。修下士道不是「修完换一个」，而是「共下士道」——它是上士道的一部分。"}, {"stem": "广论卷八和卷九详细介绍了修菩提心的两种次第——七因果教授和自他相换。关于这两种教授的关系，以下哪个说法正确？", "options": ["A. 七因果教授是显教的修法，自他相换是密教的修法", "B. 两种教授目标相同（生起菩提心），但入手的次第不同——七因果从「知母」入手（感情路线），自他相换从「观察我爱执过患」入手（智慧路线）", "C. 两种教授只能选一种，不能同时修", "D. 自他相换比七因果更高级，是利根人的修法"], "type": "choice", "answer": 1, "explain": "广论同时介绍两种菩提心修法，说明两者都是有效的。七因果（知母→念恩→报恩→慈→悲→增上意乐→菩提心）从感恩心入手，适合感性强的人；自他相换（观察自利过患→他利功德→改换爱执对象）从智慧分析入手，适合理性强的人。两者最终目标完全相同——生起真实菩提心。实际可以配合修习。"}, {"stem": "广论卷十说六度（布施→持戒→忍辱→精进→静虑→般若）的次第是「决定」的——不能调换。为什么必须是这个顺序？", "options": ["A. 因为佛陀这样规定，不需要理由", "B. 这个顺序只是方便记忆，实际上可以任意排列", "C. 因为六度按功德从小到大排列，布施功德最小所以排第一", "D. 因为前前为后后的基础——布施放下财物执着后持戒才容易清净，持戒清净遇到违缘才能忍辱，能忍才能精进不退，精进积累资粮心才能得定，得定后才能发慧。层层递进，不能跳跃"], "type": "choice", "answer": 3, "explain": "广论卷十「兼说次第确定」中引《大乘庄严经论》说六度次第有三个理由：①前前生于后后（前前为后后因）；②前前比后后粗显（容易修的排前面）；③后后比前前微妙（越后面的越精细）。比如布施是「舍心」——连财物都能舍，持戒的「防护心」自然容易生起。如果悭吝心重，连东西都不愿给人，怎么可能护持净戒？"}, {"stem": "广论卷十三说了一个非常重要的修行原则：「复非听闻此法，别修他法，即所修处而求闻思」。这句话的意思是什么？", "options": ["A. 听完之后必须立即修，不能间隔太长时间", "B. 听法和修法是两回事，可以分别进行", "C. 只需要修，不需要听——「即所修处」就是指修行本身", "D. 听什么法就修什么法——闻思修的对象必须一致，不能听的是菩提道次第，修的是另一个法门"], "type": "choice", "answer": 3, "explain": "广论反复破斥「听法是一回事、修法是另一回事」的邪分别。正确的态度是：听什么就思什么，思什么就修什么——闻思修三个阶段针对同一个对象。如果你学的是菩提道次第，修的也应该是菩提道次第的法义。广论说「又不应惟修一分，定应依止初业菩萨所修圆满道之次第」——不能只修一部分，要按完整的次第修。"}, {"stem": "广论卷十六详述九住心的修证次第。从「内住」到「等持」需要经历六个阶段的心理变化。关于这个次第，以下哪个说法正确？", "options": ["A. 只要努力就一定能快速通过九个阶段——关键是精进", "B. 九住心对应六力（听闻→思惟→忆念→正知→精进→串习）和四作意（力励→有间缺→无间缺→无功用）——每个阶段需要的心力不同，必须层层递进", "C. 到了第三住心就不会再有散乱了——后面只是加深定力", "D. 九住心只是理论框架，实修中不需要经历全部九个阶段"], "type": "choice", "answer": 1, "explain": "广论引《声闻地》说九住心是实修的真实次第：①-②内住续住需「力励运转」（听闻力+思惟力）；③-⑦安住到最极寂静是「有间缺运转」（忆念力+正知力——仍有沉掉间断）；⑧专注一趣是「无间缺运转」（精进力——沉掉已断但仍需努力）；⑨等持是「无功用运转」（串习力——不用努力心自安住）。每一步都不可跳过。"}, {"stem": "广论卷十六说：到了第九住心（等持），心能不用努力自然安住，有无分别安乐光明。这时算不算得奢摩他？", "options": ["A. 不算——第九住心如果未得身心轻安，只是「奢摩他随顺」，不是真奢摩他。轻安才是奢摩他成就的标志", "B. 当然算——心能无功用安住就是奢摩他", "C. 算半个——第九住心是奢摩他的入门，得轻安是奢摩他的圆满", "D. 看情况——如果修的是显教就算，修密教就不算"], "type": "choice", "answer": 0, "explain": "广论卷十六明确说：「虽得如是第九住心，若未得轻安，如下所说尚不立为得奢摩他。」第九住心是欲界心一境性，仍属欲界心。只有生起身轻安和心轻安（头顶似重而起是前相），身心调柔堪能如欲而转，才算获得奢摩他。很多人到第九心有无分别安乐就以为开悟或得定——宗喀巴大师反复破斥这种误解。"}, {"stem": "广论卷十四到卷二十四构建了一个完整的「止观修证次第」。以下哪个排列是正确的？", "options": ["A. 得正见→修止→修观→止观双运→成佛", "B. 先修观后修止——先理解空性再安定下来", "C. 集六资粮→修九住心→得轻安（成止）→得正见→以观慧思择引生轻安（成观）→止观交替平衡→止观双运", "D. 止观同时修——不存在先后的次第"], "type": "choice", "answer": 2, "explain": "广论的止观修证次第极为严密：①先集修止资粮（六种——住随顺处、少欲、知足、断杂务、清净尸罗、断贪等寻思）；②依所缘修九住心；③得轻安成奢摩他；④以正理决择无我正见；⑤在止的基础上以观察慧思择，由观察力引生新轻安成毗钵舍那；⑥止观交替修习令势力均等；⑦最终止观自然双运。每一步都有明确的标准和检验方法，不能自欺。"}, {"stem": "广论卷二十四说：先修止后修观的次第，是对所有修行人而言的——不管你已经修到什么程度，都必须先得止再修观。", "options": ["A. 修一段时间观，然后修一段时间止，交替进行，令两者势力均等", "B. 先修止到圆满，再修观到圆满，最后自然双运", "C. 止和观不可能同时修，只能选一个", "D. 修观时如果定力退了，就重新修止，修好了再继续修观"], "type": "choice", "answer": false, "explain": "广论卷十四说「又此止观次第，是就新生之时应如是修。若先已生，则无决定次第，亦可先修毗钵舍那，次修奢摩他。」新生者（从来没有得过止观的人）必须先止后观；但如果以前已经修成，就没有固定的次第——可以先观后止。广论还引《集论》说有「先得胜观而未得止」的情况，那是指得更高层次的止（初禅以上）。"}, {"stem": "广论卷二十四描述止观双运的修法：「纯修观察，前止失坏复新修，则无寂止，由无止故观亦不生」。这说明止和观在实修中应该怎么配合？", "options": ["A. 修一段时间观，然后修一段时间止，交替进行，令两者势力均等", "B. 先修止到圆满，再修观到圆满，最后自然双运", "C. 止和观不可能同时修，只能选一个", "D. 修观时如果定力退了，就重新修止，修好了再继续修观"], "type": "choice", "answer": 0, "explain": "广论说：「故须双修前安住止及新修观，谓修观后即于彼义而修寂止。」意思是：修观慧思择无我义之后，紧接着缘同一个无我义修止（安住）。如果只修观不修止，之前得到的止就会退失；止退了，观也无法深入。所以两者必须交替——观一段然后止一段，令止观二分平均。最终不需要刻意交替，自然止观双运。"}, {"stem": "广论卷七引朴穷瓦大善知识的修行经验说「著道次第」。他专修十二缘起，但用了三种不同的视角来修。以下哪个描述正确？", "options": ["A. 他先修十二缘起的理论，再修实修，最后修证果", "B. 他以同一部十二缘起，对应三士道修三次：思恶趣流转还灭（下士）→思善趣流转还灭（中士）→推己及人思一切众生流转还灭生慈悲菩提心（上士）", "C. 他分别修了声闻、缘觉、菩萨三种不同的十二缘起法", "D. 他只修流转门，不修还灭门——因为流转门才是众生现状"], "type": "choice", "answer": 1, "explain": "广论卷七原文：「此复是说，思惟恶趣十二有支流转还灭，为下士类。次进思惟二善趣中十二有支流转还灭，为中士类。如是比度自心，推想曾经为母有情，亦皆由其十二支门漂流生死，发生慈悲，为利彼故，愿当成佛，学习佛道，为大士类。」同一部十二缘起法，因为观察的视角和心量不同，就变成了下士道、中士道、上士道的修行。这就是「次第」的妙用——不是换法门，而是提升视角。"}, {"stem": "综合广论全24卷，「讲说次第」和「修行次第」之间有什么关系？", "options": ["A. 两者有时一致有时不一致——如四谛讲说次第是苦集灭道（教学方便），修行次第则是知苦→断集→证灭→修道。讲说是为了引导修行，修行要依据讲说但不是机械地复制", "B. 两者完全相同——怎么讲就怎么修", "C. 讲说次第比修行次第重要——讲对了自然就修对了", "D. 修行次第比讲说次第重要——实修才管用，怎么讲无所谓"], "type": "choice", "answer": 0, "explain": "广论最精妙之处就是区分了「教说次第」和「修证次第」并在两者之间建立桥梁。比如：①四谛讲说是苦→集→灭→道（违因果次第，教学方便），修行是知苦→断集→证灭→修道；②六度讲说按布施→般若排列（前前生后后），修行时则是同时修但以前前为基础；③九住心讲说是1→9递进，修行时每一步都要反复串习不进则退。讲说是地图，修行是走路——地图要准确，走路要按图。"}]};
quizData.hama = {"title": "蛤蟆先生去看心理医生", "questions": [{"stem": "鼹鼠去找蛤蟆串门，推开蛤蟆庄园的后门，看到了有史以来最悲伤的蛤蟆。曾经衣着光鲜、神采奕奕的他，现在板球毛衣上沾满油渍，灯笼裤松松垮垮。鼹鼠的第一反应不是「他变懒了」，而是意识到了一件更深层的事。是什么？", "options": ["A. 蛤蟆最近社交活动太多，可能是刚参加完什么活动还没来得及换衣服，这种爱热闹的人恢复起来很快，过几天自己就调整好了", "B. 蛤蟆庄园维护成本太高，蛤蟆最近可能经营上遇到了困难，连请佣人的钱都拿不出来了，生活品质下降才显得邋遢", "C. 蛤蟆是在通过刻意降低自己的外在形象来获取朋友们的关注和同情，这在心理学上叫「继发性获益」，很多人会下意识用示弱来操控他人的关心", "D. 蛤蟆的精神和内心经历了重大变化——外表的邋遢不是懒，而是抑郁的典型外在信号：当一个人连最基本的自我照料都放弃时，意味着内在系统已经崩溃"], "type": "choice", "answer": 3, "explain": "正确答案是D。鼹鼠看到蛤蟆「板球毛衣上沾满油渍，灯笼裤松松垮垮」，这不是社交疲劳或经济问题，而是抑郁的经典外在信号——当一个人连洗澡、梳洗、换衣服都放弃时，这是内在心理系统全面崩塌的警报。A错在把抑郁误判为短暂的社交疲劳，蛤蟆不是「玩累了」，而是根本失去了做任何事的动力。B错在把问题归结为经济原因，蛤蟆家族富裕，庄园是祖传的，不存在经营困难。C错在把抑郁行为解释为有目的的策略（继发性获益），但抑郁患者的邋遢是无意识的、被动的，不是刻意为之的手段。书中鼹鼠的第一反应就是「他精神上出了问题」，这正是心理咨询最早的警觉信号。"}, {"stem": "獾、河鼠和鼹鼠商量怎么帮蛤蟆。獾的态度是「我早就预料到了」，然后立刻主导了援助计划。河鼠提出了看心理咨询师的念头。他们决定不管蛤蟆愿不愿意都要帮他。这个决定本身有什么问题？", "options": ["A. 他们替蛤蟆做了决定——「不管他愿不愿意都要帮他」，但心理咨询必须建立在当事人自愿的基础上才能产生真正的改变", "B. 没有问题，朋友遇到困难时就应该果断出手帮忙，等蛤蟆自己想通不知道要拖到什么时候，当机立断才是真正的关心", "C. 问题在于河鼠的建议方向不对——心理问题往往有生理基础，应该先带蛤蟆去看医生做全面检查，排除生理原因再考虑心理咨询", "D. 问题在于让獾来主导是不合适的，獾性格强势好为人师，这种人格特质会压制蛤蟆的表达。如果让更温和的河鼠来主导整个援助计划效果会好很多"], "type": "choice", "answer": 0, "explain": "正确答案是A。朋友们「不管蛤蟆愿不愿意都要帮他」，这是好心办坏事的典型。苍鹭后来在咨询室里明确指出了这一点：蛤蟆来见咨询师是「为了让朋友们高兴」，不是为自己而来的。心理咨询的第一个前提就是自愿——当事人必须是自己想做这件事，而不是为了取悦别人。B错在混淆了「物质帮助」和「心理帮助」的本质区别：借钱、送饭可以替对方决定，但心理改变必须由当事人自己发起。C错在把躯体检查和心理咨询对立起来，两者并不矛盾，且蛤蟆的朋友们不是医学判断出了问题而是「替人做主」出了问题。D错在把问题归结为獾的性格而非基本原则——无论谁主导，只要「替蛤蟆决定」这个前提不变，问题就仍然存在。书中的关键转折点就是蛤蟆自己说出「我愿意跟你合作」的那一刻。"}, {"stem": "蛤蟆的朋友们带他去见苍鹭，獾说「费用我来处理」。苍鹭对此表示完全没问题，立刻开始了咨询。", "options": ["A. 心理咨询是一项专业服务，来访者自己付费是建立咨询关系的前提，因为付费行为本身就意味着「我认可这件事的价值，我愿意为改变投资」", "B. 心理咨询的前提是自愿——来访者必须发自内心地愿意参与并担起改变的责任，而不是为了取悦别人或应付差事才坐到咨询室里", "C. 朋友不应该过度干涉他人的心理健康问题，心理问题是个人隐私，即使出于好意也应该保持距离，让本人自行决定是否寻求专业帮助", "D. 心理咨询师作为专业人士有权筛选来访者，如果判断来访者没有诚意或动机不足，就可以依法拒绝提供服务"], "type": "choice", "answer": false, "explain": "本题错误——苍鹭果断拒绝了獾代为付费的提议。他的原话大意是：「如果蛤蟆来这里只是为了让你高兴，那真正的来访者就是你，而不是蛤蟆。如果蛤蟆不是为自己来的，我们的咨询就没有意义。」他甚至提议「今天就到这里，当一次体验」，表示如果蛤蟆准备好了可以再约。苍鹭的态度不是不近人情，而是在设立心理咨询最核心的边界：来访者必须为自己负责，包括为自己的咨询付费。如果连咨询费都是别人出的，蛤蟆就永远是「被安排」的被动者，而不是「我要改变」的主动者。这一场景是全书最关键的转折之一——蛤蟆在思考后终于说「我愿意跟你合作，我自己为咨询负责」，从那一刻起真正的心理咨询才开始。"}, {"stem": "苍鹭对蛤蟆说：「只有当你是为自己而不是为取悦朋友才想咨询的时候，我们才能真正合作。」这句话揭示的心理咨询核心原则是什么？", "options": ["A. 心理咨询是一项专业服务，来访者自己付费是建立咨询关系的前提，因为付费行为本身就意味着「我认可这件事的价值，我愿意为改变投资」", "B. 心理咨询的前提是自愿——来访者必须发自内心地愿意参与并担起改变的责任，而不是为了取悦别人或应付差事才坐到咨询室里", "C. 朋友不应该过度干涉他人的心理健康问题，心理问题是个人隐私，即使出于好意也应该保持距离，让本人自行决定是否寻求专业帮助", "D. 心理咨询师作为专业人士有权筛选来访者，如果判断来访者没有诚意或动机不足，就可以依法拒绝提供服务"], "type": "choice", "answer": 1, "explain": "正确答案是B。苍鹭的核心原则是「自愿」而非「付费」——付费只是自愿的具体体现之一，但不是本质。蛤蟆的转变在于从「他们让我来的」变成「我愿意跟你合作」。A把付费上升到前提地位，但书中苍鹭更关注的是动机而非金钱——即使蛤蟆自己付钱但内心仍然「为了让朋友高兴」，咨询也不会有效。C把「不替人做主」曲解为「不关心」，朋友们关心蛤蟆本身没有错，错的是代替蛤蟆做决定的方式。D把咨询师的职业判断和当事人的自主权混为一谈——苍鹭不是在行使「拒绝权」，而是在等待蛤蟆觉醒。当蛤蟆说「我愿意」的那一刻，苍鹭立刻接受了，这才是关键。"}, {"stem": "蛤蟆第一次坐在苍鹭面前，等着苍鹭开启一场冗长的训诫。但苍鹭只是无声地看着他。沉默越来越长，蛤蟆越来越不舒服，终于忍不住先开口了。苍鹭的沉默是一种什么技巧？", "options": ["A. 苍鹭也是第一次见蛤蟆，一时不知道从哪里切入，沉默只是咨询师掩饰自己紧张和不熟悉来访者背景的自然反应", "B. 苍鹭在等蛤蟆先开口——这是咨询中的经典技巧，咨询师不主动开启话题，把主动权交给来访者，让蛤蟆自己决定从哪开始讲述", "C. 苍鹭在用沉默制造心理压力——通过长时间不说话的压迫感来测试蛤蟆的承受能力，看看他会不会在这种高压环境下暴露出真正的问题", "D. 苍鹭在通过观察蛤蟆的坐姿、眼神、手脚动作等非语言信号来收集临床信息，这是心理咨询中标准的行为观察阶段"], "type": "choice", "answer": 1, "explain": "正确答案是B。苍鹭的沉默不是被动或无意，而是刻意为之的专业技术。书中描写「沉默越来越长，蛤蟆越来越不舒服」，这正是打破蛤蟆习惯性模式的关键——蛤蟆一辈子都在等别人告诉他该做什么、该说什么，苍鹭的沉默第一次把决定权交还给他。A错在低估了苍鹭的专业性——他见过大量来访者，沉默是他的工具而非弱点。C错在把沉默曲解为施压，苍鹭并非要「逼」蛤蟆承认什么，而是创造一个空洞让蛤蟆自己填。D乍听专业但不准确——观察肢体语言是咨询师的日常工作但不需要特意留长时间的沉默段落；苍鹭的沉默核心是「等蛤蟆走第一步」，不是「收集信息」。蛤蟆终于忍不住开口说的第一句话，就是他自己选择的话题，这就是咨询的真正起点。"}, {"stem": "苍鹭问蛤蟆：「你能告诉我，为什么来这儿吗？」蛤蟆说：「我来这儿，是他们让我来的。」苍鹭追问：「那么，谁是我的来访者？是你，还是他们？」这段对话的核心是什么？", "options": ["A. 苍鹭在确认谁付咨询费，因为在心理咨询的行业规范里，付费方就是来访者，这直接决定了合同的签约主体和发票抬头", "B. 苍鹭在评估蛤蟆是否有语言表达障碍——如果蛤蟆连「为什么来这里」都说不清楚，说明可能存在更严重的认知或沟通问题", "C. 苍鹭在挑拨蛤蟆和朋友之间的关系，让蛤蟆觉得朋友们是在逼迫他，这样蛤蟆就会更依赖咨询师而不是朋友们", "D. 苍鹭在让蛤蟆意识到：如果你来是因为「他们让我来的」，那你就是被动参与的——真正的来访者必须是自己想做这件事的人"], "type": "choice", "answer": 3, "explain": "正确答案是D。这是全书最经典的一段对话。蛤蟆说「我来这儿，是他们让我来的」，等于在说「我不是为自己来的」。苍鹭用一个犀利的追问「谁是我的来访者？是你，还是他们？」把问题的核心直接摆在蛤蟆面前——如果你是被「押送」过来的，那心理治疗就不可能发生。A错在把专业边界问题降格为行政事务——苍鹭关心的不是发票抬头而是治疗的根基。B错在把动机问题曲解为能力问题——蛤蟆语言表达没有任何障碍，他只是没想清楚「为什么来」。C是最有迷惑性的错误选项：苍鹭不是在挑拨离间，他没有说朋友们坏话，只是在帮助蛤蟆区分「别人的期待」和「自己的意愿」。咨询结束后蛤蟆和朋友们的关系反而更好了，这说明苍鹭从来没有破坏他们的关系。"}, {"stem": "蛤蟆问苍鹭「你认为我会好起来吗？」苍鹭回答：「如果我不相信每个人都有能力变得更好，我就不会做这份工作了。」苍鹭没有保证「你一定会好」。这个回答体现了什么？", "options": ["A. 苍鹭对蛤蟆的具体情况还不够了解，在缺乏足够临床信息时做出疗效保证是不负责任的，所以只能给出一个模糊的回应", "B. 苍鹭相信每个人有能力变好，但能否真的变好取决于蛤蟆自己的投入和努力——咨询师不能替来访者承诺结果，改变的责任在来访者自己手里", "C. 苍鹭在暗示蛤蟆的情况可能比较严重，不是所有人都能康复的，但他出于职业道德不能直接说破，只能用委婉的方式让蛤蟆做好心理准备", "D. 苍鹭说了一句心理咨询行业常用的套话，类似于医生对病人说「我们会尽力的」，实际上没有实质性承诺，也不是针对蛤蟆个人的判断"], "type": "choice", "answer": 1, "explain": "正确答案是B。苍鹭的回应是非常精准的：他既没有说「我保证你会好」（那是在替蛤蟆承诺），也没有说「你可能好不了」（那是在打击信心）。他说「我相信每个人都有能力变得更好」，把焦点放在「能力」上——蛤蟆有能力，但他用不用这个能力取决于他自己。这个回答同时传递了希望（我相信你能）和边界（但不能替你决定）。A错在把苍鹭的审慎归结为「信息不足」——即使有足够信息，苍鹭也不会替来访者承诺结果，这是原则问题。C是最迷惑的错误选项：苍鹭不是在暗示蛤蟆严重，他是在肯定蛤蟆的能力，方向完全相反。D把深层原则浅化为套话，但苍鹭说这话时非常认真，这是他作为咨询师的核心信念，不是敷衍。"}, {"stem": "苍鹭告诉蛤蟆，咨询的主要目标是由咨询师为来访者找到问题的答案并给出解决方案。", "options": ["A. 像小孩子一样天真烂漫，充满好奇心和创造力——这是成年后依然保持的童趣，是一种值得珍惜的品质", "B. 行为举止像个孩子，比如哭闹、撒娇、不守规矩——这意味着成熟度不够，需要学会控制自己", "C. 体验和再现童年时的感受——悲伤、愤怒、恐惧、快乐——这些情绪不是对当下事件的反应，而是童年情绪记忆被触发后的自动重现", "D. 在成年人的身体里住着一个没长大的孩子，说明这个人缺乏独立性，需要别人像对待小孩一样照顾他"], "type": "choice", "answer": false, "explain": "本题错误——苍鹭从未说过咨询师应该为来访者找答案。相反，他在书中反复强调的核心原则是：「咨询的主要目标是让你能自己找到答案，我会在这个过程中协助你，但只有你自己能做决定。」在苍鹭的咨询哲学中，咨询师的角色是提问者、陪伴者、镜子，而不是答案的提供者。如果咨询师直接给答案，蛤蟆就从一个「听朋友安排」的被动者变成了「听咨询师安排」的被动者——模式没有改变，只是换了个权威人物。真正有效的心理咨询必须让来访者通过自己的思考和尝试来获得洞察，这样的改变才是持久和真实的。蛤蟆在十次咨询中逐渐学会了自己分析自己的情绪和行为模式，这就是「自己找到答案」的过程。"}, {"stem": "苍鹭向蛤蟆介绍了三种自我状态模型。他说蛤蟆目前大多数时候处在「儿童自我状态」中。以下哪个描述最准确地表达了「儿童自我状态」？", "options": ["A. 像小孩子一样天真烂漫，充满好奇心和创造力——这是成年后依然保持的童趣，是一种值得珍惜的品质", "B. 行为举止像个孩子，比如哭闹、撒娇、不守规矩——这意味着成熟度不够，需要学会控制自己", "C. 体验和再现童年时的感受——悲伤、愤怒、恐惧、快乐——这些情绪不是对当下事件的反应，而是童年情绪记忆被触发后的自动重现", "D. 在成年人的身体里住着一个没长大的孩子，说明这个人缺乏独立性，需要别人像对待小孩一样照顾他"], "type": "choice", "answer": 2, "explain": "苍鹭在书中反复强调：儿童自我状态不是行为层面上的「幼稚」或「不成熟」，而是一种情绪重现机制。当当下的某件事触发了你童年时期的情绪记忆（比如上司严厉的语气让你感到像被父亲训斥时的委屈），你就自动进入了儿童状态。A和B错在把儿童状态理解为外在行为（天真/哭闹），D错在把它人格化理解成「没长大的孩子」。核心特征是：你此刻体验的情绪属于过去的某个场景，而非对当下事件的理性反应。蛤蟆在被獾批评时的委屈、在朋友聚会时的依赖，都是儿童状态的体现。"}, {"stem": "苍鹭说蛤蟆身上也有「父母自我状态」。当一个人处在父母自我状态时，最典型的表现是什么？", "options": ["A. 不是在挑剔别人，就是在教育别人——用从父母那里学来的观念和价值观作为唯一标准，评判自己和他人的一切行为", "B. 像父母一样关爱他人，给予温暖和支持——这是成熟人格的表现，能共情和关怀他人", "C. 总是担心自己做得不够好，害怕被惩罚或责骂，像小时候面对父母时的紧张不安", "D. 喜欢照顾人、安排别人的人生，虽然有控制欲但出发点是关心和爱"], "type": "choice", "answer": 0, "explain": "父母自我状态的核心是「复制传统权威模式」。你用父母曾经对待你的方式来对待世界——挑剔、说教、批评、道德审判。苍鹭特别指出蛤蟆的父亲是严厉挑剔型，所以蛤蟆内心的父母状态表现为一个不断审判自己的内在声音（「你不够好」「你令人失望」）。B和D是常见误解：把「父母」这个词等同于关爱和照顾，但书中的「父母自我状态」特指复制父母的评判模式，而非滋养功能。C描述的是「害怕被评判」的状态，这其实是儿童状态（适应型儿童）的典型表现——担心达不到权威的期望，而非主动去评判别人。獾对蛤蟆的说教就是最经典的挑剔型父母状态展示。"}, {"stem": "苍鹭告诉蛤蟆：「只有在成人自我状态里，才能学到关于自我的新知识。」为什么其他两种状态学不到？", "options": ["A. 因为儿童状态和父母状态时大脑的处理能力下降，智商水平不足以应对复杂的新信息", "B. 三种状态其实都能学到新东西，只是成人状态效率最高，其他两种慢一些", "C. 儿童状态只是在重现童年旧情绪，父母状态只是在重复从父母那里继承的旧观念——两者都在走老路，根本没有「接收新信息」的空间", "D. 因为只有成人状态才愿意接受咨询师的引导，其他两种状态会抗拒外部帮助"], "type": "choice", "answer": 2, "explain": "苍鹭的解释非常精妙：儿童状态时，整个大脑被旧情绪占据——你在重新体验过去的委屈、悲伤或恐惧，根本没有余力去吸收新信息。父母状态时，你在用已有的观念框架去评判一切，目的不是学习而是「证明自己是对的」，同样堵死了学习通道。A错在归因于智商——这不是认知能力的问题，而是注意力全部被情绪和旧观念占据了。B是常见误解，实际上两种状态不是「效率低」，而是根本性的封闭。D也错了，因为成人状态的定义本身就是「理性思考」，而不是因为咨询师的帮助才起作用。蛤蟆在咨询过程中的多次顿悟，都发生在他暂时走出儿童/父母状态、开始用成人状态思考的瞬间。"}, {"stem": "苍鹭用一个比喻来解释为什么人们容易待在儿童或父母状态里，而难以进入成人状态。他说这「就像出演一个我们最喜欢、最了解的角色，台词和动作都烂熟于心」。他的意思是：", "options": ["A. 人生如戏，每个人都在扮演不同的社会角色，所谓真实的自我不过是一种幻觉", "B. 人在儿童/父母状态里时，行为模式是高度自动化的——就像背熟了的台词、练熟了的动作，遇到触发场景时不经大脑就自动演出来了", "C. 人应该像优秀演员一样，在不同场合灵活切换不同的状态，这样才能适应复杂的社会生活", "D. 儿童和父母状态本质上是一种「自我欺骗」——假装自己是孩子或家长，只有成人状态才是真实的自我"], "type": "choice", "answer": 1, "explain": "苍鹭这个比喻是全书最有洞见的表达之一。他说人在儿童或父母状态时，就像演员演自己最熟悉的角色——台词背得滚瓜烂熟，动作早已形成肌肉记忆，完全不需要思考。蛤蟆被批评时自动委屈（儿童状态），就像条件反射一样；獾看到「不达标」就自动训斥（父母状态），也是烂熟于心的剧本。A把比喻极端化了——苍鹭不是说「人生都是演戏」，而是说「自动模式像演戏」。C曲解为「应该多尝试」，但苍鹭说的是自动模式的危险性，不是灵活性。D错误地将儿童/父母状态贬低为「伪装」——它们也是自我的一部分，只是限制了成长。苍鹭强调：进入成人状态需要「艰辛的努力和刻意的思考」，这恰恰说明打破自动模式有多困难——你需要有意识地停下「演出」，改用理性面对当下。"}, {"stem": "苍鹭说了一句让蛤蟆非常震惊的话：「没有人能『让』我们产生什么感受，除非他们用蛮力胁迫你。说到底，是我们『选择』了自己的感受。」蛤蟆的反应是「没有一个正常人会选择去感受悲伤」。苍鹭如何解释这个矛盾？", "options": ["A. 他承认自己说错了——人的感受确实是由外界事件直接引发的，所谓「选择」只是一个比喻", "B. 他认为蛤蟆其实是在清醒、有意识的情况下主动选择了痛苦，只是出于某种原因不愿意承认这一点", "C. 这些「选择」发生在无意识层面，更像条件反射——过往经历在我们身上刻下了「特定情境→特定情绪」的自动反应通路", "D. 他认为感受和选择是完全独立的两个系统——感受是生理反应，选择是认知判断，两者互不影响"], "type": "choice", "answer": 2, "explain": "苍鹭用两个经典比喻来解释这个看似矛盾的说法：①巴甫洛夫的狗——狗听到铃声就流口水，因为铃声和喂食被关联了无数次，狗无法控制这个反应；②膝盖反射——医生敲你膝盖，脚就自动弹起来，你根本没法阻止。这两个比喻的共同点是：反应是自动的、不经思考的，但又是你「自己的」反应（不是别人强加的）。苍鹭说的「选择」正是这个意思——蛤蟆被批评时感到委屈，不是因为他当下决定「我要委屈」，而是童年时父亲的严厉批评在他身上刻下了一条「被批评=我不好=委屈」的神经通路。这不是清醒的决策，却确实是「他的」反应模式。A错在认为苍鹭反悔了——他从未收回这个说法。B错在混淆了「无意识反应模式」和「清醒蓄意选择」——蛤蟆不是在清醒地想「我要痛苦」，而是自动陷入了旧的应激模式。D错在否认了二者的关联——苍鹭的核心观点正是建立在这个关联之上。苍鹭用「选择」这个词的真正用意不是怪罪，而是赋权：既然是「你的」反应模式（而非外力强行塞给你的），那你就有能力通过觉察它、理解它来最终改变它。这就是全书最重要的转折点——从「是别人害我变成这样的」到「我可以选择不同的反应方式」。"}, {"stem": "苍鹭问蛤蟆：「你还要为自己的不快乐责怪别人多久？」这句话让蛤蟆很愤怒。苍鹭建议用什么替代责怪？", "options": ["A. 原谅那些伤害过你的人——只有放下怨恨、与过去和解，你才能真正获得内心的平静", "B. 为自己的行为和情绪负责——承认你的感受和反应是「你的」，这样你才拥有改变它们的力量", "C. 接受现实——有些事情确实无法改变，学会与不完美的过去共处才是成熟的标志", "D. 换个角度看问题——把责怪的对象从具体的人转向更大的力量，比如不幸的童年、不公的社会"], "type": "choice", "answer": 1, "explain": "这是全书最核心的转折之一。苍鹭画出了一个关键的十字路口：一条路通向「责怪」——继续把问题归因于父母、童年、环境，这是一条不费力的路，但代价是放弃改变的可能（「都是别人害的=我无能为力」）。另一条路通向「负责」——承认自己的情绪反应模式是属于「你的」，一旦承认这一点，你就获得了改变它的钥匙。A是常见的「鸡汤式解答」——原谅听起来很美，但苍鹭从不要求蛤蟆原谅父母，他要求的是觉察，不是和解。C听起来成熟理性，实际上是一种逃避——「无法改变」的潜台词是「我放弃努力」。D换了个责怪对象但没有改变责怪模式本身。苍鹭的「负责」不是道德说教，而是实用主义的：责怪别人=把主动权交给别人，为自己负责=把主动权拿回自己手里。蛤蟆后来的每一步成长，都始于这个从责怪到负责的转变。"}, {"stem": "将每种自我状态与其核心特征配对。", "options": ["A. 反抗——他变得越来越叛逆，故意跟父亲对着干，用对抗来保护自己的尊严和独立", "B. 竞争——他拼命学习、努力工作，试图用成就来证明自己比父亲更优秀", "C. 冷漠——他学会了屏蔽父母的评价，不再在乎他们怎么想，把注意力放在外面的世界", "D. 顺从和讨好——他学会了察言观色、看大人脸色行事，用取悦别人来换取一点点安全感和认可"], "type": "choice", "answer": true, "explain": "苍鹭反复强调这三种状态没有绝对的优劣——它们各有生存价值。儿童状态让我们能体验纯粹的快乐和亲密（比如与朋友尽情欢笑时的那种天真），父母状态让我们能传承道德和规范（比如教育孩子时必要的权威感）。但关键在于：这两种状态都无法产生「新的学习」——儿童状态只能重现旧日的情绪记忆，父母状态只能复读从父母那里继承的旧观念。只有成人状态允许我们理性地评估当下、接收新信息、做出有意识的选择。蛤蟆在咨询中的成长路径就是：从几乎完全被儿童/父母状态主导（委屈/自责），到逐渐能够短暂进入成人状态（理性审视自己的行为模式），再到最终能够主动选择进入成人状态来应对生活。"}, {"stem": "苍鹭说：「没人能强迫别人进入他们的成人状态。你只能鼓励他们，但只有你自己能决定要怎么做。」", "options": ["A. 反抗——他变得越来越叛逆，故意跟父亲对着干，用对抗来保护自己的尊严和独立", "B. 竞争——他拼命学习、努力工作，试图用成就来证明自己比父亲更优秀", "C. 冷漠——他学会了屏蔽父母的评价，不再在乎他们怎么想，把注意力放在外面的世界", "D. 顺从和讨好——他学会了察言观色、看大人脸色行事，用取悦别人来换取一点点安全感和认可"], "type": "choice", "answer": true, "explain": "苍鹭这句话道出了成人状态的根本特征：它只能由内而外地被「选择」，不能被外力强加。咨询师可以做的全部事情——提问、引导、共情、提供模型——都只是「创造条件」，真正跨入成人状态那一步必须由蛤蟆自己迈出。这就是为什么整本书中苍鹭从不直接告诉蛤蟆「你应该怎么做」，而是反复把问题抛回去：「你怎么看？」「你感觉怎么样？」「你觉得呢？」每一次蛤蟆自己回答这些问题，都是在练习进入成人状态。这也是为什么心理咨询不是「给你建议」——如果咨询师替你做决定，那就把你推回了儿童状态（依赖权威），而不是帮你进入成人状态（自己做判断）。"}, {"stem": "苍鹭让蛤蟆回忆童年。蛤蟆说父亲「很严厉，总对我不满意，我从没成为他希望看到的我」。母亲「慈爱但绝不敢当着父亲的面抱我」。蛤蟆从小养成的应对方式是什么？", "options": ["A. 反抗——他变得越来越叛逆，故意跟父亲对着干，用对抗来保护自己的尊严和独立", "B. 竞争——他拼命学习、努力工作，试图用成就来证明自己比父亲更优秀", "C. 冷漠——他学会了屏蔽父母的评价，不再在乎他们怎么想，把注意力放在外面的世界", "D. 顺从和讨好——他学会了察言观色、看大人脸色行事，用取悦别人来换取一点点安全感和认可"], "type": "choice", "answer": 3, "explain": "蛤蟆发展出了典型的「适应型儿童」模式：顺从、讨好、依赖权威。在父亲严厉挑剔、母亲不敢表达温情的家庭环境中，小蛤蟆很快发现了一个生存法则——只有听话、取悦大人才有可能换来一点点认可，而任何反抗都会招来更严厉的惩罚。这套模式不会随着长大自动消失，它会延续到成年——蛤蟆对獾的唯唯诺诺、对朋友聚会时拼命讨好大家的滑稽表演，本质上都是童年应对策略的重演。A和C都是孩子面对严厉父母的可能反应，但蛤蟆的性格偏偏走了顺从路线（这也是书中最让人心疼的地方——他没有选择反抗，而是选择了「把自己变小」）。B是另一种常见应对方式，但蛤蟆的父亲是那种「永远不满意」的类型，蛤蟆无论多努力都达不到标准，所以他放弃了竞争，转为讨好。"}, {"stem": "苍鹭问蛤蟆：愤怒的时候你会怎么做？蛤蟆发现自己竟然回答不上来。他说「我好像不会生气」。一个在严厉家庭中长大的孩子「不会生气」，实际上是怎么回事？", "options": ["A. 他天生脾气好，属于那种乐观温和的性格，确实不容易被激怒或生气", "B. 他的愤怒从未被允许表达，所以被深深压抑到了意识层面以下——不是没有愤怒，而是从小就学会了「不敢愤怒」", "C. 他的生活优渥富裕，从小到大确实没遇到过什么值得真正生气的事情", "D. 他已经通过自我反思和情绪管理学会了控制愤怒，这是一种成熟的体现"], "type": "choice", "answer": 1, "explain": "蛤蟆「不会生气」的真相令人心酸：他不是没有愤怒，而是在童年时就学会了一个残酷的道理——在这个家里，表达愤怒会让情况更糟。父亲会加倍严厉，母亲会更加退缩。于是他发展出了一套生存策略：把愤怒压到意识的深处，用讨好代替抗议，用自责代替指责别人。但被压抑的愤怒不会凭空消失——它会改头换面，变成抑郁（对自己的愤怒）、焦虑（对失控的恐惧）、身体症状（不明原因的疼痛）。苍鹭在书中后来专门讲了儿童表达愤怒的多种方式（撒泼、怄气、任性、郁闷），蛤蟆用的就是最隐蔽的那种——把愤怒转向自己。A和C都是常见但错误的理解——「天生脾气好」忽略了蛤蟆的抑郁症状，「生活优渥」更是误解了愤怒的本质（愤怒与物质条件无关，与关系模式有关）。D把压抑包装成「成熟的情绪管理」，但真正的成熟不是压抑愤怒，而是能在成人状态下觉察并健康地表达它。"}, {"stem": "獾来到蛤蟆庄园，直接要求蛤蟆辞去校董的职位，让獾来接任。獾说话的语气像极了蛤蟆的父亲。蛤蟆当时的内心反应是什么？", "options": ["A. 愤怒——他当场就爆发了，觉得獾欺人太甚，差点把獾从庄园里赶出去", "B. 无所谓——他本来就对校董职位没什么兴趣，正想找个机会辞掉，獾的提议正中下怀", "C. 冷静——他以成人状态理智地分析了獾的提议，权衡了利弊后做出了决定", "D. 习惯性顺从——他的内心在抗拒，但嘴上差点就答应了，因为獾强势的语气像极了父亲，瞬间触发了他的适应型儿童状态"], "type": "choice", "answer": 3, "explain": "獾的到来是全书最精彩的情节之一——它完美展示了「触发-反应」的自动化模式。獾说话的语气、态度、用词，都与蛤蟆的父亲如出一辙：居高临下、不容置疑、认为「我知道什么对你最好」。这种相似性瞬间触发了蛤蟆的适应型儿童状态——他内心在强烈抗拒（「我不想辞职」），但身体和语言系统已经自动准备投降。这是适应型儿童最令人心痛的特征：内心不赞同，但行为上依然讨好和服从。A错在蛤蟆的性格并非反抗型——他的童年训练让他不会对权威发火。B错在蛤蟆实际上很在乎校董职位，后面他对朋友说自己「从不觉得是打杂」。C错在他当时根本没有条件做「理性分析」——他被獾的气势压得完全进入了儿童状态，大脑一片空白，根本无法启动成人状态。这个场景也完美呼应了为什么苍鹭说「进入成人状态需要刻意的努力」——在强触发面前，自动模式总是抢先一步。"}, {"stem": "苍鹭指出蛤蟆和獾之间存在一种「隐密共谋」的关系。这个概念的意思是：", "options": ["A. 他们私下里串通好了，故意在朋友面前演戏来维持某种社交形象", "B. 他们在秘密策划一件事情，不想让圈子里的其他人知道", "C. 獾扮演挑剔的父母角色，蛤蟆配合扮演顺从的孩子——双方都无意识地维持着这种互动模式，甚至从中获得了某种隐密的安全感", "D. 他们的关系表面上是朋友，实际上是对手，各自在暗中较劲"], "type": "choice", "answer": 2, "explain": "「隐密共谋」（secret conspiracy）是苍鹭提出的一个极具洞察力的概念。它指的是两个人之间无意识维持的互动模式：一方自动扮演权威角色（獾→挑剔型父母），另一方自动配合扮演弱者（蛤蟆→适应型儿童）。双方都不是故意的——獾并不觉得自己在欺负人（他真心认为自己是为蛤蟆好），蛤蟆也没有意识到自己在配合这个剧本。但每次互动都在加固这个循环：獾越强势，蛤蟆越顺从；蛤蟆越顺从，獾越觉得自己有权「管理」蛤蟆。A和B把「共谋」按字面理解成了有意识的秘密串通，完全误解了苍鹭的意思——这不是演戏也不是搞阴谋，「共谋」的精妙之处恰恰在于双方都无意识。D把关系理解为竞争对抗，但隐密共谋不是对抗——它恰恰是一种「互补」的配合模式，双方都在这个模式中找到了各自熟悉的角色和虚假的安全感。打破共谋的关键不在獾（他「演得正起劲」），而在于蛤蟆——只要蛤蟆不再用顺从配合，这个剧本就演不下去了。"}, {"stem": "蛤蟆告诉苍鹭，獾要求他辞职时，他最终做出了一个决定：不辞职，而是写便条告诉獾「不会辞职，如果獾想当可以到九月重选时毛遂自荐」。朋友们听了说他「赢了」。这个决定为什么重要？", "options": ["A. 因为他打败了獾，在朋友面前证明了自己比獾更聪明、更有能力", "B. 因为他终于学会了对别人说「不」，这是他第一次勇敢地维护自己的边界", "C. 因为他学会了用更高级的人际策略——表面答应但背后搞小动作——来对付獾", "D. 因为他第一次没有完全顺从也没有失控爆发——他在尝试用成人状态来应对权威，找到了第三条路"], "type": "choice", "answer": 3, "explain": "这个决定标志着蛤蟆心理成长的一个重要里程碑。他没有像适应型儿童那样屈服（「好吧獾，你说得对，我辞职」——这是过去的他会做的），也没有像叛逆少年那样情绪爆发（「你给我滚出去！」——这是另一种形式的儿童状态）。他找到了一条前所未有的第三条路：理性地拒绝，同时给出建设性的替代方案（「九月重选时你可以毛遂自荐」）。A把这件事理解成了「战胜獾」——但蛤蟆的目标不是打败谁，而是走出顺从模式。B的「说不」是对的但不够精准——关键在于他是用成人状态的方式（理性、不攻击、有替代方案）说的「不」，而不是用叛逆型儿童的方式（愤怒、对抗、破坏关系）。C完全误解了蛤蟆的做法——他写便条是公开透明的，不是什么阴谋手段。这个决定的真正意义在于：蛤蟆第一次在权威面前站住了，同时保持了理性和尊严，这就是成人状态的开始。"}, {"stem": "苍鹭认为蛤蟆的童年经历和他的抑郁之间是简单的因果关系——因为父母不好，所以蛤蟆抑郁了。", "options": ["A. 伴侣说了不中听的话，你不直接沟通，而是好几天不理对方、不说话、用冷战来表达不满", "B. 在会议上被领导当众批评后，回家把怒气转移给家人，对家人大吼大叫", "C. 被同事冒犯后当场爆发，拍桌子摔东西，用最激烈的方式表达愤怒", "D. 被误解时不辩解，而是在社交媒体上发含沙射影的动态，希望对方看到后主动来道歉"], "type": "choice", "answer": false, "explain": "苍鹭在整个咨询过程中从未把蛤蟆的抑郁简单归因为「父母不好→所以抑郁」。他帮蛤蟆理解童年的真正目的不是追责，而是让蛤蟆看到自己的行为模式（顺从、讨好、压抑愤
